<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPEED — 重力圏脱出</title>
<style>
  html, body { margin: 0; height: 100%; background: #04050b; overflow: hidden; color: #e6ecff;
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; user-select: none; }
  canvas#game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: crosshair; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  .screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(3,5,14,0.72); backdrop-filter: blur(3px); pointer-events: auto; }
  .panel { background: linear-gradient(180deg, #121a33, #0b1022); border: 1px solid #2a3a6a; border-radius: 14px;
    padding: 24px 28px; min-width: 320px; max-width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
    overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
  .panel h1 { margin: 0 0 4px; font-size: 30px; letter-spacing: 0.04em; }
  .panel h2 { margin: 18px 0 8px; font-size: 15px; color: #8fa3c8; font-weight: 600; }
  .sub { color: #8fa3c8; font-size: 13px; margin-bottom: 14px; }
  .stats { display: grid; grid-template-columns: auto auto; gap: 6px 18px; font-family: ui-monospace, Menlo, monospace; font-size: 14px; }
  .stats div:nth-child(odd) { color: #8fa3c8; }
  .btns { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  button { font: inherit; font-size: 15px; padding: 10px 18px; border-radius: 9px; border: 1px solid #3b5bb5;
    background: #1d2c5c; color: #e6ecff; cursor: pointer; }
  button:hover { background: #2a3f80; }
  button.primary { background: #2f6bff; border-color: #5d8bff; font-weight: 700; }
  button.primary:hover { background: #4a7dff; }
  button:disabled { opacity: 0.4; cursor: default; }
  .win { color: #ffd24a; } .lose { color: #ff6b5a; }
  .cards { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; }
  .card { border: 1px solid #2a3a6a; border-radius: 10px; padding: 12px 14px; background: rgba(255,255,255,0.03); min-height: 110px; }
  .card .tag { font-size: 11px; color: #8fa3c8; margin-bottom: 6px; }
  .card .name { font-size: 18px; font-weight: 700; }
  .card .rar { font-size: 12px; margin: 2px 0 8px; font-weight: 700; }
  .card .desc { font-size: 13px; color: #cdd6f0; line-height: 1.5; }
  .card.empty { display: flex; align-items: center; justify-content: center; color: #5b6b94; }
  .card.new { border-width: 2px; box-shadow: 0 0 24px rgba(120,160,255,0.15); }
  .arrowcol { display: flex; align-items: center; color: #8fa3c8; font-size: 22px; }
  .loadout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 16px; font-size: 12px; }
  .loadout div { border: 1px solid #1f2b52; border-radius: 6px; padding: 5px 8px; color: #8fa3c8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .loadout div.hl { border-color: #5d8bff; color: #e6ecff; }
  .src { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #1d2c5c; color: #b8c6ea; margin-bottom: 8px; }
  @media (max-width: 560px) { .cards { grid-template-columns: 1fr; } .arrowcol { justify-content: center; transform: rotate(90deg); } .loadout { grid-template-columns: repeat(2, 1fr); } }
  kbd { font-family: ui-monospace, Menlo, monospace; font-size: 11px; border: 1px solid #3b4a7a; border-radius: 4px; padding: 1px 5px; color: #b8c6ea; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<!--BUNDLE-->
</body>
</html>
