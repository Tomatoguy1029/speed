const WEAPON_DEFS = Object.fromEntries(WEAPONS.map((w) => [w.id, w]));

function weaponDef(id) {
  return WEAPON_DEFS[id];
}

function weaponCount(game) {
  return Object.values(game.weapons).filter((lv) => lv > 0).length;
}

const wdmg = (game, base) => base * game.stats.atkMult * CONFIG.atkScale * (game.stats.burstPower || 1);

// Nearest live enemies to (x, y) within range, closest first.
function nearestEnemies(game, x, y, range, n, skip) {
  const found = [];
  queryGrid(game.grid, x - range - MAX_ENEMY_R, y - range - MAX_ENEMY_R, x + range + MAX_ENEMY_R, y + range + MAX_ENEMY_R, (e) => {
    if (e.dead || (skip && skip.has(e.id))) return;
    const d = Math.hypot(e.x - x, e.y - y) - e.r;
    if (d <= range) found.push({ e, d });
  });
  found.sort((a, b) => a.d - b.d);
  return found.slice(0, n).map((f) => f.e);
}

function aimAt(game, target) {
  const sh = game.ship;
  if (target) return Math.atan2(target.y - sh.y, target.x - sh.x);
  return Math.atan2(sh.hy, sh.hx);
}

function updateWeapons(game, dt) {
  const busy = game.draw || game.portalDash;
  for (const w of WEAPONS) {
    const lv = game.weapons[w.id] || 0;
    if (!lv || w.id === 'gun') continue;
    const L = w.levels[runWeaponTier(lv) - 1];
    const st = game.wstate[w.id] || (game.wstate[w.id] = { t: 0 });
    if (w.id === 'orbit') { updateOrbit(game, L, st, dt); continue; }
    if (busy) continue;
    st.t += dt;
    if (st.t < (w.interval ?? 1 / CONFIG.gunRate) / (L.rate || 1)) continue;
    if (w.fire(game, L, st) !== false) st.t = 0;
  }
  updateWeaponProjectiles(game, dt);
  for (const f of game.wfx) f.life -= dt;
  if (game.wfx.length) game.wfx = game.wfx.filter((f) => f.life > 0);
}

function fireGun(game, L) {
  const sh = game.ship;
  const base = Math.atan2(sh.hy, sh.hx);
  const dmg = wdmg(game, CONFIG.gunDamage * L.dmg);
  for (let i = 0; i < L.shots; i++) {
    const a = base + (i - (L.shots - 1) / 2) * CONFIG.gunSpread;
    game.fbullets.push({ kind: 'gun', x: sh.x, y: sh.y, vx: Math.cos(a) * CONFIG.gunSpeed + sh.vx, vy: Math.sin(a) * CONFIG.gunSpeed + sh.vy,
      r: 5, dmg, life: CONFIG.gunLife, pierce: false, pierceLeft: L.pierce, hit: new Set(), color: '#ffe46b' });
  }
  game.events.push({ type: 'turret' });
}

function fireMissiles(game, L) {
  const sh = game.ship;
  const targets = nearestEnemies(game, sh.x, sh.y, 750, L.count);
  if (!targets.length) return false;
  for (let i = 0; i < L.count; i++) {
    const t = targets[i % targets.length];
    const a = aimAt(game, t) + (i - (L.count - 1) / 2) * 0.5;
    game.wproj.push({ kind: 'missile', x: sh.x, y: sh.y, vx: Math.cos(a) * 420, vy: Math.sin(a) * 420, target: t, life: 2.5,
      dmg: wdmg(game, 8 * L.dmg), radius: L.radius });
  }
  game.events.push({ type: 'shoot' });
}

function fireNova(game, L) {
  const sh = game.ship;
  explode(game, sh.x, sh.y, L.radius, wdmg(game, 6 * L.dmg), { cause: 'nova', color: '#c995ff', knock: 380, life: 0.5 });
}

function fireArc(game, L) {
  const sh = game.ship;
  const hit = new Set();
  let any = false;
  for (let b = 0; b < L.bolts; b++) {
    let from = { x: sh.x, y: sh.y };
    const pts = [from];
    let next = nearestEnemies(game, sh.x, sh.y, 450, 1, hit)[0];
    for (let k = 0; k < L.chains && next; k++) {
      hit.add(next.id);
      pts.push({ x: next.x, y: next.y });
      damageEnemy(game, next, wdmg(game, 7 * L.dmg), { cause: 'arc', dirX: (next.x - from.x) / (Math.hypot(next.x - from.x, next.y - from.y) || 1), dirY: (next.y - from.y) / (Math.hypot(next.x - from.x, next.y - from.y) || 1), knock: 120 });
      from = next;
      next = nearestEnemies(game, from.x, from.y, L.reach, 1, hit)[0];
    }
    if (pts.length > 1) { any = true; game.wfx.push({ kind: 'bolt', pts, life: 0.18, max: 0.18 }); }
  }
  if (!any) return false;
  game.events.push({ type: 'shoot' });
}

function fireLaser(game, L) {
  const sh = game.ship;
  const targets = nearestEnemies(game, sh.x, sh.y, L.length, L.beams);
  if (!targets.length) return false;
  const dmg = wdmg(game, 10 * L.dmg);
  for (let i = 0; i < L.beams; i++) {
    const a = aimAt(game, targets[i % targets.length]) + (i >= targets.length ? 0.4 * i : 0);
    const ux = Math.cos(a), uy = Math.sin(a);
    const x1 = sh.x + ux * L.length, y1 = sh.y + uy * L.length, half = L.width / 2;
    queryGrid(game.grid, Math.min(sh.x, x1) - half - MAX_ENEMY_R, Math.min(sh.y, y1) - half - MAX_ENEMY_R,
      Math.max(sh.x, x1) + half + MAX_ENEMY_R, Math.max(sh.y, y1) + half + MAX_ENEMY_R, (e) => {
        if (e.dead) return;
        const t = Math.max(0, Math.min(L.length, (e.x - sh.x) * ux + (e.y - sh.y) * uy));
        if (Math.hypot(sh.x + ux * t - e.x, sh.y + uy * t - e.y) > e.r + half) return;
        damageEnemy(game, e, dmg, { cause: 'laser', dirX: ux, dirY: uy, knock: 140 });
      });
    game.wfx.push({ kind: 'beam', x0: sh.x, y0: sh.y, x1, y1, width: L.width, life: 0.22, max: 0.22 });
  }
  game.events.push({ type: 'shoot' });
}

function fireDiscs(game, L) {
  const sh = game.ship;
  const t = nearestEnemies(game, sh.x, sh.y, 600, 1)[0];
  const base = aimAt(game, t);
  for (let i = 0; i < L.discs; i++) {
    const a = base + (i - (L.discs - 1) / 2) * 0.45;
    game.wproj.push({ kind: 'disc', x: sh.x, y: sh.y, vx: Math.cos(a) * 950 + sh.vx * 0.5, vy: Math.sin(a) * 950 + sh.vy * 0.5,
      ax: -Math.cos(a) * 1300, ay: -Math.sin(a) * 1300, life: 1.6, r: L.size, dmg: wdmg(game, 6 * L.dmg), hits: new Map(), spin: 0 });
  }
}

// Orbit blades are always out (even during jumps); each enemy can be cut again every 0.4 s.
function updateOrbit(game, L, st, dt) {
  const sh = game.ship;
  st.angle = (st.angle || 0) + L.spin * dt;
  st.hits = st.hits || new Map();
  const dmg = wdmg(game, 4 * L.dmg), R = 14;
  st.blades = [];
  for (let i = 0; i < L.blades; i++) {
    const a = st.angle + i * Math.PI * 2 / L.blades;
    const bx = sh.x + Math.cos(a) * L.dist, by = sh.y + Math.sin(a) * L.dist;
    st.blades.push({ x: bx, y: by, a });
    queryGrid(game.grid, bx - R - MAX_ENEMY_R, by - R - MAX_ENEMY_R, bx + R + MAX_ENEMY_R, by + R + MAX_ENEMY_R, (e) => {
      if (e.dead || (st.hits.get(e.id) || 0) > game.t) return;
      const d = Math.hypot(e.x - bx, e.y - by);
      if (d > e.r + R) return;
      st.hits.set(e.id, game.t + 0.4);
      damageEnemy(game, e, dmg, { cause: 'orbit', dirX: (e.x - sh.x) / (Math.hypot(e.x - sh.x, e.y - sh.y) || 1), dirY: (e.y - sh.y) / (Math.hypot(e.x - sh.x, e.y - sh.y) || 1), knock: 200 });
    });
  }
  if (st.hits.size > 400) for (const [id, until] of st.hits) if (until <= game.t) st.hits.delete(id);
}

function updateWeaponProjectiles(game, dt) {
  const P = game.wproj;
  if (!P.length) return;
  for (const p of P) {
    const x0 = p.x, y0 = p.y;
    p.life -= dt;
    if (p.kind === 'missile') {
      if (!p.target || p.target.dead) p.target = nearestEnemies(game, p.x, p.y, 600, 1)[0] || null;
      const sp = Math.hypot(p.vx, p.vy) || 1;
      let a = Math.atan2(p.vy, p.vx);
      if (p.target) {
        const want = Math.atan2(p.target.y - p.y, p.target.x - p.x);
        const d = Math.atan2(Math.sin(want - a), Math.cos(want - a));
        a += Math.max(-6 * dt, Math.min(6 * dt, d));
      }
      const v = Math.min(900, sp + 900 * dt);
      p.vx = Math.cos(a) * v; p.vy = Math.sin(a) * v;
      p.x += p.vx * dt; p.y += p.vy * dt;
      const bodyHit = clipProjectileToBody(game, p, x0, y0);
      let boom = p.life <= 0 || !!bodyHit;
      if (!boom) {
        queryGrid(game.grid, p.x - 10 - MAX_ENEMY_R, p.y - 10 - MAX_ENEMY_R, p.x + 10 + MAX_ENEMY_R, p.y + 10 + MAX_ENEMY_R, (e) => {
          if (!e.dead && Math.hypot(e.x - p.x, e.y - p.y) < e.r + 10) boom = true;
        });
      }
      if (boom) { explode(game, p.x, p.y, p.radius, p.dmg, { cause: 'missile', color: '#ff9f40', knock: 260, life: 0.3 }); p.life = 0; }
    } else if (p.kind === 'disc') {
      p.vx += p.ax * dt; p.vy += p.ay * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.spin += dt * 14;
      if (clipProjectileToBody(game, p, x0, y0)) { p.life = 0; continue; }
      queryGrid(game.grid, p.x - p.r - MAX_ENEMY_R, p.y - p.r - MAX_ENEMY_R, p.x + p.r + MAX_ENEMY_R, p.y + p.r + MAX_ENEMY_R, (e) => {
        if (e.dead || (p.hits.get(e.id) || 0) > game.t) return;
        if (Math.hypot(e.x - p.x, e.y - p.y) > e.r + p.r) return;
        p.hits.set(e.id, game.t + 0.35);
        const sp = Math.hypot(p.vx, p.vy) || 1;
        damageEnemy(game, e, p.dmg, { cause: 'disc', dirX: p.vx / sp, dirY: p.vy / sp, knock: 180 });
      });
    }
  }
  game.wproj = P.filter((p) => p.life > 0);
}

// ---- rare-weapons.js ----








function beginRareRoute(game) {
  if (game.weapons.bipolar) {
    game.weaponState.bipolar = { origin: { x: game.ship.x, y: game.ship.y } };
  }
}

// Store the whole defeated hull, including large ships; projectile kills cannot reload it.
function captureTowHull(game, e, cause) {
  if (!game.newBuild || !game.weapons.massTow || game.draw?.phase !== 'run' ||
      e.type === 'meteor' || e.type === 'boss' || e.towed ||
      !['ram', 'wave', 'bump', 'sonic', 'killSonic', 'contactWave', 'contactArc', 'critBeam', 'crossBlast'].includes(cause)) return false;
  const st = game.weaponState.massTow || (game.weaponState.massTow = { cargo: [], head: 0, fireT: 0 });
  e.towed = true;
  st.cargo.push({ x: e.x, y: e.y, r: e.r, color: e.T.color, shape: e.T.shape,
    angle: e.facing, sourceId: e.id, ready: false });
  return true;
}

function endRareRoute(game) {
  const origin = game.weaponState.bipolar?.origin, sh = game.ship;
  if (origin && game.weapons.bipolar) {
    game.weaponState.bipolar.origin = null;
    const dx = sh.x - origin.x, dy = sh.y - origin.y, length = Math.hypot(dx, dy);
    if (length > 20) {
      const L = runWeaponStats('bipolar', game.weapons.bipolar);
      const width = CONFIG.bipolarWidth * L.radius, pad = width / 2 + MAX_ENEMY_R;
      const x1 = sh.x, y1 = sh.y, ux = dx / length, uy = dy / length;
      const damage = attackPower(0, game.stats) * CONFIG.bipolarDamage * L.damage;
      queryGrid(game.grid, Math.min(origin.x, x1) - pad, Math.min(origin.y, y1) - pad,
        Math.max(origin.x, x1) + pad, Math.max(origin.y, y1) + pad, e => {
          if (e.dead || game.state !== 'play' || segCircleT(origin.x, origin.y, x1, y1, e.x, e.y, e.r + width / 2) < 0) return;
          damageEnemy(game, e, damage, { cause: 'bipolar', dirX: ux, dirY: uy, knock: 1100 });
        });
      game.wfx.push({ kind: 'beam', color: '#69fff0', x0: origin.x, y0: origin.y, x1, y1,
        width, life: CONFIG.bipolarLife, max: CONFIG.bipolarLife });
      addRing(game, origin.x, origin.y, 65, '#69fff0', CONFIG.bipolarLife);
      addRing(game, x1, y1, 65, '#69fff0', CONFIG.bipolarLife);
    }
  }
  const st = game.weaponState.massTow;
  if (st && game.state === 'play') {
    for (let i = st.head; i < st.cargo.length; i++) st.cargo[i].ready = true;
    st.fireT = 0;
  }
}

function updateRareWeapons(game, dt) {
  if (!game.newBuild || game.state !== 'play') return;
  const st = game.weaponState.massTow;
  if (!st || !game.weapons.massTow) return;
  const sh = game.ship, sp = Math.hypot(sh.vx, sh.vy);
  const ux = sp > 1 ? sh.vx / sp : sh.hx, uy = sp > 1 ? sh.vy / sp : sh.hy;
  const follow = 1 - Math.exp(-CONFIG.massTowFollow * dt);
  // Keep all ammunition. Only the visible front of a large train needs animation.
  for (let j = 0; j < Math.min(CONFIG.massTowVisible, st.cargo.length - st.head); j++) {
    const h = st.cargo[st.head + j], back = 85 + Math.floor(j / 4) * 85 + h.r;
    const side = (j % 4 - 1.5) * 65;
    const tx = sh.x - ux * back - uy * side, ty = sh.y - uy * back + ux * side;
    h.x += (tx - h.x) * follow; h.y += (ty - h.y) * follow;
    h.angle = Math.atan2(uy, ux) + Math.PI;
  }
  st.fireT -= dt;
  const L = runWeaponStats('massTow', game.weapons.massTow), interval = CONFIG.massTowInterval / L.rate;
  while (st.fireT <= 0 && st.cargo[st.head]?.ready) {
    const hull = st.cargo[st.head++], r = hull.r;
    game.fbullets.push({ kind: 'corpse', cause: 'towShot', hull, x: hull.x, y: hull.y,
      vx: ux * (CONFIG.massTowSpeed + sp), vy: uy * (CONFIG.massTowSpeed + sp), r,
      dmg: attackPower(0, game.stats) * CONFIG.massTowDamage * L.damage * Math.max(1, hull.r / 25),
      life: CONFIG.massTowLife, pierce: true, hit: new Set([hull.sourceId]), noCrit: true, knock: 1200, color: hull.color });
    addRing(game, hull.x, hull.y, Math.max(34, r), '#ffbe65', 0.15);
    st.fireT += interval;
  }
  if (!st.cargo[st.head]?.ready) st.fireT = 0;
  if (st.head > 64 || st.head === st.cargo.length) { st.cargo.splice(0, st.head); st.head = 0; }
}

function drawTowHull(ctx, hull, x, y, angle, z, radius = hull.r) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
  ctx.fillStyle = hull.color; ctx.strokeStyle = '#ffc778'; ctx.lineWidth = 2 / z;
  ctx.beginPath();
  if (hull.shape === 'orb') ctx.arc(0, 0, radius, 0, Math.PI * 2);
  else if (hull.shape === 'ship') {
    ctx.moveTo(radius, 0); ctx.lineTo(radius * 0.3, -radius * 0.6); ctx.lineTo(-radius * 0.8, -radius * 0.5);
    ctx.lineTo(-radius, radius * 0.35); ctx.lineTo(radius * 0.2, radius * 0.65);
  } else {
    const n = hull.shape === 'dart' ? 3 : hull.shape === 'diamond' ? 4 : 6;
    for (let i = 0; i < n; i++) {
      const a = i * Math.PI * 2 / n;
      ctx.lineTo(Math.cos(a) * radius, Math.sin(a) * radius * 0.8);
    }
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#3a2d38'; ctx.lineWidth = Math.max(2 / z, radius * 0.06);
  ctx.beginPath(); ctx.moveTo(-radius * 0.6, -radius * 0.4); ctx.lineTo(radius * 0.1, 0);
  ctx.lineTo(-radius * 0.3, radius * 0.5); ctx.stroke();
  ctx.fillStyle = '#ffe1ab'; ctx.fillRect(-4 / z, -4 / z, 8 / z, 8 / z);
  ctx.restore();
}

function debugRareMeteor(game, weapon) {
  if (!game.newBuild || game.state !== 'play') return;
  const sh = game.ship;
  game.field.meteors.push({ kind: 'belt', x: sh.x + sh.hx * 200, y: sh.y + sh.hy * 200,
    vx: 0, vy: 0, size: 55, facing: 0, spin: 0.2, destroyed: false, entity: null, rareWeapon: weapon });
  game.meteorStreamT = 0;
}

// ---- portal-loops.js ----




function portalLoopCross(a, b, c, d) {
  const rx = b.x - a.x, ry = b.y - a.y, sx = d.x - c.x, sy = d.y - c.y;
  const cross = rx * sy - ry * sx;
  if (Math.abs(cross) < 1e-9) return null; // retracing a line encloses no area
  const dx = c.x - a.x, dy = c.y - a.y;
  const t = (dx * sy - dy * sx) / cross, u = (dx * ry - dy * rx) / cross;
  if (t <= 1e-6 || t > 1 + 1e-6 || u < -1e-6 || u > 1 + 1e-6) return null;
  return { x: a.x + rx * t, y: a.y + ry * t, t };
}

function portalLoopArea(points) {
  let twice = 0;
  for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
    twice += points[j].x * points[i].y - points[i].x * points[j].y;
  }
  return Math.abs(twice) / 2;
}

function portalLoopContains(points, x, y) {
  let inside = false;
  for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
    const a = points[j], b = points[i];
    const cross = (b.x - a.x) * (y - a.y) - (b.y - a.y) * (x - a.x);
    if (Math.abs(cross) < 1e-6 && x >= Math.min(a.x, b.x) && x <= Math.max(a.x, b.x)
      && y >= Math.min(a.y, b.y) && y <= Math.max(a.y, b.y)) return true;
    if ((a.y > y) !== (b.y > y) && x < (b.x - a.x) * (y - a.y) / (b.y - a.y) + a.x) inside = !inside;
  }
  return inside;
}

function portalLoopExplode(game, dash, points, area) {
  const effect = game.stats.loopBurst;
  const dmg = attackPower(dash.speed, game.stats) * effect.mult;
  const color = effect.splash ? '#ffb340' : '#c46bff';
  const center = points.reduce((c, p) => ({ x: c.x + p.x / points.length, y: c.y + p.y / points.length }), { x: 0, y: 0 });
  // Snapshot the enclosed targets: secondary blasts cannot recursively create more blasts.
  const targets = game.enemies.filter((e) => !e.dead && portalLoopContains(points, e.x, e.y));
  for (const e of targets) {
    const dx = e.x - center.x, dy = e.y - center.y, dist = Math.hypot(dx, dy) || 1;
    damageEnemy(game, e, dmg, { cause: 'portalLoop', dirX: dx / dist, dirY: dy / dist, knock: 500 });
    addRing(game, e.x, e.y, e.r + 28, color, 0.4);
    burst(game, e.x, e.y, color, 12, 0, 0, 360);
  }
  if (effect.splash) for (const e of targets) explode(game, e.x, e.y, CONFIG.portalLoopSplashRadius,
    dmg * CONFIG.portalLoopSplashDamage, { cause: 'portalLoopSplash', color, knock: 350, life: 0.4 });
  game.fx.loops.push({ points, color, life: 0.6, max: 0.6 });
  addText(game, center.x, center.y, `包囲炸裂 ${targets.length}`, color, 24);
  game.events.push({ type: 'explode', x: center.x, y: center.y, radius: Math.sqrt(area / Math.PI), cause: 'portalLoop', enclosed: targets.length });
}

// Test only traveled movement. Closing across an old segment works before reaching a portal.
function tracePortalLoop(game, dash, x0, y0, x1, y1) {
  if (!game.stats.loopBurst || dash.loopPath.length < 3) return;
  let start = { x: x0, y: y0 }, end = { x: x1, y: y1 };
  let attempts = dash.loopPath.length;
  while (attempts-- > 0) {
    const path = dash.loopPath;
    let first = null;
    for (let i = 0; i < path.length - 1; i++) {
      const hit = portalLoopCross(start, end, path[i], path[i + 1]);
      if (!hit || (first && hit.t >= first.hit.t)) continue;
      const points = [{ x: hit.x, y: hit.y }, ...path.slice(i + 1)];
      const area = portalLoopArea(points);
      if (area >= CONFIG.portalLoopMinArea) first = { hit, points, area, i };
    }
    if (!first) return;
    portalLoopExplode(game, dash, first.points, first.area);
    const hit = { x: first.hit.x, y: first.hit.y };
    // Consume the closed portion while retaining the earlier open prefix and the live tail.
    dash.loopPath = path.slice(0, first.i + 1);
    const last = dash.loopPath[dash.loopPath.length - 1];
    if (Math.hypot(last.x - hit.x, last.y - hit.y) > 1e-6) dash.loopPath.push(hit);
    start = hit;
  }
}

// ---- run-weapons.js ----
// Weapon actions and route traits for the draw prototype. All damage uses attack stats.












function runNearest(game, x, y, range) {
  let found = null, best = range * range;
  queryGrid(game.grid, x - range - MAX_ENEMY_R, y - range - MAX_ENEMY_R, x + range + MAX_ENEMY_R, y + range + MAX_ENEMY_R, e => {
    if (e.dead) return;
    const d = (e.x - x) ** 2 + (e.y - y) ** 2;
    if (d < best) { best = d; found = e; }
  });
  return found;
}

function runShot(game, x, y, angle, damage, options = {}) {
  const speed = options.speed || 1300;
  game.fbullets.push({ kind: 'runShot', x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
    r: options.r || 5, dmg: damage, life: options.life || 0.9, pierce: false,
    pierceLeft: options.pierce || 0, hit: new Set(), color: options.color || '#ffe46b' });
}

function runBeam(game, x, y, ux, uy, length, width, dmg, cause = 'critBeam') {
  const x1 = x + ux * length, y1 = y + uy * length, pad = width / 2 + MAX_ENEMY_R;
  queryGrid(game.grid, Math.min(x, x1) - pad, Math.min(y, y1) - pad, Math.max(x, x1) + pad, Math.max(y, y1) + pad, e => {
    if (e.dead || segCircleT(x, y, x1, y1, e.x, e.y, e.r + width / 2) < 0) return;
    damageEnemy(game, e, dmg, { cause, noCrit: cause === 'critBeam', dirX: ux, dirY: uy, knock: CONFIG.lanceKnock });
  });
  game.wfx.push({ kind: 'beam', x0: x, y0: y, x1, y1, width, life: 0.4, max: 0.4 });
}

function onRunCritical(game, x, y) {
  const n = runTrait(game, 'critBeam');
  if (!n || game.buildClock < game.criticalBeamAt || game.state !== 'play') return;
  game.criticalBeamAt = game.buildClock + 0.15;
  const sh = game.ship, sp = Math.hypot(sh.vx, sh.vy);
  const ux = sp > 1 ? sh.vx / sp : sh.hx, uy = sp > 1 ? sh.vy / sp : sh.hy;
  runBeam(game, x, y, ux, uy, CONFIG.lanceLength + n * CONFIG.lanceLengthPerStack,
    CONFIG.lanceWidth + n * CONFIG.lanceWidthPerStack, attackPower(0, game.stats) * (CONFIG.lanceDamage + n * CONFIG.lanceDamagePerStack));
}

function onRunLaunch(game, full) {
  game.dashKills = 0;
  game.nextKillBoom = Math.max(3, 9 - runTrait(game, 'killSonic'));
  game.runPendingPath = [];
  game.crossUsed = new Set();
  game.runLegSerial = game.runLegSerial || 0;
  const n = runTrait(game, 'fullCharge');
  game.stats.ignoreArmor = !!(full && n);
  game.stats.burstPower = full && n ? 1.25 + n * 0.25 : 1;
  beginRareRoute(game);
  if (game.weapons.sonic) runSonic(game, 'sonic');
}

function onRunKill(game, cause) {
  if (!game.newBuild || !game.dashActive) return;
  game.dashKills++;
  const n = runTrait(game, 'killSonic');
  if (!n || cause === 'killSonic' || game.dashKills < game.nextKillBoom || game.state !== 'play') return;
  // Advance before dealing damage so kills from this blast cannot recursively retrigger it.
  game.nextKillBoom = game.dashKills + Math.max(3, 9 - n);
  runSonic(game, 'killSonic');
}

function runSonic(game, cause) {
  const sh = game.ship, n = runTrait(game, 'killSonic');
  const L = runWeaponStats('sonic', game.weapons.sonic || 1);
  const radius = cause === 'killSonic' ? CONFIG.killSonicRadius + n * CONFIG.killSonicRadiusPerStack : CONFIG.sonicRadius * L.radius;
  const mult = cause === 'killSonic' ? CONFIG.killSonicDamage + n * CONFIG.killSonicDamagePerStack : CONFIG.sonicDamage * L.damage;
  const wave = { x: sh.x, y: sh.y, radius, dmg: attackPower(0, game.stats) * mult, cause,
    life: CONFIG.sonicTravelTime, max: CONFIG.sonicTravelTime, hits: new Set() };
  game.sonicWaves.push(wave);
  if (game.sonicWaves.length > 4) game.sonicWaves.shift();
  sweepRunSonic(game, wave, sh.x, sh.y, sh.x, sh.y);
  addRing(game, sh.x, sh.y, radius, '#c8f7ff', 0.5);
  game.events.push({ type: 'sonic', x: sh.x, y: sh.y, radius });
}

// The same damaging wave accompanies the ship; each enemy is struck once per wave.
function sweepRunSonic(game, wave, x0, y0, x1, y1) {
  const steps = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / (wave.radius * 0.3)));
  for (let i = 1; i <= steps && game.state === 'play'; i++) {
    const x = x0 + (x1 - x0) * i / steps, y = y0 + (y1 - y0) * i / steps, pad = wave.radius + MAX_ENEMY_R;
    queryGrid(game.grid, x - pad, y - pad, x + pad, y + pad, e => {
      if (e.dead || wave.hits.has(e.id) || game.state !== 'play') return;
      const dx = e.x - x, dy = e.y - y, dist = Math.hypot(dx, dy);
      if (dist > wave.radius + e.r) return;
      wave.hits.add(e.id);
      damageEnemy(game, e, wave.dmg, { cause: wave.cause, dirX: dx / (dist || 1), dirY: dy / (dist || 1), knock: CONFIG.sonicKnock });
    });
  }
  wave.x = x1; wave.y = y1;
}

function updateRunSonic(game, dt) {
  const sh = game.ship;
  for (const wave of [...game.sonicWaves]) {
    if (game.state !== 'play') break;
    // Traced movement sweeps every actual segment in onRunTrail, including corners.
    sweepRunSonic(game, wave, wave.x, wave.y, sh.x, sh.y);
    wave.life -= dt;
  }
  game.sonicWaves = game.sonicWaves.filter(w => w.life > 0);
}

function onRunContact(game, e, x, y, ux, uy) {
  if (!game.newBuild) return;
  onRunElectricContact(game, e);
  if (game.state !== 'play') return;
  const atk = attackPower(0, game.stats);
  if (game.weapons.knockback) {
    const L = runWeaponStats('knockback', game.weapons.knockback);
    const velocity = 800 + 90 * L.tier;
    if (e.dead && !e.towed && !e.hullScattered && !scatterHull(game, e, ux, uy, velocity, atk * 0.7 * L.damage)) {
      game.fbullets.push({ kind: 'corpse', x: e.x, y: e.y, vx: ux * velocity, vy: uy * velocity,
        r: Math.max(10, e.r * 0.6), dmg: atk * 0.7 * L.damage, life: 0.9, pierce: true, hit: new Set([e.id]), color: e.T.color });
    } else if (!e.dead) {
      e.shove = { time: 1.2, vx: ux * velocity, vy: uy * velocity, dmg: atk * 0.7 * L.damage, hits: new Set([e.id]) };
      e.vx = ux * velocity; e.vy = uy * velocity;
    }
  }
  if (game.weapons.contactWave && game.state === 'play') {
    const L = runWeaponStats('contactWave', game.weapons.contactWave);
    explode(game, x, y, 90 * L.radius, atk * 0.45 * L.damage, { cause: 'contactWave', color: '#9fe8ff', knock: 280, life: 0.3 });
  }
  const recovery = runTrait(game, 'recovery');
  if (recovery) game.dashMeter = Math.min(1, game.dashMeter + recovery * 0.02);
}

function onRunElectricContact(game, target) {
  const lv = game.weapons.contactArc;
  if (!game.newBuild || !lv || game.state !== 'play' || target.type === 'meteor') return;
  const L = runWeaponStats('contactArc', lv), damage = attackPower(0, game.stats) * 0.65 * L.damage;
  const used = new Set([target.id]), pts = [{ x: game.ship.x, y: game.ship.y }, { x: target.x, y: target.y }];
  let from = { x: target.x, y: target.y };
  if (!target.dead) damageEnemy(game, target, damage, { cause: 'contactArc' });
  for (let i = 0; i < lv * 2 && game.state === 'play'; i++) {
    let next = null, nearest = 240 ** 2;
    queryGrid(game.grid, from.x - 240, from.y - 240, from.x + 240, from.y + 240, e => {
      if (e.dead || e.type === 'meteor' || used.has(e.id)) return;
      const d = (e.x - from.x) ** 2 + (e.y - from.y) ** 2;
      if (d < nearest) { nearest = d; next = e; }
    });
    if (!next) break;
    used.add(next.id);
    const point = { x: next.x, y: next.y };
    pts.push(point);
    const d = Math.hypot(point.x - from.x, point.y - from.y) || 1;
    damageEnemy(game, next, damage, { cause: 'contactArc', dirX: (point.x - from.x) / d, dirY: (point.y - from.y) / d });
    from = point;
  }
  // The visible zigzag is stable for its lifetime and never consumes drop RNG.
  const zigzag = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
    for (let j = 1; j < 4; j++) {
      const bend = (j % 2 ? 1 : -1) * Math.min(12, d * 0.12);
      zigzag.push({ x: a.x + dx * j / 4 - dy / d * bend, y: a.y + dy * j / 4 + dx / d * bend });
    }
    zigzag.push(b);
  }
  game.wfx.push({ kind: 'bolt', pts: zigzag, life: 0.22, max: 0.22 });
  if (game.wfx.length > 80) game.wfx.shift();
}

function runSegmentCross(a, b, c, d) {
  const rx = b.x - a.x, ry = b.y - a.y, sx = d.x - c.x, sy = d.y - c.y;
  const den = rx * sy - ry * sx;
  if (Math.abs(den) < 1e-7) return null;
  const dx = c.x - a.x, dy = c.y - a.y;
  const t = (dx * sy - dy * sx) / den, u = (dx * ry - dy * rx) / den;
  if (t <= 1e-6 || t > 1 || u < 0 || u > 1) return null;
  return { x: a.x + t * rx, y: a.y + t * ry };
}

function onRunTrail(game, run, x0, y0, x1, y1) {
  if (!game.newBuild || game.state !== 'play') return;
  for (const wave of [...game.sonicWaves]) sweepRunSonic(game, wave, x0, y0, x1, y1);
  if (game.state !== 'play') return;
  const a = { x: x0, y: y0 }, b = { x: x1, y: y1 };
  const len = Math.hypot(x1 - x0, y1 - y0);
  if (len < 1e-6) return;
  const n = runTrait(game, 'crossBlast');
  if (n) for (const old of game.runPaths) {
    if (old.until <= game.buildClock) continue;
    const p = runSegmentCross(a, b, old.a, old.b);
    if (!p) continue;
    const key = `${Math.round(p.x / 20)},${Math.round(p.y / 20)}`;
    if (game.crossUsed.has(key)) continue;
    game.crossUsed.add(key);
    explode(game, p.x, p.y, 100 + n * 25, attackPower(0, game.stats) * (0.8 + n * 0.4), { cause: 'crossBlast', color: '#ff6bd5', knock: 400 });
  }
  game.runPendingPath.push({ a, b, until: game.buildClock + CONFIG.pathMemoryTime });
  game.runTravel.push({ a, b, serial: ++game.runLegSerial, time: game.buildClock });
  if (game.runTravel.length > 600) game.runTravel.splice(0, game.runTravel.length - 600);
  if (game.stats.loopBurst) {
    run.loopPath = run.loopPath || [a];
    tracePortalLoop(game, run, x0, y0, x1, y1);
    run.loopPath.push(b);
  }
  // Distance-based placement follows every traveled segment, including corners within one frame.
  for (const [id, spacing] of [['mines', 75], ['trailBurst', 45]]) {
    const lv = game.weapons[id];
    if (!lv) continue;
    const st = game.weaponState[id] || (game.weaponState[id] = { distance: 0 });
    const L = runWeaponStats(id, lv), step = spacing / L.rate;
    for (let d = step - st.distance; d <= len; d += step) {
      const x = x0 + (x1 - x0) * d / len, y = y0 + (y1 - y0) * d / len;
      const dmg = attackPower(0, game.stats) * L.damage;
      if (id === 'mines') {
        if (game.mines.length < 250) game.mines.push({ x, y, life: 6, armed: 0.25, dmg, radius: 110 * L.radius });
      } else if (game.marks.length < 250) game.marks.push({ x, y, t: 0.55, dmg: dmg * 0.5, radius: 85 * L.radius });
    }
    st.distance = (st.distance + len) % step;
  }
}

function onRunEnd(game) {
  if (!game.newBuild || game.state !== 'play') return;
  game.runPaths = [...game.runPaths.filter(p => p.until > game.buildClock), ...(game.runPendingPath || [])].slice(-CONFIG.pathMemoryMax);
  game.runPendingPath = [];
  endRareRoute(game);
  if (game.state !== 'play') return;
  const sh = game.ship, n = runTrait(game, 'endBlast');
  if (n) explode(game, sh.x, sh.y, 180 + n * 30, attackPower(0, game.stats) * (1 + n * 0.5), { cause: 'endBlast', color: '#c46bff', knock: 500 });
  const v = runTrait(game, 'vortex');
  if (v && game.state === 'play') {
    const life = 1.5 + v * 0.4;
    game.vortexes.push({ x: sh.x, y: sh.y, radius: 180 + v * 35, life, max: life, power: 200 + v * 70 });
    if (game.vortexes.length > 12) game.vortexes.shift();
  }
  game.stats.burstPower = 1;
  game.stats.ignoreArmor = false;
}

function onRunHurt(game) {
  const n = runTrait(game, 'reactive');
  if (n) explode(game, game.ship.x, game.ship.y, 170 + n * 30, attackPower(0, game.stats) * (0.8 + n * 0.4), { cause: 'reactive', color: '#ff6b5a', knock: 450 });
}

function updateRunFollowers(game) {
  if (!game.newBuild) return;
  game.runPaths = game.runPaths.filter(p => p.until > game.buildClock);
  const lv = game.weapons.drone || 0;
  if (!lv) { game.drones = []; return; }
  const L = runWeaponStats('drone', lv), sh = game.ship;
  while (game.drones.length < L.drones) game.drones.push({ x: sh.x, y: sh.y, serial: game.runLegSerial || 0, hits: new Map(), trail: [] });
  for (let i = 0; i < game.drones.length; i++) {
    const d = game.drones[i], delay = CONFIG.droneDelay * (i + 1);
    for (const leg of game.runTravel) {
      if (leg.serial <= d.serial || leg.time + delay > game.buildClock) continue;
      d.serial = leg.serial; d.x = leg.b.x; d.y = leg.b.y; d.followUntil = leg.time + delay + 0.25;
      const pad = 14 + MAX_ENEMY_R;
      queryGrid(game.grid, Math.min(leg.a.x, leg.b.x) - pad, Math.min(leg.a.y, leg.b.y) - pad, Math.max(leg.a.x, leg.b.x) + pad, Math.max(leg.a.y, leg.b.y) + pad, e => {
        if (e.dead || (d.hits.get(e.id) || 0) > game.buildClock || segCircleT(leg.a.x, leg.a.y, leg.b.x, leg.b.y, e.x, e.y, e.r + 14) < 0) return;
        d.hits.set(e.id, game.buildClock + 0.3);
        damageEnemy(game, e, attackPower(0, game.stats) * L.damage * 0.5, { cause: 'drone' });
      });
      d.trail.push({ x: d.x, y: d.y, time: game.buildClock });
    }
    if (!d.followUntil || d.followUntil < game.buildClock) {
      const a = game.buildClock * 1.5 + i * Math.PI * 2 / L.drones;
      const x = sh.x + Math.cos(a) * 90, y = sh.y + Math.sin(a) * 90;
      d.x += (x - d.x) * 0.25; d.y += (y - d.y) * 0.25;
    }
    d.trail = d.trail.filter(p => p.time > game.buildClock - 0.35).slice(-18);
    if (d.hits.size > 400) for (const [id, until] of d.hits) if (until < game.buildClock) d.hits.delete(id);
  }
}

function updateRunWeapons(game, dt) {
  if (!game.newBuild) return;
  const sh = game.ship, atk = attackPower(0, game.stats);
  const busy = !!game.draw;
  for (const [id, interval] of [['forward', 0.45], ['scatter', 1.05], ['turret', 0.5], ['barrier', 0.7], ['sonic', 5]]) {
    const lv = game.weapons[id];
    if (!lv || busy) continue;
    const L = runWeaponStats(id, lv), st = game.weaponState[id] || (game.weaponState[id] = { t: 0 });
    st.t += dt;
    if (st.t < interval / L.rate) continue;
    st.t = 0;
    if (id === 'sonic') { runSonic(game, 'sonic'); continue; }
    if (id === 'barrier') {
      explode(game, sh.x, sh.y, 70 * L.radius, atk * 0.4 * L.damage, { cause: 'barrier', color: '#76aaff', knock: 180, life: 0.2 });
      continue;
    }
    const target = id === 'turret' ? runNearest(game, sh.x, sh.y, 700) : null;
    const a = target ? Math.atan2(target.y - sh.y, target.x - sh.x) : Math.atan2(sh.hy, sh.hx);
    for (let i = 0; i < L.shots; i++) runShot(game, sh.x, sh.y, a + (i - (L.shots - 1) / 2) * (id === 'scatter' ? 0.16 : 0.08),
      atk * L.damage * (id === 'scatter' ? 0.55 : 0.8), { pierce: L.pierce, life: id === 'scatter' ? 0.45 : 0.9, color: id === 'scatter' ? '#ffb36b' : '#ffe46b' });
    game.events.push({ type: 'turret' });
  }
  if (game.weapons.barrier) {
    const L = runWeaponStats('barrier', game.weapons.barrier), st = game.weaponState.barrier || (game.weaponState.barrier = { t: 0 });
    st.blockT = Math.max(0, (st.blockT || 0) - dt);
    if (!st.blockT) for (const b of game.ebullets) {
      if (b.life <= 0 || Math.hypot(b.x - sh.x, b.y - sh.y) > 70 * L.radius + b.r) continue;
      b.life = 0; st.blockT = 0.8 / L.rate;
      addRing(game, b.x, b.y, 32, '#76aaff', 0.25); break;
    }
  }
  if (game.weapons.drone && !busy) {
    const L = runWeaponStats('drone', game.weapons.drone), st = game.weaponState.drone || (game.weaponState.drone = { t: 0 });
    st.t += dt;
    if (st.t >= 0.65 / L.rate) {
      st.t = 0;
      for (const d of game.drones) {
        const e = runNearest(game, d.x, d.y, 550);
        if (e) runShot(game, d.x, d.y, Math.atan2(e.y - d.y, e.x - d.x), atk * 0.45 * L.damage, { color: '#a8ffdb', r: 4 });
      }
    }
  }
  for (const v of game.vortexes) {
    v.life -= dt;
    queryGrid(game.grid, v.x - v.radius - MAX_ENEMY_R, v.y - v.radius - MAX_ENEMY_R, v.x + v.radius + MAX_ENEMY_R, v.y + v.radius + MAX_ENEMY_R, e => {
      if (e.dead || e.type === 'boss') return;
      const dx = v.x - e.x, dy = v.y - e.y, d = Math.hypot(dx, dy);
      if (d > v.radius || d < 10) return;
      const move = Math.min(d - 10, v.power * dt / Math.max(1, e.r / 30));
      const x0 = e.x, y0 = e.y;
      e.x += dx / d * move; e.y += dy / d * move;
      collideEnemyBodies(e, game.field, x0, y0);
    });
  }
  game.vortexes = game.vortexes.filter(v => v.life > 0);
  updateShovedEnemies(game);
  updateWeapons(game, dt); // Experimental weapons never enter the normal offer pool.
}

function updateShovedEnemies(game) {
  for (const e of game.enemies) {
    if (e.dead || !e.shove || e.shove.time <= 0 || !e.shoveFrom) continue;
    const p = e.shoveFrom, shove = e.shove, pad = e.r + MAX_ENEMY_R;
    queryGrid(game.grid, Math.min(p.x, e.x) - pad, Math.min(p.y, e.y) - pad, Math.max(p.x, e.x) + pad, Math.max(p.y, e.y) + pad, other => {
      if (other.dead || shove.hits.has(other.id) || segCircleT(p.x, p.y, e.x, e.y, other.x, other.y, other.r + e.r) < 0) return;
      shove.hits.add(other.id);
      const sp = Math.hypot(shove.vx, shove.vy) || 1;
      damageEnemy(game, other, shove.dmg, { cause: 'knockbackChain', dirX: shove.vx / sp, dirY: shove.vy / sp, knock: 400 });
      addRing(game, other.x, other.y, other.r + 30, '#ff986b', 0.25);
    });
    e.shoveFrom = null;
  }
}

function xpForLevel(level) {
  return CONFIG.xpBase + CONFIG.xpGrowth * level + CONFIG.xpCurve * level * level;
}

// Station upgrades bought with coins (parts). Effects are applied in baseStats().
const META_UPGRADES = [
  { id: 'speed', name: '主推進器', desc: '最高速度 +5%', max: 5, costs: [25, 50, 90, 140, 210] },
  { id: 'hp', name: '機体フレーム', desc: '最大 HP +15', max: 5, costs: [20, 40, 70, 110, 160] },
  { id: 'atk', name: '衝角素材', desc: '攻撃力 +6%', max: 5, costs: [20, 40, 70, 110, 160] },
  { id: 'charge', name: '充電効率', desc: 'チャージ時間 -5%', max: 5, costs: [20, 40, 70, 110, 160] },
  { id: 'pickup', name: '回収装置', desc: '回収範囲 +15%', max: 5, costs: [15, 30, 55, 85, 125] },
  { id: 'xp', name: '学習回路', desc: '経験値 +8%', max: 5, costs: [25, 50, 90, 140, 210] },
];

const SAVE_KEY = 'speed-save-v1';

function metaCost(id, level) {
  const u = META_UPGRADES.find((x) => x.id === id);
  if (!u || level >= u.max) return null;
  return u.costs[level];
}

function buyUpgrade(save, id) {
  const lv = save.meta[id] || 0;
  const cost = metaCost(id, lv);
  if (cost == null || save.coins < cost) return false;
  save.coins -= cost;
  save.meta[id] = lv + 1;
  return true;
}

// Debug: put every station upgrade back to 0 and refund the parts spent on them.
function resetMeta(save) {
  let refund = 0;
  for (const u of META_UPGRADES) {
    const lv = save.meta[u.id] || 0;
    for (let i = 0; i < lv; i++) refund += u.costs[i] || 0;
  }
  save.meta = {};
  save.coins += refund;
  return refund;
}

function defaultSave() {
  return { coins: 0, meta: {}, best: { runs: 0, escapes: 0, escapeTime: null, topSpeed: 0 } };
}

function loadSave(storage) {
  try {
    const raw = storage && storage.getItem(SAVE_KEY);
    if (!raw) return defaultSave();
    const s = JSON.parse(raw);
    const d = defaultSave();
    if (typeof s !== 'object' || !s) return d;
    return {
      coins: Number.isFinite(s.coins) ? s.coins : 0,
      meta: typeof s.meta === 'object' && s.meta ? s.meta : {},
      best: { ...d.best, ...(s.best || {}) },
    };
  } catch {
    return defaultSave();
  }
}

function writeSave(storage, save) {
  try { storage && storage.setItem(SAVE_KEY, JSON.stringify(save)); } catch { /* storage unavailable */ }
}

function applyRunResult(save, game) {
  save.coins += Math.round(game.coins);
  save.best.runs++;
  save.best.topSpeed = Math.max(save.best.topSpeed, game.peakSpeed);
  if (game.state === 'won') {
    save.best.escapes++;
    save.best.escapeTime = save.best.escapeTime == null ? game.t : Math.min(save.best.escapeTime, game.t);
  }
}

// ---- gravity.js ----


function pull(out, x, y, b) {
  const dx = b.x - x, dy = b.y - y;
  const d2 = Math.max(dx * dx + dy * dy, b.r * b.r);
  const d = Math.sqrt(d2);
  const a = b.gm / d2;
  out.ax += (dx / d) * a;
  out.ay += (dy / d) * a;
}

function gravityAt(field, t, x, y) {
  const out = { ax: 0, ay: 0 };
  pull(out, x, y, field.planet);
  for (const m of field.moons) pull(out, x, y, m);
  const r = Math.hypot(x, y);
  if (r > CONFIG.fieldRadius) {
    const push = CONFIG.boundaryPush + (r - CONFIG.fieldRadius) * 4;
    out.ax -= (x / r) * push;
    out.ay -= (y / r) * push;
  }
  return out;
}

// ---- impact-fx.js ----


// Effects remain at the actual contact; the illuminated hull follows a surviving blocker.
function addCombatImpact(game, enemy, kind, nx, ny) {
  const impacts = game.fx.impacts;
  if (impacts.length >= 48) {
    if (kind !== 'block') return;
    const old = impacts.findIndex(i => i.kind !== 'block');
    impacts.splice(Math.max(0, old), 1);
  }
  const life = kind === 'block' ? CONFIG.blockImpactLife : CONFIG.weakImpactLife;
  const x = enemy.x + nx * enemy.r, y = enemy.y + ny * enemy.r;
  impacts.push({ kind, enemy, x, y, nx, ny, life, max: life });
  const count = kind === 'block' ? CONFIG.blockSparkCount : CONFIG.weakFlameCount;
  const normal = Math.atan2(ny, nx);
  for (let i = 0; i < count && game.fx.particles.length < 1800; i++) {
    const side = i % 2 ? 1 : -1;
    const angle = kind === 'block' ? normal + side * (0.8 + Math.random() * 0.75)
      : normal + (Math.random() - 0.5) * 1.25;
    const speed = kind === 'block' ? 180 + Math.random() * 460 : 100 + Math.random() * 260;
    const duration = life * (0.6 + Math.random() * 0.4);
    game.fx.particles.push({ kind: kind === 'block' ? 'spark' : 'flame', x, y,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: duration, max: duration, color: i % 3 ? '#ffae40' : '#fff6c7', size: 2 + Math.random() * 3 });
  }
}

function drawCombatImpacts(r, game) {
  const { ctx } = r;
  const z = r.cam.zoom;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const impact of game.fx.impacts) {
    const a = impact.life / impact.max;
    const { enemy, nx, ny } = impact;
    const x = impact.kind === 'block' && !enemy.dead ? enemy.x + nx * enemy.r : impact.x;
    const y = impact.kind === 'block' && !enemy.dead ? enemy.y + ny * enemy.r : impact.y;
    const reach = (impact.kind === 'block' ? 60 : 38) / Math.sqrt(z);
    const glow = ctx.createRadialGradient(x, y, 0, x, y, reach);
    glow.addColorStop(0, `rgba(255,245,190,${a * 0.85})`);
    glow.addColorStop(0.2, `rgba(255,157,38,${a * 0.6})`);
    glow.addColorStop(1, 'rgba(255,80,12,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(x - reach, y - reach, reach * 2, reach * 2);
    if (impact.kind === 'block') {
      // A brief reflection across this hull identifies the enemy that stopped the dash.
      const angle = Math.atan2(ny, nx);
      ctx.globalAlpha = a;
      ctx.strokeStyle = '#ffcf69'; ctx.lineWidth = 5 / z;
      ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.r + 2 / z, angle - 1.15, angle + 1.15); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

// ---- projectiles.js ----




// Enemy bullets and missiles. Returns hits on the ship via the callback.
function updateEnemyBullets(game, dt, onHit) {
  const sh = game.ship;
  const R = CONFIG.shipRadius;
  for (const b of game.ebullets) {
    if (b.life <= 0) continue;
    if (b.kind === 'missile') {
      const t = game.enemyAim || sh; // home on where enemies think the ship is
      const want = Math.atan2(t.y - b.y, t.x - b.x);
      const cur = Math.atan2(b.vy, b.vx);
      let d = want - cur;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      const a = cur + Math.max(-b.turn * dt, Math.min(b.turn * dt, d));
      b.vx = Math.cos(a) * b.speed; b.vy = Math.sin(a) * b.speed;
    }
    const x0 = b.x, y0 = b.y;
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;
    const bodyHit = clipProjectileToBody(game, b, x0, y0);
    const shipHit = segCircleT(x0, y0, b.x, b.y, sh.x, sh.y, b.r + R);
    if (shipHit >= 0 && (!bodyHit || shipHit < 1)) { onHit(b); b.life = 0; }
    if (bodyHit) b.life = 0;
  }
  if (game.ebullets.some((b) => b.life <= 0)) game.ebullets = game.ebullets.filter((b) => b.life > 0);
}

// ---- world.js ----
























const STEP = 1 / 120;

function createGame(opts = {}) {
  const meta = opts.meta || {};
  const seed = opts.seed ?? (Math.random() * 4294967296) >>> 0;
  const loadout = Object.fromEntries(SLOTS.map((s) => [s.id, null]));
  // The portal prototype starts with its arrival wave so the core interaction is immediately testable.
  if ((opts.scheme || CONFIG.controlScheme) === 'portal') loadout.radar = { id: 'portalPulse', slot: 'radar', r: 0, plus: 0 };
  const newBuild = isDrawScheme(opts.scheme || CONFIG.controlScheme);
  const weapons = newBuild && opts.chooseStarter ? {} : { forward: 1 }, traits = {};
  const stats = newBuild ? computeRunStats(meta, weapons, traits) : computeStats(meta, loadout);
  const rng = makeRng(seed);
  const ship = createShip(stats, -CONFIG.startRadius, 0);
  ship.vy = -CONFIG.baseMaxSpeed * 0.3; // start drifting along the orbit
  const game = {
    t: 0, worldTime: 0, meteorClock: 0, acc: 0, seed, rng,
    meta, stats, ship, loadout, newBuild, weapons, traits,
    rareQueue: [], rareOffer: null, levelChoices: null, buildClock: 0, weaponState: {}, drones: [], wstate: {}, wproj: [], wfx: [],
    runPaths: [], runTravel: [], vortexes: [], dashKills: 0, nextKillBoom: 0, criticalBeamAt: 0,
    scheme: opts.scheme || CONFIG.controlScheme,
    offerQueue: [], currentOffer: null, lastOfferSlot: null,
    field: createField(rng),
    debug: { invincible: false, autoOffer: null },
    enemies: [], newEnemies: [], ebullets: [],
    boss: null, bossSpawned: false,
    finale: null, death: null, finishFrames: [], finishClock: 0, sonicWaves: [],
    leechDrag: 0,
    gems: [], coinDrops: [],
    xp: 0, level: 0, pendingLevelups: 0,
    spawnAcc: 0, waveT: 0,
    phaseId: null,
    endReason: null,
    draw: null, lastPath: null,
    portals: [], portalSerial: 0, portalDash: null, portalPreview: null, portalTouch: null, portalEntryT: 0,
    portalSpace: { armed: false, seconds: 0, consumed: false },
    portalClock: 0, portalCooldowns: new Map(),
    dashMeter: 1, // normalized charge capacity; time-filled in the draw prototype
    grid: buildGrid([], 160),
    fx: { particles: [], rings: [], texts: [], ghosts: [], loops: [], impacts: [] },
    ...createEffectState(),
    kills: 0, coins: 0, cores: 0,
    hitstop: 0, slowmo: 0,
    spawning: true,
    dashPierce: 0, dashId: 0,
    state: 'play',
    timeScale: 1,
    releasePending: null,
    peakSpeed: 0, stage: 0,
    events: [],
    viewRadius: 1400,
  };
  if (newBuild && opts.chooseStarter) {
    game.state = 'weaponSelect';
    game.levelChoices = rollStarterWeapons(game);
  }
  return game;
}

function update(game, frameDt, input) {
  frameDt = Math.min(frameDt, 0.1);
  if (game.state === 'dying') {
    if (game.death.phase !== 'freeze') updateFx(game, frameDt);
    if (advanceShipDeath(game, frameDt)) end(game, 'lost', 'hp');
    return;
  }
  if (game.state === 'finishing') {
    updateFx(game, frameDt * (game.finale.phase === 'slow' ? CONFIG.bossFinishReplayWindow / CONFIG.bossFinishSlowTime : 1));
    const finished = advanceBossFinish(game, frameDt);
    if (finished) end(game, 'won', 'boss');
    return;
  }
  if (game.state !== 'play') return;
  const meteorClockBefore = game.meteorClock;
  recordBossApproach(game, frameDt);
  game.buildClock += frameDt;
  if (game.newBuild && !game.draw) {
    const old = game.dashMeter;
    game.dashMeter = Math.min(1, old + frameDt / (game.stats.chargeTime * game.stats.gaugeMax));
    if (old < 1 && game.dashMeter >= 1) game.events.push({ type: 'dashReady' });
  }
  if (game.newBuild && !game.draw && !game.portalDash) {
    if (game.rareQueue.length) { openRareWeapon(game); return; }
    if (game.pendingLevelups) { openRunLevel(game); return; }
  }
  game.portalClock += frameDt;
  for (const [edge, until] of game.portalCooldowns) if (until <= game.portalClock) game.portalCooldowns.delete(edge);
  if (input.release) game.releasePending = { x: input.aimX, y: input.aimY, keyboard: !!input.keyboard };
  updateFx(game, frameDt);
  handlePortalInput(game, input, frameDt);
  if ((input.dash || input.drawClick) && isDrawScheme(game.scheme) && !game.draw && game.dashMeter >= (game.newBuild ? CONFIG.drawMinCharge : 1)) {
    startDrawing(game, input);
    input = { ...input, press: false, dash: false, drawRelease: false }; // consume the start click so it cannot also commit
  }
  if (game.hitstop > 0) { game.hitstop -= frameDt; return; }
  // outside a dash the hitstop budget refills slowly, so plain ramming kills keep their beat
  if (!game.draw && !game.portalDash && game.dashStop > 0) game.dashStop = Math.max(0, game.dashStop - frameDt * CONFIG.killHitstopRegen);
  if (game.portalDash) updatePortals(game, frameDt);
  if (game.state !== 'play') return;
  if (game.draw && game.draw.phase === 'draw') updateDrawing(game, input);
  if (game.draw && game.draw.phase === 'run') {
    // trace every frame on real time (world steps are rare while it is nearly frozen)
    runAlongPath(game, frameDt);
    if (game.state !== 'play') return;
    collideBodies(game);
    if (game.state !== 'play') return;
    recordTrail(game.ship, frameDt);
  }
  if (game.newBuild) updateRunFollowers(game);
  if (game.newBuild) updateRunSonic(game, frameDt);
  if (game.newBuild) updateRareWeapons(game, frameDt);
  if (game.state !== 'play') return;
  let scale = 1;
  if (game.draw) scale = drawWorldScale(game);
  if (game.portalDash) scale = portalWorldScale(game);
  if (game.slowmo > 0) { game.slowmo -= frameDt; scale = Math.min(scale, 0.18); }
  game.timeScale = scale;
  game.acc += frameDt * scale;
  // the run clock keeps real time while drawing/tracing even though the world crawls
  if (game.draw || game.portalDash) {
    const carry = frameDt * (1 - scale);
    game.t += carry;
    game.meteorClock += carry * (input.mobile ? (scale > 0 ? CONFIG.meteorSlowCarry : 0) : 1);
  }
  const phaseBefore = drawPhase(game);
  while (game.acc >= STEP) {
    game.acc -= STEP;
    step(game, STEP, input);
    if (input.snap) input = { ...input, snap: null }; // one-shot per frame, not per substep
    if (game.state !== 'play') break;
    if (drawPhase(game) !== phaseBefore) { game.acc = 0; break; } // time scale changes next frame
    if (game.newBuild && !game.draw && !game.portalDash) {
      if (game.rareQueue.length) { openRareWeapon(game); break; }
      if (game.pendingLevelups) { openRunLevel(game); break; }
    }
    if (game.offerQueue.length) {
      absorbDuplicates(game);
      if (game.offerQueue.length && !game.draw) { openOffer(game); break; }
    }
  }
  // Meteors retain near-real-time motion during slow world steps. Update their
  // positions on frames without a step too, then refresh the collision index.
  if (game.state === 'play' && updateMeteorField(game, Math.max(0, game.meteorClock - meteorClockBefore))) {
    game.grid = buildGrid(game.enemies, 160, game.grid);
  }
  if (game.draw && game.slowmo <= 0) game.timeScale = drawWorldScale(game);
  if (game.state === 'play' && game.t >= CONFIG.runTime) end(game, 'lost', 'time');
}

// Heading follows the travel direction; when nearly still it keeps whatever the controls last set.
function updateHeading(sh) {
  const sp = Math.hypot(sh.vx, sh.vy);
  if (sp > CONFIG.pivotSpeed) { sh.hx = sh.vx / sp; sh.hy = sh.vy / sp; }
}

// Direction a keyboard/hover launch would take right now.
function schemeAim(game, input) {
  return controlAim(game, input) || { x: game.ship.hx * 100, y: game.ship.hy * 100 };
}

function step(game, dt, input) {
  const sh = game.ship;
  const stats = game.stats;
  game.t += dt;
  game.worldTime += dt;
  game.meteorClock += dt;
  const phase = getPhase(game.t);
  if (phase.id !== game.phaseId) {
    game.phaseId = phase.id;
    game.events.push({ type: 'phase', phase });
  }

  const ctl = game.draw || game.portalDash ? { ax: 0, ay: 0 } : controlStep(game, input, dt);
  updateHeading(sh);
  const aim = schemeAim(game, input);
  sh.markX = aim.x / 100; sh.markY = aim.y / 100;
  if (game.draw || game.portalDash) {
    game.releasePending = null; // presses while drawing/running only commit the path
  } else if (input.charging && !game.releasePending) {
    if (!sh.charging) { sh.charging = true; sh.chargeT = 0; }
    sh.chargeT += dt;
    sh.gauge = computeGauge(sh.chargeT, stats, sh.gaugeBank);
    sh.aimX = input.keyboard ? aim.x : input.aimX;
    sh.aimY = input.keyboard ? aim.y : input.aimY;
  }
  if (game.releasePending && !game.draw && !game.portalDash) {
    const r = game.releasePending;
    game.releasePending = null;
    if (sh.charging) {
      if (r.keyboard && isDrawScheme(game.scheme)) startDrawing(game, input);
      else if (r.keyboard) launch(game, aim.x, aim.y);
      else launch(game, r.x, r.y);
    }
    sh.charging = false;
  }

  updateMoons(game.field, game.worldTime);
  updateMeteorField(game, 0);
  game.leechDrag = 0;
  updateEnemyAim(game, dt);
  for (const e of game.enemies) updateEnemy(e, game, dt);
  flushNewEnemies(game);
  game.grid = buildGrid(game.enemies, 160, game.grid);

  if (!game.draw && !game.portalDash) {
    const g = gravityAt(game.field, game.worldTime, sh.x, sh.y);
    const drag = dustDragAt(game.field, sh.x, sh.y) + game.leechDrag;
    const x0 = sh.x, y0 = sh.y;
    stepShip(sh, stats, dt, g.ax + ctl.ax, g.ay + ctl.ay, drag);
    collideEnemies(game, x0, y0);
    if (game.state !== 'play') return;
    collideBodies(game);
    if (game.state !== 'play') return;
    checkPortalEntry(game, x0, y0);
  }
  if (sh.invulnT > 0) sh.invulnT -= dt;
  if (game.newBuild) updateRunWeapons(game, dt);
  if (game.state !== 'play') return;
  updateEnemyBullets(game, dt, (b) => damageShip(game, b.dmg, b.slow, b.kind));
  if (game.state !== 'play') return;
  updateEffects(game, dt);
  if (game.state !== 'play') return;
  if (game.enemies.some((e) => e.dead)) game.enemies = game.enemies.filter((e) => !e.dead);
  flushNewEnemies(game);
  updateSpawner(game, dt);
  updateGems(game, dt);
  if (stats.regen > 0) sh.hp = Math.min(stats.maxHp, sh.hp + stats.regen * dt);

  const sp = Math.hypot(sh.vx, sh.vy);
  if (sp > game.peakSpeed) game.peakSpeed = sp;
  recordTrail(sh, dt);
  const st = speedStage(sp);
  if (st > game.stage) {
    game.stage = st;
    game.events.push({ type: 'stage', stage: st, name: SPEED_STAGES[st - 1].name, speed: sp });
  } else if (game.stage > 0 && sp < SPEED_STAGES[game.stage - 1].v * 0.85) {
    game.stage = st;
  }

  if (sh.hp <= 0) end(game, 'lost', 'hp');
  else if (game.t >= CONFIG.runTime) end(game, 'lost', 'time');
}

function end(game, state, reason) {
  if (state === 'won') game.coins += CONFIG.escapeBonus;
  game.state = state;
  game.endReason = reason;
  game.events.push({ type: 'end', state, reason });
}

// ---- draw-build level-ups ----

function openRareWeapon(game) {
  game.rareOffer = game.rareOffer || game.rareQueue.shift();
  const id = game.rareOffer, owned = game.weapons[id] || 0;
  const pick = { kind: 'weapon', id, level: owned + 1, rare: true };
  const slots = Object.keys(game.weapons).filter(k => game.weapons[k] > 0);
  game.levelChoices = owned >= CONFIG.weaponMaxLevel ? [] : owned || slots.length < CONFIG.weaponSlots ? [pick] :
    slots.map(replace => ({ ...pick, replace, replaceLevel: game.weapons[replace] }));
  game.levelChoices.push({ kind: 'rareSkip', id });
  game.state = 'levelup';
  game.ship.charging = false; game.releasePending = null;
}

function openRunLevel(game) {
  game.state = 'levelup';
  game.levelChoices = rollRunChoices(game);
  game.ship.charging = false;
  game.releasePending = null;
}

function resolveRunLevel(game, index) {
  if (!['weaponSelect', 'levelup'].includes(game.state)) return false;
  const c = game.levelChoices?.[index];
  if (!c) return false;
  if (game.state === 'weaponSelect') {
    if (c.kind !== 'weapon' || c.level !== 1 || !runModuleDef('weapon', c.id)?.normal) return false;
    if (!grantRunItem(game, 'weapon', c.id)) return false;
    refreshStats(game);
    game.levelChoices = null; game.state = 'play';
    game.events.push({ type: 'upgrade', mod: c });
    return true;
  }
  if (game.rareOffer) {
    if (c.kind !== 'rareSkip') {
      if (!runModuleDef('weapon', c.id) || (game.weapons[c.id] || 0) >= CONFIG.weaponMaxLevel) return false;
      const count = Object.values(game.weapons).filter(n => n > 0).length;
      if (!game.weapons[c.id] && count + 1 - (c.replace && game.weapons[c.replace] ? 1 : 0) > CONFIG.weaponSlots) return false;
      if (c.replace) { delete game.weapons[c.replace]; delete game.weaponState[c.replace]; delete game.wstate[c.replace]; }
      if (!grantRunItem(game, 'weapon', c.id)) return false;
      refreshStats(game); game.events.push({ type: 'upgrade', mod: c });
    }
    game.rareOffer = null; game.levelChoices = null; game.state = 'play';
    if (game.rareQueue.length) openRareWeapon(game);
    else if (game.pendingLevelups) openRunLevel(game);
    return true;
  }
  if (c.kind === 'heal') game.ship.hp = Math.min(game.stats.maxHp, game.ship.hp + game.stats.maxHp * 0.3);
  else if (!grantRunItem(game, c.kind, c.id)) return false;
  refreshStats(game);
  game.events.push({ type: 'upgrade', mod: c });
  game.pendingLevelups = Math.max(0, game.pendingLevelups - 1);
  game.levelChoices = null;
  if (game.pendingLevelups) openRunLevel(game);
  else game.state = 'play';
  return true;
}

function debugRunItem(game, kind, id, levels = 1) {
  if (!game.newBuild || !['play', 'levelup'].includes(game.state)) return false;
  const ok = grantRunItem(game, kind, id, levels);
  const name = runModuleDef(kind, id)?.name || id;
  addText(game, game.ship.x, game.ship.y - 46, ok ? name : '装備枠が満員／強化済み', ok ? '#9fe8ff' : '#ff9f40', 18);
  if (ok) {
    refreshStats(game);
    if (game.state === 'levelup') { if (game.rareOffer) openRareWeapon(game); else game.levelChoices = rollRunChoices(game); }
  }
  return ok;
}

// ---- legacy offers ----

// Picking up a module you already have upgrades it (+1, +15% effect each) instead of asking.
function absorbDuplicates(game) {
  while (game.offerQueue.length) {
    const o = game.offerQueue[0];
    const cur = game.loadout[o.slot];
    if (!cur || cur.id !== o.id) return;
    game.offerQueue.shift();
    cur.r = Math.max(cur.r, o.r);
    cur.plus = (cur.plus || 0) + 1;
    refreshStats(game);
    const sh = game.ship;
    addText(game, sh.x, sh.y - 46, `${moduleDef(cur.id).name} +${cur.plus}`, RARITIES[cur.r].color, 20);
    game.events.push({ type: 'upgrade', mod: cur });
  }
}

function pushOffer(game, mod, source) {
  game.lastOfferSlot = mod.slot;
  game.offerQueue.push({ ...mod, source });
  if (game.state === 'play' && !game.draw) {
    absorbDuplicates(game);
    if (game.offerQueue.length) openOffer(game);
  }
}

function openOffer(game) {
  const auto = game.debug.autoOffer;
  game.state = 'offer';
  game.currentOffer = game.offerQueue.shift();
  game.ship.charging = false;
  game.releasePending = null;
  game.events.push({ type: 'offer' });
  if (auto) while (game.state === 'offer') resolveOffer(game, auto === 'equip' || (auto === 'better' && isBetter(game, game.currentOffer)));
}

function isBetter(game, mod) {
  const cur = game.loadout[mod.slot];
  return !cur || mod.r >= cur.r;
}

// accept: equip (the old module in that slot is thrown away); otherwise discard the offer.
function resolveOffer(game, accept) {
  const mod = game.currentOffer;
  if (!mod) return;
  if (accept) {
    game.loadout[mod.slot] = { id: mod.id, slot: mod.slot, r: mod.r, plus: 0 };
    refreshStats(game);
    game.events.push({ type: 'equip', mod });
  }
  absorbDuplicates(game);
  if (game.offerQueue.length) {
    game.currentOffer = game.offerQueue.shift();
  } else {
    game.currentOffer = null;
    game.state = 'play';
  }
}

function refreshStats(game) {
  const oldMax = game.stats.maxHp;
  const burstPower = game.stats.burstPower, ignoreArmor = game.stats.ignoreArmor;
  game.stats = game.newBuild
    ? computeRunStats(game.meta, game.weapons, game.traits, { cores: game.cores, level: game.level })
    : computeStats(game.meta, game.loadout, { cores: game.cores, level: game.level });
  if (game.newBuild && game.draw?.phase === 'run') { game.stats.burstPower = burstPower; game.stats.ignoreArmor = ignoreArmor; }
  const gain = game.stats.maxHp - oldMax;
  if (gain > 0) game.ship.hp += gain;
  game.ship.hp = Math.min(game.ship.hp, game.stats.maxHp);
}

// ---- draw a path, then run it (draw scheme) ----

function drawPhase(game) {
  return game.draw ? game.draw.phase : game.portalDash ? `portal:${game.portalDash.phase}` : null;
}

function drawBudget(game, gauge) {
  return CONFIG.drawLength * gauge * (game.stats.maxSpeed / CONFIG.baseMaxSpeed) * game.stats.drawLengthMult;
}

// How far the wave from a traced path reaches (the band drawn around the path).
function waveRadius(game) {
  return CONFIG.waveRadius * game.stats.waveRadiusMult;
}

// The traced path gives off a wave: enemies within reach take damage once per pass and are
// pushed away from the path. Sampled finely so long, fast traces leave no gaps.
function waveAlong(game, r, x0, y0, x1, y1) {
  const W = waveRadius(game);
  const len = Math.hypot(x1 - x0, y1 - y0);
  const n = Math.max(1, Math.ceil(len / Math.min(W, 40)));
  const dmg = attackPower(r.speed, game.stats) * CONFIG.waveDamage * game.stats.waveDmgMult;
  for (let k = 1; k <= n; k++) {
    const px = x0 + (x1 - x0) * k / n, py = y0 + (y1 - y0) * k / n;
    for (const [id, e] of r.waveInside) {
      if (e.dead || Math.hypot(px - e.x, py - e.y) > e.r + W + 2) r.waveInside.delete(id);
    }
    queryGrid(game.grid, px - W - MAX_ENEMY_R, py - W - MAX_ENEMY_R, px + W + MAX_ENEMY_R, py + W + MAX_ENEMY_R, (e) => {
      if (r.waveInside.has(e.id)) return;
      const d = Math.hypot(e.x - px, e.y - py);
      if (d > e.r + W) return;
      r.waveInside.set(e.id, e);
      damageEnemy(game, e, dmg, { cause: 'wave', dirX: (e.x - px) / (d || 1), dirY: (e.y - py) / (d || 1), knock: 260, impactX: px, impactY: py });
    });
    if (game.state === 'finishing') return;
    r.waveAcc += len / n;
    if (r.waveAcc >= 45) { r.waveAcc = 0; addRing(game, px, py, W, 'rgba(130,225,255,0.9)', 0.35); }
  }
}

// World speed while tracing: the faster the dash, the slower everything else.
function traceWorldScale(game) {
  return Math.max(CONFIG.drawRunScaleMin, Math.min(1, CONFIG.drawRunSlowRef / Math.max(1, game.draw.speed)));
}

function drawWorldScale(game) {
  return game.draw.phase === 'draw' ? CONFIG.drawTimeScale : traceWorldScale(game);
}

// Real play seconds needed to fill the draw gauge from empty.
function dashNeed(game) { return game.stats.chargeTime * game.stats.gaugeMax; }

function startDrawing(game, input) {
  const sh = game.ship;
  sh.glide = false;
  const fullCharge = game.dashMeter >= 1 - 1e-6;
  const gauge = game.stats.gaugeMax * (game.newBuild ? game.dashMeter : 1);
  const budget = drawBudget(game, gauge);
  // Keep the draw prototype's charge until commit; only the drawn length is spent.
  if (!game.newBuild) game.dashMeter = 0;
  // A mouse click starts the line immediately. Keyboard/touch shortcuts can still pick a start.
  const started = !!input.drawClick || (input.mobile && input.press);
  game.draw = { phase: 'draw', points: started ? [startPoint(game, input.clickCursor || input.cursor)] : [],
    budget, used: 0, gauge, charge: game.dashMeter, fullCharge, cursor: input.cursor || null, blocked: false, started, inputMethod: input.mobile ? 'freehand' : CONFIG.drawInput };
  sh.charging = false;
  game.events.push({ type: 'drawStart' });
}

// The path follows the cursor until its length runs out, it reaches a planet, or another click.
function updateDrawing(game, input) {
  const d = game.draw;
  if (input.drawCancel || (input.mobile && input.dash && !d.started)) { game.draw = null; return; }
  if (input.cursor) d.cursor = input.cursor;
  if (!d.started) {
    // the line only starts on a click (or Space), so moving the mouse never draws by accident
    if (input.press) { d.started = true; d.points.push(startPoint(game, d.cursor)); }
    if (input.drawRelease) game.draw = null;
    return;
  }
  if (d.inputMethod === 'points') {
    if (input.drawClick && (input.clickCursor || d.cursor)) extendPath(game, d, input.clickCursor || d.cursor);
    if (input.confirm || input.dash || d.used >= d.budget - 0.5 || d.blocked) {
      if (d.points.length >= 2) commitPath(game);
    }
    return;
  }
  if (input.cursor) extendPath(game, d, input.cursor);
  if (input.mobile && (input.drawRelease || input.dash)) {
    if (d.points.length >= 2) commitPath(game); else game.draw = null;
  } else if (input.press || d.used >= d.budget - 0.5 || d.blocked) commitPath(game);
}

// Where a path may start: the clicked point, pushed out of planets and moons.
function startPoint(game, c) {
  const sh = game.ship;
  const p = c ? { x: c.x, y: c.y } : { x: sh.x, y: sh.y };
  for (const b of [game.field.planet, ...game.field.moons]) {
    const dx = p.x - b.x, dy = p.y - b.y, dist = Math.hypot(dx, dy), min = b.r + CONFIG.shipRadius + 4;
    if (dist < min) { const k = min / (dist || 1); p.x = b.x + (dx || 1) * k; p.y = b.y + dy * k; }
  }
  return p;
}

function extendPath(game, d, c) {
  const last = d.points[d.points.length - 1];
  const dx = c.x - last.x, dy = c.y - last.y;
  const len = Math.hypot(dx, dy);
  if (len < CONFIG.drawStep) return;
  const remain = d.budget - d.used;
  if (remain <= 0.5) return;
  let L = Math.min(len, remain);
  const ux = dx / len, uy = dy / len;
  const R = CONFIG.shipRadius;
  for (const b of [game.field.planet, ...game.field.moons]) {
    const t = segCircleT(last.x, last.y, last.x + ux * L, last.y + uy * L, b.x, b.y, b.r + R);
    if (t >= 0) { L = Math.max(0, t * L - 2); d.blocked = true; }
  }
  if (L < 1) return;
  d.points.push({ x: last.x + ux * L, y: last.y + uy * L });
  d.used += L;
}

function commitPath(game) {
  const d = game.draw, sh = game.ship;
  if (d.points.length < 2) {
    // nothing drawn: dash straight for the full length — from the ship toward the cursor, or from
    // the clicked start onward in the direction ship -> start
    let ux = sh.hx, uy = sh.hy;
    if (!d.points.length) d.points.push({ x: sh.x, y: sh.y });
    const o = d.points[0];
    const tgt = Math.hypot(o.x - sh.x, o.y - sh.y) > 1 ? o : d.cursor;
    if (tgt) {
      const dx = tgt.x - sh.x, dy = tgt.y - sh.y, l = Math.hypot(dx, dy);
      if (l > 1) { ux = dx / l; uy = dy / l; }
    }
    extendPath(game, d, { x: o.x + ux * d.budget, y: o.y + uy * d.budget });
    if (d.points.length < 2) { game.draw = null; return; }
  }
  if (game.newBuild) game.dashMeter = Math.max(0, game.dashMeter - d.charge * Math.min(1, d.used / d.budget));
  const pts = d.points;
  warpTo(game, pts[0].x, pts[0].y);
  const l = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
  const dx = (pts[1].x - pts[0].x) / l, dy = (pts[1].y - pts[0].y) / l;
  onLaunch(game);
  const v = launchVelocity(sh.vx, sh.vy, dx, dy, d.gauge, game.stats);
  const speed = Math.max(Math.hypot(v.vx, v.vy), 1);
  sh.vx = dx * speed; sh.vy = dy * speed;
  sh.boostT = game.stats.boostDuration; sh.fadeT = 0; sh.gaugeBank = 0;
  sh.aimAngle = Math.atan2(dy, dx);
  game.dashId++;
  game.lastPath = pts;
  let total = 0;
  for (let i = 1; i < pts.length; i++) total += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
  // speed = the dash speed (attack, escape, momentum afterwards); rate = how fast the path is traced on screen
  const rate = Math.max(speed, total / (CONFIG.drawRunTime / game.stats.traceSpeedMult));
  game.draw = { phase: 'run', path: pts, seg: 0, segPos: 0, speed, rate, budget: d.budget, inside: new Map(), passes: new Map(), waveInside: new Map(), waveAcc: 0 };
  if (game.newBuild) onRunLaunch(game, d.fullCharge);
  game.events.push({ type: 'launch', gauge: d.gauge, x: sh.x, y: sh.y, dx, dy });
}

// Blink to the start of the path, leaving a few fading afterimages behind.
function warpTo(game, x, y) {
  const sh = game.ship;
  const dx = x - sh.x, dy = y - sh.y, dist = Math.hypot(dx, dy);
  if (dist < 1) return;
  const ux = dx / dist, uy = dy / dist, step = Math.min(26, dist / 5);
  for (let i = 0; i < 4; i++) {
    game.fx.ghosts.push({ x: sh.x + ux * step * i, y: sh.y + uy * step * i, life: 0.45 - i * 0.08, max: 0.45 });
  }
  game.fx.ghosts.push({ x0: sh.x, y0: sh.y, x1: x, y1: y, life: 0.18, max: 0.18, streak: true });
  sh.x = x; sh.y = y;
  sh.trail = [];
  addRing(game, x, y, 46, 'rgba(190,240,255,0.9)', 0.3);
  game.events.push({ type: 'warp', dist });
}

// Trace the polyline quickly (the world is nearly frozen); piercing costs dash speed, a bounce ends it.
function runAlongPath(game, realDt) {
  const r = game.draw, sh = game.ship;
  let dist = r.rate * realDt;
  while (dist > 1e-9 && r.seg < r.path.length - 1) {
    const a = r.path[r.seg], b = r.path[r.seg + 1];
    const segLen = Math.hypot(b.x - a.x, b.y - a.y);
    if (segLen < 1e-6) { r.seg++; r.segPos = 0; continue; }
    const ux = (b.x - a.x) / segLen, uy = (b.y - a.y) / segLen;
    const move = Math.min(dist, segLen - r.segPos);
    const x0 = sh.x, y0 = sh.y;
    // enemies the ship body has left can be hit again on the next pass
    const R = CONFIG.shipRadius;
    for (const [id, e] of r.inside) {
      if (e.dead || Math.hypot(x0 - e.x, y0 - e.y) > e.r + R + 2) r.inside.delete(id);
    }
    r.segPos += move; dist -= move;
    sh.x = a.x + ux * r.segPos; sh.y = a.y + uy * r.segPos;
    sh.vx = ux * r.speed; sh.vy = uy * r.speed;
    game.dashPeakAtk = Math.max(game.dashPeakAtk, attackPower(r.speed, game.stats));
    waveAlong(game, r, x0, y0, sh.x, sh.y);
    if (game.state !== 'play') return;
    if (collideEnemies(game, x0, y0, R, r)) {
      onRunTrail(game, r, x0, y0, sh.x, sh.y);
      game.draw = null; endTraceAttack(game); return;
    }
    onRunTrail(game, r, x0, y0, sh.x, sh.y);
    if (game.state !== 'play') return;
    const sp = Math.hypot(sh.vx, sh.vy);
    if (sp < r.speed) r.speed = sp;
    if (r.segPos >= segLen - 1e-9) { r.seg++; r.segPos = 0; }
  }
  if (r.seg >= r.path.length - 1) {
    game.draw = null;
    sh.glide = true; // retain launch speed while allowing ordinary cursor/stick steering
    sh.boostT = game.stats.boostDuration; // keep cruising along the last segment
    endTraceAttack(game);
  }
}

// Preview for the drawing UI: where the run would crit (hot) and the first thing that would stop it.
function previewPath(game, points = null) {
  const d = points ? { phase: 'draw', points, gauge: game.stats.gaugeMax } : game.draw;
  if (!d || d.phase !== 'draw' || d.points.length < 2) return { samples: [], block: null, targets: [] };
  const pts = d.points, sh = game.ship, R = CONFIG.shipRadius, W = waveRadius(game);
  const l = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y) || 1;
  const v = launchVelocity(sh.vx, sh.vy, (pts[1].x - pts[0].x) / l, (pts[1].y - pts[0].y) / l, d.gauge, game.stats);
  const atk = attackPower(Math.hypot(v.vx, v.vy), game.stats);
  const samples = [];
  const targets = new Map(); // enemy -> { crit, hits }
  let prev = new Set();
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    const n = Math.max(1, Math.ceil(len / 14));
    for (let k = 1; k <= n; k++) {
      const p = { x: a.x + (b.x - a.x) * k / n, y: a.y + (b.y - a.y) * k / n, hot: false };
      let blocked = false;
      const cur = new Set();
      queryGrid(game.grid, p.x - W - MAX_ENEMY_R, p.y - W - MAX_ENEMY_R, p.x + W + MAX_ENEMY_R, p.y + W + MAX_ENEMY_R, (e) => {
        const d2 = (p.x - e.x) ** 2 + (p.y - e.y) ** 2;
        if (d2 > (e.r + W) ** 2) return;
        const t = targets.get(e) || { crit: false, body: false };
        targets.set(e, t);
        if (d2 > (e.r + R) ** 2) return; // wave only
        cur.add(e);
        if (prev.has(e)) return; // still inside from the previous sample: same pass
        const crit = isWeakHit(e, p.x, p.y, game.stats.weakArcMult);
        if (crit) p.hot = true;
        if (!canPierce(atk, e, crit)) { blocked = true; return; }
        t.body = true; t.crit = t.crit || crit;
      });
      prev = cur;
      samples.push(p);
      if (blocked) return { samples, block: p, targets: [...targets] };
    }
  }
  return { samples, block: null, targets: [...targets] };
}

// ---- ship ----

function launch(game, ax, ay) {
  const sh = game.ship;
  const len = Math.hypot(ax, ay);
  let dx, dy;
  if (len < CONFIG.minDrag) {
    dx = sh.hx; dy = sh.hy;
  } else {
    dx = ax / len; dy = ay / len;
  }
  onLaunch(game);
  sh.aimAngle = Math.atan2(dy, dx);
  const v = launchVelocity(sh.vx, sh.vy, dx, dy, sh.gauge, game.stats);
  sh.vx = v.vx; sh.vy = v.vy;
  sh.boostT = game.stats.boostDuration;
  sh.fadeT = 0;
  sh.gaugeBank = 0;
  game.dashId++;
  game.events.push({ type: 'launch', gauge: sh.gauge, x: sh.x, y: sh.y, dx, dy });
}

// amount: hp lost, slow: share of speed lost (0..1)
function damageShip(game, amount, slow, cause = 'other') {
  const sh = game.ship;
  if (game.state !== 'play' || sh.invulnT > 0 || game.debug.invincible) return false;
  sh.hp -= amount * game.stats.damageTakenMult;
  if (slow > 0) sh.glide = false;
  const k = 1 - Math.min(0.9, slow * game.stats.hitSlowMult);
  sh.vx *= k; sh.vy *= k;
  sh.invulnT = CONFIG.invulnTime;
  game.events.push({ type: 'hurt', amount: amount * game.stats.damageTakenMult, x: sh.x, y: sh.y, cause });
  if (sh.hp <= 0) { beginShipDeath(game); return true; }
  addText(game, sh.x, sh.y - 30, `-${Math.round(amount * game.stats.damageTakenMult)}`, '#ff6b5a');
  onShipHurt(game);
  return true;
}

// R: hit radius of the ship (wider while tracing a drawn path).
// run: the trace state; while tracing, an enemy can be hit again each time the band re-enters it.
function collideEnemies(game, x0, y0, R = CONFIG.shipRadius, run = null) {
  const sh = game.ship, stats = game.stats;
  const x1 = sh.x, y1 = sh.y;
  const pad = R + MAX_ENEMY_R;
  const hits = [];
  queryGrid(game.grid, Math.min(x0, x1) - pad, Math.min(y0, y1) - pad, Math.max(x0, x1) + pad, Math.max(y0, y1) + pad, (e) => {
    if (run ? run.inside.has(e.id) : e.hitCD > 0) return;
    const t = segCircleT(x0, y0, x1, y1, e.x, e.y, e.r + R);
    if (t >= 0) hits.push({ e, t });
  });
  if (!hits.length) return false;
  hits.sort((a, b) => a.t - b.t);
  for (const { e, t } of hits) {
    if (e.dead) continue; // A preceding contact wave may already have removed this target.
    const hx = x0 + (x1 - x0) * t, hy = y0 + (y1 - y0) * t;
    const sp = Math.hypot(sh.vx, sh.vy);
    const ux = sp > 0 ? sh.vx / sp : 0, uy = sp > 0 ? sh.vy / sp : 0;
    const atk = attackPower(sp, stats);
    const weak = isWeakHit(e, hx, hy, stats.weakArcMult);
    const crit = weak || (game.newBuild && game.rng() < stats.critChance);
    const fast = !!run || sh.glide || sp >= stats.maxSpeed * 0.65;
    if (game.newBuild && !fast) {
      e.hitCD = 0.3;
      damageShip(game, e.contact, 0.1, `contact:${e.type}`);
      if (game.state === 'play') onRunElectricContact(game, e);
      continue;
    }
    const res = resolveRam(atk, e, crit, stats);
    if (res.pierce) {
      damageEnemy(game, e, res.damage, { crit, cause: 'ram', dirX: ux, dirY: uy, impactX: hx, impactY: hy });
      if (game.state === 'finishing') return false;
      if (crit) {
        const len = Math.hypot(hx - e.x, hy - e.y) || 1;
        addCombatImpact(game, e, 'weak', (hx - e.x) / len, (hy - e.y) / len);
      }
      e.hitCD = 0.3;
      if (run) {
        run.inside.set(e.id, e);
        const n = (run.passes.get(e.id) || 0) + 1;
        run.passes.set(e.id, n);
        if (n > 1) addText(game, e.x + e.r, e.y - e.r - 16, `×${n}`, crit ? '#ffe46b' : '#ffffff', 22 + 4 * Math.min(n, 5));
      }
      const keep = sh.glide || game.draw?.phase === 'run' ? 1 : pierceKeep(e, e.dead, stats);
      sh.vx *= keep; sh.vy *= keep;
      game.dashPierce++;
      onPierce(game, hx, hy);
      if (game.state === 'finishing') return false;
      onRunContact(game, e, hx, hy, ux, uy);
      if (game.state === 'finishing') return false;
      if (e.T.steal) { sh.glide = false; const k = 1 - e.T.steal * stats.hitSlowMult; sh.vx *= k; sh.vy *= k; game.events.push({ type: 'drain', x: e.x, y: e.y }); }
      if (crit) game.hitstop = Math.max(game.hitstop, e.dead ? 0.05 : 0.035);
      continue;
    }
    // bounce off
    sh.glide = false;
    let nx = hx - e.x, ny = hy - e.y;
    const nd = Math.hypot(nx, ny) || 1;
    nx /= nd; ny /= nd;
    addCombatImpact(game, e, 'block', nx, ny);
    sh.x = e.x + nx * (e.r + R + 1);
    sh.y = e.y + ny * (e.r + R + 1);
    const vn = sh.vx * nx + sh.vy * ny;
    if (vn < 0) { sh.vx -= 2 * vn * nx; sh.vy -= 2 * vn * ny; }
    sh.vx *= stats.bounceKeep; sh.vy *= stats.bounceKeep;
    if (Math.hypot(sh.vx, sh.vy) < 220) { sh.vx = nx * 220; sh.vy = ny * 220; }
    if (!stats.reflect) sh.boostT = 0;
    damageEnemy(game, e, res.damage, { crit, cause: 'bump', dirX: -nx, dirY: -ny });
    e.hitCD = 0.25;
    damageShip(game, res.shipDamage * stats.bounceDamageMult, 0, `bump:${e.type}`);
    onRunContact(game, e, hx, hy, ux, uy);
    game.events.push({ type: 'bounce', x: sh.x, y: sh.y });
    return true;
  }
  return false;
}

function collideBodies(game) {
  const sh = game.ship;
  const R = CONFIG.shipRadius;
  const f = game.field;
  const restitution = game.stats.reflect ? 0.9 : CONFIG.crashRestitution;
  for (const b of [f.planet, ...f.moons]) {
    const dx = sh.x - b.x, dy = sh.y - b.y;
    const d = Math.hypot(dx, dy);
    const min = b.r + R;
    if (d >= min || d === 0) continue;
    const nx = dx / d, ny = dy / d;
    sh.x = b.x + nx * min;
    sh.y = b.y + ny * min;
    const vn = sh.vx * nx + sh.vy * ny;
    if (vn < 0) {
      sh.glide = false;
      sh.vx -= (1 + restitution) * vn * nx;
      sh.vy -= (1 + restitution) * vn * ny;
      const dmg = Math.max(0, -vn - 200) * CONFIG.crashDamage * game.stats.bounceDamageMult;
      if (dmg > 0) damageShip(game, dmg, 0, b === f.planet ? 'planet' : 'moon');
      if (game.state !== 'play') return;
      game.events.push({ type: 'crash', x: sh.x, y: sh.y, power: -vn });
    }
  }
  // hard wall well outside the soft boundary
  const r = Math.hypot(sh.x, sh.y);
  const wall = CONFIG.fieldRadius + 500;
  if (r > wall) {
    sh.glide = false;
    const nx = sh.x / r, ny = sh.y / r;
    sh.x = nx * wall; sh.y = ny * wall;
    const vn = sh.vx * nx + sh.vy * ny;
    if (vn > 0) { sh.vx -= 2 * vn * nx; sh.vy -= 2 * vn * ny; }
  }
}

function recordTrail(sh, dt) {
  sh.trailAcc += dt;
  if (sh.trailAcc < 1 / 60) return;
  sh.trailAcc = 0;
  sh.trail.push({ x: sh.x, y: sh.y });
  if (sh.trail.length > 150) sh.trail.shift();
}

// ---- enemies ----

function flushNewEnemies(game) {
  if (!game.newEnemies.length) return;
  const limit = Math.ceil(phaseTarget(game.t).pop * (1 + CONFIG.enemySplitOverflow));
  let population = 0;
  for (const e of game.enemies) if (!e.dead && e.type !== 'meteor' && e.type !== 'boss') population++;
  for (const e of game.newEnemies) {
    if (population >= limit) break;
    game.enemies.push(e);
    population++;
  }
  game.newEnemies.length = 0;
}

// ---- pickups ----

function updateGems(game, dt) {
  const sh = game.ship;
  const pr = game.stats.pickupRadius;
  const sp = Math.hypot(sh.vx, sh.vy);
  for (const g of game.gems) {
    g.age += dt;
    const dx = sh.x - g.x, dy = sh.y - g.y;
    const d = Math.hypot(dx, dy);
    if (d < pr || g.pulled) {
      g.pulled = true;
      const pull = 700 + sp * 1.2;
      g.x += (dx / (d || 1)) * pull * dt;
      g.y += (dy / (d || 1)) * pull * dt;
    }
    if (d < CONFIG.shipRadius + 14) { g.taken = true; addXp(game, g.v); }
  }
  if (game.gems.some((g) => g.taken)) game.gems = game.gems.filter((g) => !g.taken);
  for (const c of game.coinDrops) {
    const dx = sh.x - c.x, dy = sh.y - c.y;
    const d = Math.hypot(dx, dy);
    if (d < pr * 1.3 || c.pulled) {
      c.pulled = true;
      const pull = 700 + sp * 1.2;
      c.x += (dx / (d || 1)) * pull * dt;
      c.y += (dy / (d || 1)) * pull * dt;
    }
    if (d < CONFIG.shipRadius + 14) { c.taken = true; game.coins += c.v; game.events.push({ type: 'coin' }); }
  }
  if (game.coinDrops.some((c) => c.taken)) game.coinDrops = game.coinDrops.filter((c) => !c.taken);
}

function addXp(game, v) {
  game.xp += v;
    let need = xpForLevel(game.level);
  while (game.xp >= need) {
    game.xp -= need;
    game.level++;
    if (game.newBuild) game.pendingLevelups++;
    game.ship.hp = Math.min(game.stats.maxHp, game.ship.hp + game.stats.maxHp * CONFIG.levelHeal);
    game.events.push({ type: 'levelup', level: game.level });
    need = xpForLevel(game.level);
    refreshStats(game); // deferred level choices never interrupt the traced movement
    addText(game, game.ship.x, game.ship.y - 34, `Lv ${game.level}`, '#6dffb0', 18);
  }
}

// ---- fx ----

function updateFx(game, dt) {
  const P = game.fx.particles;
  for (const p of P) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - 2.5 * dt; p.vy *= 1 - 2.5 * dt; p.life -= dt; if (p.spin) p.angle += p.spin * dt; }
  game.fx.particles = P.filter((p) => p.life > 0);
  for (const t of game.fx.texts) { t.y -= 40 * dt; t.life -= dt; }
  for (const g of game.fx.ghosts) g.life -= dt;
  game.fx.ghosts = game.fx.ghosts.filter((g) => g.life > 0);
  game.fx.texts = game.fx.texts.filter((t) => t.life > 0);
  for (const r of game.fx.rings) r.life -= dt;
  game.fx.rings = game.fx.rings.filter((r) => r.life > 0);
  for (const loop of game.fx.loops) loop.life -= dt;
  game.fx.loops = game.fx.loops.filter((loop) => loop.life > 0);
  for (const impact of game.fx.impacts) impact.life -= dt;
  game.fx.impacts = game.fx.impacts.filter((impact) => impact.life > 0);
}

// ---- prediction ----

// Ballistic preview of a launch along (dx, dy) with the given gauge, under gravity only.
