  const a = Math.min(1, t / 0.25, b.life / 0.6);
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  ctx.font = `800 ${Math.min(54, W / 10)}px "Hiragino Sans", "Noto Sans JP", sans-serif`;
  ctx.fillText(b.text, W / 2, H * 0.3);
  if (b.sub) {
    ctx.font = `16px "Hiragino Sans", "Noto Sans JP", sans-serif`;
    ctx.fillStyle = '#b8c6ea';
    ctx.fillText(b.sub, W / 2, H * 0.3 + 30);
  }
  ctx.globalAlpha = 1;
}

function drawZones(r) {
  const { ctx } = r;
  const z = r.cam.zoom;
  const g = ctx.createRadialGradient(0, 0, CONFIG.planetRadius, 0, 0, CONFIG.zoneInner);
  g.addColorStop(0, 'rgba(255,70,50,0.16)');
  g.addColorStop(1, 'rgba(255,70,50,0.02)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.zoneInner, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(150,70,255,0.07)';
  ctx.beginPath();
  ctx.arc(0, 0, CONFIG.fieldRadius, 0, TAU);
  ctx.arc(0, 0, CONFIG.zoneOuter, 0, TAU, true);
  ctx.fill();
  ctx.lineWidth = 2 / z;
  ctx.setLineDash([30 / z, 24 / z]);
  ctx.strokeStyle = 'rgba(255,110,90,0.35)';
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.zoneInner, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(170,120,255,0.35)';
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.zoneOuter, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.lineWidth = 6 / z;
  ctx.strokeStyle = 'rgba(190,120,255,0.8)';
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.fieldRadius, 0, TAU); ctx.stroke();
}

function drawDust(r, game) {
  const { ctx } = r;
  for (const d of game.field.dust) {
    if (!onScreen(r, d.x, d.y, d.r)) continue;
    const g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r);
    g.addColorStop(0, 'rgba(170,130,210,0.20)');
    g.addColorStop(0.7, 'rgba(140,100,190,0.10)');
    g.addColorStop(1, 'rgba(140,100,190,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill();
  }
}

function onScreen(r, x, y, rad) {
  const halfW = r.W / 2 / r.cam.zoom + rad, halfH = r.H / 2 / r.cam.zoom + rad;
  return Math.abs(x - r.cam.x) < halfW && Math.abs(y - r.cam.y) < halfH;
}

function drawBodies(r, game) {
  const { ctx } = r;
  const p = game.field.planet;
  if (onScreen(r, p.x, p.y, p.r * 1.6)) {
    const halo = ctx.createRadialGradient(0, 0, p.r * 0.9, 0, 0, p.r * 1.6);
    halo.addColorStop(0, 'rgba(90,160,255,0.45)');
    halo.addColorStop(1, 'rgba(90,160,255,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(0, 0, p.r * 1.6, 0, TAU); ctx.fill();
    const body = ctx.createRadialGradient(-p.r * 0.35, -p.r * 0.35, p.r * 0.1, 0, 0, p.r);
    body.addColorStop(0, '#6a8cff');
    body.addColorStop(0.6, '#2b3d8f');
    body.addColorStop(1, '#0d1238');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(0, 0, p.r, 0, TAU); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, p.r, 0, TAU); ctx.clip();
    ctx.strokeStyle = 'rgba(160,190,255,0.12)';
    ctx.lineWidth = p.r * 0.08;
    for (let i = -3; i <= 3; i++) {
      ctx.beginPath(); ctx.ellipse(0, i * p.r * 0.25, p.r * 1.1, p.r * 0.06, 0.15, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  }
  for (const m of game.field.moons) {
    if (!onScreen(r, m.x, m.y, m.r * 3)) continue;
    const halo = ctx.createRadialGradient(m.x, m.y, m.r, m.x, m.y, m.r * 3);
    halo.addColorStop(0, 'rgba(200,170,120,0.12)');
    halo.addColorStop(1, 'rgba(200,170,120,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r * 3, 0, TAU); ctx.fill();
    const body = ctx.createRadialGradient(m.x - m.r * 0.3, m.y - m.r * 0.3, m.r * 0.1, m.x, m.y, m.r);
    body.addColorStop(0, '#b9a58a');
    body.addColorStop(1, '#4a3d33');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    for (let k = 0; k < 4; k++) {
      const a = k * 1.9 + m.orbit, d = m.r * (0.2 + 0.15 * k);
      ctx.beginPath(); ctx.arc(m.x + Math.cos(a) * d, m.y + Math.sin(a) * d, m.r * 0.16, 0, TAU); ctx.fill();
    }
  }
}

// Draw scheme: while charging, show how far a path could reach.
function drawReach(r, game) {
  const sh = game.ship;
  const reach = drawBudget(game, sh.gauge);
  const { ctx } = r;
  const z = r.cam.zoom;
  ctx.strokeStyle = sh.gauge >= 1 ? 'rgba(255,228,107,0.7)' : 'rgba(159,232,255,0.55)';
  ctx.lineWidth = 2 / z;
  ctx.setLineDash([14 / z, 10 / z]);
  ctx.beginPath(); ctx.arc(sh.x, sh.y, reach, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
}

function drawPortalRoute(r, origin, target, color, width, arrow = false) {
  const { ctx } = r, z = r.cam.zoom;
  ctx.strokeStyle = color; ctx.lineWidth = width / z;
  ctx.beginPath(); ctx.moveTo(origin.x, origin.y); ctx.lineTo(target.x, target.y); ctx.stroke();
  if (!arrow) return;
  const angle = Math.atan2(target.y - origin.y, target.x - origin.x);
  const x = target.x - Math.cos(angle) * 26 / z, y = target.y - Math.sin(angle) * 26 / z;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(x, y);
  ctx.lineTo(x - Math.cos(angle - 0.5) * 18 / z, y - Math.sin(angle - 0.5) * 18 / z);
  ctx.lineTo(x - Math.cos(angle + 0.5) * 18 / z, y - Math.sin(angle + 0.5) * 18 / z);
  ctx.closePath(); ctx.fill();
}

function drawPortals(r, game) {
  if (game.scheme !== 'portal') return;
  const { ctx } = r, z = r.cam.zoom, sh = game.ship, d = game.portalDash;
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (d?.path.length) {
    ctx.beginPath(); ctx.moveTo(d.path[0].x, d.path[0].y);
    for (let i = 1; i < d.path.length; i++) ctx.lineTo(d.path[i].x, d.path[i].y);
    ctx.lineTo(sh.x, sh.y);
    ctx.strokeStyle = 'rgba(95,216,255,0.18)'; ctx.lineWidth = 12 / z; ctx.stroke();
    ctx.strokeStyle = 'rgba(145,235,255,0.85)'; ctx.lineWidth = 3 / z; ctx.stroke();
  }
  const choices = portalChoices(game), labels = new Map(choices.map((c) => [c.portal.id, c.key]));
  const origin = d?.phase === 'hop' ? d.target : sh;
  const next = d ? d.next : game.portalPreview;
  // Every selectable edge is drawn, including those extending beyond the viewport.
  if (d) for (const { portal } of choices) drawPortalRoute(r, origin, portal, 'rgba(160,210,235,0.3)', 1.2);
  if (next) {
    drawPortalRoute(r, origin, next, 'rgba(255,228,107,0.2)', 10);
    drawPortalRoute(r, origin, next, '#ffe46b', 4, true);
    ctx.strokeStyle = '#ffe46b'; ctx.lineWidth = 3 / z;
    ctx.beginPath(); ctx.arc(next.x, next.y, 28 / z, 0, TAU); ctx.stroke();
  }
  const target = d?.phase === 'hop' ? d.target : next;
  if (d?.phase === 'hop') drawPortalRoute(r, sh, d.target, '#d8f7ff', 3, true);
  for (const p of game.portals) {
    if (!onScreen(r, p.x, p.y, 80 / z)) continue;
    const selected = p === next, selectable = labels.has(p.id);
    const color = selected ? '#ffe46b' : p.manual ? '#5fd8ff' : '#c995ff';
    ctx.save(); ctx.globalAlpha = selectable || p === target ? 1 : 0.4;
    ctx.strokeStyle = color; ctx.lineWidth = (selected ? 3.5 : 2) / z;
    ctx.fillStyle = p.manual ? 'rgba(50,150,210,0.18)' : 'rgba(150,80,220,0.2)';
    const R = 20 / z;
    ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(p.x, p.y, R * 0.65, game.t * 2, game.t * 2 + Math.PI * 1.5); ctx.stroke();
    ctx.font = `bold ${12 / z}px ${MONO}`; ctx.textAlign = 'center'; ctx.fillStyle = '#eef8ff';
    ctx.fillText(p.manual ? '∞' : String(p.uses), p.x, p.y + 4 / z);
    if (selected) {
      ctx.font = `bold ${16 / z}px "Hiragino Sans", sans-serif`;
      ctx.fillStyle = '#08101c'; ctx.fillRect(p.x - 32 / z, p.y - 50 / z, 64 / z, 24 / z);
      ctx.fillStyle = '#ffe46b'; ctx.fillText(`次 ${labels.get(p.id) || ''}`, p.x, p.y - 32 / z);
    }
    ctx.restore();
  }
  if (target) {
    ctx.strokeStyle = 'rgba(95,216,255,0.14)'; ctx.lineWidth = waveRadius(game) * 2;
    ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(target.x, target.y); ctx.stroke();
    if (game.stats.portalWave) {
      ctx.strokeStyle = 'rgba(201,149,255,0.5)'; ctx.lineWidth = 1.5 / z;
      ctx.beginPath(); ctx.arc(target.x, target.y, CONFIG.portalWaveRadius * game.stats.waveRadiusMult, 0, TAU); ctx.stroke();
    }
    if (d?.phase !== 'hop') {
      const preview = previewPath(game, [{ x: sh.x, y: sh.y }, target]);
      for (const [e, t] of preview.targets) {
        ctx.strokeStyle = t.crit ? '#ffe46b' : t.body ? '#ffffff' : '#5fd8ff'; ctx.lineWidth = 2 / z;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 5 / z, 0, TAU); ctx.stroke();
      }
      if (preview.block) {
        const q = preview.block, k = 10 / z;
        ctx.strokeStyle = '#ff6b5a'; ctx.lineWidth = 3 / z;
        ctx.beginPath(); ctx.moveTo(q.x - k, q.y - k); ctx.lineTo(q.x + k, q.y + k);
        ctx.moveTo(q.x + k, q.y - k); ctx.lineTo(q.x - k, q.y + k); ctx.stroke();
      }
    }
  }
  ctx.restore();
}

function drawPortalHud(r, game) {
  if (game.scheme !== 'portal' || game.state !== 'play') return;
  const { ctx, W, H } = r, d = game.portalDash, press = game.portalSpace;
  const choices = portalChoices(game), index = choices.findIndex((c) => c.portal === d?.next);
  const bw = Math.min(360, W - 32), x = (W - bw) / 2, y = H - 145;
  ctx.fillStyle = 'rgba(8,12,28,0.88)'; ctx.fillRect(x - 8, y - 17, bw + 16, 91);
  ctx.textAlign = 'center'; ctx.fillStyle = '#e8f6ff';
  ctx.font = `${Math.min(13, Math.max(9, (W - 32) / 34))}px "Hiragino Sans", sans-serif`;
  ctx.fillText(d ? `A / D 選択 ${index + 1}/${choices.length}・Space 短押しで移動` : 'Space 短押しで最寄りポータルへ', W / 2, y);
  ctx.fillStyle = '#b8c6ea';
  ctx.fillText(d ? `Space ${CONFIG.portalExitHold.toFixed(1)}秒長押しで離脱` : 'WASD 移動・B ポータル設置', W / 2, y + 18);
  ctx.fillStyle = '#9fe8ff'; ctx.fillRect(x, y + 30, bw * (d ? d.remaining / d.budget : 1), 5);
  const holding = press.armed && !press.consumed;
  if (holding && d) {
    ctx.fillStyle = '#ffb340'; ctx.fillRect(x, y + 40, bw * Math.min(1, press.seconds / CONFIG.portalExitHold), 4);
  }
  ctx.font = `11px ${MONO}`; ctx.fillStyle = holding && d ? '#ffcf83' : '#b8c6ea';
  ctx.fillText(d ? (holding ? `離脱まで ${(Math.max(0, CONFIG.portalExitHold - press.seconds)).toFixed(1)} 秒`
    : !d.next ? '行き先なし・到着後に自動離脱' : d.phase === 'hop' ? '移動中・A/Dで次を選択できる' : '黄色い太線が次の行き先')
    : `ゲージ不要・ポータル ${game.portals.length}`, W / 2, y + 60);
  for (const c of choices) {
    if (onScreen(r, c.portal.x, c.portal.y, 0)) continue;
    const p = worldToScreen(r, c.portal.x, c.portal.y);
    const px = clamp(p.x, 36, W - 36), py = clamp(p.y, Math.min(88, H * 0.2), Math.max(H * 0.2, H - 175));
    ctx.fillStyle = 'rgba(8,12,28,0.85)'; ctx.fillRect(px - 32, py - 15, 64, 30);
    ctx.font = `bold 16px ${MONO}`; ctx.fillStyle = c.portal === d?.next ? '#ffe46b' : '#8bb9ca';
    ctx.fillText(c.portal === d?.next ? `次 ${c.key}` : c.key, px, py + 5);
  }
}

function drawPathUi(r, game) {
  const d = game.draw;
  if (!d) return;
  const { ctx } = r;
  const z = r.cam.zoom;
  const sh = game.ship;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (d.phase === 'run') {
    ctx.strokeStyle = 'rgba(159,232,255,0.14)';
    ctx.lineWidth = waveRadius(game) * 2;
    ctx.beginPath(); ctx.moveTo(sh.x, sh.y);
    for (let i = d.seg + 1; i < d.path.length; i++) ctx.lineTo(d.path[i].x, d.path[i].y);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(159,232,255,0.4)';
    ctx.lineWidth = 4 / z;
    ctx.setLineDash([10 / z, 8 / z]);
    ctx.beginPath(); ctx.moveTo(sh.x, sh.y);
    for (let i = d.seg + 1; i < d.path.length; i++) ctx.lineTo(d.path[i].x, d.path[i].y);
    ctx.stroke();
    ctx.setLineDash([]);
    return;
  }
  const pts = d.points;
  if (!pts.length) {
    // not started yet: the ship will blink to wherever the player clicks
    if (!d.cursor) return;
    ctx.strokeStyle = 'rgba(214,246,255,0.25)';
    ctx.lineWidth = 2 / z;
    ctx.setLineDash([4 / z, 10 / z]);
    ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(d.cursor.x, d.cursor.y); ctx.stroke();
    ctx.setLineDash([8 / z, 6 / z]);
    ctx.strokeStyle = 'rgba(214,246,255,0.8)';
    ctx.beginPath(); ctx.arc(d.cursor.x, d.cursor.y, CONFIG.shipRadius + 6 / z, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    return;
  }
  const line = () => { ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (const p of pts) ctx.lineTo(p.x, p.y); };
  if (pts.length > 1) {
    // the band is the real hit width of the trace
    line(); ctx.strokeStyle = 'rgba(95,216,255,0.16)'; ctx.lineWidth = waveRadius(game) * 2; ctx.stroke();
    line(); ctx.strokeStyle = 'rgba(159,232,255,0.35)'; ctx.lineWidth = 2 / z; ctx.setLineDash([]);
    ctx.stroke();
    line(); ctx.strokeStyle = '#d6f6ff'; ctx.lineWidth = 3.5 / z; ctx.stroke();
  }
  if (d.inputMethod === 'points') {
    ctx.fillStyle = '#d6f6ff';
    for (const p of pts) { ctx.beginPath(); ctx.arc(p.x, p.y, 5 / z, 0, TAU); ctx.fill(); }
  }
  const last = pts[pts.length - 1];
  if (d.cursor && d.used < d.budget - 0.5) {
    ctx.strokeStyle = 'rgba(214,246,255,0.3)';
    ctx.lineWidth = 2 / z;
    ctx.setLineDash([6 / z, 8 / z]);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(d.cursor.x, d.cursor.y); ctx.stroke();
    ctx.setLineDash([]);
  }
  if (game.newBuild) {
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(last.x, last.y, 5 / z, 0, TAU); ctx.fill(); return;
  }
  const pv = previewPath(game);
  // enemies the band will cut: white ring, yellow if through the weak spot
  for (const [e, t] of pv.targets) {
    // white/yellow: the ship body cuts it; cyan: only the wave reaches it
    ctx.strokeStyle = t.crit ? '#ffe46b' : t.body ? 'rgba(255,255,255,0.9)' : 'rgba(120,225,255,0.85)';
    ctx.lineWidth = 3 / z;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 7 / z, 0, TAU); ctx.stroke();
  }
  ctx.fillStyle = '#ffe46b';
  for (const p of pv.samples) if (p.hot) { ctx.beginPath(); ctx.arc(p.x, p.y, 6 / z, 0, TAU); ctx.fill(); }
  if (pv.block) {
    const k = 12 / z, b = pv.block;
    ctx.strokeStyle = '#ff4d4d'; ctx.lineWidth = 4 / z;
    ctx.beginPath(); ctx.moveTo(b.x - k, b.y - k); ctx.lineTo(b.x + k, b.y + k); ctx.moveTo(b.x + k, b.y - k); ctx.lineTo(b.x - k, b.y + k); ctx.stroke();
  }
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(last.x, last.y, 5 / z, 0, TAU); ctx.fill();
}

// One cursor ring shows charge before drawing and remaining path length while drawing.
function drawDrawingHud(r, game, pointer) {
  if (!isDrawScheme(game.scheme) || game.state !== 'play') return;
  const d = game.draw;
  if (d && d.phase !== 'draw') return;
  const { ctx, W, H } = r;
  if (r.mobile && !d) return;
  const tip = d?.points[d.points.length - 1] || d?.cursor;
  const p = tip ? worldToScreen(r, tip.x, tip.y)
    : pointer?.hover && pointer.pointerType !== 'touch' ? pointer.hover
    : worldToScreen(r, game.ship.x, game.ship.y);
  const frac = clamp(d ? 1 - d.used / d.budget : game.dashMeter, 0, 1);
  const drawing = d?.started;
  const ready = !d && frac >= (game.newBuild ? CONFIG.drawMinCharge : 1);
  const color = ready ? (frac >= 1 ? '#ffe46b' : '#6dffb0') : drawing && frac < 0.2 ? '#ffd24a' : '#9fe8ff';
  const radius = 24, x = clamp(p.x, radius + 4, W - radius - 4), y = clamp(p.y, radius + 4, H - radius - 24);
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineWidth = 8;
  ctx.strokeStyle = 'rgba(3,8,20,0.9)';
  ctx.beginPath(); ctx.arc(x, y, radius, 0, TAU); ctx.stroke();
  ctx.lineWidth = 4;
  ctx.strokeStyle = 'rgba(190,215,255,0.22)';
  ctx.beginPath(); ctx.arc(x, y, radius, 0, TAU); ctx.stroke();
  ctx.strokeStyle = color;
  if (frac > 0) { ctx.beginPath(); ctx.arc(x, y, radius, -Math.PI / 2, -Math.PI / 2 + TAU * frac); ctx.stroke(); }
  const pointInput = (d?.inputMethod || CONFIG.drawInput) === 'points';
  const label = r.mobile ? (drawing ? `残り ${Math.ceil(frac * 100)}% · 離すと発動` : '指で軌跡を描く') : drawing ? `残り ${Math.ceil(frac * 100)}%${pointInput ? '　右クリック／Spaceで発動' : ''}`
    : ready || d ? (pointInput ? 'クリックで開始点' : pointer?.pointerType === 'touch' ? 'タップで描く' : `クリックで描く ${Math.floor(frac * 100)}%`) : `充填 ${Math.floor(frac * 100)}%`;
  ctx.font = `12px "Hiragino Sans", "Noto Sans JP", sans-serif`;
  ctx.textAlign = 'center';
  ctx.lineWidth = 4;
  ctx.strokeStyle = 'rgba(3,8,20,0.95)';
  const lx = clamp(x, ctx.measureText(label).width / 2 + 4, W - ctx.measureText(label).width / 2 - 4);
  const labelY = r.mobile ? Math.max(15, y - radius - 12) : y + radius + 17;
  ctx.strokeText(label, lx, labelY);
  ctx.fillStyle = color;
  ctx.fillText(label, lx, labelY);
  ctx.restore();
}

function drawPrediction(r, game) {
  const sh = game.ship;
  if (!sh.charging) return;
  if (isDrawScheme(game.scheme)) { drawReach(r, game); return; }
  let ax = sh.aimX, ay = sh.aimY;
  if (Math.hypot(ax, ay) < CONFIG.minDrag) { ax = sh.vx; ay = sh.vy; }
  if (Math.hypot(ax, ay) < 1) return;
  const pts = annotatePrediction(game, predictPath(game, ax, ay, sh.gauge, game.stats.predictTime), game.stats.predictTime);
  const { ctx } = r;
  const dot = 3.2 / r.cam.zoom;
  for (let i = 2; i < pts.length; i += 3) {
    const p = pts[i];
    ctx.globalAlpha = 0.85 * (1 - i / pts.length) + 0.1;
    ctx.fillStyle = p.hot ? '#ffe46b' : p.bounced ? '#c9a6ff' : '#9fe8ff';
    const s = p.hot ? dot * 2 : dot;
    ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const end = pts[pts.length - 1];
  if (end && end.block) {
    const k = 10 / r.cam.zoom;
    ctx.strokeStyle = '#ff4d4d';
    ctx.lineWidth = 3 / r.cam.zoom;
    ctx.beginPath();
    ctx.moveTo(end.x - k, end.y - k); ctx.lineTo(end.x + k, end.y + k);
    ctx.moveTo(end.x + k, end.y - k); ctx.lineTo(end.x - k, end.y + k);
    ctx.stroke();
  }
}

function shapePath(ctx, shape, R) {
  ctx.beginPath();
  if (shape === 'hex') {
    for (let i = 0; i < 6; i++) { const a = i * TAU / 6; ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R); }
    ctx.closePath();
  } else if (shape === 'dart') {
    ctx.moveTo(R * 1.2, 0); ctx.lineTo(-R * 0.8, R * 0.8); ctx.lineTo(-R * 0.4, 0); ctx.lineTo(-R * 0.8, -R * 0.8); ctx.closePath();
  } else if (shape === 'diamond') {
    ctx.moveTo(R, 0); ctx.lineTo(0, R * 0.8); ctx.lineTo(-R, 0); ctx.lineTo(0, -R * 0.8); ctx.closePath();
  } else if (shape === 'blob') {
    for (let i = 0; i < 10; i++) { const a = i * TAU / 10, k = i % 2 ? 0.82 : 1; ctx.lineTo(Math.cos(a) * R * k, Math.sin(a) * R * k); }
    ctx.closePath();
  } else if (shape === 'ship') {
    ctx.moveTo(R * 1.3, 0); ctx.lineTo(R * 0.3, R * 0.55); ctx.lineTo(-R, R * 0.6); ctx.lineTo(-R * 0.8, 0); ctx.lineTo(-R, -R * 0.6); ctx.lineTo(R * 0.3, -R * 0.55); ctx.closePath();
  } else if (shape === 'rock') {
    for (let i = 0; i < 8; i++) { const a = i * TAU / 8, k = 0.8 + ((i * 37) % 5) * 0.06; ctx.lineTo(Math.cos(a) * R * k, Math.sin(a) * R * k); }
    ctx.closePath();
  } else {
    ctx.arc(0, 0, R, 0, TAU);
  }
}

function drawMeteor(r, e) {
  const { ctx } = r, R = e.r;
  if (e.worldMeteor?.rareWeapon) {
    const halo = ctx.createRadialGradient(0, 0, R * 0.6, 0, 0, R * 2);
    halo.addColorStop(0, 'rgba(255,230,150,0.55)'); halo.addColorStop(1, 'rgba(255,200,80,0)');
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(0, 0, R * 2, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#ffe4a5'; ctx.lineWidth = 2 / r.cam.zoom;
    ctx.beginPath(); ctx.arc(0, 0, R * 1.3, e.facing, e.facing + Math.PI * 1.6); ctx.stroke();
    for (let i = 0; i < 5; i++) {
      const a = e.facing * 2 + i * TAU / 5, x = Math.cos(a) * R * 1.6, y = Math.sin(a) * R * 1.6;
      ctx.fillStyle = '#fff4d2'; ctx.fillRect(x - 2 / r.cam.zoom, y - 2 / r.cam.zoom, 4 / r.cam.zoom, 4 / r.cam.zoom);
    }
  }
  if (e.worldMeteor?.kind === 'comet') {
    const speed = Math.hypot(e.vx, e.vy) || 1;
    ctx.strokeStyle = 'rgba(221,192,154,0.3)'; ctx.lineWidth = R * 0.9;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-e.vx / speed * 330, -e.vy / speed * 330); ctx.stroke();
    ctx.strokeStyle = '#eee1cf'; ctx.lineWidth = R * 0.18;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-e.vx / speed * 180, -e.vy / speed * 180); ctx.stroke();
  }
  ctx.rotate(e.facing);
  ctx.beginPath();
  for (let i = 0; i < 11; i++) {
    const a = i * TAU / 11, k = 0.72 + ((e.id * 17 + i * 37) % 29) / 100;
    ctx.lineTo(Math.cos(a) * R * k, Math.sin(a) * R * k);
  }
  ctx.closePath(); ctx.fillStyle = e.flash > 0 ? '#e6e4df' : '#706a63'; ctx.fill();
  ctx.strokeStyle = '#aaa49a'; ctx.lineWidth = Math.max(1 / r.cam.zoom, R * 0.035); ctx.stroke();
  // Uneven facets and recessed craters, without the ship's eye or armor ring.
  ctx.fillStyle = 'rgba(30,25,21,0.3)';
  ctx.beginPath(); ctx.moveTo(-R * 0.65, -R * 0.25); ctx.lineTo(-R * 0.1, R * 0.15);
  ctx.lineTo(R * 0.7, R * 0.1); ctx.lineTo(R * 0.3, R * 0.75); ctx.lineTo(-R * 0.5, R * 0.55); ctx.closePath(); ctx.fill();
  for (let i = 0; i < 3; i++) {
    const a = (e.id * 0.7 + i * 2.2), d = R * (i === 0 ? 0.2 : 0.48), size = R * (0.12 + i * 0.03);
    const x = Math.cos(a) * d, y = Math.sin(a) * d;
    ctx.fillStyle = '#514d47'; ctx.beginPath(); ctx.ellipse(x, y, size, size * 0.75, a, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#91897d'; ctx.lineWidth = R * 0.025;
    ctx.beginPath(); ctx.ellipse(x, y, size, size * 0.75, a, 0.15, Math.PI); ctx.stroke();
  }
  if (e.hp < e.maxHp) {
    ctx.strokeStyle = '#302c28'; ctx.lineWidth = Math.max(1 / r.cam.zoom, R * 0.05);
    ctx.beginPath(); ctx.moveTo(-R * 0.7, -R * 0.5); ctx.lineTo(-R * 0.1, -R * 0.1);
    ctx.lineTo(R * 0.1, R * 0.25); ctx.lineTo(R * 0.65, R * 0.55); ctx.stroke();
  }
}

function drawEnemies(r, game) {
  const { ctx } = r;
  const z = r.cam.zoom;
  const sp = Math.hypot(game.ship.vx, game.ship.vy);
  const atk = attackPower(sp, game.stats);
  const arcMult = game.stats.weakArcMult;
  for (const e of game.enemies) {
    if (e.dead || !onScreen(r, e.x, e.y, e.r + 220)) continue;
    const R = e.r;
    ctx.save();
    ctx.translate(e.x, e.y);
    if (e.type === 'meteor') { drawMeteor(r, e); ctx.restore(); continue; }
    if (e.T.auraR) {
      const g = ctx.createRadialGradient(0, 0, R, 0, 0, e.T.auraR);
      g.addColorStop(0, 'rgba(199,125,255,0.22)');
      g.addColorStop(1, 'rgba(199,125,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, e.T.auraR, 0, TAU); ctx.fill();
    }
    if (e.state === 'windup') {
      ctx.strokeStyle = 'rgba(255,90,60,0.7)';
      ctx.lineWidth = 3 / z;
      ctx.setLineDash([12 / z, 8 / z]);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(e.facing) * 500, Math.sin(e.facing) * 500); ctx.stroke();
      ctx.setLineDash([]);
    }
    if (e.charge > 0) {
      ctx.fillStyle = `rgba(255,80,80,${0.25 + 0.5 * e.charge})`;
      ctx.beginPath(); ctx.arc(Math.cos(e.facing) * R, Math.sin(e.facing) * R, (4 + 8 * e.charge) / Math.sqrt(z), 0, TAU); ctx.fill();
    }
    const pierce = atk >= e.armor;
    const critOnly = !!e.weakArc && !pierce && atk >= e.armor * CRIT_ARMOR;
    // body
    ctx.save();
    ctx.rotate(e.facing);
    shapePath(ctx, e.T.shape, R);
    ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.T.color;
    ctx.globalAlpha = pierce ? 1 : 0.8;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.lineWidth = Math.max(1.5 / z, R * 0.08);
    ctx.strokeStyle = e.elite ? '#ffcf4a' : pierce ? 'rgba(255,255,255,0.85)' : 'rgba(40,0,0,0.6)';
    ctx.stroke();
    // eye / nose shows facing
    ctx.fillStyle = '#0b0f1e';
    ctx.beginPath(); ctx.arc(R * 0.45, 0, R * 0.2, 0, TAU); ctx.fill();
    ctx.restore();
    // weak spot
    if (e.weakArc) {
      const wa = e.facing + e.weakDir, half = Math.min(Math.PI, e.weakArc * arcMult);
      const lw = Math.max(4 / z, R * 0.32);
      ctx.strokeStyle = '#ffe46b';
      ctx.lineWidth = lw;
      ctx.beginPath(); ctx.arc(0, 0, R + lw * 0.3, wa - half, wa + half); ctx.stroke();
      if (e.weakDir2 !== undefined) {
        const wb = e.facing + e.weakDir2;
        ctx.beginPath(); ctx.arc(0, 0, R + lw * 0.3, wb - half, wb + half); ctx.stroke();
      }
    }
    // cannot pierce: red ring (orange dashed = only through the weak spot)
    if (!pierce) {
      ctx.lineWidth = 3 / z;
      ctx.strokeStyle = critOnly ? '#ff9f40' : '#ff3b3b';
      if (critOnly) ctx.setLineDash([8 / z, 6 / z]);
      ctx.beginPath(); ctx.arc(0, 0, R + 9 / z + R * 0.2, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    }
    if (e.hp < e.maxHp) {
      const w = Math.max(R * 2, 30 / z), h = 4 / z;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(-w / 2, -R - 16 / z, w, h);
      ctx.fillStyle = '#ff6b5a';
      ctx.fillRect(-w / 2, -R - 16 / z, w * Math.max(0, e.hp / e.maxHp), h);
    }
    ctx.restore();
  }
}

function drawEnemyBullets(r, game) {
  const { ctx } = r;
  const z = r.cam.zoom;
  for (const b of game.ebullets) {
    if (!onScreen(r, b.x, b.y, 40)) continue;
    const s = b.r / Math.sqrt(z);
    if (b.kind === 'missile') {
      const a = Math.atan2(b.vy, b.vx);
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(a);
      ctx.fillStyle = '#ffb36b';
      ctx.beginPath(); ctx.moveTo(s * 1.6, 0); ctx.lineTo(-s, s * 0.7); ctx.lineTo(-s, -s * 0.7); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,200,120,0.5)';
      ctx.beginPath(); ctx.arc(-s * 1.6, 0, s * 0.6, 0, TAU); ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = '#ff4055';
      ctx.beginPath(); ctx.arc(b.x, b.y, s, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#3a0716'; ctx.lineWidth = 1.4 / z; ctx.stroke();
      ctx.fillStyle = '#250b16';
      ctx.beginPath(); ctx.arc(b.x, b.y, s * 0.48, 0, TAU); ctx.fill();
    }
  }
}

function drawFx(r, game) {
  const { ctx } = r;
  const z = r.cam.zoom;
  for (const loop of game.fx.loops) {
    const a = Math.max(0, loop.life / loop.max);
    ctx.beginPath(); ctx.moveTo(loop.points[0].x, loop.points[0].y);
    for (let i = 1; i < loop.points.length; i++) ctx.lineTo(loop.points[i].x, loop.points[i].y);
    ctx.closePath(); ctx.fillStyle = loop.color; ctx.globalAlpha = 0.3 * a; ctx.fill();
    ctx.globalAlpha = a; ctx.strokeStyle = loop.color; ctx.lineWidth = (3 + 5 * a) / z; ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // warp afterimages
  for (const g of game.fx.ghosts) {
    const a = Math.max(0, g.life / g.max);
    if (g.streak) {
      ctx.strokeStyle = `rgba(190,240,255,${0.5 * a})`;
      ctx.lineWidth = CONFIG.shipRadius * 1.2 * a;
      ctx.beginPath(); ctx.moveTo(g.x0, g.y0); ctx.lineTo(g.x1, g.y1); ctx.stroke();
      continue;
    }
    const s = Math.max(CONFIG.shipRadius, 9 / z);
    ctx.globalAlpha = 0.55 * a;
    ctx.fillStyle = '#5fd8ff';
    ctx.beginPath(); ctx.arc(g.x, g.y, s * (1 + 0.3 * (1 - a)), 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.8 * a;
    ctx.strokeStyle = '#bff3ff'; ctx.lineWidth = s * 0.2;
    ctx.beginPath(); ctx.arc(g.x, g.y, s * 0.82, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  const ps = 1 / Math.sqrt(z);
  for (const p of game.fx.particles) {
    // Include the longest spark and camera shake in the bound; simulation is unchanged.
    if (!onScreen(r, p.x, p.y, p.size * ps * 5 + 40 / z)) continue;
    ctx.globalAlpha = Math.min(1, p.life / 0.4);
    ctx.fillStyle = p.color;
    const s = p.size * ps;
    if (p.kind === 'finishDebris') {
      ctx.save(); ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.translate(p.x, p.y); ctx.rotate(p.angle);
      ctx.strokeStyle = p.color; ctx.lineWidth = 1.5 / z;
      ctx.fillStyle = '#dfe9f0';
      ctx.beginPath(); ctx.moveTo(-s, -s * 0.6); ctx.lineTo(s * 0.8, -s * 0.35);
      ctx.lineTo(s * 0.5, s * 0.7); ctx.lineTo(-s * 0.6, s * 0.5); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
      continue;
    }
    if (p.kind === 'spark') {
      const speed = Math.hypot(p.vx, p.vy) || 1;
      const length = s * 4;
      ctx.strokeStyle = p.color; ctx.lineWidth = Math.max(1 / z, s * 0.55);
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx / speed * length, p.y - p.vy / speed * length); ctx.stroke();
      continue;
    }
    if (p.kind === 'flame') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.atan2(p.vy, p.vx));
      ctx.beginPath(); ctx.ellipse(0, 0, s * 2.4, s * 0.8, 0, 0, TAU); ctx.fill(); ctx.restore();
      continue;
    }
    ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
  }
  for (const g of game.fx.rings) {
    const k = 1 - g.life / g.max;
    ctx.globalAlpha = Math.max(0, g.life / g.max);
    ctx.strokeStyle = g.color;
    ctx.lineWidth = (10 * (1 - k) + 2) / z;
    ctx.beginPath(); ctx.arc(g.x, g.y, g.radius * (0.2 + 0.8 * Math.sqrt(k)), 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const t of game.fx.texts) {
    ctx.globalAlpha = Math.min(1, t.life / 0.3);
    ctx.fillStyle = t.color;
    ctx.font = `800 ${Math.round((t.size || 16) / z)}px ${MONO}`;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

function drawMinimap(r, game) {
  const { ctx, W, H } = r;
  const R = Math.min(r.mobile ? 36 : 90, Math.min(W, H) * 0.12);
  const cx = W - R - 16, cy = R + 16;
  const k = R / (CONFIG.fieldRadius + 300);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = 'rgba(8,12,28,0.78)';
  ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(150,70,255,0.16)';
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.fieldRadius * k, 0, TAU); ctx.arc(0, 0, CONFIG.zoneOuter * k, 0, TAU, true); ctx.fill();
  ctx.fillStyle = 'rgba(255,70,50,0.18)';
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.zoneInner * k, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(190,120,255,0.8)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.fieldRadius * k, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#4a68d8';
  ctx.beginPath(); ctx.arc(0, 0, Math.max(3, CONFIG.planetRadius * k), 0, TAU); ctx.fill();
  ctx.fillStyle = '#a08a6c';
  for (const m of game.field.moons) { ctx.beginPath(); ctx.arc(m.x * k, m.y * k, 2.2, 0, TAU); ctx.fill(); }
  for (const e of game.enemies) {
    if (e.dead || (e.type !== 'battleship' && !e.elite)) continue;
    ctx.fillStyle = e.type === 'battleship' ? '#ff5a5a' : '#ffcf4a';
    ctx.fillRect(e.x * k - 2, e.y * k - 2, 4, 4);
  }
  for (const c of game.capsules) {
    ctx.fillStyle = capsuleColor(c);
    const s2 = c.kind === 'core' ? 3.5 : 2.5;
    ctx.beginPath(); ctx.moveTo(c.x * k, c.y * k - s2); ctx.lineTo(c.x * k + s2, c.y * k); ctx.lineTo(c.x * k, c.y * k + s2); ctx.lineTo(c.x * k - s2, c.y * k); ctx.closePath(); ctx.fill();
  }
  const sh = game.ship;
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(sh.x * k, sh.y * k, game.viewRadius * k, 0, TAU); ctx.stroke();
  ctx.strokeStyle = '#5fd8ff';
  ctx.beginPath(); ctx.moveTo(sh.x * k, sh.y * k); ctx.lineTo((sh.x + sh.vx * 1.5) * k, (sh.y + sh.vy * 1.5) * k); ctx.stroke();
  ctx.fillStyle = '#e8f6ff';
  ctx.beginPath(); ctx.arc(sh.x * k, sh.y * k, 3, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawBackground(r, game) {
  const { ctx, W, H } = r;
  ctx.fillStyle = '#04050b';
  ctx.fillRect(0, 0, W, H);
  const sh = game.ship;
  const vx = sh.vx, vy = sh.vy;
  for (const L of r.layers) {
    const ox = ((-r.cam.x * L.p) % STAR_TILE + STAR_TILE) % STAR_TILE;
    const oy = ((-r.cam.y * L.p) % STAR_TILE + STAR_TILE) % STAR_TILE;
    const stretch = Math.min(260, Math.hypot(vx, vy) * L.p * 0.05);
    const sp = Math.hypot(vx, vy) || 1;
    const ux = -vx / sp, uy = -vy / sp;
    ctx.strokeStyle = '#cfe0ff';
    ctx.fillStyle = '#cfe0ff';
    for (const s of L.stars) {
      for (let tx = -STAR_TILE; tx < W + STAR_TILE; tx += STAR_TILE) {
        const x = s.x + ox + tx - STAR_TILE;
        if (x < -20 || x > W + 20) continue;
        for (let ty = -STAR_TILE; ty < H + STAR_TILE; ty += STAR_TILE) {
          const y = s.y + oy + ty - STAR_TILE;
          if (y < -20 || y > H + 20) continue;
          ctx.globalAlpha = s.a;
          if (stretch > 2) {
            ctx.lineWidth = s.s;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + ux * stretch, y + uy * stretch);
            ctx.stroke();
          } else {
            ctx.fillRect(x, y, s.s, s.s);
          }
        }
      }
    }
  }
  ctx.globalAlpha = 1;
}

// Procedural dust specks in world space: the main cue for how fast the world flows by.
function drawSpecks(r) {
  const { ctx, cam } = r;
  const cell = 420;
  const halfW = r.W / 2 / cam.zoom, halfH = r.H / 2 / cam.zoom;
  const x0 = Math.floor((cam.x - halfW) / cell), x1 = Math.floor((cam.x + halfW) / cell);
  const y0 = Math.floor((cam.y - halfH) / cell), y1 = Math.floor((cam.y + halfH) / cell);
  ctx.fillStyle = '#7f8db8';
  const size = 2.2 / cam.zoom;
  for (let cx = x0; cx <= x1; cx++) {
    for (let cy = y0; cy <= y1; cy++) {
      let h = (cx * 73856093) ^ (cy * 19349663);
      for (let k = 0; k < 3; k++) {
        h = Math.imul(h ^ (h >>> 13), 0x5bd1e995) >>> 0;
        const px = cx * cell + (h & 1023) / 1023 * cell;
        h = Math.imul(h ^ (h >>> 15), 0x27d4eb2d) >>> 0;
        const py = cy * cell + (h & 1023) / 1023 * cell;
        ctx.globalAlpha = 0.35 + ((h >>> 12) & 7) / 14;
        ctx.fillRect(px, py, size, size);
      }
    }
  }
  ctx.globalAlpha = 1;
}

function drawTrail(r, game) {
  const { ctx } = r;
  const sh = game.ship;
  const tr = sh.trail;
  if (tr.length < 2) return;
  const sp = Math.hypot(sh.vx, sh.vy);
  const ratio = sp / game.stats.maxSpeed;
  const n = Math.min(tr.length, Math.round(6 + clamp(ratio, 0, 2) * 55));
  const start = tr.length - n;
  const hot = clamp((ratio - 0.85) / 0.4, 0, 1);
  ctx.lineCap = 'round';
  for (let i = start + 1; i < tr.length; i++) {
    const a = (i - start) / n;
    ctx.globalAlpha = a * 0.85;
    ctx.strokeStyle = hot > 0 ? `rgb(${120 + 135 * hot},${220 + 35 * hot},255)` : '#5fd8ff';
    ctx.lineWidth = (CONFIG.shipRadius * 1.1) * a + 1 / r.cam.zoom;
    ctx.beginPath();
    ctx.moveTo(tr[i - 1].x, tr[i - 1].y);
    ctx.lineTo(tr[i].x, tr[i].y);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(tr[tr.length - 1].x, tr[tr.length - 1].y);
  ctx.lineTo(sh.x, sh.y);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// The ship never rotates: a round craft, so screen-absolute controls always read the same way.
// Direction is shown by the trail and the heading marker instead.
function drawShip(r, game) {
  const { ctx } = r;
  const sh = game.ship;
  const s = Math.max(CONFIG.shipRadius, 9 / r.cam.zoom);
  ctx.save();
  const hurting = r.shipHurt > 0, fatal = game.death?.phase === 'freeze';
  const offset = hurting && !fatal ? Math.sin(r.shipHurt * 100) * CONFIG.shipHurtShake * r.shipHurt / CONFIG.shipHurtTime / r.cam.zoom : 0;
  ctx.translate(sh.x + offset, sh.y);
  if (!hurting && !fatal && sh.invulnT > 0 && Math.floor(game.t * 20) % 2 === 0) ctx.globalAlpha = 0.4;
  ctx.shadowColor = hurting || fatal ? '#ff665a' : '#5fd8ff';
  ctx.shadowBlur = fatal ? 26 : 18;
  ctx.fillStyle = hurting || fatal ? '#ff6354' : '#1b3b5c';
  ctx.beginPath(); ctx.arc(0, 0, s, 0, TAU); ctx.fill();
  ctx.lineWidth = s * 0.28;
  ctx.strokeStyle = '#bff3ff';
  ctx.beginPath(); ctx.arc(0, 0, s * 0.82, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(0, 0, s * 0.38, 0, TAU); ctx.fill();
  ctx.restore();
}

// Aim marker: a Space launch goes this way (scheme dependent).
function drawAimMarker(r, game) {
  const sh = game.ship;
  if (sh.charging || game.state !== 'play') return;
  const { ctx } = r;
  const p = worldToScreen(r, sh.x, sh.y);
  const ux = sh.markX, uy = sh.markY; // where a Space launch would go under the current scheme
  ctx.globalAlpha = 0.85;
  ctx.strokeStyle = '#9fe8ff';
  ctx.lineWidth = 2;
  ctx.setLineDash([3, 5]);
  ctx.beginPath(); ctx.moveTo(p.x + ux * 24, p.y + uy * 24); ctx.lineTo(p.x + ux * 46, p.y + uy * 46); ctx.stroke();
  ctx.setLineDash([]);
  const tx = p.x + ux * 56, ty = p.y + uy * 56;
  ctx.fillStyle = '#9fe8ff';
  ctx.beginPath();
  ctx.moveTo(tx + ux * 9, ty + uy * 9);
  ctx.lineTo(tx - ux * 3 - uy * 7, ty - uy * 3 + ux * 7);
  ctx.lineTo(tx - ux * 3 + uy * 7, ty - uy * 3 - ux * 7);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}

// Draw scheme: the virtual stick (press point + knob) while the pointer is held.
function drawStick(r, game, pointer) {
  if (r.mobile) return;
  if (game.scheme !== 'draw' || game.draw || !pointer || !pointer.down || pointer.pointerType !== 'touch' || game.state !== 'play') return;
  const { ctx } = r;
  const R = CONFIG.stickRadius;
  ctx.save();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(190,215,255,0.35)';
  ctx.fillStyle = 'rgba(190,215,255,0.06)';
  ctx.beginPath(); ctx.arc(pointer.sx, pointer.sy, R, 0, TAU); ctx.fill(); ctx.stroke();
  // the knob stays on the ring when the finger goes further (the press point never moves)
  const dx = pointer.cx - pointer.sx, dy = pointer.cy - pointer.sy, d = Math.hypot(dx, dy), k = d > R ? R / d : 1;
  ctx.fillStyle = 'rgba(220,235,255,0.55)';
  ctx.beginPath(); ctx.arc(pointer.sx + dx * k, pointer.sy + dy * k, 16, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawChargeUi(r, game, pointer) {
  drawStick(r, game, pointer);
  drawAimMarker(r, game);
  const sh = game.ship;
  if (!sh.charging) return;
  const { ctx } = r;
  const p = worldToScreen(r, sh.x, sh.y);
  const g = sh.gauge;
  const full = g >= 1;
  // gauge ring
  ctx.lineWidth = 5;
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath(); ctx.arc(p.x, p.y, 34, 0, TAU); ctx.stroke();
  ctx.strokeStyle = g > 1 ? '#ff9f40' : full ? '#ffe46b' : '#5fd8ff';
  ctx.beginPath(); ctx.arc(p.x, p.y, 34, -Math.PI / 2, -Math.PI / 2 + TAU * Math.min(1, g)); ctx.stroke();
  if (g > 1) {
    ctx.strokeStyle = '#ff5a3c';
    ctx.beginPath(); ctx.arc(p.x, p.y, 40, -Math.PI / 2, -Math.PI / 2 + TAU * (g - 1) / Math.max(0.01, game.stats.gaugeMax - 1)); ctx.stroke();
  }
  // aim arrow
  const len = Math.hypot(sh.aimX, sh.aimY);
  if (len >= CONFIG.minDrag) {
    const ux = sh.aimX / len, uy = sh.aimY / len;
    const L = 50 + 90 * Math.min(1.5, g);
    ctx.strokeStyle = full ? '#ffe46b' : '#9fe8ff';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(p.x + ux * 40, p.y + uy * 40); ctx.lineTo(p.x + ux * L, p.y + uy * L); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p.x + ux * (L + 12), p.y + uy * (L + 12));
    ctx.lineTo(p.x + ux * L - uy * 8, p.y + uy * L + ux * 8);
    ctx.lineTo(p.x + ux * L + uy * 8, p.y + uy * L - ux * 8);
    ctx.closePath();
    ctx.fillStyle = ctx.strokeStyle; ctx.fill();
  }
  // drag rubber band (screen space)
  if (pointer && pointer.down) {
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.moveTo(pointer.sx, pointer.sy); ctx.lineTo(pointer.cx, pointer.cy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(pointer.sx, pointer.sy, 6, 0, TAU); ctx.stroke();
  }
}


function drawHud(r, game) {
  drawSpeedPanel(r, game);
  drawStatus(r, game);
  drawTimer(r, game);
  drawLoadout(r, game);
}

// Bottom-left: the ship assembled from the equipped parts (empty slots are dashed outlines),
// with the module names beside it on wide screens.
// Size of the bottom-left ship diagram; shrinks on narrow (portrait phone) screens.
// Matches the dash button's CSS offset (min(102px, 13.6vh, 17vw) = unit * 6.8).
function loadoutUnit(r) {
  return Math.min(15, r.H / 50, r.W / 40);
}

function drawLoadout(r, game) {
  if (game.newBuild) { drawRunLoadout(r, game); return; }
  const { ctx, H, W } = r;
  const unit = loadoutUnit(r);
  const cx = 12 + unit * 3.4, cy = H - 14 - unit * 3.4;
  ctx.fillStyle = 'rgba(8,12,28,0.55)';
  ctx.beginPath(); ctx.arc(cx, cy - unit * 0.1, unit * 3.4, 0, TAU); ctx.fill();
  drawShipAssembly(ctx, cx, cy, unit, (slot) => {
    const m = game.loadout[slot];
    return m ? RARITIES[m.r].color : null;
  }, null, game.t);
  if (W < 960) return; // names only where they clear the speed bar
  const x = cx + unit * 3.8, y0 = cy - unit * 3 + 4;
  ctx.textAlign = 'left';
  ctx.font = '12px "Hiragino Sans", "Noto Sans JP", sans-serif';
  SLOTS.forEach((s, i) => {
    const m = game.loadout[s.id];
    ctx.fillStyle = m ? RARITIES[m.r].color : '#4a5878';
    ctx.fillText(`${s.name}: ${m ? moduleDef(m.id).name + (m.plus ? ` +${m.plus}` : '') : '—'}`, x, y0 + i * 17);
  });
}

function drawTimer(r, game) {
  const { ctx, W } = r;
  const left = Math.max(0, CONFIG.runTime - game.t);
  const m = Math.floor(left / 60), sec = Math.floor(left % 60);
  ctx.textAlign = 'center';
  ctx.fillStyle = left < 60 ? '#ff8a6b' : '#e8f0ff';
  ctx.font = `700 ${r.mobile ? 20 : 26}px ${MONO}`;
  ctx.fillText(`${m}:${String(sec).padStart(2, '0')}`, W / 2, 40);
  // xp bar
  const need = xpForLevel(game.level);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(0, 0, W, 5);
  ctx.fillStyle = CONFIG.xpColor;
  ctx.fillRect(0, 0, W * Math.min(1, game.xp / need), 5);
}

function drawStatus(r, game) {
  const { ctx } = r;
  const sh = game.ship;
  const frac = Math.max(0, sh.hp / game.stats.maxHp);
  // HP bar right under the ship
  const p = worldToScreen(r, sh.x, sh.y);
  const bw = 44, bx = p.x - bw / 2, by = p.y + Math.max(CONFIG.shipRadius * r.cam.zoom, 9) + 10;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(bx - 1, by - 1, bw + 2, 7);
  ctx.fillStyle = frac < 0.3 ? '#ff5a4a' : '#5dffa0';
  ctx.fillRect(bx, by, bw * frac, 5);
  const x = r.mobile ? 10 : 16, y = r.mobile ? r.H - 124 : 18;
  if (r.mobile) { ctx.fillStyle = 'rgba(4,8,20,0.78)'; ctx.fillRect(4, y - 4, 126, 80); }
  ctx.fillStyle = '#e8f0ff';
  ctx.font = `${r.mobile ? 10 : 12}px ${MONO}`;
  ctx.textAlign = 'left';
  ctx.fillText(r.mobile ? `HP${Math.ceil(Math.max(0, sh.hp))}/${Math.round(game.stats.maxHp)}` : `HP ${Math.ceil(Math.max(0, sh.hp))} / ${Math.round(game.stats.maxHp)}`, x, y + 10);
  const atk = attackPower(Math.hypot(sh.vx, sh.vy), game.stats);
  let ly = y + 28;
  if (r.mobile || r.W < 600) {
    // narrow (portrait phone): shorter lines so they clear the timer in the middle
    ctx.fillText(r.mobile ? `ATK${atk.toFixed(1)} Lv${game.level}` : `ATK ${atk.toFixed(1)}  Lv ${game.level}`, x, ly);
    ctx.fillText(`撃破 ${game.kills}`, x, ly += 18);
  } else {
    ctx.fillText(`ATK ${atk.toFixed(1)}   撃破 ${game.kills}   Lv ${game.level}`, x, ly);
  }
  ctx.fillStyle = '#ffd24a';
  ctx.fillText(`部品 ${Math.round(game.coins)}`, x, ly + 18);
}

function drawSpeedPanel(r, game) {
  const { ctx, W, H } = r;
  const sp = Math.hypot(game.ship.vx, game.ship.vy);
  const kms = (v) => (v * CONFIG.speedToKms).toFixed(2);
  if (r.mobile) {
    ctx.textAlign = 'center'; ctx.font = `12px ${MONO}`; ctx.fillStyle = '#9fe8ff';
    ctx.fillText(`${kms(sp)} km/s`, W / 2, 59); return;
  }
  const bh = 10, by = H - 34;
  let bw = Math.min(420, W * 0.5), bx = W / 2 - bw / 2;
  const clear = 12 + loadoutUnit(r) * 6.8 + 14; // right edge of the ship diagram
  if (bx < clear) { bx = clear; bw = Math.max(80, W - clear - 16); }
  const mid = bx + bw / 2;
  const top = Math.max(CONFIG.baseMaxSpeed, game.stats.maxSpeed, sp, game.peakSpeed) * 1.15;
  const X = (v) => bx + clamp(v / top, 0, 1) * bw;
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(bx, by, bw, bh);
  const hot = sp > game.stats.maxSpeed;
  ctx.fillStyle = hot ? '#bff3ff' : '#5fd8ff';
  ctx.fillRect(bx, by, X(sp) - bx, bh);
  // max speed tick
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(X(game.stats.maxSpeed) - 1, by - 5, 2, bh + 10);
  // peak marker
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillRect(X(game.peakSpeed) - 1, by, 2, bh);
  ctx.font = `11px ${MONO}`;
  ctx.textAlign = 'center';
  // labels stay on screen whatever the width
  const fit = (text, x) => { const w = ctx.measureText(text).width / 2; return clamp(x, w + 4, W - w - 4); };
  const capTxt = `上限 ${kms(game.stats.maxSpeed)}`;
  ctx.fillStyle = '#cfd8ee';
  ctx.fillText(capTxt, fit(capTxt, X(game.stats.maxSpeed)), by + bh + 14);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#8fa3c8';
  ctx.fillText(`最高 ${kms(game.peakSpeed)}`, bx, by - 8);
  ctx.fillStyle = hot ? '#bff3ff' : '#e8f0ff';
  ctx.font = `700 34px ${MONO}`;
  ctx.textAlign = 'right';
  const narrow = W < 600;
  const ny = narrow ? by - 28 : by - 18; // narrow: lift the number above the label row
  ctx.font = `700 ${narrow ? 28 : 34}px ${MONO}`;
  ctx.fillText(kms(sp), mid + 40, ny);
  ctx.textAlign = 'left';
  ctx.font = `13px ${MONO}`;
  ctx.fillStyle = '#8fa3c8';
  ctx.fillText('km/s', mid + 46, ny - 1);
}

function drawBossHud(r, game, dt) {
  const boss = game.boss;
  if (!boss || boss.dead) return;
  const { ctx, W, H } = r;
  const width = Math.min(360, W - 32, W * 0.46), x = (W - width) / 2, y = W < 600 ? 104 : 82;
  r.bossWarning = Math.max(0, (r.bossWarning || 0) - dt);
  ctx.textAlign = 'center';
  ctx.font = `700 14px ${MONO}`;
  ctx.fillStyle = '#ff647b';
  ctx.fillText(r.bossWarning > 0 ? 'WARNING!!  ボス出現' : 'BOSS', W / 2, y - 8);
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(x - 2, y - 2, width + 4, 12);
  ctx.fillStyle = '#ff526e';
  ctx.fillRect(x, y, width * Math.max(0, boss.hp / boss.maxHp), 8);
  const p = worldToScreen(r, boss.x, boss.y);
  if (p.x < 0 || p.x > W || p.y < 0 || p.y > H) {
    const dx = p.x - W / 2, dy = p.y - H / 2;
    const k = Math.min((W / 2 - 40) / Math.max(1, Math.abs(dx)), (H / 2 - 60) / Math.max(1, Math.abs(dy)));
    const bx = W / 2 + dx * k, by = H / 2 + dy * k;
    ctx.save(); ctx.translate(bx, by); ctx.rotate(Math.atan2(dy, dx));
    ctx.beginPath(); ctx.moveTo(13, 0); ctx.lineTo(-6, -7); ctx.lineTo(-6, 7); ctx.closePath(); ctx.fill(); ctx.restore();
    ctx.font = `12px ${MONO}`;
    ctx.fillText('BOSS', bx, by + 21);
  }
  ctx.textAlign = 'left';
}

// ---- input.js ----
// Raw input only: keys, Space, pointer drag and hover. Control schemes (controls.js) turn this into intent.

// Launch direction is opposite to the drag: start - current.
function aimFromDrag(sx, sy, cx, cy) {
  return { x: sx - cx, y: sy - cy };
}

const MOVE_KEYS = {
  KeyW: [0, -1], ArrowUp: [0, -1],
  KeyS: [0, 1], ArrowDown: [0, 1],
  KeyA: [-1, 0], ArrowLeft: [-1, 0],
  KeyD: [1, 0], ArrowRight: [1, 0],
};
const SNAP_KEYS = { KeyW: 'forward', ArrowUp: 'forward', KeyS: 'back', ArrowDown: 'back' };
const KEY_CODES = { a: 'KeyA', d: 'KeyD', w: 'KeyW', s: 'KeyS', b: 'KeyB', arrowleft: 'ArrowLeft', arrowright: 'ArrowRight', arrowup: 'ArrowUp', arrowdown: 'ArrowDown' };

// Held movement keys -> unit vector (zero when none or cancelled).
function moveVector(keys) {
  let dx = 0, dy = 0;
  for (const k of keys) {
    const d = MOVE_KEYS[k];
    if (d) { dx += d[0]; dy += d[1]; }
  }
  dx = Math.sign(dx); dy = Math.sign(dy);
  if (dx === 0 && dy === 0) return { x: 0, y: 0 };
  const len = Math.hypot(dx, dy);
  return { x: dx / len || 0, y: dy / len || 0 };
}

// Physical key position (works with IME on), falling back to the key name.
function keyCode(e) {
  return e.code || KEY_CODES[(e.key || '').toLowerCase()] || '';
}

const isSpace = (e) => e.code === 'Space' || e.key === ' ';

function createInput(el, keyTarget = typeof window !== 'undefined' ? window : null) {
  const st = {
    down: false, sx: 0, sy: 0, cx: 0, cy: 0, pointerId: null, enabled: true, hover: null, click: null,
    cancelled: false, release: false, relSource: null, relX: 0, relY: 0,
    keys: new Set(), space: false, spaceStartedAt: 0, spaceDuration: 0, cycle: 0, snap: null, pressed: false, dash: false, place: false, confirm: false,
  };
  // pointer position in the element's own CSS pixels (the same space the canvas is drawn in)
  const local = (e) => {
    const b = el.getBoundingClientRect ? el.getBoundingClientRect() : null;
    return b ? { x: e.clientX - b.left, y: e.clientY - b.top } : { x: e.clientX, y: e.clientY };
  };
  el.addEventListener('pointerdown', (e) => {
    if (st.down && e.pointerId !== st.pointerId) return;
    st.hover = local(e);
    if (st.enabled && e.button === 2) { st.confirm = true; e.preventDefault(); }
    if (st.enabled && e.button === 0) { st.pressed = true; st.click = st.hover; }
    if (!st.enabled || e.button > 0) return;
    st.down = true; st.pointerId = e.pointerId; st.pointerType = e.pointerType || 'mouse';
    ({ x: st.sx, y: st.sy } = local(e)); st.cx = st.sx; st.cy = st.sy;
    try { el.setPointerCapture(e.pointerId); } catch { /* synthetic or lost pointer */ }
  });
  el.addEventListener('pointermove', (e) => {
    if (st.down && e.pointerId !== st.pointerId) return;
    st.hover = local(e);
    if (!st.down || e.pointerId !== st.pointerId) return;
    ({ x: st.cx, y: st.cy } = local(e));
  });
  const up = (e) => {
    if (!st.down || e.pointerId !== st.pointerId) return;
    ({ x: st.cx, y: st.cy } = local(e));
    st.hover = local(e);
    const a = aimFromDrag(st.sx, st.sy, st.cx, st.cy);
    st.down = false; st.release = true; st.relSource = 'pointer'; st.relX = a.x; st.relY = a.y;
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', (e) => {
    if (e.pointerId !== st.pointerId) return;
    st.down = false; st.release = false; st.cancelled = true; st.pointerId = null;
  });
  el.addEventListener('contextmenu', (e) => e.preventDefault());

  if (keyTarget) {
    keyTarget.addEventListener('keydown', (e) => {
      const code = keyCode(e);
      if (MOVE_KEYS[code]) {
        const fresh = st.enabled && !e.repeat && !st.keys.has(code);
        st.keys.add(code); if (st.enabled) e.preventDefault();
        if (st.enabled && (fresh || e.repeat)) {
          if (code === 'KeyA' || code === 'ArrowLeft') st.cycle--;
          if (code === 'KeyD' || code === 'ArrowRight') st.cycle++;
        }
      }
      if (code === 'KeyB' && st.enabled) { e.preventDefault(); if (!e.repeat) st.place = true; }
      if (SNAP_KEYS[code] && !e.repeat) st.snap = SNAP_KEYS[code];
      if (isSpace(e)) {
        if (st.enabled) e.preventDefault();
        if (!st.enabled || e.repeat || st.space) return;
        st.pressed = true;
        st.dash = true;
        st.space = true; st.spaceStartedAt = performance.now(); st.spaceDuration = 0;
      }
    });
    keyTarget.addEventListener('keyup', (e) => {
      st.keys.delete(keyCode(e));
      if (isSpace(e) && st.space) {
        st.spaceDuration = (performance.now() - st.spaceStartedAt) / 1000;
        st.space = false; st.release = true; st.relSource = 'space'; st.relX = 0; st.relY = 0;
      }
    });
    keyTarget.addEventListener('blur', () => { st.keys.clear(); st.space = false; st.release = false; st.spaceDuration = 0; st.cycle = 0; });
  }

  return {
    state: st,
    read() {
      const out = {
        move: st.enabled ? moveVector(st.keys) : { x: 0, y: 0 },
        snap: st.enabled ? st.snap : null,
        space: st.enabled && st.space,
        spaceHeldTime: st.enabled ? (st.space ? (performance.now() - st.spaceStartedAt) / 1000 : st.spaceDuration) : 0,
        portalCycle: st.enabled ? st.cycle : 0,
        pressed: st.pressed, // a fresh Space press or click this frame (commits a drawn path)
        dash: st.dash, // a fresh Space press or the on-screen dash button (draw mode)
        place: st.enabled && st.place,
        confirm: st.enabled && st.confirm,
        pointerDown: st.down,
        pointerType: st.pointerType || 'mouse', // 'touch' turns the press into a virtual stick (draw mode)
        drag: st.down ? aimFromDrag(st.sx, st.sy, st.cx, st.cy) : { x: 0, y: 0 },
        hover: st.hover,
        click: st.click, // preserve the press position even if the mouse moves before the next frame
        cancelled: st.cancelled,
        release: st.release,
        releaseSource: st.release ? st.relSource : null,
        releaseDrag: { x: st.relX, y: st.relY },
      };
      st.cancelled = false;
      st.release = false;
      st.snap = null;
      st.pressed = false;
      st.click = null;
      st.dash = false;
      st.place = false;
      st.confirm = false;
      st.cycle = 0; st.spaceDuration = 0;
      return out;
    },
    triggerDash() { if (st.enabled) st.dash = true; },
    reset() { st.cancelled = false; st.down = false; st.space = false; st.spaceDuration = 0; st.cycle = 0; st.release = false; st.snap = null; st.pressed = false; st.click = null; st.dash = false; st.place = false; st.confirm = false; st.keys.clear(); st.pointerId = null; },
  };
}

// ---- ui.js ----







const root = () => document.getElementById('ui');

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'html') n.innerHTML = v;
    else n.setAttribute(k, v);
  }
  for (const c of kids) if (c != null) n.append(c);
  return n;
}

function clearScreens() {
  for (const n of [...root().querySelectorAll('.screen')]) n.remove();
}

function showScreen(panel, id) {
  clearScreens();
  const s = el('div', { class: 'screen', id }, panel);
  root().append(s);
  return s;
}

function fmtTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

const kms = (v) => (v * CONFIG.speedToKms).toFixed(2);

const END_TEXT = {
  boss: ['CLEAR!', 'win', '敵の大群を突破し、ボスを撃破した'],
  hp: ['GAME OVER', 'lose', 'HP が尽きた'],
  time: ['時間切れ', 'lose', '時間内にボスを撃破できなかった'],
};

function showResult(game, extra, onNext, onRetry) {
  const [title, cls, sub] = END_TEXT[game.endReason] || END_TEXT.time;
  const rows = [
    ['経過時間', fmtTime(game.t)],
    ['最高速度', `${kms(game.peakSpeed)} km/s`],
    ['撃破数', String(game.kills)],
    ['レベル', String(game.level)],
    ...(extra || []),
  ];
  const stats = el('div', { class: 'stats' });
  for (const [k, v] of rows) stats.append(el('div', {}, k), el('div', {}, v));
  const won = game.state === 'won';
  const btn = el('button', { class: won ? '' : 'primary', onclick: onNext }, won ? 'メニューに戻る' : 'ステーションへ');
  const retry = won && onRetry ? el('button', { class: 'primary', onclick: onRetry }, 'もう一回やる') : null;
  showScreen(el('div', { class: 'panel' },
    el('h1', { class: cls }, title),
    el('div', { class: 'sub' }, sub),
    stats,
    el('div', { class: 'btns' }, retry, btn)), 'result');
  (retry || btn).focus();
}

const SOURCE_TEXT = { xp: '経験値', capsule: '漂流カプセル', elite: '強敵のドロップ', drop: '敵のドロップ', core: '出力コア' };

function partCanvas(slot, color, size = 64) {
  const c = el('canvas', { class: 'part' });
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = size * dpr; c.height = size * dpr;
  c.style.width = c.style.height = `${size}px`;
  const ctx = c.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.translate(size / 2, size / 2);
  drawPart(ctx, slot, size * (slot === 'armor' ? 0.26 : 0.36), color, { glow: color ? 10 : 0 });
  return c;
}

// The assembled ship with `slot` pulsing; redraws itself while the offer is open.
function assemblyCanvas(game, slot, size = 150) {
  const c = el('canvas', { class: 'assembly' });
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = size * dpr; c.height = size * dpr;
  c.style.width = c.style.height = `${size}px`;
  const ctx = c.getContext('2d');
  const paint = (t) => {
    if (!c.isConnected && t > 0) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    drawShipAssembly(ctx, size / 2, size / 2 + size * 0.03, size / 7.4, (s) => {
      const m = game.loadout[s];
      return m ? RARITIES[m.r].color : null;
    }, slot, t / 1000);
    requestAnimationFrame(paint);
  };
  paint(0);
  return c;
}

function moduleCard(mod, tag, isNew, scheme) {
  if (!mod) return el('div', { class: 'card empty' }, '空きスロット');
  const def = moduleDef(mod.id);
  const rar = RARITIES[mod.r];
  const card = el('div', { class: `card${isNew ? ' new' : ''}` },
    partCanvas(mod.slot, rar.color),
    el('div', { class: 'tag' }, tag),
    el('div', { class: 'name' }, `${def.name}${mod.plus ? ` +${mod.plus}` : ''}`),
    el('div', { class: 'rar', style: `color:${rar.color}` }, rar.name),
    el('div', { class: 'desc' }, def.desc(mod.r, scheme)));
  if (isNew) card.style.borderColor = rar.color;
  return card;
}

// ---- audio.js ----
// Synthesized sound. Everything is optional: without Web Audio this is a silent stub.

function noop() {}

// Muted by default; only a stored '0' (the player pressed M to turn sound on) starts unmuted.
function initialMuted(stored) {
  return stored !== '0';
}

function createAudio() {
  const AC = typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext);
  if (!AC) return { unlock: noop, handle: noop, update: noop, toggleMute: () => true, muted: true };

  let ctx = null, master, sfx, muffle, boomBus, engine, sub, engineGain, wind, windFilter, windGain, noiseBuf;
  let muted = true;
  try { muted = initialMuted(window.localStorage.getItem('speed-muted')); } catch { /* ignore */ }
  const lastPlayed = {};
  let duckT = 0;

  function init() {
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.7;
    const comp = ctx.createDynamicsCompressor();
    master.connect(comp).connect(ctx.destination);
    muffle = ctx.createBiquadFilter();
    muffle.type = 'lowpass';
    muffle.frequency.value = 16000;
    sfx = ctx.createGain();
    sfx.connect(muffle).connect(master);
    boomBus = ctx.createGain();
    boomBus.connect(master);

    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

    engineGain = ctx.createGain();
    engineGain.gain.value = 0;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 700;
    engine = ctx.createOscillator(); engine.type = 'sawtooth'; engine.frequency.value = 50;
    sub = ctx.createOscillator(); sub.type = 'sine'; sub.frequency.value = 25;
    engine.connect(lp); sub.connect(lp); lp.connect(engineGain).connect(sfx);
    engine.start(); sub.start();

    wind = ctx.createBufferSource(); wind.buffer = noiseBuf; wind.loop = true;
    windFilter = ctx.createBiquadFilter(); windFilter.type = 'bandpass'; windFilter.Q.value = 0.8;
    windGain = ctx.createGain(); windGain.gain.value = 0;
    wind.connect(windFilter).connect(windGain).connect(sfx);
    wind.start();
  }

  function env(g, t, a, peak, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }

  function tone(freq, dur, type = 'sine', vol = 0.2, slideTo = null, bus = sfx, delay = 0) {
    const t = ctx.currentTime + delay;
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    const g = ctx.createGain();
    env(g, t, 0.005, vol, dur);
    o.connect(g).connect(bus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function noise(dur, freq, vol = 0.3, type = 'lowpass', sweepTo = null, bus = sfx, q = 1) {
    const t = ctx.currentTime;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    s.playbackRate.value = 0.8 + Math.random() * 0.4;
    const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(freq, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    const g = ctx.createGain();
    env(g, t, 0.01, vol, dur);
    s.connect(f).connect(g).connect(bus);
    s.start(t, Math.random()); s.stop(t + dur + 0.05);
  }

  function throttle(key, gap) {
    const now = ctx.currentTime;
    if (lastPlayed[key] && now - lastPlayed[key] < gap) return false;
    lastPlayed[key] = now;
    return true;
  }

  const SOUNDS = {
    launch: (e) => noise(0.35, 400 + 1200 * Math.min(1.5, e.gauge), 0.25 + 0.15 * Math.min(1, e.gauge), 'bandpass', 3000, sfx, 1.5),
    kill: (e) => throttle('kill', 0.025) && tone(320 + Math.random() * 280 + (e.r > 25 ? -150 : 0), 0.12, 'square', e.r > 25 ? 0.12 : 0.06, 90),
    hit: (e) => e.crit && throttle('crit', 0.05) && tone(1400, 0.18, 'triangle', 0.18, 2200),
    hurt: () => { noise(0.3, 300, 0.5); tone(90, 0.3, 'sawtooth', 0.25, 40); },
    bounce: () => throttle('bounce', 0.08) && tone(160, 0.15, 'square', 0.15, 80),
    crash: () => noise(0.4, 250, 0.5),
    levelup: () => [523, 659, 784].forEach((f, i) => tone(f, 0.14, 'triangle', 0.12, null, sfx, i * 0.06)),
    pickup: (e) => tone(e.kind === 'core' ? 660 : 880, 0.3, 'sine', 0.2, e.kind === 'core' ? 1320 : 1760),
    equip: () => tone(440, 0.15, 'triangle', 0.15, 880),
    coin: () => throttle('coin', 0.04) && tone(1568, 0.08, 'square', 0.05),
    explode: (e) => throttle('explode' + e.cause, 0.05) && noise(0.35, e.cause === 'trail' ? 900 : 500, e.cause === 'trail' ? 0.12 : 0.3),
    shoot: () => throttle('shoot', 0.09) && tone(700, 0.05, 'square', 0.03, 400),
    turret: () => throttle('turret', 0.06) && tone(1800, 0.04, 'square', 0.03, 1200),
    stage: () => { tone(392, 0.25, 'sawtooth', 0.1, 784); tone(587, 0.35, 'triangle', 0.12, 1175, sfx, 0.08); },
    phase: () => tone(110, 1.2, 'sawtooth', 0.12, 220),
    barrier: () => noise(0.25, 2000, 0.15, 'highpass'),
    warp: () => { tone(1400, 0.12, 'sine', 0.12, 300); noise(0.12, 3000, 0.1, 'highpass'); },
    dashReady: () => tone(988, 0.18, 'triangle', 0.1, 1480),
    drawStart: () => { tone(330, 0.6, 'sine', 0.12, 110); noise(0.5, 600, 0.12, 'lowpass', 150); },
    sonic: () => {
      // a beat of silence, then everything comes back at once
      duckT = 0.22;
      const t = ctx.currentTime;
      sfx.gain.cancelScheduledValues(t);
      sfx.gain.setValueAtTime(0.0001, t);
      sfx.gain.linearRampToValueAtTime(1, t + 0.9);
      setTimeout(() => {
        noise(1.6, 1800, 1.0, 'lowpass', 60, boomBus);
        tone(95, 1.4, 'sine', 0.9, 28, boomBus);
        tone(190, 0.5, 'sawtooth', 0.25, 40, boomBus);
      }, 200);
    },
    end: (e) => {
      if (e.state === 'won') [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.4, 'triangle', 0.18, null, boomBus, i * 0.12));
      else tone(220, 1.2, 'sawtooth', 0.15, 55, boomBus);
    },
  };

  return {
    get muted() { return muted; },
    unlock() {
      try {
        if (!ctx) init();
        if (ctx.state === 'suspended') ctx.resume();
      } catch { /* audio unavailable */ }
    },
    toggleMute() {
      muted = !muted;
      try { window.localStorage.setItem('speed-muted', muted ? '1' : '0'); } catch { /* ignore */ }
      if (master) master.gain.value = muted ? 0 : 0.7;
      return muted;
    },
    handle(events) {
      if (!ctx || ctx.state !== 'running') return;
      for (const e of events) {
        const f = SOUNDS[e.type];
        if (f) try { f(e); } catch { /* ignore */ }
      }
    },
    // Continuous layers: engine pitch, wind, and the high-speed fade toward silence.
    update(game, dt) {
      if (!ctx || ctx.state !== 'running' || !game) return;
      const t = ctx.currentTime;
      const sh = game.ship;
      const sp = Math.hypot(sh.vx, sh.vy);
      const ratio = sp / game.stats.maxSpeed;
      const live = game.state === 'play';
      engine.frequency.setTargetAtTime(45 + sp * 0.05, t, 0.08);
      sub.frequency.setTargetAtTime(22 + sp * 0.025, t, 0.08);
      engineGain.gain.setTargetAtTime(live ? 0.05 + 0.08 * Math.min(1.2, ratio) : 0, t, 0.1);
      windFilter.frequency.setTargetAtTime(250 + sp * 0.9, t, 0.1);
      windGain.gain.setTargetAtTime(live ? Math.min(0.35, sp / 4000) : 0, t, 0.1);
      // approaching max speed the world goes quiet
      const k = Math.max(0, Math.min(1, (ratio - 0.6) / 0.38));
      muffle.frequency.setTargetAtTime(16000 * Math.pow(0.02, k), t, 0.15);
      if (duckT > 0) duckT -= dt;
      else sfx.gain.setTargetAtTime(1 - 0.88 * k, t, 0.2);
    },
  };
}

const STAT_KEYS = new Set(['baseMaxSpeed', 'levelSpeedGrowth', 'launchRatio', 'carry', 'chargeTime', 'dashChargeTime', 'boostDuration', 'cruiseFloor']);

function applyTunable(game, key, value) {
  CONFIG[key] = value;
  if (!game) return;
  if (STAT_KEYS.has(key)) refreshStats(game);
  if (key === 'planetGM') game.field.planet.gm = value;
  if (key === 'moonGM') for (const m of game.field.moons) m.gm = value;
}

function resetConfig(game) {
  for (const t of TUNABLES) applyTunable(game, t.key, DEFAULTS[t.key]);
}

function skipTime(game, sec) {
  const next = Math.min(CONFIG.runTime - 1, game.t + sec);
  game.worldTime = (game.worldTime ?? game.t) + next - game.t;
  game.meteorClock = (game.meteorClock ?? game.t) + next - game.t;
  game.t = next;
}

function jumpToPhase(game, id) {
  const p = PHASES.find((x) => x.id === id);
  if (p) skipTime(game, p.start + 0.01 - game.t);
}

function setScheme(game, id) {
  CONFIG.controlScheme = schemeById(id).id;
  if (game) {
    const wasBuild = game.newBuild;
    game.scheme = CONFIG.controlScheme;
    game.newBuild = isDrawScheme(game.scheme);
    if (game.newBuild !== wasBuild) {
      game.levelChoices = null; game.pendingLevelups = 0; game.rareOffer = null; game.rareQueue = [];
      game.currentOffer = null; game.offerQueue = [];
      if (['weaponSelect', 'levelup', 'offer'].includes(game.state)) game.state = 'play';
      if (game.newBuild) for (const c of game.capsules) {
        if (c.kind !== 'capsule') continue;
        c.kind = 'cache'; c.xp = xpForLevel(game.level) * 0.2; delete c.mod;
      }
    }
    game.draw = null; game.portalDash = null; game.portalPreview = null;

// Independent touch surfaces keep the steering thumb out of the path input.
function createMobileControls({ onDraw, onPause, onDebug }) {
  const active = window.matchMedia('(pointer: coarse)').matches || new URLSearchParams(window.location.search).get('mobile') === '1';
  document.body.classList.toggle('mobile', active);
  const root = document.getElementById('mobileControls');
  const menu = document.getElementById('mobileMenu');
  const menuToggle = document.getElementById('mobileMenuToggle');
  const menuPanel = document.getElementById('mobileMenuPanel');
  let menuOpen = false;
  function closeMenu() { menuOpen = false; menuPanel.hidden = true; menuToggle.setAttribute('aria-expanded', 'false'); }
  menuToggle.addEventListener('click', () => {
    reset(); menuOpen = !menuOpen; menuPanel.hidden = !menuOpen;
    menuToggle.setAttribute('aria-expanded', String(menuOpen));
  });
  window.addEventListener('pointerdown', e => {
    if (!menuOpen || menu.contains(e.target)) return;
    closeMenu(); e.preventDefault(); e.stopImmediatePropagation();
  }, true);
  const stick = document.getElementById('mobileStick');
  const knob = stick.querySelector('.stick-knob');
  const draw = document.getElementById('dashBtn');
  if (!active) document.body.append(draw); // preserve the previous touch shortcut on hybrid PCs
  const canvas = document.getElementById('game');
  let pointerId = null, enabled = false, drawing = false, surface = null;
  let originX = 0, originY = 0;
  stick.hidden = true;
  const vector = { x: 0, y: 0 };
  function reset() {
    const captured = surface, id = pointerId;
    pointerId = null; surface = null; vector.x = vector.y = 0;
    stick.hidden = true;
    knob.style.transform = 'translate(0px, 0px)';
    if (captured && id !== null && captured.hasPointerCapture(id)) captured.releasePointerCapture(id);
  }
  function move(e) {
    const radius = stick.getBoundingClientRect().width * 0.35;
    let x = e.clientX - originX;
    let y = e.clientY - originY;
    const scale = Math.min(1, radius / Math.max(1, Math.hypot(x, y)));
    x *= scale; y *= scale;
    // The world uses the existing stick's pixel scale and dead zone.
    vector.x = x / radius * CONFIG.stickRadius; vector.y = y / radius * CONFIG.stickRadius;
    knob.style.transform = `translate(${x}px, ${y}px)`;
  }
  // Capture steering before the canvas's drawing input. The drawing finger stays
  // independent while the movement finger keeps capture on its original surface.
  if (active) {
    const area = canvas;
    area.addEventListener('pointerdown', e => {
      if (!enabled || e.button !== 0 || e.target.closest('button')) return;
      if (drawing) return;
      e.preventDefault(); e.stopImmediatePropagation();
      if (pointerId !== null) return;
      pointerId = e.pointerId; surface = area;
      originX = e.clientX; originY = e.clientY;
      stick.style.left = `${originX}px`; stick.style.top = `${originY}px`;
      stick.hidden = false;
      area.setPointerCapture(pointerId); move(e);
    }, true);
    area.addEventListener('pointermove', e => {
      if (e.pointerId !== pointerId) return;
      e.preventDefault(); e.stopImmediatePropagation(); move(e);
    }, true);
    for (const event of ['pointerup', 'pointercancel', 'lostpointercapture']) {
      area.addEventListener(event, e => {
        if (e.pointerId !== pointerId) return;
        e.stopImmediatePropagation(); reset();
      }, true);
    }
  }
  draw.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    if ((!active || enabled) && !draw.disabled) { drawing = true; onDraw(); }
  });
  document.getElementById('mobilePause').addEventListener('click', () => { closeMenu(); onPause(); });
  document.getElementById('mobileDebug').addEventListener('click', () => { closeMenu(); onDebug(); });
  window.addEventListener('blur', () => { reset(); closeMenu(); });
  return {
    active, reset,
    get menuOpen() { return menuOpen; },
    read: () => active ? { ...vector } : null,
    sync(game, running, debugOpen) {
      if (!active) return;
      const playable = running && game.state === 'play' && !debugOpen && !menuOpen;
      if (!playable && enabled) reset();
      enabled = playable;
      root.hidden = !running || ['finishing', 'dying', 'won', 'lost'].includes(game.state);
      menu.hidden = root.hidden;
      if (menu.hidden) closeMenu();
      drawing = game.draw?.phase === 'draw';
      draw.classList.toggle('show', playable && (!game.draw || drawing));
      draw.disabled = !drawing && game.dashMeter < CONFIG.drawMinCharge;
      draw.textContent = drawing ? (game.draw.started ? '発動' : '取消') : '描く';
      draw.style.setProperty('--charge', `${Math.max(0, Math.min(1, game.dashMeter)) * 360}deg`);
      draw.setAttribute('aria-label', drawing ? (game.draw.started ? '発動' : 'キャンセル') : `描く：充填${Math.floor(game.dashMeter * 100)}%`);
      document.getElementById('mobilePause').textContent = game.state === 'paused' ? '再開' : '一時停止';
      document.getElementById('mobileDebug').textContent = debugOpen ? '調整を閉じる' : '調整';
    },
  };
}

const canvas = document.getElementById('game');
const renderer = createRenderer(canvas);
const input = createInput(canvas);
const storage = (() => { try { return window.localStorage; } catch { return null; } })();
const save = loadSave(storage);
const audio = createAudio();
window.addEventListener('pointerdown', () => audio.unlock(), true);
window.addEventListener('keydown', () => audio.unlock(), true);

let game = null;
// control scheme is a per-browser preference
try { const c = window.localStorage.getItem('speed-controls-v2'); if (c) CONFIG.controlScheme = c; } catch { /* ignore */ }
try {
  const method = window.localStorage.getItem('speed-draw-input-v1');
  if (method === 'points' || method === 'freehand') CONFIG.drawInput = method;
} catch { /* ignore */ }
// A shareable local preview can opt into the prototype without replacing saved controls.
const previewControls = new URLSearchParams(window.location.search).get('controls');
if (previewControls === 'portal' || isDrawScheme(previewControls)) CONFIG.controlScheme = previewControls;
const mobile = createMobileControls({ onDraw: () => input.triggerDash(), onPause: () => togglePause(), onDebug: () => debug.toggle() });
// Touch uses drawing plus an independent stick, without overwriting PC preferences.
if (mobile.active) CONFIG.controlScheme = 'draw';
renderer.mobile = mobile.active;
const debug = createDebugPanel(() => game, (id) => {
  try { if (!mobile.active) window.localStorage.setItem('speed-controls-v2', id); } catch { /* ignore */ }
  if (mode === 'station') openStation();
}, () => {
  const refund = resetMeta(save);
  writeSave(storage, save);
  if (mode === 'station') openStation(); // the station screen shows the new levels at once
  return refund; // takes effect from the next run
}, (method) => {
  try { window.localStorage.setItem('speed-draw-input-v1', method); } catch { /* ignore */ }
});
let mode = 'station'; // station | run | result
let offerShown = null;

let portraitViewport = window.innerHeight >= window.innerWidth;
window.addEventListener('resize', () => {
  const portrait = window.innerHeight >= window.innerWidth;
  if (mobile.active && portrait !== portraitViewport) {
    mobile.reset(); input.reset();
    if (game?.draw?.phase === 'draw') game.draw = null;
    renderer.cam.ready = false;
  }
  portraitViewport = portrait;
  resizeRenderer(renderer);
});
if (typeof ResizeObserver !== 'undefined') new ResizeObserver(() => resizeRenderer(renderer)).observe(renderer.canvas);
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => resizeRenderer(renderer));
resizeRenderer(renderer);

function openStation() {
  mode = 'station';
  input.state.enabled = false;
  input.reset();
  if (!game) { game = createGame({ meta: save.meta }); game.spawning = false; game.state = 'idle'; }
  showStation(save, (id) => { if (buyUpgrade(save, id)) { writeSave(storage, save); openStation(); } }, startRun);
}

function startRun() {
  debug.hide();
  clearScreens();
  input.reset();
  input.state.enabled = true;
  renderer.cam.ready = false;
  offerShown = null;
  game = createGame({ meta: save.meta, chooseStarter: true });
  input.state.enabled = game.state === 'play';
  mode = 'run';
}

function finishRun() {
  mode = 'result';
  input.state.enabled = false;
  input.reset();
  const before = save.coins;
  applyRunResult(save, game);
  writeSave(storage, save);
  showResult(game, [['獲得部品', `+${save.coins - before}`]], openStation, startRun);
}

function chooseOffer(accept) {
  if (game.state !== 'offer') return;
  resolveOffer(game, accept);
  offerShown = null;
  if (game.state === 'play') { clearScreens(); input.reset(); }
}

function chooseRunCard(index) {
  if (!['weaponSelect', 'levelup'].includes(game.state)) return;
  if (!resolveRunLevel(game, index)) return;
  offerShown = null;
  if (game.state === 'play') { clearScreens(); input.reset(); input.state.enabled = true; }
}

function togglePause() {
  if (mode !== 'run') return;
  if (game.state === 'play') {
    game.state = 'paused';
    input.reset();
    showPause(togglePause, () => { game.state = 'lost'; game.endReason = 'time'; clearScreens(); finishRun(); });
  } else if (game.state === 'paused') {
    game.state = 'play';
    clearScreens();
  }
}

window.addEventListener('keydown', (e) => {
  if (mode === 'run' && ['weaponSelect', 'levelup'].includes(game.state)) {
    if (/^[1-9]$/.test(e.key) && Number(e.key) <= game.levelChoices.length && !e.repeat && !['SELECT', 'INPUT'].includes(e.target.tagName)) { e.preventDefault(); chooseRunCard(Number(e.key) - 1); }
    if (e.key === 'p' || e.key === 'P') debug.toggle();
    return;
  }
  if (mode === 'run' && game.state === 'offer') {
    if (e.key === '1') chooseOffer(true);
    else if (e.key === '2') chooseOffer(false);
    return;
  }
  if (e.key === 'Escape') togglePause();
  if (e.key === 'm' || e.key === 'M') audio.toggleMute();
  if ((e.key === 'p' || e.key === 'P') && !['finishing', 'dying'].includes(game.state)) debug.toggle();
  if (e.key === 'Enter') {
    if (mode === 'station') { e.preventDefault(); startRun(); }
  }
});

// Touch-only shortcut: leave the virtual stick and pick a drawing start. Charge lives in the cursor ring.
const dashBtn = document.getElementById('dashBtn');
function updateDashButton() {
  if (mobile.active) { mobile.sync(game, mode === 'run', debug.open); return; }
  const show = mode === 'run' && isDrawScheme(game.scheme) && game.state === 'play' && !game.draw &&
    (input.state.pointerType === 'touch' || window.matchMedia('(pointer: coarse)').matches);
  dashBtn.classList.toggle('show', show);
  if (!show) return;
  dashBtn.disabled = game.dashMeter < (game.newBuild ? CONFIG.drawMinCharge : 1);
}

window.addEventListener('blur', () => { if (mode === 'run' && game.state === 'play') togglePause(); });

openStation();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  const beforeState = game.state;
  const wasRunning = ['play', 'finishing', 'dying'].includes(beforeState);
  const raw = input.read();
  raw.mobile = mobile.active;
  raw.mobileStick = mobile.read();
  if ((debug.open || mobile.menuOpen) && mobile.active) { raw.mobileStick = { x: 0, y: 0 }; raw.dash = raw.pressed = false; }
  raw.cursor = raw.hover ? screenToWorld(renderer, raw.hover.x, raw.hover.y) : null;
  raw.clickCursor = raw.click ? screenToWorld(renderer, raw.click.x, raw.click.y) : null;
  update(game, dt, buildIntent(raw, game.scheme));
  if (game.state === 'finishing' || game.state === 'dying') input.state.enabled = false;
  if (game.state === 'dying' && (beforeState !== 'dying' || debug.open || offerShown)) {
    input.reset(); clearScreens(); offerShown = null; debug.hide();
  }
  render(renderer, game, dt, input.state);
  updateDashButton();
  audio.handle(game.events);
  audio.update(game, dt);
  debug.tick(game, dt);
  game.events.length = 0;
  if (mode === 'run') {
    if (game.state === 'play' && offerShown) {
      offerShown = null; clearScreens(); input.reset(); input.state.enabled = true;
    }
    if (wasRunning && (game.state === 'won' || game.state === 'lost')) finishRun();
    if (['weaponSelect', 'levelup'].includes(game.state) && offerShown !== game.levelChoices) {
      offerShown = game.levelChoices; input.reset(); input.state.enabled = false;
      showRunLevel(game, chooseRunCard);
    }
    if (game.state === 'offer' && offerShown !== game.currentOffer) {
      offerShown = game.currentOffer;
      input.reset();
      showOffer(game, chooseOffer);
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// console access for debugging
window.__speed = { get game() { return game; }, save };

})();
</script>
