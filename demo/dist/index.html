function predictPath(game, dx, dy, gauge, seconds) {
  const sh = game.ship;
  const len = Math.hypot(dx, dy) || 1;
  const v = launchVelocity(sh.vx, sh.vy, dx / len, dy / len, gauge, game.stats);
  return simulateFrom(game, { x: sh.x, y: sh.y, vx: v.vx, vy: v.vy, boostT: game.stats.boostDuration, fadeT: 0 }, 0, seconds);
}

function simulateFrom(game, ghost, t0, seconds) {
  const pts = [];
  const h = 1 / 60;
  const field = { ...game.field, moons: game.field.moons.map((m) => ({ ...m })) };
  for (let t = t0; t < seconds; t += h) {
    updateMoons(field, game.worldTime + t);
    const g = gravityAt(field, game.worldTime + t, ghost.x, ghost.y);
    stepShip(ghost, game.stats, h, g.ax, g.ay, 0);
    const p = { x: ghost.x, y: ghost.y, sp: Math.hypot(ghost.vx, ghost.vy), t, vx: ghost.vx, vy: ghost.vy };
    pts.push(p);
    if (hitsBody(field, p.x, p.y)) { p.block = true; break; }
  }
  return pts;
}

function hitsBody(field, x, y) {
  const R = CONFIG.shipRadius;
  for (const b of [field.planet, ...field.moons]) {
    if ((x - b.x) ** 2 + (y - b.y) ** 2 < (b.r + R) ** 2) return true;
  }
  return false;
}

// Marks predicted points that cross a weak spot (hot) and stops at the first enemy that would block.
// With the bounce-preview radar the path continues past the block.
function annotatePrediction(game, pts, seconds) {
  const R = CONFIG.shipRadius;
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    let blocker = null;
    queryGrid(game.grid, p.x - R - MAX_ENEMY_R, p.y - R - MAX_ENEMY_R, p.x + R + MAX_ENEMY_R, p.y + R + MAX_ENEMY_R, (e) => {
      const dx = p.x - e.x, dy = p.y - e.y;
      const rr = e.r + R;
      if (dx * dx + dy * dy > rr * rr) return;
      const crit = isWeakHit(e, p.x, p.y, game.stats.weakArcMult);
      if (crit) p.hot = true;
      if (!canPierce(attackPower(p.sp, game.stats), e, crit)) blocker = e;
    });
    out.push(p);
    if (p.block) break;
    if (blocker) {
      p.block = true;
      if (game.stats.predictBounce && seconds) {
        let nx = p.x - blocker.x, ny = p.y - blocker.y;
        const nd = Math.hypot(nx, ny) || 1;
        nx /= nd; ny /= nd;
        let vx = p.vx, vy = p.vy;
        const vn = vx * nx + vy * ny;
        if (vn < 0) { vx -= 2 * vn * nx; vy -= 2 * vn * ny; }
        vx *= game.stats.bounceKeep; vy *= game.stats.bounceKeep;
        const ghost = { x: blocker.x + nx * (blocker.r + R + 1), y: blocker.y + ny * (blocker.r + R + 1), vx, vy, boostT: 0, fadeT: 0 };
        for (const q of simulateFrom(game, ghost, p.t, seconds)) { q.bounced = true; out.push(q); }
      }
      break;
    }
  }
  return out;
}

// ---- effects.js ----

// Module effects that change how the ship attacks, plus field capsules and power cores.













function createEffectState() {
  return {
    fbullets: [], marks: [], mines: [], capsules: [],
    fx2: { waveT: 0, trailDist: 0, lastX: 0, lastY: 0, mineT: 0, turretT: 0, sonicCD: 0, prevSpeed: 0, capsuleT: 0, coreT: 0, coresStarted: false },
    dashActive: false, dashPeakAtk: 0, traceEndHandled: false,
  };
}

function onLaunch(game) {
  if (game.dashActive) finishDash(game);
  game.traceEndHandled = false;
  game.dashActive = true;
  game.dashPeakAtk = 0;
  game.dashPierce = 0;
  game.dashStop = 0;
}

function finishDash(game) {
  game.dashActive = false;
  const eb = game.stats.endBlast;
  if (eb && game.dashPierce >= eb.min) {
    const sh = game.ship;
    explode(game, sh.x, sh.y, eb.radius, game.dashPeakAtk * eb.mult, { cause: 'endBlast', color: '#ff9f40', knock: 500, life: 0.5 });
  }
}

function endTraceAttack(game) {
  game.traceEndHandled = true;
  finishDash(game);
  if (game.newBuild) { onRunEnd(game); return; }
  const pulse = game.stats.traceEndBlast, sh = game.ship;
  if (pulse && game.state === 'play') explode(game, sh.x, sh.y, pulse.radius,
    attackPower(Math.hypot(sh.vx, sh.vy), game.stats) * pulse.mult,
    { cause: 'traceEnd', color: '#c46bff', knock: 500, life: 0.5 });
}

function onPierce(game, x = game.ship.x, y = game.ship.y) {
  const s = game.stats, sh = game.ship;
  if (s.regenGauge) sh.gaugeBank = Math.min(s.gaugeMax, sh.gaugeBank + s.regenGauge);
  if (s.regenGauge && isDrawScheme(game.scheme)) game.dashMeter = Math.min(1, game.dashMeter + s.regenGauge * 0.15);
  if (s.pierceWave) explode(game, x, y, s.pierceWave.radius,
    attackPower(Math.hypot(sh.vx, sh.vy), s) * s.pierceWave.mult,
    { cause: 'pierceWave', color: '#9fe8ff', knock: 350, life: 0.3 });
}

function onShipHurt(game) {
  if (game.newBuild) { onRunHurt(game); return; }
  const s = game.stats, sh = game.ship;
  if (s.reactive) explode(game, sh.x, sh.y, 260, attackPower(s.maxSpeed, s) * s.reactive, { cause: 'reactive', color: '#ff6b5a', knock: 450 });
}

function updateEffects(game, dt) {
  const sh = game.ship, s = game.stats, F = game.fx2;
  const sp = Math.hypot(sh.vx, sh.vy);
  const atkNow = attackPower(sp, s);
  const atkMax = attackPower(s.maxSpeed, s);

  // dash bookkeeping (end-of-dash blast)
  if (sh.boostT > 0 && !game.dashActive && !game.traceEndHandled) { game.dashActive = true; game.dashPeakAtk = 0; }
  if (game.dashActive) {
    game.dashPeakAtk = Math.max(game.dashPeakAtk, atkNow);
    if (sh.boostT <= 0 && !game.portalDash && !game.draw) finishDash(game);
  }

  // charge shockwave
  if (s.chargeWave && sh.charging) {
    F.waveT += dt;
    if (F.waveT >= 0.5) {
      F.waveT = 0;
      explode(game, sh.x, sh.y, s.chargeWave.radius, atkMax * s.chargeWave.mult, { cause: 'chargeWave', color: '#5fd8ff', knock: 350 });
    }
  } else {
    F.waveT = 0.25;
  }

  // trail burst marks
  if (s.trailBurst && sh.boostT > 0 && sp > 200 && !game.portalDash) {
    F.trailDist += sp * dt;
    if (F.trailDist >= 45) {
      F.trailDist = 0;
      game.marks.push({ x: sh.x, y: sh.y, t: 0.55, dmg: atkNow * s.trailBurst });
    }
  }
  for (const m of game.marks) {
    m.t -= dt;
    if (m.t <= 0) explode(game, m.x, m.y, m.radius || 85, m.dmg, { cause: 'trail', color: '#ffcf6b', knock: 120, life: 0.25 });
  }
  if (game.marks.length) game.marks = game.marks.filter((m) => m.t > 0);

  // mines
  if (s.mines && sp > 0.6 * s.maxSpeed) {
    F.mineT += dt;
    if (F.mineT >= 0.2) {
      F.mineT = 0;
      game.mines.push({ x: sh.x, y: sh.y, life: 5, armed: 0.3, dmg: atkMax * s.mines });
    }
  }
  // Vortexes may have moved enemies since the combat grid was built: index their current
  // positions once for all armed mines. Explosions change HP/velocity, not those positions.
  let mineGrid = null;
  let mineMaxRadius = 0;
  for (const m of game.mines) {
    m.life -= dt; m.armed -= dt;
    if (m.armed > 0) continue;
    if (!mineGrid) {
      mineGrid = game.mineGrid = buildGrid(game.enemies, 160, game.mineGrid);
      for (const e of game.enemies) if (!e.dead && e.r > mineMaxRadius) mineMaxRadius = e.r;
    }
    if (gridHasContact(mineGrid, m.x, m.y, 70, mineMaxRadius)) {
      explode(game, m.x, m.y, m.radius || 120, m.dmg, { cause: 'mine', color: '#ff7b54', knock: 300, life: 0.3 });
      m.life = 0;
    }
  }
  if (game.mines.length) game.mines = game.mines.filter((m) => m.life > 0);

  // auto turret
  if (s.turret) {
    F.turretT += dt;
    if (F.turretT >= 1 / (1.6 * s.turret)) {
      let best = null, bd = 650 * 650;
      for (const e of game.enemies) {
        if (e.dead) continue;
        const d = (e.x - sh.x) ** 2 + (e.y - sh.y) ** 2;
        if (d < bd) { bd = d; best = e; }
      }
      if (best) {
        F.turretT = 0;
        const a = Math.atan2(best.y - sh.y, best.x - sh.x);
        game.fbullets.push({ kind: 'shot', x: sh.x, y: sh.y, vx: Math.cos(a) * 1300 + sh.vx * 0.5, vy: Math.sin(a) * 1300 + sh.vy * 0.5, r: 6, dmg: atkMax * 0.22, life: 0.8, pierce: false, hit: new Set(), color: '#9fe8ff' });
        game.events.push({ type: 'turret' });
      }
    }
  }
  updateFriendly(game, dt);

  // sonic boom on crossing 92% of max speed
  F.sonicCD -= dt;
  const thr = 0.92 * s.maxSpeed;
  if (s.sonic && F.sonicCD <= 0 && F.prevSpeed < thr && sp >= thr) {
    F.sonicCD = 2.5;
    explode(game, sh.x, sh.y, s.sonic.radius, atkMax * s.sonic.mult, { cause: 'sonic', color: '#ffffff', knock: 900, life: 0.7 });
    game.events.push({ type: 'sonic', x: sh.x, y: sh.y, radius: s.sonic.radius });
    game.slowmo = 0.45;
  }
  if (sp >= thr && F.prevSpeed < thr) game.events.push({ type: 'barrier', x: sh.x, y: sh.y });
  F.prevSpeed = sp;

  updateCapsules(game, dt);
}

function updateFriendly(game, dt) {
  const B = game.fbullets;
  for (const b of B) {
    const x0 = b.x, y0 = b.y;
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    const bodyHit = clipProjectileToBody(game, b, x0, y0);
    const pad = b.r + 130, hits = [];
    queryGrid(game.grid, Math.min(x0, b.x) - pad, Math.min(y0, b.y) - pad, Math.max(x0, b.x) + pad, Math.max(y0, b.y) + pad, e => {
      if (e.dead || b.hit.has(e.id)) return;
      const t = segCircleT(x0, y0, b.x, b.y, e.x, e.y, b.r + e.r);
      if (t >= 0 && (!bodyHit || t < 1)) hits.push({ e, t });
    });
    hits.sort((a, b) => a.t - b.t);
    const sp = Math.hypot(b.vx, b.vy) || 1;
    for (const { e } of hits) {
      if (b.life <= 0 || e.dead) continue;
      b.hit.add(e.id);
      damageEnemy(game, e, b.dmg, { cause: b.cause || b.kind, noCrit: b.noCrit,
        dirX: b.vx / sp, dirY: b.vy / sp, knock: b.knock ?? 250 });
      if (!b.pierce) { if ((b.pierceLeft || 0) > 0) b.pierceLeft--; else b.life = 0; }
    }
    if (bodyHit) b.life = 0;
  }
  game.fbullets = B.filter(b => b.life > 0);
}

function fieldCapsulePoint(game) {
  const rng = game.rng;
  if (isDrawScheme(game.scheme)) {
    // Put build opportunities within reach of the current fight, rather than across the whole map.
    const distance = Math.max(200, game.viewRadius * (0.25 + rng() * 0.3));
    for (let i = 0; i < 16; i++) {
      const a = rng() * TAU;
      const x = game.ship.x + Math.cos(a) * distance, y = game.ship.y + Math.sin(a) * distance;
      const r = Math.hypot(x, y);
      if (r > CONFIG.planetRadius + 100 && r < CONFIG.fieldRadius - 100) return { x, y, r };
    }
  }
  const roll = rng();
  let r;
  if (roll < 0.4) r = randRange(rng, CONFIG.planetRadius + 200, CONFIG.zoneInner);
  else if (roll < 0.75) r = randRange(rng, CONFIG.zoneOuter, CONFIG.fieldRadius - 150);
  else r = randRange(rng, CONFIG.zoneInner, CONFIG.zoneOuter);
  const a = rng() * TAU;
  return { x: Math.cos(a) * r, y: Math.sin(a) * r, r };
}

function updateCapsules(game, dt) {
  const F = game.fx2, sh = game.ship;
  if (isDrawScheme(game.scheme)) game.capsules = game.capsules.filter(c => c.src !== 'field' || Math.hypot(c.x - sh.x, c.y - sh.y) < game.viewRadius * 2);
  if (game.spawning) {
    F.capsuleT += dt;
    const field = game.capsules.filter((c) => c.src === 'field').length;
    const fieldCount = isDrawScheme(game.scheme) ? CONFIG.drawCapsuleCount : CONFIG.capsuleCount;
    const fieldInterval = isDrawScheme(game.scheme) ? CONFIG.drawCapsuleInterval : CONFIG.capsuleInterval;
    if (field < fieldCount && (game.t < 2 || F.capsuleT >= fieldInterval)) {
      F.capsuleT = 0;
      const p = fieldCapsulePoint(game);
      if (game.newBuild) game.capsules.push({ kind: 'cache', src: 'field', x: p.x, y: p.y, xp: xpForLevel(game.level) * 0.2, age: 0 });
      else {
        const mod = rollModule(game.rng, { t: game.t, loadout: game.loadout, source: 'capsule', danger: dangerAt(p.r), scheme: game.scheme });
        game.capsules.push({ kind: 'capsule', src: 'field', x: p.x, y: p.y, mod, age: 0 });
      }
    }
    if (getPhase(game.t).cores) {
      F.coreT += dt;
      const cores = game.capsules.filter((c) => c.kind === 'core').length;
      if (cores < 3 && (!F.coresStarted || F.coreT >= 20)) {
        F.coreT = 0;
        const a = game.rng() * TAU;
        const r = randRange(game.rng, CONFIG.planetRadius + 250, CONFIG.zoneInner - 300);
        game.capsules.push({ kind: 'core', src: 'core', x: Math.cos(a) * r, y: Math.sin(a) * r, mod: rollModule(game.rng, { source: 'core', t: game.t, loadout: game.loadout }), age: 0 });
        if (!F.coresStarted || cores >= 2) F.coresStarted = true;
        game.events.push({ type: 'core' });
      }
    }
  }
  let taken = false;
  const pull = game.stats.pickupRadius * 1.6;
  for (const c of game.capsules) {
    if (c.taken) continue; // A magnet may have collected this cache earlier in the loop.
    c.age += dt;
    const canCollect = c.kind !== 'heal' || sh.hp < game.stats.maxHp;
    if (c.src === 'drop' || c.src === 'elite') {
      const dx = sh.x - c.x, dy = sh.y - c.y, d = Math.hypot(dx, dy);
      if (canCollect && d < pull && d > 1) { const v = (600 + Math.hypot(sh.vx, sh.vy)) * dt; c.x += (dx / d) * Math.min(v, d); c.y += (dy / d) * Math.min(v, d); }
    }
    const reach = 22 + CONFIG.shipRadius + 14;
    if (canCollect && (c.x - sh.x) ** 2 + (c.y - sh.y) ** 2 < reach * reach) {
      c.taken = true; taken = true;
      if (c.kind === 'core') {
        game.cores++;
        refreshStats(game);
        addText(game, sh.x, sh.y - 50, `出力 +${Math.round(CONFIG.coreBoost * 100)}%`, '#ffd24a');
      } else if (c.kind === 'heal') {
        const before = sh.hp;
        sh.hp = Math.min(game.stats.maxHp, sh.hp + game.stats.maxHp * CONFIG.meteorHealFrac);
        addText(game, sh.x, sh.y - 40, `HP +${Math.round(sh.hp - before)}`, '#67e8b1', 18);
      } else if (c.kind === 'magnet') {
        let xp = 0;
        for (const g of game.gems) if (!g.taken) xp += g.v;
        game.gems.length = 0;
        for (const other of game.capsules) {
          if (other.kind !== 'cache' || other.taken) continue;
          xp += other.xp; other.taken = true;
        }
        addXp(game, xp);
        addText(game, sh.x, sh.y - 45, `XP +${Math.round(xp)}`, CONFIG.xpColor, 22);
      } else if (c.kind === 'rareWeapon') {
        if (game.newBuild) game.rareQueue.push(c.id);
      } else if (c.kind === 'cache') {
        addXp(game, c.xp);
        addText(game, c.x, c.y, 'XP', CONFIG.xpColor);
      } else {
        game.offerQueue.push({ ...c.mod, source: c.src && c.src !== 'field' ? c.src : 'capsule' });
      }
      addRing(game, c.x, c.y, c.kind === 'heal' ? 70 : 120,
        c.kind === 'core' ? '#ffd24a' : c.kind === 'heal' ? '#67e8b1' :
          c.kind === 'cache' || c.kind === 'magnet' ? CONFIG.xpColor : '#9fe8ff', 0.5);
      game.events.push({ type: 'pickup', kind: c.kind, r: c.mod?.r || 0 });
    }
    if (c.kind !== 'rareWeapon' && (c.src === 'elite' || c.src === 'drop') && c.age > 45) { c.taken = true; taken = true; }
  }
  if (taken) game.capsules = game.capsules.filter((c) => !c.taken);
}

// ---- portals.js ----









function portalGrowth(game) {
  return game.stats.maxSpeed / CONFIG.baseMaxSpeed * game.stats.drawLengthMult * game.stats.gaugeMax;
}

function portalReach(game) {
  return CONFIG.portalReach * portalGrowth(game);
}

function portalClearLine(game, x, y, tx, ty) {
  return ![game.field.planet, ...game.field.moons].some((b) =>
    segCircleT(x, y, tx, ty, b.x, b.y, b.r + CONFIG.shipRadius) >= 0);
}

function portalNearby(game, x, y) {
  let best = null, dist = CONFIG.portalSpacing;
  for (const p of game.portals) {
    const d = Math.hypot(p.x - x, p.y - y);
    if (d < dist) { best = p; dist = d; }
  }
  return best;
}

function portalCreate(game, x, y, manual) {
  const p = { id: ++game.portalSerial, x, y, manual, uses: manual ? Infinity : CONFIG.portalDropUses, refillAt: game.t + CONFIG.portalRefillInterval };
  game.portals.push(p);
  addRing(game, x, y, 45, manual ? '#5fd8ff' : '#c995ff', 0.35);
  return p;
}

function placePortal(game) {
  if (game.scheme !== 'portal' || game.portalDash) return null;
  const sh = game.ship;
  if ([game.field.planet, ...game.field.moons].some((b) => Math.hypot(sh.x - b.x, sh.y - b.y) <= b.r + CONFIG.shipRadius + 4)) return null;
  const near = portalNearby(game, sh.x, sh.y);
  if (near?.manual) { addText(game, sh.x, sh.y - 45, '近くに設置済み', '#9fe8ff'); return null; }
  if (game.portals.filter((p) => p.manual).length >= CONFIG.portalManualMax) {
    addText(game, sh.x, sh.y - 45, '設置上限', '#9fe8ff'); return null;
  }
  // A dropped portal can become a permanent anchor without creating an overlapping node.
  if (near) { near.manual = true; near.uses = Infinity; addRing(game, near.x, near.y, 45, '#5fd8ff'); return near; }
  const created = portalCreate(game, sh.x, sh.y, true);
  game.portalTouch = created.id;
  return created;
}

// Check spacing before rolling for a drop. A crowd can replenish one node, not create a pile.
function dropPortal(game, x, y) {
  if (game.scheme !== 'portal' || CONFIG.portalDropChance <= 0) return;
  const near = portalNearby(game, x, y);
  if (near) {
    if (!near.manual && near.uses < CONFIG.portalDropUses && game.t >= near.refillAt) {
      near.uses++;
      near.refillAt = game.t + CONFIG.portalRefillInterval;
      addRing(game, near.x, near.y, 35, '#c995ff', 0.25);
    }
    return;
  }
  if (game.portals.filter((p) => !p.manual).length >= CONFIG.portalDropMax || game.rng() >= CONFIG.portalDropChance) return;
  if ([game.field.planet, ...game.field.moons].some((b) => Math.hypot(x - b.x, y - b.y) <= b.r + CONFIG.shipRadius + 4)) return;
  portalCreate(game, x, y, false);
}

function portalEdgeKey(a, b) {
  const pa = `${a.x},${a.y}`, pb = `${b.x},${b.y}`;
  return pa < pb ? `${pa}|${pb}` : `${pb}|${pa}`;
}

function portalEdgeUnavailable(game, a, b) {
  const key = portalEdgeKey(a, b);
  return game.portalDash?.usedEdges.has(key) || (game.portalCooldowns.get(key) ?? 0) > game.portalClock;
}

function portalAtShip(game) {
  return game.portals.find((p) => Math.hypot(p.x - game.ship.x, p.y - game.ship.y) < CONFIG.portalEntryRadius + CONFIG.shipRadius) ?? null;
}

function portalChoices(game, origin = game.portalDash?.phase === 'hop' ? game.portalDash.target : portalAtShip(game) || game.ship) {
  const reach = Math.min(portalReach(game), game.portalDash?.remaining ?? Infinity);
  const angle = (p) => (Math.atan2(p.y - origin.y, p.x - origin.x) + Math.PI * 2.5) % (Math.PI * 2);
  return game.portals.filter((p) => {
    const dist = Math.hypot(p.x - origin.x, p.y - origin.y);
    return dist >= CONFIG.portalMinHop && dist <= reach && portalClearLine(game, origin.x, origin.y, p.x, p.y)
      && !portalEdgeUnavailable(game, origin, p);
  }).sort((a, b) => angle(a) - angle(b)
    || Math.hypot(a.x - origin.x, a.y - origin.y) - Math.hypot(b.x - origin.x, b.y - origin.y)
    || a.id - b.id).map((p, i) => ({ key: String(i + 1), portal: p }));
}

function portalNearest(game) {
  if (game.portalDash) {
    const origin = game.portalDash.phase === 'hop' ? game.portalDash.target : game.ship;
    return portalChoices(game).map((c) => c.portal).sort((a, b) =>
      Math.hypot(a.x - origin.x, a.y - origin.y) - Math.hypot(b.x - origin.x, b.y - origin.y))[0] ?? null;
  }
  const sh = portalAtShip(game) || game.ship;
  let nearest = null, best = Math.min(portalReach(game), CONFIG.portalBudget * portalGrowth(game));
  for (const p of game.portals) {
    const dist = Math.hypot(p.x - sh.x, p.y - sh.y);
    if (dist < CONFIG.portalEntryRadius + CONFIG.shipRadius || dist > best
      || !portalClearLine(game, sh.x, sh.y, p.x, p.y) || portalEdgeUnavailable(game, sh, p)) continue;
    nearest = p; best = dist;
  }
  return nearest;
}

function portalDefaultNext(game) {
  const d = game.portalDash;
  const origin = d?.phase === 'hop' ? d.target : game.ship;
  let best = null, score = Infinity;
  for (const { portal: p } of portalChoices(game)) {
    const dx = p.x - origin.x, dy = p.y - origin.y, dist = Math.hypot(dx, dy);
    const alignment = (dx * game.ship.hx + dy * game.ship.hy) / dist;
    const penalty = (p.id === d?.previous ? 4 : 0) + (d?.visited.has(p.id) ? 2 : 0);
    const s = (penalty + 1 - alignment) * portalReach(game) + dist * 0.25;
    if (s < score) { best = p; score = s; }
  }
  return best;
}

function startPortalDash(game, entry = null, initialTarget = null) {
  if (!initialTarget && !portalChoices(game, entry || game.ship).length) return false;
  const budget = CONFIG.portalBudget * portalGrowth(game);
  if (entry) { game.ship.x = entry.x; game.ship.y = entry.y; }
  game.portalDash = { phase: 'choose', remaining: budget, budget, usedEdges: new Set(),
    hops: 0, next: null, explicitNext: false, currentPortal: entry?.id ?? null, previous: null,
    visited: new Set(entry ? [entry.id] : []), path: [{ x: game.ship.x, y: game.ship.y }],
    loopPath: [{ x: game.ship.x, y: game.ship.y }], departOnArrival: false };
  game.ship.charging = false;
  onLaunch(game);
  game.ship.boostT = game.stats.boostDuration;
  game.portalDash.next = initialTarget || portalDefaultNext(game);
  game.portalPreview = game.portalDash.next;
  return true;
}

// Sweep the movement segment so fast entries are detected even between physics ticks.
function checkPortalEntry(game, x0, y0) {
  if (game.scheme !== 'portal' || game.portalDash || game.portalSpace.consumed) return;
  const sh = game.ship, R = CONFIG.portalEntryRadius + CONFIG.shipRadius;
  const previousTouch = game.portalTouch;
  game.portalTouch = game.portals.find((p) => Math.hypot(p.x - sh.x, p.y - sh.y) < R)?.id ?? null;
  if (game.t < game.portalEntryT) return;
  let entry = null, first = Infinity;
  for (const p of game.portals) {
    if (p.id === previousTouch) continue;
    const t = segCircleT(x0, y0, sh.x, sh.y, p.x, p.y, R);
    if (t >= 0 && t < first) { entry = p; first = t; }
  }
  if (entry) startPortalDash(game, entry);
}

function stopPortalDash(game, message = '') {
  game.portalDash = null;
  game.portalPreview = null;
  game.portalEntryT = game.t + CONFIG.portalEntryCooldown;
  game.ship.boostT = game.stats.boostDuration;
  if (message) addText(game, game.ship.x, game.ship.y - 48, message, '#e8f6ff');
}

function portalLeave(game, direction) {
  const sh = game.ship, len = Math.hypot(direction.x, direction.y);
  stopPortalDash(game, 'ポータル離脱');
  game.portalPreview = null;
  sh.hx = direction.x / len; sh.hy = direction.y / len;
  const speed = game.stats.maxSpeed * CONFIG.steerCruise;
  sh.vx = sh.hx * speed; sh.vy = sh.hy * speed;
  sh.boostT = 0; sh.fadeT = 0;
}

function handlePortalInput(game, input, realDt = 0) {
  if (game.scheme !== 'portal') return;
  const press = game.portalSpace;
  if (input.portalPressed) { press.armed = true; press.seconds = 0; press.consumed = false; }
  if (press.armed && input.portalHolding) press.seconds += realDt;
  if (press.armed && input.portalHeldTime !== undefined) press.seconds = Math.max(press.seconds, input.portalHeldTime);
  if (press.armed && !press.consumed && press.seconds >= CONFIG.portalExitHold) {
    press.consumed = true;
    if (game.portalDash) portalLeave(game, input.move?.x || input.move?.y ? input.move : { x: game.ship.hx, y: game.ship.hy });
  }
  const confirm = !!input.portalReleased && press.armed && !press.consumed;
  if (input.portalReleased || (!input.portalHolding && !input.portalPressed)) {
    press.armed = false; press.seconds = 0; press.consumed = false;
  }
  if (!game.portalDash) {
    if (input.place) placePortal(game);
    const nearest = portalNearest(game);
    game.portalPreview = nearest;
    if (confirm) {
      const entry = portalAtShip(game);
      if (nearest && startPortalDash(game, entry, nearest)) portalBeginHop(game, nearest, CONFIG.portalEntryRadius + CONFIG.shipRadius);
      else addText(game, game.ship.x, game.ship.y - 45, '到達できるポータルが必要', '#9fe8ff');
    }
    return;
  }
  const d = game.portalDash;
  portalRefreshNext(game);
  if (!game.portalDash) return;
  if (input.portalCycle) {
    const choices = portalChoices(game);
    if (choices.length) {
      const current = Math.max(0, choices.findIndex((c) => c.portal === d.next));
      const index = ((current + input.portalCycle) % choices.length + choices.length) % choices.length;
      d.next = choices[index].portal; d.explicitNext = true;
    }
  }
  game.portalPreview = d.next;
  if (confirm && d.next) {
    if (d.phase === 'choose') portalBeginHop(game, d.next);
    else d.departOnArrival = true;
  }
}

function portalBeginHop(game, target, minDistance = CONFIG.portalMinHop) {
  const d = game.portalDash, sh = game.ship;
  if (!target || !game.portals.includes(target)) return false;
  const len = Math.hypot(target.x - sh.x, target.y - sh.y);
  if (len < minDistance || len > Math.min(portalReach(game), d.remaining)
    || !portalClearLine(game, sh.x, sh.y, target.x, target.y)
    || portalEdgeUnavailable(game, sh, target)) return false;
  d.edgeKey = portalEdgeKey(sh, target);
  d.usedEdges.add(d.edgeKey);
  game.portalCooldowns.set(d.edgeKey, game.portalClock + CONFIG.portalEdgeCooldown);
  d.previous = d.currentPortal;
  d.currentPortal = target.id;
  d.visited.add(target.id);
  d.explicitNext = false;
  d.departOnArrival = false;
  const dx = (target.x - sh.x) / len, dy = (target.y - sh.y) / len;
  const v = launchVelocity(sh.vx, sh.vy, dx, dy, game.stats.gaugeMax, game.stats);
  const speed = Math.max(1, Math.hypot(v.vx, v.vy));
  d.remaining = Math.max(0, d.remaining - len);
  d.phase = 'hop'; d.target = target; d.left = len; d.dx = dx; d.dy = dy;
  d.speed = speed; d.rate = Math.max(speed, len * game.stats.traceSpeedMult / CONFIG.portalHopTime);
  d.inside = new Map(); d.passes = new Map(); d.waveInside = new Map(); d.waveAcc = 0; d.trailAcc = 0;
  sh.vx = dx * speed; sh.vy = dy * speed; sh.hx = dx; sh.hy = dy;
  sh.boostT = game.stats.boostDuration; sh.fadeT = 0; sh.gaugeBank = 0;
  d.next = portalDefaultNext(game);
  game.portalPreview = d.next;
  game.dashId++;
  game.events.push({ type: 'launch', gauge: game.stats.gaugeMax, x: sh.x, y: sh.y, dx, dy });
  return true;
}

function portalRefreshNext(game) {
  const d = game.portalDash;
  if (!d) return;
  if (!portalChoices(game).some((c) => c.portal === d.next)) {
    d.next = portalDefaultNext(game);
    d.explicitNext = false;
  }
  game.portalPreview = d.next;
  if (d.phase === 'choose' && !d.next) {
    if (game.portalSpace.armed) game.portalSpace.consumed = true;
    portalLeave(game, { x: game.ship.hx, y: game.ship.hy });
  }
}

function portalWorldScale(game) {
  const d = game.portalDash;
  if (!d) return 1;
  return d.phase === 'choose' ? CONFIG.portalChooseScale
    : Math.max(CONFIG.drawRunScaleMin, Math.min(1, CONFIG.drawRunSlowRef / Math.max(1, d.speed)));
}

function updatePortals(game, realDt) {
  const d = game.portalDash;
  if (!d) return;
  if (d.phase === 'choose') { portalRefreshNext(game); return; }
  const sh = game.ship;
  let travel = Math.min(d.left, d.rate * realDt);
  // Small swept steps keep body hits, wave hits, obstacles and trail explosions in travel order.
  while (travel > 1e-6) {
    const stepDist = Math.min(20, travel), x0 = sh.x, y0 = sh.y;
    const x1 = x0 + d.dx * stepDist, y1 = y0 + d.dy * stepDist;
    if (!portalClearLine(game, x0, y0, x1, y1)) {
      damageShip(game, Math.max(0, d.speed - 200) * CONFIG.crashDamage, 0, 'portalCrash');
      sh.vx *= -0.4; sh.vy *= -0.4;
      game.events.push({ type: 'bounce', x: x0, y: y0 });
      stopPortalDash(game, '障害物に衝突'); return;
    }
    for (const [id, e] of d.inside) {
      if (e.dead || Math.hypot(x0 - e.x, y0 - e.y) > e.r + CONFIG.shipRadius + 2) d.inside.delete(id);
    }
    sh.x = x1; sh.y = y1;
    sh.vx = d.dx * d.speed; sh.vy = d.dy * d.speed;
    waveAlong(game, d, x0, y0, x1, y1);
    if (game.state === 'finishing') return;
    if (collideEnemies(game, x0, y0, CONFIG.shipRadius, d)) { stopPortalDash(game, '弾かれた'); return; }
    if (game.state === 'finishing') return;
    d.speed = Math.hypot(sh.vx, sh.vy);
    tracePortalLoop(game, d, x0, y0, sh.x, sh.y);
    d.trailAcc += stepDist;
    if (game.stats.trailBurst && d.trailAcc >= 45) {
      d.trailAcc = 0;
      game.marks.push({ x: x1, y: y1, t: 0.55, dmg: attackPower(d.speed, game.stats) * game.stats.trailBurst });
    }
    sh.trail.push({ x: sh.x, y: sh.y });
    if (sh.trail.length > 150) sh.trail.shift();
    travel -= stepDist; d.left -= stepDist;
    game.dashPeakAtk = Math.max(game.dashPeakAtk, attackPower(d.speed, game.stats));
    if (sh.hp <= 0) { stopPortalDash(game); return; }
  }
  if (d.left > 1e-6) return;
  sh.x = d.target.x; sh.y = d.target.y;
  game.portalCooldowns.set(d.edgeKey, game.portalClock + CONFIG.portalEdgeCooldown);
  d.path.push({ x: sh.x, y: sh.y });
  const loopEnd = d.loopPath[d.loopPath.length - 1];
  if (Math.hypot(loopEnd.x - sh.x, loopEnd.y - sh.y) > 1e-6) d.loopPath.push({ x: sh.x, y: sh.y });
  game.portalTouch = d.target.id;
  if (!d.target.manual) {
    d.target.uses--;
    d.target.refillAt = game.t + CONFIG.portalRefillInterval;
    if (d.target.uses <= 0) game.portals = game.portals.filter((p) => p !== d.target);
  }
  d.hops++;
  d.phase = 'choose';
  const wave = game.stats.portalWave;
  if (wave) explode(game, sh.x, sh.y, CONFIG.portalWaveRadius * game.stats.waveRadiusMult,
    attackPower(d.speed, game.stats) * CONFIG.portalWaveDamage * wave * game.stats.waveDmgMult,
    { cause: 'portalWave', color: '#c995ff', knock: 500, life: 0.45 });
  else addRing(game, sh.x, sh.y, 48, '#9fe8ff', 0.25);
  // Include routes opened by kills while retaining an explicit choice made in flight.
  portalRefreshNext(game);
  if (!game.portalDash) return;
  if (d.departOnArrival && d.next) portalBeginHop(game, d.next);
  else d.departOnArrival = false;
}

// ---- hits.js ----
// Damage, kills, drops and area attacks applied to enemies.












function damageEnemy(game, e, dmg, opts = {}) {
  if (e.dead || game.state === 'finishing' || game.state === 'dying' || dmg <= 0) return;
  let critical = !!opts.crit;
  if (game.newBuild && opts.crit === undefined && !opts.noCrit) {
    critical = game.rng() < game.stats.critChance;
    if (critical) dmg *= game.stats.critMult;
  }
  opts = { ...opts, crit: critical };
  let fresh = e.hp >= e.maxHp - 1e-6;
  // during a traced dash, the wave reaches an enemy just before the body does: judge "one-shot"
  // by its HP when this dash first touched it, so wave + body still count as one strike
  if ((game.draw && game.draw.phase === 'run') || game.portalDash) {
    if (e.dashSeen !== game.dashId) { e.dashSeen = game.dashId; e.dashFresh = fresh; }
    fresh = e.dashFresh;
  }
  e.hp -= dmg;
  e.flash = 0.12;
  game.events.push({ type: 'hit', x: e.x, y: e.y, crit: !!opts.crit, dmg, cause: opts.cause });
  if (opts.crit) addText(game, e.x, e.y - e.r - 10, 'CRIT', '#ffe46b');
  if (e.hp <= 0) {
    if (fresh && (opts.cause === 'ram' || opts.cause === 'wave')) killStop(game, e, opts.crit);
    killEnemy(game, e, opts);
  } else if (opts.dirX !== undefined) {
    const k = opts.knock ?? 160;
    const mass = Math.max(1, e.r / 20);
    e.vx += (opts.dirX * k) / mass; e.vy += (opts.dirY * k) / mass;
    if (['sonic', 'killSonic', 'critBeam', 'laser', 'bipolar', 'towShot'].includes(opts.cause) && e.type !== 'boss') e.knockT = 0.3;
  }
  if (game.newBuild && critical && !opts.noCrit) onRunCritical(game, opts.impactX ?? e.x, opts.impactY ?? e.y);
}

// One-shot ram kills freeze the action for a beat, so each kill in a sweep lands on its own.
function killStop(game, e, crit) {
  if (game.dashStop >= CONFIG.killHitstopCap) return;
  const t = CONFIG.killHitstop * (e.r > 25 ? 1.8 : 1) * (crit ? 1.3 : 1);
  game.hitstop = Math.max(game.hitstop, t);
  game.dashStop = (game.dashStop || 0) + t;
}

function killEnemy(game, e, opts = {}) {
  if (e.dead || game.state === 'finishing') return;
  if (e === game.boss) { beginBossFinish(game, e, opts); return; }
  e.dead = true;
  const towed = captureTowHull(game, e, opts.cause);
  if (e.worldMeteor) e.worldMeteor.destroyed = true;
  game.kills++;
  game.events.push({ type: 'kill', x: e.x, y: e.y, r: e.r, crit: !!opts.crit, enemyType: e.type, elite: e.elite, cause: opts.cause });
  const forceful = ['sonic', 'killSonic', 'critBeam', 'laser', 'bipolar', 'towShot'].includes(opts.cause);
  if (!towed && opts.cause !== 'towShot' && game.newBuild && e.r >= CONFIG.hullDebrisMinRadius && e.type !== 'meteor' && opts.cause !== 'hullDebris' &&
      !(opts.cause === 'ram' && game.weapons.knockback)) {
    const shove = e.shove;
    const speed = shove ? Math.hypot(shove.vx, shove.vy) : forceful ? CONFIG.hullDebrisForceSpeed : CONFIG.hullDebrisSpeed;
    scatterHull(game, e, shove ? shove.vx / (speed || 1) : opts.dirX || 0,
      shove ? shove.vy / (speed || 1) : opts.dirY || 0, speed,
      attackPower(0, game.stats) * CONFIG.hullDebrisDamage);
  }
  burst(game, e.x, e.y, e.T.color, towed ? 4 : 6 + Math.round(e.r / 3), opts.dirX || 0, opts.dirY || 0, (260 + e.r * 4) * (forceful ? 1.8 : 1));
  onEnemyDeath(e, game);
  dropPortal(game, e.x, e.y);
  const phase = getPhase(game.t);
  const danger = dangerAt(Math.hypot(e.x, e.y));
  const xp = e.xp * game.stats.xpMult * CONFIG.xpMult * (phase.xpBonus || 1) * (1 + danger);
  dropGem(game, e.x, e.y, xp);
  dropCoins(game, e, danger);
  if (game.newBuild && e.worldMeteor?.rareWeapon) {
    game.capsules.push({ kind: 'rareWeapon', id: e.worldMeteor.rareWeapon, src: 'drop', x: e.x, y: e.y, age: 0 });
  }
  if (e.type === 'meteor' && game.rng() < CONFIG.meteorHealChance) {
    game.capsules.push({ kind: 'heal', src: 'drop', x: e.x, y: e.y, age: 0 });
  }
  if (e.type === 'meteor' && game.rng() < CONFIG.meteorMagnetChance) {
    game.capsules.push({ kind: 'magnet', src: 'drop', x: e.x, y: e.y, age: 0 });
  }
  // Roll independently for each kill; drop frequency is controlled by probability, not a timer.
  const power = e.xp;
  const chance = Math.min(CONFIG.dropMax, CONFIG.dropBase * Math.pow(power, CONFIG.dropPowerExp));
  if (game.rng() < chance) {
    dropModule(game, e.x, e.y, power, danger);
  }
  if (opts.cause === 'ram' && game.stats.fling) flingCorpse(game, e);
  onRunKill(game, opts.cause);
}

// Evenly spaced fragments expose the direction of a successful hit without consuming drop RNG.
// Fragment kills never create more fragments, keeping large chain attacks finite.
function scatterHull(game, e, ux, uy, speed, dmg) {
  if (e.r < CONFIG.hullDebrisMinRadius || e.type === 'meteor' || e.type === 'boss' || e.hullScattered) return false;
  e.hullScattered = true;
  const count = Math.min(CONFIG.hullDebrisMaxPieces, Math.max(6, Math.ceil(e.r / 12)));
  const directed = Math.hypot(ux, uy) > 0.01;
  const base = directed ? Math.atan2(uy, ux) : e.facing || 0;
  const spread = directed ? Math.PI * 0.85 : Math.PI * 2;
  for (let i = 0; i < count; i++) {
    const a = base + (directed ? i / (count - 1) - 0.5 : i / count) * spread;
    const dx = Math.cos(a), dy = Math.sin(a), v = speed * (0.85 + (i % 3) * 0.12);
    game.fbullets.push({ kind: 'corpse', cause: 'hullDebris', noCrit: true,
      x: e.x + dx * e.r * 0.3, y: e.y + dy * e.r * 0.3,
      vx: dx * v, vy: dy * v, r: Math.min(20, Math.max(10, e.r * 0.17)), dmg,
      life: CONFIG.hullDebrisLife, pierce: true, hit: new Set([e.id]), color: e.T.color, knock: 500 });
  }
  return true;
}

function flingCorpse(game, e) {
  const sh = game.ship;
  const sp = Math.hypot(sh.vx, sh.vy);
  if (sp < 1) return;
  const base = Math.atan2(sh.vy, sh.vx);
  const dmg = attackPower(sp, game.stats) * game.stats.fling;
  for (const off of [-0.28, 0, 0.28]) {
    const a = base + off;
    game.fbullets.push({
      kind: 'corpse', x: e.x, y: e.y, vx: Math.cos(a) * sp * 0.9, vy: Math.sin(a) * sp * 0.9,
      r: Math.max(10, e.r * 0.8), dmg, life: 0.7, pierce: true, hit: new Set(), color: e.T.color,
    });
  }
}

function dropCoins(game, e, danger) {
  let n = 0;
  if (e.type === 'battleship') n = 12;
  else if (e.elite) n = 3 + Math.floor(game.rng() * 4);
  else if (e.type === 'meteor') n = game.rng() < CONFIG.meteorCoinChance ? 1 + Math.floor(game.rng() * 3) : 0;
  else if (game.rng() < 0.03 * (1 + danger * 2)) n = 1;
  for (let i = 0; i < n; i++) {
    const a = game.rng() * Math.PI * 2, d = game.rng() * e.r;
    game.coinDrops.push({ x: e.x + Math.cos(a) * d, y: e.y + Math.sin(a) * d, v: 1, pulled: false, taken: false });
  }
}

function dropGem(game, x, y, v) {
  if (game.gems.length > 600) {
    const old = game.gems.shift();
    v += old.v;
  }
  const a = game.rng() * Math.PI * 2;
  game.gems.push({ x: x + Math.cos(a) * 8, y: y + Math.sin(a) * 8, v, age: 0, pulled: false, taken: false });
}

function dropModule(game, x, y, power, danger) {
  if (game.newBuild) {
    game.capsules.push({ kind: 'cache', src: 'drop', x, y, xp: xpForLevel(game.level) * 0.15, age: 0 });
    return;
  }
  const mod = rollModule(game.rng, { t: game.t, loadout: game.loadout, source: 'drop', power, danger, scheme: game.scheme });
  game.capsules.push({ kind: 'capsule', src: 'drop', x, y, mod, age: 0 });
}

function dropCapsule(game, x, y, src, danger) {
  if (game.newBuild) {
    game.capsules.push({ kind: 'cache', src, x, y, xp: xpForLevel(game.level) * 0.2, age: 0 });
    return;
  }
  const mod = rollModule(game.rng, { t: game.t, loadout: game.loadout, source: 'capsule', danger, scheme: game.scheme });
  game.capsules.push({ kind: 'capsule', src, x, y, mod, age: 0 });
}

// Area damage that ignores armor (module effects, sonic booms).
function explode(game, x, y, radius, dmg, opts = {}) {
  const knock = opts.knock ?? 300;
  for (const e of game.enemies) {
    if (e.dead) continue;
    const dx = e.x - x, dy = e.y - y;
    const rr = radius + e.r;
    const d2 = dx * dx + dy * dy;
    if (d2 > rr * rr) continue;
    const d = Math.sqrt(d2) || 1;
    damageEnemy(game, e, dmg, { cause: opts.cause, dirX: dx / d, dirY: dy / d, knock });
  }
  addRing(game, x, y, radius, opts.color || '#ffb36b', opts.life || 0.4);
  game.events.push({ type: 'explode', x, y, radius, cause: opts.cause });
}

function burst(game, x, y, color, n, dx, dy, speed) {
  const P = game.fx.particles;
  if (P.length > 1600) return;
  for (let i = 0; i < n; i++) {
    const a = game.rng() * Math.PI * 2;
    const s = speed * (0.3 + game.rng());
    P.push({
      x, y,
      vx: Math.cos(a) * s * 0.6 + dx * s * 0.8,
      vy: Math.sin(a) * s * 0.6 + dy * s * 0.8,
      life: 0.5 + game.rng() * 0.4, max: 0.9, color, size: 2 + game.rng() * 4,
    });
  }
}

function addText(game, x, y, text, color, size = 16) {
  if (game.fx.texts.length > 40) game.fx.texts.shift();
  game.fx.texts.push({ x, y, text, color, life: size > 16 ? 0.9 : 0.7, size });
}

function addRing(game, x, y, radius, color, life = 0.45) {
  if (game.fx.rings.length > 80) game.fx.rings.shift();
  game.fx.rings.push({ x, y, radius, color, life, max: life });
}

// ---- finale.js ----



// Only keep the recent approach while the boss is alive; no world snapshots or replayed damage.
function recordBossApproach(game, dt) {
  if (!game.boss || game.boss.dead) return;
  game.finishClock += dt;
  const sh = game.ship, frames = game.finishFrames;
  frames.push({ t: game.finishClock - dt, x: sh.x, y: sh.y, vx: sh.vx, vy: sh.vy });
  const cutoff = game.finishClock - CONFIG.bossFinishReplayWindow;
  while (frames.length > 2 && frames[1].t < cutoff) frames.shift();
  if (frames.length > 64) frames.shift();
}

function beginBossFinish(game, boss, hit = {}) {
  if (game.finale) return;
  const sh = game.ship;
  const impact = { t: game.finishClock, x: hit.impactX ?? sh.x, y: hit.impactY ?? sh.y, vx: sh.vx, vy: sh.vy };
  const frames = [...game.finishFrames, impact];
  game.finale = { phase: 'slow', elapsed: 0, boss, frames, impact };
  game.state = 'finishing';
  game.endReason = 'boss';
  game.spawning = false;
  game.hitstop = game.slowmo = game.acc = 0;
  game.draw = game.portalDash = game.releasePending = null;
  game.offerQueue.length = 0;
  game.currentOffer = null;
  sh.charging = false; sh.invulnT = 0;
  game.events.push({ type: 'bossFinish' });
}

// Timings are in real seconds. The slow segment replays positions, never combat or pickups.
function advanceBossFinish(game, dt) {
  const f = game.finale, sh = game.ship;
  f.elapsed += dt;
  if (f.phase === 'slow') {
    const k = Math.min(1, f.elapsed / CONFIG.bossFinishSlowTime);
    const frames = f.frames;
    const start = Math.max(frames[0].t, f.impact.t - CONFIG.bossFinishReplayWindow);
    const time = start + (f.impact.t - start) * k;
    let i = 0;
    while (i < frames.length - 2 && frames[i + 1].t < time) i++;
    const a = frames[i], b = frames[i + 1] || a;
    const mix = Math.max(0, Math.min(1, (time - a.t) / (b.t - a.t || 1)));
    for (const key of ['x', 'y', 'vx', 'vy']) sh[key] = a[key] + (b[key] - a[key]) * mix;
    sh.trail = frames.slice(0, i + 1).map(p => ({ x: p.x, y: p.y }));
    game.timeScale = CONFIG.bossFinishReplayWindow / CONFIG.bossFinishSlowTime;
    f.boss.flash = 0.12;
    if (k < 1) return false;
    sh.trail = [];
    sh.invulnT = 0;
    f.phase = 'blast'; f.elapsed = 0;
    bossClearBlast(game);
  } else {
    game.timeScale = 1;
    // Release the shot at normal speed, then let it settle as the camera opens back out.
    sh.x += sh.vx * dt; sh.y += sh.vy * dt;
    const drag = Math.exp(-3 * dt);
    sh.vx *= drag; sh.vy *= drag;
    sh.trail.push({ x: sh.x, y: sh.y });
    if (sh.trail.length > 64) sh.trail.shift();
    if (f.phase === 'blast' && f.elapsed >= CONFIG.bossFinishBlastTime) {
      f.phase = 'clear'; f.elapsed = 0;
    }
  }
  return f.phase === 'clear' && f.elapsed >= CONFIG.bossFinishClearTime;
}

function bossClearBlast(game) {
  const f = game.finale, boss = f.boss;
  game.timeScale = 1;
  game.fx.particles = [];
  // This is the victory sweep, not a chain of gameplay kills: no drops, splits or extra offers.
  burst(game, boss.x, boss.y, '#ffe3a3', 90, 0, 0, 900);
  for (const e of new Set([boss, ...game.enemies, ...game.newEnemies])) {
    if (e.dead) continue;
    e.dead = true;
    game.kills++;
    const dx = e.x - boss.x, dy = e.y - boss.y, d = Math.hypot(dx, dy) || 1;
    if (e !== boss) burst(game, e.x, e.y, e.T.color, 4, dx / d, dy / d, 500);
    if (game.fx.particles.length < 1400) for (let i = 0; i < (e === boss ? 24 : 3); i++) {
      const a = Math.random() * Math.PI * 2, speed = 150 + Math.random() * 550;
      game.fx.particles.push({ kind: 'finishDebris', x: e.x, y: e.y,
        vx: Math.cos(a) * speed + dx / d * 300, vy: Math.sin(a) * speed + dy / d * 300,
        life: CONFIG.bossFinishBlastTime, max: CONFIG.bossFinishBlastTime,
        color: e.T.color, size: e === boss ? 10 + Math.random() * 16 : 3 + Math.random() * 5,
        angle: a, spin: (Math.random() - 0.5) * 8 });
    }
  }
  boss.dead = true;
  game.enemies = []; game.newEnemies = []; game.ebullets = []; game.fbullets = [];
  game.mines = []; game.capsules = []; game.gems = []; game.coinDrops = [];
  game.marks = []; game.wproj = []; game.wfx = []; game.wstate = {};
  game.sonicWaves = []; game.drones = []; game.vortexes = []; game.runPaths = []; game.runPendingPath = [];
  game.fx.texts = [];
  const radius = Math.max(900, game.viewRadius * 1.4);
  addRing(game, boss.x, boss.y, radius, '#ffe7aa', 0.85);
  addRing(game, boss.x, boss.y, radius * 0.8, '#ff526e', 0.7);
  game.events.push({ type: 'bossExplosion', x: boss.x, y: boss.y });
}

function finishCameraTarget(game, W, H, baseZoom) {
  const f = game.finale;
  if (!f || game.state !== 'finishing') return null;
  const sh = game.ship, boss = f.boss;
  const zoom = baseZoom * CONFIG.bossFinishZoom;
  const dx = boss.x - sh.x, dy = boss.y - sh.y, dist = Math.hypot(dx, dy) || 1;
  const offset = Math.min(dist * 0.25, Math.min(W, H) * 0.2 / zoom);
  if (f.phase === 'slow') return { x: sh.x + dx / dist * offset, y: sh.y + dy / dist * offset, zoom };
  if (f.phase === 'blast') return { x: boss.x, y: boss.y, zoom: baseZoom };
  return { x: sh.x, y: sh.y, zoom: baseZoom };
}

function drawBossFinish(r, game) {
  const f = game.finale;
  if (!f || game.state !== 'finishing') return;
  const { ctx, W, H } = r;
  ctx.save();
  if (f.phase === 'slow') {
    // A vignette draws attention to the actual final approach without explanatory HUD.
    const vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.18, W / 2, H / 2, Math.max(W, H) * 0.65);
    vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,0.65)');
    ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
  } else {
    const blastAge = f.phase === 'blast' ? f.elapsed : CONFIG.bossFinishBlastTime + f.elapsed;
    const p = { x: (f.boss.x - r.cam.x) * r.cam.zoom + W / 2, y: (f.boss.y - r.cam.y) * r.cam.zoom + H / 2 };
    const radius = Math.max(1, (70 + blastAge * 1400) * r.cam.zoom);
    const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, radius);
    const alpha = Math.max(0, 0.8 * (1 - blastAge / 1.1));
    glow.addColorStop(0, `rgba(255,248,215,${alpha})`);
    glow.addColorStop(0.25, `rgba(255,150,60,${alpha * 0.7})`);
    glow.addColorStop(1, 'rgba(255,70,70,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  }
  if (f.phase === 'clear') {
    ctx.globalAlpha = Math.min(1, f.elapsed / 0.2);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 ${Math.min(104, W * 0.17, H * 0.2)}px system-ui, sans-serif`;
    ctx.shadowColor = '#ffac32'; ctx.shadowBlur = 28;
    ctx.fillStyle = '#fff2bf'; ctx.fillText('CLEAR!', W / 2, H / 2);
  }
  ctx.restore();
}

function beginShipDeath(game) {
  if (game.state !== 'play' || game.death) return;
  game.death = { phase: 'freeze', elapsed: 0 };
  game.state = 'dying'; game.endReason = 'hp'; game.spawning = false;
  game.hitstop = game.slowmo = game.acc = 0;
  game.draw = game.portalDash = game.releasePending = null;
  game.offerQueue.length = 0; game.pendingLevelups = 0; game.currentOffer = null;
  game.ship.charging = false; game.ship.invulnT = 0;
  game.events.push({ type: 'shipDeath' });
}

function advanceShipDeath(game, dt) {
  const f = game.death;
  f.elapsed += dt;
  if (f.phase === 'freeze' && f.elapsed >= CONFIG.deathFreezeTime) {
    f.phase = 'blast'; f.elapsed = 0;
    const sh = game.ship;
    for (const key of Object.keys(game.fx)) game.fx[key] = [];
    game.sonicWaves = []; game.wfx = []; game.drones = [];
    burst(game, sh.x, sh.y, '#a8eeff', 65, 0, 0, 650);
    burst(game, sh.x, sh.y, '#ffb65b', 35, 0, 0, 450);
    addRing(game, sh.x, sh.y, 160, '#ffd5a0', 0.6);
    for (let i = 0; i < 12; i++) {
      const a = game.rng() * Math.PI * 2, speed = 100 + game.rng() * 320;
      game.fx.particles.push({ kind: 'finishDebris', x: sh.x, y: sh.y,
        vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
        life: 1.4, max: 1.4, color: i % 2 ? '#bff3ff' : '#1b3b5c',
        size: 4 + game.rng() * 8, angle: a, spin: (game.rng() - 0.5) * 10 });
    }
  } else if (f.phase === 'blast' && f.elapsed >= CONFIG.deathExplosionTime) {
    f.phase = 'over'; f.elapsed = 0;
  }
  return f.phase === 'over' && f.elapsed >= CONFIG.deathGameOverTime;
}

function drawShipDeath(r, game) {
  if (!game.death || game.state !== 'dying' || game.death.phase !== 'over') return;
  const { ctx, W, H } = r;
  ctx.save(); ctx.globalAlpha = Math.min(1, game.death.elapsed / 0.2);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `900 ${Math.min(90, W * 0.13, H * 0.18)}px system-ui, sans-serif`;
  ctx.shadowColor = '#ff526e'; ctx.shadowBlur = 20;
  ctx.fillStyle = '#ffe0e5'; ctx.fillText('GAME OVER', W / 2, H / 2);
  ctx.restore();
}

// ---- parts.js ----
// Module slots drawn as spaceship parts. Each part has its own silhouette, and the six of them
// assemble into one ship (nose, radar, gun, reactor, wings, engine). Pure canvas drawing.

const TAU_P = Math.PI * 2;

// Where each part sits in the assembled ship, in units (ship points up, center = reactor).
const PART_LAYOUT = {
  armor: { x: 0, y: 0.35, s: 1 },
  booster: { x: 0, y: 1.85, s: 1 },
  gen: { x: 0, y: -0.05, s: 0.95 },
  gun: { x: 1.15, y: -1.0, s: 0.8 },
  radar: { x: -1.15, y: -1.0, s: 0.8 },
  bow: { x: 0, y: -2.2, s: 1 },
};
const DRAW_ORDER = ['armor', 'booster', 'gen', 'gun', 'radar', 'bow'];

function trace(ctx, slot, s) {
  ctx.beginPath();
  switch (slot) {
    case 'bow': // nose cone
      ctx.moveTo(0, -1.15 * s);
      ctx.quadraticCurveTo(0.8 * s, -0.25 * s, 0.62 * s, 0.85 * s);
      ctx.lineTo(-0.62 * s, 0.85 * s);
      ctx.quadraticCurveTo(-0.8 * s, -0.25 * s, 0, -1.15 * s);
      break;
    case 'booster': // twin engine bells
      for (const sx of [-1, 1]) {
        const cx = sx * 0.42 * s;
        ctx.moveTo(cx - 0.26 * s, -0.55 * s);
        ctx.lineTo(cx + 0.26 * s, -0.55 * s);
        ctx.lineTo(cx + 0.4 * s, 0.45 * s);
        ctx.lineTo(cx - 0.4 * s, 0.45 * s);
        ctx.closePath();
      }
      break;
    case 'gun': // turret + barrel
      ctx.rect(-0.16 * s, -1.15 * s, 0.32 * s, 1.15 * s);
      ctx.moveTo(0.48 * s, 0.25 * s);
      ctx.arc(0, 0.25 * s, 0.48 * s, 0, TAU_P);
      break;
    case 'radar': // dish on a mast
      ctx.moveTo(-0.85 * s, -0.55 * s);
      ctx.quadraticCurveTo(0, 0.55 * s, 0.85 * s, -0.55 * s);
      ctx.quadraticCurveTo(0, -0.05 * s, -0.85 * s, -0.55 * s);
      ctx.rect(-0.1 * s, 0, 0.2 * s, 0.75 * s);
      break;
    case 'armor': // a pair of swept wing plates
      for (const sx of [-1, 1]) {
        ctx.moveTo(sx * 0.45 * s, -0.55 * s);
        ctx.lineTo(sx * 1.55 * s, 0.35 * s);
        ctx.lineTo(sx * 1.55 * s, 0.95 * s);
        ctx.lineTo(sx * 0.45 * s, 0.55 * s);
        ctx.closePath();
      }
      break;
    case 'gen': // hexagonal reactor
    default:
      for (let i = 0; i < 6; i++) {
        const a = i * TAU_P / 6 - Math.PI / 2;
        if (i === 0) ctx.moveTo(Math.cos(a) * 0.72 * s, Math.sin(a) * 0.72 * s);
        else ctx.lineTo(Math.cos(a) * 0.72 * s, Math.sin(a) * 0.72 * s);
      }
      ctx.closePath();
  }
}

// One part at the origin. color = rarity color (filled), or null for an empty outline.
function drawPart(ctx, slot, s, color, opts = {}) {
  ctx.save();
  if (color) {
    if (opts.glow) { ctx.shadowColor = color; ctx.shadowBlur = opts.glow; }
    trace(ctx, slot, s);
    ctx.fillStyle = color;
    ctx.fill('nonzero');
    ctx.shadowBlur = 0;
    ctx.lineWidth = Math.max(1, s * 0.09);
    ctx.strokeStyle = 'rgba(10,14,30,0.75)';
    ctx.stroke();
    // small details so the parts read as machinery
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    if (slot === 'bow') { ctx.beginPath(); ctx.ellipse(0, -0.2 * s, 0.18 * s, 0.3 * s, 0, 0, TAU_P); ctx.fill(); }
    if (slot === 'gen') { ctx.beginPath(); ctx.arc(0, 0, 0.3 * s, 0, TAU_P); ctx.fill(); }
    if (slot === 'radar') { ctx.beginPath(); ctx.arc(0, -0.25 * s, 0.11 * s, 0, TAU_P); ctx.fill(); }
    if (slot === 'gun') { ctx.fillRect(-0.16 * s, -1.15 * s, 0.32 * s, 0.16 * s); }
    if (slot === 'booster' && opts.flame !== false) {
      ctx.fillStyle = 'rgba(255,170,80,0.85)';
      for (const sx of [-1, 1]) {
        const cx = sx * 0.42 * s;
        ctx.beginPath(); ctx.moveTo(cx - 0.26 * s, 0.5 * s); ctx.lineTo(cx + 0.26 * s, 0.5 * s); ctx.lineTo(cx, 1.1 * s); ctx.closePath(); ctx.fill();
      }
    }
  } else {
    trace(ctx, slot, s);
    ctx.setLineDash([Math.max(2, s * 0.18), Math.max(2, s * 0.14)]);
    ctx.lineWidth = Math.max(1, s * 0.07);
    ctx.strokeStyle = opts.outline || 'rgba(190,205,240,0.35)';
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

// The whole ship. colorOf(slot) -> rarity color or null (empty). highlight: slot to pulse.
function drawShipAssembly(ctx, cx, cy, unit, colorOf, highlight, t = 0) {
  ctx.save();
  ctx.translate(cx, cy);
  // chassis spine that holds the parts
  ctx.strokeStyle = 'rgba(160,180,230,0.25)';
  ctx.lineWidth = Math.max(1, unit * 0.12);
  ctx.beginPath(); ctx.moveTo(0, -1.4 * unit); ctx.lineTo(0, 1.3 * unit); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-1.15 * unit, -0.75 * unit); ctx.lineTo(1.15 * unit, -0.75 * unit); ctx.stroke();
  for (const slot of DRAW_ORDER) {
    const L = PART_LAYOUT[slot];
    ctx.save();
    ctx.translate(L.x * unit, L.y * unit);
    const color = colorOf(slot);
    drawPart(ctx, slot, L.s * unit, color, { glow: color ? unit * 0.4 : 0 });
    if (slot === highlight) {
      const pulse = 0.5 + 0.5 * Math.sin(t * 6);
      drawPart(ctx, slot, L.s * unit * (1.12 + 0.06 * pulse), null, { outline: `rgba(255,255,255,${0.5 + 0.5 * pulse})` });
    }
    ctx.restore();
  }
  ctx.restore();
}

// ---- debris.js ----



// Renderer-owned history follows the actual projectiles, including during world slowdown.
function drawCorpseDebris(r, game, dt) {
  if (r.debrisGame !== game) {
    r.debrisGame = game;
    r.debrisTime = 0;
    r.debrisTracks = new Map();
  }
  if (game.state === 'play') r.debrisTime += dt;
  const now = r.debrisTime;
  const cutoff = now - CONFIG.corpseTrailLife;
  const tracks = r.debrisTracks;
  for (const [bullet, track] of tracks) {
    track.active = false;
    if (track.lastSeen < cutoff) tracks.delete(bullet);
  }
  for (const b of game.fbullets) {
    if (b.kind !== 'corpse') continue;
    let track = tracks.get(b);
    if (!track) {
      track = { points: [], lastSeen: now, active: true };
      tracks.set(b, track);
    }
    track.active = true;
    track.lastSeen = now;
    const points = track.points;
    const last = points[points.length - 1];
    if (!last || last.x !== b.x || last.y !== b.y) points.push({ x: b.x, y: b.y, t: now });
    else last.t = now;
    while (points.length > CONFIG.corpseTrailPoints || (points.length > 1 && points[0].t < cutoff)) points.shift();
  }

  const { ctx } = r;
  ctx.save();
  ctx.lineCap = 'butt';
  ctx.globalCompositeOperation = 'lighter';
  const halfW = (r.W / 2 + 40) / r.cam.zoom, halfH = (r.H / 2 + 40) / r.cam.zoom;
  for (const [b, track] of tracks) {
    const points = track.points;
    const width = Math.max(1.5 / r.cam.zoom, b.r * 0.3);
    for (let i = 1; i < points.length; i++) {
      const from = points[i - 1], to = points[i];
      // Keep offscreen history for camera movement, but skip invisible canvas strokes.
      if (Math.max(from.x, to.x) + width < r.cam.x - halfW ||
          Math.min(from.x, to.x) - width > r.cam.x + halfW ||
          Math.max(from.y, to.y) + width < r.cam.y - halfH ||
          Math.min(from.y, to.y) - width > r.cam.y + halfH) continue;
      const fade = Math.max(0, 1 - (now - from.t) / CONFIG.corpseTrailLife);
      if (!fade) continue;
      ctx.globalAlpha = fade * fade * 0.55;
      ctx.strokeStyle = '#ffad56';
      ctx.lineWidth = width;
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
      ctx.globalAlpha *= 0.65;
      ctx.strokeStyle = '#ffe2b0';
      ctx.lineWidth = width * 0.3;
      ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  for (const [b, track] of tracks) {
    if (!track.active) continue;
    const sx = (b.x - r.cam.x) * r.cam.zoom + r.W / 2;
    const sy = (b.y - r.cam.y) * r.cam.zoom + r.H / 2;
    const pad = b.r * r.cam.zoom;
    if (sx < -pad || sx > r.W + pad || sy < -pad || sy > r.H + pad) continue;
    if (b.hull) {
      ctx.globalAlpha = 1; drawTowHull(ctx, b.hull, b.x, b.y, Math.atan2(b.vy, b.vx), r.cam.zoom, b.r);
      continue;
    }
    const size = b.r * 0.65;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(Math.atan2(b.vy, b.vx) + now * CONFIG.corpseSpinRate);
    ctx.globalAlpha = 0.95;
    ctx.fillStyle = '#727b87';
    ctx.strokeStyle = '#ffad56';
    ctx.lineWidth = Math.max(1 / r.cam.zoom, size * 0.16);
    ctx.beginPath();
    ctx.moveTo(size, -size * 0.25);
    ctx.lineTo(-size * 0.15, -size * 0.7);
    ctx.lineTo(-size * 0.85, size * 0.35);
    ctx.lineTo(size * 0.25, size * 0.6);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ffe2b0';
    ctx.beginPath(); ctx.moveTo(-size * 0.15, -size * 0.7); ctx.lineTo(size, -size * 0.25); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

// ---- render.js ----















const STAR_TILE = 1600;
const MONO = 'ui-monospace, Menlo, monospace';

function createRenderer(canvas) {
  const ctx = canvas.getContext('2d');
  const rng = makeRng(7);
  const layers = [0.06, 0.16, 0.35].map((p, i) => ({
    p,
    stars: Array.from({ length: 110 - i * 25 }, () => ({ x: rng() * STAR_TILE, y: rng() * STAR_TILE, s: 0.6 + rng() * (0.6 + i * 0.6), a: 0.25 + rng() * 0.6 })),
  }));
  return { canvas, ctx, layers, cam: { x: 0, y: 0, zoom: 1, ready: false }, W: 0, H: 0, dpr: 1, shake: 0, flash: 0, vapor: 0, stageFlash: null, hurt: 0, shipHurt: 0 };
}

function resizeRenderer(r) {
  r.dpr = Math.min(window.devicePixelRatio || 1, 2);
  // size from the canvas as laid out, so drawing and pointer coordinates always share one space
  // (window.innerHeight and 100vh disagree on mobile browsers with a collapsing toolbar)
  const b = r.canvas.getBoundingClientRect();
  r.W = b.width || window.innerWidth;
  r.H = b.height || window.innerHeight;
  r.canvas.width = Math.floor(r.W * r.dpr);
  r.canvas.height = Math.floor(r.H * r.dpr);
}

function worldToScreen(r, x, y) {
  return { x: (x - r.cam.x) * r.cam.zoom + r.W / 2, y: (y - r.cam.y) * r.cam.zoom + r.H / 2 };
}

function screenToWorld(r, x, y) {
  return { x: (x - r.W / 2) / r.cam.zoom + r.cam.x, y: (y - r.H / 2) / r.cam.zoom + r.cam.y };
}

// Zoom is tied to the ship's max speed so the view only widens as the build gets faster,
// instead of pumping in and out with every dash.
function targetZoom(game, W, H) {
  const f = Math.pow(CONFIG.zoomRefSpeed / Math.max(CONFIG.zoomRefSpeed, game.stats.maxSpeed), CONFIG.zoomExp);
  return (Math.min(W, H) / CONFIG.baseView) * clamp(f, CONFIG.zoomMin, 1);
}

function updateCamera(r, game, dt) {
  const sh = game.ship;
  if (game.death) return; // preserve the camera at the fatal hit through the result
  const finishTarget = finishCameraTarget(game, r.W, r.H, targetZoom(game, r.W, r.H));
  if (finishTarget) {
    const k = 1 - Math.exp(-10 * dt);
    r.cam.x += (finishTarget.x - r.cam.x) * k;
    r.cam.y += (finishTarget.y - r.cam.y) * k;
    r.cam.zoom += (finishTarget.zoom - r.cam.zoom) * k;
    return;
  }
  if (game.draw && r.cam.ready) {
    // hold the view still while a path is drawn and traced, so it is followed exactly where it was drawn
    game.viewRadius = Math.hypot(r.W, r.H) / 2 / r.cam.zoom;
    return;
  }
  const zoomT = targetZoom(game, r.W, r.H);
  // look ahead along the velocity, but keep the ship well inside the screen at any speed
  let ox = sh.vx * CONFIG.lookAhead, oy = sh.vy * CONFIG.lookAhead;
  const maxOff = (0.3 * Math.min(r.W, r.H)) / 2 / zoomT;
  const off = Math.hypot(ox, oy);
  if (off > maxOff) { ox *= maxOff / off; oy *= maxOff / off; }
  const tx = sh.x + ox;
  const ty = sh.y + oy;
  const cam = r.cam;
  if (!cam.ready) { cam.x = tx; cam.y = ty; cam.zoom = zoomT; cam.ready = true; }
  const kp = 1 - Math.exp(-7 * dt);
  const kz = 1 - Math.exp(-2.2 * dt);
  cam.x += (tx - cam.x) * kp;
  cam.y += (ty - cam.y) * kp;
  cam.zoom += (zoomT - cam.zoom) * kz;
  game.viewRadius = Math.hypot(r.W, r.H) / 2 / cam.zoom;
}

function handleEvents(r, game) {
  for (const ev of game.events) {
    if (ev.type === 'hurt') { r.hurt = 0.35; r.shipHurt = CONFIG.shipHurtTime; }
    else if (ev.type === 'kill' && ev.r > 25) r.shake = Math.max(r.shake, 8);
    else if (ev.type === 'kill' && ev.cause === 'ram') r.shake = Math.max(r.shake, 5);
    else if (ev.type === 'bounce') r.shake = Math.max(r.shake, 10);
    else if (ev.type === 'crash') r.shake = Math.max(r.shake, 16);
    else if (ev.type === 'stage') { r.stageFlash = { text: ev.name, kms: (ev.speed * CONFIG.speedToKms).toFixed(1), life: 1.4, max: 1.4 }; r.flash = Math.max(r.flash, 0.18); }
    else if (ev.type === 'sonic') { r.flash = 0.25; r.shake = Math.max(r.shake, 10); }
    else if (ev.type === 'shipDeath') { r.shake = r.flash = r.hurt = r.shipHurt = 0; r.stageFlash = null; }
    else if (ev.type === 'barrier') r.vapor = 0.6;
    else if (ev.type === 'bossSpawn') { r.bossWarning = 3; r.shake = Math.max(r.shake, 8); }
    else if (ev.type === 'bossFinish') { r.shake = 0; r.stageFlash = null; r.flash = 0; }
    else if (ev.type === 'bossExplosion') { r.flash = 1; r.shake = 30; }
    else if (ev.type === 'end' && ev.state === 'won') r.flash = 1;
  }
}

function render(r, game, dt, pointer) {
  const { ctx } = r;
  // keep the backing store matched to the laid-out canvas (mobile toolbars and rotation can
  // change it without a resize event; a mismatch stretches the picture)
  if (r.canvas.clientWidth && (Math.abs(r.canvas.clientWidth - r.W) > 0.5 || Math.abs(r.canvas.clientHeight - r.H) > 0.5)) resizeRenderer(r);
  if (game.state === 'dying' && game.death.phase === 'freeze') dt = 0;
  handleEvents(r, game);
  if (game.death) r.shake = r.flash = 0;
  r.shipHurt = Math.max(0, r.shipHurt - dt);
  updateCamera(r, game, dt);
  game.spawnView = { x: r.cam.x, y: r.cam.y, halfW: r.W / 2 / r.cam.zoom, halfH: r.H / 2 / r.cam.zoom };
  ctx.setTransform(r.dpr, 0, 0, r.dpr, 0, 0);
  drawBackground(r, game);

  ctx.save();
  let sx = 0, sy = 0;
  if (game.draw && game.draw.phase === 'draw') r.shake = 0; // no jitter while placing a path
  if (r.shake > 0) {
    sx = (Math.random() - 0.5) * r.shake;
    sy = (Math.random() - 0.5) * r.shake;
    r.shake = Math.max(0, r.shake - dt * 60);
  }
  ctx.translate(r.W / 2 + sx, r.H / 2 + sy);
  ctx.scale(r.cam.zoom, r.cam.zoom);
  ctx.translate(-r.cam.x, -r.cam.y);
  drawZones(r);
  drawDust(r, game);
  drawSpecks(r);
  drawBodies(r, game);
  drawGems(r, game);
  drawCoins(r, game);
  drawCapsules(r, game);
  drawMines(r, game);
  drawEnemies(r, game);
  drawEnemyBullets(r, game);
  drawCapsules(r, game, true); // repair kits and collectors remain visible above the crowd
  drawPortals(r, game);
  drawPathUi(r, game);
  drawFriendly(r, game, dt);
  drawRunWeapons(r, game);
  drawPrediction(r, game);
  drawTrail(r, game);
  drawVapor(r, game, dt);
  if (!game.death) drawShip(r, game);
  if (!game.death || game.death.phase === 'freeze') {
    drawFx(r, game);
    drawCombatImpacts(r, game);
  }
  // Keep the world subdued throughout death; the ship and its breakup stay bright.
  if (game.death) {
    ctx.save();
    ctx.setTransform(r.dpr, 0, 0, r.dpr, 0, 0);
    ctx.fillStyle = `rgba(0,0,0,${CONFIG.deathWorldDim})`;
    ctx.fillRect(0, 0, r.W, r.H);
    ctx.restore();
    if (game.death.phase === 'freeze') drawShip(r, game);
    else drawFx(r, game); // advanceShipDeath clears the old FX before creating ship debris
  }
  ctx.restore();
  if (!game.death) drawSpeedLines(r, game);

  if (game.state !== 'finishing' && !game.death) {
    drawChargeUi(r, game, pointer);
    drawCapsuleArrows(r, game);
    drawDrawingHud(r, game, pointer);
    drawPortalHud(r, game);
    drawOverlays(r, game, dt);
    drawHud(r, game);
    drawBossHud(r, game, dt);
    drawMinimap(r, game);
    drawBanner(r, dt);
    drawStageFlash(r, dt);
  }
  if (r.flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${Math.min(0.85, r.flash)})`;
    ctx.fillRect(0, 0, r.W, r.H);
    r.flash = Math.max(0, r.flash - dt * 2.2);
  }
  drawBossFinish(r, game);
  drawShipDeath(r, game);
}

// Conical shock layers wrapped around the ship near max speed.
function drawVapor(r, game, dt) {
  const sh = game.ship;
  const sp = Math.hypot(sh.vx, sh.vy);
  const ratio = sp / game.stats.maxSpeed;
  if (r.vapor > 0) r.vapor -= dt;
  const k = Math.max(r.vapor > 0 ? 1 : 0, (ratio - 0.88) / 0.12);
  if (k <= 0 || sp < 1) return;
  const { ctx } = r;
  const z = r.cam.zoom;
  const ux = sh.vx / sp, uy = sh.vy / sp;
  const back = Math.atan2(-uy, -ux);
  ctx.save();
  ctx.translate(sh.x, sh.y);
  ctx.lineCap = 'round';
  const unit = Math.max(1, 0.6 / z);
  for (let i = 0; i < 4; i++) {
    const rad = (26 + i * 16) * unit;
    const spread = 1.25 - i * 0.18;
    ctx.globalAlpha = Math.min(1, k) * (0.5 - i * 0.1) * (0.75 + 0.25 * Math.random());
    ctx.strokeStyle = '#eaf6ff';
    ctx.lineWidth = (3 - i * 0.5) * unit;
    ctx.beginPath();
    ctx.arc(-ux * (i * 10 - 14) * unit, -uy * (i * 10 - 14) * unit, rad, back - spread, back + spread);
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawSpeedLines(r, game) {
  const sh = game.ship;
  const sp = Math.hypot(sh.vx, sh.vy);
  const k = (sp / CONFIG.escapeSpeed - 0.42) / 0.5;
  if (k <= 0) return;
  const { ctx, W, H } = r;
  const cx = W / 2, cy = H / 2;
  const R0 = Math.hypot(W, H) / 2;
  ctx.strokeStyle = '#dff3ff';
  ctx.lineWidth = 1.5;
  const n = Math.round(18 + 40 * Math.min(1, k));
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU;
    const r1 = R0 * (0.62 + Math.random() * 0.2 * (1 - Math.min(1, k)));
    ctx.globalAlpha = Math.min(0.5, 0.15 + 0.35 * k) * Math.random();
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    ctx.lineTo(cx + Math.cos(a) * R0, cy + Math.sin(a) * R0);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawStageFlash(r, dt) {
  const f = r.stageFlash;
  if (!f) return;
  f.life -= dt;
  if (f.life <= 0) { r.stageFlash = null; return; }
  const { ctx, W, H } = r;
  const t = 1 - f.life / f.max;
  ctx.globalAlpha = Math.min(1, f.life / 0.4);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#bff3ff';
  ctx.font = `italic 800 ${Math.round(30 + 10 * (1 - t))}px ${MONO}`;
  ctx.fillText(f.text, W / 2, H * 0.68);
  ctx.font = `13px ${MONO}`;
  ctx.fillStyle = '#8fd8ff';
  ctx.fillText(`${f.kms} km/s`, W / 2, H * 0.68 + 20);
  const sweep = W * (t * 1.4 - 0.2);
  const g = ctx.createLinearGradient(sweep - 160, 0, sweep + 160, 0);
  g.addColorStop(0, 'rgba(191,243,255,0)');
  g.addColorStop(0.5, 'rgba(191,243,255,0.5)');
  g.addColorStop(1, 'rgba(191,243,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, H * 0.68 - 36, W, 2);
  ctx.globalAlpha = 1;
}

function drawGems(r, game) {
  const { ctx } = r;
  const s = Math.max(5, 4 / r.cam.zoom);
  ctx.fillStyle = CONFIG.xpColor;
  ctx.strokeStyle = CONFIG.xpOutline; ctx.lineWidth = 1.2 / r.cam.zoom;
  for (const g of game.gems) {
    if (!onScreen(r, g.x, g.y, 20)) continue;
    const k = g.v > 8 ? 1.6 : g.v > 3 ? 1.25 : 1;
    ctx.beginPath();
    ctx.moveTo(g.x, g.y - s * k); ctx.lineTo(g.x + s * 0.7 * k, g.y); ctx.lineTo(g.x, g.y + s * k); ctx.lineTo(g.x - s * 0.7 * k, g.y);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e5d9ff';
    ctx.beginPath(); ctx.moveTo(g.x, g.y - s * k * 0.65); ctx.lineTo(g.x + s * k * 0.27, g.y);
    ctx.lineTo(g.x, g.y + s * k * 0.35); ctx.closePath(); ctx.fill();
    ctx.fillStyle = CONFIG.xpColor;
  }
}

function capsuleColor(c) {
  if (c.kind === 'rareWeapon') return '#efcb70';
  if (c.kind === 'heal') return '#67e8b1';
  return c.kind === 'core' ? '#ffd24a' : ['cache', 'magnet'].includes(c.kind) ? CONFIG.xpColor : RARITIES[c.mod.r].color;
}

function drawCoins(r, game) {
  const { ctx } = r;
  const s = Math.max(6, 3.5 / r.cam.zoom);
  for (const c of game.coinDrops) {
    if (!onScreen(r, c.x, c.y, 20)) continue;
    ctx.fillStyle = '#ffd24a';
    ctx.beginPath(); ctx.arc(c.x, c.y, s, 0, TAU); ctx.fill();
    ctx.fillStyle = '#a07a10';
    ctx.fillRect(c.x - s * 0.15, c.y - s * 0.55, s * 0.3, s * 1.1);
  }
}

function drawCapsules(r, game, healingOnly = false) {
  const { ctx } = r;
  const z = r.cam.zoom;
  for (const c of game.capsules) {
    if ((['heal', 'magnet', 'rareWeapon'].includes(c.kind)) !== healingOnly) continue;
    if (!onScreen(r, c.x, c.y, 200)) continue;
    const col = capsuleColor(c);
    const S = (c.kind === 'core' ? 30 : 20) * Math.max(1, 0.7 / z);
    const pulse = (((game.t * 1.5 + c.x * 0.001) % 1) + 1) % 1; // x can be negative
    ctx.globalAlpha = 1 - pulse;
    ctx.strokeStyle = col;
    ctx.lineWidth = 2 / z;
    ctx.beginPath(); ctx.arc(c.x, c.y, S * (1.2 + pulse * 2.5), 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.translate(c.x, c.y + Math.sin(game.t * 2 + c.x) * S * 0.12);
    if (c.kind === 'core') {
      ctx.rotate(game.t * 1.2);
      ctx.shadowColor = col; ctx.shadowBlur = 20;
      ctx.fillStyle = col;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) { const a = i * TAU / 10, k = i % 2 ? 0.45 : 1; ctx.lineTo(Math.cos(a) * S * k, Math.sin(a) * S * k); }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, 0, S * 0.22, 0, TAU); ctx.fill();
    } else if (c.kind === 'rareWeapon') {
      ctx.fillStyle = '#292335'; ctx.strokeStyle = col; ctx.lineWidth = 3 / z;
      ctx.beginPath(); for (let i = 0; i < 6; i++) ctx.lineTo(Math.cos(i * TAU / 6) * S, Math.sin(i * TAU / 6) * S);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff1bf'; ctx.font = `bold ${S * 0.8}px ${MONO}`; ctx.textAlign = 'center'; ctx.fillText(c.id === 'bipolar' ? 'Ⅱ' : '⚓', 0, S * 0.3);
    } else if (c.kind === 'heal') {
      ctx.fillStyle = '#e1f4ec'; ctx.strokeStyle = '#365c50'; ctx.lineWidth = 2 / z;
      ctx.fillRect(-S * 0.65, -S * 0.5, S * 1.3, S); ctx.strokeRect(-S * 0.65, -S * 0.5, S * 1.3, S);
      ctx.strokeRect(-S * 0.22, -S * 0.75, S * 0.44, S * 0.25);
      ctx.fillStyle = '#148563';
      ctx.fillRect(-S * 0.12, -S * 0.33, S * 0.24, S * 0.66);
      ctx.fillRect(-S * 0.33, -S * 0.12, S * 0.66, S * 0.24);
    } else if (c.kind === 'magnet') {
      ctx.strokeStyle = '#39265e'; ctx.lineWidth = S * 0.55; ctx.lineCap = 'butt';
      ctx.beginPath(); ctx.moveTo(-S * 0.43, -S * 0.5); ctx.lineTo(-S * 0.43, S * 0.05);
      ctx.arc(0, S * 0.05, S * 0.43, Math.PI, 0, true); ctx.lineTo(S * 0.43, -S * 0.5); ctx.stroke();
      ctx.strokeStyle = col; ctx.lineWidth = S * 0.36; ctx.stroke();
      ctx.fillStyle = '#eee4ff';
      ctx.fillRect(-S * 0.61, -S * 0.65, S * 0.36, S * 0.27);
      ctx.fillRect(S * 0.25, -S * 0.65, S * 0.36, S * 0.27);
    } else if (c.kind === 'cache') {
      ctx.fillStyle = col; ctx.strokeStyle = CONFIG.xpOutline; ctx.lineWidth = 2 / z;
      ctx.fillRect(-S * 0.55, -S * 0.55, S * 1.1, S * 1.1); ctx.strokeRect(-S * 0.55, -S * 0.55, S * 1.1, S * 1.1);
      ctx.fillStyle = '#1d293a'; ctx.font = `bold ${S * 0.65}px ${MONO}`; ctx.textAlign = 'center'; ctx.fillText('XP', 0, S * 0.22);
    } else {
      // the module shows up as the ship part it is (nose, engine, gun, radar, wings, reactor)
      drawPart(ctx, c.mod.slot, S * 0.95, col, { glow: 22 });
    }
    ctx.restore();
  }
}

// Edge-of-screen pointers to capsules that are off screen.
function drawCapsuleArrows(r, game) {
  const { ctx, W, H } = r;
  const sh = game.ship;
  const m = 34;
  for (const c of game.capsules) {
    const d = Math.hypot(c.x - sh.x, c.y - sh.y);
    if (d > 5000 || onScreen(r, c.x, c.y, 0)) continue;
    const p = worldToScreen(r, c.x, c.y);
    const ang = Math.atan2(p.y - H / 2, p.x - W / 2);
    const k = Math.min((W / 2 - m) / Math.abs(Math.cos(ang) || 1e-6), (H / 2 - m) / Math.abs(Math.sin(ang) || 1e-6));
    const x = W / 2 + Math.cos(ang) * k, y = H / 2 + Math.sin(ang) * k;
    ctx.save();
    ctx.translate(x, y); ctx.rotate(ang);
    ctx.globalAlpha = 0.55 + 0.45 * (1 - d / 5000);
    ctx.fillStyle = capsuleColor(c);
    const s = c.kind === 'core' ? 13 : 9;
    ctx.beginPath(); ctx.moveTo(s, 0); ctx.lineTo(-s * 0.7, s * 0.7); ctx.lineTo(-s * 0.7, -s * 0.7); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawMines(r, game) {
  const { ctx } = r;
  const z = r.cam.zoom;
  for (const m of game.mines) {
    if (!onScreen(r, m.x, m.y, 30)) continue;
    ctx.fillStyle = m.armed > 0 ? '#7a5040' : (Math.floor(game.t * 6) % 2 ? '#ff7b54' : '#ffb08a');
    ctx.beginPath(); ctx.arc(m.x, m.y, 7 / Math.sqrt(z), 0, TAU); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,207,107,0.5)';
  for (const m of game.marks) {
    if (!onScreen(r, m.x, m.y, 30)) continue;
    ctx.beginPath(); ctx.arc(m.x, m.y, (4 + 6 * (1 - m.t / 0.55)) / Math.sqrt(z), 0, TAU); ctx.fill();
  }
}

function drawFriendly(r, game, dt) {
  drawCorpseDebris(r, game, dt);
  const { ctx } = r;
  const z = r.cam.zoom;
  for (const b of game.fbullets) {
    if (b.kind === 'corpse') continue;
    if (!onScreen(r, b.x, b.y, 40)) continue;
    const s = b.r / Math.sqrt(z);
    const speed = Math.hypot(b.vx, b.vy) || 1, ux = b.vx / speed, uy = b.vy / speed;
    ctx.strokeStyle = '#53dfff'; ctx.lineWidth = Math.max(2 / z, s);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(b.x - ux * s * 2, b.y - uy * s * 2); ctx.lineTo(b.x + ux * s, b.y + uy * s); ctx.stroke();
    ctx.lineCap = 'butt';
  }
  ctx.globalAlpha = 1;
}

function drawRunWeapons(r, game) {
  if (!game.newBuild) return;
  if (game.finale && game.finale.phase !== 'slow') return;
  const { ctx } = r, z = r.cam.zoom, sh = game.ship;
  const origin = game.weaponState.bipolar?.origin;
  if (origin && onScreen(r, origin.x, origin.y, 55)) {
    ctx.save(); ctx.translate(origin.x, origin.y); ctx.rotate(game.buildClock * 2);
    ctx.strokeStyle = '#69fff0'; ctx.lineWidth = 3 / z;
    ctx.strokeRect(-22, -22, 44, 44); ctx.fillStyle = '#e1fff6'; ctx.fillRect(-5, -5, 10, 10); ctx.restore();
  }
  const tow = game.weaponState.massTow;
  if (tow && game.weapons.massTow) {
    for (let j = 0; j < Math.min(CONFIG.massTowVisible, tow.cargo.length - tow.head); j++) {
      const h = tow.cargo[tow.head + j];
      if (!onScreen(r, h.x, h.y, h.r)) continue;
      ctx.strokeStyle = 'rgba(255,190,101,0.55)'; ctx.lineWidth = 2 / z;
      ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(h.x, h.y); ctx.stroke();
      drawTowHull(ctx, h, h.x, h.y, h.angle, z);
    }
  }
  // The old lines persist as world effects only when a route-crossing trait uses them.
  if (game.traits.crossBlast) {
    ctx.strokeStyle = 'rgba(220,100,220,0.32)'; ctx.lineWidth = 2 / z;
    for (const p of game.runPaths) {
      if (p.until <= game.buildClock) continue;
      ctx.beginPath(); ctx.moveTo(p.a.x, p.a.y); ctx.lineTo(p.b.x, p.b.y); ctx.stroke();
    }
  }
  for (const v of game.vortexes) {
    if (!onScreen(r, v.x, v.y, v.radius)) continue;
    ctx.save(); ctx.translate(v.x, v.y); ctx.rotate(game.t * 3);
    ctx.strokeStyle = '#b79aff'; ctx.lineWidth = 3 / z; ctx.globalAlpha = Math.min(0.6, v.life / v.max);
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(0, 0, v.radius * (0.35 + i * 0.25), i * 2, i * 2 + 2.7); ctx.stroke(); }
    ctx.restore();
  }
  if (game.weapons.barrier) {
    const L = runWeaponStats('barrier', game.weapons.barrier), st = game.weaponState.barrier;
    ctx.strokeStyle = st?.blockT > 0 ? 'rgba(118,170,255,0.2)' : 'rgba(118,170,255,0.65)'; ctx.lineWidth = 3 / z;
    ctx.beginPath(); ctx.arc(sh.x, sh.y, 70 * L.radius, 0, TAU); ctx.stroke();
  }
  for (const d of game.drones) {
    ctx.strokeStyle = 'rgba(168,255,219,0.55)'; ctx.lineWidth = 3 / z;
    if (d.trail.length) { ctx.beginPath(); ctx.moveTo(d.trail[0].x, d.trail[0].y); for (const p of d.trail) ctx.lineTo(p.x, p.y); ctx.stroke(); }
    ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(game.buildClock * 2);
    ctx.fillStyle = '#a8ffdb'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1 / z;
    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(0, 9); ctx.lineTo(-12, 0); ctx.lineTo(0, -9); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  for (const p of game.wproj) {
    if (!onScreen(r, p.x, p.y, 40)) continue;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.kind === 'disc' ? p.spin : Math.atan2(p.vy, p.vx));
    ctx.fillStyle = p.kind === 'disc' ? '#6dffb0' : '#ff9f40';
    if (p.kind === 'disc') { ctx.beginPath(); ctx.arc(0, 0, p.r, 0, TAU); ctx.strokeStyle = '#6dffb0'; ctx.lineWidth = 3 / z; ctx.stroke(); ctx.fillRect(-p.r, -2 / z, p.r * 2, 4 / z); }
    else { ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-8, 6); ctx.lineTo(-8, -6); ctx.closePath(); ctx.fill(); }
    ctx.restore();
  }
  for (const b of game.wstate.orbit?.blades || []) {
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a); ctx.fillStyle = '#9fe8ff'; ctx.fillRect(-18, -4, 36, 8); ctx.restore();
  }
  for (const wave of game.sonicWaves) {
    const sh = game.ship, angle = Math.atan2(sh.vy, sh.vx), alpha = Math.min(1, wave.life / wave.max * 2);
    ctx.save(); ctx.translate(wave.x, wave.y); ctx.rotate(angle);
    ctx.globalAlpha = alpha * 0.8; ctx.strokeStyle = '#c8f7ff'; ctx.shadowColor = '#68dbff'; ctx.shadowBlur = 12;
    for (const fraction of [0.5, 0.75, 1]) {
      ctx.lineWidth = (fraction === 1 ? 4 : 2) / z;
      ctx.beginPath(); ctx.arc(0, 0, wave.radius * fraction, -Math.PI * 0.42, Math.PI * 0.42); ctx.stroke();
    }
    ctx.restore();
  }
  for (const f of game.wfx) {
    ctx.globalAlpha = Math.max(0, f.life / f.max); ctx.strokeStyle = f.color || '#ff9ce5';
    if (f.kind === 'beam') {
      ctx.lineWidth = f.width; ctx.beginPath(); ctx.moveTo(f.x0, f.y0); ctx.lineTo(f.x1, f.y1); ctx.stroke();
      ctx.lineWidth = Math.max(2 / z, f.width * 0.2); ctx.strokeStyle = '#ffffff'; ctx.stroke();
    } else if (f.pts) {
      ctx.strokeStyle = '#a8f0ff'; ctx.lineWidth = 3 / z; ctx.beginPath(); ctx.moveTo(f.pts[0].x, f.pts[0].y); for (const p of f.pts) ctx.lineTo(p.x, p.y); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  for (const e of game.enemies) {
    if (e.dead || !(e.shove?.time > 0 || e.knockT > 0)) continue;
    ctx.strokeStyle = 'rgba(255,152,107,0.8)'; ctx.lineWidth = 3 / z;
    const sp = Math.hypot(e.vx, e.vy) || 1;
    ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x - e.vx / sp * Math.min(130, sp * 0.12), e.y - e.vy / sp * Math.min(130, sp * 0.12)); ctx.stroke();
  }
}

function drawRunLoadout(r, game) {
  if (r.mobile) {
    const { ctx, W, H } = r;
    const width = Math.min(240, W - 144);
    ctx.fillStyle = 'rgba(4,8,20,.65)'; ctx.fillRect(4, H - 54, width, 50);
    ctx.textAlign = 'left'; ctx.font = '10px sans-serif'; ctx.fillStyle = '#b9c8e6';
    ctx.fillText(`武器 ${Object.keys(game.weapons).length}/${CONFIG.weaponSlots}　特性 ${Object.keys(game.traits).length}/${CONFIG.traitSlots}`, 10, H - 40);
    const equipped = RUN_WEAPONS.filter(d => game.weapons[d.id]);
    equipped.forEach((d, i) => { ctx.fillStyle = runRankColor(game.weapons[d.id]); ctx.fillText(`${d.name.slice(0, 4)} ${game.weapons[d.id]}`, 10 + (i % 2) * width / 2, H - 25 + Math.floor(i / 2) * 14, width / 2 - 8); });
    return;
  }
  const { ctx, H, W } = r, width = Math.min(270, W * 0.42), x = 12, y = H - 130;
  ctx.fillStyle = 'rgba(4,8,20,0.78)'; ctx.fillRect(x - 4, y - 12, width, 136);
  ctx.textAlign = 'left'; ctx.font = '11px "Hiragino Sans", sans-serif';
  ctx.fillStyle = '#a8c4ff'; ctx.fillText(`■ 武器 ${Object.keys(game.weapons).length}/${CONFIG.weaponSlots}`, x, y);
  let row = 0;
  for (const d of RUN_WEAPONS.filter(d => game.weapons[d.id])) {
    const col = row % 2, line = Math.floor(row / 2); ctx.fillStyle = runRankColor(game.weapons[d.id]);
    ctx.fillText(`${d.name.slice(0, W < 600 ? 4 : 7)} Lv${game.weapons[d.id]}`, x + col * width / 2, y + 16 + line * 15); row++;
  }
  const ty = y + 20 + Math.max(2, Math.ceil(row / 2)) * 15;
  ctx.fillStyle = '#cfb1f7'; ctx.fillText(`● 特性 ${Object.keys(game.traits).length}/${CONFIG.traitSlots}`, x, ty);
  row = 0;
  for (const d of RUN_TRAITS.filter(d => game.traits[d.id])) {
    ctx.fillStyle = runRankColor(game.traits[d.id]); ctx.fillText(`${d.name.slice(0, W < 600 ? 4 : 7)} ×${game.traits[d.id]}`, x + (row % 2) * width / 2, ty + 16 + Math.floor(row / 2) * 15); row++;
  }
}

function drawOverlays(r, game, dt) {
  const { ctx, W, H } = r;
  if (r.hurt > 0) {
    r.hurt -= dt;
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
    g.addColorStop(0, 'rgba(255,40,40,0)');
    g.addColorStop(1, `rgba(255,40,40,${0.5 * r.hurt / 0.35})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  const lowHp = game.ship.hp / game.stats.maxHp;
  if (lowHp < 0.3 && game.state === 'play') {
    const a = (0.3 - lowHp) * (0.6 + 0.4 * Math.sin(game.t * 8));
    ctx.strokeStyle = `rgba(255,50,50,${a})`;
    ctx.lineWidth = 16;
    ctx.strokeRect(0, 0, W, H);
  }
}

function drawBanner(r, dt) {
  const b = r.banner;
  if (!b) return;
  b.life -= dt;
  if (b.life <= 0) { r.banner = null; return; }
  const { ctx, W, H } = r;
  const t = b.max - b.life;
