<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SPEED — 重力圏脱出</title>
<style>
  html, body { margin: 0; height: 100%; background: #04050b; overflow: hidden; color: #e6ecff;
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; user-select: none; }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  .screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(3,5,14,0.72); backdrop-filter: blur(3px); pointer-events: auto; }
  .panel { background: linear-gradient(180deg, #121a33, #0b1022); border: 1px solid #2a3a6a; border-radius: 14px;
    box-sizing: border-box; padding: 24px 28px; min-width: min(320px, calc(100vw - 24px)); max-width: min(760px, calc(100vw - 24px)); max-height: calc(100dvh - 24px);
    overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
  .panel h1 { margin: 0 0 4px; font-size: 30px; letter-spacing: 0.04em; }
  .panel h2 { margin: 18px 0 8px; font-size: 15px; color: #8fa3c8; font-weight: 600; }
  .sub { color: #8fa3c8; font-size: 13px; margin-bottom: 14px; }
  .stats { display: grid; grid-template-columns: auto auto; gap: 6px 18px; font-family: ui-monospace, Menlo, monospace; font-size: 14px; }
  .stats div:nth-child(odd) { color: #8fa3c8; }
  .btns { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  button { font: inherit; font-size: 15px; padding: 10px 18px; border-radius: 9px; border: 1px solid #3b5bb5;
    background: #1d2c5c; color: #e6ecff; cursor: pointer; }
  button:hover { background: #2a3f80; }
  button.primary { background: #2f6bff; border-color: #5d8bff; font-weight: 700; }
  button.primary:hover { background: #4a7dff; }
  button:disabled { opacity: 0.4; cursor: default; }
  .win { color: #ffd24a; } .lose { color: #ff6b5a; }
  .cards { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; }
  .card { border: 1px solid #2a3a6a; border-radius: 10px; padding: 12px 14px; background: rgba(255,255,255,0.03); min-height: 110px; }
  .card canvas.part { float: right; margin: -4px -4px 4px 8px; }
  .offerhead { display: flex; gap: 16px; align-items: center; margin-bottom: 8px; }
  .offerhead canvas.assembly { flex: none; background: radial-gradient(circle, rgba(40,60,120,0.35), rgba(0,0,0,0) 70%); border-radius: 50%; }
  .card .tag { font-size: 11px; color: #8fa3c8; margin-bottom: 6px; }
  .card .name { font-size: 18px; font-weight: 700; }
  .card .rar { font-size: 12px; margin: 2px 0 8px; font-weight: 700; }
  .card .desc { font-size: 13px; color: #cdd6f0; line-height: 1.5; }
  .card.empty { display: flex; align-items: center; justify-content: center; color: #5b6b94; }
  .card.new { border-width: 2px; box-shadow: 0 0 24px rgba(120,160,255,0.15); }
  .level-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .level-card { text-align: left; white-space: normal; min-height: 210px; cursor: pointer; }
  .level-card .name { margin-bottom: 12px; }
  .build-summary { margin-top: 18px; font-size: 12px; line-height: 1.8; color: #b8c6ea; }
  @media (max-width: 600px) { .level-cards { grid-template-columns: 1fr; gap: 8px; } .level-card { min-height: 0; padding: 12px; } }
  .arrowcol { display: flex; align-items: center; color: #8fa3c8; font-size: 22px; }
  .loadout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 16px; font-size: 12px; }
  .loadout div { border: 1px solid #1f2b52; border-radius: 6px; padding: 5px 8px; color: #8fa3c8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .loadout div.hl { border-color: #5d8bff; color: #e6ecff; }
  .src { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #1d2c5c; color: #b8c6ea; margin-bottom: 8px; }
  @media (max-width: 420px) { .panel { padding: 18px 16px; } .panel h1 { font-size: 24px; } }
  @media (max-width: 560px) { .cards { grid-template-columns: 1fr; } .arrowcol { justify-content: center; transform: rotate(90deg); } .loadout { grid-template-columns: repeat(2, 1fr); } }
  .ups { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .up { border: 1px solid #2a3a6a; border-radius: 10px; padding: 10px 12px; background: rgba(255,255,255,0.03); }
  .up .n { font-weight: 700; } .up .d { font-size: 12px; color: #b8c6ea; margin: 2px 0 6px; }
  .pips { letter-spacing: 3px; color: #5d8bff; font-size: 12px; margin-bottom: 8px; }
  .up button { width: 100%; padding: 7px 10px; font-size: 13px; }
  .coins { color: #ffd24a; font-weight: 700; font-family: ui-monospace, Menlo, monospace; }
  .how { font-size: 13px; color: #cdd6f0; line-height: 1.7; margin: 0; padding-left: 18px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  #debug { position: fixed; top: 0; right: 0; width: min(360px, 100vw); max-height: 100vh; overflow: auto; display: none;
    background: rgba(8,12,28,0.94); border-left: 1px solid #2a3a6a; padding: 12px 14px; font-size: 12px; z-index: 10; }
  #debug.open { display: block; }
  #debug .dh { display: flex; justify-content: space-between; margin-bottom: 6px; }
  #debug .dclose { color: #8fa3c8; }
  #debug .dctl { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: center; margin-bottom: 4px; font-weight: 700; }
  #debug .dctl select { width: 100%; }
  #debug .dhelp { color: #b8c6ea; line-height: 1.5; margin-bottom: 10px; }
  #debug .dinfo { font-family: ui-monospace, Menlo, monospace; color: #9fe8ff; margin-bottom: 8px; line-height: 1.5; }
  #debug .dbtns { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  #debug button, #debug select { font-size: 12px; padding: 5px 8px; border-radius: 6px; background: #1d2c5c; color: #e6ecff; border: 1px solid #3b5bb5; }
  #debug .drow { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 6px; }
  #debug .drow input { grid-column: 1 / 3; width: 100%; }
  #debug .dval { font-family: ui-monospace, Menlo, monospace; color: #ffd24a; }
  #dashBtn { position: fixed; left: 14px; bottom: calc(30px + min(102px, 13.6vh, 17vw));
    padding: 12px 18px; display: none; pointer-events: auto; z-index: 2; border: 1px solid #5fd8ff;
    border-radius: 8px; background: #0d1530; color: #cfe0ff; font-weight: 700; font-size: 13px; }
  #dashBtn.show { display: block; }
  #dashBtn:disabled { opacity: 0.4; }
  kbd { font-family: ui-monospace, Menlo, monospace; font-size: 11px; border: 1px solid #3b4a7a; border-radius: 4px; padding: 1px 5px; color: #b8c6ea; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<button id="dashBtn" type="button">描く</button>
<style>.version-links{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.version-links a{color:#bfeaff;border:1px solid #466183;border-radius:6px;padding:8px 12px;text-decoration:none;font-size:13px}.version-links a:hover{background:#172c43}</style>
<!--BUNDLE-->
</body>
</html>
