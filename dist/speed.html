<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SPEED — 重力圏脱出</title>
<style>
  html, body { margin: 0; height: 100%; background: #04050b; overflow: hidden; color: #e6ecff;
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; user-select: none; }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  .screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(3,5,14,0.72); backdrop-filter: blur(3px); pointer-events: auto; }
  .panel { background: linear-gradient(180deg, #121a33, #0b1022); border: 1px solid #2a3a6a; border-radius: 14px;
    box-sizing: border-box; padding: 24px 28px; min-width: min(320px, calc(100vw - 24px)); max-width: min(760px, calc(100vw - 24px)); max-height: calc(100dvh - 24px);
    overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
  .panel h1 { margin: 0 0 4px; font-size: 30px; letter-spacing: 0.04em; }
  .panel h2 { margin: 18px 0 8px; font-size: 15px; color: #8fa3c8; font-weight: 600; }
  .sub { color: #8fa3c8; font-size: 13px; margin-bottom: 14px; }
  .stats { display: grid; grid-template-columns: auto auto; gap: 6px 18px; font-family: ui-monospace, Menlo, monospace; font-size: 14px; }
  .stats div:nth-child(odd) { color: #8fa3c8; }
  .btns { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  button { font: inherit; font-size: 15px; padding: 10px 18px; border-radius: 9px; border: 1px solid #3b5bb5;
    background: #1d2c5c; color: #e6ecff; cursor: pointer; }
  button:hover { background: #2a3f80; }
  button.primary { background: #2f6bff; border-color: #5d8bff; font-weight: 700; }
  button.primary:hover { background: #4a7dff; }
  button:disabled { opacity: 0.4; cursor: default; }
  .win { color: #ffd24a; } .lose { color: #ff6b5a; }
  .cards { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; }
  .card { border: 1px solid #2a3a6a; border-radius: 10px; padding: 12px 14px; background: rgba(255,255,255,0.03); min-height: 110px; }
  .card canvas.part { float: right; margin: -4px -4px 4px 8px; }
  .offerhead { display: flex; gap: 16px; align-items: center; margin-bottom: 8px; }
  .offerhead canvas.assembly { flex: none; background: radial-gradient(circle, rgba(40,60,120,0.35), rgba(0,0,0,0) 70%); border-radius: 50%; }
  .card .tag { font-size: 11px; color: #8fa3c8; margin-bottom: 6px; }
  .card .name { font-size: 18px; font-weight: 700; }
  .card .rar { font-size: 12px; margin: 2px 0 8px; font-weight: 700; }
  .card .desc { font-size: 13px; color: #cdd6f0; line-height: 1.5; }
  .lvcards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 12px 0; }
  .lvcard { text-align: left; font: inherit; color: inherit; cursor: pointer; position: relative; }
  .lvcard:hover, .lvcard:focus-visible { border-color: #ffe46b; background: rgba(255,228,107,0.07); }
  .lvcard.weapon .tag { color: #ffe46b; }
  .lvcard.perk .tag { color: #9fe8ff; }
  .lvcard kbd { position: absolute; right: 10px; top: 10px; }
  .card.empty { display: flex; align-items: center; justify-content: center; color: #5b6b94; }
  .card.new { border-width: 2px; box-shadow: 0 0 24px rgba(120,160,255,0.15); }
  .arrowcol { display: flex; align-items: center; color: #8fa3c8; font-size: 22px; }
  .loadout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 16px; font-size: 12px; }
  .loadout div { border: 1px solid #1f2b52; border-radius: 6px; padding: 5px 8px; color: #8fa3c8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .loadout div.hl { border-color: #5d8bff; color: #e6ecff; }
  .src { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #1d2c5c; color: #b8c6ea; margin-bottom: 8px; }
  @media (max-width: 420px) { .panel { padding: 18px 16px; } .panel h1 { font-size: 24px; } }
  @media (max-width: 560px) { .lvcards { grid-template-columns: 1fr; } .cards { grid-template-columns: 1fr; } .arrowcol { justify-content: center; transform: rotate(90deg); } .loadout { grid-template-columns: repeat(2, 1fr); } }
  .ups { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .up { border: 1px solid #2a3a6a; border-radius: 10px; padding: 10px 12px; background: rgba(255,255,255,0.03); }
  .up .n { font-weight: 700; } .up .d { font-size: 12px; color: #b8c6ea; margin: 2px 0 6px; }
  .pips { letter-spacing: 3px; color: #5d8bff; font-size: 12px; margin-bottom: 8px; }
  .up button { width: 100%; padding: 7px 10px; font-size: 13px; }
  .coins { color: #ffd24a; font-weight: 700; font-family: ui-monospace, Menlo, monospace; }
  .how { font-size: 13px; color: #cdd6f0; line-height: 1.7; margin: 0; padding-left: 18px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  #debug { position: fixed; top: 0; right: 0; width: min(360px, 100vw); max-height: 100vh; overflow: auto; display: none;
    background: rgba(8,12,28,0.94); border-left: 1px solid #2a3a6a; padding: 12px 14px; font-size: 12px; z-index: 10; }
  #debug.open { display: block; }
  #debug .dh { display: flex; justify-content: space-between; margin-bottom: 6px; }
  #debug .dclose { color: #8fa3c8; }
  #debug .dctl { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: center; margin-bottom: 4px; font-weight: 700; }
  #debug .dctl select { width: 100%; }
  #debug .dhelp { color: #b8c6ea; line-height: 1.5; margin-bottom: 10px; }
  #debug .dinfo { font-family: ui-monospace, Menlo, monospace; color: #9fe8ff; margin-bottom: 8px; line-height: 1.5; }
  #debug .dbtns { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  #debug button, #debug select { font-size: 12px; padding: 5px 8px; border-radius: 6px; background: #1d2c5c; color: #e6ecff; border: 1px solid #3b5bb5; }
  #debug .drow { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 6px; }
  #debug .drow input { grid-column: 1 / 3; width: 100%; }
  #debug .dval { font-family: ui-monospace, Menlo, monospace; color: #ffd24a; }
  #dashBtn { position: fixed; left: 14px; bottom: calc(30px + min(102px, 13.6vh, 17vw));
    padding: 12px 18px; display: none; pointer-events: auto; z-index: 2; border: 1px solid #5fd8ff;
    border-radius: 8px; background: #0d1530; color: #cfe0ff; font-weight: 700; font-size: 13px; }
  #dashBtn.show { display: block; }
  #dashBtn:disabled { opacity: 0.4; }
  #dashBtn.active { background: rgba(255,228,107,0.35); }
  kbd { font-family: ui-monospace, Menlo, monospace; font-size: 11px; border: 1px solid #3b4a7a; border-radius: 4px; padding: 1px 5px; color: #b8c6ea; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<button id="dashBtn" type="button">ハイパー</button>
<style>.version-links{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.version-links a{color:#bfeaff;border:1px solid #466183;border-radius:6px;padding:8px 12px;text-decoration:none;font-size:13px}.version-links a:hover{background:#172c43}</style>
<script>
(() => {
'use strict';
// ---- config.js ----
// All tunable numbers live here. The debug panel edits this object directly.
const CONFIG = {
  // run
  runTime: 600,
  escapeSpeed: 2250, // legacy speed reference for visual effects, no longer a clear condition
  escapeBonus: 30, // clear bonus (legacy key retained)
  bossTime: 420, // one provisional boss appears after seven minutes
  bossHp: 2200,
  bossArmor: 14,
  bossFinishReplayWindow: 0.18, // actual approach recorded before the final blow
  bossFinishSlowTime: 1.2,
  bossFinishZoom: 3.2,
  bossFinishBlastTime: 2,
  bossFinishClearTime: 1.4,
  speedToKms: 11.2 / 2250, // display factor: escape speed shows as 11.2 km/s

  // field
  fieldRadius: 6000,
  planetRadius: 420,
  zoneInner: 2200,
  zoneOuter: 4200,
  startRadius: 3200,
  planetGM: 0, // gravity is off (the user found it annoying); 3.0e8 gives ~29 px/s^2 at the start radius
  gravityTestGM: 3.0e8, // reference strength used by the gravity tests and the panel's slider range
  moonCount: 6,
  moonGM: 0, // was 1.2e7; moons are now plain obstacles
  moonOrbitSpeed: 0.02, // rad/s
  dustCount: 34,
  dustDrag: 0.55,
  boundaryPush: 600,
  crashRestitution: 0.45,
  crashDamage: 0.012, // hp per px/s of impact speed above 200

  // ship
  baseMaxSpeed: 500, // start slow (2.5 km/s) so growth over the run is felt
  levelSpeedGrowth: 0.02, // +2% max speed per level
  levelAtkGrowth: 0.02, // +2% attack per level
  levelHpGrowth: 4, // +4 max HP per level
  levelChargeGrowth: 0.01, // -1% charge time per level (down to 60%)
  dropBase: 0.005, // module drop chance = dropBase * power^dropPowerExp (power = enemy xp)
  dropPowerExp: 1,
  dropMax: 0.5,
  weaponSlots: 6, // weapons held at once (level-ups stop offering new ones when full)
  gunRate: 2.5, // blaster shots per second at weapon level 1
  gunDamage: 5, // blaster damage x attack multiplier (level, modules, station); not speed
  gunSpeed: 1100, // px/s on top of the ship's own velocity
  gunLife: 0.7, // seconds
  gunSpread: 0.16, // radians between shots when it fires several
  hyperCapsuleCount: 4,
  hyperCapsuleInterval: 16,
  spawnMargin: 70, // spawn/recycle just beyond the actual screen edges
  spawnRefillTime: 1, // replenish local population deficits in about one world second
  spawnRecycleScale: 1.6,
  dupBonus: 0.15, // each duplicate pickup adds +15% to that module's effect
  atkScale: 1.8, // attack = speed / 100 * atkMult * atkScale (keeps early fodder one-shot at the slower start)
  launchRatio: 0.8, // full gauge launch = maxSpeed * launchRatio
  carry: 0.65, // share of current speed carried into the next launch (same direction)
  chargeTime: 0.7, // seconds to fill the gauge
  minGauge: 0.12,
  minDrag: 14, // screen px; shorter drags boost forward along velocity
  controlScheme: 'hyper', // see controls.js SCHEMES
  hyperMaxCharges: 5, // hyperdrive: jump charges stack up to this many
  hyperChargeTime: 3, // seconds per charge (scaled by charge-time stats)
  hyperRadius: 420, // jump reach (scales with max speed / base max speed and range modules)
  hyperFocusScale: 0.12, // world speed while aiming in hyperdrive mode
  hyperFocusMax: 3, // real seconds of aiming before the mode closes by itself (0 = unlimited)
  hyperJumpTime: 0.09, // real seconds to cross one jump, however long
  hyperKeep: 0.95, // share of the jump speed kept afterwards
  hyperCoast: 0.6, // seconds of that speed before it starts to slow down
  streakAngle: 25, // slipstream: degrees a jump may differ from the last and still count as the same direction
  streakWindow: 1.5, // slipstream: real seconds after landing for the next jump to continue the streak
  streakMax: 4, // slipstream: steps of extra speed
  hyperDecay: 0.6, // per second: after a jump, speed above cruise speed (steerCruise) fades at this rate
  portalSpacing: 260, // minimum separation between portals (including manual ones)
  portalManualMax: 12,
  portalDropMax: 36,
  portalDropChance: 0, // temporarily disabled; portals are placed with B
  portalDropUses: 3,
  portalRefillInterval: 1.5, // nearby kills replenish at most once per this many world seconds
  portalMinHop: 100,
  portalReach: 900, // scales with max speed and path-length modules
  portalBudget: 2400, // total distance per activation; same growth as reach
  portalExitHold: 0.5, // real seconds holding Space to leave; a short release confirms a route
  portalEdgeCooldown: 10, // real play seconds; shared by both directions and survives leaving
  portalChooseScale: 1, // enemies and bullets keep normal speed while choosing
  portalEntryRadius: 28, // ship body + this radius triggers a portal on entry
  portalEntryCooldown: 0.6, // world seconds after ending a chain
  portalHopTime: 0.22, // maximum real seconds for each segment
  portalWaveRadius: 160,
  portalWaveDamage: 0.9,
  portalLoopDamage: 1.2, // attack power x rarity multiplier inside a closed path
  portalLoopSplashRadius: 90, // legendary: each enclosed enemy also explodes outward
  portalLoopSplashDamage: 0.5,
  portalLoopMinArea: 64, // reject degenerate backtracking loops
  dashSlowRef: 260, // world speed during a jump = dashSlowRef / dash speed (faster ship -> slower world)
  dashScaleMin: 0.03, // ...but never slower than this
  waveRadius: 45, // reach of the wave a jump gives off (the band's half-width); the ship body itself stays shipRadius
  waveDamage: 0.5, // wave damage = attack x this (ignores armor; the body hit is separate)
  killHitstop: 0.045, // seconds of hitstop per one-shot ram kill (x1.8 big, x1.3 crit)
  killHitstopCap: 0.6, // max hitstop per dash
  enemyAimLag: 0.5, // seconds: enemies aim at a lagging copy of the ship's position
  enemyAimSpeed: 450, // px/s: that copy never moves faster than this (dashes leave enemy aim behind)
  killHitstopRegen: 0.3, // outside dashes the hitstop budget refills this many seconds per second
  stickCruiseMax: 0.75, // hyperdrive-mode touch stick pushed to its edge cruises up to this share of max speed (ramming = the normal attack)
  stickDeadZone: 8, // screen px: touch stick offset below this does not steer
  stickRadius: 70, // screen px: stick offset for full speed (the press point stays fixed)
  mouseDeadZone: 40, // world units: a cursor this close to the ship does not steer
  nudgeAccel: 450, // nudge/relative schemes: WASD thrust at rest
  nudgeSteer: 0.7, // extra thrust per px/s of speed so fast ships can still bend
  nudgeMaxSpeed: 0.4, // forward thrust only speeds the ship up below this share of max speed
  pivotSpeed: 60, // below this speed the heading stays where the controls left it
  pivotRate: 3.2, // relative scheme: rad/s turning in place
  turnRateMin: 1.6, // rotate scheme: rad/s when tapping A/D
  turnRateMax: 4.6, // rotate scheme: rad/s after holding
  turnAccelTime: 0.35,
  steerRate: 4.5, // rad/s the travel direction swings toward the held WASD direction
  steerAccel: 900, // px/s^2 WASD acceleration while below cruise speed
  steerCruise: 0.4, // WASD alone gets the ship up to this share of max speed
  boostDuration: 0.9, // seconds after launch with no cruise drag
  energyCut: 0.85, // speed kept when the launch energy runs out (applied over ~0.3s)
  cruiseDrag: 0.06, // weak per-second drag after the energy runs out
  cruiseFloor: 0.35, // cruise drag never slows below this share of max speed
  overcapDecay: 0.3, // per second decay of speed above max speed
  shipRadius: 16,
  baseHP: 120,
  invulnTime: 0.6,
  pickupRadius: 140,

  // enemies
  enemyHpMult: 1,
  enemyArmorMult: 1,
  densityMult: 5,
  enemySpacing: 44, // leave room for armor/weak-point outlines as well as the bodies
  enemyPursuitSpread: 480, // width reference for roaming routes across the current view
  enemyApproachCycle: 18,
  enemyApproachTime: 4.5, // staggered rushes; other enemies keep crossing the outer parts of the view
  enemyApproachBlend: 2,
  enemyRoamTurn: 0.12,
  enemySplitOverflow: 0.1, // offspring may exceed the normal population target by at most 10%
  dangerLevel: 2.2, // extra enemy level at full danger (planet surface / field edge)
  meteorCount: 12,
  meteorCoinChance: 0.4,
  coreBoost: 0.18, // max speed gained per power core
  levelHeal: 0.08, // share of max HP restored per level-up
  capsuleCount: 5, // field capsules kept on the map
  capsuleInterval: 16, // seconds between respawns

  // growth
  xpBase: 10,
  xpGrowth: 7,
  xpMult: 1,

  // flung wreckage visuals
  blockImpactLife: 0.65,
  weakImpactLife: 0.38,
  blockSparkCount: 28,
  weakFlameCount: 16,
  corpseTrailLife: 0.26, // real seconds; a flung fragment's actual path fades after it disappears
  corpseTrailPoints: 18, // bound each fragment's visual history
  corpseSpinRate: 10, // rad/s for rotating wreckage
  // camera
  baseView: 1100, // world units visible on the shorter screen side at rest
  zoomRefSpeed: 700,
  zoomExp: 0.7,
  zoomMin: 0.28,
  lookAhead: 0.32,
};

// ---- controls.js ----
// Control schemes. buildIntent turns raw input into what the world needs (charge / release / aim);
// controlStep and controlAim run inside the world step for scheme-specific steering and aiming.


const SCHEMES = [
  { id: 'portal', name: 'ポータル連続突進（試作）', help: 'WASD／矢印で通常移動、Bで設置（水色・残る）。Space短押しで最寄りポータルへ突進（ゲージ不要）。入場するとポータルに乗る。乗っている間は移動可能な全ポータルへ薄い線が出る。Aで反時計回り、Dで時計回りに行き先を選び、黄色い太線が次の経路。Spaceを短く押して離すと選んだポータルへ移動、0.5秒長押しで離脱。移動可能な接続先がなくなると自動離脱。移動中も次の行き先を選んで出発を予約できる。自動出発はしない。通った辺は往復とも10秒クールダウンし、離脱しても残る。同じ辺は一回のアタック中に再利用できない。ポータルの敵ドロップは停止中。待機中も敵と弾は通常速度で動く。通過軌跡は離脱まで残る' },
  { id: 'hyper', name: 'ハイパードライブ', help: 'カーソルの方向へ進む（クリック不要。タッチ操作では押した点からずらす仮想スティック）。ジャンプは時間で1つずつ溜まり、最大5つまで貯められる。Spaceでハイパードライブに入ると世界がスローになり、届く範囲の円が出る。クリックした地点へまっすぐジャンプ（円の外なら円の端まで）。チャージが残っている間はクリックを続けて連続ジャンプできる。Space／右クリックで解除、チャージ切れか一定時間で自動解除。通り道の敵は貫通し、周りに波動。ジャンプ後は勢いが少し残り、徐々に減速する。硬い敵には弾かれる。モジュール選択はハイパードライブ解除後' },
  { id: 'mouse', name: 'マウスの方向へ進む ＋ Space', help: 'カーソルを置いた方向へ機体が向かう（クリック不要）。Space（またはクリック長押し）でチャージ → 離すとカーソルの方向へ突進' },
  { id: 'steer', name: 'WASD 旋回（画面基準）＋ Space', help: 'WASD で押した方向へ進行方向が素早く回る。Space 長押しでチャージ → 離すと進んでいる方向へ加速' },
  { id: 'relative', name: 'WASD 機体基準 ＋ Space', help: 'W 前進・S ブレーキ・A/D 左右に曲がる（止まっているとその場で旋回）。Space で機体の向きへ加速' },
  { id: 'nudge', name: 'WASD 微推力（画面基準）＋ Space', help: 'WASD で押した方向へ小さく推力。Space で進んでいる方向へ加速' },
  { id: 'rotate', name: 'A/D 照準を回す ＋ Space', help: 'A/D で照準を回す（長押しで速く）、W で進行方向へ、S で反転。Space で照準の向きへ突進' },
  { id: 'aim8', name: 'WASD 8 方向に狙う ＋ Space', help: 'WASD で狙う方向（8 方向）を決め、Space で突進。キーなしなら進行方向へ' },
  { id: 'drag', name: 'マウスで引っ張って離す', help: '押したままドラッグ → 離すとドラッグと逆方向へ突進。長く押すほど強い' },
];

function schemeById(id) {
  return SCHEMES.find((s) => s.id === id) || SCHEMES.find((s) => s.id === 'hyper');
}

function isHyperScheme(id) {
  return id === 'hyper';
}

// Raw input -> intent { charging, release, aimX, aimY, keyboard, move, snap, cursor }.
// keyboard: the launch direction comes from the scheme (controlAim) instead of a drag.
function buildIntent(raw, scheme) {
  const it = { move: raw.move, snap: raw.snap, cursor: raw.cursor, press: !!raw.pressed, charging: false, release: false, aimX: 0, aimY: 0, keyboard: false };
  if (scheme === 'portal') {
    it.keyboard = true;
    it.place = !!raw.place;
    it.portalPressed = !!raw.dash;
    it.portalHolding = !!raw.space;
    it.portalHeldTime = raw.spaceHeldTime;
    it.portalReleased = !!raw.release && raw.releaseSource === 'space';
    it.portalCycle = raw.portalCycle || 0;
  } else if (scheme === 'drag') {
    it.charging = raw.pointerDown;
    it.aimX = raw.drag.x; it.aimY = raw.drag.y;
    if (raw.release && raw.releaseSource === 'pointer') { it.release = true; it.aimX = raw.releaseDrag.x; it.aimY = raw.releaseDrag.y; }
  } else if (isHyperScheme(scheme)) {
    // mouse: head toward the cursor (no click needed). touch: the press is a virtual stick (offset
    // from the press point) outside hyperdrive. Space / the button toggles hyperdrive; inside it,
    // a click or tap is a jump target and a right click leaves.
    it.keyboard = true;
    it.hyperToggle = !!raw.dash;
    it.jumpClicks = raw.clickCursors?.length ? raw.clickCursors : raw.clickCursor ? [raw.clickCursor] : [];
    it.hyperExit = !!raw.confirm;
    if (raw.pointerDown && raw.pointerType === 'touch') it.stick = { x: -raw.drag.x, y: -raw.drag.y };
  } else if (scheme === 'mouse') {
    it.charging = raw.space || raw.pointerDown;
    it.keyboard = true;
    it.release = raw.release;
  } else {
    // keyboard schemes keep the slingshot drag as a fallback
    if (raw.pointerDown) { it.charging = true; it.aimX = raw.drag.x; it.aimY = raw.drag.y; }
    else { it.charging = raw.space; it.keyboard = true; }
    if (raw.release) {
      it.release = true;
      if (raw.releaseSource === 'pointer') { it.keyboard = false; it.aimX = raw.releaseDrag.x; it.aimY = raw.releaseDrag.y; }
      else it.keyboard = true;
    }
  }
  return it;
}

const hasMove = (m) => m && (m.x || m.y);

// Swing the travel direction toward `want` at a fixed turn rate (speed kept); below cruise speed
// also accelerate that way so the ship can always get going.
function steerToward(game, want, dt, cruiseShare = CONFIG.steerCruise) {
  const sh = game.ship;
  const sp = Math.hypot(sh.vx, sh.vy);
  if (sp > 1) {
    const cur = Math.atan2(sh.vy, sh.vx);
    const d = Math.atan2(Math.sin(want - cur), Math.cos(want - cur));
    const turn = Math.max(-CONFIG.steerRate * dt, Math.min(CONFIG.steerRate * dt, d));
    const c = Math.cos(turn), s = Math.sin(turn);
    const vx = sh.vx * c - sh.vy * s;
    sh.vy = sh.vx * s + sh.vy * c;
    sh.vx = vx;
  }
  const cruise = game.stats.maxSpeed * cruiseShare;
  if (sp < cruise) {
    const add = Math.min(CONFIG.steerAccel * dt, cruise - sp);
    sh.vx += Math.cos(want) * add;
    sh.vy += Math.sin(want) * add;
  }
  sh.hx = Math.cos(want); sh.hy = Math.sin(want);
}

function stickAngle(stick) {
  if (!stick || Math.hypot(stick.x, stick.y) < CONFIG.stickDeadZone) return null;
  return Math.atan2(stick.y, stick.x);
}

function cursorAngle(game, cursor) {
  if (!cursor) return null;
  const sh = game.ship;
  const dx = cursor.x - sh.x, dy = cursor.y - sh.y;
  if (dx * dx + dy * dy < CONFIG.mouseDeadZone * CONFIG.mouseDeadZone) return null;
  return Math.atan2(dy, dx);
}

// Screen-absolute small thrust (forward thrust only helps while slow).
function nudgeAbsolute(game, move) {
  const sh = game.ship;
  const sp = Math.hypot(sh.vx, sh.vy);
  const acc = CONFIG.nudgeAccel + CONFIG.nudgeSteer * sp;
  let ax = move.x * acc, ay = move.y * acc;
  if (sp > 1) {
    const ux = sh.vx / sp, uy = sh.vy / sp;
    const par = ax * ux + ay * uy;
    if (par > 0 && sp >= game.stats.maxSpeed * CONFIG.nudgeMaxSpeed) { ax -= par * ux; ay -= par * uy; }
  } else {
    sh.hx = move.x; sh.hy = move.y;
  }
  return { ax, ay };
}

// Ship-relative: W forward, S brake (never reverse), A/D bend when moving or pivot when still.
function nudgeRelative(game, move, dt) {
  const sh = game.ship;
  const fwd = -Math.sign(move.y), side = Math.sign(move.x);
  const sp = Math.hypot(sh.vx, sh.vy);
  const rx = -sh.hy, ry = sh.hx;
  let ax = 0, ay = 0;
  if (side) {
    if (sp > CONFIG.pivotSpeed) {
      const acc = CONFIG.nudgeAccel + CONFIG.nudgeSteer * sp;
      ax += rx * side * acc; ay += ry * side * acc;
    } else {
      const a = Math.atan2(sh.hy, sh.hx) + side * CONFIG.pivotRate * dt;
      sh.hx = Math.cos(a); sh.hy = Math.sin(a);
    }
  }
  if (fwd > 0 && sp < game.stats.maxSpeed * CONFIG.nudgeMaxSpeed) { ax += sh.hx * CONFIG.nudgeAccel; ay += sh.hy * CONFIG.nudgeAccel; }
  if (fwd < 0 && sp > 0) {
    const brake = Math.min(CONFIG.nudgeAccel + CONFIG.nudgeSteer * sp, sp / dt);
    ax -= (sh.vx / sp) * brake; ay -= (sh.vy / sp) * brake;
  }
  return { ax, ay };
}

// Rotating aim: A/D turn (accelerating while held), W/S snap to travel direction / flip.
function rotateAim(game, input, dt) {
  const sh = game.ship;
  const turn = input.move ? Math.sign(input.move.x) : 0;
  if (turn) {
    sh.turnHeld += dt;
    const k = Math.min(1, sh.turnHeld / CONFIG.turnAccelTime);
    sh.aimAngle += turn * (CONFIG.turnRateMin + (CONFIG.turnRateMax - CONFIG.turnRateMin) * k) * dt;
  } else {
    sh.turnHeld = 0;
  }
  if (input.snap === 'forward' && Math.hypot(sh.vx, sh.vy) > 1) sh.aimAngle = Math.atan2(sh.vy, sh.vx);
  else if (input.snap === 'back') sh.aimAngle += Math.PI;
  sh.aimAngle = Math.atan2(Math.sin(sh.aimAngle), Math.cos(sh.aimAngle));
}

const ZERO = { ax: 0, ay: 0 };

// Per-step steering. Returns extra acceleration for the physics step.
function controlStep(game, input, dt) {
  const sh = game.ship;
  switch (game.scheme) {
    case 'hyper': {
      // mouse: head toward the cursor at the usual cruise speed (no click needed).
      // touch: a virtual stick; pushing it further goes faster.
      const throttle = (k) => CONFIG.steerCruise + (CONFIG.stickCruiseMax - CONFIG.steerCruise) * Math.max(0, Math.min(1, k));
      if (input.stick && !game.hyper.focus) {
        const a = stickAngle(input.stick);
        if (a !== null) {
          const len = Math.hypot(input.stick.x, input.stick.y);
          steerToward(game, a, dt, throttle((len - CONFIG.stickDeadZone) / Math.max(1, CONFIG.stickRadius - CONFIG.stickDeadZone)));
        }
        return ZERO;
      }
      const a = cursorAngle(game, input.cursor);
      if (a !== null) steerToward(game, a, dt);
      return ZERO;
    }
    case 'mouse': {
      const a = cursorAngle(game, input.cursor);
      if (a !== null) steerToward(game, a, dt);
      return ZERO;
    }
    case 'portal':
    case 'steer':
      if (hasMove(input.move)) steerToward(game, Math.atan2(input.move.y, input.move.x), dt);
      return ZERO;
    case 'nudge':
      return hasMove(input.move) ? nudgeAbsolute(game, input.move) : ZERO;
    case 'relative':
      return hasMove(input.move) ? nudgeRelative(game, input.move, dt) : ZERO;
    case 'rotate':
      rotateAim(game, input, dt);
      return ZERO;
    default:
      return ZERO;
  }
}

// Scheme aim for keyboard/hover launches: a vector, or null to boost along the heading.
function controlAim(game, input) {
  const sh = game.ship;
  switch (game.scheme) {
    case 'hyper': {
      const a = input.stick && !game.hyper.focus ? stickAngle(input.stick) : cursorAngle(game, input.cursor);
      return a === null ? null : { x: Math.cos(a) * 100, y: Math.sin(a) * 100 };
    }
    case 'mouse': {
      const a = cursorAngle(game, input.cursor);
      return a === null ? null : { x: Math.cos(a) * 100, y: Math.sin(a) * 100 };
    }
    case 'rotate':
      return { x: Math.cos(sh.aimAngle) * 100, y: Math.sin(sh.aimAngle) * 100 };
    case 'aim8':
      return hasMove(input.move) ? { x: input.move.x * 100, y: input.move.y * 100 } : null;
    default:
      return null;
  }
}

// ---- enemies.js ----


const BACK = Math.PI;
const SIDE = Math.PI / 2;

// hp/armor/contact are level-1 values; armor is in attack units (speed/100 at x1 multiplier).
const ENEMY_TYPES = {
  drifter: { name: 'ドリフター', r: 14, hp: 6, armor: 2, speed: 130, accel: 2.5, contact: 6, xp: 1, color: '#7fd1ff', shape: 'orb', behavior: 'chase', weakDir: BACK, weakArc: 1.0 },
  swarm: { name: 'スウォーム', r: 11, hp: 3, armor: 1.2, speed: 200, accel: 3, contact: 4, xp: 0.6, color: '#9df0ff', shape: 'dart', behavior: 'chase', weakDir: BACK, weakArc: 1.1 },
  darter: { name: 'ダーター', r: 16, hp: 9, armor: 3.5, speed: 110, accel: 2, contact: 10, xp: 2, color: '#ff9f6b', shape: 'dart', behavior: 'dash', weakDir: BACK, weakArc: 0.9, range: 520, windup: 0.7, dashSpeed: 760, dashTime: 0.55, recover: 0.9 },
  armored: { name: '装甲型', r: 30, hp: 40, armor: 12, speed: 70, accel: 1.2, contact: 11, xp: 6, color: '#9aa7b8', shape: 'hex', behavior: 'chase', weakDir: BACK, weakArc: 0.8, turn: 1.2 },
  splitter: { name: '分裂型', r: 22, hp: 14, armor: 4, speed: 60, accel: 1.5, contact: 8, xp: 2, color: '#a8ff7a', shape: 'blob', behavior: 'split', weakDir: SIDE, weakDir2: -SIDE, weakArc: 0.55, budInterval: 5, maxBuds: 5, turn: 1.5 },
  splitling: { name: '分裂体', r: 10, hp: 3, armor: 1.5, speed: 150, accel: 2.5, contact: 4, xp: 0.4, color: '#cfff9a', shape: 'blob', behavior: 'chase', weakDir: BACK, weakArc: 1.2 },
  leech: { name: '減速型', r: 20, hp: 14, armor: 5, speed: 120, accel: 1.6, contact: 6, xp: 3, color: '#c77dff', shape: 'diamond', behavior: 'leech', weakDir: BACK, weakArc: 0.9, auraR: 210, drain: 0.9, steal: 0.2 },
  gunner: { name: '射撃型', r: 18, hp: 12, armor: 4, speed: 110, accel: 2, contact: 8, xp: 3, color: '#ff6b9a', shape: 'ship', behavior: 'gunner', weakDir: BACK, weakArc: 0.9, keep: 560, fireInterval: 2.8, telegraph: 0.5, bulletSpeed: 430, bulletDmg: 7, slow: 0.12 },
  missile: { name: 'ミサイル艇', r: 22, hp: 20, armor: 6, speed: 85, accel: 1.5, contact: 10, xp: 5, color: '#ffb36b', shape: 'ship', behavior: 'missile', weakDir: SIDE, weakDir2: -SIDE, weakArc: 0.6, keep: 720, fireInterval: 4.5, telegraph: 0.6, missileSpeed: 500, missileTurn: 1.7, bulletDmg: 11, slow: 0.2 },
  battleship: { name: '戦艦', r: 95, hp: 420, armor: 20, speed: 45, accel: 0.6, contact: 22, xp: 45, color: '#d0d6e8', shape: 'ship', behavior: 'battleship', weakDir: BACK, weakArc: 0.55, turn: 0.5, fireInterval: 1.8, telegraph: 0.5, volley: 7, spread: 0.9, bulletSpeed: 380, bulletDmg: 12, slow: 0.15 },
  titan: { name: 'タイタン', r: 75, hp: 160, armor: 6, speed: 38, accel: 0.8, contact: 18, xp: 25, color: '#ff8fd1', shape: 'blob', behavior: 'chase', weakDir: BACK, weakArc: 1.0, turn: 0.8, sizeVar: true },
  boss: { name: 'ボス戦艦（暫定）', r: 120, hp: 2200, armor: 14, speed: 100, accel: 0.8, contact: 28, xp: 100, color: '#ff526e', shape: 'ship', behavior: 'battleship', weakDir: BACK, weakArc: 0.7, turn: 0.7, fireInterval: 2.6, telegraph: 0.8, volley: 9, spread: 1.3, bulletSpeed: 420, bulletDmg: 15, slow: 0.15 },
  meteor: { name: '隕石', r: 40, hp: 20, armor: 5, speed: 40, accel: 0, contact: 10, xp: 1, color: '#8b7a6a', shape: 'rock', behavior: 'drift', weakDir: 0, weakArc: 0 },
};

const MAX_ENEMY_R = 130;

let nextId = 1;

function createEnemy(type, level, x, y, opts = {}) {
  const T = ENEMY_TYPES[type];
  const L = Math.max(1, level);
  const elite = !!opts.elite;
  const size = type === 'meteor' || T.sizeVar ? (opts.size || T.r) : T.r;
  const sz = size / T.r;
  const hp = T.hp * sz * sz * (1 + 0.6 * (L - 1)) * CONFIG.enemyHpMult * (elite ? 3 : 1);
  return {
    id: nextId++, type, T, level: L, elite,
    x, y, vx: 0, vy: 0,
    r: size * (elite ? 1.25 : 1),
    hp, maxHp: hp,
    armor: T.armor * sz * (1 + 0.35 * (L - 1)) * CONFIG.enemyArmorMult * (elite ? 1.3 : 1),
    contact: T.contact * (1 + 0.2 * (L - 1)),
    xp: T.xp * sz * (1 + 0.5 * (L - 1)) * (elite ? 4 : 1),
    speed: T.speed * (1 + 0.04 * (L - 1)),
    facing: opts.facing ?? 0,
    weakDir: T.weakDir, weakDir2: T.weakDir2, weakArc: T.weakArc || 0,
    hitCD: 0, flash: 0, dead: false,
    state: 'move', timer: 0, fireT: (T.fireInterval || 0) * (0.5 + Math.random() * 0.5), charge: 0, budT: 0, buds: 0, age: 0,
    parent: opts.parent || 0,
    spin: opts.spin || 0,
  };
}

function steerTo(e, tx, ty, speed, accel, dt) {
  const dx = tx - e.x, dy = ty - e.y;
  const d = Math.hypot(dx, dy) || 1;
  const k = Math.min(1, accel * dt);
  e.vx += ((dx / d) * speed - e.vx) * k;
  e.vy += ((dy / d) * speed - e.vy) * k;
}

function turnToward(e, target, rate, dt) {
  let d = target - e.facing;
  d = Math.atan2(Math.sin(d), Math.cos(d));
  const m = rate * dt;
  e.facing += Math.max(-m, Math.min(m, d));
}

// Where enemies think the ship is: a sluggish copy of its position (see updateEnemyAim), so a
// fast dash leaves their aim behind instead of being tracked instantly.
function enemyTarget(game) {
  return game.enemyAim || game.ship;
}

function angleToShip(e, game) {
  const t = enemyTarget(game);
  return Math.atan2(t.y - e.y, t.x - e.x);
}

// Ease the enemies' idea of the ship's position toward the real one: lagging by `enemyAimLag`
// seconds and never faster than `enemyAimSpeed`.
function updateEnemyAim(game, dt) {
  const sh = game.ship;
  if (!game.enemyAim) { game.enemyAim = { x: sh.x, y: sh.y }; return; }
  const a = game.enemyAim;
  let dx = sh.x - a.x, dy = sh.y - a.y, d = Math.hypot(dx, dy);
  // Keep the reaction lag, but never let its target remain several screens behind forever.
  const maxLag = Math.max(300, game.viewRadius * 0.55);
  if (d > maxLag) {
    a.x = sh.x - dx / d * maxLag; a.y = sh.y - dy / d * maxLag;
    dx = sh.x - a.x; dy = sh.y - a.y; d = maxLag;
  }
  if (d < 1e-6) return;
  const step = Math.min(d * (1 - Math.exp(-dt / CONFIG.enemyAimLag)), CONFIG.enemyAimSpeed * dt);
  a.x += dx / d * step; a.y += dy / d * step;
}

// Hold a ring around the ship at `keep` distance while circling it.
function keepDistance(e, game, dt) {
  const sh = enemyTarget(game);
  const dx = e.x - sh.x, dy = e.y - sh.y;
  const d = Math.hypot(dx, dy) || 1;
  const side = e.id % 2 ? 1 : -1;
  const tx = sh.x + (dx / d) * e.T.keep - (dy / d) * 200 * side;
  const ty = sh.y + (dy / d) * e.T.keep + (dx / d) * 200 * side;
  steerTo(e, tx, ty, e.speed, e.T.accel, dt);
  turnToward(e, angleToShip(e, game), 3, dt);
}

function fire(game, e, angle, speed, kind) {
  const T = e.T;
  const lv = 1 + 0.25 * (e.level - 1);
  game.ebullets.push({
    kind, x: e.x + Math.cos(angle) * e.r, y: e.y + Math.sin(angle) * e.r,
    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, speed,
    r: kind === 'missile' ? 9 : 7, dmg: T.bulletDmg * lv, slow: T.slow, life: kind === 'missile' ? 4.5 : 4,
    turn: T.missileTurn || 0,
  });
  game.events.push({ type: 'shoot', x: e.x, y: e.y, kind });
}

// Count down to a shot; `charge` > 0 while telegraphing.
function gunTimer(e, dt) {
  e.fireT -= dt;
  e.charge = e.fireT < e.T.telegraph ? 1 - Math.max(0, e.fireT) / e.T.telegraph : 0;
  if (e.fireT <= 0) { e.fireT = e.T.fireInterval; return true; }
  return false;
}

const BEHAVIORS = {
  chase(e, game, dt) {
    const sh = enemyTarget(game);
    // Stagger pursuit so the whole population cannot settle around one central coordinate.
    // Bosses keep pursuing directly; ordinary enemies alternate rushes and broad moving routes.
    const cycle = (e.age + e.id * 1.61803398875) % CONFIG.enemyApproachCycle;
    const roam = e.type === 'boss' ? 0 : Math.max(0, Math.min(1,
      (cycle - CONFIG.enemyApproachTime) / CONFIG.enemyApproachBlend,
      (CONFIG.enemyApproachCycle - cycle) / CONFIG.enemyApproachBlend));
    const view = game.spawnView || { x: sh.x, y: sh.y, halfW: game.viewRadius * 0.707, halfH: game.viewRadius * 0.707 };
    const angle = e.id * 2.39996322973 + e.age * CONFIG.enemyRoamTurn;
    const ux = Math.cos(angle), uy = Math.sin(angle);
    const radius = (0.45 + 0.5 * Math.sqrt((e.id * 0.61803398875) % 1)) * Math.min(1, CONFIG.enemyPursuitSpread / 480);
    const edge = radius / Math.max(Math.abs(ux), Math.abs(uy));
    const tx = sh.x + (view.x + ux * edge * view.halfW - sh.x) * roam;
    const ty = sh.y + (view.y + uy * edge * view.halfH - sh.y) * roam;
    steerTo(e, tx, ty, e.speed, e.T.accel || 2, dt);
    turnToward(e, angleToShip(e, game), e.T.turn || 4, dt);
  },
  dash(e, game, dt) {
    const T = e.T;
    const sh = enemyTarget(game);
    const d = Math.hypot(sh.x - e.x, sh.y - e.y);
    e.timer -= dt;
    if (e.state === 'move') {
      BEHAVIORS.chase(e, game, dt);
      if (d < T.range) { e.state = 'windup'; e.timer = T.windup; }
    } else if (e.state === 'windup') {
      e.vx *= 1 - 4 * dt; e.vy *= 1 - 4 * dt;
      turnToward(e, angleToShip(e, game), 6, dt);
      if (e.timer <= 0) {
        e.state = 'dash'; e.timer = T.dashTime;
        e.vx = Math.cos(e.facing) * T.dashSpeed; e.vy = Math.sin(e.facing) * T.dashSpeed;
      }
    } else if (e.state === 'dash') {
      if (e.timer <= 0) { e.state = 'recover'; e.timer = T.recover; }
    } else {
      e.vx *= 1 - 2 * dt; e.vy *= 1 - 2 * dt;
      if (e.timer <= 0) e.state = 'move';
    }
  },
  split(e, game, dt) {
    BEHAVIORS.chase(e, game, dt);
    e.budT += dt;
    if (e.budT >= e.T.budInterval) {
      e.budT = 0;
      if (e.buds < e.T.maxBuds) {
        e.buds++;
        const a = game.rng() * Math.PI * 2;
        game.newEnemies.push(createEnemy('splitling', e.level, e.x + Math.cos(a) * e.r * 1.5, e.y + Math.sin(a) * e.r * 1.5, { parent: e.id, facing: a }));
      }
    }
  },
  leech(e, game, dt) {
    BEHAVIORS.chase(e, game, dt);
    const sh = game.ship;
    const d = Math.hypot(sh.x - e.x, sh.y - e.y);
    if (d < e.T.auraR) game.leechDrag += e.T.drain * (1 - d / e.T.auraR * 0.5);
  },
  gunner(e, game, dt) {
    keepDistance(e, game, dt);
    if (gunTimer(e, dt)) fire(game, e, angleToShip(e, game), e.T.bulletSpeed, 'bullet');
  },
  missile(e, game, dt) {
    keepDistance(e, game, dt);
    if (gunTimer(e, dt)) fire(game, e, e.facing, e.T.missileSpeed, 'missile');
  },
  battleship(e, game, dt) {
    BEHAVIORS.chase(e, game, dt);
    if (gunTimer(e, dt)) {
      const base = angleToShip(e, game);
      const n = e.T.volley;
      for (let i = 0; i < n; i++) fire(game, e, base + (i / (n - 1) - 0.5) * e.T.spread, e.T.bulletSpeed, 'bullet');
    }
  },
  drift(e, game, dt) {
    e.facing += e.spin * dt;
  },
};

function onEnemyDeath(e, game) {
  if (e.type === 'splitter') {
    for (let i = 0; i < 2; i++) {
      const a = e.facing + (i ? 1 : -1) * Math.PI / 2;
      const c = createEnemy('splitling', e.level, e.x + Math.cos(a) * e.r, e.y + Math.sin(a) * e.r, { facing: a });
      c.vx = Math.cos(a) * 200; c.vy = Math.sin(a) * 200;
      c.hitCD = 0.35;
      game.newEnemies.push(c);
    }
  }
}

function updateEnemy(e, game, dt) {
  e.age += dt;
  if (e.hitCD > 0) e.hitCD -= dt;
  if (e.flash > 0) e.flash -= dt;
  BEHAVIORS[e.T.behavior](e, game, dt);
  e.x += e.vx * dt;
  e.y += e.vy * dt;
  // stay out of the planet
  const p = game.field.planet;
  const d = Math.hypot(e.x - p.x, e.y - p.y);
  if (d < p.r + e.r && d > 0) {
    e.x = p.x + ((e.x - p.x) / d) * (p.r + e.r);
    e.y = p.y + ((e.y - p.y) / d) * (p.r + e.r);
  }
}

// ---- math.js ----
const TAU = Math.PI * 2;

function clamp(v, a, b) {
  return v < a ? a : v > b ? b : v;
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function smoothstep(a, b, v) {
  const t = clamp((v - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}

function angleDiff(a, b) {
  let d = (a - b) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}

// Segment p0->p1 vs circle (c, r): first t in [0,1] where the segment is inside the circle, -1 if never.
function segCircleT(x0, y0, x1, y1, cx, cy, r) {
  const fx = x0 - cx, fy = y0 - cy;
  const c = fx * fx + fy * fy - r * r;
  if (c <= 0) return 0;
  const dx = x1 - x0, dy = y1 - y0;
  const a = dx * dx + dy * dy;
  if (a === 0) return -1;
  const b = 2 * (fx * dx + fy * dy);
  const disc = b * b - 4 * a * c;
  if (disc < 0) return -1;
  const t = (-b - Math.sqrt(disc)) / (2 * a);
  return t >= 0 && t <= 1 ? t : -1;
}

// mulberry32
function makeRng(seed) {
  let s = seed >>> 0;
  return function rng() {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function randRange(rng, a, b) {
  return a + (b - a) * rng();
}

// items: [[value, weight], ...]
function pickWeighted(rng, items) {
  let total = 0;
  for (const [, w] of items) total += Math.max(0, w);
  if (total <= 0) return items[0][0];
  let r = rng() * total;
  for (const [v, w] of items) {
    if (w <= 0) continue;
    r -= w;
    if (r < 0) return v;
  }
  return items[items.length - 1][0];
}

// ---- field.js ----



function createField(rng) {
  const moons = [];
  for (let i = 0; i < CONFIG.moonCount; i++) {
    moons.push({
      orbit: randRange(rng, 1500, CONFIG.fieldRadius - 600),
      a0: (i / CONFIG.moonCount) * TAU + randRange(rng, -0.3, 0.3),
      dir: rng() < 0.5 ? -1 : 1,
      r: randRange(rng, 110, 180),
      gm: CONFIG.moonGM,
      x: 0, y: 0,
    });
  }
  const dust = [];
  for (let i = 0; i < CONFIG.dustCount; i++) {
    const a = rng() * TAU;
    const d = randRange(rng, CONFIG.planetRadius + 600, CONFIG.fieldRadius - 200);
    dust.push({ x: Math.cos(a) * d, y: Math.sin(a) * d, r: randRange(rng, 250, 620) });
  }
  const field = { planet: { x: 0, y: 0, r: CONFIG.planetRadius, gm: CONFIG.planetGM }, moons, dust };
  updateMoons(field, 0);
  return field;
}

function updateMoons(field, t) {
  for (const m of field.moons) {
    const a = m.a0 + m.dir * CONFIG.moonOrbitSpeed * t;
    m.x = Math.cos(a) * m.orbit;
    m.y = Math.sin(a) * m.orbit;
  }
}

function zoneOf(r) {
  if (r < CONFIG.zoneInner) return 'inner';
  if (r > CONFIG.zoneOuter) return 'outer';
  return 'mid';
}

// 0 in the middle ring, rising to 1 at the planet surface and at the field edge.
function dangerAt(r) {
  if (r < CONFIG.zoneInner) return clamp((CONFIG.zoneInner - r) / (CONFIG.zoneInner - CONFIG.planetRadius), 0, 1);
  if (r > CONFIG.zoneOuter) return clamp((r - CONFIG.zoneOuter) / (CONFIG.fieldRadius - CONFIG.zoneOuter), 0, 1);
  return 0;
}

function dustDragAt(field, x, y) {
  for (const d of field.dust) {
    const dx = x - d.x, dy = y - d.y;
    if (dx * dx + dy * dy < d.r * d.r) return CONFIG.dustDrag;
  }
  return 0;
}

// The run's experience curve. pop = enemies kept around the ship, level = enemy strength.
const PHASES = [
  { id: 'build1', name: '強化期', sub: '弱い敵を吹っ飛ばして機体を育てろ', start: 0, end: 150, pop: [14, 45], level: [1.0, 1.35], rate: 6, mix: { drifter: 6, darter: 1.5, splitter: 0.8, swarm: 1, titan: 0.05 } },
  { id: 'pressure', name: '圧力期', sub: '敵が硬くなってきた', start: 150, end: 240, pop: [45, 70], level: [1.7, 2.3], rate: 8, mix: { drifter: 3.5, darter: 3, armored: 2.2, gunner: 1.1, leech: 1.5, splitter: 1.5, titan: 0.3 } },
  { id: 'build2', name: '強化期 II', sub: '今のうちに組み上げろ', start: 240, end: 300, pop: [38, 45], level: [2.0, 2.2], rate: 6, xpBonus: 1.4, mix: { drifter: 4, darter: 2, splitter: 2, gunner: 1, swarm: 2, titan: 0.4 } },
  { id: 'rampage', name: '無双期', sub: '群れが来る — まとめて貫け', start: 300, end: 360, pop: [140, 260], level: [1.3, 1.6], rate: 60, waves: 3.5, mix: { swarm: 10, drifter: 3, splitling: 2 } },
  { id: 'tension', name: '緊張期', sub: '互角の相手。弱点を突け', start: 360, end: 510, pop: [70, 110], level: [3.0, 4.4], rate: 10, mix: { darter: 3, armored: 3, gunner: 2, missile: 1.3, leech: 2, splitter: 2, drifter: 2.5, titan: 1.2, battleship: 0.3 } },
  { id: 'escape', name: '脱出期', sub: '出力コアで上限を解放し、脱出速度へ', start: 510, end: 600, pop: [90, 120], level: [4.2, 5.0], rate: 12, cores: true, mix: { darter: 3, armored: 3, gunner: 2, missile: 1.6, leech: 2, splitter: 1.5, swarm: 3, titan: 2, battleship: 0.6 } },
];

function getPhase(t) {
  for (const p of PHASES) if (t < p.end) return p;
  return PHASES[PHASES.length - 1];
}

function phaseTarget(t) {
  const p = getPhase(t);
  const k = clamp((t - p.start) / (p.end - p.start), 0, 1);
  return { phase: p, pop: lerp(p.pop[0], p.pop[1], k) * CONFIG.densityMult, level: lerp(p.level[0], p.level[1], k) };
}

function spawnPoint(game, extra = 0) {
  const sh = game.ship;
  const view = spawnBounds(game);
  for (let i = 0; i < 24; i++) {
    // Replenish the sparse sides rather than feeding an already packed approach direction.
    const counts = game.spawnEdgeCounts || [0, 0, 0, 0];
    const side = pickWeighted(game.rng, counts.map((count, edge) => [edge,
      (edge < 2 ? view.halfH : view.halfW) / (count + 8)]));
    const margin = CONFIG.spawnMargin + extra + game.rng() * 80;
    const along = game.rng() * 2 - 1;
    const x = view.x + (side < 2 ? (side === 0 ? -1 : 1) * (view.halfW + margin) : along * view.halfW);
    const y = view.y + (side >= 2 ? (side === 2 ? -1 : 1) * (view.halfH + margin) : along * view.halfH);
    const r = Math.hypot(x, y);
    if (r < CONFIG.fieldRadius + 200 && r > CONFIG.planetRadius + 150) {
      counts[side]++;
      return { x, y, a: Math.atan2(y - sh.y, x - sh.x) };
    }
  }
  return null;
}

function spawnBounds(game) {
  return game.spawnView || { x: game.ship.x, y: game.ship.y, halfW: game.viewRadius * 0.707, halfH: game.viewRadius * 0.707 };
}

// Dangerous zones add tougher enemies; early in the run that bias is mostly armor, not guns.
function mixAt(phase, danger, t) {
  const items = Object.entries(phase.mix);
  if (danger > 0.25) {
    const ramp = clamp(t / 150, 0.15, 1);
    items.push(['armored', 2 * danger], ['gunner', danger * ramp], ['missile', 0.7 * danger * ramp]);
  }
  return items;
}

function spawnOne(game, target) {
  const pt = spawnPoint(game);
  if (!pt) return false;
  const danger = dangerAt(Math.hypot(pt.x, pt.y));
  const type = pickWeighted(game.rng, mixAt(target.phase, danger, game.t));
  if (type === 'battleship' && game.enemies.some((e) => e.type === 'battleship')) return false;
  if (type === 'titan' && game.enemies.filter((e) => e.type === 'titan').length >= 6) return false;
  const T = ENEMY_TYPES[type];
  const late = target.phase.id === 'tension' || target.phase.id === 'escape';
  const elite = type !== 'battleship' && game.rng() < 0.01 + 0.06 * danger + (late ? 0.02 : 0);
  const level = target.level + danger * CONFIG.dangerLevel;
  const size = T.sizeVar ? T.r * (0.85 + game.rng() * 0.45) : undefined;
  game.enemies.push(createEnemy(type, level, pt.x, pt.y, { elite, size, facing: pt.a + Math.PI }));
  return true;
}

function spawnWave(game, target, remaining) {
  const sh = game.ship;
  const n = Math.min(Math.round(30 * CONFIG.densityMult), Math.ceil(remaining));
  if (game.rng() < 0.5) {
    // ring closing in
    const view = spawnBounds(game);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      const ux = Math.cos(a), uy = Math.sin(a);
      const d = Math.min((view.halfW + CONFIG.spawnMargin) / Math.max(0.0001, Math.abs(ux)), (view.halfH + CONFIG.spawnMargin) / Math.max(0.0001, Math.abs(uy)));
      game.enemies.push(createEnemy('swarm', target.level, view.x + ux * d, view.y + uy * d, { facing: a + Math.PI }));
    }
  } else {
    // a stream from one direction
    const a = game.rng() * TAU;
    for (let i = 0; i < n; i++) {
      const view = spawnBounds(game);
      const d = Math.min(view.halfW / Math.max(0.0001, Math.abs(Math.cos(a))), view.halfH / Math.max(0.0001, Math.abs(Math.sin(a)))) + CONFIG.spawnMargin + i * 12;
      const off = (game.rng() - 0.5) * 120;
      game.enemies.push(createEnemy('swarm', target.level, sh.x + Math.cos(a) * d - Math.sin(a) * off, sh.y + Math.sin(a) * d + Math.cos(a) * off, { facing: a + Math.PI }));
    }
  }
  game.events.push({ type: 'wave' });
}

function keepMeteors(game) {
  let near = 0;
  for (const e of game.enemies) if (e.type === 'meteor') near++;
  if (near >= CONFIG.meteorCount) return;
  const pt = spawnPoint(game, 200);
  if (!pt) return;
  const m = createEnemy('meteor', 1, pt.x, pt.y, { size: 24 + game.rng() * 46, spin: (game.rng() - 0.5) * 1.2, facing: game.rng() * TAU });
  const a = pt.a + Math.PI + (game.rng() - 0.5) * 1.6;
  m.vx = Math.cos(a) * m.speed; m.vy = Math.sin(a) * m.speed;
  game.enemies.push(m);
}

function despawnFar(game) {
  const sh = game.ship;
  const view = spawnBounds(game);
  for (const e of game.enemies) {
    if (e.type === 'boss') continue;
    if (e.dead || (Math.abs(e.x - view.x) <= view.halfW * CONFIG.spawnRecycleScale + 200 && Math.abs(e.y - view.y) <= view.halfH * CONFIG.spawnRecycleScale + 200)) continue;
    const pt = spawnPoint(game);
    if (!pt) continue;
    // Recycling retains HP/strength and creates no kills, XP, modules or cooldown exploits.
    e.x = pt.x; e.y = pt.y;
    const dx = sh.x - e.x, dy = sh.y - e.y, d = Math.hypot(dx, dy) || 1;
    e.vx = dx / d * e.speed; e.vy = dy / d * e.speed;
    e.facing = Math.atan2(dy, dx); e.state = 'move'; e.timer = e.charge = 0;
    e.fireT = e.T.fireInterval || 0;
  }
}

function updateSpawner(game, dt) {
  if (!game.spawning) return;
  const bounds = spawnBounds(game);
  game.spawnEdgeCounts = [0, 0, 0, 0];
  for (const e of game.enemies) {
    if (e.dead || e.type === 'boss' || e.type === 'meteor') continue;
    const dx = (e.x - bounds.x) / bounds.halfW, dy = (e.y - bounds.y) / bounds.halfH;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 0.45) continue;
    const side = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 0 : 1) : (dy < 0 ? 2 : 3);
    game.spawnEdgeCounts[side]++;
  }
  if (!game.bossSpawned && game.t >= CONFIG.bossTime) spawnBoss(game);
  despawnFar(game);
  keepMeteors(game);
  const target = phaseTarget(game.t);
  const P = target.phase;
  let alive = 0;
  const view = spawnBounds(game);
  for (const e of game.enemies) if (!e.dead && e.type !== 'meteor' && e.type !== 'boss' &&
    Math.abs(e.x - view.x) <= view.halfW * CONFIG.spawnRecycleScale + 200 && Math.abs(e.y - view.y) <= view.halfH * CONFIG.spawnRecycleScale + 200) alive++;
  const deficit = Math.max(0, target.pop - alive);
  const rate = Math.max(P.rate * CONFIG.densityMult, deficit / CONFIG.spawnRefillTime);
  game.spawnAcc = Math.min(game.spawnAcc + rate * dt, Math.max(8, 8 * CONFIG.densityMult));
  let attempts = 0;
  while (game.spawnAcc >= 1 && alive < target.pop && attempts++ < Math.max(8, 8 * CONFIG.densityMult)) {
    game.spawnAcc -= 1;
    if (spawnOne(game, target)) alive++;
  }
  if (P.waves) {
    game.waveT = (game.waveT || 0) + dt;
    if (game.waveT >= P.waves) { game.waveT = 0; if (alive < target.pop) spawnWave(game, target, target.pop - alive); }
  }
}

function spawnBoss(game) {
  const sh = game.ship;
  const distance = Math.min(1000, game.viewRadius * 0.65);
  const angle = game.rng() * TAU;
  let x = sh.x + Math.cos(angle) * distance, y = sh.y + Math.sin(angle) * distance;
  const planet = game.field.planet;
  if (Math.hypot(x - planet.x, y - planet.y) < planet.r + 180) {
    const a = Math.atan2(sh.y - planet.y, sh.x - planet.x);
    x = planet.x + Math.cos(a) * (planet.r + 220);
    y = planet.y + Math.sin(a) * (planet.r + 220);
  }
  const r = Math.hypot(x, y);
  if (r > CONFIG.fieldRadius - 160) { x *= (CONFIG.fieldRadius - 160) / r; y *= (CONFIG.fieldRadius - 160) / r; }
  const boss = createEnemy('boss', 1, x, y, { facing: Math.atan2(sh.y - y, sh.x - x) });
  boss.hp = boss.maxHp = CONFIG.bossHp * CONFIG.enemyHpMult;
  boss.armor = CONFIG.bossArmor * CONFIG.enemyArmorMult;
  game.boss = boss;
  game.bossSpawned = true;
  game.enemies.push(boss);
  game.events.push({ type: 'bossSpawn', x, y });
}

function baseStats(meta = {}) {
  const lv = (k) => meta[k] || 0;
  return {
    maxSpeed: CONFIG.baseMaxSpeed * (1 + 0.05 * lv('speed')),
    launchRatio: CONFIG.launchRatio,
    carry: CONFIG.carry,
    chargeTime: CONFIG.chargeTime * Math.pow(0.95, lv('charge')),
    gaugeMax: 1,
    boostDuration: CONFIG.boostDuration,
    cruiseDrag: CONFIG.cruiseDrag,
    cruiseFloor: CONFIG.cruiseFloor,
    atkMult: 1 + 0.06 * lv('atk'),
    maxHp: CONFIG.baseHP + 15 * lv('hp'),
    pickupRadius: CONFIG.pickupRadius * (1 + 0.15 * lv('pickup')),
    xpMult: 1 + 0.08 * lv('xp'),
    damageTakenMult: 1,
    hitSlowMult: 1,
    critMult: 2.5,
    weakArcMult: 1,
    pierceLossMult: 1,
    bounceKeep: 0.5,
    bounceDamageMult: 1,
    predictTime: 0.9,
    predictBounce: false,
    regen: 0,
    streakBoost: 0, // slipstream module: extra jump speed per same-direction step
    rangeMult: 1, traceSpeedMult: 1, waveRadiusMult: 1, waveDmgMult: 1, // hyperdrive / portal modules
  };
}

function createShip(stats, x, y) {
  return {
    x, y, vx: 0, vy: 0,
    hp: stats.maxHp,
    charging: false, chargeT: 0, gauge: 0, gaugeBank: 0,
    aimX: 0, aimY: 0, hx: 0, hy: -1, // heading: travel direction, or the last control direction when nearly still
    markX: 0, markY: -1, // where a Space launch would go right now (drawn as the aim marker)
    aimAngle: -Math.PI / 2, turnHeld: 0, // rotating-aim scheme
    boostT: 0, fadeT: 0, invulnT: 0,
    trail: [], trailAcc: 0,
  };
}

function computeGauge(chargeT, stats, bank = 0) {
  return Math.min(stats.gaugeMax, Math.max(CONFIG.minGauge, bank + chargeT / stats.chargeTime));
}

// New velocity after launching along unit direction (dx, dy) with the given gauge.
function launchVelocity(vx, vy, dx, dy, gauge, stats) {
  const speed = Math.hypot(vx, vy);
  const cos = speed > 0 ? Math.max(0, (vx * dx + vy * dy) / speed) : 0;
  const carried = speed * stats.carry * cos;
  const thrust = stats.maxSpeed * stats.launchRatio * gauge;
  const limit = stats.maxSpeed * Math.max(1, gauge);
  const newSpeed = Math.max(Math.min(carried + thrust, limit), speed * cos);
  return { vx: dx * newSpeed, vy: dy * newSpeed };
}

// Integrate one step: acceleration (ax, ay), drag rules, then position.
function stepShip(ship, stats, dt, ax, ay, extraDrag) {
  ship.vx += ax * dt;
  ship.vy += ay * dt;
  let sp = Math.hypot(ship.vx, ship.vy);
  if (sp > 0) {
    let target = sp;
    if (ship.boostT > 0) {
      ship.boostT -= dt;
      if (ship.boostT <= 0) ship.fadeT = 0.3;
    } else {
      if (ship.fadeT > 0) {
        ship.fadeT -= dt;
        if (target > stats.maxSpeed * stats.cruiseFloor) target *= Math.pow(CONFIG.energyCut, dt / 0.3);
      }
      const floor = stats.maxSpeed * stats.cruiseFloor;
      if (target > floor) target = floor + (target - floor) * Math.exp(-stats.cruiseDrag * dt);
    }
    if (target > stats.maxSpeed) {
      target = stats.maxSpeed + (target - stats.maxSpeed) * Math.exp(-CONFIG.overcapDecay * dt);
    }
    if (extraDrag > 0) target *= Math.exp(-extraDrag * dt);
    const k = target / sp;
    ship.vx *= k;
    ship.vy *= k;
  }
  ship.x += ship.vx * dt;
  ship.y += ship.vy * dt;
}

const BY_ID = Object.fromEntries(MODULES.map((m) => [m.id, m]));

function moduleDef(id) {
  return BY_ID[id];
}

function moduleFitsScheme(m, scheme) {
  return (!m.hyperOnly || !scheme || isHyperScheme(scheme) || scheme === 'portal')
    && (!m.portalOnly || scheme === 'portal')
    && (!m.hyperExcluded || !isHyperScheme(scheme))
    && (!m.portalExcluded || scheme !== 'portal')
    && (!m.schemeOnly || scheme === m.schemeOnly);
}

// bonus.cores: power cores collected this run; bonus.level: current level. Both raise max speed.
function computeStats(meta, loadout, bonus = {}) {
  const s = baseStats(meta);
  for (const slot of SLOTS) {
    const mod = loadout[slot.id];
    if (mod) BY_ID[mod.id].apply(s, RARITY_MULT[mod.r] * (1 + CONFIG.dupBonus * (mod.plus || 0)), mod.r);
  }
  const lv = bonus.level || 0;
  s.maxSpeed *= (1 + CONFIG.coreBoost * (bonus.cores || 0)) * (1 + CONFIG.levelSpeedGrowth * lv);
  s.atkMult *= 1 + CONFIG.levelAtkGrowth * lv;
  s.maxHp += CONFIG.levelHpGrowth * lv;
  s.chargeTime *= Math.max(0.6, 1 - CONFIG.levelChargeGrowth * lv);
  return s;
}

function rarityWeights(ctx) {
  if (ctx.source === 'core') return [0, 0, 1, 2];
  if (ctx.source === 'capsule') {
    const d = ctx.danger || 0;
    return [6 * (1 - d), 3 + d, 0.6 + 4 * d, 2.4 * d * d];
  }
  if (ctx.source === 'drop') {
    // stronger enemies (power = their xp: type x level x elite) drop rarer modules
    const d = Math.max(Math.min(1, ((ctx.power || 1) - 1) / 20), (ctx.danger || 0) * 0.6);
    return [6 * (1 - d), 3 + d, 0.6 + 4 * d, 2.4 * d * d];
  }
  const t = ctx.t;
  if (t < 150) return [7, 2.5, 0.5, 0];
  if (t < 300) return [5, 4, 1.2, 0.1];
  if (t < 480) return [3, 4, 2.5, 0.4];
  return [1.5, 3, 4, 1.2];
}

function rollModule(rng, ctx) {
  const t = ctx.t || 0;
  const loadout = ctx.loadout;
  let slot;
  let pool;
  if (ctx.source === 'core') {
    slot = 'booster';
    pool = [BY_ID.limiter];
  } else {
    slot = pickWeighted(rng, SLOTS.map((s) => {
      const cur = loadout[s.id];
      let w = 1 + (cur ? (3 - cur.r) * 0.25 : 1.2);
      if (s.id === ctx.lastSlot) w *= 0.35;
      return [s.id, w];
    }));
    pool = MODULES.filter((m) => m.slot === slot && (m.minTime || 0) <= t && moduleFitsScheme(m, ctx.scheme));
  }
  const rw = rarityWeights(ctx);
  const r = pickWeighted(rng, rw.map((w, i) => [i, w]));
  const fits = pool.filter((m) => m.rarities.includes(r));
  if (fits.length) {
    const def = fits[Math.floor(rng() * fits.length)];
    return { id: def.id, slot, r };
  }
  const def = pool[Math.floor(rng() * pool.length)];
  const nearest = def.rarities.reduce((a, b) => (Math.abs(b - r) < Math.abs(a - r) ? b : a));
  return { id: def.id, slot, r: nearest };
}

// ---- combat.js ----



const CRIT_ARMOR = 0.5; // weak-spot hits only need half the armor

function attackPower(speed, stats) {
  return (speed / 100) * stats.atkMult * CONFIG.atkScale;
}

function isWeakHit(e, hx, hy, arcMult) {
  if (!e.weakArc) return false;
  const a = Math.atan2(hy - e.y, hx - e.x);
  return Math.abs(angleDiff(a, e.facing + e.weakDir)) <= e.weakArc * arcMult;
}

function canPierce(atk, e, crit) {
  return atk >= e.armor * (crit ? CRIT_ARMOR : 1);
}

function resolveRam(atk, e, crit, stats) {
  if (canPierce(atk, e, crit)) {
    const damage = atk * (crit ? stats.critMult : 1);
    return { pierce: true, damage, kill: damage >= e.hp, shipDamage: 0 };
  }
  return { pierce: false, damage: atk * 0.25, kill: false, shipDamage: e.contact };
}

// Share of speed kept after going through an enemy.
function pierceKeep(e, killed, stats) {
  const loss = killed ? 0.004 + e.r * 0.0006 : 0.1 + e.r * 0.002;
  return 1 - Math.min(0.6, loss * stats.pierceLossMult);
}

// ---- grid.js ----
const OFF = 4096;

function buildGrid(list, cell) {
  const map = new Map();
  for (const it of list) {
    if (it.dead) continue;
    const key = (Math.floor(it.x / cell) + OFF) * 8192 + (Math.floor(it.y / cell) + OFF);
    let arr = map.get(key);
    if (!arr) { arr = []; map.set(key, arr); }
    arr.push(it);
  }
  return { cell, map };
}

function queryGrid(grid, x0, y0, x1, y1, cb) {
  const c = grid.cell;
  const cx0 = Math.floor(x0 / c), cx1 = Math.floor(x1 / c);
  const cy0 = Math.floor(y0 / c), cy1 = Math.floor(y1 / c);
  for (let cx = cx0; cx <= cx1; cx++) {
    for (let cy = cy0; cy <= cy1; cy++) {
      const arr = grid.map.get((cx + OFF) * 8192 + (cy + OFF));
      if (!arr) continue;
      for (const it of arr) if (!it.dead) cb(it);
    }
  }
}

function queryRadius(grid, x, y, r, cb) {
  queryGrid(grid, x - r, y - r, x + r, y + r, (it) => {
    const dx = it.x - x, dy = it.y - y, rr = r + (it.r || 0);
    if (dx * dx + dy * dy <= rr * rr) cb(it);
  });
}

// ---- gravity.js ----


function pull(out, x, y, b) {
  const dx = b.x - x, dy = b.y - y;
  const d2 = Math.max(dx * dx + dy * dy, b.r * b.r);
  const d = Math.sqrt(d2);
  const a = b.gm / d2;
  out.ax += (dx / d) * a;
  out.ay += (dy / d) * a;
}

function gravityAt(field, t, x, y) {
  const out = { ax: 0, ay: 0 };
  pull(out, x, y, field.planet);
  for (const m of field.moons) pull(out, x, y, m);
  const r = Math.hypot(x, y);
  if (r > CONFIG.fieldRadius) {
    const push = CONFIG.boundaryPush + (r - CONFIG.fieldRadius) * 4;
    out.ax -= (x / r) * push;
    out.ay -= (y / r) * push;
  }
  return out;
}

// ---- impact-fx.js ----


// Effects remain at the actual contact; the illuminated hull follows a surviving blocker.
function addCombatImpact(game, enemy, kind, nx, ny) {
  const impacts = game.fx.impacts;
  if (impacts.length >= 48) {
    if (kind !== 'block') return;
    const old = impacts.findIndex(i => i.kind !== 'block');
    impacts.splice(Math.max(0, old), 1);
  }
  const life = kind === 'block' ? CONFIG.blockImpactLife : CONFIG.weakImpactLife;
  const x = enemy.x + nx * enemy.r, y = enemy.y + ny * enemy.r;
  impacts.push({ kind, enemy, x, y, nx, ny, life, max: life });
  const count = kind === 'block' ? CONFIG.blockSparkCount : CONFIG.weakFlameCount;
  const normal = Math.atan2(ny, nx);
  for (let i = 0; i < count && game.fx.particles.length < 1800; i++) {
    const side = i % 2 ? 1 : -1;
    const angle = kind === 'block' ? normal + side * (0.8 + Math.random() * 0.75)
      : normal + (Math.random() - 0.5) * 1.25;
    const speed = kind === 'block' ? 180 + Math.random() * 460 : 100 + Math.random() * 260;
    const duration = life * (0.6 + Math.random() * 0.4);
    game.fx.particles.push({ kind: kind === 'block' ? 'spark' : 'flame', x, y,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: duration, max: duration, color: i % 3 ? '#ffae40' : '#fff6c7', size: 2 + Math.random() * 3 });
  }
}

function drawCombatImpacts(r, game) {
  const { ctx } = r;
  const z = r.cam.zoom;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const impact of game.fx.impacts) {
    const a = impact.life / impact.max;
    const { enemy, nx, ny } = impact;
    const x = impact.kind === 'block' && !enemy.dead ? enemy.x + nx * enemy.r : impact.x;
    const y = impact.kind === 'block' && !enemy.dead ? enemy.y + ny * enemy.r : impact.y;
    const reach = (impact.kind === 'block' ? 60 : 38) / Math.sqrt(z);
    const glow = ctx.createRadialGradient(x, y, 0, x, y, reach);
    glow.addColorStop(0, `rgba(255,245,190,${a * 0.85})`);
    glow.addColorStop(0.2, `rgba(255,157,38,${a * 0.6})`);
    glow.addColorStop(1, 'rgba(255,80,12,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(x - reach, y - reach, reach * 2, reach * 2);
    if (impact.kind === 'block') {
      // A brief reflection across this hull identifies the enemy that stopped the dash.
      const angle = Math.atan2(ny, nx);
      ctx.globalAlpha = a;
      ctx.strokeStyle = '#ffcf69'; ctx.lineWidth = 5 / z;
      ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.r + 2 / z, angle - 1.15, angle + 1.15); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

// ---- projectiles.js ----


// Enemy bullets and missiles. Returns hits on the ship via the callback.
function updateEnemyBullets(game, dt, onHit) {
  const sh = game.ship;
  const R = CONFIG.shipRadius;
  const p = game.field.planet;
  for (const b of game.ebullets) {
    if (b.kind === 'missile') {
      const t = game.enemyAim || sh; // home on where enemies think the ship is
      const want = Math.atan2(t.y - b.y, t.x - b.x);
      const cur = Math.atan2(b.vy, b.vx);
      let d = want - cur;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      const a = cur + Math.max(-b.turn * dt, Math.min(b.turn * dt, d));
      b.vx = Math.cos(a) * b.speed; b.vy = Math.sin(a) * b.speed;
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;
    const dx = b.x - sh.x, dy = b.y - sh.y;
    if (dx * dx + dy * dy < (b.r + R) * (b.r + R)) { onHit(b); b.life = 0; }
    if (Math.hypot(b.x - p.x, b.y - p.y) < p.r) b.life = 0;
  }
  if (game.ebullets.some((b) => b.life <= 0)) game.ebullets = game.ebullets.filter((b) => b.life > 0);
}

];

const SAVE_KEY = 'speed-save-v1';

function metaCost(id, level) {
  const u = META_UPGRADES.find((x) => x.id === id);
  if (!u || level >= u.max) return null;
  return u.costs[level];
}

function buyUpgrade(save, id) {
  const lv = save.meta[id] || 0;
  const cost = metaCost(id, lv);
  if (cost == null || save.coins < cost) return false;
  save.coins -= cost;
  save.meta[id] = lv + 1;
  return true;
}

// Debug: put every station upgrade back to 0 and refund the parts spent on them.
function resetMeta(save) {
  let refund = 0;
  for (const u of META_UPGRADES) {
    const lv = save.meta[u.id] || 0;
    for (let i = 0; i < lv; i++) refund += u.costs[i] || 0;
  }
  save.meta = {};
  save.coins += refund;
  return refund;
}

function defaultSave() {
  return { coins: 0, meta: {}, best: { runs: 0, escapes: 0, escapeTime: null, topSpeed: 0 } };
}

function loadSave(storage) {
  try {
    const raw = storage && storage.getItem(SAVE_KEY);
    if (!raw) return defaultSave();
    const s = JSON.parse(raw);
    const d = defaultSave();
    if (typeof s !== 'object' || !s) return d;
    return {
      coins: Number.isFinite(s.coins) ? s.coins : 0,
      meta: typeof s.meta === 'object' && s.meta ? s.meta : {},
      best: { ...d.best, ...(s.best || {}) },
    };
  } catch {
    return defaultSave();
  }
}

function writeSave(storage, save) {
  try { storage && storage.setItem(SAVE_KEY, JSON.stringify(save)); } catch { /* storage unavailable */ }
}

function applyRunResult(save, game) {
  save.coins += Math.round(game.coins);
  save.best.runs++;
  save.best.topSpeed = Math.max(save.best.topSpeed, game.peakSpeed);
  if (game.state === 'won') {
    save.best.escapes++;
    save.best.escapeTime = save.best.escapeTime == null ? game.t : Math.min(save.best.escapeTime, game.t);
  }
}

function speedStage(sp) {
  let s = 0;
  for (let i = 0; i < SPEED_STAGES.length; i++) if (sp >= SPEED_STAGES[i].v) s = i + 1;
  return s;
}

// ---- weapons.js ----
// Weapons gained and upgraded through level-ups (Vampire Survivors style). Each weapon has 8 levels;
// damage scales with the attack multiplier (level, modules, station), never with speed. No weapon
// starts an attack during a jump; projectiles already flying keep going on world time.





// Builds cumulative per-level stats: level 1 = base, each step edits a copy of the previous level.
function ladder(base, steps) {
  const out = [{ ...base, text: null }];
  for (const [text, edit] of steps) {
    const s = { ...out[out.length - 1], text };
    edit(s);
    out.push(s);
  }
  return out;
}

const GUN_LEVELS = ladder({ dmg: 1, rate: 1, shots: 1, pierce: 0 }, [
  ['威力 +30%', (s) => { s.dmg = 1.3; }],
  ['弾 +1', (s) => { s.shots = 2; }],
  ['連射 +30%', (s) => { s.rate = 1.3; }],
  ['貫通 +1', (s) => { s.pierce = 1; }],
  ['弾 +1', (s) => { s.shots = 3; }],
  ['威力 +40%', (s) => { s.dmg = 1.8; }],
  ['貫通 +2、連射 +25%', (s) => { s.pierce = 3; s.rate = 1.6; }],
]);

const MISSILE_LEVELS = ladder({ count: 1, dmg: 1, radius: 70, rate: 1 }, [

  ['爆発範囲 +25%', (s) => { s.radius *= 1.25; }],
  ['ミサイル +1', (s) => { s.count++; }],
  ['発射間隔 -20%', (s) => { s.rate *= 1.25; }],
  ['ミサイル +1', (s) => { s.count++; }],
  ['威力 +40%、爆発範囲 +20%', (s) => { s.dmg *= 1.4; s.radius *= 1.2; }],
