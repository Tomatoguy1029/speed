// Marks predicted points that cross a weak spot (hot) and stops at the first enemy that would block.
// With the bounce-preview radar the path continues past the block.
function annotatePrediction(game, pts, seconds) {
  const R = CONFIG.shipRadius;
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    let blocker = null;
    queryGrid(game.grid, p.x - R - MAX_ENEMY_R, p.y - R - MAX_ENEMY_R, p.x + R + MAX_ENEMY_R, p.y + R + MAX_ENEMY_R, (e) => {
      const dx = p.x - e.x, dy = p.y - e.y;
      const rr = e.r + R;
      if (dx * dx + dy * dy > rr * rr) return;
      const crit = isWeakHit(e, p.x, p.y, game.stats.weakArcMult);
      if (crit) p.hot = true;
      if (!canPierce(attackPower(p.sp, game.stats), e, crit)) blocker = e;
    });
    out.push(p);
    if (p.block) break;
    if (blocker) {
      p.block = true;
      if (game.stats.predictBounce && seconds) {
        let nx = p.x - blocker.x, ny = p.y - blocker.y;
        const nd = Math.hypot(nx, ny) || 1;
        nx /= nd; ny /= nd;
        let vx = p.vx, vy = p.vy;
        const vn = vx * nx + vy * ny;
        if (vn < 0) { vx -= 2 * vn * nx; vy -= 2 * vn * ny; }
        vx *= game.stats.bounceKeep; vy *= game.stats.bounceKeep;
        const ghost = { x: blocker.x + nx * (blocker.r + R + 1), y: blocker.y + ny * (blocker.r + R + 1), vx, vy, boostT: 0, fadeT: 0 };
        for (const q of simulateFrom(game, ghost, p.t, seconds)) { q.bounced = true; out.push(q); }
      }
      break;
    }
  }
  return out;
}

// ---- parts.js ----
// Module slots drawn as spaceship parts. Each part has its own silhouette, and the six of them
// assemble into one ship (nose, radar, gun, reactor, wings, engine). Pure canvas drawing.

const TAU_P = Math.PI * 2;

// Where each part sits in the assembled ship, in units (ship points up, center = reactor).
const PART_LAYOUT = {
  armor: { x: 0, y: 0.35, s: 1 },
  booster: { x: 0, y: 1.85, s: 1 },
  gen: { x: 0, y: -0.05, s: 0.95 },
  gun: { x: 1.15, y: -1.0, s: 0.8 },
  radar: { x: -1.15, y: -1.0, s: 0.8 },
  bow: { x: 0, y: -2.2, s: 1 },
};
const DRAW_ORDER = ['armor', 'booster', 'gen', 'gun', 'radar', 'bow'];

function trace(ctx, slot, s) {
  ctx.beginPath();
  switch (slot) {
    case 'bow': // nose cone
      ctx.moveTo(0, -1.15 * s);
      ctx.quadraticCurveTo(0.8 * s, -0.25 * s, 0.62 * s, 0.85 * s);
      ctx.lineTo(-0.62 * s, 0.85 * s);
      ctx.quadraticCurveTo(-0.8 * s, -0.25 * s, 0, -1.15 * s);
      break;
    case 'booster': // twin engine bells
      for (const sx of [-1, 1]) {
        const cx = sx * 0.42 * s;
        ctx.moveTo(cx - 0.26 * s, -0.55 * s);
        ctx.lineTo(cx + 0.26 * s, -0.55 * s);
        ctx.lineTo(cx + 0.4 * s, 0.45 * s);
        ctx.lineTo(cx - 0.4 * s, 0.45 * s);
        ctx.closePath();
      }
      break;
    case 'gun': // turret + barrel
      ctx.rect(-0.16 * s, -1.15 * s, 0.32 * s, 1.15 * s);
      ctx.moveTo(0.48 * s, 0.25 * s);
      ctx.arc(0, 0.25 * s, 0.48 * s, 0, TAU_P);
      break;
    case 'radar': // dish on a mast
      ctx.moveTo(-0.85 * s, -0.55 * s);
      ctx.quadraticCurveTo(0, 0.55 * s, 0.85 * s, -0.55 * s);
      ctx.quadraticCurveTo(0, -0.05 * s, -0.85 * s, -0.55 * s);
      ctx.rect(-0.1 * s, 0, 0.2 * s, 0.75 * s);
      break;
    case 'armor': // a pair of swept wing plates
      for (const sx of [-1, 1]) {
        ctx.moveTo(sx * 0.45 * s, -0.55 * s);
        ctx.lineTo(sx * 1.55 * s, 0.35 * s);
        ctx.lineTo(sx * 1.55 * s, 0.95 * s);
        ctx.lineTo(sx * 0.45 * s, 0.55 * s);
        ctx.closePath();
      }
      break;
    case 'gen': // hexagonal reactor
    default:
      for (let i = 0; i < 6; i++) {
        const a = i * TAU_P / 6 - Math.PI / 2;
        if (i === 0) ctx.moveTo(Math.cos(a) * 0.72 * s, Math.sin(a) * 0.72 * s);
        else ctx.lineTo(Math.cos(a) * 0.72 * s, Math.sin(a) * 0.72 * s);
      }
      ctx.closePath();
  }
}

// One part at the origin. color = rarity color (filled), or null for an empty outline.
function drawPart(ctx, slot, s, color, opts = {}) {
  ctx.save();
  if (color) {
    if (opts.glow) { ctx.shadowColor = color; ctx.shadowBlur = opts.glow; }
    trace(ctx, slot, s);
    ctx.fillStyle = color;
    ctx.fill('nonzero');
    ctx.shadowBlur = 0;
    ctx.lineWidth = Math.max(1, s * 0.09);
    ctx.strokeStyle = 'rgba(10,14,30,0.75)';
    ctx.stroke();
    // small details so the parts read as machinery
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    if (slot === 'bow') { ctx.beginPath(); ctx.ellipse(0, -0.2 * s, 0.18 * s, 0.3 * s, 0, 0, TAU_P); ctx.fill(); }
    if (slot === 'gen') { ctx.beginPath(); ctx.arc(0, 0, 0.3 * s, 0, TAU_P); ctx.fill(); }
    if (slot === 'radar') { ctx.beginPath(); ctx.arc(0, -0.25 * s, 0.11 * s, 0, TAU_P); ctx.fill(); }
    if (slot === 'gun') { ctx.fillRect(-0.16 * s, -1.15 * s, 0.32 * s, 0.16 * s); }
    if (slot === 'booster' && opts.flame !== false) {
      ctx.fillStyle = 'rgba(255,170,80,0.85)';
      for (const sx of [-1, 1]) {
        const cx = sx * 0.42 * s;
        ctx.beginPath(); ctx.moveTo(cx - 0.26 * s, 0.5 * s); ctx.lineTo(cx + 0.26 * s, 0.5 * s); ctx.lineTo(cx, 1.1 * s); ctx.closePath(); ctx.fill();
      }
    }
  } else {
    trace(ctx, slot, s);
    ctx.setLineDash([Math.max(2, s * 0.18), Math.max(2, s * 0.14)]);
    ctx.lineWidth = Math.max(1, s * 0.07);
    ctx.strokeStyle = opts.outline || 'rgba(190,205,240,0.35)';
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

// The whole ship. colorOf(slot) -> rarity color or null (empty). highlight: slot to pulse.
function drawShipAssembly(ctx, cx, cy, unit, colorOf, highlight, t = 0) {
  ctx.save();
  ctx.translate(cx, cy);
  // chassis spine that holds the parts
  ctx.strokeStyle = 'rgba(160,180,230,0.25)';
  ctx.lineWidth = Math.max(1, unit * 0.12);
  ctx.beginPath(); ctx.moveTo(0, -1.4 * unit); ctx.lineTo(0, 1.3 * unit); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-1.15 * unit, -0.75 * unit); ctx.lineTo(1.15 * unit, -0.75 * unit); ctx.stroke();
  for (const slot of DRAW_ORDER) {
    const L = PART_LAYOUT[slot];
    ctx.save();
    ctx.translate(L.x * unit, L.y * unit);
    const color = colorOf(slot);
    drawPart(ctx, slot, L.s * unit, color, { glow: color ? unit * 0.4 : 0 });
    if (slot === highlight) {
      const pulse = 0.5 + 0.5 * Math.sin(t * 6);
      drawPart(ctx, slot, L.s * unit * (1.12 + 0.06 * pulse), null, { outline: `rgba(255,255,255,${0.5 + 0.5 * pulse})` });
    }
    ctx.restore();
  }
  ctx.restore();
}

// ---- render.js ----








const STAR_TILE = 1600;
const MONO = 'ui-monospace, Menlo, monospace';

function createRenderer(canvas) {
  const ctx = canvas.getContext('2d');
  const rng = makeRng(7);
  const layers = [0.06, 0.16, 0.35].map((p, i) => ({
    p,
    stars: Array.from({ length: 110 - i * 25 }, () => ({ x: rng() * STAR_TILE, y: rng() * STAR_TILE, s: 0.6 + rng() * (0.6 + i * 0.6), a: 0.25 + rng() * 0.6 })),
  }));
  return { canvas, ctx, layers, cam: { x: 0, y: 0, zoom: 1, ready: false }, W: 0, H: 0, dpr: 1, shake: 0, flash: 0, vapor: 0, zoomPunch: 0, stageFlash: null, hurt: 0 };
}

function resizeRenderer(r) {
  r.dpr = Math.min(window.devicePixelRatio || 1, 2);
  r.W = window.innerWidth;
  r.H = window.innerHeight;
  r.canvas.width = Math.floor(r.W * r.dpr);
  r.canvas.height = Math.floor(r.H * r.dpr);
}

function worldToScreen(r, x, y) {
  return { x: (x - r.cam.x) * r.cam.zoom + r.W / 2, y: (y - r.cam.y) * r.cam.zoom + r.H / 2 };
}

function screenToWorld(r, x, y) {
  return { x: (x - r.W / 2) / r.cam.zoom + r.cam.x, y: (y - r.H / 2) / r.cam.zoom + r.cam.y };
}

// Zoom is tied to the ship's max speed so the view only widens as the build gets faster,
// instead of pumping in and out with every dash.
function targetZoom(game, W, H) {
  const f = Math.pow(CONFIG.zoomRefSpeed / Math.max(CONFIG.zoomRefSpeed, game.stats.maxSpeed), CONFIG.zoomExp);
  return (Math.min(W, H) / CONFIG.baseView) * clamp(f, CONFIG.zoomMin, 1);
}

function updateCamera(r, game, dt) {
  const sh = game.ship;
  if (game.draw && r.cam.ready) {
    // hold the view still while a path is drawn and traced, so it is followed exactly where it was drawn
    game.viewRadius = Math.hypot(r.W, r.H) / 2 / r.cam.zoom;
    return;
  }
  const zoomT = targetZoom(game, r.W, r.H);
  // look ahead along the velocity, but keep the ship well inside the screen at any speed
  let ox = sh.vx * CONFIG.lookAhead, oy = sh.vy * CONFIG.lookAhead;
  const maxOff = (0.3 * Math.min(r.W, r.H)) / 2 / zoomT;
  const off = Math.hypot(ox, oy);
  if (off > maxOff) { ox *= maxOff / off; oy *= maxOff / off; }
  const tx = sh.x + ox;
  const ty = sh.y + oy;
  const cam = r.cam;
  if (!cam.ready) { cam.x = tx; cam.y = ty; cam.zoom = zoomT; cam.ready = true; }
  const kp = 1 - Math.exp(-7 * dt);
  const kz = 1 - Math.exp(-2.2 * dt);
  cam.x += (tx - cam.x) * kp;
  cam.y += (ty - cam.y) * kp;
  cam.zoom += (zoomT - cam.zoom) * kz;
  if (r.zoomPunch > 0) { cam.zoom *= 1 + r.zoomPunch; r.zoomPunch = Math.max(0, r.zoomPunch - dt * 0.5); }
  game.viewRadius = Math.hypot(r.W, r.H) / 2 / cam.zoom;
}

function handleEvents(r, game) {
  for (const ev of game.events) {
    if (ev.type === 'hurt') { r.shake = Math.max(r.shake, 14); r.hurt = 0.35; }
    else if (ev.type === 'kill' && ev.r > 25) r.shake = Math.max(r.shake, 8);
    else if (ev.type === 'kill' && ev.cause === 'ram') r.shake = Math.max(r.shake, 5);
    else if (ev.type === 'bounce') r.shake = Math.max(r.shake, 10);
    else if (ev.type === 'crash') r.shake = Math.max(r.shake, 16);
    else if (ev.type === 'stage') { r.stageFlash = { text: ev.name, kms: (ev.speed * CONFIG.speedToKms).toFixed(1), life: 1.4, max: 1.4 }; r.flash = Math.max(r.flash, 0.18); }
    else if (ev.type === 'sonic') { r.flash = 0.8; r.shake = Math.max(r.shake, 34); r.zoomPunch = 0.14; }
    else if (ev.type === 'barrier') r.vapor = 0.6;
    else if (ev.type === 'end' && ev.state === 'won') r.flash = 1;
  }
}

function render(r, game, dt, pointer) {
  const { ctx } = r;
  handleEvents(r, game);
  updateCamera(r, game, dt);
  ctx.setTransform(r.dpr, 0, 0, r.dpr, 0, 0);
  drawBackground(r, game);

  ctx.save();
  let sx = 0, sy = 0;
  if (r.shake > 0) {
    sx = (Math.random() - 0.5) * r.shake;
    sy = (Math.random() - 0.5) * r.shake;
    r.shake = Math.max(0, r.shake - dt * 60);
  }
  ctx.translate(r.W / 2 + sx, r.H / 2 + sy);
  ctx.scale(r.cam.zoom, r.cam.zoom);
  ctx.translate(-r.cam.x, -r.cam.y);
  drawZones(r);
  drawDust(r, game);
  drawSpecks(r);
  drawBodies(r, game);
  drawGems(r, game);
  drawCoins(r, game);
  drawCapsules(r, game);
  drawMines(r, game);
  drawEnemies(r, game);
  drawEnemyBullets(r, game);
  drawPathUi(r, game);
  drawFriendly(r, game);
  drawPrediction(r, game);
  drawTrail(r, game);
  drawVapor(r, game, dt);
  drawShip(r, game);
  drawFx(r, game);
  ctx.restore();
  drawSpeedLines(r, game);

  drawChargeUi(r, game, pointer);
  drawCapsuleArrows(r, game);
  drawDrawingHud(r, game);
  drawOverlays(r, game, dt);
  drawHud(r, game);
  drawMinimap(r, game);
  drawBanner(r, dt);
  drawStageFlash(r, dt);
  if (r.flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${Math.min(0.85, r.flash)})`;
    ctx.fillRect(0, 0, r.W, r.H);
    r.flash = Math.max(0, r.flash - dt * 2.2);
  }
}

// Conical shock layers wrapped around the ship near max speed.
function drawVapor(r, game, dt) {
  const sh = game.ship;
  const sp = Math.hypot(sh.vx, sh.vy);
  const ratio = sp / game.stats.maxSpeed;
  if (r.vapor > 0) r.vapor -= dt;
  const k = Math.max(r.vapor > 0 ? 1 : 0, (ratio - 0.88) / 0.12);
  if (k <= 0 || sp < 1) return;
  const { ctx } = r;
  const z = r.cam.zoom;
  const ux = sh.vx / sp, uy = sh.vy / sp;
  const back = Math.atan2(-uy, -ux);
  ctx.save();
  ctx.translate(sh.x, sh.y);
  ctx.lineCap = 'round';
  const unit = Math.max(1, 0.6 / z);
  for (let i = 0; i < 4; i++) {
    const rad = (26 + i * 16) * unit;
    const spread = 1.25 - i * 0.18;
    ctx.globalAlpha = Math.min(1, k) * (0.5 - i * 0.1) * (0.75 + 0.25 * Math.random());
    ctx.strokeStyle = '#eaf6ff';
    ctx.lineWidth = (3 - i * 0.5) * unit;
    ctx.beginPath();
    ctx.arc(-ux * (i * 10 - 14) * unit, -uy * (i * 10 - 14) * unit, rad, back - spread, back + spread);
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawSpeedLines(r, game) {
  const sh = game.ship;
  const sp = Math.hypot(sh.vx, sh.vy);
  const k = (sp / CONFIG.escapeSpeed - 0.42) / 0.5;
  if (k <= 0) return;
  const { ctx, W, H } = r;
  const cx = W / 2, cy = H / 2;
  const R0 = Math.hypot(W, H) / 2;
  ctx.strokeStyle = '#dff3ff';
  ctx.lineWidth = 1.5;
  const n = Math.round(18 + 40 * Math.min(1, k));
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU;
    const r1 = R0 * (0.62 + Math.random() * 0.2 * (1 - Math.min(1, k)));
    ctx.globalAlpha = Math.min(0.5, 0.15 + 0.35 * k) * Math.random();
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    ctx.lineTo(cx + Math.cos(a) * R0, cy + Math.sin(a) * R0);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawStageFlash(r, dt) {
  const f = r.stageFlash;
  if (!f) return;
  f.life -= dt;
  if (f.life <= 0) { r.stageFlash = null; return; }
  const { ctx, W, H } = r;
  const t = 1 - f.life / f.max;
  ctx.globalAlpha = Math.min(1, f.life / 0.4);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#bff3ff';
  ctx.font = `italic 800 ${Math.round(30 + 10 * (1 - t))}px ${MONO}`;
  ctx.fillText(f.text, W / 2, H * 0.68);
  ctx.font = `13px ${MONO}`;
  ctx.fillStyle = '#8fd8ff';
  ctx.fillText(`${f.kms} km/s`, W / 2, H * 0.68 + 20);
  const sweep = W * (t * 1.4 - 0.2);
  const g = ctx.createLinearGradient(sweep - 160, 0, sweep + 160, 0);
  g.addColorStop(0, 'rgba(191,243,255,0)');
  g.addColorStop(0.5, 'rgba(191,243,255,0.5)');
  g.addColorStop(1, 'rgba(191,243,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, H * 0.68 - 36, W, 2);
  ctx.globalAlpha = 1;
}

function drawGems(r, game) {
  const { ctx } = r;
  const s = Math.max(5, 3 / r.cam.zoom);
  ctx.fillStyle = '#6dffb0';
  for (const g of game.gems) {
    if (!onScreen(r, g.x, g.y, 20)) continue;
    const k = g.v > 8 ? 1.6 : g.v > 3 ? 1.25 : 1;
    ctx.beginPath();
    ctx.moveTo(g.x, g.y - s * k); ctx.lineTo(g.x + s * 0.7 * k, g.y); ctx.lineTo(g.x, g.y + s * k); ctx.lineTo(g.x - s * 0.7 * k, g.y);
    ctx.closePath(); ctx.fill();
  }
}

function capsuleColor(c) {
  return c.kind === 'core' ? '#ffd24a' : RARITIES[c.mod.r].color;
}

function drawCoins(r, game) {
  const { ctx } = r;
  const s = Math.max(6, 3.5 / r.cam.zoom);
  for (const c of game.coinDrops) {
    if (!onScreen(r, c.x, c.y, 20)) continue;
    ctx.fillStyle = '#ffd24a';
    ctx.beginPath(); ctx.arc(c.x, c.y, s, 0, TAU); ctx.fill();
    ctx.fillStyle = '#a07a10';
    ctx.fillRect(c.x - s * 0.15, c.y - s * 0.55, s * 0.3, s * 1.1);
  }
}

function drawCapsules(r, game) {
  const { ctx } = r;
  const z = r.cam.zoom;
  for (const c of game.capsules) {
    if (!onScreen(r, c.x, c.y, 200)) continue;
    const col = capsuleColor(c);
    const S = (c.kind === 'core' ? 30 : 20) * Math.max(1, 0.7 / z);
    const pulse = (game.t * 1.5 + c.x * 0.001) % 1;
    ctx.globalAlpha = 1 - pulse;
    ctx.strokeStyle = col;
    ctx.lineWidth = 2 / z;
    ctx.beginPath(); ctx.arc(c.x, c.y, S * (1.2 + pulse * 2.5), 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.translate(c.x, c.y + Math.sin(game.t * 2 + c.x) * S * 0.12);
    if (c.kind === 'core') {
      ctx.rotate(game.t * 1.2);
      ctx.shadowColor = col; ctx.shadowBlur = 20;
      ctx.fillStyle = col;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) { const a = i * TAU / 10, k = i % 2 ? 0.45 : 1; ctx.lineTo(Math.cos(a) * S * k, Math.sin(a) * S * k); }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, 0, S * 0.22, 0, TAU); ctx.fill();
    } else {
      // the module shows up as the ship part it is (nose, engine, gun, radar, wings, reactor)
      drawPart(ctx, c.mod.slot, S * 0.95, col, { glow: 22 });
    }
    ctx.restore();
  }
}

// Edge-of-screen pointers to capsules that are off screen.
function drawCapsuleArrows(r, game) {
  const { ctx, W, H } = r;
  const sh = game.ship;
  const m = 34;
  for (const c of game.capsules) {
    const d = Math.hypot(c.x - sh.x, c.y - sh.y);
    if (d > 5000 || onScreen(r, c.x, c.y, 0)) continue;
    const p = worldToScreen(r, c.x, c.y);
    const ang = Math.atan2(p.y - H / 2, p.x - W / 2);
    const k = Math.min((W / 2 - m) / Math.abs(Math.cos(ang) || 1e-6), (H / 2 - m) / Math.abs(Math.sin(ang) || 1e-6));
    const x = W / 2 + Math.cos(ang) * k, y = H / 2 + Math.sin(ang) * k;
    ctx.save();
    ctx.translate(x, y); ctx.rotate(ang);
    ctx.globalAlpha = 0.55 + 0.45 * (1 - d / 5000);
    ctx.fillStyle = capsuleColor(c);
    const s = c.kind === 'core' ? 13 : 9;
    ctx.beginPath(); ctx.moveTo(s, 0); ctx.lineTo(-s * 0.7, s * 0.7); ctx.lineTo(-s * 0.7, -s * 0.7); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawMines(r, game) {
  const { ctx } = r;
  const z = r.cam.zoom;
  for (const m of game.mines) {
    if (!onScreen(r, m.x, m.y, 30)) continue;
    ctx.fillStyle = m.armed > 0 ? '#7a5040' : (Math.floor(game.t * 6) % 2 ? '#ff7b54' : '#ffb08a');
    ctx.beginPath(); ctx.arc(m.x, m.y, 7 / Math.sqrt(z), 0, TAU); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,207,107,0.5)';
  for (const m of game.marks) {
    if (!onScreen(r, m.x, m.y, 30)) continue;
    ctx.beginPath(); ctx.arc(m.x, m.y, (4 + 6 * (1 - m.t / 0.55)) / Math.sqrt(z), 0, TAU); ctx.fill();
  }
}

function drawFriendly(r, game) {
  const { ctx } = r;
  const z = r.cam.zoom;
  for (const b of game.fbullets) {
    if (!onScreen(r, b.x, b.y, 40)) continue;
    ctx.fillStyle = b.color;
    ctx.globalAlpha = b.kind === 'corpse' ? 0.85 : 1;
    const s = b.kind === 'corpse' ? b.r * 0.6 : b.r / Math.sqrt(z);
    ctx.beginPath(); ctx.arc(b.x, b.y, s, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawOverlays(r, game, dt) {
  const { ctx, W, H } = r;
  if (r.hurt > 0) {
    r.hurt -= dt;
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
    g.addColorStop(0, 'rgba(255,40,40,0)');
    g.addColorStop(1, `rgba(255,40,40,${0.5 * r.hurt / 0.35})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  const lowHp = game.ship.hp / game.stats.maxHp;
  if (lowHp < 0.3 && game.state === 'play') {
    const a = (0.3 - lowHp) * (0.6 + 0.4 * Math.sin(game.t * 8));
    ctx.strokeStyle = `rgba(255,50,50,${a})`;
    ctx.lineWidth = 16;
    ctx.strokeRect(0, 0, W, H);
  }
}

function drawBanner(r, dt) {
  const b = r.banner;
  if (!b) return;
  b.life -= dt;
  if (b.life <= 0) { r.banner = null; return; }
  const { ctx, W, H } = r;
  const t = b.max - b.life;
  const a = Math.min(1, t / 0.25, b.life / 0.6);
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  ctx.font = `800 ${Math.min(54, W / 10)}px "Hiragino Sans", "Noto Sans JP", sans-serif`;
  ctx.fillText(b.text, W / 2, H * 0.3);
  if (b.sub) {
    ctx.font = `16px "Hiragino Sans", "Noto Sans JP", sans-serif`;
    ctx.fillStyle = '#b8c6ea';
    ctx.fillText(b.sub, W / 2, H * 0.3 + 30);
  }
  ctx.globalAlpha = 1;
}

function drawZones(r) {
  const { ctx } = r;
  const z = r.cam.zoom;
  const g = ctx.createRadialGradient(0, 0, CONFIG.planetRadius, 0, 0, CONFIG.zoneInner);
  g.addColorStop(0, 'rgba(255,70,50,0.16)');
  g.addColorStop(1, 'rgba(255,70,50,0.02)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.zoneInner, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(150,70,255,0.07)';
  ctx.beginPath();
  ctx.arc(0, 0, CONFIG.fieldRadius, 0, TAU);
  ctx.arc(0, 0, CONFIG.zoneOuter, 0, TAU, true);
  ctx.fill();
  ctx.lineWidth = 2 / z;
  ctx.setLineDash([30 / z, 24 / z]);
  ctx.strokeStyle = 'rgba(255,110,90,0.35)';
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.zoneInner, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(170,120,255,0.35)';
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.zoneOuter, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.lineWidth = 6 / z;
  ctx.strokeStyle = 'rgba(190,120,255,0.8)';
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.fieldRadius, 0, TAU); ctx.stroke();
}

function drawDust(r, game) {
  const { ctx } = r;
  for (const d of game.field.dust) {
    if (!onScreen(r, d.x, d.y, d.r)) continue;
    const g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r);
    g.addColorStop(0, 'rgba(170,130,210,0.20)');
    g.addColorStop(0.7, 'rgba(140,100,190,0.10)');
    g.addColorStop(1, 'rgba(140,100,190,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill();
  }
}

function onScreen(r, x, y, rad) {
  const halfW = r.W / 2 / r.cam.zoom + rad, halfH = r.H / 2 / r.cam.zoom + rad;
  return Math.abs(x - r.cam.x) < halfW && Math.abs(y - r.cam.y) < halfH;
}

function drawBodies(r, game) {
  const { ctx } = r;
  const p = game.field.planet;
  if (onScreen(r, p.x, p.y, p.r * 1.6)) {
    const halo = ctx.createRadialGradient(0, 0, p.r * 0.9, 0, 0, p.r * 1.6);
    halo.addColorStop(0, 'rgba(90,160,255,0.45)');
    halo.addColorStop(1, 'rgba(90,160,255,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(0, 0, p.r * 1.6, 0, TAU); ctx.fill();
    const body = ctx.createRadialGradient(-p.r * 0.35, -p.r * 0.35, p.r * 0.1, 0, 0, p.r);
    body.addColorStop(0, '#6a8cff');
    body.addColorStop(0.6, '#2b3d8f');
    body.addColorStop(1, '#0d1238');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(0, 0, p.r, 0, TAU); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, p.r, 0, TAU); ctx.clip();
    ctx.strokeStyle = 'rgba(160,190,255,0.12)';
    ctx.lineWidth = p.r * 0.08;
    for (let i = -3; i <= 3; i++) {
      ctx.beginPath(); ctx.ellipse(0, i * p.r * 0.25, p.r * 1.1, p.r * 0.06, 0.15, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  }
  for (const m of game.field.moons) {
    if (!onScreen(r, m.x, m.y, m.r * 3)) continue;
    const halo = ctx.createRadialGradient(m.x, m.y, m.r, m.x, m.y, m.r * 3);
    halo.addColorStop(0, 'rgba(200,170,120,0.12)');
    halo.addColorStop(1, 'rgba(200,170,120,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r * 3, 0, TAU); ctx.fill();
    const body = ctx.createRadialGradient(m.x - m.r * 0.3, m.y - m.r * 0.3, m.r * 0.1, m.x, m.y, m.r);
    body.addColorStop(0, '#b9a58a');
    body.addColorStop(1, '#4a3d33');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    for (let k = 0; k < 4; k++) {
      const a = k * 1.9 + m.orbit, d = m.r * (0.2 + 0.15 * k);
      ctx.beginPath(); ctx.arc(m.x + Math.cos(a) * d, m.y + Math.sin(a) * d, m.r * 0.16, 0, TAU); ctx.fill();
    }
  }
}

// Draw scheme: while charging, show how far a path could reach.
function drawReach(r, game) {
  const sh = game.ship;
  const reach = drawBudget(game, sh.gauge);
  const { ctx } = r;
  const z = r.cam.zoom;
  ctx.strokeStyle = sh.gauge >= 1 ? 'rgba(255,228,107,0.7)' : 'rgba(159,232,255,0.55)';
  ctx.lineWidth = 2 / z;
  ctx.setLineDash([14 / z, 10 / z]);
  ctx.beginPath(); ctx.arc(sh.x, sh.y, reach, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
}

function drawPathUi(r, game) {
  const d = game.draw;
  if (!d) return;
  const { ctx } = r;
  const z = r.cam.zoom;
  const sh = game.ship;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (d.phase === 'run') {
    ctx.strokeStyle = 'rgba(159,232,255,0.14)';
    ctx.lineWidth = waveRadius(game) * 2;
    ctx.beginPath(); ctx.moveTo(sh.x, sh.y);
    for (let i = d.seg + 1; i < d.path.length; i++) ctx.lineTo(d.path[i].x, d.path[i].y);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(159,232,255,0.4)';
    ctx.lineWidth = 4 / z;
    ctx.setLineDash([10 / z, 8 / z]);
    ctx.beginPath(); ctx.moveTo(sh.x, sh.y);
    for (let i = d.seg + 1; i < d.path.length; i++) ctx.lineTo(d.path[i].x, d.path[i].y);
    ctx.stroke();
    ctx.setLineDash([]);
    return;
  }
  const pts = d.points;
  const line = () => { ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (const p of pts) ctx.lineTo(p.x, p.y); };
  if (pts.length > 1) {
    // the band is the real hit width of the trace
    line(); ctx.strokeStyle = 'rgba(95,216,255,0.16)'; ctx.lineWidth = waveRadius(game) * 2; ctx.stroke();
    line(); ctx.strokeStyle = 'rgba(159,232,255,0.35)'; ctx.lineWidth = 2 / z; ctx.setLineDash([]);
    ctx.stroke();
    line(); ctx.strokeStyle = '#d6f6ff'; ctx.lineWidth = 3.5 / z; ctx.stroke();
  }
  const last = pts[pts.length - 1];
  if (d.cursor && d.used < d.budget - 0.5) {
    ctx.strokeStyle = 'rgba(214,246,255,0.3)';
    ctx.lineWidth = 2 / z;
    ctx.setLineDash([6 / z, 8 / z]);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(d.cursor.x, d.cursor.y); ctx.stroke();
    ctx.setLineDash([]);
  }
  const pv = previewPath(game);
  // enemies the band will cut: white ring, yellow if through the weak spot
  for (const [e, t] of pv.targets) {
    // white/yellow: the ship body cuts it; cyan: only the wave reaches it
    ctx.strokeStyle = t.crit ? '#ffe46b' : t.body ? 'rgba(255,255,255,0.9)' : 'rgba(120,225,255,0.85)';
    ctx.lineWidth = 3 / z;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 7 / z, 0, TAU); ctx.stroke();
  }
  ctx.fillStyle = '#ffe46b';
  for (const p of pv.samples) if (p.hot) { ctx.beginPath(); ctx.arc(p.x, p.y, 6 / z, 0, TAU); ctx.fill(); }
  if (pv.block) {
    const k = 12 / z, b = pv.block;
    ctx.strokeStyle = '#ff4d4d'; ctx.lineWidth = 4 / z;
    ctx.beginPath(); ctx.moveTo(b.x - k, b.y - k); ctx.lineTo(b.x + k, b.y + k); ctx.moveTo(b.x + k, b.y - k); ctx.lineTo(b.x - k, b.y + k); ctx.stroke();
  }
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(last.x, last.y, 5 / z, 0, TAU); ctx.fill();
}

// Screen-space: slow-time vignette and the remaining length / time while drawing.
function drawDrawingHud(r, game) {
  const d = game.draw;
  if (!d || d.phase !== 'draw') return;
  const { ctx, W, H } = r;
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  g.addColorStop(0, 'rgba(40,80,200,0)');
  g.addColorStop(1, 'rgba(40,80,200,0.35)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  const bw = Math.min(320, W * 0.5), x = W / 2 - bw / 2, y = H * 0.72;
  const bar = (yy, frac, color, label) => {
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(x, yy, bw, 6);
    ctx.fillStyle = color; ctx.fillRect(x, yy, bw * Math.max(0, Math.min(1, frac)), 6);
    ctx.fillStyle = '#b8c6ea'; ctx.font = `11px ${MONO}`; ctx.textAlign = 'right'; ctx.fillText(label, x - 8, yy + 6);
  };
  bar(y, 1 - d.used / d.budget, '#9fe8ff', '長さ');
  bar(y + 14, d.timeLeft / CONFIG.drawTime, '#ffd24a', '時間');
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e8f6ff';
  ctx.font = '14px "Hiragino Sans", "Noto Sans JP", sans-serif';
  ctx.fillText(d.started ? 'カーソルで軌跡を描く — Space／クリックで駆け抜ける' : 'クリック（または Space）で描き始める', W / 2, y - 12);
}

function drawPrediction(r, game) {
  const sh = game.ship;
  if (!sh.charging) return;
  if (game.scheme === 'draw') { drawReach(r, game); return; }
  let ax = sh.aimX, ay = sh.aimY;
  if (Math.hypot(ax, ay) < CONFIG.minDrag) { ax = sh.vx; ay = sh.vy; }
  if (Math.hypot(ax, ay) < 1) return;
  const pts = annotatePrediction(game, predictPath(game, ax, ay, sh.gauge, game.stats.predictTime), game.stats.predictTime);
  const { ctx } = r;
  const dot = 3.2 / r.cam.zoom;
  for (let i = 2; i < pts.length; i += 3) {
    const p = pts[i];
    ctx.globalAlpha = 0.85 * (1 - i / pts.length) + 0.1;
    ctx.fillStyle = p.hot ? '#ffe46b' : p.bounced ? '#c9a6ff' : '#9fe8ff';
    const s = p.hot ? dot * 2 : dot;
    ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const end = pts[pts.length - 1];
  if (end && end.block) {
    const k = 10 / r.cam.zoom;
    ctx.strokeStyle = '#ff4d4d';
    ctx.lineWidth = 3 / r.cam.zoom;
    ctx.beginPath();
    ctx.moveTo(end.x - k, end.y - k); ctx.lineTo(end.x + k, end.y + k);
    ctx.moveTo(end.x + k, end.y - k); ctx.lineTo(end.x - k, end.y + k);
    ctx.stroke();
  }
}

function shapePath(ctx, shape, R) {
  ctx.beginPath();
  if (shape === 'hex') {
    for (let i = 0; i < 6; i++) { const a = i * TAU / 6; ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R); }
    ctx.closePath();
  } else if (shape === 'dart') {
    ctx.moveTo(R * 1.2, 0); ctx.lineTo(-R * 0.8, R * 0.8); ctx.lineTo(-R * 0.4, 0); ctx.lineTo(-R * 0.8, -R * 0.8); ctx.closePath();
  } else if (shape === 'diamond') {
    ctx.moveTo(R, 0); ctx.lineTo(0, R * 0.8); ctx.lineTo(-R, 0); ctx.lineTo(0, -R * 0.8); ctx.closePath();
  } else if (shape === 'blob') {
    for (let i = 0; i < 10; i++) { const a = i * TAU / 10, k = i % 2 ? 0.82 : 1; ctx.lineTo(Math.cos(a) * R * k, Math.sin(a) * R * k); }
    ctx.closePath();
  } else if (shape === 'ship') {
    ctx.moveTo(R * 1.3, 0); ctx.lineTo(R * 0.3, R * 0.55); ctx.lineTo(-R, R * 0.6); ctx.lineTo(-R * 0.8, 0); ctx.lineTo(-R, -R * 0.6); ctx.lineTo(R * 0.3, -R * 0.55); ctx.closePath();
  } else if (shape === 'rock') {
    for (let i = 0; i < 8; i++) { const a = i * TAU / 8, k = 0.8 + ((i * 37) % 5) * 0.06; ctx.lineTo(Math.cos(a) * R * k, Math.sin(a) * R * k); }
    ctx.closePath();
  } else {
    ctx.arc(0, 0, R, 0, TAU);
  }
}

function drawEnemies(r, game) {
  const { ctx } = r;
  const z = r.cam.zoom;
  const sp = Math.hypot(game.ship.vx, game.ship.vy);
  const atk = attackPower(sp, game.stats);
  const arcMult = game.stats.weakArcMult;
  for (const e of game.enemies) {
    if (!onScreen(r, e.x, e.y, e.r + 220)) continue;
    const R = e.r;
    ctx.save();
    ctx.translate(e.x, e.y);
    if (e.T.auraR) {
      const g = ctx.createRadialGradient(0, 0, R, 0, 0, e.T.auraR);
      g.addColorStop(0, 'rgba(199,125,255,0.22)');
      g.addColorStop(1, 'rgba(199,125,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, e.T.auraR, 0, TAU); ctx.fill();
    }
    if (e.state === 'windup') {
      ctx.strokeStyle = 'rgba(255,90,60,0.7)';
      ctx.lineWidth = 3 / z;
      ctx.setLineDash([12 / z, 8 / z]);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(e.facing) * 500, Math.sin(e.facing) * 500); ctx.stroke();
      ctx.setLineDash([]);
    }
    if (e.charge > 0) {
      ctx.fillStyle = `rgba(255,80,80,${0.25 + 0.5 * e.charge})`;
      ctx.beginPath(); ctx.arc(Math.cos(e.facing) * R, Math.sin(e.facing) * R, (4 + 8 * e.charge) / Math.sqrt(z), 0, TAU); ctx.fill();
    }
    const pierce = atk >= e.armor;
    const critOnly = !pierce && atk >= e.armor * CRIT_ARMOR;
    // body
    ctx.save();
    ctx.rotate(e.facing);
    shapePath(ctx, e.T.shape, R);
    ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.T.color;
    ctx.globalAlpha = pierce ? 1 : 0.8;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.lineWidth = Math.max(1.5 / z, R * 0.08);
    ctx.strokeStyle = e.elite ? '#ffcf4a' : pierce ? 'rgba(255,255,255,0.85)' : 'rgba(40,0,0,0.6)';
    ctx.stroke();
    // eye / nose shows facing
    ctx.fillStyle = '#0b0f1e';
    ctx.beginPath(); ctx.arc(R * 0.45, 0, R * 0.2, 0, TAU); ctx.fill();
    ctx.restore();
    // weak spot
    if (e.weakArc) {
      const wa = e.facing + e.weakDir, half = Math.min(Math.PI, e.weakArc * arcMult);
      const lw = Math.max(4 / z, R * 0.32);
      ctx.strokeStyle = '#ffe46b';
      ctx.lineWidth = lw;
      ctx.beginPath(); ctx.arc(0, 0, R + lw * 0.3, wa - half, wa + half); ctx.stroke();
      if (e.weakDir2 !== undefined) {
        const wb = e.facing + e.weakDir2;
        ctx.beginPath(); ctx.arc(0, 0, R + lw * 0.3, wb - half, wb + half); ctx.stroke();
      }
    }
    // cannot pierce: red ring (orange dashed = only through the weak spot)
    if (!pierce) {
      ctx.lineWidth = 3 / z;
      ctx.strokeStyle = critOnly ? '#ff9f40' : '#ff3b3b';
      if (critOnly) ctx.setLineDash([8 / z, 6 / z]);
      ctx.beginPath(); ctx.arc(0, 0, R + 9 / z + R * 0.2, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    }
    if (e.hp < e.maxHp) {
      const w = Math.max(R * 2, 30 / z), h = 4 / z;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(-w / 2, -R - 16 / z, w, h);
      ctx.fillStyle = '#ff6b5a';
      ctx.fillRect(-w / 2, -R - 16 / z, w * Math.max(0, e.hp / e.maxHp), h);
    }
    ctx.restore();
  }
}

function drawEnemyBullets(r, game) {
  const { ctx } = r;
  const z = r.cam.zoom;
  for (const b of game.ebullets) {
    if (!onScreen(r, b.x, b.y, 40)) continue;
    const s = b.r / Math.sqrt(z);
    if (b.kind === 'missile') {
      const a = Math.atan2(b.vy, b.vx);
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(a);
      ctx.fillStyle = '#ffb36b';
      ctx.beginPath(); ctx.moveTo(s * 1.6, 0); ctx.lineTo(-s, s * 0.7); ctx.lineTo(-s, -s * 0.7); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,200,120,0.5)';
      ctx.beginPath(); ctx.arc(-s * 1.6, 0, s * 0.6, 0, TAU); ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = '#ff5a6e';
      ctx.beginPath(); ctx.arc(b.x, b.y, s, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffd0d6';
      ctx.beginPath(); ctx.arc(b.x, b.y, s * 0.45, 0, TAU); ctx.fill();
    }
  }
}

function drawFx(r, game) {
  const { ctx } = r;
  const z = r.cam.zoom;
  const ps = 1 / Math.sqrt(z);
  for (const p of game.fx.particles) {
    ctx.globalAlpha = Math.min(1, p.life / 0.4);
    ctx.fillStyle = p.color;
    const s = p.size * ps;
    ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
  }
  for (const g of game.fx.rings) {
    const k = 1 - g.life / g.max;
    ctx.globalAlpha = Math.max(0, g.life / g.max);
    ctx.strokeStyle = g.color;
    ctx.lineWidth = (10 * (1 - k) + 2) / z;
    ctx.beginPath(); ctx.arc(g.x, g.y, g.radius * (0.2 + 0.8 * Math.sqrt(k)), 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const t of game.fx.texts) {
    ctx.globalAlpha = Math.min(1, t.life / 0.3);
    ctx.fillStyle = t.color;
    ctx.font = `800 ${Math.round((t.size || 16) / z)}px ${MONO}`;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

function drawMinimap(r, game) {
  const { ctx, W, H } = r;
  const R = Math.min(90, Math.min(W, H) * 0.12);
  const cx = W - R - 16, cy = R + 16;
  const k = R / (CONFIG.fieldRadius + 300);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = 'rgba(8,12,28,0.78)';
  ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(150,70,255,0.16)';
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.fieldRadius * k, 0, TAU); ctx.arc(0, 0, CONFIG.zoneOuter * k, 0, TAU, true); ctx.fill();
  ctx.fillStyle = 'rgba(255,70,50,0.18)';
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.zoneInner * k, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(190,120,255,0.8)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.fieldRadius * k, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#4a68d8';
  ctx.beginPath(); ctx.arc(0, 0, Math.max(3, CONFIG.planetRadius * k), 0, TAU); ctx.fill();
  ctx.fillStyle = '#a08a6c';
  for (const m of game.field.moons) { ctx.beginPath(); ctx.arc(m.x * k, m.y * k, 2.2, 0, TAU); ctx.fill(); }
  for (const e of game.enemies) {
    if (e.type !== 'battleship' && !e.elite) continue;
    ctx.fillStyle = e.type === 'battleship' ? '#ff5a5a' : '#ffcf4a';
    ctx.fillRect(e.x * k - 2, e.y * k - 2, 4, 4);
  }
  for (const c of game.capsules) {
    ctx.fillStyle = c.kind === 'core' ? '#ffd24a' : RARITIES[c.mod.r].color;
    const s2 = c.kind === 'core' ? 3.5 : 2.5;
    ctx.beginPath(); ctx.moveTo(c.x * k, c.y * k - s2); ctx.lineTo(c.x * k + s2, c.y * k); ctx.lineTo(c.x * k, c.y * k + s2); ctx.lineTo(c.x * k - s2, c.y * k); ctx.closePath(); ctx.fill();
  }
  const sh = game.ship;
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(sh.x * k, sh.y * k, game.viewRadius * k, 0, TAU); ctx.stroke();
  ctx.strokeStyle = '#5fd8ff';
  ctx.beginPath(); ctx.moveTo(sh.x * k, sh.y * k); ctx.lineTo((sh.x + sh.vx * 1.5) * k, (sh.y + sh.vy * 1.5) * k); ctx.stroke();
  ctx.fillStyle = '#e8f6ff';
  ctx.beginPath(); ctx.arc(sh.x * k, sh.y * k, 3, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawBackground(r, game) {
  const { ctx, W, H } = r;
  ctx.fillStyle = '#04050b';
  ctx.fillRect(0, 0, W, H);
  const sh = game.ship;
  const vx = sh.vx, vy = sh.vy;
  for (const L of r.layers) {
    const ox = ((-r.cam.x * L.p) % STAR_TILE + STAR_TILE) % STAR_TILE;
    const oy = ((-r.cam.y * L.p) % STAR_TILE + STAR_TILE) % STAR_TILE;
    const stretch = Math.min(260, Math.hypot(vx, vy) * L.p * 0.05);
    const sp = Math.hypot(vx, vy) || 1;
    const ux = -vx / sp, uy = -vy / sp;
    ctx.strokeStyle = '#cfe0ff';
    ctx.fillStyle = '#cfe0ff';
    for (const s of L.stars) {
      for (let tx = -STAR_TILE; tx < W + STAR_TILE; tx += STAR_TILE) {
        const x = s.x + ox + tx - STAR_TILE;
        if (x < -20 || x > W + 20) continue;
        for (let ty = -STAR_TILE; ty < H + STAR_TILE; ty += STAR_TILE) {
          const y = s.y + oy + ty - STAR_TILE;
          if (y < -20 || y > H + 20) continue;
          ctx.globalAlpha = s.a;
          if (stretch > 2) {
            ctx.lineWidth = s.s;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + ux * stretch, y + uy * stretch);
            ctx.stroke();
          } else {
            ctx.fillRect(x, y, s.s, s.s);
          }
        }
      }
    }
  }
  ctx.globalAlpha = 1;
}

// Procedural dust specks in world space: the main cue for how fast the world flows by.
function drawSpecks(r) {
  const { ctx, cam } = r;
  const cell = 420;
  const halfW = r.W / 2 / cam.zoom, halfH = r.H / 2 / cam.zoom;
  const x0 = Math.floor((cam.x - halfW) / cell), x1 = Math.floor((cam.x + halfW) / cell);
  const y0 = Math.floor((cam.y - halfH) / cell), y1 = Math.floor((cam.y + halfH) / cell);
  ctx.fillStyle = '#7f8db8';
  const size = 2.2 / cam.zoom;
  for (let cx = x0; cx <= x1; cx++) {
    for (let cy = y0; cy <= y1; cy++) {
      let h = (cx * 73856093) ^ (cy * 19349663);
      for (let k = 0; k < 3; k++) {
        h = Math.imul(h ^ (h >>> 13), 0x5bd1e995) >>> 0;
        const px = cx * cell + (h & 1023) / 1023 * cell;
        h = Math.imul(h ^ (h >>> 15), 0x27d4eb2d) >>> 0;
        const py = cy * cell + (h & 1023) / 1023 * cell;
        ctx.globalAlpha = 0.35 + ((h >>> 12) & 7) / 14;
        ctx.fillRect(px, py, size, size);
      }
    }
  }
  ctx.globalAlpha = 1;
}

function drawTrail(r, game) {
  const { ctx } = r;
  const sh = game.ship;
  const tr = sh.trail;
  if (tr.length < 2) return;
  const sp = Math.hypot(sh.vx, sh.vy);
  const ratio = sp / game.stats.maxSpeed;
  const n = Math.min(tr.length, Math.round(6 + clamp(ratio, 0, 2) * 55));
  const start = tr.length - n;
  const hot = clamp((ratio - 0.85) / 0.4, 0, 1);
  ctx.lineCap = 'round';
  for (let i = start + 1; i < tr.length; i++) {
    const a = (i - start) / n;
    ctx.globalAlpha = a * 0.85;
    ctx.strokeStyle = hot > 0 ? `rgb(${120 + 135 * hot},${220 + 35 * hot},255)` : '#5fd8ff';
    ctx.lineWidth = (CONFIG.shipRadius * 1.1) * a + 1 / r.cam.zoom;
    ctx.beginPath();
    ctx.moveTo(tr[i - 1].x, tr[i - 1].y);
    ctx.lineTo(tr[i].x, tr[i].y);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(tr[tr.length - 1].x, tr[tr.length - 1].y);
  ctx.lineTo(sh.x, sh.y);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// The ship never rotates: a round craft, so screen-absolute controls always read the same way.
// Direction is shown by the trail and the heading marker instead.
function drawShip(r, game) {
  const { ctx } = r;
  const sh = game.ship;
  const s = Math.max(CONFIG.shipRadius, 9 / r.cam.zoom);
  ctx.save();
  ctx.translate(sh.x, sh.y);
  if (sh.invulnT > 0 && Math.floor(game.t * 20) % 2 === 0) ctx.globalAlpha = 0.4;
  ctx.shadowColor = '#5fd8ff';
  ctx.shadowBlur = 18;
  ctx.fillStyle = '#1b3b5c';
  ctx.beginPath(); ctx.arc(0, 0, s, 0, TAU); ctx.fill();
  ctx.lineWidth = s * 0.28;
  ctx.strokeStyle = '#bff3ff';
  ctx.beginPath(); ctx.arc(0, 0, s * 0.82, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(0, 0, s * 0.38, 0, TAU); ctx.fill();
  ctx.restore();
}

// Aim marker: a Space launch goes this way (scheme dependent).
function drawAimMarker(r, game) {
  const sh = game.ship;
  if (sh.charging || game.state !== 'play') return;
  const { ctx } = r;
  const p = worldToScreen(r, sh.x, sh.y);
  const ux = sh.markX, uy = sh.markY; // where a Space launch would go under the current scheme
  ctx.globalAlpha = 0.85;
  ctx.strokeStyle = '#9fe8ff';
  ctx.lineWidth = 2;
  ctx.setLineDash([3, 5]);
  ctx.beginPath(); ctx.moveTo(p.x + ux * 24, p.y + uy * 24); ctx.lineTo(p.x + ux * 46, p.y + uy * 46); ctx.stroke();
  ctx.setLineDash([]);
  const tx = p.x + ux * 56, ty = p.y + uy * 56;
  ctx.fillStyle = '#9fe8ff';
  ctx.beginPath();
  ctx.moveTo(tx + ux * 9, ty + uy * 9);
  ctx.lineTo(tx - ux * 3 - uy * 7, ty - uy * 3 + ux * 7);
  ctx.lineTo(tx - ux * 3 + uy * 7, ty - uy * 3 - ux * 7);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawChargeUi(r, game, pointer) {
  drawAimMarker(r, game);
  const sh = game.ship;
  if (!sh.charging) return;
  const { ctx } = r;
  const p = worldToScreen(r, sh.x, sh.y);
  const g = sh.gauge;
  const full = g >= 1;
  // gauge ring
  ctx.lineWidth = 5;
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath(); ctx.arc(p.x, p.y, 34, 0, TAU); ctx.stroke();
  ctx.strokeStyle = g > 1 ? '#ff9f40' : full ? '#ffe46b' : '#5fd8ff';
  ctx.beginPath(); ctx.arc(p.x, p.y, 34, -Math.PI / 2, -Math.PI / 2 + TAU * Math.min(1, g)); ctx.stroke();
  if (g > 1) {
    ctx.strokeStyle = '#ff5a3c';
    ctx.beginPath(); ctx.arc(p.x, p.y, 40, -Math.PI / 2, -Math.PI / 2 + TAU * (g - 1) / Math.max(0.01, game.stats.gaugeMax - 1)); ctx.stroke();
  }
  // aim arrow
  const len = Math.hypot(sh.aimX, sh.aimY);
  if (len >= CONFIG.minDrag) {
    const ux = sh.aimX / len, uy = sh.aimY / len;
    const L = 50 + 90 * Math.min(1.5, g);
    ctx.strokeStyle = full ? '#ffe46b' : '#9fe8ff';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(p.x + ux * 40, p.y + uy * 40); ctx.lineTo(p.x + ux * L, p.y + uy * L); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p.x + ux * (L + 12), p.y + uy * (L + 12));
    ctx.lineTo(p.x + ux * L - uy * 8, p.y + uy * L + ux * 8);
    ctx.lineTo(p.x + ux * L + uy * 8, p.y + uy * L - ux * 8);
    ctx.closePath();
    ctx.fillStyle = ctx.strokeStyle; ctx.fill();
  }
  // drag rubber band (screen space)
  if (pointer && pointer.down) {
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.moveTo(pointer.sx, pointer.sy); ctx.lineTo(pointer.cx, pointer.cy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(pointer.sx, pointer.sy, 6, 0, TAU); ctx.stroke();
  }
}


function drawHud(r, game) {
  drawSpeedPanel(r, game);
  drawStatus(r, game);
  drawTimer(r, game);
  drawLoadout(r, game);
}

// Bottom-left: the ship assembled from the equipped parts (empty slots are dashed outlines),
// with the module names beside it on wide screens.
function drawLoadout(r, game) {
  const { ctx, H, W } = r;
  const unit = Math.min(15, H / 50);
  const cx = 12 + unit * 3.4, cy = H - 14 - unit * 3.4;
  ctx.fillStyle = 'rgba(8,12,28,0.55)';
  ctx.beginPath(); ctx.arc(cx, cy - unit * 0.1, unit * 3.4, 0, TAU); ctx.fill();
  drawShipAssembly(ctx, cx, cy, unit, (slot) => {
    const m = game.loadout[slot];
    return m ? RARITIES[m.r].color : null;
  }, null, game.t);
  if (W < 960) return; // names only where they clear the speed bar
  const x = cx + unit * 3.8, y0 = cy - unit * 3 + 4;
  ctx.textAlign = 'left';
  ctx.font = '12px "Hiragino Sans", "Noto Sans JP", sans-serif';
  SLOTS.forEach((s, i) => {
    const m = game.loadout[s.id];
    ctx.fillStyle = m ? RARITIES[m.r].color : '#4a5878';
    ctx.fillText(`${s.name}: ${m ? moduleDef(m.id).name + (m.plus ? ` +${m.plus}` : '') : '—'}`, x, y0 + i * 17);
  });
}

function drawTimer(r, game) {
  const { ctx, W } = r;
  const left = Math.max(0, CONFIG.runTime - game.t);
  const m = Math.floor(left / 60), sec = Math.floor(left % 60);
  ctx.textAlign = 'center';
  ctx.fillStyle = left < 60 ? '#ff8a6b' : '#e8f0ff';
  ctx.font = `700 26px ${MONO}`;
  ctx.fillText(`${m}:${String(sec).padStart(2, '0')}`, W / 2, 40);
  // xp bar
  const need = xpForLevel(game.level);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(0, 0, W, 5);
  ctx.fillStyle = '#6dffb0';
  ctx.fillRect(0, 0, W * Math.min(1, game.xp / need), 5);
}

function drawStatus(r, game) {
  const { ctx } = r;
  const sh = game.ship;
  const frac = Math.max(0, sh.hp / game.stats.maxHp);
  // HP bar right under the ship
  const p = worldToScreen(r, sh.x, sh.y);
  const bw = 44, bx = p.x - bw / 2, by = p.y + Math.max(CONFIG.shipRadius * r.cam.zoom, 9) + 10;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(bx - 1, by - 1, bw + 2, 7);
  ctx.fillStyle = frac < 0.3 ? '#ff5a4a' : '#5dffa0';
  ctx.fillRect(bx, by, bw * frac, 5);
  const x = 16, y = 18;
  ctx.fillStyle = '#e8f0ff';
  ctx.font = `12px ${MONO}`;
  ctx.textAlign = 'left';
  ctx.fillText(`HP ${Math.ceil(Math.max(0, sh.hp))} / ${Math.round(game.stats.maxHp)}`, x, y + 10);
  const atk = attackPower(Math.hypot(sh.vx, sh.vy), game.stats);
  ctx.fillText(`ATK ${atk.toFixed(1)}   撃破 ${game.kills}   Lv ${game.level}`, x, y + 28);
  ctx.fillStyle = '#ffd24a';
  ctx.fillText(`部品 ${Math.round(game.coins)}`, x, y + 46);
}

function drawSpeedPanel(r, game) {
  const { ctx, W, H } = r;
  const sp = Math.hypot(game.ship.vx, game.ship.vy);
  const kms = (v) => (v * CONFIG.speedToKms).toFixed(2);
  const bw = Math.min(420, W * 0.5), bh = 10;
  const bx = W / 2 - bw / 2, by = H - 34;
  const top = CONFIG.escapeSpeed * 1.08;
  const X = (v) => bx + clamp(v / top, 0, 1) * bw;
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(bx, by, bw, bh);
  const hot = sp > game.stats.maxSpeed;
  ctx.fillStyle = sp >= CONFIG.escapeSpeed ? '#ffd24a' : hot ? '#bff3ff' : '#5fd8ff';
  ctx.fillRect(bx, by, X(sp) - bx, bh);
  // max speed tick
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(X(game.stats.maxSpeed) - 1, by - 5, 2, bh + 10);
  // peak marker
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillRect(X(game.peakSpeed) - 1, by, 2, bh);
  // escape line
  ctx.fillStyle = '#ffd24a';
  ctx.fillRect(X(CONFIG.escapeSpeed) - 1.5, by - 8, 3, bh + 16);
  ctx.font = `11px ${MONO}`;
  ctx.textAlign = 'center';
  ctx.fillText(`脱出 ${kms(CONFIG.escapeSpeed)}`, X(CONFIG.escapeSpeed), by - 11);
  ctx.fillStyle = '#cfd8ee';
  ctx.fillText(`上限 ${kms(game.stats.maxSpeed)}`, X(game.stats.maxSpeed), by + bh + 14);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#8fa3c8';
  ctx.fillText(`最高 ${kms(game.peakSpeed)}`, bx, by - 8);
  ctx.fillStyle = hot ? '#bff3ff' : '#e8f0ff';
  ctx.font = `700 34px ${MONO}`;
  ctx.textAlign = 'right';
  ctx.fillText(kms(sp), W / 2 + 40, by - 18);
  ctx.textAlign = 'left';
  ctx.font = `13px ${MONO}`;
  ctx.fillStyle = '#8fa3c8';
  ctx.fillText('km/s', W / 2 + 46, by - 19);
}

// ---- input.js ----
// Raw input only: keys, Space, pointer drag and hover. Control schemes (controls.js) turn this into intent.

// Launch direction is opposite to the drag: start - current.
function aimFromDrag(sx, sy, cx, cy) {
  return { x: sx - cx, y: sy - cy };
}

const MOVE_KEYS = {
  KeyW: [0, -1], ArrowUp: [0, -1],
  KeyS: [0, 1], ArrowDown: [0, 1],
  KeyA: [-1, 0], ArrowLeft: [-1, 0],
  KeyD: [1, 0], ArrowRight: [1, 0],
};
const SNAP_KEYS = { KeyW: 'forward', ArrowUp: 'forward', KeyS: 'back', ArrowDown: 'back' };
const KEY_CODES = { a: 'KeyA', d: 'KeyD', w: 'KeyW', s: 'KeyS', arrowleft: 'ArrowLeft', arrowright: 'ArrowRight', arrowup: 'ArrowUp', arrowdown: 'ArrowDown' };

// Held movement keys -> unit vector (zero when none or cancelled).
function moveVector(keys) {
  let dx = 0, dy = 0;
  for (const k of keys) {
    const d = MOVE_KEYS[k];
    if (d) { dx += d[0]; dy += d[1]; }
  }
  dx = Math.sign(dx); dy = Math.sign(dy);
  if (dx === 0 && dy === 0) return { x: 0, y: 0 };
  const len = Math.hypot(dx, dy);
  return { x: dx / len || 0, y: dy / len || 0 };
}

// Physical key position (works with IME on), falling back to the key name.
function keyCode(e) {
  return e.code || KEY_CODES[(e.key || '').toLowerCase()] || '';
}

const isSpace = (e) => e.code === 'Space' || e.key === ' ';

function createInput(el, keyTarget = typeof window !== 'undefined' ? window : null) {
  const st = {
    down: false, sx: 0, sy: 0, cx: 0, cy: 0, pointerId: null, enabled: true, hover: null,
    release: false, relSource: null, relX: 0, relY: 0,
    keys: new Set(), space: false, snap: null, pressed: false,
  };
  el.addEventListener('pointerdown', (e) => {
    st.hover = { x: e.clientX, y: e.clientY };
    if (st.enabled && e.button === 0) st.pressed = true;
    if (!st.enabled || e.button > 0 || st.space) return;
    st.down = true; st.pointerId = e.pointerId;
    st.sx = st.cx = e.clientX; st.sy = st.cy = e.clientY;
    try { el.setPointerCapture(e.pointerId); } catch { /* synthetic or lost pointer */ }
  });
  el.addEventListener('pointermove', (e) => {
    st.hover = { x: e.clientX, y: e.clientY };
    if (!st.down || e.pointerId !== st.pointerId) return;
    st.cx = e.clientX; st.cy = e.clientY;
  });
  const up = (e) => {
    if (!st.down || e.pointerId !== st.pointerId) return;
    st.cx = e.clientX; st.cy = e.clientY;
    const a = aimFromDrag(st.sx, st.sy, st.cx, st.cy);
    st.down = false; st.release = true; st.relSource = 'pointer'; st.relX = a.x; st.relY = a.y;
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('contextmenu', (e) => e.preventDefault());

  if (keyTarget) {
    keyTarget.addEventListener('keydown', (e) => {
      const code = keyCode(e);
      if (MOVE_KEYS[code]) { st.keys.add(code); if (st.enabled) e.preventDefault(); }
      if (SNAP_KEYS[code] && !e.repeat) st.snap = SNAP_KEYS[code];
      if (isSpace(e)) {
        if (st.enabled) e.preventDefault();
        if (!st.enabled || e.repeat || st.space) return;
        st.pressed = true;
        if (st.down) return;
        st.space = true;
      }
    });
    keyTarget.addEventListener('keyup', (e) => {
      st.keys.delete(keyCode(e));
      if (isSpace(e) && st.space) {
        st.space = false; st.release = true; st.relSource = 'space'; st.relX = 0; st.relY = 0;
      }
    });
    keyTarget.addEventListener('blur', () => { st.keys.clear(); st.space = false; });
  }

  return {
    state: st,
    read() {
      const out = {
        move: st.enabled ? moveVector(st.keys) : { x: 0, y: 0 },
        snap: st.enabled ? st.snap : null,
        space: st.space,
        pressed: st.pressed, // a fresh Space press or click this frame (commits a drawn path)
        pointerDown: st.down,
        drag: st.down ? aimFromDrag(st.sx, st.sy, st.cx, st.cy) : { x: 0, y: 0 },
        hover: st.hover,
        release: st.release,
        releaseSource: st.release ? st.relSource : null,
        releaseDrag: { x: st.relX, y: st.relY },
      };
      st.release = false;
      st.snap = null;
      st.pressed = false;
      return out;
    },
    reset() { st.down = false; st.space = false; st.release = false; st.snap = null; st.pressed = false; st.pointerId = null; },
  };
}

// ---- ui.js ----






const root = () => document.getElementById('ui');

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'html') n.innerHTML = v;
    else n.setAttribute(k, v);
  }
  for (const c of kids) if (c != null) n.append(c);
  return n;
}

function clearScreens() {
  for (const n of [...root().querySelectorAll('.screen')]) n.remove();
}

function showScreen(panel, id) {
  clearScreens();
  const s = el('div', { class: 'screen', id }, panel);
  root().append(s);
  return s;
}

function fmtTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

const kms = (v) => (v * CONFIG.speedToKms).toFixed(2);

const END_TEXT = {
  escape: ['重力圏 脱出', 'win', '脱出速度に到達した'],
  hp: ['機体 大破', 'lose', 'HP が尽きた'],
  time: ['時間切れ', 'lose', '10 分以内に脱出速度へ届かなかった'],
};

function showResult(game, extra, onNext) {
  const [title, cls, sub] = END_TEXT[game.endReason] || END_TEXT.time;
  const rows = [
    ['経過時間', fmtTime(game.t)],
    ['最高速度', `${kms(game.peakSpeed)} km/s`],
    ['脱出速度', `${kms(CONFIG.escapeSpeed)} km/s`],
    ['撃破数', String(game.kills)],
    ['レベル', String(game.level)],
    ...(extra || []),
  ];
  const stats = el('div', { class: 'stats' });
  for (const [k, v] of rows) stats.append(el('div', {}, k), el('div', {}, v));
  const btn = el('button', { class: 'primary', onclick: onNext }, 'ステーションへ ', el('kbd', {}, 'Enter'));
  showScreen(el('div', { class: 'panel' },
    el('h1', { class: cls }, title),
    el('div', { class: 'sub' }, sub),
    stats,
    el('div', { class: 'btns' }, btn)), 'result');
  btn.focus();
}

const SOURCE_TEXT = { xp: '経験値', capsule: '漂流カプセル', elite: '強敵のドロップ', drop: '敵のドロップ', core: '出力コア' };

function partCanvas(slot, color, size = 64) {
  const c = el('canvas', { class: 'part' });
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = size * dpr; c.height = size * dpr;
  c.style.width = c.style.height = `${size}px`;
  const ctx = c.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.translate(size / 2, size / 2);
  drawPart(ctx, slot, size * (slot === 'armor' ? 0.26 : 0.36), color, { glow: color ? 10 : 0 });
  return c;
}

// The assembled ship with `slot` pulsing; redraws itself while the offer is open.
function assemblyCanvas(game, slot, size = 150) {
  const c = el('canvas', { class: 'assembly' });
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = size * dpr; c.height = size * dpr;
  c.style.width = c.style.height = `${size}px`;
  const ctx = c.getContext('2d');
  const paint = (t) => {
    if (!c.isConnected && t > 0) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    drawShipAssembly(ctx, size / 2, size / 2 + size * 0.03, size / 7.4, (s) => {
      const m = game.loadout[s];
      return m ? RARITIES[m.r].color : null;
    }, slot, t / 1000);
    requestAnimationFrame(paint);
  };
  paint(0);
  return c;
}

function moduleCard(mod, tag, isNew) {
  if (!mod) return el('div', { class: 'card empty' }, '空きスロット');
  const def = moduleDef(mod.id);
  const rar = RARITIES[mod.r];
  const card = el('div', { class: `card${isNew ? ' new' : ''}` },
    partCanvas(mod.slot, rar.color),
    el('div', { class: 'tag' }, tag),
    el('div', { class: 'name' }, `${def.name}${mod.plus ? ` +${mod.plus}` : ''}`),
    el('div', { class: 'rar', style: `color:${rar.color}` }, rar.name),
    el('div', { class: 'desc' }, def.desc(mod.r)));
  if (isNew) card.style.borderColor = rar.color;
  return card;
}

function showOffer(game, onChoose) {
  const mod = game.currentOffer;
  const slot = SLOTS.find((s) => s.id === mod.slot);
  const cur = game.loadout[mod.slot];
  const loadout = el('div', { class: 'loadout' });
  for (const s of SLOTS) {
    const m = game.loadout[s.id];
    const d = el('div', { class: s.id === mod.slot ? 'hl' : '' }, `${s.icon} ${s.name}: ${m ? moduleDef(m.id).name : '—'}`);
    if (m) d.style.color = RARITIES[m.r].color;
    loadout.append(d);
  }
  const equip = el('button', { class: 'primary', onclick: () => onChoose(true) }, '付け替える ', el('kbd', {}, '1'));
  const skip = el('button', { onclick: () => onChoose(false) }, '捨てる ', el('kbd', {}, '2'));
  showScreen(el('div', { class: 'panel' },
    el('div', { class: 'offerhead' },
      assemblyCanvas(game, mod.slot),
      el('div', {},
        el('div', { class: 'src' }, `${SOURCE_TEXT[mod.source] || '入手'}${game.offerQueue.length ? `　残り ${game.offerQueue.length}` : ''}`),
        el('h1', {}, slot.name),
        el('div', { class: 'sub' }, '付け替えると今のモジュールは捨てられる'))),
    el('div', { class: 'cards' }, moduleCard(cur, '装備中', false), el('div', { class: 'arrowcol' }, '→'), moduleCard(mod, '新規', true)),
    el('div', { class: 'btns' }, equip, skip),
    loadout), 'offer');
}

// ---- audio.js ----
// Synthesized sound. Everything is optional: without Web Audio this is a silent stub.

function noop() {}

// Muted by default; only a stored '0' (the player pressed M to turn sound on) starts unmuted.
function initialMuted(stored) {
  return stored !== '0';
}

function createAudio() {
  const AC = typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext);
  if (!AC) return { unlock: noop, handle: noop, update: noop, toggleMute: () => true, muted: true };

  let ctx = null, master, sfx, muffle, boomBus, engine, sub, engineGain, wind, windFilter, windGain, noiseBuf;
  let muted = true;
  try { muted = initialMuted(window.localStorage.getItem('speed-muted')); } catch { /* ignore */ }
  const lastPlayed = {};
  let duckT = 0;

  function init() {
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.7;
    const comp = ctx.createDynamicsCompressor();
    master.connect(comp).connect(ctx.destination);
    muffle = ctx.createBiquadFilter();
    muffle.type = 'lowpass';
    muffle.frequency.value = 16000;
    sfx = ctx.createGain();
    sfx.connect(muffle).connect(master);
    boomBus = ctx.createGain();
    boomBus.connect(master);

    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

    engineGain = ctx.createGain();
    engineGain.gain.value = 0;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 700;
    engine = ctx.createOscillator(); engine.type = 'sawtooth'; engine.frequency.value = 50;
    sub = ctx.createOscillator(); sub.type = 'sine'; sub.frequency.value = 25;
    engine.connect(lp); sub.connect(lp); lp.connect(engineGain).connect(sfx);
    engine.start(); sub.start();

    wind = ctx.createBufferSource(); wind.buffer = noiseBuf; wind.loop = true;
    windFilter = ctx.createBiquadFilter(); windFilter.type = 'bandpass'; windFilter.Q.value = 0.8;
    windGain = ctx.createGain(); windGain.gain.value = 0;
    wind.connect(windFilter).connect(windGain).connect(sfx);
    wind.start();
  }

  function env(g, t, a, peak, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }

  function tone(freq, dur, type = 'sine', vol = 0.2, slideTo = null, bus = sfx, delay = 0) {
    const t = ctx.currentTime + delay;
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    const g = ctx.createGain();
    env(g, t, 0.005, vol, dur);
    o.connect(g).connect(bus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function noise(dur, freq, vol = 0.3, type = 'lowpass', sweepTo = null, bus = sfx, q = 1) {
    const t = ctx.currentTime;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    s.playbackRate.value = 0.8 + Math.random() * 0.4;
    const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(freq, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    const g = ctx.createGain();
    env(g, t, 0.01, vol, dur);
    s.connect(f).connect(g).connect(bus);
    s.start(t, Math.random()); s.stop(t + dur + 0.05);
  }

  function throttle(key, gap) {
    const now = ctx.currentTime;
    if (lastPlayed[key] && now - lastPlayed[key] < gap) return false;
    lastPlayed[key] = now;
    return true;
  }

  const SOUNDS = {
    launch: (e) => noise(0.35, 400 + 1200 * Math.min(1.5, e.gauge), 0.25 + 0.15 * Math.min(1, e.gauge), 'bandpass', 3000, sfx, 1.5),
    kill: (e) => throttle('kill', 0.025) && tone(320 + Math.random() * 280 + (e.r > 25 ? -150 : 0), 0.12, 'square', e.r > 25 ? 0.12 : 0.06, 90),
    hit: (e) => e.crit && throttle('crit', 0.05) && tone(1400, 0.18, 'triangle', 0.18, 2200),
    hurt: () => { noise(0.3, 300, 0.5); tone(90, 0.3, 'sawtooth', 0.25, 40); },
    bounce: () => throttle('bounce', 0.08) && tone(160, 0.15, 'square', 0.15, 80),
    crash: () => noise(0.4, 250, 0.5),
    levelup: () => [523, 659, 784].forEach((f, i) => tone(f, 0.14, 'triangle', 0.12, null, sfx, i * 0.06)),
    pickup: (e) => tone(e.kind === 'core' ? 660 : 880, 0.3, 'sine', 0.2, e.kind === 'core' ? 1320 : 1760),
    equip: () => tone(440, 0.15, 'triangle', 0.15, 880),
    coin: () => throttle('coin', 0.04) && tone(1568, 0.08, 'square', 0.05),
    explode: (e) => throttle('explode' + e.cause, 0.05) && noise(0.35, e.cause === 'trail' ? 900 : 500, e.cause === 'trail' ? 0.12 : 0.3),
    shoot: () => throttle('shoot', 0.09) && tone(700, 0.05, 'square', 0.03, 400),
    turret: () => throttle('turret', 0.06) && tone(1800, 0.04, 'square', 0.03, 1200),
    stage: () => { tone(392, 0.25, 'sawtooth', 0.1, 784); tone(587, 0.35, 'triangle', 0.12, 1175, sfx, 0.08); },
    phase: () => tone(110, 1.2, 'sawtooth', 0.12, 220),
    barrier: () => noise(0.25, 2000, 0.15, 'highpass'),
    drawStart: () => { tone(330, 0.6, 'sine', 0.12, 110); noise(0.5, 600, 0.12, 'lowpass', 150); },
    sonic: () => {
      // a beat of silence, then everything comes back at once
      duckT = 0.22;
      const t = ctx.currentTime;
      sfx.gain.cancelScheduledValues(t);
      sfx.gain.setValueAtTime(0.0001, t);
      sfx.gain.linearRampToValueAtTime(1, t + 0.9);
      setTimeout(() => {
        noise(1.6, 1800, 1.0, 'lowpass', 60, boomBus);
        tone(95, 1.4, 'sine', 0.9, 28, boomBus);
        tone(190, 0.5, 'sawtooth', 0.25, 40, boomBus);
      }, 200);
    },
    end: (e) => {
      if (e.state === 'won') [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.4, 'triangle', 0.18, null, boomBus, i * 0.12));
      else tone(220, 1.2, 'sawtooth', 0.15, 55, boomBus);
    },
  };

  return {
    get muted() { return muted; },
    unlock() {
      try {
        if (!ctx) init();
        if (ctx.state === 'suspended') ctx.resume();
      } catch { /* audio unavailable */ }
    },
    toggleMute() {
      muted = !muted;
      try { window.localStorage.setItem('speed-muted', muted ? '1' : '0'); } catch { /* ignore */ }
      if (master) master.gain.value = muted ? 0 : 0.7;
      return muted;
    },
    handle(events) {
      if (!ctx || ctx.state !== 'running') return;
      for (const e of events) {
        const f = SOUNDS[e.type];
        if (f) try { f(e); } catch { /* ignore */ }
      }
    },
    // Continuous layers: engine pitch, wind, and the high-speed fade toward silence.
    update(game, dt) {
      if (!ctx || ctx.state !== 'running' || !game) return;
      const t = ctx.currentTime;
      const sh = game.ship;
      const sp = Math.hypot(sh.vx, sh.vy);
      const ratio = sp / game.stats.maxSpeed;
      const live = game.state === 'play';
      engine.frequency.setTargetAtTime(45 + sp * 0.05, t, 0.08);
      sub.frequency.setTargetAtTime(22 + sp * 0.025, t, 0.08);
      engineGain.gain.setTargetAtTime(live ? 0.05 + 0.08 * Math.min(1.2, ratio) : 0, t, 0.1);
      windFilter.frequency.setTargetAtTime(250 + sp * 0.9, t, 0.1);
      windGain.gain.setTargetAtTime(live ? Math.min(0.35, sp / 4000) : 0, t, 0.1);
      // approaching max speed the world goes quiet
      const k = Math.max(0, Math.min(1, (ratio - 0.6) / 0.38));
      muffle.frequency.setTargetAtTime(16000 * Math.pow(0.02, k), t, 0.15);
      if (duckT > 0) duckT -= dt;
      else sfx.gain.setTargetAtTime(1 - 0.88 * k, t, 0.2);
    },
  };
}

const STAT_KEYS = new Set(['baseMaxSpeed', 'levelSpeedGrowth', 'launchRatio', 'carry', 'chargeTime', 'boostDuration', 'cruiseFloor']);

function applyTunable(game, key, value) {
  CONFIG[key] = value;
  if (!game) return;
  if (STAT_KEYS.has(key)) refreshStats(game);
  if (key === 'planetGM') game.field.planet.gm = value;
  if (key === 'moonGM') for (const m of game.field.moons) m.gm = value;
}

function resetConfig(game) {
  for (const t of TUNABLES) applyTunable(game, t.key, DEFAULTS[t.key]);
}

function skipTime(game, sec) {
  game.t = Math.min(CONFIG.runTime - 1, game.t + sec);
}

function jumpToPhase(game, id) {
  const p = PHASES.find((x) => x.id === id);
  if (p) game.t = p.start + 0.01;
}

function setScheme(game, id) {
  CONFIG.controlScheme = schemeById(id).id;
  if (game) game.scheme = CONFIG.controlScheme;
}

function createDebugPanel(getGame, onScheme) {
  const root = document.createElement('div');
  root.id = 'debug';
  root.innerHTML = `<div class="dh"><b>調整パネル</b><span class="dclose">P で閉じる</span></div><label class="dctl"><span>操作方法</span><select></select></label><div class="dhelp"></div><div class="dinfo"></div><div class="dbtns"></div><div class="dsl"></div>`;
  document.body.append(root);
  const schemeSel = root.querySelector('.dctl select');
  const schemeHelp = root.querySelector('.dhelp');
  schemeSel.innerHTML = SCHEMES.map((s) => `<option value="${s.id}">${s.name}</option>`).join('');
  const syncScheme = () => { schemeSel.value = CONFIG.controlScheme; schemeHelp.textContent = schemeById(CONFIG.controlScheme).help; };
  schemeSel.addEventListener('change', () => {
    setScheme(getGame(), schemeSel.value);
    syncScheme();
    schemeSel.blur(); // keep WASD/Space for the game, not the select
    if (onScheme) onScheme(CONFIG.controlScheme);
  });
  syncScheme();
  const info = root.querySelector('.dinfo');
  const btns = root.querySelector('.dbtns');
  const sliders = root.querySelector('.dsl');

  const button = (label, fn) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.addEventListener('click', () => { const g = getGame(); if (g) fn(g); });
    btns.append(b);
    return b;
  };
  button('+30 秒', (g) => skipTime(g, 30));
  button('+60 秒', (g) => skipTime(g, 60));
  const sel = document.createElement('select');
  sel.innerHTML = '<option value="">フェーズへ…</option>' + PHASES.map((p) => `<option value="${p.id}">${p.name}（${Math.floor(p.start / 60)}:${String(p.start % 60).padStart(2, '0')}）</option>`).join('');
  sel.addEventListener('change', () => { const g = getGame(); if (g && sel.value) jumpToPhase(g, sel.value); sel.value = ''; });
  btns.append(sel);
  const inv = button('無敵: OFF', (g) => { g.debug.invincible = !g.debug.invincible; inv.textContent = `無敵: ${g.debug.invincible ? 'ON' : 'OFF'}`; });
  const rsel = document.createElement('select');
  rsel.innerHTML = RARITIES.map((r, i) => `<option value="${i}">${r.name}</option>`).join('');
  rsel.value = '2';
  btns.append(rsel);
  button('モジュール入手', (g) => {
    const r = Number(rsel.value);
    const pool = MODULES.filter((m) => m.rarities.includes(r));
    const def = pool[Math.floor(Math.random() * pool.length)];
    if (g.state === 'play') pushOffer(g, { id: def.id, slot: def.slot, r }, 'capsule');
  });
  button('出力コア', (g) => { if (g.state === 'play') pushOffer(g, { id: 'limiter', slot: 'booster', r: 3 }, 'core'); });
  button('HP 全快', (g) => { g.ship.hp = g.stats.maxHp; });
  button('敵を消す', (g) => { g.enemies.length = 0; g.ebullets.length = 0; });
  button('部品 +100', (g) => { g.coins += 100; });
  button('既定値に戻す', (g) => { resetConfig(g); sync(); });

  const inputs = [];
  for (const t of TUNABLES) {
    const row = document.createElement('label');
    row.className = 'drow';
    const name = document.createElement('span');
    name.textContent = t.label;
    const val = document.createElement('span');
    val.className = 'dval';
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = t.min; inp.max = t.max; inp.step = t.step;
    inp.addEventListener('input', () => {
      applyTunable(getGame(), t.key, Number(inp.value));
      val.textContent = t.fmt ? t.fmt(CONFIG[t.key]) : String(CONFIG[t.key]);
    });
    row.append(name, val, inp);
    sliders.append(row);
    inputs.push({ t, inp, val });
  }
  function sync() {
    for (const { t, inp, val } of inputs) {
      inp.value = CONFIG[t.key];
      val.textContent = t.fmt ? t.fmt(CONFIG[t.key]) : String(CONFIG[t.key]);
    }
  }
  sync();

  let fps = 60;
  return {
    toggle() { root.classList.toggle('open'); sync(); syncScheme(); },
    get open() { return root.classList.contains('open'); },
    tick(game, dt) {
      if (!root.classList.contains('open') || !game) return;
      fps = fps * 0.95 + (1 / Math.max(dt, 1e-3)) * 0.05;
      const sp = Math.hypot(game.ship.vx, game.ship.vy);
      info.textContent = `t ${game.t.toFixed(1)}s ・ 敵 ${game.enemies.length} ・ Lv ${game.level} ・ 上限 ${(game.stats.maxSpeed * CONFIG.speedToKms).toFixed(2)} ・ 現在 ${(sp * CONFIG.speedToKms).toFixed(2)} ・ 最高 ${(game.peakSpeed * CONFIG.speedToKms).toFixed(2)} km/s ・ ${fps.toFixed(0)} fps`;
    },
  };
}

// ---- main.js ----










const canvas = document.getElementById('game');
const renderer = createRenderer(canvas);
const input = createInput(canvas);
const storage = (() => { try { return window.localStorage; } catch { return null; } })();
const save = loadSave(storage);
const audio = createAudio();
window.addEventListener('pointerdown', () => audio.unlock(), true);
window.addEventListener('keydown', () => audio.unlock(), true);

let game = null;
// control scheme is a per-browser preference
try { const c = window.localStorage.getItem('speed-controls-v2'); if (c) CONFIG.controlScheme = c; } catch { /* ignore */ }
const debug = createDebugPanel(() => game, (id) => {
  try { window.localStorage.setItem('speed-controls-v2', id); } catch { /* ignore */ }
  if (mode === 'station') openStation();
});
let mode = 'station'; // station | run | result
let offerShown = null;

window.addEventListener('resize', () => resizeRenderer(renderer));
resizeRenderer(renderer);

function openStation() {
  mode = 'station';
  input.state.enabled = false;
  input.reset();
  if (!game) { game = createGame({ meta: save.meta }); game.spawning = false; game.state = 'idle'; }
  showStation(save, (id) => { if (buyUpgrade(save, id)) { writeSave(storage, save); openStation(); } }, startRun);
}

function startRun() {
  clearScreens();
  input.reset();
  input.state.enabled = true;
  renderer.cam.ready = false;
  offerShown = null;
  game = createGame({ meta: save.meta });
  mode = 'run';
}

function finishRun() {
  mode = 'result';
  input.state.enabled = false;
  input.reset();
  const before = save.coins;
  applyRunResult(save, game);
  writeSave(storage, save);
  showResult(game, [['獲得部品', `+${save.coins - before}`]], openStation);
}

function chooseOffer(accept) {
  if (game.state !== 'offer') return;
  resolveOffer(game, accept);
  offerShown = null;
  if (game.state === 'play') { clearScreens(); input.reset(); }
}

function togglePause() {
  if (mode !== 'run') return;
  if (game.state === 'play') {
    game.state = 'paused';
    input.reset();
    showPause(togglePause, () => { game.state = 'lost'; game.endReason = 'time'; clearScreens(); finishRun(); });
  } else if (game.state === 'paused') {
    game.state = 'play';
    clearScreens();
  }
}

window.addEventListener('keydown', (e) => {
  if (mode === 'run' && game.state === 'offer') {
    if (e.key === '1') chooseOffer(true);
    else if (e.key === '2') chooseOffer(false);
    return;
  }
  if (e.key === 'Escape') togglePause();
  if (e.key === 'm' || e.key === 'M') audio.toggleMute();
  if (e.key === 'p' || e.key === 'P') debug.toggle();
  if (e.key === 'Enter') {
    if (mode === 'station') { e.preventDefault(); startRun(); }
    else if (mode === 'result') { e.preventDefault(); openStation(); }
  }
});

window.addEventListener('blur', () => { if (mode === 'run' && game.state === 'play') togglePause(); });

openStation();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  const wasPlaying = game.state === 'play';
  const raw = input.read();
  raw.cursor = raw.hover ? screenToWorld(renderer, raw.hover.x, raw.hover.y) : null;
  update(game, dt, buildIntent(raw, game.scheme));
  render(renderer, game, dt, input.state);
  audio.handle(game.events);
  audio.update(game, dt);
  debug.tick(game, dt);
  game.events.length = 0;
  if (mode === 'run') {
    if (wasPlaying && (game.state === 'won' || game.state === 'lost')) finishRun();
    if (game.state === 'offer' && offerShown !== game.currentOffer) {
      offerShown = game.currentOffer;
      input.reset();
      showOffer(game, chooseOffer);
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// console access for debugging
window.__speed = { get game() { return game; }, save };

})();
</script>
