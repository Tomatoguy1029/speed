<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>SPEED — 重力圏脱出</title>
<style>
  html, body { margin: 0; height: 100%; background: #04050b; overflow: hidden; color: #e6ecff;
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; user-select: none; }
  canvas#game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: crosshair; touch-action: none; }
</style>

<body>
<canvas id="game"></canvas>
<script>
(() => {
'use strict';
// ---- config.js ----
// All tunable numbers live here. The debug panel edits this object directly.
const CONFIG = {
  // run
  runTime: 600,
  escapeSpeed: 2400, // px/s needed to clear
  speedToKms: 11.2 / 2400, // display factor: escape speed shows as 11.2 km/s

  // field
  fieldRadius: 6000,
  planetRadius: 420,
  zoneInner: 2200,
  zoneOuter: 4200,
  startRadius: 3200,
  planetGM: 5.12e8, // ~50 px/s^2 at the start radius
  moonCount: 6,
  moonGM: 2.5e7,
  moonOrbitSpeed: 0.02, // rad/s
  dustCount: 34,
  dustDrag: 0.55,
  boundaryPush: 600,
  crashRestitution: 0.45,
  crashDamage: 0.03, // hp per px/s of impact speed above 200

  // ship
  baseMaxSpeed: 1000,
  launchRatio: 0.8, // full gauge launch = maxSpeed * launchRatio
  carry: 0.65, // share of current speed carried into the next launch (same direction)
  chargeTime: 0.7, // seconds to fill the gauge
  minGauge: 0.12,
  minDrag: 14, // screen px; shorter drags boost forward along velocity
  boostDuration: 0.9, // seconds after launch with no cruise drag
  energyCut: 0.85, // speed kept when the launch energy runs out (applied over ~0.3s)
  cruiseDrag: 0.06, // weak per-second drag after the energy runs out
  cruiseFloor: 0.35, // cruise drag never slows below this share of max speed
  overcapDecay: 0.3, // per second decay of speed above max speed
  shipRadius: 16,
  baseHP: 100,
  invulnTime: 0.6,
  pickupRadius: 140,

  // enemies
  enemyHpMult: 1,
  enemyArmorMult: 1,

  // camera
  baseView: 1100, // world units visible on the shorter screen side at rest
  zoomRefSpeed: 700,
  zoomExp: 0.7,
  zoomMin: 0.28,
  lookAhead: 0.32,
};

// ---- math.js ----
const TAU = Math.PI * 2;

function clamp(v, a, b) {
  return v < a ? a : v > b ? b : v;
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function smoothstep(a, b, v) {
  const t = clamp((v - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}

function angleDiff(a, b) {
  let d = (a - b) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}

// Segment p0->p1 vs circle (c, r): first t in [0,1] where the segment is inside the circle, -1 if never.
function segCircleT(x0, y0, x1, y1, cx, cy, r) {
  const fx = x0 - cx, fy = y0 - cy;
  const c = fx * fx + fy * fy - r * r;
  if (c <= 0) return 0;
  const dx = x1 - x0, dy = y1 - y0;
  const a = dx * dx + dy * dy;
  if (a === 0) return -1;
  const b = 2 * (fx * dx + fy * dy);
  const disc = b * b - 4 * a * c;
  if (disc < 0) return -1;
  const t = (-b - Math.sqrt(disc)) / (2 * a);
  return t >= 0 && t <= 1 ? t : -1;
}

// mulberry32
function makeRng(seed) {
  let s = seed >>> 0;
  return function rng() {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function randRange(rng, a, b) {
  return a + (b - a) * rng();
}

// items: [[value, weight], ...]
function pickWeighted(rng, items) {
  let total = 0;
  for (const [, w] of items) total += Math.max(0, w);
  if (total <= 0) return items[0][0];
  let r = rng() * total;
  for (const [v, w] of items) {
    if (w <= 0) continue;
    r -= w;
    if (r < 0) return v;
  }
  return items[items.length - 1][0];
}

// ---- ship.js ----


function baseStats(meta = {}) {
  const lv = (k) => meta[k] || 0;
  return {
    maxSpeed: CONFIG.baseMaxSpeed * (1 + 0.05 * lv('speed')),
    launchRatio: CONFIG.launchRatio,
    carry: CONFIG.carry,
    chargeTime: CONFIG.chargeTime * Math.pow(0.95, lv('charge')),
    gaugeMax: 1,
    boostDuration: CONFIG.boostDuration,
    cruiseDrag: CONFIG.cruiseDrag,
    cruiseFloor: CONFIG.cruiseFloor,
    atkMult: 1 + 0.06 * lv('atk'),
    maxHp: CONFIG.baseHP + 15 * lv('hp'),
    pickupRadius: CONFIG.pickupRadius * (1 + 0.15 * lv('pickup')),
    xpMult: 1 + 0.08 * lv('xp'),
    damageTakenMult: 1,
    hitSlowMult: 1,
    critMult: 2.5,
    weakArcMult: 1,
    pierceLossMult: 1,
    bounceKeep: 0.5,
    bounceDamageMult: 1,
    predictTime: 0.9,
    predictBounce: false,
    regen: 0,
  };
}

function createShip(stats, x, y) {
  return {
    x, y, vx: 0, vy: 0,
    hp: stats.maxHp,
    charging: false, chargeT: 0, gauge: 0, gaugeBank: 0,
    aimX: 0, aimY: 0,
    boostT: 0, fadeT: 0, invulnT: 0,
    trail: [], trailAcc: 0,
  };
}

function computeGauge(chargeT, stats, bank = 0) {
  return Math.min(stats.gaugeMax, Math.max(CONFIG.minGauge, bank + chargeT / stats.chargeTime));
}

// New velocity after launching along unit direction (dx, dy) with the given gauge.
function launchVelocity(vx, vy, dx, dy, gauge, stats) {
  const speed = Math.hypot(vx, vy);
  const cos = speed > 0 ? Math.max(0, (vx * dx + vy * dy) / speed) : 0;
  const carried = speed * stats.carry * cos;
  const thrust = stats.maxSpeed * stats.launchRatio * gauge;
  const limit = stats.maxSpeed * Math.max(1, gauge);
  const newSpeed = Math.max(Math.min(carried + thrust, limit), speed * cos);
  return { vx: dx * newSpeed, vy: dy * newSpeed };
}

// Integrate one step: acceleration (ax, ay), drag rules, then position.
function stepShip(ship, stats, dt, ax, ay, extraDrag) {
  ship.vx += ax * dt;
  ship.vy += ay * dt;
  let sp = Math.hypot(ship.vx, ship.vy);
  if (sp > 0) {
    let target = sp;
    if (ship.boostT > 0) {
      ship.boostT -= dt;
      if (ship.boostT <= 0) ship.fadeT = 0.3;
    } else {
      if (ship.fadeT > 0) {
        ship.fadeT -= dt;
        if (target > stats.maxSpeed * stats.cruiseFloor) target *= Math.pow(CONFIG.energyCut, dt / 0.3);
      }
      const floor = stats.maxSpeed * stats.cruiseFloor;
      if (target > floor) target = floor + (target - floor) * Math.exp(-stats.cruiseDrag * dt);
    }
    if (target > stats.maxSpeed) {
      target = stats.maxSpeed + (target - stats.maxSpeed) * Math.exp(-CONFIG.overcapDecay * dt);
    }
    if (extraDrag > 0) target *= Math.exp(-extraDrag * dt);
    const k = target / sp;
    ship.vx *= k;
    ship.vy *= k;
  }
  ship.x += ship.vx * dt;
  ship.y += ship.vy * dt;
}

// ---- field.js ----



function createField(rng) {
  const moons = [];
  for (let i = 0; i < CONFIG.moonCount; i++) {
    moons.push({
      orbit: randRange(rng, 1500, CONFIG.fieldRadius - 600),
      a0: (i / CONFIG.moonCount) * TAU + randRange(rng, -0.3, 0.3),
      dir: rng() < 0.5 ? -1 : 1,
      r: randRange(rng, 110, 180),
      gm: CONFIG.moonGM,
      x: 0, y: 0,
    });
  }
  const dust = [];
  for (let i = 0; i < CONFIG.dustCount; i++) {
    const a = rng() * TAU;
    const d = randRange(rng, CONFIG.planetRadius + 600, CONFIG.fieldRadius - 200);
    dust.push({ x: Math.cos(a) * d, y: Math.sin(a) * d, r: randRange(rng, 250, 620) });
  }
  const field = { planet: { x: 0, y: 0, r: CONFIG.planetRadius, gm: CONFIG.planetGM }, moons, dust };
  updateMoons(field, 0);
  return field;
}

function updateMoons(field, t) {
  for (const m of field.moons) {
    const a = m.a0 + m.dir * CONFIG.moonOrbitSpeed * t;
    m.x = Math.cos(a) * m.orbit;
    m.y = Math.sin(a) * m.orbit;
  }
}

function zoneOf(r) {
  if (r < CONFIG.zoneInner) return 'inner';
  if (r > CONFIG.zoneOuter) return 'outer';
  return 'mid';
}

// 0 in the middle ring, rising to 1 at the planet surface and at the field edge.
function dangerAt(r) {
  if (r < CONFIG.zoneInner) return clamp((CONFIG.zoneInner - r) / (CONFIG.zoneInner - CONFIG.planetRadius), 0, 1);
  if (r > CONFIG.zoneOuter) return clamp((r - CONFIG.zoneOuter) / (CONFIG.fieldRadius - CONFIG.zoneOuter), 0, 1);
  return 0;
}

function dustDragAt(field, x, y) {
  for (const d of field.dust) {
    const dx = x - d.x, dy = y - d.y;
    if (dx * dx + dy * dy < d.r * d.r) return CONFIG.dustDrag;
  }
  return 0;
}

// ---- gravity.js ----


function pull(out, x, y, b) {
  const dx = b.x - x, dy = b.y - y;
  const d2 = Math.max(dx * dx + dy * dy, b.r * b.r);
  const d = Math.sqrt(d2);
  const a = b.gm / d2;
  out.ax += (dx / d) * a;
  out.ay += (dy / d) * a;
}

function gravityAt(field, t, x, y) {
  const out = { ax: 0, ay: 0 };
  pull(out, x, y, field.planet);
  for (const m of field.moons) pull(out, x, y, m);
  const r = Math.hypot(x, y);
  if (r > CONFIG.fieldRadius) {
    const push = CONFIG.boundaryPush + (r - CONFIG.fieldRadius) * 4;
    out.ax -= (x / r) * push;
    out.ay -= (y / r) * push;
  }
  return out;
}

// ---- combat.js ----


const CRIT_ARMOR = 0.5; // weak-spot hits only need half the armor

function attackPower(speed, stats) {
  return (speed / 100) * stats.atkMult;
}

function isWeakHit(e, hx, hy, arcMult) {
  if (!e.weakArc) return false;
  const a = Math.atan2(hy - e.y, hx - e.x);
  return Math.abs(angleDiff(a, e.facing + e.weakDir)) <= e.weakArc * arcMult;
}

function canPierce(atk, e, crit) {
  return atk >= e.armor * (crit ? CRIT_ARMOR : 1);
}

function resolveRam(atk, e, crit, stats) {
  if (canPierce(atk, e, crit)) {
    const damage = atk * (crit ? stats.critMult : 1);
    return { pierce: true, damage, kill: damage >= e.hp, shipDamage: 0 };
  }
  return { pierce: false, damage: atk * 0.25, kill: false, shipDamage: e.contact };
}

// Share of speed kept after going through an enemy.
function pierceKeep(e, killed, stats) {
  const loss = killed ? 0.004 + e.r * 0.0006 : 0.1 + e.r * 0.002;
  return 1 - Math.min(0.6, loss * stats.pierceLossMult);
}

// ---- enemies.js ----


const BACK = Math.PI;
const SIDE = Math.PI / 2;

// hp/armor/contact are level-1 values; armor is in attack units (speed/100 at x1 multiplier).
const ENEMY_TYPES = {
  drifter: { name: 'ドリフター', r: 14, hp: 6, armor: 2, speed: 130, accel: 2.5, contact: 6, xp: 1, color: '#7fd1ff', shape: 'orb', behavior: 'chase', weakDir: BACK, weakArc: 1.0 },
  swarm: { name: 'スウォーム', r: 11, hp: 3, armor: 1.2, speed: 200, accel: 3, contact: 4, xp: 0.6, color: '#9df0ff', shape: 'dart', behavior: 'chase', weakDir: BACK, weakArc: 1.1 },
  darter: { name: 'ダーター', r: 16, hp: 9, armor: 3.5, speed: 110, accel: 2, contact: 10, xp: 2, color: '#ff9f6b', shape: 'dart', behavior: 'dash', weakDir: BACK, weakArc: 0.9, range: 520, windup: 0.7, dashSpeed: 760, dashTime: 0.55, recover: 0.9 },
  armored: { name: '装甲型', r: 30, hp: 40, armor: 12, speed: 70, accel: 1.2, contact: 16, xp: 6, color: '#9aa7b8', shape: 'hex', behavior: 'chase', weakDir: BACK, weakArc: 0.8, turn: 1.2 },
  splitter: { name: '分裂型', r: 22, hp: 14, armor: 4, speed: 60, accel: 1.5, contact: 8, xp: 2, color: '#a8ff7a', shape: 'blob', behavior: 'split', weakDir: SIDE, weakDir2: -SIDE, weakArc: 0.55, budInterval: 5, maxBuds: 5, turn: 1.5 },
  splitling: { name: '分裂体', r: 10, hp: 3, armor: 1.5, speed: 150, accel: 2.5, contact: 4, xp: 0.4, color: '#cfff9a', shape: 'blob', behavior: 'chase', weakDir: BACK, weakArc: 1.2 },
  leech: { name: '減速型', r: 20, hp: 14, armor: 5, speed: 120, accel: 1.6, contact: 6, xp: 3, color: '#c77dff', shape: 'diamond', behavior: 'leech', weakDir: BACK, weakArc: 0.9, auraR: 210, drain: 0.9, steal: 0.2 },
  gunner: { name: '射撃型', r: 18, hp: 12, armor: 4, speed: 110, accel: 2, contact: 8, xp: 3, color: '#ff6b9a', shape: 'ship', behavior: 'gunner', weakDir: BACK, weakArc: 0.9, keep: 560, fireInterval: 2.2, telegraph: 0.5, bulletSpeed: 430, bulletDmg: 8, slow: 0.12 },
  missile: { name: 'ミサイル艇', r: 22, hp: 20, armor: 6, speed: 85, accel: 1.5, contact: 10, xp: 5, color: '#ffb36b', shape: 'ship', behavior: 'missile', weakDir: SIDE, weakDir2: -SIDE, weakArc: 0.6, keep: 720, fireInterval: 4, telegraph: 0.6, missileSpeed: 520, missileTurn: 2.4, bulletDmg: 12, slow: 0.2 },
  battleship: { name: '戦艦', r: 95, hp: 420, armor: 20, speed: 45, accel: 0.6, contact: 30, xp: 45, color: '#d0d6e8', shape: 'ship', behavior: 'battleship', weakDir: BACK, weakArc: 0.55, turn: 0.5, fireInterval: 1.8, telegraph: 0.5, volley: 7, spread: 0.9, bulletSpeed: 380, bulletDmg: 12, slow: 0.15 },
  meteor: { name: '隕石', r: 40, hp: 20, armor: 5, speed: 40, accel: 0, contact: 10, xp: 1, color: '#8b7a6a', shape: 'rock', behavior: 'drift', weakDir: 0, weakArc: 0 },
};

const MAX_ENEMY_R = 130;

let nextId = 1;

function createEnemy(type, level, x, y, opts = {}) {
  const T = ENEMY_TYPES[type];
  const L = Math.max(1, level);
  const elite = !!opts.elite;
  const size = type === 'meteor' ? (opts.size || T.r) : T.r;
  const sz = size / T.r;
  const hp = T.hp * sz * sz * (1 + 0.6 * (L - 1)) * CONFIG.enemyHpMult * (elite ? 3 : 1);
  return {
    id: nextId++, type, T, level: L, elite,
    x, y, vx: 0, vy: 0,
    r: size * (elite ? 1.25 : 1),
    hp, maxHp: hp,
    armor: T.armor * sz * (1 + 0.35 * (L - 1)) * CONFIG.enemyArmorMult * (elite ? 1.3 : 1),
    contact: T.contact * (1 + 0.3 * (L - 1)),
    xp: T.xp * sz * (1 + 0.5 * (L - 1)) * (elite ? 4 : 1),
    speed: T.speed * (1 + 0.04 * (L - 1)),
    facing: opts.facing ?? 0,
    weakDir: T.weakDir, weakDir2: T.weakDir2, weakArc: T.weakArc || 0,
    hitCD: 0, flash: 0, dead: false,
    state: 'move', timer: 0, fireT: (T.fireInterval || 0) * (0.5 + Math.random() * 0.5), charge: 0, budT: 0, buds: 0, age: 0,
    parent: opts.parent || 0,
    spin: opts.spin || 0,
  };
}

function steerTo(e, tx, ty, speed, accel, dt) {
  const dx = tx - e.x, dy = ty - e.y;
  const d = Math.hypot(dx, dy) || 1;
  const k = Math.min(1, accel * dt);
  e.vx += ((dx / d) * speed - e.vx) * k;
  e.vy += ((dy / d) * speed - e.vy) * k;
}

function turnToward(e, target, rate, dt) {
  let d = target - e.facing;
  d = Math.atan2(Math.sin(d), Math.cos(d));
  const m = rate * dt;
  e.facing += Math.max(-m, Math.min(m, d));
}

function angleToShip(e, game) {
  return Math.atan2(game.ship.y - e.y, game.ship.x - e.x);
}

// Hold a ring around the ship at `keep` distance while circling it.
function keepDistance(e, game, dt) {
  const sh = game.ship;
  const dx = e.x - sh.x, dy = e.y - sh.y;
  const d = Math.hypot(dx, dy) || 1;
  const side = e.id % 2 ? 1 : -1;
  const tx = sh.x + (dx / d) * e.T.keep - (dy / d) * 200 * side;
  const ty = sh.y + (dy / d) * e.T.keep + (dx / d) * 200 * side;
  steerTo(e, tx, ty, e.speed, e.T.accel, dt);
  turnToward(e, angleToShip(e, game), 3, dt);
}

function fire(game, e, angle, speed, kind) {
  const T = e.T;
  const lv = 1 + 0.25 * (e.level - 1);
  game.ebullets.push({
    kind, x: e.x + Math.cos(angle) * e.r, y: e.y + Math.sin(angle) * e.r,
    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, speed,
    r: kind === 'missile' ? 9 : 7, dmg: T.bulletDmg * lv, slow: T.slow, life: kind === 'missile' ? 6 : 4,
    turn: T.missileTurn || 0,
  });
  game.events.push({ type: 'shoot', x: e.x, y: e.y, kind });
}

// Count down to a shot; `charge` > 0 while telegraphing.
function gunTimer(e, dt) {
  e.fireT -= dt;
  e.charge = e.fireT < e.T.telegraph ? 1 - Math.max(0, e.fireT) / e.T.telegraph : 0;
  if (e.fireT <= 0) { e.fireT = e.T.fireInterval; return true; }
  return false;
}

const BEHAVIORS = {
  chase(e, game, dt) {
    const sh = game.ship;
    steerTo(e, sh.x, sh.y, e.speed, e.T.accel || 2, dt);
    turnToward(e, angleToShip(e, game), e.T.turn || 4, dt);
  },
  dash(e, game, dt) {
    const T = e.T;
    const sh = game.ship;
    const d = Math.hypot(sh.x - e.x, sh.y - e.y);
    e.timer -= dt;
    if (e.state === 'move') {
      BEHAVIORS.chase(e, game, dt);
      if (d < T.range) { e.state = 'windup'; e.timer = T.windup; }
    } else if (e.state === 'windup') {
      e.vx *= 1 - 4 * dt; e.vy *= 1 - 4 * dt;
      turnToward(e, angleToShip(e, game), 6, dt);
      if (e.timer <= 0) {
        e.state = 'dash'; e.timer = T.dashTime;
        e.vx = Math.cos(e.facing) * T.dashSpeed; e.vy = Math.sin(e.facing) * T.dashSpeed;
      }
    } else if (e.state === 'dash') {
      if (e.timer <= 0) { e.state = 'recover'; e.timer = T.recover; }
    } else {
      e.vx *= 1 - 2 * dt; e.vy *= 1 - 2 * dt;
      if (e.timer <= 0) e.state = 'move';
    }
  },
  split(e, game, dt) {
    BEHAVIORS.chase(e, game, dt);
    e.budT += dt;
    if (e.budT >= e.T.budInterval) {
      e.budT = 0;
      if (e.buds < e.T.maxBuds) {
        e.buds++;
        const a = game.rng() * Math.PI * 2;
        game.newEnemies.push(createEnemy('splitling', e.level, e.x + Math.cos(a) * e.r * 1.5, e.y + Math.sin(a) * e.r * 1.5, { parent: e.id, facing: a }));
      }
    }
  },
  leech(e, game, dt) {
    BEHAVIORS.chase(e, game, dt);
    const sh = game.ship;
    const d = Math.hypot(sh.x - e.x, sh.y - e.y);
    if (d < e.T.auraR) game.leechDrag += e.T.drain * (1 - d / e.T.auraR * 0.5);
  },
  gunner(e, game, dt) {
    keepDistance(e, game, dt);
    if (gunTimer(e, dt)) fire(game, e, angleToShip(e, game), e.T.bulletSpeed, 'bullet');
  },
  missile(e, game, dt) {
    keepDistance(e, game, dt);
    if (gunTimer(e, dt)) fire(game, e, e.facing, e.T.missileSpeed, 'missile');
  },
  battleship(e, game, dt) {
    BEHAVIORS.chase(e, game, dt);
    if (gunTimer(e, dt)) {
      const base = angleToShip(e, game);
      const n = e.T.volley;
      for (let i = 0; i < n; i++) fire(game, e, base + (i / (n - 1) - 0.5) * e.T.spread, e.T.bulletSpeed, 'bullet');
    }
  },
  drift(e, game, dt) {
    e.facing += e.spin * dt;
  },
};

function onEnemyDeath(e, game) {
  if (e.type === 'splitter') {
    for (let i = 0; i < 2; i++) {
      const a = e.facing + (i ? 1 : -1) * Math.PI / 2;
      const c = createEnemy('splitling', e.level, e.x + Math.cos(a) * e.r, e.y + Math.sin(a) * e.r, { facing: a });
      c.vx = Math.cos(a) * 200; c.vy = Math.sin(a) * 200;
      c.hitCD = 0.35;
      game.newEnemies.push(c);
    }
  }
}

function updateEnemy(e, game, dt) {
  e.age += dt;
  if (e.hitCD > 0) e.hitCD -= dt;
  if (e.flash > 0) e.flash -= dt;
  BEHAVIORS[e.T.behavior](e, game, dt);
  e.x += e.vx * dt;
  e.y += e.vy * dt;
  // stay out of the planet
  const p = game.field.planet;
  const d = Math.hypot(e.x - p.x, e.y - p.y);
  if (d < p.r + e.r && d > 0) {
    e.x = p.x + ((e.x - p.x) / d) * (p.r + e.r);
    e.y = p.y + ((e.y - p.y) / d) * (p.r + e.r);
  }
}

// ---- projectiles.js ----


// Enemy bullets and missiles. Returns hits on the ship via the callback.
function updateEnemyBullets(game, dt, onHit) {
  const sh = game.ship;
  const R = CONFIG.shipRadius;
  const p = game.field.planet;
  for (const b of game.ebullets) {
    if (b.kind === 'missile') {
      const want = Math.atan2(sh.y - b.y, sh.x - b.x);
      const cur = Math.atan2(b.vy, b.vx);
      let d = want - cur;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      const a = cur + Math.max(-b.turn * dt, Math.min(b.turn * dt, d));
      b.vx = Math.cos(a) * b.speed; b.vy = Math.sin(a) * b.speed;
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;
    const dx = b.x - sh.x, dy = b.y - sh.y;
    if (dx * dx + dy * dy < (b.r + R) * (b.r + R)) { onHit(b); b.life = 0; }
    if (Math.hypot(b.x - p.x, b.y - p.y) < p.r) b.life = 0;
  }
  if (game.ebullets.some((b) => b.life <= 0)) game.ebullets = game.ebullets.filter((b) => b.life > 0);
}

// ---- grid.js ----
const OFF = 4096;

function buildGrid(list, cell) {
  const map = new Map();
  for (const it of list) {
    if (it.dead) continue;
    const key = (Math.floor(it.x / cell) + OFF) * 8192 + (Math.floor(it.y / cell) + OFF);
    let arr = map.get(key);
    if (!arr) { arr = []; map.set(key, arr); }
    arr.push(it);
  }
  return { cell, map };
}

function queryGrid(grid, x0, y0, x1, y1, cb) {
  const c = grid.cell;
  const cx0 = Math.floor(x0 / c), cx1 = Math.floor(x1 / c);
  const cy0 = Math.floor(y0 / c), cy1 = Math.floor(y1 / c);
  for (let cx = cx0; cx <= cx1; cx++) {
    for (let cy = cy0; cy <= cy1; cy++) {
      const arr = grid.map.get((cx + OFF) * 8192 + (cy + OFF));
      if (!arr) continue;
      for (const it of arr) if (!it.dead) cb(it);
    }
  }
}

function queryRadius(grid, x, y, r, cb) {
  queryGrid(grid, x - r, y - r, x + r, y + r, (it) => {
    const dx = it.x - x, dy = it.y - y, rr = r + (it.r || 0);
    if (dx * dx + dy * dy <= rr * rr) cb(it);
  });
}

// Temporary population keeper (replaced by the phase table in Task 6).
function updateSpawner(game, dt) {
  if (!game.spawning) return;
  const want = 30;
  if (game.enemies.length >= want) return;
  const sh = game.ship;
  const a = game.rng() * TAU;
  const d = game.viewRadius + 150 + game.rng() * 300;
  const x = sh.x + Math.cos(a) * d, y = sh.y + Math.sin(a) * d;
  if (Math.hypot(x, y) > CONFIG.fieldRadius || Math.hypot(x, y) < CONFIG.planetRadius + 100) return;
  const type = game.rng() < 0.15 ? 'armored' : 'drifter';
  game.enemies.push(createEnemy(type, 1, x, y, { facing: a + Math.PI }));
}

// ---- world.js ----












const STEP = 1 / 120;

function createGame(opts = {}) {
  const meta = opts.meta || {};
  const seed = opts.seed ?? (Math.random() * 4294967296) >>> 0;
  const stats = baseStats(meta);
  const rng = makeRng(seed);
  const ship = createShip(stats, -CONFIG.startRadius, 0);
  ship.vy = -CONFIG.baseMaxSpeed * 0.3; // start drifting along the orbit
  return {
    t: 0, acc: 0, seed, rng,
    meta, stats, ship,
    field: createField(rng),
    debug: { invincible: false },
    enemies: [],
    newEnemies: [],
    ebullets: [],
    leechDrag: 0,
    grid: buildGrid([], 160),
    fx: { particles: [], rings: [], texts: [] },
    kills: 0,
    hitstop: 0,
    spawning: true,
    dashPierce: 0,
    state: 'play',
    timeScale: 1,
    releasePending: null,
    dashId: 0,
    peakSpeed: 0,
    events: [],
    viewRadius: 1400,
  };
}

function update(game, frameDt, input) {
  if (game.state !== 'play') return;
  if (input.release) game.releasePending = { x: input.aimX, y: input.aimY };
  frameDt = Math.min(frameDt, 0.1);
  updateFx(game, frameDt);
  if (game.hitstop > 0) { game.hitstop -= frameDt; return; }
  game.acc += frameDt * game.timeScale;
  while (game.acc >= STEP) {
    game.acc -= STEP;
    step(game, STEP, input);
    if (game.state !== 'play') break;
  }
}

function step(game, dt, input) {
  const sh = game.ship;
  const stats = game.stats;
  game.t += dt;

  if (input.charging && !game.releasePending) {
    if (!sh.charging) { sh.charging = true; sh.chargeT = 0; }
    sh.chargeT += dt;
    sh.gauge = computeGauge(sh.chargeT, stats, sh.gaugeBank);
    sh.aimX = input.aimX; sh.aimY = input.aimY;
  }
  if (game.releasePending) {
    const r = game.releasePending;
    game.releasePending = null;
    if (sh.charging) launch(game, r.x, r.y);
    sh.charging = false;
  }

  updateMoons(game.field, game.t);
  game.leechDrag = 0;
  for (const e of game.enemies) updateEnemy(e, game, dt);
  flushNewEnemies(game);
  separateEnemies(game);
  game.grid = buildGrid(game.enemies, 160);

  const g = gravityAt(game.field, game.t, sh.x, sh.y);
  const drag = dustDragAt(game.field, sh.x, sh.y) + game.leechDrag;
  const x0 = sh.x, y0 = sh.y;
  stepShip(sh, stats, dt, g.ax, g.ay, drag);
  collideEnemies(game, x0, y0);
  collideBodies(game);
  updateEnemyBullets(game, dt, (b) => damageShip(game, b.dmg, b.slow));
  if (game.enemies.some((e) => e.dead)) game.enemies = game.enemies.filter((e) => !e.dead);
  flushNewEnemies(game);
  updateSpawner(game, dt);
  if (sh.invulnT > 0) sh.invulnT -= dt;

  const sp = Math.hypot(sh.vx, sh.vy);
  if (sp > game.peakSpeed) game.peakSpeed = sp;
  recordTrail(sh, dt);
}

function launch(game, ax, ay) {
  const sh = game.ship;
  const len = Math.hypot(ax, ay);
  let dx, dy;
  if (len < CONFIG.minDrag) {
    const sp = Math.hypot(sh.vx, sh.vy);
    if (sp < 1) return;
    dx = sh.vx / sp; dy = sh.vy / sp;
  } else {
    dx = ax / len; dy = ay / len;
  }
  const v = launchVelocity(sh.vx, sh.vy, dx, dy, sh.gauge, game.stats);
  sh.vx = v.vx; sh.vy = v.vy;
  sh.boostT = game.stats.boostDuration;
  sh.gaugeBank = 0;
  game.dashId++;
  game.dashPierce = 0;
  game.events.push({ type: 'launch', gauge: sh.gauge, x: sh.x, y: sh.y, dx, dy });
}

function flushNewEnemies(game) {
  if (!game.newEnemies.length) return;
  for (const e of game.newEnemies) game.enemies.push(e);
  game.newEnemies.length = 0;
}

function separateEnemies(game) {
  const grid = buildGrid(game.enemies, 120);
  for (const e of game.enemies) {
    queryGrid(grid, e.x - e.r - 40, e.y - e.r - 40, e.x + e.r + 40, e.y + e.r + 40, (o) => {
      if (o.id <= e.id) return;
      const dx = o.x - e.x, dy = o.y - e.y;
      const min = (e.r + o.r) * 0.9;
      const d2 = dx * dx + dy * dy;
      if (d2 >= min * min || d2 === 0) return;
      const d = Math.sqrt(d2);
      const push = (min - d) * 0.5;
      const wE = o.r * o.r / (e.r * e.r + o.r * o.r);
      e.x -= (dx / d) * push * 2 * wE; e.y -= (dy / d) * push * 2 * wE;
      o.x += (dx / d) * push * 2 * (1 - wE); o.y += (dy / d) * push * 2 * (1 - wE);
    });
  }
}

function collideEnemies(game, x0, y0) {
  const sh = game.ship, stats = game.stats;
  const x1 = sh.x, y1 = sh.y;
  const R = CONFIG.shipRadius;
  const pad = R + MAX_ENEMY_R;
  const hits = [];
  queryGrid(game.grid, Math.min(x0, x1) - pad, Math.min(y0, y1) - pad, Math.max(x0, x1) + pad, Math.max(y0, y1) + pad, (e) => {
    if (e.hitCD > 0) return;
    const t = segCircleT(x0, y0, x1, y1, e.x, e.y, e.r + R);
    if (t >= 0) hits.push({ e, t });
  });
  if (!hits.length) return;
  hits.sort((a, b) => a.t - b.t);
  for (const { e, t } of hits) {
    const hx = x0 + (x1 - x0) * t, hy = y0 + (y1 - y0) * t;
    const sp = Math.hypot(sh.vx, sh.vy);
    const ux = sp > 0 ? sh.vx / sp : 0, uy = sp > 0 ? sh.vy / sp : 0;
    const atk = attackPower(sp, stats);
    const crit = isWeakHit(e, hx, hy, stats.weakArcMult);
    const res = resolveRam(atk, e, crit, stats);
    if (res.pierce) {
      damageEnemy(game, e, res.damage, { crit, cause: 'ram', dirX: ux, dirY: uy });
      e.hitCD = 0.3;
      const keep = pierceKeep(e, e.dead, stats);
      sh.vx *= keep; sh.vy *= keep;
      game.dashPierce++;
      if (e.T.steal) { const k = 1 - e.T.steal * game.stats.hitSlowMult; sh.vx *= k; sh.vy *= k; game.events.push({ type: 'drain', x: e.x, y: e.y }); }
      if (crit) game.hitstop = Math.max(game.hitstop, e.dead ? 0.05 : 0.035);
      continue;
    }
    // bounce off
    let nx = hx - e.x, ny = hy - e.y;
    const nd = Math.hypot(nx, ny) || 1;
    nx /= nd; ny /= nd;
    sh.x = e.x + nx * (e.r + R + 1);
    sh.y = e.y + ny * (e.r + R + 1);
    const vn = sh.vx * nx + sh.vy * ny;
    if (vn < 0) { sh.vx -= 2 * vn * nx; sh.vy -= 2 * vn * ny; }
    const keep = stats.bounceKeep;
    sh.vx *= keep; sh.vy *= keep;
    if (Math.hypot(sh.vx, sh.vy) < 220) { sh.vx = nx * 220; sh.vy = ny * 220; }
    sh.boostT = 0;
    damageEnemy(game, e, res.damage, { crit, cause: 'bump', dirX: -nx, dirY: -ny });
    e.hitCD = 0.25;
    e.vx -= nx * 120; e.vy -= ny * 120;
    damageShip(game, res.shipDamage * stats.bounceDamageMult, 0);
    game.events.push({ type: 'bounce', x: sh.x, y: sh.y });
    break;
  }
}

function damageEnemy(game, e, dmg, opts = {}) {
  if (e.dead || dmg <= 0) return;
  e.hp -= dmg;
  e.flash = 0.12;
  game.events.push({ type: 'hit', x: e.x, y: e.y, crit: !!opts.crit, dmg, cause: opts.cause });
  if (opts.crit) addText(game, e.x, e.y - e.r - 10, 'CRIT', '#ffe46b');
  if (e.hp <= 0) {
    killEnemy(game, e, opts);
  } else if (opts.dirX !== undefined) {
    e.vx += opts.dirX * 160; e.vy += opts.dirY * 160;
  }
}

function killEnemy(game, e, opts = {}) {
  if (e.dead) return;
  e.dead = true;
  game.kills++;
  game.events.push({ type: 'kill', x: e.x, y: e.y, r: e.r, crit: !!opts.crit, enemyType: e.type, elite: e.elite, cause: opts.cause });
  burst(game, e.x, e.y, e.T.color, 6 + Math.round(e.r / 3), opts.dirX || 0, opts.dirY || 0, 260 + e.r * 4);
  onEnemyDeath(e, game);
}

function burst(game, x, y, color, n, dx, dy, speed) {
  const P = game.fx.particles;
  if (P.length > 1600) return;
  for (let i = 0; i < n; i++) {
    const a = game.rng() * Math.PI * 2;
    const s = speed * (0.3 + game.rng());
    P.push({
      x, y,
      vx: Math.cos(a) * s * 0.6 + dx * s * 0.8,
      vy: Math.sin(a) * s * 0.6 + dy * s * 0.8,
      life: 0.5 + game.rng() * 0.4, max: 0.9, color, size: 2 + game.rng() * 4,
    });
  }
}

function addText(game, x, y, text, color) {
  if (game.fx.texts.length > 40) game.fx.texts.shift();
  game.fx.texts.push({ x, y, text, color, life: 0.7 });
}

function addRing(game, x, y, radius, color, life = 0.45) {
  game.fx.rings.push({ x, y, radius, color, life, max: life });
}

function updateFx(game, dt) {
  const P = game.fx.particles;
  for (const p of P) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - 2.5 * dt; p.vy *= 1 - 2.5 * dt; p.life -= dt; }
  game.fx.particles = P.filter((p) => p.life > 0);
  for (const t of game.fx.texts) { t.y -= 40 * dt; t.life -= dt; }
  game.fx.texts = game.fx.texts.filter((t) => t.life > 0);
  for (const r of game.fx.rings) r.life -= dt;
  game.fx.rings = game.fx.rings.filter((r) => r.life > 0);
}

// Marks predicted points that cross a weak spot (hot) and stops at the first enemy that would block.
function annotatePrediction(game, pts) {
  const R = CONFIG.shipRadius;
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    let block = false;
    queryGrid(game.grid, p.x - R - MAX_ENEMY_R, p.y - R - MAX_ENEMY_R, p.x + R + MAX_ENEMY_R, p.y + R + MAX_ENEMY_R, (e) => {
      const dx = p.x - e.x, dy = p.y - e.y;
      const rr = e.r + R;
      if (dx * dx + dy * dy > rr * rr) return;
      const crit = isWeakHit(e, p.x, p.y, game.stats.weakArcMult);
      if (crit) p.hot = true;
      if (!canPierce(attackPower(p.sp, game.stats), e, crit)) block = true;
    });
    out.push(p);
    if (block) { p.block = true; break; }
  }
  return out;
}

function collideBodies(game) {
  const sh = game.ship;
  const R = CONFIG.shipRadius;
  const f = game.field;
  for (const b of [f.planet, ...f.moons]) {
    const dx = sh.x - b.x, dy = sh.y - b.y;
    const d = Math.hypot(dx, dy);
    const min = b.r + R;
    if (d >= min || d === 0) continue;
    const nx = dx / d, ny = dy / d;
    sh.x = b.x + nx * min;
    sh.y = b.y + ny * min;
    const vn = sh.vx * nx + sh.vy * ny;
    if (vn < 0) {
      sh.vx -= (1 + CONFIG.crashRestitution) * vn * nx;
      sh.vy -= (1 + CONFIG.crashRestitution) * vn * ny;
      const dmg = Math.max(0, -vn - 200) * CONFIG.crashDamage;
      if (dmg > 0) damageShip(game, dmg, 0);
      game.events.push({ type: 'crash', x: sh.x, y: sh.y, power: -vn });
    }
  }
  // hard wall well outside the soft boundary
  const r = Math.hypot(sh.x, sh.y);
  const wall = CONFIG.fieldRadius + 500;
  if (r > wall) {
    const nx = sh.x / r, ny = sh.y / r;
    sh.x = nx * wall; sh.y = ny * wall;
    const vn = sh.vx * nx + sh.vy * ny;
    if (vn > 0) { sh.vx -= 2 * vn * nx; sh.vy -= 2 * vn * ny; }
  }
}

// amount: hp lost, slow: share of speed lost (0..1)
function damageShip(game, amount, slow) {
  const sh = game.ship;
  if (sh.invulnT > 0 || game.debug.invincible) return false;
  sh.hp -= amount * game.stats.damageTakenMult;
  const k = 1 - Math.min(0.9, slow * game.stats.hitSlowMult);
  sh.vx *= k; sh.vy *= k;
  sh.invulnT = CONFIG.invulnTime;
  game.events.push({ type: 'hurt', amount, x: sh.x, y: sh.y });
  addText(game, sh.x, sh.y - 30, `-${Math.round(amount * game.stats.damageTakenMult)}`, '#ff6b5a');
  return true;
}

// Ballistic preview of a launch along (dx, dy) with the given gauge, under gravity only.
function predictPath(game, dx, dy, gauge, seconds) {
  const sh = game.ship;
  const len = Math.hypot(dx, dy) || 1;
  const v = launchVelocity(sh.vx, sh.vy, dx / len, dy / len, gauge, game.stats);
  const ghost = { x: sh.x, y: sh.y, vx: v.vx, vy: v.vy, boostT: game.stats.boostDuration };
  const pts = [];
  const h = 1 / 60;
  const moons = game.field.moons.map((m) => ({ ...m }));
  const field = { ...game.field, moons };
  for (let t = 0; t < seconds; t += h) {
    updateMoons(field, game.t + t);
    const g = gravityAt(field, game.t + t, ghost.x, ghost.y);
    stepShip(ghost, game.stats, h, g.ax, g.ay, 0);
    pts.push({ x: ghost.x, y: ghost.y, sp: Math.hypot(ghost.vx, ghost.vy) });
    if (Math.hypot(ghost.x, ghost.y) < CONFIG.planetRadius + CONFIG.shipRadius) break;
  }
  return pts;
}

function recordTrail(sh, dt) {
  sh.trailAcc += dt;
  if (sh.trailAcc < 1 / 60) return;
  sh.trailAcc = 0;
  sh.trail.push({ x: sh.x, y: sh.y });
  if (sh.trail.length > 150) sh.trail.shift();
}

function shipSpeed(game) {
  return Math.hypot(game.ship.vx, game.ship.vy);
}

const STAR_TILE = 1600;
const MONO = 'ui-monospace, Menlo, monospace';

function createRenderer(canvas) {
  const ctx = canvas.getContext('2d');
  const rng = makeRng(7);
  const layers = [0.06, 0.16, 0.35].map((p, i) => ({
    p,
    stars: Array.from({ length: 110 - i * 25 }, () => ({ x: rng() * STAR_TILE, y: rng() * STAR_TILE, s: 0.6 + rng() * (0.6 + i * 0.6), a: 0.25 + rng() * 0.6 })),
  }));
  return { canvas, ctx, layers, cam: { x: 0, y: 0, zoom: 1, ready: false }, W: 0, H: 0, dpr: 1, shake: 0, flash: 0 };
}

function resizeRenderer(r) {
  r.dpr = Math.min(window.devicePixelRatio || 1, 2);
  r.W = window.innerWidth;
  r.H = window.innerHeight;
  r.canvas.width = Math.floor(r.W * r.dpr);
  r.canvas.height = Math.floor(r.H * r.dpr);
}

function worldToScreen(r, x, y) {
  return { x: (x - r.cam.x) * r.cam.zoom + r.W / 2, y: (y - r.cam.y) * r.cam.zoom + r.H / 2 };
}

function speedZoom(sp) {
  const f = Math.pow(CONFIG.zoomRefSpeed / Math.max(CONFIG.zoomRefSpeed, sp), CONFIG.zoomExp);
  return clamp(f, CONFIG.zoomMin, 1);
}

function updateCamera(r, game, dt) {
  const sh = game.ship;
  const sp = Math.hypot(sh.vx, sh.vy);
  const base = Math.min(r.W, r.H) / CONFIG.baseView;
  const zoomT = base * speedZoom(sp);
  const tx = sh.x + sh.vx * CONFIG.lookAhead;
  const ty = sh.y + sh.vy * CONFIG.lookAhead;
  const cam = r.cam;
  if (!cam.ready) { cam.x = tx; cam.y = ty; cam.zoom = zoomT; cam.ready = true; }
  const kp = 1 - Math.exp(-7 * dt);
  const kz = 1 - Math.exp(-2.2 * dt);
  cam.x += (tx - cam.x) * kp;
  cam.y += (ty - cam.y) * kp;
  cam.zoom += (zoomT - cam.zoom) * kz;
  game.viewRadius = Math.hypot(r.W, r.H) / 2 / cam.zoom;
}

function render(r, game, dt, pointer) {
  const { ctx } = r;
  updateCamera(r, game, dt);
  ctx.setTransform(r.dpr, 0, 0, r.dpr, 0, 0);
  drawBackground(r, game);

  ctx.save();
  let sx = 0, sy = 0;
  if (r.shake > 0) {
    sx = (Math.random() - 0.5) * r.shake;
    sy = (Math.random() - 0.5) * r.shake;
    r.shake = Math.max(0, r.shake - dt * 60);
  }
  ctx.translate(r.W / 2 + sx, r.H / 2 + sy);
  ctx.scale(r.cam.zoom, r.cam.zoom);
  ctx.translate(-r.cam.x, -r.cam.y);
  drawZones(r);
  drawDust(r, game);
  drawSpecks(r);
  drawBodies(r, game);
  drawEnemies(r, game);
  drawEnemyBullets(r, game);
  drawPrediction(r, game);
  drawTrail(r, game);
  drawShip(r, game);
  drawFx(r, game);
  ctx.restore();

  drawChargeUi(r, game, pointer);
  drawHud(r, game);
  drawMinimap(r, game);
}

function drawZones(r) {
  const { ctx } = r;
  const z = r.cam.zoom;
  const g = ctx.createRadialGradient(0, 0, CONFIG.planetRadius, 0, 0, CONFIG.zoneInner);
  g.addColorStop(0, 'rgba(255,70,50,0.16)');
  g.addColorStop(1, 'rgba(255,70,50,0.02)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.zoneInner, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(150,70,255,0.07)';
  ctx.beginPath();
  ctx.arc(0, 0, CONFIG.fieldRadius, 0, TAU);
  ctx.arc(0, 0, CONFIG.zoneOuter, 0, TAU, true);
  ctx.fill();
  ctx.lineWidth = 2 / z;
  ctx.setLineDash([30 / z, 24 / z]);
  ctx.strokeStyle = 'rgba(255,110,90,0.35)';
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.zoneInner, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(170,120,255,0.35)';
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.zoneOuter, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.lineWidth = 6 / z;
  ctx.strokeStyle = 'rgba(190,120,255,0.8)';
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.fieldRadius, 0, TAU); ctx.stroke();
}

function drawDust(r, game) {
  const { ctx } = r;
  for (const d of game.field.dust) {
    if (!onScreen(r, d.x, d.y, d.r)) continue;
    const g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r);
    g.addColorStop(0, 'rgba(170,130,210,0.20)');
    g.addColorStop(0.7, 'rgba(140,100,190,0.10)');
    g.addColorStop(1, 'rgba(140,100,190,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill();
  }
}

function onScreen(r, x, y, rad) {
  const halfW = r.W / 2 / r.cam.zoom + rad, halfH = r.H / 2 / r.cam.zoom + rad;
  return Math.abs(x - r.cam.x) < halfW && Math.abs(y - r.cam.y) < halfH;
}

function drawBodies(r, game) {
  const { ctx } = r;
  const p = game.field.planet;
  if (onScreen(r, p.x, p.y, p.r * 1.6)) {
    const halo = ctx.createRadialGradient(0, 0, p.r * 0.9, 0, 0, p.r * 1.6);
    halo.addColorStop(0, 'rgba(90,160,255,0.45)');
    halo.addColorStop(1, 'rgba(90,160,255,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(0, 0, p.r * 1.6, 0, TAU); ctx.fill();
    const body = ctx.createRadialGradient(-p.r * 0.35, -p.r * 0.35, p.r * 0.1, 0, 0, p.r);
    body.addColorStop(0, '#6a8cff');
    body.addColorStop(0.6, '#2b3d8f');
    body.addColorStop(1, '#0d1238');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(0, 0, p.r, 0, TAU); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, p.r, 0, TAU); ctx.clip();
    ctx.strokeStyle = 'rgba(160,190,255,0.12)';
    ctx.lineWidth = p.r * 0.08;
    for (let i = -3; i <= 3; i++) {
      ctx.beginPath(); ctx.ellipse(0, i * p.r * 0.25, p.r * 1.1, p.r * 0.06, 0.15, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  }
  for (const m of game.field.moons) {
    if (!onScreen(r, m.x, m.y, m.r * 3)) continue;
    const halo = ctx.createRadialGradient(m.x, m.y, m.r, m.x, m.y, m.r * 3);
    halo.addColorStop(0, 'rgba(200,170,120,0.12)');
    halo.addColorStop(1, 'rgba(200,170,120,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r * 3, 0, TAU); ctx.fill();
    const body = ctx.createRadialGradient(m.x - m.r * 0.3, m.y - m.r * 0.3, m.r * 0.1, m.x, m.y, m.r);
    body.addColorStop(0, '#b9a58a');
    body.addColorStop(1, '#4a3d33');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    for (let k = 0; k < 4; k++) {
      const a = k * 1.9 + m.orbit, d = m.r * (0.2 + 0.15 * k);
      ctx.beginPath(); ctx.arc(m.x + Math.cos(a) * d, m.y + Math.sin(a) * d, m.r * 0.16, 0, TAU); ctx.fill();
    }
  }
}

function drawPrediction(r, game) {
  const sh = game.ship;
  if (!sh.charging) return;
  let ax = sh.aimX, ay = sh.aimY;
  if (Math.hypot(ax, ay) < CONFIG.minDrag) { ax = sh.vx; ay = sh.vy; }
  if (Math.hypot(ax, ay) < 1) return;
  const pts = annotatePrediction(game, predictPath(game, ax, ay, sh.gauge, game.stats.predictTime));
  const { ctx } = r;
  const dot = 3.2 / r.cam.zoom;
  for (let i = 2; i < pts.length; i += 3) {
    const p = pts[i];
    ctx.globalAlpha = 0.85 * (1 - i / pts.length) + 0.1;
    ctx.fillStyle = p.hot ? '#ffe46b' : '#9fe8ff';
    const s = p.hot ? dot * 2 : dot;
    ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const end = pts[pts.length - 1];
  if (end && end.block) {
    const k = 10 / r.cam.zoom;
    ctx.strokeStyle = '#ff4d4d';
    ctx.lineWidth = 3 / r.cam.zoom;
    ctx.beginPath();
    ctx.moveTo(end.x - k, end.y - k); ctx.lineTo(end.x + k, end.y + k);
    ctx.moveTo(end.x + k, end.y - k); ctx.lineTo(end.x - k, end.y + k);
    ctx.stroke();
  }
}

function shapePath(ctx, shape, R) {
  ctx.beginPath();
  if (shape === 'hex') {
    for (let i = 0; i < 6; i++) { const a = i * TAU / 6; ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R); }
    ctx.closePath();
  } else if (shape === 'dart') {
    ctx.moveTo(R * 1.2, 0); ctx.lineTo(-R * 0.8, R * 0.8); ctx.lineTo(-R * 0.4, 0); ctx.lineTo(-R * 0.8, -R * 0.8); ctx.closePath();
  } else if (shape === 'diamond') {
    ctx.moveTo(R, 0); ctx.lineTo(0, R * 0.8); ctx.lineTo(-R, 0); ctx.lineTo(0, -R * 0.8); ctx.closePath();
  } else if (shape === 'blob') {
    for (let i = 0; i < 10; i++) { const a = i * TAU / 10, k = i % 2 ? 0.82 : 1; ctx.lineTo(Math.cos(a) * R * k, Math.sin(a) * R * k); }
    ctx.closePath();
  } else if (shape === 'ship') {
    ctx.moveTo(R * 1.3, 0); ctx.lineTo(R * 0.3, R * 0.55); ctx.lineTo(-R, R * 0.6); ctx.lineTo(-R * 0.8, 0); ctx.lineTo(-R, -R * 0.6); ctx.lineTo(R * 0.3, -R * 0.55); ctx.closePath();
  } else if (shape === 'rock') {
    for (let i = 0; i < 8; i++) { const a = i * TAU / 8, k = 0.8 + ((i * 37) % 5) * 0.06; ctx.lineTo(Math.cos(a) * R * k, Math.sin(a) * R * k); }
    ctx.closePath();
  } else {
    ctx.arc(0, 0, R, 0, TAU);
  }
}

function drawEnemies(r, game) {
  const { ctx } = r;
  const z = r.cam.zoom;
  const sp = Math.hypot(game.ship.vx, game.ship.vy);
  const atk = attackPower(sp, game.stats);
  const arcMult = game.stats.weakArcMult;
  for (const e of game.enemies) {
    if (!onScreen(r, e.x, e.y, e.r + 220)) continue;
    const R = e.r;
    ctx.save();
    ctx.translate(e.x, e.y);
    if (e.T.auraR) {
      const g = ctx.createRadialGradient(0, 0, R, 0, 0, e.T.auraR);
      g.addColorStop(0, 'rgba(199,125,255,0.22)');
      g.addColorStop(1, 'rgba(199,125,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, e.T.auraR, 0, TAU); ctx.fill();
    }
    if (e.state === 'windup') {
      ctx.strokeStyle = 'rgba(255,90,60,0.7)';
      ctx.lineWidth = 3 / z;
      ctx.setLineDash([12 / z, 8 / z]);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(e.facing) * 500, Math.sin(e.facing) * 500); ctx.stroke();
      ctx.setLineDash([]);
    }
    if (e.charge > 0) {
      ctx.fillStyle = `rgba(255,80,80,${0.25 + 0.5 * e.charge})`;
      ctx.beginPath(); ctx.arc(Math.cos(e.facing) * R, Math.sin(e.facing) * R, (4 + 8 * e.charge) / Math.sqrt(z), 0, TAU); ctx.fill();
    }
    const pierce = atk >= e.armor;
    const critOnly = !pierce && atk >= e.armor * CRIT_ARMOR;
    // body
    ctx.save();
    ctx.rotate(e.facing);
    shapePath(ctx, e.T.shape, R);
    ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.T.color;
    ctx.globalAlpha = pierce ? 1 : 0.8;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.lineWidth = Math.max(1.5 / z, R * 0.08);
    ctx.strokeStyle = e.elite ? '#ffcf4a' : pierce ? 'rgba(255,255,255,0.85)' : 'rgba(40,0,0,0.6)';
    ctx.stroke();
    // eye / nose shows facing
    ctx.fillStyle = '#0b0f1e';
    ctx.beginPath(); ctx.arc(R * 0.45, 0, R * 0.2, 0, TAU); ctx.fill();
    ctx.restore();
    // weak spot
    if (e.weakArc) {
      const wa = e.facing + e.weakDir, half = Math.min(Math.PI, e.weakArc * arcMult);
      const lw = Math.max(4 / z, R * 0.32);
      ctx.strokeStyle = '#ffe46b';
      ctx.lineWidth = lw;
      ctx.beginPath(); ctx.arc(0, 0, R + lw * 0.3, wa - half, wa + half); ctx.stroke();
      if (e.weakDir2 !== undefined) {
        const wb = e.facing + e.weakDir2;
        ctx.beginPath(); ctx.arc(0, 0, R + lw * 0.3, wb - half, wb + half); ctx.stroke();
      }
    }
    // cannot pierce: red ring (orange dashed = only through the weak spot)
    if (!pierce) {
      ctx.lineWidth = 3 / z;
      ctx.strokeStyle = critOnly ? '#ff9f40' : '#ff3b3b';
      if (critOnly) ctx.setLineDash([8 / z, 6 / z]);
      ctx.beginPath(); ctx.arc(0, 0, R + 9 / z + R * 0.2, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    }
    if (e.hp < e.maxHp) {
      const w = Math.max(R * 2, 30 / z), h = 4 / z;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(-w / 2, -R - 16 / z, w, h);
      ctx.fillStyle = '#ff6b5a';
      ctx.fillRect(-w / 2, -R - 16 / z, w * Math.max(0, e.hp / e.maxHp), h);
    }
    ctx.restore();
  }
}

function drawEnemyBullets(r, game) {
  const { ctx } = r;
  const z = r.cam.zoom;
  for (const b of game.ebullets) {
    if (!onScreen(r, b.x, b.y, 40)) continue;
    const s = b.r / Math.sqrt(z);
    if (b.kind === 'missile') {
      const a = Math.atan2(b.vy, b.vx);
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(a);
      ctx.fillStyle = '#ffb36b';
      ctx.beginPath(); ctx.moveTo(s * 1.6, 0); ctx.lineTo(-s, s * 0.7); ctx.lineTo(-s, -s * 0.7); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,200,120,0.5)';
      ctx.beginPath(); ctx.arc(-s * 1.6, 0, s * 0.6, 0, TAU); ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = '#ff5a6e';
      ctx.beginPath(); ctx.arc(b.x, b.y, s, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffd0d6';
      ctx.beginPath(); ctx.arc(b.x, b.y, s * 0.45, 0, TAU); ctx.fill();
    }
  }
}

function drawFx(r, game) {
  const { ctx } = r;
  const z = r.cam.zoom;
  const ps = 1 / Math.sqrt(z);
  for (const p of game.fx.particles) {
    ctx.globalAlpha = Math.min(1, p.life / 0.4);
    ctx.fillStyle = p.color;
    const s = p.size * ps;
    ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
  }
  for (const g of game.fx.rings) {
    const k = 1 - g.life / g.max;
    ctx.globalAlpha = Math.max(0, g.life / g.max);
    ctx.strokeStyle = g.color;
    ctx.lineWidth = (10 * (1 - k) + 2) / z;
    ctx.beginPath(); ctx.arc(g.x, g.y, g.radius * (0.2 + 0.8 * Math.sqrt(k)), 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  ctx.font = `800 ${Math.round(16 / z)}px ${MONO}`;
  for (const t of game.fx.texts) {
    ctx.globalAlpha = Math.min(1, t.life / 0.3);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

function drawMinimap(r, game) {
  const { ctx, W, H } = r;
  const R = Math.min(90, Math.min(W, H) * 0.12);
  const cx = W - R - 16, cy = R + 16;
  const k = R / (CONFIG.fieldRadius + 300);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = 'rgba(8,12,28,0.78)';
  ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(150,70,255,0.16)';
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.fieldRadius * k, 0, TAU); ctx.arc(0, 0, CONFIG.zoneOuter * k, 0, TAU, true); ctx.fill();
  ctx.fillStyle = 'rgba(255,70,50,0.18)';
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.zoneInner * k, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(190,120,255,0.8)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.fieldRadius * k, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#4a68d8';
  ctx.beginPath(); ctx.arc(0, 0, Math.max(3, CONFIG.planetRadius * k), 0, TAU); ctx.fill();
  ctx.fillStyle = '#a08a6c';
  for (const m of game.field.moons) { ctx.beginPath(); ctx.arc(m.x * k, m.y * k, 2.2, 0, TAU); ctx.fill(); }
  if (r.minimapExtra) r.minimapExtra(ctx, k, game);
  const sh = game.ship;
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(sh.x * k, sh.y * k, game.viewRadius * k, 0, TAU); ctx.stroke();
  ctx.strokeStyle = '#5fd8ff';
  ctx.beginPath(); ctx.moveTo(sh.x * k, sh.y * k); ctx.lineTo((sh.x + sh.vx * 1.5) * k, (sh.y + sh.vy * 1.5) * k); ctx.stroke();
  ctx.fillStyle = '#e8f6ff';
  ctx.beginPath(); ctx.arc(sh.x * k, sh.y * k, 3, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawBackground(r, game) {
  const { ctx, W, H } = r;
  ctx.fillStyle = '#04050b';
  ctx.fillRect(0, 0, W, H);
  const sh = game.ship;
  const vx = sh.vx, vy = sh.vy;
  for (const L of r.layers) {
    const ox = ((-r.cam.x * L.p) % STAR_TILE + STAR_TILE) % STAR_TILE;
    const oy = ((-r.cam.y * L.p) % STAR_TILE + STAR_TILE) % STAR_TILE;
    const stretch = Math.min(260, Math.hypot(vx, vy) * L.p * 0.05);
    const sp = Math.hypot(vx, vy) || 1;
    const ux = -vx / sp, uy = -vy / sp;
    ctx.strokeStyle = '#cfe0ff';
    ctx.fillStyle = '#cfe0ff';
    for (const s of L.stars) {
      for (let tx = -STAR_TILE; tx < W + STAR_TILE; tx += STAR_TILE) {
        const x = s.x + ox + tx - STAR_TILE;
        if (x < -20 || x > W + 20) continue;
        for (let ty = -STAR_TILE; ty < H + STAR_TILE; ty += STAR_TILE) {
          const y = s.y + oy + ty - STAR_TILE;
          if (y < -20 || y > H + 20) continue;
          ctx.globalAlpha = s.a;
          if (stretch > 2) {
            ctx.lineWidth = s.s;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + ux * stretch, y + uy * stretch);
            ctx.stroke();
          } else {
            ctx.fillRect(x, y, s.s, s.s);
          }
        }
      }
    }
  }
  ctx.globalAlpha = 1;
}

// Procedural dust specks in world space: the main cue for how fast the world flows by.
function drawSpecks(r) {
  const { ctx, cam } = r;
  const cell = 420;
  const halfW = r.W / 2 / cam.zoom, halfH = r.H / 2 / cam.zoom;
  const x0 = Math.floor((cam.x - halfW) / cell), x1 = Math.floor((cam.x + halfW) / cell);
  const y0 = Math.floor((cam.y - halfH) / cell), y1 = Math.floor((cam.y + halfH) / cell);
  ctx.fillStyle = '#7f8db8';
  const size = 2.2 / cam.zoom;
  for (let cx = x0; cx <= x1; cx++) {
    for (let cy = y0; cy <= y1; cy++) {
      let h = (cx * 73856093) ^ (cy * 19349663);
      for (let k = 0; k < 3; k++) {
        h = Math.imul(h ^ (h >>> 13), 0x5bd1e995) >>> 0;
        const px = cx * cell + (h & 1023) / 1023 * cell;
        h = Math.imul(h ^ (h >>> 15), 0x27d4eb2d) >>> 0;
        const py = cy * cell + (h & 1023) / 1023 * cell;
        ctx.globalAlpha = 0.35 + ((h >>> 12) & 7) / 14;
        ctx.fillRect(px, py, size, size);
      }
    }
  }
  ctx.globalAlpha = 1;
}

function drawTrail(r, game) {
  const { ctx } = r;
  const sh = game.ship;
  const tr = sh.trail;
  if (tr.length < 2) return;
  const sp = Math.hypot(sh.vx, sh.vy);
  const ratio = sp / game.stats.maxSpeed;
  const n = Math.min(tr.length, Math.round(6 + clamp(ratio, 0, 2) * 55));
  const start = tr.length - n;
  const hot = clamp((ratio - 0.85) / 0.4, 0, 1);
  ctx.lineCap = 'round';
  for (let i = start + 1; i < tr.length; i++) {
    const a = (i - start) / n;
    ctx.globalAlpha = a * 0.85;
    ctx.strokeStyle = hot > 0 ? `rgb(${120 + 135 * hot},${220 + 35 * hot},255)` : '#5fd8ff';
    ctx.lineWidth = (CONFIG.shipRadius * 1.1) * a + 1 / r.cam.zoom;
    ctx.beginPath();
    ctx.moveTo(tr[i - 1].x, tr[i - 1].y);
    ctx.lineTo(tr[i].x, tr[i].y);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(tr[tr.length - 1].x, tr[tr.length - 1].y);
  ctx.lineTo(sh.x, sh.y);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawShip(r, game) {
  const { ctx } = r;
  const sh = game.ship;
  let ang = Math.atan2(sh.vy, sh.vx);
  if (sh.charging && Math.hypot(sh.aimX, sh.aimY) >= CONFIG.minDrag) ang = Math.atan2(sh.aimY, sh.aimX);
  const R = CONFIG.shipRadius;
  const minPx = 9 / r.cam.zoom;
  const s = Math.max(R, minPx);
  ctx.save();
  ctx.translate(sh.x, sh.y);
  ctx.rotate(ang);
  if (sh.invulnT > 0 && Math.floor(game.t * 20) % 2 === 0) ctx.globalAlpha = 0.4;
  ctx.shadowColor = '#5fd8ff';
  ctx.shadowBlur = 18;
  ctx.fillStyle = '#e8f6ff';
  ctx.beginPath();
  ctx.moveTo(s * 1.3, 0);
  ctx.lineTo(-s * 0.9, s * 0.8);
  ctx.lineTo(-s * 0.5, 0);
  ctx.lineTo(-s * 0.9, -s * 0.8);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawChargeUi(r, game, pointer) {
  const sh = game.ship;
  if (!sh.charging) return;
  const { ctx } = r;
  const p = worldToScreen(r, sh.x, sh.y);
  const g = sh.gauge;
  const full = g >= 1;
  // gauge ring
  ctx.lineWidth = 5;
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath(); ctx.arc(p.x, p.y, 34, 0, TAU); ctx.stroke();
  ctx.strokeStyle = g > 1 ? '#ff9f40' : full ? '#ffe46b' : '#5fd8ff';
  ctx.beginPath(); ctx.arc(p.x, p.y, 34, -Math.PI / 2, -Math.PI / 2 + TAU * Math.min(1, g)); ctx.stroke();
  if (g > 1) {
    ctx.strokeStyle = '#ff5a3c';
    ctx.beginPath(); ctx.arc(p.x, p.y, 40, -Math.PI / 2, -Math.PI / 2 + TAU * (g - 1) / Math.max(0.01, game.stats.gaugeMax - 1)); ctx.stroke();
  }
  // aim arrow
  const len = Math.hypot(sh.aimX, sh.aimY);
  if (len >= CONFIG.minDrag) {
    const ux = sh.aimX / len, uy = sh.aimY / len;
    const L = 50 + 90 * Math.min(1.5, g);
    ctx.strokeStyle = full ? '#ffe46b' : '#9fe8ff';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(p.x + ux * 40, p.y + uy * 40); ctx.lineTo(p.x + ux * L, p.y + uy * L); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p.x + ux * (L + 12), p.y + uy * (L + 12));
    ctx.lineTo(p.x + ux * L - uy * 8, p.y + uy * L + ux * 8);
    ctx.lineTo(p.x + ux * L + uy * 8, p.y + uy * L - ux * 8);
    ctx.closePath();
    ctx.fillStyle = ctx.strokeStyle; ctx.fill();
  }
  // drag rubber band (screen space)
  if (pointer && pointer.down) {
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.moveTo(pointer.sx, pointer.sy); ctx.lineTo(pointer.cx, pointer.cy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(pointer.sx, pointer.sy, 6, 0, TAU); ctx.stroke();
  }
}


function drawHud(r, game) {
  drawSpeedPanel(r, game);
  drawStatus(r, game);
}

function drawStatus(r, game) {
  const { ctx } = r;
  const sh = game.ship;
  const x = 16, y = 18, w = 220;
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(x, y, w, 12);
  ctx.fillStyle = sh.hp / game.stats.maxHp < 0.3 ? '#ff5a4a' : '#5dffa0';
  ctx.fillRect(x, y, w * Math.max(0, sh.hp / game.stats.maxHp), 12);
  ctx.fillStyle = '#e8f0ff';
  ctx.font = `12px ${MONO}`;
  ctx.textAlign = 'left';
  ctx.fillText(`HP ${Math.ceil(Math.max(0, sh.hp))} / ${Math.round(game.stats.maxHp)}`, x, y + 28);
  const atk = attackPower(Math.hypot(sh.vx, sh.vy), game.stats);
  ctx.fillText(`ATK ${atk.toFixed(1)}   撃破 ${game.kills}`, x, y + 46);
}

function drawSpeedPanel(r, game) {
  const { ctx, W, H } = r;
  const sp = Math.hypot(game.ship.vx, game.ship.vy);
  const kms = (v) => (v * CONFIG.speedToKms).toFixed(2);
  const bw = Math.min(420, W * 0.5), bh = 10;
  const bx = W / 2 - bw / 2, by = H - 34;
  const top = CONFIG.escapeSpeed * 1.08;
  const X = (v) => bx + clamp(v / top, 0, 1) * bw;
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(bx, by, bw, bh);
  const hot = sp > game.stats.maxSpeed;
  ctx.fillStyle = sp >= CONFIG.escapeSpeed ? '#ffd24a' : hot ? '#bff3ff' : '#5fd8ff';
  ctx.fillRect(bx, by, X(sp) - bx, bh);
  // max speed tick
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(X(game.stats.maxSpeed) - 1, by - 5, 2, bh + 10);
  // peak marker
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillRect(X(game.peakSpeed) - 1, by, 2, bh);
  // escape line
  ctx.fillStyle = '#ffd24a';
  ctx.fillRect(X(CONFIG.escapeSpeed) - 1.5, by - 8, 3, bh + 16);
  ctx.font = `11px ${MONO}`;
  ctx.textAlign = 'center';
  ctx.fillText(`脱出 ${kms(CONFIG.escapeSpeed)}`, X(CONFIG.escapeSpeed), by - 11);
  ctx.fillStyle = '#cfd8ee';
  ctx.fillText(`上限 ${kms(game.stats.maxSpeed)}`, X(game.stats.maxSpeed), by + bh + 14);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#8fa3c8';
  ctx.fillText(`最高 ${kms(game.peakSpeed)}`, bx, by - 8);
  ctx.fillStyle = hot ? '#bff3ff' : '#e8f0ff';
  ctx.font = `700 34px ${MONO}`;
  ctx.textAlign = 'right';
  ctx.fillText(kms(sp), W / 2 + 40, by - 18);
  ctx.textAlign = 'left';
  ctx.font = `13px ${MONO}`;
  ctx.fillStyle = '#8fa3c8';
  ctx.fillText('km/s', W / 2 + 46, by - 19);
}

// ---- input.js ----
// Launch direction is opposite to the drag: start - current.
function aimFromDrag(sx, sy, cx, cy) {
  return { x: sx - cx, y: sy - cy };
}

function createInput(el) {
  const st = { down: false, sx: 0, sy: 0, cx: 0, cy: 0, release: false, relX: 0, relY: 0, pointerId: null, enabled: true };
  el.addEventListener('pointerdown', (e) => {
    if (!st.enabled || e.button > 0) return;
    st.down = true; st.pointerId = e.pointerId;
    st.sx = st.cx = e.clientX; st.sy = st.cy = e.clientY;
    el.setPointerCapture?.(e.pointerId);
  });
  el.addEventListener('pointermove', (e) => {
    if (!st.down || e.pointerId !== st.pointerId) return;
    st.cx = e.clientX; st.cy = e.clientY;
  });
  const up = (e) => {
    if (!st.down || e.pointerId !== st.pointerId) return;
    st.cx = e.clientX; st.cy = e.clientY;
    const a = aimFromDrag(st.sx, st.sy, st.cx, st.cy);
    st.down = false; st.release = true; st.relX = a.x; st.relY = a.y;
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('contextmenu', (e) => e.preventDefault());

  return {
    state: st,
    read() {
      const a = st.release ? { x: st.relX, y: st.relY } : aimFromDrag(st.sx, st.sy, st.cx, st.cy);
      const out = { charging: st.down, aimX: a.x, aimY: a.y, release: st.release };
      st.release = false;
      return out;
    },
    reset() { st.down = false; st.release = false; },
  };
}

// ---- main.js ----




const canvas = document.getElementById('game');
const renderer = createRenderer(canvas);
const input = createInput(canvas);
let game = createGame({});

window.addEventListener('resize', () => resizeRenderer(renderer));
resizeRenderer(renderer);

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  update(game, dt, input.read());
  render(renderer, game, dt, input.state);
  game.events.length = 0;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
