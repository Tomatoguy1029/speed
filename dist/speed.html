    if (e.dashSeen !== game.dashId) { e.dashSeen = game.dashId; e.dashFresh = fresh; }
    fresh = e.dashFresh;
  }
  e.hp -= dmg;
  e.flash = 0.12;
  game.events.push({ type: 'hit', x: e.x, y: e.y, crit: !!opts.crit, dmg, cause: opts.cause });
  if (opts.crit) addText(game, e.x, e.y - e.r - 10, 'CRIT', '#ffe46b');
  if (e.hp <= 0) {
    if (fresh && (opts.cause === 'ram' || opts.cause === 'wave')) killStop(game, e, opts.crit);
    killEnemy(game, e, opts);
  } else if (opts.dirX !== undefined) {
    const k = opts.knock ?? 160;
    const mass = Math.max(1, e.r / 20);
    e.vx += (opts.dirX * k) / mass; e.vy += (opts.dirY * k) / mass;
  }
}

// One-shot ram kills freeze the action for a beat, so each kill in a sweep lands on its own.
function killStop(game, e, crit) {
  if (game.dashStop >= CONFIG.killHitstopCap) return;
  const t = CONFIG.killHitstop * (e.r > 25 ? 1.8 : 1) * (crit ? 1.3 : 1);
  game.hitstop = Math.max(game.hitstop, t);
  game.dashStop = (game.dashStop || 0) + t;
}

function killEnemy(game, e, opts = {}) {
  if (e.dead || game.state === 'finishing') return;
  if (e === game.boss) { beginBossFinish(game, e, opts); return; }
  e.dead = true;
  game.kills++;
  game.events.push({ type: 'kill', x: e.x, y: e.y, r: e.r, crit: !!opts.crit, enemyType: e.type, elite: e.elite, cause: opts.cause });
  burst(game, e.x, e.y, e.T.color, 6 + Math.round(e.r / 3), opts.dirX || 0, opts.dirY || 0, 260 + e.r * 4);
  onEnemyDeath(e, game);
  dropPortal(game, e.x, e.y);
  const phase = getPhase(game.t);
  const danger = dangerAt(Math.hypot(e.x, e.y));
  const xp = e.xp * game.stats.xpMult * CONFIG.xpMult * (phase.xpBonus || 1) * (1 + danger);
  dropGem(game, e.x, e.y, xp);
  dropCoins(game, e, danger);
  // Roll independently for each kill; drop frequency is controlled by probability, not a timer.
  const power = e.xp;
  const chance = Math.min(CONFIG.dropMax, CONFIG.dropBase * Math.pow(power, CONFIG.dropPowerExp));
  if (game.rng() < chance) {
    dropModule(game, e.x, e.y, power, danger);
  }
  if (opts.cause === 'ram' && game.stats.fling) flingCorpse(game, e);
}

function flingCorpse(game, e) {
  const sh = game.ship;
  const sp = Math.hypot(sh.vx, sh.vy);
  if (sp < 1) return;
  const base = Math.atan2(sh.vy, sh.vx);
  const dmg = attackPower(sp, game.stats) * game.stats.fling;
  for (const off of [-0.28, 0, 0.28]) {
    const a = base + off;
    game.fbullets.push({
      kind: 'corpse', x: e.x, y: e.y, vx: Math.cos(a) * sp * 0.9, vy: Math.sin(a) * sp * 0.9,
      r: Math.max(10, e.r * 0.8), dmg, life: 0.7, pierce: true, hit: new Set(), color: e.T.color,
    });
  }
}

function dropCoins(game, e, danger) {
  let n = 0;
  if (e.type === 'battleship') n = 12;
  else if (e.elite) n = 3 + Math.floor(game.rng() * 4);
  else if (e.type === 'meteor') n = game.rng() < CONFIG.meteorCoinChance ? 1 + Math.floor(game.rng() * 3) : 0;
  else if (game.rng() < 0.03 * (1 + danger * 2)) n = 1;
  for (let i = 0; i < n; i++) {
    const a = game.rng() * Math.PI * 2, d = game.rng() * e.r;
    game.coinDrops.push({ x: e.x + Math.cos(a) * d, y: e.y + Math.sin(a) * d, v: 1, pulled: false, taken: false });
  }
}

function dropGem(game, x, y, v) {
  if (game.gems.length > 600) {
    const old = game.gems.shift();
    v += old.v;
  }
  const a = game.rng() * Math.PI * 2;
  game.gems.push({ x: x + Math.cos(a) * 8, y: y + Math.sin(a) * 8, v, age: 0, pulled: false, taken: false });
}

function dropModule(game, x, y, power, danger) {
  const mod = rollModule(game.rng, { t: game.t, loadout: game.loadout, source: 'drop', power, danger, scheme: game.scheme });
  game.capsules.push({ kind: 'capsule', src: 'drop', x, y, mod, age: 0 });
}

function dropCapsule(game, x, y, src, danger) {
  const mod = rollModule(game.rng, { t: game.t, loadout: game.loadout, source: 'capsule', danger, scheme: game.scheme });
  game.capsules.push({ kind: 'capsule', src, x, y, mod, age: 0 });
}

// Area damage that ignores armor (module effects, sonic booms).
function explode(game, x, y, radius, dmg, opts = {}) {
  const knock = opts.knock ?? 300;
  for (const e of game.enemies) {
    if (e.dead) continue;
    const dx = e.x - x, dy = e.y - y;
    const rr = radius + e.r;
    const d2 = dx * dx + dy * dy;
    if (d2 > rr * rr) continue;
    const d = Math.sqrt(d2) || 1;
    damageEnemy(game, e, dmg, { cause: opts.cause, dirX: dx / d, dirY: dy / d, knock });
  }
  addRing(game, x, y, radius, opts.color || '#ffb36b', opts.life || 0.4);
  game.events.push({ type: 'explode', x, y, radius, cause: opts.cause });
}

function burst(game, x, y, color, n, dx, dy, speed) {
  const P = game.fx.particles;
  if (P.length > 1600) return;
  for (let i = 0; i < n; i++) {
    const a = game.rng() * Math.PI * 2;
    const s = speed * (0.3 + game.rng());
    P.push({
      x, y,
      vx: Math.cos(a) * s * 0.6 + dx * s * 0.8,
      vy: Math.sin(a) * s * 0.6 + dy * s * 0.8,
      life: 0.5 + game.rng() * 0.4, max: 0.9, color, size: 2 + game.rng() * 4,
    });
  }
}

function addText(game, x, y, text, color, size = 16) {
  if (game.fx.texts.length > 40) game.fx.texts.shift();
  game.fx.texts.push({ x, y, text, color, life: size > 16 ? 0.9 : 0.7, size });
}

function addRing(game, x, y, radius, color, life = 0.45) {
  if (game.fx.rings.length > 80) game.fx.rings.shift();
  game.fx.rings.push({ x, y, radius, color, life, max: life });
}

// ---- finale.js ----


// Only keep the recent approach while the boss is alive; no world snapshots or replayed damage.
function recordBossApproach(game, dt) {
  if (!game.boss || game.boss.dead) return;
  game.finishClock += dt;
  const sh = game.ship, frames = game.finishFrames;
  frames.push({ t: game.finishClock - dt, x: sh.x, y: sh.y, vx: sh.vx, vy: sh.vy });
  const cutoff = game.finishClock - CONFIG.bossFinishReplayWindow;
  while (frames.length > 2 && frames[1].t < cutoff) frames.shift();
  if (frames.length > 64) frames.shift();
}

function beginBossFinish(game, boss, hit = {}) {
  if (game.finale) return;
  const sh = game.ship;
  const impact = { t: game.finishClock, x: hit.impactX ?? sh.x, y: hit.impactY ?? sh.y, vx: sh.vx, vy: sh.vy };
  const frames = [...game.finishFrames, impact];
  game.finale = { phase: 'slow', elapsed: 0, boss, frames, impact };
  game.state = 'finishing';
  game.endReason = 'boss';
  game.spawning = false;
  game.hitstop = game.slowmo = game.acc = 0;
  game.jump = game.portalDash = game.releasePending = null;
  if (game.hyper) { game.hyper.focus = false; game.hyper.queue = []; }
  game.offerQueue.length = 0;
  game.currentOffer = null;
  sh.charging = false; sh.invulnT = 0;
  game.events.push({ type: 'bossFinish' });
}

// Timings are in real seconds. The slow segment replays positions, never combat or pickups.
function advanceBossFinish(game, dt) {
  const f = game.finale, sh = game.ship;
  f.elapsed += dt;
  if (f.phase === 'slow') {
    const k = Math.min(1, f.elapsed / CONFIG.bossFinishSlowTime);
    const frames = f.frames;
    const start = Math.max(frames[0].t, f.impact.t - CONFIG.bossFinishReplayWindow);
    const time = start + (f.impact.t - start) * k;
    let i = 0;
    while (i < frames.length - 2 && frames[i + 1].t < time) i++;
    const a = frames[i], b = frames[i + 1] || a;
    const mix = Math.max(0, Math.min(1, (time - a.t) / (b.t - a.t || 1)));
    for (const key of ['x', 'y', 'vx', 'vy']) sh[key] = a[key] + (b[key] - a[key]) * mix;
    sh.trail = frames.slice(0, i + 1).map(p => ({ x: p.x, y: p.y }));
    game.timeScale = CONFIG.bossFinishReplayWindow / CONFIG.bossFinishSlowTime;
    f.boss.flash = 0.12;
    if (k < 1) return false;
    sh.trail = [];
    sh.invulnT = 0;
    f.phase = 'blast'; f.elapsed = 0;
    bossClearBlast(game);
  } else {
    game.timeScale = 1;
    // Release the shot at normal speed, then let it settle as the camera opens back out.
    sh.x += sh.vx * dt; sh.y += sh.vy * dt;
    const drag = Math.exp(-3 * dt);
    sh.vx *= drag; sh.vy *= drag;
    sh.trail.push({ x: sh.x, y: sh.y });
    if (sh.trail.length > 64) sh.trail.shift();
    if (f.phase === 'blast' && f.elapsed >= CONFIG.bossFinishBlastTime) {
      f.phase = 'clear'; f.elapsed = 0;
    }
  }
  return f.phase === 'clear' && f.elapsed >= CONFIG.bossFinishClearTime;
}

function bossClearBlast(game) {
  const f = game.finale, boss = f.boss;
  game.timeScale = 1;
  game.fx.particles = [];
  // This is the victory sweep, not a chain of gameplay kills: no drops, splits or extra offers.
  burst(game, boss.x, boss.y, '#ffe3a3', 90, 0, 0, 900);
  for (const e of new Set([boss, ...game.enemies, ...game.newEnemies])) {
    if (e.dead) continue;
    e.dead = true;
    game.kills++;
    const dx = e.x - boss.x, dy = e.y - boss.y, d = Math.hypot(dx, dy) || 1;
    if (e !== boss) burst(game, e.x, e.y, e.T.color, 4, dx / d, dy / d, 500);
    if (game.fx.particles.length < 1400) for (let i = 0; i < (e === boss ? 24 : 3); i++) {
      const a = Math.random() * Math.PI * 2, speed = 150 + Math.random() * 550;
      game.fx.particles.push({ kind: 'finishDebris', x: e.x, y: e.y,
        vx: Math.cos(a) * speed + dx / d * 300, vy: Math.sin(a) * speed + dy / d * 300,
        life: CONFIG.bossFinishBlastTime, max: CONFIG.bossFinishBlastTime,
        color: e.T.color, size: e === boss ? 10 + Math.random() * 16 : 3 + Math.random() * 5,
        angle: a, spin: (Math.random() - 0.5) * 8 });
    }
  }
  boss.dead = true;
  game.enemies = []; game.newEnemies = []; game.ebullets = []; game.fbullets = [];
  game.mines = []; game.capsules = []; game.gems = []; game.coinDrops = [];
  game.fx.texts = [];
  const radius = Math.max(900, game.viewRadius * 1.4);
  addRing(game, boss.x, boss.y, radius, '#ffe7aa', 0.85);
  addRing(game, boss.x, boss.y, radius * 0.8, '#ff526e', 0.7);
  game.events.push({ type: 'bossExplosion', x: boss.x, y: boss.y });
}

function finishCameraTarget(game, W, H, baseZoom) {
  const f = game.finale;
  if (!f || game.state !== 'finishing') return null;
  const sh = game.ship, boss = f.boss;
  const zoom = baseZoom * CONFIG.bossFinishZoom;
  const dx = boss.x - sh.x, dy = boss.y - sh.y, dist = Math.hypot(dx, dy) || 1;
  const offset = Math.min(dist * 0.25, Math.min(W, H) * 0.2 / zoom);
  if (f.phase === 'slow') return { x: sh.x + dx / dist * offset, y: sh.y + dy / dist * offset, zoom };
  if (f.phase === 'blast') return { x: boss.x, y: boss.y, zoom: baseZoom };
  return { x: sh.x, y: sh.y, zoom: baseZoom };
}

function drawBossFinish(r, game) {
  const f = game.finale;
  if (!f || game.state !== 'finishing') return;
  const { ctx, W, H } = r;
  ctx.save();
  if (f.phase === 'slow') {
    // A vignette draws attention to the actual final approach without explanatory HUD.
    const vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.18, W / 2, H / 2, Math.max(W, H) * 0.65);
    vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,0.65)');
    ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
  } else {
    const blastAge = f.phase === 'blast' ? f.elapsed : CONFIG.bossFinishBlastTime + f.elapsed;
    const p = { x: (f.boss.x - r.cam.x) * r.cam.zoom + W / 2, y: (f.boss.y - r.cam.y) * r.cam.zoom + H / 2 };
    const radius = Math.max(1, (70 + blastAge * 1400) * r.cam.zoom);
    const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, radius);
    const alpha = Math.max(0, 0.8 * (1 - blastAge / 1.1));
    glow.addColorStop(0, `rgba(255,248,215,${alpha})`);
    glow.addColorStop(0.25, `rgba(255,150,60,${alpha * 0.7})`);
    glow.addColorStop(1, 'rgba(255,70,70,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  }
  if (f.phase === 'clear') {
    ctx.globalAlpha = Math.min(1, f.elapsed / 0.2);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 ${Math.min(104, W * 0.17, H * 0.2)}px system-ui, sans-serif`;
    ctx.shadowColor = '#ffac32'; ctx.shadowBlur = 28;
    ctx.fillStyle = '#fff2bf'; ctx.fillText('CLEAR!', W / 2, H / 2);
  }
  ctx.restore();
}

// ---- parts.js ----
// Module slots drawn as spaceship parts. Each part has its own silhouette, and the six of them
// assemble into one ship (nose, radar, gun, reactor, wings, engine). Pure canvas drawing.

const TAU_P = Math.PI * 2;

// Where each part sits in the assembled ship, in units (ship points up, center = reactor).
const PART_LAYOUT = {
  armor: { x: 0, y: 0.35, s: 1 },
  booster: { x: 0, y: 1.85, s: 1 },
  gen: { x: 0, y: -0.05, s: 0.95 },
  gun: { x: 1.15, y: -1.0, s: 0.8 },
  radar: { x: -1.15, y: -1.0, s: 0.8 },
  bow: { x: 0, y: -2.2, s: 1 },
};
const DRAW_ORDER = ['armor', 'booster', 'gen', 'gun', 'radar', 'bow'];

function trace(ctx, slot, s) {
  ctx.beginPath();
  switch (slot) {
    case 'bow': // nose cone
      ctx.moveTo(0, -1.15 * s);
      ctx.quadraticCurveTo(0.8 * s, -0.25 * s, 0.62 * s, 0.85 * s);
      ctx.lineTo(-0.62 * s, 0.85 * s);
      ctx.quadraticCurveTo(-0.8 * s, -0.25 * s, 0, -1.15 * s);
      break;
    case 'booster': // twin engine bells
      for (const sx of [-1, 1]) {
        const cx = sx * 0.42 * s;
        ctx.moveTo(cx - 0.26 * s, -0.55 * s);
        ctx.lineTo(cx + 0.26 * s, -0.55 * s);
        ctx.lineTo(cx + 0.4 * s, 0.45 * s);
        ctx.lineTo(cx - 0.4 * s, 0.45 * s);
        ctx.closePath();
      }
      break;
    case 'gun': // turret + barrel
      ctx.rect(-0.16 * s, -1.15 * s, 0.32 * s, 1.15 * s);
      ctx.moveTo(0.48 * s, 0.25 * s);
      ctx.arc(0, 0.25 * s, 0.48 * s, 0, TAU_P);
      break;
    case 'radar': // dish on a mast
      ctx.moveTo(-0.85 * s, -0.55 * s);
      ctx.quadraticCurveTo(0, 0.55 * s, 0.85 * s, -0.55 * s);
      ctx.quadraticCurveTo(0, -0.05 * s, -0.85 * s, -0.55 * s);
      ctx.rect(-0.1 * s, 0, 0.2 * s, 0.75 * s);
      break;
    case 'armor': // a pair of swept wing plates
      for (const sx of [-1, 1]) {
        ctx.moveTo(sx * 0.45 * s, -0.55 * s);
        ctx.lineTo(sx * 1.55 * s, 0.35 * s);
        ctx.lineTo(sx * 1.55 * s, 0.95 * s);
        ctx.lineTo(sx * 0.45 * s, 0.55 * s);
        ctx.closePath();
      }
      break;
    case 'gen': // hexagonal reactor
    default:
      for (let i = 0; i < 6; i++) {
        const a = i * TAU_P / 6 - Math.PI / 2;
        if (i === 0) ctx.moveTo(Math.cos(a) * 0.72 * s, Math.sin(a) * 0.72 * s);
        else ctx.lineTo(Math.cos(a) * 0.72 * s, Math.sin(a) * 0.72 * s);
      }
      ctx.closePath();
  }
}

// One part at the origin. color = rarity color (filled), or null for an empty outline.
function drawPart(ctx, slot, s, color, opts = {}) {
  ctx.save();
  if (color) {
    if (opts.glow) { ctx.shadowColor = color; ctx.shadowBlur = opts.glow; }
    trace(ctx, slot, s);
    ctx.fillStyle = color;
    ctx.fill('nonzero');
    ctx.shadowBlur = 0;
    ctx.lineWidth = Math.max(1, s * 0.09);
    ctx.strokeStyle = 'rgba(10,14,30,0.75)';
    ctx.stroke();
    // small details so the parts read as machinery
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    if (slot === 'bow') { ctx.beginPath(); ctx.ellipse(0, -0.2 * s, 0.18 * s, 0.3 * s, 0, 0, TAU_P); ctx.fill(); }
    if (slot === 'gen') { ctx.beginPath(); ctx.arc(0, 0, 0.3 * s, 0, TAU_P); ctx.fill(); }
    if (slot === 'radar') { ctx.beginPath(); ctx.arc(0, -0.25 * s, 0.11 * s, 0, TAU_P); ctx.fill(); }
    if (slot === 'gun') { ctx.fillRect(-0.16 * s, -1.15 * s, 0.32 * s, 0.16 * s); }
    if (slot === 'booster' && opts.flame !== false) {
      ctx.fillStyle = 'rgba(255,170,80,0.85)';
      for (const sx of [-1, 1]) {
        const cx = sx * 0.42 * s;
        ctx.beginPath(); ctx.moveTo(cx - 0.26 * s, 0.5 * s); ctx.lineTo(cx + 0.26 * s, 0.5 * s); ctx.lineTo(cx, 1.1 * s); ctx.closePath(); ctx.fill();
      }
    }
  } else {
    trace(ctx, slot, s);
    ctx.setLineDash([Math.max(2, s * 0.18), Math.max(2, s * 0.14)]);
    ctx.lineWidth = Math.max(1, s * 0.07);
    ctx.strokeStyle = opts.outline || 'rgba(190,205,240,0.35)';
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

// The whole ship. colorOf(slot) -> rarity color or null (empty). highlight: slot to pulse.
function drawShipAssembly(ctx, cx, cy, unit, colorOf, highlight, t = 0) {
  ctx.save();
  ctx.translate(cx, cy);
  // chassis spine that holds the parts
  ctx.strokeStyle = 'rgba(160,180,230,0.25)';
  ctx.lineWidth = Math.max(1, unit * 0.12);
  ctx.beginPath(); ctx.moveTo(0, -1.4 * unit); ctx.lineTo(0, 1.3 * unit); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-1.15 * unit, -0.75 * unit); ctx.lineTo(1.15 * unit, -0.75 * unit); ctx.stroke();
  for (const slot of DRAW_ORDER) {
    const L = PART_LAYOUT[slot];
    ctx.save();
    ctx.translate(L.x * unit, L.y * unit);
    const color = colorOf(slot);
    drawPart(ctx, slot, L.s * unit, color, { glow: color ? unit * 0.4 : 0 });
    if (slot === highlight) {
      const pulse = 0.5 + 0.5 * Math.sin(t * 6);
      drawPart(ctx, slot, L.s * unit * (1.12 + 0.06 * pulse), null, { outline: `rgba(255,255,255,${0.5 + 0.5 * pulse})` });
    }
    ctx.restore();
  }
  ctx.restore();
}

// ---- debris.js ----


// Renderer-owned history follows the actual projectiles, including during world slowdown.
function drawCorpseDebris(r, game, dt) {
  if (r.debrisGame !== game) {
    r.debrisGame = game;
    r.debrisTime = 0;
    r.debrisTracks = new Map();
  }
  if (game.state === 'play') r.debrisTime += dt;
  const now = r.debrisTime;
  const cutoff = now - CONFIG.corpseTrailLife;
  const tracks = r.debrisTracks;
  for (const [bullet, track] of tracks) {
    track.active = false;
    if (track.lastSeen < cutoff) tracks.delete(bullet);
  }
  for (const b of game.fbullets) {
    if (b.kind !== 'corpse') continue;
    let track = tracks.get(b);
    if (!track) {
      track = { points: [], lastSeen: now, active: true };
      tracks.set(b, track);
    }
    track.active = true;
    track.lastSeen = now;
    const points = track.points;
    const last = points[points.length - 1];
    if (!last || last.x !== b.x || last.y !== b.y) points.push({ x: b.x, y: b.y, t: now });
    else last.t = now;
    while (points.length > CONFIG.corpseTrailPoints || (points.length > 1 && points[0].t < cutoff)) points.shift();
  }

  const { ctx } = r;
  ctx.save();
  ctx.lineCap = 'butt';
  ctx.globalCompositeOperation = 'lighter';
  for (const [b, track] of tracks) {
    const points = track.points;
    const width = Math.max(1.5 / r.cam.zoom, b.r * 0.3);
    for (let i = 1; i < points.length; i++) {
      const from = points[i - 1], to = points[i];
      const fade = Math.max(0, 1 - (now - from.t) / CONFIG.corpseTrailLife);
      if (!fade) continue;
      ctx.globalAlpha = fade * fade * 0.55;
      ctx.strokeStyle = b.color;
      ctx.lineWidth = width;
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
      ctx.globalAlpha *= 0.65;
      ctx.strokeStyle = '#fff3d5';
      ctx.lineWidth = width * 0.3;
      ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  for (const [b, track] of tracks) {
    if (!track.active) continue;
    const sx = (b.x - r.cam.x) * r.cam.zoom + r.W / 2;
    const sy = (b.y - r.cam.y) * r.cam.zoom + r.H / 2;
    const pad = b.r * r.cam.zoom;
    if (sx < -pad || sx > r.W + pad || sy < -pad || sy > r.H + pad) continue;
    const size = b.r * 0.65;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(Math.atan2(b.vy, b.vx) + now * CONFIG.corpseSpinRate);
    ctx.globalAlpha = 0.95;
    ctx.fillStyle = '#26323d';
    ctx.strokeStyle = b.color;
    ctx.lineWidth = Math.max(1 / r.cam.zoom, size * 0.16);
    ctx.beginPath();
    ctx.moveTo(size, -size * 0.25);
    ctx.lineTo(-size * 0.15, -size * 0.7);
    ctx.lineTo(-size * 0.85, size * 0.35);
    ctx.lineTo(size * 0.25, size * 0.6);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#fff3d5';
    ctx.beginPath(); ctx.moveTo(-size * 0.15, -size * 0.7); ctx.lineTo(size, -size * 0.25); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

// ---- render.js ----













const STAR_TILE = 1600;
const MONO = 'ui-monospace, Menlo, monospace';

function createRenderer(canvas) {
  const ctx = canvas.getContext('2d');
  const rng = makeRng(7);
  const layers = [0.06, 0.16, 0.35].map((p, i) => ({
    p,
    stars: Array.from({ length: 110 - i * 25 }, () => ({ x: rng() * STAR_TILE, y: rng() * STAR_TILE, s: 0.6 + rng() * (0.6 + i * 0.6), a: 0.25 + rng() * 0.6 })),
  }));
  return { canvas, ctx, layers, cam: { x: 0, y: 0, zoom: 1, ready: false }, W: 0, H: 0, dpr: 1, shake: 0, flash: 0, vapor: 0, zoomPunch: 0, stageFlash: null, hurt: 0 };
}

function resizeRenderer(r) {
  r.dpr = Math.min(window.devicePixelRatio || 1, 2);
  // size from the canvas as laid out, so drawing and pointer coordinates always share one space
  // (window.innerHeight and 100vh disagree on mobile browsers with a collapsing toolbar)
  const b = r.canvas.getBoundingClientRect();
  r.W = b.width || window.innerWidth;
  r.H = b.height || window.innerHeight;
  r.canvas.width = Math.floor(r.W * r.dpr);
  r.canvas.height = Math.floor(r.H * r.dpr);
}

function worldToScreen(r, x, y) {
  return { x: (x - r.cam.x) * r.cam.zoom + r.W / 2, y: (y - r.cam.y) * r.cam.zoom + r.H / 2 };
}

function screenToWorld(r, x, y) {
  return { x: (x - r.W / 2) / r.cam.zoom + r.cam.x, y: (y - r.H / 2) / r.cam.zoom + r.cam.y };
}

// Zoom is tied to the ship's max speed so the view only widens as the build gets faster,
// instead of pumping in and out with every dash.
function targetZoom(game, W, H) {
  const f = Math.pow(CONFIG.zoomRefSpeed / Math.max(CONFIG.zoomRefSpeed, game.stats.maxSpeed), CONFIG.zoomExp);
  return (Math.min(W, H) / CONFIG.baseView) * clamp(f, CONFIG.zoomMin, 1);
}

function updateCamera(r, game, dt) {
  const sh = game.ship;
  const finishTarget = finishCameraTarget(game, r.W, r.H, targetZoom(game, r.W, r.H));
  if (finishTarget) {
    const k = 1 - Math.exp(-10 * dt);
    r.cam.x += (finishTarget.x - r.cam.x) * k;
    r.cam.y += (finishTarget.y - r.cam.y) * k;
    r.cam.zoom += (finishTarget.zoom - r.cam.zoom) * k;
    return;
  }
  const zoomT = targetZoom(game, r.W, r.H);
  // look ahead along the velocity, but keep the ship well inside the screen at any speed
  let ox = sh.vx * CONFIG.lookAhead, oy = sh.vy * CONFIG.lookAhead;
  const maxOff = (0.3 * Math.min(r.W, r.H)) / 2 / zoomT;
  const off = Math.hypot(ox, oy);
  if (off > maxOff) { ox *= maxOff / off; oy *= maxOff / off; }
  const tx = sh.x + ox;
  const ty = sh.y + oy;
  const cam = r.cam;
  if (!cam.ready) { cam.x = tx; cam.y = ty; cam.zoom = zoomT; cam.ready = true; }
  const kp = 1 - Math.exp(-7 * dt);
  const kz = 1 - Math.exp(-2.2 * dt);
  cam.x += (tx - cam.x) * kp;
  cam.y += (ty - cam.y) * kp;
  cam.zoom += (zoomT - cam.zoom) * kz;
  if (r.zoomPunch > 0) { cam.zoom *= 1 + r.zoomPunch; r.zoomPunch = Math.max(0, r.zoomPunch - dt * 0.5); }
  game.viewRadius = Math.hypot(r.W, r.H) / 2 / cam.zoom;
}

function handleEvents(r, game) {
  for (const ev of game.events) {
    if (ev.type === 'hurt') { r.shake = Math.max(r.shake, 14); r.hurt = 0.35; }
    else if (ev.type === 'kill' && ev.r > 25) r.shake = Math.max(r.shake, 8);
    else if (ev.type === 'kill' && ev.cause === 'ram') r.shake = Math.max(r.shake, 5);
    else if (ev.type === 'bounce') r.shake = Math.max(r.shake, 10);
    else if (ev.type === 'crash') r.shake = Math.max(r.shake, 16);
    else if (ev.type === 'stage') { r.stageFlash = { text: ev.name, kms: (ev.speed * CONFIG.speedToKms).toFixed(1), life: 1.4, max: 1.4 }; r.flash = Math.max(r.flash, 0.18); }
    else if (ev.type === 'sonic') { r.flash = 0.8; r.shake = Math.max(r.shake, 34); r.zoomPunch = 0.14; }
    else if (ev.type === 'barrier') r.vapor = 0.6;
    else if (ev.type === 'bossSpawn') { r.bossWarning = 3; r.shake = Math.max(r.shake, 8); }
    else if (ev.type === 'bossFinish') { r.shake = 0; r.stageFlash = null; r.flash = 0; }
    else if (ev.type === 'bossExplosion') { r.flash = 1; r.shake = 30; }
    else if (ev.type === 'end' && ev.state === 'won') r.flash = 1;
  }
}

function render(r, game, dt, pointer) {
  const { ctx } = r;
  // keep the backing store matched to the laid-out canvas (mobile toolbars and rotation can
  // change it without a resize event; a mismatch stretches the picture)
  if (r.canvas.clientWidth && (Math.abs(r.canvas.clientWidth - r.W) > 0.5 || Math.abs(r.canvas.clientHeight - r.H) > 0.5)) resizeRenderer(r);
  handleEvents(r, game);
  updateCamera(r, game, dt);
  game.spawnView = { x: r.cam.x, y: r.cam.y, halfW: r.W / 2 / r.cam.zoom, halfH: r.H / 2 / r.cam.zoom };
  ctx.setTransform(r.dpr, 0, 0, r.dpr, 0, 0);
  drawBackground(r, game);

  ctx.save();
  let sx = 0, sy = 0;
  if (r.shake > 0) {
    sx = (Math.random() - 0.5) * r.shake;
    sy = (Math.random() - 0.5) * r.shake;
    r.shake = Math.max(0, r.shake - dt * 60);
  }
  ctx.translate(r.W / 2 + sx, r.H / 2 + sy);
  ctx.scale(r.cam.zoom, r.cam.zoom);
  ctx.translate(-r.cam.x, -r.cam.y);
  drawZones(r);
  drawDust(r, game);
  drawSpecks(r);
  drawBodies(r, game);
  drawGems(r, game);
  drawCoins(r, game);
  drawCapsules(r, game);
  drawMines(r, game);
  drawEnemies(r, game);
  drawEnemyBullets(r, game);
  drawPortals(r, game);
  drawHyperUi(r, game, pointer);
  drawFriendly(r, game, dt);
  drawWeapons(r, game);
  drawPrediction(r, game);
  drawTrail(r, game);
  drawVapor(r, game, dt);
  drawShip(r, game);
  drawFx(r, game);
  drawCombatImpacts(r, game);
  ctx.restore();
  drawSpeedLines(r, game);

  if (game.state !== 'finishing') {
    drawChargeUi(r, game, pointer);
    drawCapsuleArrows(r, game);
    drawHyperHud(r, game);
    drawPortalHud(r, game);
    drawOverlays(r, game, dt);
    drawHud(r, game);
    drawBossHud(r, game, dt);
    drawMinimap(r, game);
    drawBanner(r, dt);
    drawStageFlash(r, dt);
  }
  if (r.flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${Math.min(0.85, r.flash)})`;
    ctx.fillRect(0, 0, r.W, r.H);
    r.flash = Math.max(0, r.flash - dt * 2.2);
  }
  drawBossFinish(r, game);
}

// Conical shock layers wrapped around the ship near max speed.
function drawVapor(r, game, dt) {
  const sh = game.ship;
  const sp = Math.hypot(sh.vx, sh.vy);
  const ratio = sp / game.stats.maxSpeed;
  if (r.vapor > 0) r.vapor -= dt;
  const k = Math.max(r.vapor > 0 ? 1 : 0, (ratio - 0.88) / 0.12);
  if (k <= 0 || sp < 1) return;
  const { ctx } = r;
  const z = r.cam.zoom;
  const ux = sh.vx / sp, uy = sh.vy / sp;
  const back = Math.atan2(-uy, -ux);
  ctx.save();
  ctx.translate(sh.x, sh.y);
  ctx.lineCap = 'round';
  const unit = Math.max(1, 0.6 / z);
  for (let i = 0; i < 4; i++) {
    const rad = (26 + i * 16) * unit;
    const spread = 1.25 - i * 0.18;
    ctx.globalAlpha = Math.min(1, k) * (0.5 - i * 0.1) * (0.75 + 0.25 * Math.random());
    ctx.strokeStyle = '#eaf6ff';
    ctx.lineWidth = (3 - i * 0.5) * unit;
    ctx.beginPath();
    ctx.arc(-ux * (i * 10 - 14) * unit, -uy * (i * 10 - 14) * unit, rad, back - spread, back + spread);
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawSpeedLines(r, game) {
  const sh = game.ship;
  const sp = Math.hypot(sh.vx, sh.vy);
  const k = (sp / CONFIG.escapeSpeed - 0.42) / 0.5;
  if (k <= 0) return;
  const { ctx, W, H } = r;
  const cx = W / 2, cy = H / 2;
  const R0 = Math.hypot(W, H) / 2;
  ctx.strokeStyle = '#dff3ff';
  ctx.lineWidth = 1.5;
  const n = Math.round(18 + 40 * Math.min(1, k));
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU;
    const r1 = R0 * (0.62 + Math.random() * 0.2 * (1 - Math.min(1, k)));
    ctx.globalAlpha = Math.min(0.5, 0.15 + 0.35 * k) * Math.random();
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    ctx.lineTo(cx + Math.cos(a) * R0, cy + Math.sin(a) * R0);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawStageFlash(r, dt) {
  const f = r.stageFlash;
  if (!f) return;
  f.life -= dt;
  if (f.life <= 0) { r.stageFlash = null; return; }
  const { ctx, W, H } = r;
  const t = 1 - f.life / f.max;
  ctx.globalAlpha = Math.min(1, f.life / 0.4);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#bff3ff';
  ctx.font = `italic 800 ${Math.round(30 + 10 * (1 - t))}px ${MONO}`;
  ctx.fillText(f.text, W / 2, H * 0.68);
  ctx.font = `13px ${MONO}`;
  ctx.fillStyle = '#8fd8ff';
  ctx.fillText(`${f.kms} km/s`, W / 2, H * 0.68 + 20);
  const sweep = W * (t * 1.4 - 0.2);
  const g = ctx.createLinearGradient(sweep - 160, 0, sweep + 160, 0);
  g.addColorStop(0, 'rgba(191,243,255,0)');
  g.addColorStop(0.5, 'rgba(191,243,255,0.5)');
  g.addColorStop(1, 'rgba(191,243,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, H * 0.68 - 36, W, 2);
  ctx.globalAlpha = 1;
}

function drawGems(r, game) {
  const { ctx } = r;
  const s = Math.max(5, 3 / r.cam.zoom);
  ctx.fillStyle = '#6dffb0';
  for (const g of game.gems) {
    if (!onScreen(r, g.x, g.y, 20)) continue;
    const k = g.v > 8 ? 1.6 : g.v > 3 ? 1.25 : 1;
    ctx.beginPath();
    ctx.moveTo(g.x, g.y - s * k); ctx.lineTo(g.x + s * 0.7 * k, g.y); ctx.lineTo(g.x, g.y + s * k); ctx.lineTo(g.x - s * 0.7 * k, g.y);
    ctx.closePath(); ctx.fill();
  }
}

function capsuleColor(c) {
  return c.kind === 'core' ? '#ffd24a' : RARITIES[c.mod.r].color;
}

function drawCoins(r, game) {
  const { ctx } = r;
  const s = Math.max(6, 3.5 / r.cam.zoom);
  for (const c of game.coinDrops) {
    if (!onScreen(r, c.x, c.y, 20)) continue;
    ctx.fillStyle = '#ffd24a';
    ctx.beginPath(); ctx.arc(c.x, c.y, s, 0, TAU); ctx.fill();
    ctx.fillStyle = '#a07a10';
    ctx.fillRect(c.x - s * 0.15, c.y - s * 0.55, s * 0.3, s * 1.1);
  }
}

function drawCapsules(r, game) {
  const { ctx } = r;
  const z = r.cam.zoom;
  for (const c of game.capsules) {
    if (!onScreen(r, c.x, c.y, 200)) continue;
    const col = capsuleColor(c);
    const S = (c.kind === 'core' ? 30 : 20) * Math.max(1, 0.7 / z);
    const pulse = (((game.t * 1.5 + c.x * 0.001) % 1) + 1) % 1; // x can be negative
    ctx.globalAlpha = 1 - pulse;
    ctx.strokeStyle = col;
    ctx.lineWidth = 2 / z;
    ctx.beginPath(); ctx.arc(c.x, c.y, S * (1.2 + pulse * 2.5), 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.translate(c.x, c.y + Math.sin(game.t * 2 + c.x) * S * 0.12);
    if (c.kind === 'core') {
      ctx.rotate(game.t * 1.2);
      ctx.shadowColor = col; ctx.shadowBlur = 20;
      ctx.fillStyle = col;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) { const a = i * TAU / 10, k = i % 2 ? 0.45 : 1; ctx.lineTo(Math.cos(a) * S * k, Math.sin(a) * S * k); }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, 0, S * 0.22, 0, TAU); ctx.fill();
    } else {
      // the module shows up as the ship part it is (nose, engine, gun, radar, wings, reactor)
      drawPart(ctx, c.mod.slot, S * 0.95, col, { glow: 22 });
    }
    ctx.restore();
  }
}

// Edge-of-screen pointers to capsules that are off screen.
function drawCapsuleArrows(r, game) {
  const { ctx, W, H } = r;
  const sh = game.ship;
  const m = 34;
  for (const c of game.capsules) {
    const d = Math.hypot(c.x - sh.x, c.y - sh.y);
    if (d > 5000 || onScreen(r, c.x, c.y, 0)) continue;
    const p = worldToScreen(r, c.x, c.y);
    const ang = Math.atan2(p.y - H / 2, p.x - W / 2);
    const k = Math.min((W / 2 - m) / Math.abs(Math.cos(ang) || 1e-6), (H / 2 - m) / Math.abs(Math.sin(ang) || 1e-6));
    const x = W / 2 + Math.cos(ang) * k, y = H / 2 + Math.sin(ang) * k;
    ctx.save();
    ctx.translate(x, y); ctx.rotate(ang);
    ctx.globalAlpha = 0.55 + 0.45 * (1 - d / 5000);
    ctx.fillStyle = capsuleColor(c);
    const s = c.kind === 'core' ? 13 : 9;
    ctx.beginPath(); ctx.moveTo(s, 0); ctx.lineTo(-s * 0.7, s * 0.7); ctx.lineTo(-s * 0.7, -s * 0.7); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawMines(r, game) {
  const { ctx } = r;
  const z = r.cam.zoom;
  for (const m of game.mines) {
    if (!onScreen(r, m.x, m.y, 30)) continue;
    ctx.fillStyle = m.armed > 0 ? '#7a5040' : (Math.floor(game.t * 6) % 2 ? '#ff7b54' : '#ffb08a');
    ctx.beginPath(); ctx.arc(m.x, m.y, 7 / Math.sqrt(z), 0, TAU); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,207,107,0.5)';
  for (const m of game.marks) {
    if (!onScreen(r, m.x, m.y, 30)) continue;
    ctx.beginPath(); ctx.arc(m.x, m.y, (4 + 6 * (1 - m.t / 0.55)) / Math.sqrt(z), 0, TAU); ctx.fill();
  }
}

function drawFriendly(r, game, dt) {
  drawCorpseDebris(r, game, dt);
  const { ctx } = r;
  const z = r.cam.zoom;
  for (const b of game.fbullets) {
    if (b.kind === 'corpse') continue;
    if (!onScreen(r, b.x, b.y, 40)) continue;
    ctx.fillStyle = b.color;
    const s = b.r / Math.sqrt(z);
    ctx.beginPath(); ctx.arc(b.x, b.y, s, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// Level-up weapons: orbit blades, missiles, discs, lightning and beams.
function drawWeapons(r, game) {
  const { ctx } = r;
  const z = r.cam.zoom;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const f of game.wfx) {
    const a = f.life / f.max;
    if (f.kind === 'beam') {
      ctx.strokeStyle = `rgba(255,107,213,${0.35 * a})`; ctx.lineWidth = f.width * 1.8;
      ctx.beginPath(); ctx.moveTo(f.x0, f.y0); ctx.lineTo(f.x1, f.y1); ctx.stroke();
      ctx.strokeStyle = `rgba(255,230,250,${a})`; ctx.lineWidth = f.width * 0.45;
      ctx.stroke();
    } else if (f.kind === 'bolt') {
      ctx.strokeStyle = `rgba(168,240,255,${a})`; ctx.lineWidth = 3 / z;
      ctx.beginPath(); ctx.moveTo(f.pts[0].x, f.pts[0].y);
      for (let i = 1; i < f.pts.length; i++) {
        const p = f.pts[i - 1], q = f.pts[i];
        const nx = -(q.y - p.y) * 0.18, ny = (q.x - p.x) * 0.18, k = (i % 2 ? 1 : -1) * (0.5 + 0.5 * Math.sin(game.t * 60 + i));
        ctx.lineTo((p.x + q.x) / 2 + nx * k, (p.y + q.y) / 2 + ny * k);
        ctx.lineTo(q.x, q.y);
      }
      ctx.stroke();
    }
  }
  for (const p of game.wproj) {
    if (!onScreen(r, p.x, p.y, 60)) continue;
    if (p.kind === 'missile') {
      const a = Math.atan2(p.vy, p.vx), s = 9;
      ctx.fillStyle = '#ff9f40';
      ctx.beginPath();
      ctx.moveTo(p.x + Math.cos(a) * s, p.y + Math.sin(a) * s);
      ctx.lineTo(p.x + Math.cos(a + 2.5) * s * 0.7, p.y + Math.sin(a + 2.5) * s * 0.7);
      ctx.lineTo(p.x + Math.cos(a - 2.5) * s * 0.7, p.y + Math.sin(a - 2.5) * s * 0.7);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,200,120,0.5)';
      ctx.beginPath(); ctx.arc(p.x - Math.cos(a) * s, p.y - Math.sin(a) * s, 4, 0, TAU); ctx.fill();
    } else if (p.kind === 'disc') {
      ctx.strokeStyle = '#6dffb0'; ctx.lineWidth = 3 / z;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.stroke();
      ctx.beginPath();
      for (let k = 0; k < 3; k++) { const a = p.spin + k * TAU / 3; ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + Math.cos(a) * p.r, p.y + Math.sin(a) * p.r); }
      ctx.stroke();
    }
  }
  const orbit = game.wstate.orbit;
  if (orbit?.blades && game.weapons.orbit) {
    ctx.fillStyle = '#9fe8ff';
    for (const b of orbit.blades) {
      const s = 14, a = b.a + Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(b.x + Math.cos(a) * s, b.y + Math.sin(a) * s);
      ctx.lineTo(b.x + Math.cos(a + 1.9) * s * 0.4, b.y + Math.sin(a + 1.9) * s * 0.4);
      ctx.lineTo(b.x - Math.cos(a) * s, b.y - Math.sin(a) * s);
      ctx.lineTo(b.x + Math.cos(a - 1.9) * s * 0.4, b.y + Math.sin(a - 1.9) * s * 0.4);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
}

function drawOverlays(r, game, dt) {
  const { ctx, W, H } = r;
  if (r.hurt > 0) {
    r.hurt -= dt;
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
    g.addColorStop(0, 'rgba(255,40,40,0)');
    g.addColorStop(1, `rgba(255,40,40,${0.5 * r.hurt / 0.35})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  const lowHp = game.ship.hp / game.stats.maxHp;
  if (lowHp < 0.3 && game.state === 'play') {
    const a = (0.3 - lowHp) * (0.6 + 0.4 * Math.sin(game.t * 8));
    ctx.strokeStyle = `rgba(255,50,50,${a})`;
    ctx.lineWidth = 16;
    ctx.strokeRect(0, 0, W, H);
  }
}

function drawBanner(r, dt) {
  const b = r.banner;
  if (!b) return;
  b.life -= dt;
  if (b.life <= 0) { r.banner = null; return; }
  const { ctx, W, H } = r;
  const t = b.max - b.life;
  const a = Math.min(1, t / 0.25, b.life / 0.6);
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  ctx.font = `800 ${Math.min(54, W / 10)}px "Hiragino Sans", "Noto Sans JP", sans-serif`;
  ctx.fillText(b.text, W / 2, H * 0.3);
  if (b.sub) {
    ctx.font = `16px "Hiragino Sans", "Noto Sans JP", sans-serif`;
    ctx.fillStyle = '#b8c6ea';
    ctx.fillText(b.sub, W / 2, H * 0.3 + 30);
  }
  ctx.globalAlpha = 1;
}

function drawZones(r) {
  const { ctx } = r;
  const z = r.cam.zoom;
  const g = ctx.createRadialGradient(0, 0, CONFIG.planetRadius, 0, 0, CONFIG.zoneInner);
  g.addColorStop(0, 'rgba(255,70,50,0.16)');
  g.addColorStop(1, 'rgba(255,70,50,0.02)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.zoneInner, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(150,70,255,0.07)';
  ctx.beginPath();
  ctx.arc(0, 0, CONFIG.fieldRadius, 0, TAU);
  ctx.arc(0, 0, CONFIG.zoneOuter, 0, TAU, true);
  ctx.fill();
  ctx.lineWidth = 2 / z;
  ctx.setLineDash([30 / z, 24 / z]);
  ctx.strokeStyle = 'rgba(255,110,90,0.35)';
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.zoneInner, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(170,120,255,0.35)';
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.zoneOuter, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.lineWidth = 6 / z;
  ctx.strokeStyle = 'rgba(190,120,255,0.8)';
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.fieldRadius, 0, TAU); ctx.stroke();
}

function drawDust(r, game) {
  const { ctx } = r;
  for (const d of game.field.dust) {
    if (!onScreen(r, d.x, d.y, d.r)) continue;
    const g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r);
    g.addColorStop(0, 'rgba(170,130,210,0.20)');
    g.addColorStop(0.7, 'rgba(140,100,190,0.10)');
    g.addColorStop(1, 'rgba(140,100,190,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill();
  }
}

function onScreen(r, x, y, rad) {
  const halfW = r.W / 2 / r.cam.zoom + rad, halfH = r.H / 2 / r.cam.zoom + rad;
  return Math.abs(x - r.cam.x) < halfW && Math.abs(y - r.cam.y) < halfH;
}

function drawBodies(r, game) {
  const { ctx } = r;
  const p = game.field.planet;
  if (onScreen(r, p.x, p.y, p.r * 1.6)) {
    const halo = ctx.createRadialGradient(0, 0, p.r * 0.9, 0, 0, p.r * 1.6);
    halo.addColorStop(0, 'rgba(90,160,255,0.45)');
    halo.addColorStop(1, 'rgba(90,160,255,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(0, 0, p.r * 1.6, 0, TAU); ctx.fill();
    const body = ctx.createRadialGradient(-p.r * 0.35, -p.r * 0.35, p.r * 0.1, 0, 0, p.r);
    body.addColorStop(0, '#6a8cff');
    body.addColorStop(0.6, '#2b3d8f');
    body.addColorStop(1, '#0d1238');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(0, 0, p.r, 0, TAU); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, p.r, 0, TAU); ctx.clip();
    ctx.strokeStyle = 'rgba(160,190,255,0.12)';
    ctx.lineWidth = p.r * 0.08;
    for (let i = -3; i <= 3; i++) {
      ctx.beginPath(); ctx.ellipse(0, i * p.r * 0.25, p.r * 1.1, p.r * 0.06, 0.15, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  }
  for (const m of game.field.moons) {
    if (!onScreen(r, m.x, m.y, m.r * 3)) continue;
    const halo = ctx.createRadialGradient(m.x, m.y, m.r, m.x, m.y, m.r * 3);
    halo.addColorStop(0, 'rgba(200,170,120,0.12)');
    halo.addColorStop(1, 'rgba(200,170,120,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r * 3, 0, TAU); ctx.fill();
    const body = ctx.createRadialGradient(m.x - m.r * 0.3, m.y - m.r * 0.3, m.r * 0.1, m.x, m.y, m.r);
    body.addColorStop(0, '#b9a58a');
    body.addColorStop(1, '#4a3d33');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    for (let k = 0; k < 4; k++) {
      const a = k * 1.9 + m.orbit, d = m.r * (0.2 + 0.15 * k);
      ctx.beginPath(); ctx.arc(m.x + Math.cos(a) * d, m.y + Math.sin(a) * d, m.r * 0.16, 0, TAU); ctx.fill();
    }
  }
}

function drawPortalRoute(r, origin, target, color, width, arrow = false) {
  const { ctx } = r, z = r.cam.zoom;
  ctx.strokeStyle = color; ctx.lineWidth = width / z;
  ctx.beginPath(); ctx.moveTo(origin.x, origin.y); ctx.lineTo(target.x, target.y); ctx.stroke();
  if (!arrow) return;
  const angle = Math.atan2(target.y - origin.y, target.x - origin.x);
  const x = target.x - Math.cos(angle) * 26 / z, y = target.y - Math.sin(angle) * 26 / z;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(x, y);
  ctx.lineTo(x - Math.cos(angle - 0.5) * 18 / z, y - Math.sin(angle - 0.5) * 18 / z);
  ctx.lineTo(x - Math.cos(angle + 0.5) * 18 / z, y - Math.sin(angle + 0.5) * 18 / z);
  ctx.closePath(); ctx.fill();
}

function drawPortals(r, game) {
  if (game.scheme !== 'portal') return;
  const { ctx } = r, z = r.cam.zoom, sh = game.ship, d = game.portalDash;
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (d?.path.length) {
    ctx.beginPath(); ctx.moveTo(d.path[0].x, d.path[0].y);
    for (let i = 1; i < d.path.length; i++) ctx.lineTo(d.path[i].x, d.path[i].y);
    ctx.lineTo(sh.x, sh.y);
    ctx.strokeStyle = 'rgba(95,216,255,0.18)'; ctx.lineWidth = 12 / z; ctx.stroke();
    ctx.strokeStyle = 'rgba(145,235,255,0.85)'; ctx.lineWidth = 3 / z; ctx.stroke();
  }
  const choices = portalChoices(game), labels = new Map(choices.map((c) => [c.portal.id, c.key]));
  const origin = d?.phase === 'hop' ? d.target : sh;
  const next = d ? d.next : game.portalPreview;
  // Every selectable edge is drawn, including those extending beyond the viewport.
  if (d) for (const { portal } of choices) drawPortalRoute(r, origin, portal, 'rgba(160,210,235,0.3)', 1.2);
  if (next) {
    drawPortalRoute(r, origin, next, 'rgba(255,228,107,0.2)', 10);
    drawPortalRoute(r, origin, next, '#ffe46b', 4, true);
    ctx.strokeStyle = '#ffe46b'; ctx.lineWidth = 3 / z;
    ctx.beginPath(); ctx.arc(next.x, next.y, 28 / z, 0, TAU); ctx.stroke();
  }
  const target = d?.phase === 'hop' ? d.target : next;
  if (d?.phase === 'hop') drawPortalRoute(r, sh, d.target, '#d8f7ff', 3, true);
  for (const p of game.portals) {
    if (!onScreen(r, p.x, p.y, 80 / z)) continue;
    const selected = p === next, selectable = labels.has(p.id);
    const color = selected ? '#ffe46b' : p.manual ? '#5fd8ff' : '#c995ff';
    ctx.save(); ctx.globalAlpha = selectable || p === target ? 1 : 0.4;
    ctx.strokeStyle = color; ctx.lineWidth = (selected ? 3.5 : 2) / z;
    ctx.fillStyle = p.manual ? 'rgba(50,150,210,0.18)' : 'rgba(150,80,220,0.2)';
    const R = 20 / z;
    ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(p.x, p.y, R * 0.65, game.t * 2, game.t * 2 + Math.PI * 1.5); ctx.stroke();
    ctx.font = `bold ${12 / z}px ${MONO}`; ctx.textAlign = 'center'; ctx.fillStyle = '#eef8ff';
    ctx.fillText(p.manual ? '∞' : String(p.uses), p.x, p.y + 4 / z);
    if (selected) {
      ctx.font = `bold ${16 / z}px "Hiragino Sans", sans-serif`;
      ctx.fillStyle = '#08101c'; ctx.fillRect(p.x - 32 / z, p.y - 50 / z, 64 / z, 24 / z);
      ctx.fillStyle = '#ffe46b'; ctx.fillText(`次 ${labels.get(p.id) || ''}`, p.x, p.y - 32 / z);
    }
    ctx.restore();
  }
  if (target) {
    ctx.strokeStyle = 'rgba(95,216,255,0.14)'; ctx.lineWidth = waveRadius(game) * 2;
    ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(target.x, target.y); ctx.stroke();
    if (game.stats.portalWave) {
      ctx.strokeStyle = 'rgba(201,149,255,0.5)'; ctx.lineWidth = 1.5 / z;
      ctx.beginPath(); ctx.arc(target.x, target.y, CONFIG.portalWaveRadius * game.stats.waveRadiusMult, 0, TAU); ctx.stroke();
    }
    if (d?.phase !== 'hop') {
      const preview = previewPath(game, [{ x: sh.x, y: sh.y }, target]);
      for (const [e, t] of preview.targets) {
        ctx.strokeStyle = t.crit ? '#ffe46b' : t.body ? '#ffffff' : '#5fd8ff'; ctx.lineWidth = 2 / z;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 5 / z, 0, TAU); ctx.stroke();
      }
      if (preview.block) {
        const q = preview.block, k = 10 / z;
        ctx.strokeStyle = '#ff6b5a'; ctx.lineWidth = 3 / z;
        ctx.beginPath(); ctx.moveTo(q.x - k, q.y - k); ctx.lineTo(q.x + k, q.y + k);
        ctx.moveTo(q.x + k, q.y - k); ctx.lineTo(q.x - k, q.y + k); ctx.stroke();
      }
    }
  }
  ctx.restore();
}

function drawPortalHud(r, game) {
  if (game.scheme !== 'portal' || game.state !== 'play') return;
  const { ctx, W, H } = r, d = game.portalDash, press = game.portalSpace;
  const choices = portalChoices(game), index = choices.findIndex((c) => c.portal === d?.next);
  const bw = Math.min(360, W - 32), x = (W - bw) / 2, y = H - 145;
  ctx.fillStyle = 'rgba(8,12,28,0.88)'; ctx.fillRect(x - 8, y - 17, bw + 16, 91);
  ctx.textAlign = 'center'; ctx.fillStyle = '#e8f6ff';
  ctx.font = `${Math.min(13, Math.max(9, (W - 32) / 34))}px "Hiragino Sans", sans-serif`;
  ctx.fillText(d ? `A / D 選択 ${index + 1}/${choices.length}・Space 短押しで移動` : 'Space 短押しで最寄りポータルへ', W / 2, y);
  ctx.fillStyle = '#b8c6ea';
  ctx.fillText(d ? `Space ${CONFIG.portalExitHold.toFixed(1)}秒長押しで離脱` : 'WASD 移動・B ポータル設置', W / 2, y + 18);
  ctx.fillStyle = '#9fe8ff'; ctx.fillRect(x, y + 30, bw * (d ? d.remaining / d.budget : 1), 5);
  const holding = press.armed && !press.consumed;
  if (holding && d) {
    ctx.fillStyle = '#ffb340'; ctx.fillRect(x, y + 40, bw * Math.min(1, press.seconds / CONFIG.portalExitHold), 4);
  }
  ctx.font = `11px ${MONO}`; ctx.fillStyle = holding && d ? '#ffcf83' : '#b8c6ea';
  ctx.fillText(d ? (holding ? `離脱まで ${(Math.max(0, CONFIG.portalExitHold - press.seconds)).toFixed(1)} 秒`
    : !d.next ? '行き先なし・到着後に自動離脱' : d.phase === 'hop' ? '移動中・A/Dで次を選択できる' : '黄色い太線が次の行き先')
    : `ゲージ不要・ポータル ${game.portals.length}`, W / 2, y + 60);
  for (const c of choices) {
    if (onScreen(r, c.portal.x, c.portal.y, 0)) continue;
    const p = worldToScreen(r, c.portal.x, c.portal.y);
    const px = clamp(p.x, 36, W - 36), py = clamp(p.y, Math.min(88, H * 0.2), Math.max(H * 0.2, H - 175));
    ctx.fillStyle = 'rgba(8,12,28,0.85)'; ctx.fillRect(px - 32, py - 15, 64, 30);
    ctx.font = `bold 16px ${MONO}`; ctx.fillStyle = c.portal === d?.next ? '#ffe46b' : '#8bb9ca';
    ctx.fillText(c.portal === d?.next ? `次 ${c.key}` : c.key, px, py + 5);
  }
}

// Hyperdrive, in the world: the reach circle, the aimed jump with what it would cut, and the jump in flight.
function drawHyperUi(r, game, pointer) {
  if (!isHyperScheme(game.scheme) || game.state !== 'play') return;
  const { ctx } = r;
  const z = r.cam.zoom;
  const sh = game.ship, h = game.hyper, j = game.jump;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // vortices left by jumps (perk): a fading disc and three turning arcs
  for (const v of game.vortices) {
    const a = v.life / v.max;
    ctx.fillStyle = `rgba(150,110,255,${0.1 * a})`;
    ctx.beginPath(); ctx.arc(v.x, v.y, v.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = `rgba(190,160,255,${0.7 * a})`; ctx.lineWidth = 3 / z;
    for (let k = 0; k < 3; k++) {
      const s = -game.t * 5 + k * TAU / 3, rr = v.r * (0.35 + 0.25 * k);
      ctx.beginPath(); ctx.arc(v.x, v.y, rr, s, s + 1.6); ctx.stroke();
    }
  }
  if (j) {
    ctx.strokeStyle = 'rgba(159,232,255,0.16)';
    ctx.lineWidth = waveRadius(game) * 2;
    ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(j.to.x, j.to.y); ctx.stroke();
    ctx.strokeStyle = 'rgba(214,246,255,0.75)';
    ctx.lineWidth = 3 / z;
    ctx.beginPath(); ctx.moveTo(j.from.x, j.from.y); ctx.lineTo(j.to.x, j.to.y); ctx.stroke();
  }
  if (h.focus) {
    const ready = h.charges >= 1;
    const reach = hyperReach(game);
    ctx.strokeStyle = ready ? 'rgba(255,228,107,0.75)' : 'rgba(159,232,255,0.4)';
    ctx.lineWidth = 2 / z;
    ctx.setLineDash([14 / z, 10 / z]);
    ctx.beginPath(); ctx.arc(sh.x, sh.y, reach, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    const hover = pointer?.hover;
    if (!j && ready && hover) {
      const c = screenToWorld(r, hover.x, hover.y);
      const t = jumpTarget(game, c);
      const pv = previewPath(game, [{ x: sh.x, y: sh.y }, t]);
      ctx.strokeStyle = 'rgba(95,216,255,0.16)'; ctx.lineWidth = waveRadius(game) * 2;
      ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(t.x, t.y); ctx.stroke();
      ctx.strokeStyle = '#d6f6ff'; ctx.lineWidth = 3 / z;
      ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(t.x, t.y); ctx.stroke();
      // white/yellow: the ship body cuts it; cyan: only the wave reaches it
      for (const [e, tg] of pv.targets) {
        ctx.strokeStyle = tg.crit ? '#ffe46b' : tg.body ? 'rgba(255,255,255,0.9)' : 'rgba(120,225,255,0.85)';
        ctx.lineWidth = 3 / z;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 7 / z, 0, TAU); ctx.stroke();
      }
      if (pv.block) {
        const k = 12 / z, b = pv.block;
        ctx.strokeStyle = '#ff4d4d'; ctx.lineWidth = 4 / z;
        ctx.beginPath(); ctx.moveTo(b.x - k, b.y - k); ctx.lineTo(b.x + k, b.y + k); ctx.moveTo(b.x + k, b.y - k); ctx.lineTo(b.x - k, b.y + k); ctx.stroke();
      }
      ctx.strokeStyle = t.blocked ? '#ffb340' : '#ffe46b';
      ctx.lineWidth = 3 / z;
      ctx.beginPath(); ctx.arc(t.x, t.y, CONFIG.shipRadius + 6 / z, 0, TAU); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,228,107,0.6)'; ctx.lineWidth = 2 / z;
    for (const q of h.queue) { ctx.beginPath(); ctx.arc(q.x, q.y, 10 / z, 0, TAU); ctx.stroke(); }
  }
  ctx.restore();
}

// Hyperdrive, on screen: charge pips under the ship, plus the slow-motion tint and hints in the mode.
function drawHyperHud(r, game) {
  if (!isHyperScheme(game.scheme) || game.state !== 'play') return;
  const { ctx, W, H } = r;
  const h = game.hyper;
  ctx.save();
  if (h.focus) {
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.hypot(W, H) / 2);
    g.addColorStop(0, 'rgba(40,70,140,0)');
    g.addColorStop(1, 'rgba(40,70,140,0.35)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  const p = worldToScreen(r, game.ship.x, game.ship.y);
  const n = hyperMaxCharges(game), gap = 14, w = 10;
  const x0 = clamp(p.x - ((n - 1) * gap) / 2, 8, W - (n - 1) * gap - 8), y = clamp(p.y + 34, 8, H - 30);
  for (let i = 0; i < n; i++) {
    const x = x0 + i * gap;
    const fill = i < h.charges ? 1 : i === h.charges ? h.progress : 0;
    ctx.fillStyle = 'rgba(3,8,20,0.85)';
    ctx.fillRect(x - w / 2 - 1, y - 4, w + 2, 8);
    ctx.fillStyle = 'rgba(190,215,255,0.2)';
    ctx.fillRect(x - w / 2, y - 3, w, 6);
    if (fill > 0) {
      ctx.fillStyle = fill >= 1 ? (h.focus ? '#ffe46b' : '#9fe8ff') : 'rgba(159,232,255,0.55)';
      ctx.fillRect(x - w / 2, y - 3, w * fill, 6);
    }
  }
  if (h.focus) {
    const label = h.charges >= 1 ? `クリックでジャンプ（残り ${h.charges}）・Space／右クリックで解除` : 'ジャンプ中…';
    ctx.font = `13px "Hiragino Sans", "Noto Sans JP", sans-serif`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(3,8,20,0.95)';
    const ty = Math.max(70, H * 0.16);
    ctx.strokeText(label, W / 2, ty);
    ctx.fillStyle = '#ffe46b';
    ctx.fillText(label, W / 2, ty);
    if (CONFIG.hyperFocusMax > 0) {
      const bw = Math.min(240, W - 32), frac = clamp(1 - h.focusT / CONFIG.hyperFocusMax, 0, 1);
      ctx.fillStyle = 'rgba(3,8,20,0.85)'; ctx.fillRect((W - bw) / 2 - 1, ty + 9, bw + 2, 6);
      ctx.fillStyle = frac < 0.3 ? '#ffb340' : '#9fe8ff'; ctx.fillRect((W - bw) / 2, ty + 10, bw * frac, 4);
    }
  }
  ctx.restore();
}

function drawPrediction(r, game) {
  const sh = game.ship;
  if (!sh.charging) return;
  let ax = sh.aimX, ay = sh.aimY;
  if (Math.hypot(ax, ay) < CONFIG.minDrag) { ax = sh.vx; ay = sh.vy; }
  if (Math.hypot(ax, ay) < 1) return;
  const pts = annotatePrediction(game, predictPath(game, ax, ay, sh.gauge, game.stats.predictTime), game.stats.predictTime);
  const { ctx } = r;
  const dot = 3.2 / r.cam.zoom;
  for (let i = 2; i < pts.length; i += 3) {
    const p = pts[i];
    ctx.globalAlpha = 0.85 * (1 - i / pts.length) + 0.1;
    ctx.fillStyle = p.hot ? '#ffe46b' : p.bounced ? '#c9a6ff' : '#9fe8ff';
    const s = p.hot ? dot * 2 : dot;
    ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const end = pts[pts.length - 1];
  if (end && end.block) {
    const k = 10 / r.cam.zoom;
    ctx.strokeStyle = '#ff4d4d';
    ctx.lineWidth = 3 / r.cam.zoom;
    ctx.beginPath();
    ctx.moveTo(end.x - k, end.y - k); ctx.lineTo(end.x + k, end.y + k);
    ctx.moveTo(end.x + k, end.y - k); ctx.lineTo(end.x - k, end.y + k);
    ctx.stroke();
  }
}

function shapePath(ctx, shape, R) {
  ctx.beginPath();
  if (shape === 'hex') {
    for (let i = 0; i < 6; i++) { const a = i * TAU / 6; ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R); }
    ctx.closePath();
  } else if (shape === 'dart') {
    ctx.moveTo(R * 1.2, 0); ctx.lineTo(-R * 0.8, R * 0.8); ctx.lineTo(-R * 0.4, 0); ctx.lineTo(-R * 0.8, -R * 0.8); ctx.closePath();
  } else if (shape === 'diamond') {
    ctx.moveTo(R, 0); ctx.lineTo(0, R * 0.8); ctx.lineTo(-R, 0); ctx.lineTo(0, -R * 0.8); ctx.closePath();
  } else if (shape === 'blob') {
    for (let i = 0; i < 10; i++) { const a = i * TAU / 10, k = i % 2 ? 0.82 : 1; ctx.lineTo(Math.cos(a) * R * k, Math.sin(a) * R * k); }
    ctx.closePath();
  } else if (shape === 'ship') {
    ctx.moveTo(R * 1.3, 0); ctx.lineTo(R * 0.3, R * 0.55); ctx.lineTo(-R, R * 0.6); ctx.lineTo(-R * 0.8, 0); ctx.lineTo(-R, -R * 0.6); ctx.lineTo(R * 0.3, -R * 0.55); ctx.closePath();
  } else if (shape === 'rock') {
    for (let i = 0; i < 8; i++) { const a = i * TAU / 8, k = 0.8 + ((i * 37) % 5) * 0.06; ctx.lineTo(Math.cos(a) * R * k, Math.sin(a) * R * k); }
    ctx.closePath();
  } else {
    ctx.arc(0, 0, R, 0, TAU);
  }
}

function drawEnemies(r, game) {
  const { ctx } = r;
  const z = r.cam.zoom;
  const sp = Math.hypot(game.ship.vx, game.ship.vy);
  const atk = attackPower(sp, game.stats);
  const arcMult = game.stats.weakArcMult;
  for (const e of game.enemies) {
    if (!onScreen(r, e.x, e.y, e.r + 220)) continue;
    const R = e.r;
    ctx.save();
    ctx.translate(e.x, e.y);
    if (e.T.auraR) {
      const g = ctx.createRadialGradient(0, 0, R, 0, 0, e.T.auraR);
      g.addColorStop(0, 'rgba(199,125,255,0.22)');
      g.addColorStop(1, 'rgba(199,125,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, e.T.auraR, 0, TAU); ctx.fill();
    }
    if (e.state === 'windup') {
      ctx.strokeStyle = 'rgba(255,90,60,0.7)';
      ctx.lineWidth = 3 / z;
      ctx.setLineDash([12 / z, 8 / z]);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(e.facing) * 500, Math.sin(e.facing) * 500); ctx.stroke();
      ctx.setLineDash([]);
    }
    if (e.charge > 0) {
      ctx.fillStyle = `rgba(255,80,80,${0.25 + 0.5 * e.charge})`;
      ctx.beginPath(); ctx.arc(Math.cos(e.facing) * R, Math.sin(e.facing) * R, (4 + 8 * e.charge) / Math.sqrt(z), 0, TAU); ctx.fill();
    }
    const pierce = atk >= e.armor;
    const critOnly = !pierce && atk >= e.armor * CRIT_ARMOR;
    // body
    ctx.save();
    ctx.rotate(e.facing);
    shapePath(ctx, e.T.shape, R);
    ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.T.color;
    ctx.globalAlpha = pierce ? 1 : 0.8;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.lineWidth = Math.max(1.5 / z, R * 0.08);
    ctx.strokeStyle = e.elite ? '#ffcf4a' : pierce ? 'rgba(255,255,255,0.85)' : 'rgba(40,0,0,0.6)';
    ctx.stroke();
    // eye / nose shows facing
    ctx.fillStyle = '#0b0f1e';
    ctx.beginPath(); ctx.arc(R * 0.45, 0, R * 0.2, 0, TAU); ctx.fill();
    ctx.restore();
    // weak spot
    if (e.weakArc) {
      const wa = e.facing + e.weakDir, half = Math.min(Math.PI, e.weakArc * arcMult);
      const lw = Math.max(4 / z, R * 0.32);
      ctx.strokeStyle = '#ffe46b';
      ctx.lineWidth = lw;
      ctx.beginPath(); ctx.arc(0, 0, R + lw * 0.3, wa - half, wa + half); ctx.stroke();
      if (e.weakDir2 !== undefined) {
        const wb = e.facing + e.weakDir2;
        ctx.beginPath(); ctx.arc(0, 0, R + lw * 0.3, wb - half, wb + half); ctx.stroke();
      }
    }
    // cannot pierce: red ring (orange dashed = only through the weak spot)
    if (!pierce) {
      ctx.lineWidth = 3 / z;
      ctx.strokeStyle = critOnly ? '#ff9f40' : '#ff3b3b';
      if (critOnly) ctx.setLineDash([8 / z, 6 / z]);
      ctx.beginPath(); ctx.arc(0, 0, R + 9 / z + R * 0.2, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    }
    if (e.hp < e.maxHp) {
      const w = Math.max(R * 2, 30 / z), h = 4 / z;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(-w / 2, -R - 16 / z, w, h);
      ctx.fillStyle = '#ff6b5a';
      ctx.fillRect(-w / 2, -R - 16 / z, w * Math.max(0, e.hp / e.maxHp), h);
    }
    ctx.restore();
  }
}

function drawEnemyBullets(r, game) {
  const { ctx } = r;
  const z = r.cam.zoom;
  for (const b of game.ebullets) {
    if (!onScreen(r, b.x, b.y, 40)) continue;
    const s = b.r / Math.sqrt(z);
    if (b.kind === 'missile') {
      const a = Math.atan2(b.vy, b.vx);
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(a);
      ctx.fillStyle = '#ffb36b';
      ctx.beginPath(); ctx.moveTo(s * 1.6, 0); ctx.lineTo(-s, s * 0.7); ctx.lineTo(-s, -s * 0.7); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,200,120,0.5)';
      ctx.beginPath(); ctx.arc(-s * 1.6, 0, s * 0.6, 0, TAU); ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = '#ff5a6e';
      ctx.beginPath(); ctx.arc(b.x, b.y, s, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffd0d6';
      ctx.beginPath(); ctx.arc(b.x, b.y, s * 0.45, 0, TAU); ctx.fill();
    }
  }
}

function drawFx(r, game) {
  const { ctx } = r;
  const z = r.cam.zoom;
  for (const loop of game.fx.loops) {
    const a = Math.max(0, loop.life / loop.max);
    ctx.beginPath(); ctx.moveTo(loop.points[0].x, loop.points[0].y);
    for (let i = 1; i < loop.points.length; i++) ctx.lineTo(loop.points[i].x, loop.points[i].y);
    ctx.closePath(); ctx.fillStyle = loop.color; ctx.globalAlpha = 0.3 * a; ctx.fill();
    ctx.globalAlpha = a; ctx.strokeStyle = loop.color; ctx.lineWidth = (3 + 5 * a) / z; ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // warp afterimages
  for (const g of game.fx.ghosts) {
    const a = Math.max(0, g.life / g.max);
    if (g.streak) {
      ctx.strokeStyle = `rgba(190,240,255,${0.5 * a})`;
      ctx.lineWidth = CONFIG.shipRadius * 1.2 * a;
      ctx.beginPath(); ctx.moveTo(g.x0, g.y0); ctx.lineTo(g.x1, g.y1); ctx.stroke();
      continue;
    }
    const s = Math.max(CONFIG.shipRadius, 9 / z);
    ctx.globalAlpha = 0.55 * a;
    ctx.fillStyle = '#5fd8ff';
    ctx.beginPath(); ctx.arc(g.x, g.y, s * (1 + 0.3 * (1 - a)), 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.8 * a;
    ctx.strokeStyle = '#bff3ff'; ctx.lineWidth = s * 0.2;
    ctx.beginPath(); ctx.arc(g.x, g.y, s * 0.82, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  const ps = 1 / Math.sqrt(z);
  for (const p of game.fx.particles) {
    ctx.globalAlpha = Math.min(1, p.life / 0.4);
    ctx.fillStyle = p.color;
    const s = p.size * ps;
    if (p.kind === 'finishDebris') {
      ctx.save(); ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.translate(p.x, p.y); ctx.rotate(p.angle);
      ctx.strokeStyle = p.color; ctx.lineWidth = 1.5 / z;
      ctx.fillStyle = '#dfe9f0';
      ctx.beginPath(); ctx.moveTo(-s, -s * 0.6); ctx.lineTo(s * 0.8, -s * 0.35);
      ctx.lineTo(s * 0.5, s * 0.7); ctx.lineTo(-s * 0.6, s * 0.5); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
      continue;
    }
    if (p.kind === 'spark') {
      const speed = Math.hypot(p.vx, p.vy) || 1;
      const length = s * 4;
      ctx.strokeStyle = p.color; ctx.lineWidth = Math.max(1 / z, s * 0.55);
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx / speed * length, p.y - p.vy / speed * length); ctx.stroke();
      continue;
    }
    if (p.kind === 'flame') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.atan2(p.vy, p.vx));
      ctx.beginPath(); ctx.ellipse(0, 0, s * 2.4, s * 0.8, 0, 0, TAU); ctx.fill(); ctx.restore();
      continue;
    }
    ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
  }
  for (const g of game.fx.rings) {
    const k = 1 - g.life / g.max;
    ctx.globalAlpha = Math.max(0, g.life / g.max);
    ctx.strokeStyle = g.color;
    ctx.lineWidth = (10 * (1 - k) + 2) / z;
    ctx.beginPath(); ctx.arc(g.x, g.y, g.radius * (0.2 + 0.8 * Math.sqrt(k)), 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const t of game.fx.texts) {
    ctx.globalAlpha = Math.min(1, t.life / 0.3);
    ctx.fillStyle = t.color;
    ctx.font = `800 ${Math.round((t.size || 16) / z)}px ${MONO}`;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

function drawMinimap(r, game) {
  const { ctx, W, H } = r;
  const R = Math.min(90, Math.min(W, H) * 0.12);
  const cx = W - R - 16, cy = R + 16;
  const k = R / (CONFIG.fieldRadius + 300);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = 'rgba(8,12,28,0.78)';
  ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(150,70,255,0.16)';
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.fieldRadius * k, 0, TAU); ctx.arc(0, 0, CONFIG.zoneOuter * k, 0, TAU, true); ctx.fill();
  ctx.fillStyle = 'rgba(255,70,50,0.18)';
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.zoneInner * k, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(190,120,255,0.8)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.fieldRadius * k, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#4a68d8';
  ctx.beginPath(); ctx.arc(0, 0, Math.max(3, CONFIG.planetRadius * k), 0, TAU); ctx.fill();
  ctx.fillStyle = '#a08a6c';
  for (const m of game.field.moons) { ctx.beginPath(); ctx.arc(m.x * k, m.y * k, 2.2, 0, TAU); ctx.fill(); }
  for (const e of game.enemies) {
    if (e.type !== 'battleship' && !e.elite) continue;
    ctx.fillStyle = e.type === 'battleship' ? '#ff5a5a' : '#ffcf4a';
    ctx.fillRect(e.x * k - 2, e.y * k - 2, 4, 4);
  }
  for (const c of game.capsules) {
    ctx.fillStyle = c.kind === 'core' ? '#ffd24a' : RARITIES[c.mod.r].color;
    const s2 = c.kind === 'core' ? 3.5 : 2.5;
    ctx.beginPath(); ctx.moveTo(c.x * k, c.y * k - s2); ctx.lineTo(c.x * k + s2, c.y * k); ctx.lineTo(c.x * k, c.y * k + s2); ctx.lineTo(c.x * k - s2, c.y * k); ctx.closePath(); ctx.fill();
  }
  const sh = game.ship;
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(sh.x * k, sh.y * k, game.viewRadius * k, 0, TAU); ctx.stroke();
  ctx.strokeStyle = '#5fd8ff';
  ctx.beginPath(); ctx.moveTo(sh.x * k, sh.y * k); ctx.lineTo((sh.x + sh.vx * 1.5) * k, (sh.y + sh.vy * 1.5) * k); ctx.stroke();
  ctx.fillStyle = '#e8f6ff';
  ctx.beginPath(); ctx.arc(sh.x * k, sh.y * k, 3, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawBackground(r, game) {
  const { ctx, W, H } = r;
  ctx.fillStyle = '#04050b';
  ctx.fillRect(0, 0, W, H);
  const sh = game.ship;
  const vx = sh.vx, vy = sh.vy;
  for (const L of r.layers) {
    const ox = ((-r.cam.x * L.p) % STAR_TILE + STAR_TILE) % STAR_TILE;
    const oy = ((-r.cam.y * L.p) % STAR_TILE + STAR_TILE) % STAR_TILE;
    const stretch = Math.min(260, Math.hypot(vx, vy) * L.p * 0.05);
    const sp = Math.hypot(vx, vy) || 1;
    const ux = -vx / sp, uy = -vy / sp;
    ctx.strokeStyle = '#cfe0ff';
    ctx.fillStyle = '#cfe0ff';
    for (const s of L.stars) {
      for (let tx = -STAR_TILE; tx < W + STAR_TILE; tx += STAR_TILE) {
        const x = s.x + ox + tx - STAR_TILE;
        if (x < -20 || x > W + 20) continue;
        for (let ty = -STAR_TILE; ty < H + STAR_TILE; ty += STAR_TILE) {
          const y = s.y + oy + ty - STAR_TILE;
          if (y < -20 || y > H + 20) continue;
          ctx.globalAlpha = s.a;
          if (stretch > 2) {
            ctx.lineWidth = s.s;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + ux * stretch, y + uy * stretch);
            ctx.stroke();
          } else {
            ctx.fillRect(x, y, s.s, s.s);
          }
        }
      }
    }
  }
  ctx.globalAlpha = 1;
}

// Procedural dust specks in world space: the main cue for how fast the world flows by.
function drawSpecks(r) {
  const { ctx, cam } = r;
  const cell = 420;
  const halfW = r.W / 2 / cam.zoom, halfH = r.H / 2 / cam.zoom;
  const x0 = Math.floor((cam.x - halfW) / cell), x1 = Math.floor((cam.x + halfW) / cell);
  const y0 = Math.floor((cam.y - halfH) / cell), y1 = Math.floor((cam.y + halfH) / cell);
  ctx.fillStyle = '#7f8db8';
  const size = 2.2 / cam.zoom;
  for (let cx = x0; cx <= x1; cx++) {
    for (let cy = y0; cy <= y1; cy++) {
      let h = (cx * 73856093) ^ (cy * 19349663);
      for (let k = 0; k < 3; k++) {
        h = Math.imul(h ^ (h >>> 13), 0x5bd1e995) >>> 0;
        const px = cx * cell + (h & 1023) / 1023 * cell;
        h = Math.imul(h ^ (h >>> 15), 0x27d4eb2d) >>> 0;
        const py = cy * cell + (h & 1023) / 1023 * cell;
        ctx.globalAlpha = 0.35 + ((h >>> 12) & 7) / 14;
        ctx.fillRect(px, py, size, size);
      }
    }
  }
  ctx.globalAlpha = 1;
}

function drawTrail(r, game) {
  const { ctx } = r;
  const sh = game.ship;
  const tr = sh.trail;
  if (tr.length < 2) return;
  const sp = Math.hypot(sh.vx, sh.vy);
  const ratio = sp / game.stats.maxSpeed;
  const n = Math.min(tr.length, Math.round(6 + clamp(ratio, 0, 2) * 55));
  const start = tr.length - n;
  const hot = clamp((ratio - 0.85) / 0.4, 0, 1);
  ctx.lineCap = 'round';
  for (let i = start + 1; i < tr.length; i++) {
    const a = (i - start) / n;
    ctx.globalAlpha = a * 0.85;
    ctx.strokeStyle = hot > 0 ? `rgb(${120 + 135 * hot},${220 + 35 * hot},255)` : '#5fd8ff';
    ctx.lineWidth = (CONFIG.shipRadius * 1.1) * a + 1 / r.cam.zoom;
    ctx.beginPath();
    ctx.moveTo(tr[i - 1].x, tr[i - 1].y);
    ctx.lineTo(tr[i].x, tr[i].y);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(tr[tr.length - 1].x, tr[tr.length - 1].y);
  ctx.lineTo(sh.x, sh.y);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// The ship never rotates: a round craft, so screen-absolute controls always read the same way.
// Direction is shown by the trail and the heading marker instead.
function drawShip(r, game) {
  const { ctx } = r;
  const sh = game.ship;
  const s = Math.max(CONFIG.shipRadius, 9 / r.cam.zoom);
  ctx.save();
  ctx.translate(sh.x, sh.y);
  if (sh.invulnT > 0 && Math.floor(game.t * 20) % 2 === 0) ctx.globalAlpha = 0.4;
  ctx.shadowColor = '#5fd8ff';
  ctx.shadowBlur = 18;
  ctx.fillStyle = '#1b3b5c';
  ctx.beginPath(); ctx.arc(0, 0, s, 0, TAU); ctx.fill();
  ctx.lineWidth = s * 0.28;
  ctx.strokeStyle = '#bff3ff';
  ctx.beginPath(); ctx.arc(0, 0, s * 0.82, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(0, 0, s * 0.38, 0, TAU); ctx.fill();
  ctx.restore();
}

// Aim marker: a Space launch goes this way (scheme dependent).
function drawAimMarker(r, game) {
  const sh = game.ship;
  if (sh.charging || game.state !== 'play' || isHyperScheme(game.scheme)) return;
  const { ctx } = r;
  const p = worldToScreen(r, sh.x, sh.y);
  const ux = sh.markX, uy = sh.markY; // where a Space launch would go under the current scheme
  ctx.globalAlpha = 0.85;
  ctx.strokeStyle = '#9fe8ff';
  ctx.lineWidth = 2;
  ctx.setLineDash([3, 5]);
  ctx.beginPath(); ctx.moveTo(p.x + ux * 24, p.y + uy * 24); ctx.lineTo(p.x + ux * 46, p.y + uy * 46); ctx.stroke();
  ctx.setLineDash([]);
  const tx = p.x + ux * 56, ty = p.y + uy * 56;
  ctx.fillStyle = '#9fe8ff';
  ctx.beginPath();
  ctx.moveTo(tx + ux * 9, ty + uy * 9);
  ctx.lineTo(tx - ux * 3 - uy * 7, ty - uy * 3 + ux * 7);
  ctx.lineTo(tx - ux * 3 + uy * 7, ty - uy * 3 - ux * 7);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}

// Hyperdrive scheme: the virtual stick (press point + knob) while the pointer is held outside the mode.
function drawStick(r, game, pointer) {
  if (game.scheme !== 'hyper' || game.hyper.focus || !pointer || !pointer.down || pointer.pointerType !== 'touch' || game.state !== 'play') return;
  const { ctx } = r;
  const R = CONFIG.stickRadius;
  ctx.save();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(190,215,255,0.35)';
  ctx.fillStyle = 'rgba(190,215,255,0.06)';
  ctx.beginPath(); ctx.arc(pointer.sx, pointer.sy, R, 0, TAU); ctx.fill(); ctx.stroke();
  // the knob stays on the ring when the finger goes further (the press point never moves)
  const dx = pointer.cx - pointer.sx, dy = pointer.cy - pointer.sy, d = Math.hypot(dx, dy), k = d > R ? R / d : 1;
  ctx.fillStyle = 'rgba(220,235,255,0.55)';
  ctx.beginPath(); ctx.arc(pointer.sx + dx * k, pointer.sy + dy * k, 16, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawChargeUi(r, game, pointer) {
  drawStick(r, game, pointer);
  drawAimMarker(r, game);
  const sh = game.ship;
  if (!sh.charging) return;
  const { ctx } = r;
  const p = worldToScreen(r, sh.x, sh.y);
  const g = sh.gauge;
  const full = g >= 1;
  // gauge ring
  ctx.lineWidth = 5;
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath(); ctx.arc(p.x, p.y, 34, 0, TAU); ctx.stroke();
  ctx.strokeStyle = g > 1 ? '#ff9f40' : full ? '#ffe46b' : '#5fd8ff';
  ctx.beginPath(); ctx.arc(p.x, p.y, 34, -Math.PI / 2, -Math.PI / 2 + TAU * Math.min(1, g)); ctx.stroke();
  if (g > 1) {
    ctx.strokeStyle = '#ff5a3c';
    ctx.beginPath(); ctx.arc(p.x, p.y, 40, -Math.PI / 2, -Math.PI / 2 + TAU * (g - 1) / Math.max(0.01, game.stats.gaugeMax - 1)); ctx.stroke();
  }
  // aim arrow
  const len = Math.hypot(sh.aimX, sh.aimY);
  if (len >= CONFIG.minDrag) {
    const ux = sh.aimX / len, uy = sh.aimY / len;
    const L = 50 + 90 * Math.min(1.5, g);
    ctx.strokeStyle = full ? '#ffe46b' : '#9fe8ff';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(p.x + ux * 40, p.y + uy * 40); ctx.lineTo(p.x + ux * L, p.y + uy * L); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p.x + ux * (L + 12), p.y + uy * (L + 12));
    ctx.lineTo(p.x + ux * L - uy * 8, p.y + uy * L + ux * 8);
    ctx.lineTo(p.x + ux * L + uy * 8, p.y + uy * L - ux * 8);
    ctx.closePath();
    ctx.fillStyle = ctx.strokeStyle; ctx.fill();
  }
  // drag rubber band (screen space)
  if (pointer && pointer.down) {
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.moveTo(pointer.sx, pointer.sy); ctx.lineTo(pointer.cx, pointer.cy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(pointer.sx, pointer.sy, 6, 0, TAU); ctx.stroke();
  }
}


function drawHud(r, game) {
  drawSpeedPanel(r, game);
  drawStatus(r, game);
  drawTimer(r, game);
  drawLoadout(r, game);
}

// Bottom-left: the ship assembled from the equipped parts (empty slots are dashed outlines),
// with the module names beside it on wide screens.
// Size of the bottom-left ship diagram; shrinks on narrow (portrait phone) screens.
// Matches the dash button's CSS offset (min(102px, 13.6vh, 17vw) = unit * 6.8).
function loadoutUnit(r) {
  return Math.min(15, r.H / 50, r.W / 40);
}

function drawLoadout(r, game) {
  const { ctx, H, W } = r;
  const unit = loadoutUnit(r);
  const cx = 12 + unit * 3.4, cy = H - 14 - unit * 3.4;
  ctx.fillStyle = 'rgba(8,12,28,0.55)';
  ctx.beginPath(); ctx.arc(cx, cy - unit * 0.1, unit * 3.4, 0, TAU); ctx.fill();
  drawShipAssembly(ctx, cx, cy, unit, (slot) => {
    const m = game.loadout[slot];
    return m ? RARITIES[m.r].color : null;
  }, null, game.t);
  if (W < 960) return; // names only where they clear the speed bar
  const x = cx + unit * 3.8, y0 = cy - unit * 3 + 4;
  ctx.textAlign = 'left';
  ctx.font = '12px "Hiragino Sans", "Noto Sans JP", sans-serif';
  SLOTS.forEach((s, i) => {
    const m = game.loadout[s.id];
    ctx.fillStyle = m ? RARITIES[m.r].color : '#4a5878';
    ctx.fillText(`${s.name}: ${m ? moduleDef(m.id).name + (m.plus ? ` +${m.plus}` : '') : '—'}`, x, y0 + i * 17);
  });
}

function drawTimer(r, game) {
  const { ctx, W } = r;
  const left = Math.max(0, CONFIG.runTime - game.t);
  const m = Math.floor(left / 60), sec = Math.floor(left % 60);
  ctx.textAlign = 'center';
  ctx.fillStyle = left < 60 ? '#ff8a6b' : '#e8f0ff';
  ctx.font = `700 26px ${MONO}`;
  ctx.fillText(`${m}:${String(sec).padStart(2, '0')}`, W / 2, 40);
  // xp bar
  const need = xpForLevel(game.level);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(0, 0, W, 5);
  ctx.fillStyle = '#6dffb0';
  ctx.fillRect(0, 0, W * Math.min(1, game.xp / need), 5);
}

function drawStatus(r, game) {
  const { ctx } = r;
  const sh = game.ship;
  const frac = Math.max(0, sh.hp / game.stats.maxHp);
  // HP bar right under the ship
  const p = worldToScreen(r, sh.x, sh.y);
  const bw = 44, bx = p.x - bw / 2, by = p.y + Math.max(CONFIG.shipRadius * r.cam.zoom, 9) + 10;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(bx - 1, by - 1, bw + 2, 7);
  ctx.fillStyle = frac < 0.3 ? '#ff5a4a' : '#5dffa0';
  ctx.fillRect(bx, by, bw * frac, 5);
  const x = 16, y = 18;
  ctx.fillStyle = '#e8f0ff';
  ctx.font = `12px ${MONO}`;
  ctx.textAlign = 'left';
  ctx.fillText(`HP ${Math.ceil(Math.max(0, sh.hp))} / ${Math.round(game.stats.maxHp)}`, x, y + 10);
  const atk = attackPower(Math.hypot(sh.vx, sh.vy), game.stats);
  let ly = y + 28;
  if (r.W < 600) {
    // narrow (portrait phone): shorter lines so they clear the timer in the middle
    ctx.fillText(`ATK ${atk.toFixed(1)}  Lv ${game.level}`, x, ly);
    ctx.fillText(`撃破 ${game.kills}`, x, ly += 18);
  } else {
    ctx.fillText(`ATK ${atk.toFixed(1)}   撃破 ${game.kills}   Lv ${game.level}`, x, ly);
  }
  ctx.fillStyle = '#ffd24a';
  ctx.fillText(`部品 ${Math.round(game.coins)}`, x, ly + 18);
}

function drawSpeedPanel(r, game) {
  const { ctx, W, H } = r;
  const sp = Math.hypot(game.ship.vx, game.ship.vy);
  const kms = (v) => (v * CONFIG.speedToKms).toFixed(2);
  const bh = 10, by = H - 34;
  let bw = Math.min(420, W * 0.5), bx = W / 2 - bw / 2;
  const clear = 12 + loadoutUnit(r) * 6.8 + 14; // right edge of the ship diagram
  if (bx < clear) { bx = clear; bw = Math.max(80, W - clear - 16); }
  const mid = bx + bw / 2;
  const top = Math.max(CONFIG.baseMaxSpeed, game.stats.maxSpeed, sp, game.peakSpeed) * 1.15;
  const X = (v) => bx + clamp(v / top, 0, 1) * bw;
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(bx, by, bw, bh);
  const hot = sp > game.stats.maxSpeed;
  ctx.fillStyle = hot ? '#bff3ff' : '#5fd8ff';
  ctx.fillRect(bx, by, X(sp) - bx, bh);
  // max speed tick
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(X(game.stats.maxSpeed) - 1, by - 5, 2, bh + 10);
  // peak marker
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillRect(X(game.peakSpeed) - 1, by, 2, bh);
  ctx.font = `11px ${MONO}`;
  ctx.textAlign = 'center';
  // labels stay on screen whatever the width
  const fit = (text, x) => { const w = ctx.measureText(text).width / 2; return clamp(x, w + 4, W - w - 4); };
  const capTxt = `上限 ${kms(game.stats.maxSpeed)}`;
  ctx.fillStyle = '#cfd8ee';
  ctx.fillText(capTxt, fit(capTxt, X(game.stats.maxSpeed)), by + bh + 14);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#8fa3c8';
  ctx.fillText(`最高 ${kms(game.peakSpeed)}`, bx, by - 8);
  ctx.fillStyle = hot ? '#bff3ff' : '#e8f0ff';
  ctx.font = `700 34px ${MONO}`;
  ctx.textAlign = 'right';
  const narrow = W < 600;
  const ny = narrow ? by - 28 : by - 18; // narrow: lift the number above the label row
  ctx.font = `700 ${narrow ? 28 : 34}px ${MONO}`;
  ctx.fillText(kms(sp), mid + 40, ny);
  ctx.textAlign = 'left';
  ctx.font = `13px ${MONO}`;
  ctx.fillStyle = '#8fa3c8';
  ctx.fillText('km/s', mid + 46, ny - 1);
}

function drawBossHud(r, game, dt) {
  const boss = game.boss;
  if (!boss || boss.dead) return;
  const { ctx, W, H } = r;
  const width = Math.min(360, W - 32, W * 0.46), x = (W - width) / 2, y = W < 600 ? 104 : 82;
  r.bossWarning = Math.max(0, (r.bossWarning || 0) - dt);
  ctx.textAlign = 'center';
  ctx.font = `700 14px ${MONO}`;
  ctx.fillStyle = '#ff647b';
  ctx.fillText(r.bossWarning > 0 ? 'WARNING!!  ボス出現' : 'BOSS', W / 2, y - 8);
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(x - 2, y - 2, width + 4, 12);
  ctx.fillStyle = '#ff526e';
  ctx.fillRect(x, y, width * Math.max(0, boss.hp / boss.maxHp), 8);
  const p = worldToScreen(r, boss.x, boss.y);
  if (p.x < 0 || p.x > W || p.y < 0 || p.y > H) {
    const dx = p.x - W / 2, dy = p.y - H / 2;
    const k = Math.min((W / 2 - 40) / Math.max(1, Math.abs(dx)), (H / 2 - 60) / Math.max(1, Math.abs(dy)));
    const bx = W / 2 + dx * k, by = H / 2 + dy * k;
    ctx.save(); ctx.translate(bx, by); ctx.rotate(Math.atan2(dy, dx));
    ctx.beginPath(); ctx.moveTo(13, 0); ctx.lineTo(-6, -7); ctx.lineTo(-6, 7); ctx.closePath(); ctx.fill(); ctx.restore();
    ctx.font = `12px ${MONO}`;
    ctx.fillText('BOSS', bx, by + 21);
  }
  ctx.textAlign = 'left';
}

// ---- input.js ----
// Raw input only: keys, Space, pointer drag and hover. Control schemes (controls.js) turn this into intent.

// Launch direction is opposite to the drag: start - current.
function aimFromDrag(sx, sy, cx, cy) {
  return { x: sx - cx, y: sy - cy };
}

const MOVE_KEYS = {
  KeyW: [0, -1], ArrowUp: [0, -1],
  KeyS: [0, 1], ArrowDown: [0, 1],
  KeyA: [-1, 0], ArrowLeft: [-1, 0],
  KeyD: [1, 0], ArrowRight: [1, 0],
};
const SNAP_KEYS = { KeyW: 'forward', ArrowUp: 'forward', KeyS: 'back', ArrowDown: 'back' };
const KEY_CODES = { a: 'KeyA', d: 'KeyD', w: 'KeyW', s: 'KeyS', b: 'KeyB', arrowleft: 'ArrowLeft', arrowright: 'ArrowRight', arrowup: 'ArrowUp', arrowdown: 'ArrowDown' };

// Held movement keys -> unit vector (zero when none or cancelled).
function moveVector(keys) {
  let dx = 0, dy = 0;
  for (const k of keys) {
    const d = MOVE_KEYS[k];
    if (d) { dx += d[0]; dy += d[1]; }
  }
  dx = Math.sign(dx); dy = Math.sign(dy);
  if (dx === 0 && dy === 0) return { x: 0, y: 0 };
  const len = Math.hypot(dx, dy);
  return { x: dx / len || 0, y: dy / len || 0 };
}

// Physical key position (works with IME on), falling back to the key name.
function keyCode(e) {
  return e.code || KEY_CODES[(e.key || '').toLowerCase()] || '';
}

const isSpace = (e) => e.code === 'Space' || e.key === ' ';

function createInput(el, keyTarget = typeof window !== 'undefined' ? window : null) {
  const st = {
    down: false, sx: 0, sy: 0, cx: 0, cy: 0, pointerId: null, enabled: true, hover: null, click: null,
    release: false, relSource: null, relX: 0, relY: 0,
    keys: new Set(), space: false, spaceStartedAt: 0, spaceDuration: 0, cycle: 0, snap: null, pressed: false, dash: false, place: false, confirm: false, clicks: [],
  };
  // pointer position in the element's own CSS pixels (the same space the canvas is drawn in)
  const local = (e) => {
    const b = el.getBoundingClientRect ? el.getBoundingClientRect() : null;
    return b ? { x: e.clientX - b.left, y: e.clientY - b.top } : { x: e.clientX, y: e.clientY };
  };
  el.addEventListener('pointerdown', (e) => {
    st.hover = local(e);
    if (st.enabled && e.button === 2) { st.confirm = true; e.preventDefault(); }
    if (st.enabled && e.button === 0) { st.pressed = true; st.click = st.hover; st.clicks.push(st.hover); }
    if (!st.enabled || e.button > 0) return;
    st.down = true; st.pointerId = e.pointerId; st.pointerType = e.pointerType || 'mouse';
    ({ x: st.sx, y: st.sy } = local(e)); st.cx = st.sx; st.cy = st.sy;
    try { el.setPointerCapture(e.pointerId); } catch { /* synthetic or lost pointer */ }
  });
  el.addEventListener('pointermove', (e) => {
    st.hover = local(e);
    if (!st.down || e.pointerId !== st.pointerId) return;
    ({ x: st.cx, y: st.cy } = local(e));
  });
  const up = (e) => {
    if (!st.down || e.pointerId !== st.pointerId) return;
    ({ x: st.cx, y: st.cy } = local(e));
    const a = aimFromDrag(st.sx, st.sy, st.cx, st.cy);
    st.down = false; st.release = true; st.relSource = 'pointer'; st.relX = a.x; st.relY = a.y;
  };
  el.addEventListener('pointerup', up);
