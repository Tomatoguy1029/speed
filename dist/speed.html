  el.addEventListener('pointercancel', up);
  el.addEventListener('contextmenu', (e) => e.preventDefault());

  if (keyTarget) {
    keyTarget.addEventListener('keydown', (e) => {
      const code = keyCode(e);
      if (MOVE_KEYS[code]) {
        const fresh = st.enabled && !e.repeat && !st.keys.has(code);
        st.keys.add(code); if (st.enabled) e.preventDefault();
        if (st.enabled && (fresh || e.repeat)) {
          if (code === 'KeyA' || code === 'ArrowLeft') st.cycle--;
          if (code === 'KeyD' || code === 'ArrowRight') st.cycle++;
        }
      }
      if (code === 'KeyB' && st.enabled) { e.preventDefault(); if (!e.repeat) st.place = true; }
      if (SNAP_KEYS[code] && !e.repeat) st.snap = SNAP_KEYS[code];
      if (isSpace(e)) {
        if (st.enabled) e.preventDefault();
        if (!st.enabled || e.repeat || st.space) return;
        st.pressed = true;
        st.dash = true;
        st.space = true; st.spaceStartedAt = performance.now(); st.spaceDuration = 0;
      }
    });
    keyTarget.addEventListener('keyup', (e) => {
      st.keys.delete(keyCode(e));
      if (isSpace(e) && st.space) {
        st.spaceDuration = (performance.now() - st.spaceStartedAt) / 1000;
        st.space = false; st.release = true; st.relSource = 'space'; st.relX = 0; st.relY = 0;
      }
    });
    keyTarget.addEventListener('blur', () => { st.keys.clear(); st.space = false; st.release = false; st.spaceDuration = 0; st.cycle = 0; });
  }

  return {
    state: st,
    read() {
      const out = {
        move: st.enabled ? moveVector(st.keys) : { x: 0, y: 0 },
        snap: st.enabled ? st.snap : null,
        space: st.enabled && st.space,
        spaceHeldTime: st.enabled ? (st.space ? (performance.now() - st.spaceStartedAt) / 1000 : st.spaceDuration) : 0,
        portalCycle: st.enabled ? st.cycle : 0,
        pressed: st.pressed, // a fresh Space press or click this frame (commits a drawn path)
        dash: st.dash, // a fresh Space press or the on-screen dash button (draw mode)
        place: st.enabled && st.place,
        confirm: st.enabled && st.confirm,
        pointerDown: st.down,
        pointerType: st.pointerType || 'mouse', // 'touch' turns the press into a virtual stick (draw mode)
        drag: st.down ? aimFromDrag(st.sx, st.sy, st.cx, st.cy) : { x: 0, y: 0 },
        hover: st.hover,
        click: st.click, // preserve the press position even if the mouse moves before the next frame
        clicks: st.clicks, // every press this frame, in order (fast clicks between frames are not lost)
        release: st.release,
        releaseSource: st.release ? st.relSource : null,
        releaseDrag: { x: st.relX, y: st.relY },
      };
      st.release = false;
      st.snap = null;
      st.pressed = false;
      st.click = null;
      st.clicks = [];
      st.dash = false;
      st.place = false;
      st.confirm = false;
      st.cycle = 0; st.spaceDuration = 0;
      return out;
    },
    triggerDash() { if (st.enabled) st.dash = true; },
    reset() { st.down = false; st.space = false; st.spaceDuration = 0; st.cycle = 0; st.release = false; st.snap = null; st.pressed = false; st.click = null; st.clicks = []; st.dash = false; st.place = false; st.confirm = false; st.keys.clear(); st.pointerId = null; },
  };
}

// ---- ui.js ----


const root = () => document.getElementById('ui');

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'html') n.innerHTML = v;
    else n.setAttribute(k, v);
  }
  for (const c of kids) if (c != null) n.append(c);
  return n;
}

function clearScreens() {
  for (const n of [...root().querySelectorAll('.screen')]) n.remove();
}

function showScreen(panel, id) {
  clearScreens();
  const s = el('div', { class: 'screen', id }, panel);
  root().append(s);
  return s;
}

function fmtTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

const kms = (v) => (v * CONFIG.speedToKms).toFixed(2);

const END_TEXT = {
  boss: ['CLEAR!', 'win', '敵の大群を突破し、ボスを撃破した'],
  hp: ['機体 大破', 'lose', 'HP が尽きた'],
  time: ['時間切れ', 'lose', '時間内にボスを撃破できなかった'],
};

function showResult(game, extra, onNext, onRetry) {
  const [title, cls, sub] = END_TEXT[game.endReason] || END_TEXT.time;
  const rows = [
    ['経過時間', fmtTime(game.t)],
    ['最高速度', `${kms(game.peakSpeed)} km/s`],
    ['撃破数', String(game.kills)],
    ['レベル', String(game.level)],
    ...(extra || []),
  ];
  const stats = el('div', { class: 'stats' });
  for (const [k, v] of rows) stats.append(el('div', {}, k), el('div', {}, v));
  const won = game.state === 'won';
  const btn = el('button', { class: won ? '' : 'primary', onclick: onNext }, won ? 'メニューに戻る' : 'ステーションへ');
  const retry = won && onRetry ? el('button', { class: 'primary', onclick: onRetry }, 'もう一回やる') : null;
  showScreen(el('div', { class: 'panel' },
    el('h1', { class: cls }, title),
    el('div', { class: 'sub' }, sub),
    stats,
    el('div', { class: 'btns' }, retry, btn)), 'result');
  (retry || btn).focus();
}

const SOURCE_TEXT = { xp: '経験値', capsule: '漂流カプセル', elite: '強敵のドロップ', drop: '敵のドロップ', core: '出力コア' };

function partCanvas(slot, color, size = 64) {
  const c = el('canvas', { class: 'part' });
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = size * dpr; c.height = size * dpr;
  c.style.width = c.style.height = `${size}px`;
  const ctx = c.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.translate(size / 2, size / 2);
  drawPart(ctx, slot, size * (slot === 'armor' ? 0.26 : 0.36), color, { glow: color ? 10 : 0 });
  return c;
}

// The assembled ship with `slot` pulsing; redraws itself while the offer is open.
function assemblyCanvas(game, slot, size = 150) {
  const c = el('canvas', { class: 'assembly' });
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = size * dpr; c.height = size * dpr;
  c.style.width = c.style.height = `${size}px`;
  const ctx = c.getContext('2d');
  const paint = (t) => {
    if (!c.isConnected && t > 0) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    drawShipAssembly(ctx, size / 2, size / 2 + size * 0.03, size / 7.4, (s) => {
      const m = game.loadout[s];
      return m ? RARITIES[m.r].color : null;
    }, slot, t / 1000);
    requestAnimationFrame(paint);
  };
  paint(0);
  return c;
}

function moduleCard(mod, tag, isNew, scheme) {
  if (!mod) return el('div', { class: 'card empty' }, '空きスロット');

  const rar = RARITIES[mod.r];
  const card = el('div', { class: `card${isNew ? ' new' : ''}` },

    el('div', { class: 'tag' }, tag),
    el('div', { class: 'name' }, `${def.name}${mod.plus ? ` +${mod.plus}` : ''}`),

function showOffer(game, onChoose) {
  const mod = game.currentOffer;
  const slot = SLOTS.find((s) => s.id === mod.slot);
  const cur = game.loadout[mod.slot];
  const loadout = el('div', { class: 'loadout' });

// ---- audio.js ----
// Synthesized sound. Everything is optional: without Web Audio this is a silent stub.

function noop() {}

// Muted by default; only a stored '0' (the player pressed M to turn sound on) starts unmuted.
function initialMuted(stored) {
  return stored !== '0';
}

function createAudio() {
  const AC = typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext);
  if (!AC) return { unlock: noop, handle: noop, update: noop, toggleMute: () => true, muted: true };

  let ctx = null, master, sfx, muffle, boomBus, engine, sub, engineGain, wind, windFilter, windGain, noiseBuf;
  let muted = true;
  try { muted = initialMuted(window.localStorage.getItem('speed-muted')); } catch { /* ignore */ }
  const lastPlayed = {};
  let duckT = 0;

  function init() {
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.7;
    const comp = ctx.createDynamicsCompressor();
    master.connect(comp).connect(ctx.destination);
    muffle = ctx.createBiquadFilter();
    muffle.type = 'lowpass';
    muffle.frequency.value = 16000;
    sfx = ctx.createGain();
    sfx.connect(muffle).connect(master);
    boomBus = ctx.createGain();
    boomBus.connect(master);

    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

    engineGain = ctx.createGain();
    engineGain.gain.value = 0;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 700;
    engine = ctx.createOscillator(); engine.type = 'sawtooth'; engine.frequency.value = 50;
    sub = ctx.createOscillator(); sub.type = 'sine'; sub.frequency.value = 25;
    engine.connect(lp); sub.connect(lp); lp.connect(engineGain).connect(sfx);
    engine.start(); sub.start();

    wind = ctx.createBufferSource(); wind.buffer = noiseBuf; wind.loop = true;
    windFilter = ctx.createBiquadFilter(); windFilter.type = 'bandpass'; windFilter.Q.value = 0.8;
    windGain = ctx.createGain(); windGain.gain.value = 0;
    wind.connect(windFilter).connect(windGain).connect(sfx);
    wind.start();
  }

  function env(g, t, a, peak, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }

  function tone(freq, dur, type = 'sine', vol = 0.2, slideTo = null, bus = sfx, delay = 0) {
    const t = ctx.currentTime + delay;
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    const g = ctx.createGain();
    env(g, t, 0.005, vol, dur);
    o.connect(g).connect(bus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function noise(dur, freq, vol = 0.3, type = 'lowpass', sweepTo = null, bus = sfx, q = 1) {
    const t = ctx.currentTime;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    s.playbackRate.value = 0.8 + Math.random() * 0.4;
    const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(freq, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    const g = ctx.createGain();
    env(g, t, 0.01, vol, dur);
    s.connect(f).connect(g).connect(bus);
    s.start(t, Math.random()); s.stop(t + dur + 0.05);
  }

  function throttle(key, gap) {
    const now = ctx.currentTime;
    if (lastPlayed[key] && now - lastPlayed[key] < gap) return false;
    lastPlayed[key] = now;
    return true;
  }

  const SOUNDS = {
    launch: (e) => noise(0.35, 400 + 1200 * Math.min(1.5, e.gauge), 0.25 + 0.15 * Math.min(1, e.gauge), 'bandpass', 3000, sfx, 1.5),
    kill: (e) => throttle('kill', 0.025) && tone(320 + Math.random() * 280 + (e.r > 25 ? -150 : 0), 0.12, 'square', e.r > 25 ? 0.12 : 0.06, 90),
    hit: (e) => e.crit && throttle('crit', 0.05) && tone(1400, 0.18, 'triangle', 0.18, 2200),
    hurt: () => { noise(0.3, 300, 0.5); tone(90, 0.3, 'sawtooth', 0.25, 40); },
    bounce: () => throttle('bounce', 0.08) && tone(160, 0.15, 'square', 0.15, 80),
    crash: () => noise(0.4, 250, 0.5),
    levelup: () => [523, 659, 784].forEach((f, i) => tone(f, 0.14, 'triangle', 0.12, null, sfx, i * 0.06)),
    pickup: (e) => tone(e.kind === 'core' ? 660 : 880, 0.3, 'sine', 0.2, e.kind === 'core' ? 1320 : 1760),
    equip: () => tone(440, 0.15, 'triangle', 0.15, 880),
    coin: () => throttle('coin', 0.04) && tone(1568, 0.08, 'square', 0.05),
    explode: (e) => throttle('explode' + e.cause, 0.05) && noise(0.35, e.cause === 'trail' ? 900 : 500, e.cause === 'trail' ? 0.12 : 0.3),
    shoot: () => throttle('shoot', 0.09) && tone(700, 0.05, 'square', 0.03, 400),
    turret: () => throttle('turret', 0.06) && tone(1800, 0.04, 'square', 0.03, 1200),
    stage: () => { tone(392, 0.25, 'sawtooth', 0.1, 784); tone(587, 0.35, 'triangle', 0.12, 1175, sfx, 0.08); },
    phase: () => tone(110, 1.2, 'sawtooth', 0.12, 220),
    barrier: () => noise(0.25, 2000, 0.15, 'highpass'),
    warp: () => { tone(1400, 0.12, 'sine', 0.12, 300); noise(0.12, 3000, 0.1, 'highpass'); },
    dashReady: () => tone(988, 0.18, 'triangle', 0.1, 1480),
    hyperOpen: () => { tone(330, 0.6, 'sine', 0.12, 110); noise(0.5, 600, 0.12, 'lowpass', 150); },
    sonic: () => {
      // a beat of silence, then everything comes back at once
      duckT = 0.22;
      const t = ctx.currentTime;
      sfx.gain.cancelScheduledValues(t);
      sfx.gain.setValueAtTime(0.0001, t);
      sfx.gain.linearRampToValueAtTime(1, t + 0.9);
      setTimeout(() => {
        noise(1.6, 1800, 1.0, 'lowpass', 60, boomBus);
        tone(95, 1.4, 'sine', 0.9, 28, boomBus);
        tone(190, 0.5, 'sawtooth', 0.25, 40, boomBus);
      }, 200);
    },
    end: (e) => {
      if (e.state === 'won') [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.4, 'triangle', 0.18, null, boomBus, i * 0.12));
      else tone(220, 1.2, 'sawtooth', 0.15, 55, boomBus);
    },
  };

  return {
    get muted() { return muted; },
    unlock() {
      try {
        if (!ctx) init();
        if (ctx.state === 'suspended') ctx.resume();
      } catch { /* audio unavailable */ }
    },
    toggleMute() {
      muted = !muted;
      try { window.localStorage.setItem('speed-muted', muted ? '1' : '0'); } catch { /* ignore */ }
      if (master) master.gain.value = muted ? 0 : 0.7;
      return muted;
    },
    handle(events) {
      if (!ctx || ctx.state !== 'running') return;
      for (const e of events) {
        const f = SOUNDS[e.type];
        if (f) try { f(e); } catch { /* ignore */ }
      }
    },
    // Continuous layers: engine pitch, wind, and the high-speed fade toward silence.
    update(game, dt) {
      if (!ctx || ctx.state !== 'running' || !game) return;
      const t = ctx.currentTime;
      const sh = game.ship;
      const sp = Math.hypot(sh.vx, sh.vy);
      const ratio = sp / game.stats.maxSpeed;
      const live = game.state === 'play';
      engine.frequency.setTargetAtTime(45 + sp * 0.05, t, 0.08);
      sub.frequency.setTargetAtTime(22 + sp * 0.025, t, 0.08);
      engineGain.gain.setTargetAtTime(live ? 0.05 + 0.08 * Math.min(1.2, ratio) : 0, t, 0.1);
      windFilter.frequency.setTargetAtTime(250 + sp * 0.9, t, 0.1);
      windGain.gain.setTargetAtTime(live ? Math.min(0.35, sp / 4000) : 0, t, 0.1);
      // approaching max speed the world goes quiet
      const k = Math.max(0, Math.min(1, (ratio - 0.6) / 0.38));
      muffle.frequency.setTargetAtTime(16000 * Math.pow(0.02, k), t, 0.15);
      if (duckT > 0) duckT -= dt;
      else sfx.gain.setTargetAtTime(1 - 0.88 * k, t, 0.2);
    },
  };
}

  { key: 'dashScaleMin', label: 'ジャンプ中の世界の速さ 下限', min: 0, max: 0.5, step: 0.01 },
  { key: 'waveRadius', label: 'ジャンプの波動が届く距離', min: 0, max: 300, step: 5 },
  { key: 'waveDamage', label: 'ジャンプの波動の威力（攻撃力比）', min: 0, max: 3, step: 0.05 },
  { key: 'killHitstop', label: '一撃撃破のヒットストップ（秒）', min: 0, max: 0.2, step: 0.005 },
  { key: 'killHitstopCap', label: 'ヒットストップ上限／突進（秒）', min: 0, max: 2, step: 0.05 },
  { key: 'zoomExp', label: 'ズームアウト強さ', min: 0, max: 1.2, step: 0.05 },
  { key: 'zoomMin', label: '最小ズーム', min: 0.1, max: 1, step: 0.02 },
  { key: 'densityMult', label: '敵の数 倍率', min: 0.2, max: 8, step: 0.05 },
  { key: 'enemySpacing', label: '敵同士の間隔', min: 0, max: 100, step: 1 },
  { key: 'enemyPursuitSpread', label: '敵の広域移動の強さ', min: 0, max: 480, step: 20 },
  { key: 'dropBase', label: 'モジュール基本ドロップ率（敵の強さで増加）', min: 0, max: 0.05, step: 0.0005, fmt: v => `${(v * 100).toFixed(2)}%` },
  { key: 'dropMax', label: 'モジュールドロップ率 上限', min: 0, max: 1, step: 0.01, fmt: v => `${Math.round(v * 100)}%` },
  { key: 'enemyHpMult', label: '敵 HP 倍率', min: 0.2, max: 3, step: 0.05 },
  { key: 'enemyArmorMult', label: '敵 装甲 倍率', min: 0.2, max: 3, step: 0.05 },
  { key: 'dangerLevel', label: '危険ゾーンの強化', min: 0, max: 5, step: 0.1 },
  { key: 'xpMult', label: '経験値 倍率', min: 0.2, max: 4, step: 0.05 },
];

const STAT_KEYS = new Set(['baseMaxSpeed', 'levelSpeedGrowth', 'launchRatio', 'carry', 'chargeTime', 'boostDuration', 'cruiseFloor']);

function applyTunable(game, key, value) {
  CONFIG[key] = value;
  if (!game) return;
  if (STAT_KEYS.has(key)) refreshStats(game);
  if (key === 'planetGM') game.field.planet.gm = value;
  if (key === 'moonGM') for (const m of game.field.moons) m.gm = value;
}

function resetConfig(game) {
  for (const t of TUNABLES) applyTunable(game, t.key, DEFAULTS[t.key]);
}

function skipTime(game, sec) {
  game.t = Math.min(CONFIG.runTime - 1, game.t + sec);
}

function jumpToPhase(game, id) {
  const p = PHASES.find((x) => x.id === id);
  if (p) game.t = p.start + 0.01;
}

function setScheme(game, id) {
  CONFIG.controlScheme = schemeById(id).id;
  if (game) {
    game.scheme = CONFIG.controlScheme;
    game.jump = null; game.hyper.focus = false; game.portalDash = null; game.portalPreview = null;
    game.ship.charging = false; game.releasePending = null;
  }
}

function createDebugPanel(getGame, onScheme, onResetMeta) {
  const root = document.createElement('div');
  root.id = 'debug';
  root.innerHTML = `<div class="dh"><b>調整パネル</b><span class="dclose">P で閉じる</span></div><label class="dctl"><span>操作方法</span><select></select></label><div class="dhelp"></div><div class="dinfo"></div><div class="dbtns"></div><div class="dsl"></div>`;
  document.body.append(root);
  const schemeSel = root.querySelector('.dctl select');
  const schemeHelp = root.querySelector('.dhelp');
  schemeSel.innerHTML = SCHEMES.map((s) => `<option value="${s.id}">${s.name}</option>`).join('');
  const syncScheme = () => { schemeSel.value = CONFIG.controlScheme; schemeHelp.textContent = schemeById(CONFIG.controlScheme).help; };
  schemeSel.addEventListener('change', () => {
    setScheme(getGame(), schemeSel.value);
    syncScheme();
    syncModulePicker();
    schemeSel.blur(); // keep WASD/Space for the game, not the select
    if (onScheme) onScheme(CONFIG.controlScheme);
  });
  syncScheme();
  const info = root.querySelector('.dinfo');
  const btns = root.querySelector('.dbtns');
  const sliders = root.querySelector('.dsl');
  const moduleRow = document.createElement('label');
  moduleRow.className = 'dctl';
  moduleRow.innerHTML = '<span>入手するモジュール</span><select aria-label="入手するモジュール"></select>';
  const moduleSel = moduleRow.querySelector('select');
  const moduleHelp = document.createElement('div');
  moduleHelp.className = 'dhelp';
  btns.before(moduleRow, moduleHelp);

  const button = (label, fn) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.addEventListener('click', () => { const g = getGame(); if (g) fn(g); });
    btns.append(b);
    return b;
  };
  button('+30 秒', (g) => skipTime(g, 30));
  button('+60 秒', (g) => skipTime(g, 60));
  button('ボス出現へ', (g) => { g.t = Math.max(g.t, CONFIG.bossTime); });
  const sel = document.createElement('select');
  sel.innerHTML = '<option value="">時刻へ…</option>' + PHASES.map((p) => `<option value="${p.id}">${Math.floor(p.start / 60)}:${String(p.start % 60).padStart(2, '0')}ごろ</option>`).join('');
  sel.addEventListener('change', () => { const g = getGame(); if (g && sel.value) jumpToPhase(g, sel.value); sel.value = ''; });
  btns.append(sel);
  const inv = button('無敵: OFF', (g) => { g.debug.invincible = !g.debug.invincible; inv.textContent = `無敵: ${g.debug.invincible ? 'ON' : 'OFF'}`; });
  const rsel = document.createElement('select');
  rsel.setAttribute('aria-label', '入手するモジュールのレア度');
  rsel.innerHTML = RARITIES.map((r, i) => `<option value="${i}">${r.name}</option>`).join('');
  rsel.value = '2';
  btns.append(rsel);
  function syncModuleRarity() {
    const def = MODULES.find(m => m.id === moduleSel.value);
    if (def && !def.rarities.includes(Number(rsel.value))) {
      const current = Number(rsel.value);
      rsel.value = String(def.rarities.reduce((a, b) => Math.abs(b - current) < Math.abs(a - current) ? b : a));
    }
    for (const option of rsel.options) option.disabled = !!def && !def.rarities.includes(Number(option.value));
    moduleHelp.textContent = def ? def.desc(Number(rsel.value)) : 'モジュールとレア度を選び、「モジュール入手」でその場で試せます。';
  }
  function syncModulePicker() {
    const selected = moduleSel.value;
    const scheme = getGame()?.scheme || CONFIG.controlScheme;
    moduleSel.innerHTML = '<option value="">ランダム（従来）</option>';
    for (const slot of SLOTS) {
      const group = document.createElement('optgroup');
      group.label = slot.name;
      for (const mod of MODULES.filter(m => m.slot === slot.id && moduleFitsScheme(m, scheme))) {
        const option = document.createElement('option');
        option.value = mod.id; option.textContent = mod.name;
        group.append(option);
      }
      if (group.children.length) moduleSel.append(group);
    }
    if ([...moduleSel.options].some(option => option.value === selected)) moduleSel.value = selected;
    syncModuleRarity();
  }
  moduleSel.addEventListener('change', () => { syncModuleRarity(); moduleSel.blur(); });
  rsel.addEventListener('change', () => { syncModuleRarity(); rsel.blur(); });
  syncModulePicker();
  button('モジュール入手', (g) => {
    const r = Number(rsel.value);
    const pool = MODULES.filter((m) => m.rarities.includes(r) && moduleFitsScheme(m, g.scheme));
    const def = pool.find(m => m.id === moduleSel.value) || pool[Math.floor(Math.random() * pool.length)];
    if (g.state === 'play' || g.state === 'offer') pushOffer(g, { id: def.id, slot: def.slot, r }, 'capsule');
  });
  button('出力コア', (g) => { if (g.state === 'play') pushOffer(g, { id: 'limiter', slot: 'booster', r: 3 }, 'core'); });
  button('包囲炸裂を入手', (g) => {
    if (g.state === 'play' && g.scheme === 'portal') pushOffer(g,
      { id: 'loopBurst', slot: 'gun', r: Math.max(2, Number(rsel.value)) }, 'capsule');
  });
  button('レベル +1', (g) => { if (g.state === 'play') addXp(g, xpForLevel(g.level) - g.xp); });
  button('HP 全快', (g) => { g.ship.hp = g.stats.maxHp; });
  button('敵を消す（ボス以外）', (g) => { g.enemies = g.enemies.filter((e) => e.type === 'boss' && !e.dead); g.newEnemies.length = 0; g.ebullets.length = 0; });
  button('部品 +100', (g) => { g.coins += 100; });
  if (onResetMeta) {
    const b = document.createElement('button');
    b.textContent = '機体強化をリセット';
    b.title = 'ステーションの機体強化をすべて 0 に戻し、使った部品を返す';
    b.addEventListener('click', () => { const n = onResetMeta(); b.textContent = `リセット済み（部品 +${n}）`; setTimeout(() => { b.textContent = '機体強化をリセット'; }, 1500); });
    btns.append(b);
  }
  button('既定値に戻す', (g) => { resetConfig(g); sync(); });

  const inputs = [];
  for (const t of TUNABLES) {
    const row = document.createElement('label');
    row.className = 'drow';
    const name = document.createElement('span');
    name.textContent = t.label;
    const val = document.createElement('span');
    val.className = 'dval';
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = t.min; inp.max = t.max; inp.step = t.step;
    inp.addEventListener('input', () => {
      applyTunable(getGame(), t.key, Number(inp.value));
      val.textContent = t.fmt ? t.fmt(CONFIG[t.key]) : String(CONFIG[t.key]);
    });
    row.append(name, val, inp);
    sliders.append(row);
    inputs.push({ t, inp, val });
  }
  function sync() {
    for (const { t, inp, val } of inputs) {
      inp.value = CONFIG[t.key];
      val.textContent = t.fmt ? t.fmt(CONFIG[t.key]) : String(CONFIG[t.key]);
    }
  }
  sync();

  let fps = 60;
  return {
    toggle() { root.classList.toggle('open'); sync(); syncScheme(); syncPathInput(); syncModulePicker(); },
    get open() { return root.classList.contains('open'); },
    tick(game, dt) {
      if (!root.classList.contains('open') || !game) return;
      fps = fps * 0.95 + (1 / Math.max(dt, 1e-3)) * 0.05;
      const sp = Math.hypot(game.ship.vx, game.ship.vy);
      info.textContent = `t ${game.t.toFixed(1)}s ・ 敵 ${game.enemies.length} ・ Lv ${game.level} ・ 上限 ${(game.stats.maxSpeed * CONFIG.speedToKms).toFixed(2)} ・ 現在 ${(sp * CONFIG.speedToKms).toFixed(2)} ・ 最高 ${(game.peakSpeed * CONFIG.speedToKms).toFixed(2)} km/s ・ ${fps.toFixed(0)} fps`;
    },
  };
}

// ---- main.js ----










const canvas = document.getElementById('game');
const renderer = createRenderer(canvas);
const input = createInput(canvas);
const storage = (() => { try { return window.localStorage; } catch { return null; } })();
const save = loadSave(storage);
const audio = createAudio();
window.addEventListener('pointerdown', () => audio.unlock(), true);
window.addEventListener('keydown', () => audio.unlock(), true);

let game = null;
// control scheme is a per-browser preference
// a saved scheme that no longer exists (the old drawing modes) falls back to the default
try { const c = window.localStorage.getItem('speed-controls-v2'); if (c) CONFIG.controlScheme = schemeById(c).id; } catch { /* ignore */ }
// A shareable local preview can opt into the prototype without replacing saved controls.
const previewControls = new URLSearchParams(window.location.search).get('controls');
if (previewControls === 'portal' || isHyperScheme(previewControls)) CONFIG.controlScheme = previewControls;
const debug = createDebugPanel(() => game, (id) => {
  try { window.localStorage.setItem('speed-controls-v2', id); } catch { /* ignore */ }
  if (mode === 'station') openStation();
}, () => {
  const refund = resetMeta(save);
  writeSave(storage, save);
  if (mode === 'station') openStation(); // the station screen shows the new levels at once
  return refund; // takes effect from the next run
});
let mode = 'station'; // station | run | result
let offerShown = null;
let levelShown = null;

window.addEventListener('resize', () => resizeRenderer(renderer));
if (typeof ResizeObserver !== 'undefined') new ResizeObserver(() => resizeRenderer(renderer)).observe(renderer.canvas);
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => resizeRenderer(renderer));
resizeRenderer(renderer);

function openStation() {
  mode = 'station';
  input.state.enabled = false;
  input.reset();
  if (!game) { game = createGame({ meta: save.meta }); game.spawning = false; game.state = 'idle'; }
  showStation(save, (id) => { if (buyUpgrade(save, id)) { writeSave(storage, save); openStation(); } }, startRun);
}

function startRun() {
  clearScreens();
  input.reset();
  input.state.enabled = true;
  renderer.cam.ready = false;
  offerShown = null;
  levelShown = null;
  game = createGame({ meta: save.meta });
  mode = 'run';
}

function finishRun() {
  mode = 'result';
  input.state.enabled = false;
  input.reset();
  const before = save.coins;
  applyRunResult(save, game);
  writeSave(storage, save);
  showResult(game, [['獲得部品', `+${save.coins - before}`]], openStation, startRun);
}

function chooseOffer(accept) {
  if (game.state !== 'offer') return;
  resolveOffer(game, accept);
  offerShown = null;
  if (game.state === 'play') { clearScreens(); input.reset(); }
}

function chooseLevel(i) {
  if (game.state !== 'levelup') return;
  resolveLevelup(game, i);
  levelShown = null;
  if (game.state === 'play') { clearScreens(); input.reset(); }
}

function togglePause() {
  if (mode !== 'run') return;
  if (game.state === 'play') {
    game.state = 'paused';
    input.reset();
    showPause(togglePause, () => { game.state = 'lost'; game.endReason = 'time'; clearScreens(); finishRun(); });
  } else if (game.state === 'paused') {
    game.state = 'play';
    clearScreens();
  }
}

window.addEventListener('keydown', (e) => {
  if (mode === 'run' && game.state === 'offer') {
    if (e.key === '1') chooseOffer(true);
    else if (e.key === '2') chooseOffer(false);
    return;
  }
  if (mode === 'run' && game.state === 'levelup') {
    if (e.key === '1' || e.key === '2' || e.key === '3') chooseLevel(Number(e.key) - 1);
    return;
  }
  if (e.key === 'Escape') togglePause();
  if (e.key === 'm' || e.key === 'M') audio.toggleMute();
  if ((e.key === 'p' || e.key === 'P') && game.state !== 'finishing') debug.toggle();
  if (e.key === 'Enter') {
    if (mode === 'station') { e.preventDefault(); startRun(); }
  }
});

// Touch-only shortcut: toggles hyperdrive (Space on a keyboard).
const dashBtn = document.getElementById('dashBtn');
dashBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); input.triggerDash(); });
function updateDashButton() {
  const show = mode === 'run' && isHyperScheme(game.scheme) && game.state === 'play' &&
    (input.state.pointerType === 'touch' || window.matchMedia('(pointer: coarse)').matches);
  dashBtn.classList.toggle('show', show);
  if (!show) return;
  dashBtn.disabled = !game.hyper.focus && game.hyper.charges < 1;
  dashBtn.classList.toggle('active', game.hyper.focus);
}

window.addEventListener('blur', () => { if (mode === 'run' && game.state === 'play') togglePause(); });

openStation();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  const wasRunning = game.state === 'play' || game.state === 'finishing';
  const raw = input.read();
  raw.cursor = raw.hover ? screenToWorld(renderer, raw.hover.x, raw.hover.y) : null;
  raw.clickCursor = raw.click ? screenToWorld(renderer, raw.click.x, raw.click.y) : null;
  raw.clickCursors = raw.clicks.map((c) => screenToWorld(renderer, c.x, c.y));
  update(game, dt, buildIntent(raw, game.scheme));
  if (game.state === 'finishing') input.state.enabled = false;
  render(renderer, game, dt, input.state);
  updateDashButton();
  audio.handle(game.events);
  audio.update(game, dt);
  debug.tick(game, dt);
  game.events.length = 0;
  if (mode === 'run') {
    if (wasRunning && (game.state === 'won' || game.state === 'lost')) finishRun();
    if (game.state === 'levelup' && levelShown !== game.levelChoices) {
      levelShown = game.levelChoices;
      input.reset();
      showLevelup(game, chooseLevel);
    }
    if (game.state === 'offer' && offerShown !== game.currentOffer) {
      offerShown = game.currentOffer;
      input.reset();
      showOffer(game, chooseOffer);
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// console access for debugging
window.__speed = { get game() { return game; }, save };

})();
</script>
