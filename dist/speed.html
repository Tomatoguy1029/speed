<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<script>
(() => {
'use strict';
// ---- config.js ----
// All tunable numbers live here. The debug panel edits this object directly.
const CONFIG = {
  // run
  runTime: 600,
  escapeSpeed: 2250, // px/s needed to clear
  escapeBonus: 30, // coins for escaping
  speedToKms: 11.2 / 2250, // display factor: escape speed shows as 11.2 km/s

  // field
  fieldRadius: 6000,
  planetRadius: 420,
  zoneInner: 2200,
  zoneOuter: 4200,
  startRadius: 3200,
  planetGM: 0, // gravity is off (the user found it annoying); 3.0e8 gives ~29 px/s^2 at the start radius
  gravityTestGM: 3.0e8, // reference strength used by the gravity tests and the panel's slider range
  moonCount: 6,
  moonGM: 0, // was 1.2e7; moons are now plain obstacles
  moonOrbitSpeed: 0.02, // rad/s
  dustCount: 34,
  dustDrag: 0.55,
  boundaryPush: 600,
  crashRestitution: 0.45,
  crashDamage: 0.012, // hp per px/s of impact speed above 200

  // ship
  baseMaxSpeed: 650, // start slow (3.2 km/s) so growth over the run is felt
  levelSpeedGrowth: 0.015, // +1.5% max speed per level
  levelAtkGrowth: 0.02, // +2% attack per level
  levelHpGrowth: 4, // +4 max HP per level
  levelChargeGrowth: 0.01, // -1% charge time per level (down to 60%)
  dropBase: 0.005, // module drop chance = dropBase * power^dropPowerExp (power = enemy xp)
  dropPowerExp: 1,
  dropMax: 0.5,
  dupBonus: 0.15, // each duplicate pickup adds +15% to that module's effect
  atkScale: 1.4, // attack = speed / 100 * atkMult * atkScale (keeps early fodder one-shot at the slower start)
  launchRatio: 0.8, // full gauge launch = maxSpeed * launchRatio
  carry: 0.65, // share of current speed carried into the next launch (same direction)
  chargeTime: 0.7, // seconds to fill the gauge
  minGauge: 0.12,
  minDrag: 14, // screen px; shorter drags boost forward along velocity
  controlScheme: 'draw', // see controls.js SCHEMES
  drawLength: 1000, // draw scheme: path length at full gauge (scales with max speed / base max speed)
  drawTime: 5, // real seconds to draw before the path commits itself
  drawTimeScale: 0.05, // world speed while drawing
  drawRunSlowRef: 260, // world speed while tracing = drawRunSlowRef / dash speed (faster ship -> slower world)
  drawRunScaleMin: 0.03, // ...but never slower than this
  waveRadius: 45, // reach of the wave a traced path gives off (the band's half-width); the ship body itself stays shipRadius
  waveDamage: 0.5, // wave damage = attack x this (ignores armor; the body hit is separate)
  drawRunTime: 0.5, // real seconds to trace the whole path, however long it is (plus kill hitstops)
  killHitstop: 0.045, // seconds of hitstop per one-shot ram kill (x1.8 big, x1.3 crit)
  killHitstopCap: 0.6, // max hitstop per dash
  drawStep: 8, // min world distance between path points
  mouseDeadZone: 40, // world units: a cursor this close to the ship does not steer
  nudgeAccel: 450, // nudge/relative schemes: WASD thrust at rest
  nudgeSteer: 0.7, // extra thrust per px/s of speed so fast ships can still bend
  nudgeMaxSpeed: 0.4, // forward thrust only speeds the ship up below this share of max speed
  pivotSpeed: 60, // below this speed the heading stays where the controls left it
  pivotRate: 3.2, // relative scheme: rad/s turning in place
  turnRateMin: 1.6, // rotate scheme: rad/s when tapping A/D
  turnRateMax: 4.6, // rotate scheme: rad/s after holding
  turnAccelTime: 0.35,
  steerRate: 4.5, // rad/s the travel direction swings toward the held WASD direction
  steerAccel: 900, // px/s^2 WASD acceleration while below cruise speed
  steerCruise: 0.4, // WASD alone gets the ship up to this share of max speed
  boostDuration: 0.9, // seconds after launch with no cruise drag
  energyCut: 0.85, // speed kept when the launch energy runs out (applied over ~0.3s)
  cruiseDrag: 0.06, // weak per-second drag after the energy runs out
  cruiseFloor: 0.35, // cruise drag never slows below this share of max speed
  overcapDecay: 0.3, // per second decay of speed above max speed
  shipRadius: 16,
  baseHP: 120,
  invulnTime: 0.6,
  pickupRadius: 140,

  // enemies
  enemyHpMult: 1,
  enemyArmorMult: 1,
  densityMult: 1,
  dangerLevel: 2.2, // extra enemy level at full danger (planet surface / field edge)
  meteorCount: 12,
  meteorCoinChance: 0.4,
  coreBoost: 0.18, // max speed gained per power core
  levelHeal: 0.08, // share of max HP restored per level-up
  capsuleCount: 5, // field capsules kept on the map
  capsuleInterval: 16, // seconds between respawns

  // growth
  xpBase: 10,
  xpGrowth: 7,
  xpMult: 1,

  // camera
  baseView: 1100, // world units visible on the shorter screen side at rest
  zoomRefSpeed: 700,
  zoomExp: 0.7,
  zoomMin: 0.28,
  lookAhead: 0.32,
};

// ---- math.js ----
const TAU = Math.PI * 2;

function clamp(v, a, b) {
  return v < a ? a : v > b ? b : v;
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function smoothstep(a, b, v) {
  const t = clamp((v - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}

function angleDiff(a, b) {
  let d = (a - b) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}

// Segment p0->p1 vs circle (c, r): first t in [0,1] where the segment is inside the circle, -1 if never.
function segCircleT(x0, y0, x1, y1, cx, cy, r) {
  const fx = x0 - cx, fy = y0 - cy;
  const c = fx * fx + fy * fy - r * r;
  if (c <= 0) return 0;
  const dx = x1 - x0, dy = y1 - y0;
  const a = dx * dx + dy * dy;
  if (a === 0) return -1;
  const b = 2 * (fx * dx + fy * dy);
  const disc = b * b - 4 * a * c;
  if (disc < 0) return -1;
  const t = (-b - Math.sqrt(disc)) / (2 * a);
  return t >= 0 && t <= 1 ? t : -1;
}

// mulberry32
function makeRng(seed) {
  let s = seed >>> 0;
  return function rng() {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function randRange(rng, a, b) {
  return a + (b - a) * rng();
}

// items: [[value, weight], ...]
function pickWeighted(rng, items) {
  let total = 0;
  for (const [, w] of items) total += Math.max(0, w);
  if (total <= 0) return items[0][0];
  let r = rng() * total;
  for (const [v, w] of items) {
    if (w <= 0) continue;
    r -= w;
    if (r < 0) return v;
  }
  return items[items.length - 1][0];
}

// ---- ship.js ----


function baseStats(meta = {}) {
  const lv = (k) => meta[k] || 0;
  return {
    maxSpeed: CONFIG.baseMaxSpeed * (1 + 0.05 * lv('speed')),
    launchRatio: CONFIG.launchRatio,
    carry: CONFIG.carry,
    chargeTime: CONFIG.chargeTime * Math.pow(0.95, lv('charge')),
    gaugeMax: 1,
    boostDuration: CONFIG.boostDuration,
    cruiseDrag: CONFIG.cruiseDrag,
    cruiseFloor: CONFIG.cruiseFloor,
    atkMult: 1 + 0.06 * lv('atk'),
    maxHp: CONFIG.baseHP + 15 * lv('hp'),
    pickupRadius: CONFIG.pickupRadius * (1 + 0.15 * lv('pickup')),
    xpMult: 1 + 0.08 * lv('xp'),
    damageTakenMult: 1,
    hitSlowMult: 1,
    critMult: 2.5,
    weakArcMult: 1,
    pierceLossMult: 1,
    bounceKeep: 0.5,
    bounceDamageMult: 1,
    predictTime: 0.9,
    predictBounce: false,
    regen: 0,
    drawLengthMult: 1, traceSpeedMult: 1, waveRadiusMult: 1, waveDmgMult: 1, // draw-mode modules
  };
}

function createShip(stats, x, y) {
  return {
    x, y, vx: 0, vy: 0,
    hp: stats.maxHp,
    charging: false, chargeT: 0, gauge: 0, gaugeBank: 0,
    aimX: 0, aimY: 0, hx: 0, hy: -1, // heading: travel direction, or the last control direction when nearly still
    markX: 0, markY: -1, // where a Space launch would go right now (drawn as the aim marker)
    aimAngle: -Math.PI / 2, turnHeld: 0, // rotating-aim scheme
    boostT: 0, fadeT: 0, invulnT: 0,
    trail: [], trailAcc: 0,
  };
}

function computeGauge(chargeT, stats, bank = 0) {
  return Math.min(stats.gaugeMax, Math.max(CONFIG.minGauge, bank + chargeT / stats.chargeTime));
}

// New velocity after launching along unit direction (dx, dy) with the given gauge.
function launchVelocity(vx, vy, dx, dy, gauge, stats) {
  const speed = Math.hypot(vx, vy);
  const cos = speed > 0 ? Math.max(0, (vx * dx + vy * dy) / speed) : 0;
  const carried = speed * stats.carry * cos;
  const thrust = stats.maxSpeed * stats.launchRatio * gauge;
  const limit = stats.maxSpeed * Math.max(1, gauge);
  const newSpeed = Math.max(Math.min(carried + thrust, limit), speed * cos);
  return { vx: dx * newSpeed, vy: dy * newSpeed };
}

// Integrate one step: acceleration (ax, ay), drag rules, then position.
function stepShip(ship, stats, dt, ax, ay, extraDrag) {
  ship.vx += ax * dt;
  ship.vy += ay * dt;
  let sp = Math.hypot(ship.vx, ship.vy);
  if (sp > 0) {
    let target = sp;
    if (ship.boostT > 0) {
      ship.boostT -= dt;
      if (ship.boostT <= 0) ship.fadeT = 0.3;
    } else {
      if (ship.fadeT > 0) {
        ship.fadeT -= dt;
        if (target > stats.maxSpeed * stats.cruiseFloor) target *= Math.pow(CONFIG.energyCut, dt / 0.3);
      }
      const floor = stats.maxSpeed * stats.cruiseFloor;
      if (target > floor) target = floor + (target - floor) * Math.exp(-stats.cruiseDrag * dt);
    }
    if (target > stats.maxSpeed) {
      target = stats.maxSpeed + (target - stats.maxSpeed) * Math.exp(-CONFIG.overcapDecay * dt);
    }
    if (extraDrag > 0) target *= Math.exp(-extraDrag * dt);
    const k = target / sp;
    ship.vx *= k;
    ship.vy *= k;
  }
  ship.x += ship.vx * dt;
  ship.y += ship.vy * dt;
}

// ---- field.js ----



function createField(rng) {
  const moons = [];
  for (let i = 0; i < CONFIG.moonCount; i++) {
    moons.push({
      orbit: randRange(rng, 1500, CONFIG.fieldRadius - 600),
      a0: (i / CONFIG.moonCount) * TAU + randRange(rng, -0.3, 0.3),
      dir: rng() < 0.5 ? -1 : 1,
      r: randRange(rng, 110, 180),
      gm: CONFIG.moonGM,
      x: 0, y: 0,
    });
  }
  const dust = [];
  for (let i = 0; i < CONFIG.dustCount; i++) {
    const a = rng() * TAU;
    const d = randRange(rng, CONFIG.planetRadius + 600, CONFIG.fieldRadius - 200);
    dust.push({ x: Math.cos(a) * d, y: Math.sin(a) * d, r: randRange(rng, 250, 620) });
  }
  const field = { planet: { x: 0, y: 0, r: CONFIG.planetRadius, gm: CONFIG.planetGM }, moons, dust };
  updateMoons(field, 0);
  return field;
}

function updateMoons(field, t) {
  for (const m of field.moons) {
    const a = m.a0 + m.dir * CONFIG.moonOrbitSpeed * t;
    m.x = Math.cos(a) * m.orbit;
    m.y = Math.sin(a) * m.orbit;
  }
}

function zoneOf(r) {
  if (r < CONFIG.zoneInner) return 'inner';
  if (r > CONFIG.zoneOuter) return 'outer';
  return 'mid';
}

// 0 in the middle ring, rising to 1 at the planet surface and at the field edge.
function dangerAt(r) {
  if (r < CONFIG.zoneInner) return clamp((CONFIG.zoneInner - r) / (CONFIG.zoneInner - CONFIG.planetRadius), 0, 1);
  if (r > CONFIG.zoneOuter) return clamp((r - CONFIG.zoneOuter) / (CONFIG.fieldRadius - CONFIG.zoneOuter), 0, 1);
  return 0;
}

function dustDragAt(field, x, y) {
  for (const d of field.dust) {
    const dx = x - d.x, dy = y - d.y;
    if (dx * dx + dy * dy < d.r * d.r) return CONFIG.dustDrag;
  }
  return 0;
}

// ---- gravity.js ----


function pull(out, x, y, b) {
  const dx = b.x - x, dy = b.y - y;
  const d2 = Math.max(dx * dx + dy * dy, b.r * b.r);
  const d = Math.sqrt(d2);
  const a = b.gm / d2;
  out.ax += (dx / d) * a;
  out.ay += (dy / d) * a;
}

function gravityAt(field, t, x, y) {
  const out = { ax: 0, ay: 0 };
  pull(out, x, y, field.planet);
  for (const m of field.moons) pull(out, x, y, m);
  const r = Math.hypot(x, y);
  if (r > CONFIG.fieldRadius) {
    const push = CONFIG.boundaryPush + (r - CONFIG.fieldRadius) * 4;
    out.ax -= (x / r) * push;
    out.ay -= (y / r) * push;
  }
  return out;
}

// ---- combat.js ----



const CRIT_ARMOR = 0.5; // weak-spot hits only need half the armor

function attackPower(speed, stats) {
  return (speed / 100) * stats.atkMult * CONFIG.atkScale;
}

function isWeakHit(e, hx, hy, arcMult) {
  if (!e.weakArc) return false;
  const a = Math.atan2(hy - e.y, hx - e.x);
  return Math.abs(angleDiff(a, e.facing + e.weakDir)) <= e.weakArc * arcMult;
}

function canPierce(atk, e, crit) {
  return atk >= e.armor * (crit ? CRIT_ARMOR : 1);
}

function resolveRam(atk, e, crit, stats) {
  if (canPierce(atk, e, crit)) {
    const damage = atk * (crit ? stats.critMult : 1);
    return { pierce: true, damage, kill: damage >= e.hp, shipDamage: 0 };
  }
  return { pierce: false, damage: atk * 0.25, kill: false, shipDamage: e.contact };
}

// Share of speed kept after going through an enemy.
function pierceKeep(e, killed, stats) {
  const loss = killed ? 0.004 + e.r * 0.0006 : 0.1 + e.r * 0.002;
  return 1 - Math.min(0.6, loss * stats.pierceLossMult);
}

// ---- enemies.js ----


const BACK = Math.PI;
const SIDE = Math.PI / 2;

// hp/armor/contact are level-1 values; armor is in attack units (speed/100 at x1 multiplier).
const ENEMY_TYPES = {
  drifter: { name: 'ドリフター', r: 14, hp: 6, armor: 2, speed: 130, accel: 2.5, contact: 6, xp: 1, color: '#7fd1ff', shape: 'orb', behavior: 'chase', weakDir: BACK, weakArc: 1.0 },
  swarm: { name: 'スウォーム', r: 11, hp: 3, armor: 1.2, speed: 200, accel: 3, contact: 4, xp: 0.6, color: '#9df0ff', shape: 'dart', behavior: 'chase', weakDir: BACK, weakArc: 1.1 },
  darter: { name: 'ダーター', r: 16, hp: 9, armor: 3.5, speed: 110, accel: 2, contact: 10, xp: 2, color: '#ff9f6b', shape: 'dart', behavior: 'dash', weakDir: BACK, weakArc: 0.9, range: 520, windup: 0.7, dashSpeed: 760, dashTime: 0.55, recover: 0.9 },
  armored: { name: '装甲型', r: 30, hp: 40, armor: 12, speed: 70, accel: 1.2, contact: 11, xp: 6, color: '#9aa7b8', shape: 'hex', behavior: 'chase', weakDir: BACK, weakArc: 0.8, turn: 1.2 },
  splitter: { name: '分裂型', r: 22, hp: 14, armor: 4, speed: 60, accel: 1.5, contact: 8, xp: 2, color: '#a8ff7a', shape: 'blob', behavior: 'split', weakDir: SIDE, weakDir2: -SIDE, weakArc: 0.55, budInterval: 5, maxBuds: 5, turn: 1.5 },
  splitling: { name: '分裂体', r: 10, hp: 3, armor: 1.5, speed: 150, accel: 2.5, contact: 4, xp: 0.4, color: '#cfff9a', shape: 'blob', behavior: 'chase', weakDir: BACK, weakArc: 1.2 },
  leech: { name: '減速型', r: 20, hp: 14, armor: 5, speed: 120, accel: 1.6, contact: 6, xp: 3, color: '#c77dff', shape: 'diamond', behavior: 'leech', weakDir: BACK, weakArc: 0.9, auraR: 210, drain: 0.9, steal: 0.2 },

};

const MAX_ENEMY_R = 130;

let nextId = 1;

function createEnemy(type, level, x, y, opts = {}) {
  const T = ENEMY_TYPES[type];
  const L = Math.max(1, level);
  const elite = !!opts.elite;
  const size = type === 'meteor' || T.sizeVar ? (opts.size || T.r) : T.r;
  const sz = size / T.r;
  const hp = T.hp * sz * sz * (1 + 0.6 * (L - 1)) * CONFIG.enemyHpMult * (elite ? 3 : 1);
  return {
    id: nextId++, type, T, level: L, elite,
    x, y, vx: 0, vy: 0,
    r: size * (elite ? 1.25 : 1),
    hp, maxHp: hp,
    armor: T.armor * sz * (1 + 0.35 * (L - 1)) * CONFIG.enemyArmorMult * (elite ? 1.3 : 1),
    contact: T.contact * (1 + 0.2 * (L - 1)),
    xp: T.xp * sz * (1 + 0.5 * (L - 1)) * (elite ? 4 : 1),
    speed: T.speed * (1 + 0.04 * (L - 1)),
    facing: opts.facing ?? 0,
    weakDir: T.weakDir, weakDir2: T.weakDir2, weakArc: T.weakArc || 0,
    hitCD: 0, flash: 0, dead: false,
    state: 'move', timer: 0, fireT: (T.fireInterval || 0) * (0.5 + Math.random() * 0.5), charge: 0, budT: 0, buds: 0, age: 0,
    parent: opts.parent || 0,
    spin: opts.spin || 0,
  };
}

function steerTo(e, tx, ty, speed, accel, dt) {
  const dx = tx - e.x, dy = ty - e.y;
  const d = Math.hypot(dx, dy) || 1;
  const k = Math.min(1, accel * dt);
  e.vx += ((dx / d) * speed - e.vx) * k;
  e.vy += ((dy / d) * speed - e.vy) * k;
}

function turnToward(e, target, rate, dt) {
  let d = target - e.facing;
  d = Math.atan2(Math.sin(d), Math.cos(d));
  const m = rate * dt;
  e.facing += Math.max(-m, Math.min(m, d));
}

function angleToShip(e, game) {
  return Math.atan2(game.ship.y - e.y, game.ship.x - e.x);
}

// Hold a ring around the ship at `keep` distance while circling it.
function keepDistance(e, game, dt) {
  const sh = game.ship;
  const dx = e.x - sh.x, dy = e.y - sh.y;
  const d = Math.hypot(dx, dy) || 1;
  const side = e.id % 2 ? 1 : -1;
  const tx = sh.x + (dx / d) * e.T.keep - (dy / d) * 200 * side;
  const ty = sh.y + (dy / d) * e.T.keep + (dx / d) * 200 * side;
  steerTo(e, tx, ty, e.speed, e.T.accel, dt);
  turnToward(e, angleToShip(e, game), 3, dt);
}

function fire(game, e, angle, speed, kind) {
  const T = e.T;
  const lv = 1 + 0.25 * (e.level - 1);
  game.ebullets.push({
    kind, x: e.x + Math.cos(angle) * e.r, y: e.y + Math.sin(angle) * e.r,
    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, speed,
    r: kind === 'missile' ? 9 : 7, dmg: T.bulletDmg * lv, slow: T.slow, life: kind === 'missile' ? 4.5 : 4,
    turn: T.missileTurn || 0,
  });
  game.events.push({ type: 'shoot', x: e.x, y: e.y, kind });
}

// Count down to a shot; `charge` > 0 while telegraphing.
function gunTimer(e, dt) {
  e.fireT -= dt;
  e.charge = e.fireT < e.T.telegraph ? 1 - Math.max(0, e.fireT) / e.T.telegraph : 0;
  if (e.fireT <= 0) { e.fireT = e.T.fireInterval; return true; }
  return false;
}

const BEHAVIORS = {
  chase(e, game, dt) {
    const sh = game.ship;
    steerTo(e, sh.x, sh.y, e.speed, e.T.accel || 2, dt);
    turnToward(e, angleToShip(e, game), e.T.turn || 4, dt);
  },
  dash(e, game, dt) {
    const T = e.T;
    const sh = game.ship;
    const d = Math.hypot(sh.x - e.x, sh.y - e.y);
    e.timer -= dt;
    if (e.state === 'move') {
      BEHAVIORS.chase(e, game, dt);
      if (d < T.range) { e.state = 'windup'; e.timer = T.windup; }
    } else if (e.state === 'windup') {
      e.vx *= 1 - 4 * dt; e.vy *= 1 - 4 * dt;
      turnToward(e, angleToShip(e, game), 6, dt);
      if (e.timer <= 0) {
        e.state = 'dash'; e.timer = T.dashTime;
        e.vx = Math.cos(e.facing) * T.dashSpeed; e.vy = Math.sin(e.facing) * T.dashSpeed;
      }
    } else if (e.state === 'dash') {
      if (e.timer <= 0) { e.state = 'recover'; e.timer = T.recover; }
    } else {
      e.vx *= 1 - 2 * dt; e.vy *= 1 - 2 * dt;
      if (e.timer <= 0) e.state = 'move';
    }
  },
  split(e, game, dt) {
    BEHAVIORS.chase(e, game, dt);
    e.budT += dt;
    if (e.budT >= e.T.budInterval) {
      e.budT = 0;
      if (e.buds < e.T.maxBuds) {
        e.buds++;
        const a = game.rng() * Math.PI * 2;
        game.newEnemies.push(createEnemy('splitling', e.level, e.x + Math.cos(a) * e.r * 1.5, e.y + Math.sin(a) * e.r * 1.5, { parent: e.id, facing: a }));
      }
    }
  },
  leech(e, game, dt) {
    BEHAVIORS.chase(e, game, dt);
    const sh = game.ship;
    const d = Math.hypot(sh.x - e.x, sh.y - e.y);
    if (d < e.T.auraR) game.leechDrag += e.T.drain * (1 - d / e.T.auraR * 0.5);
  },
  gunner(e, game, dt) {
    keepDistance(e, game, dt);
    if (gunTimer(e, dt)) fire(game, e, angleToShip(e, game), e.T.bulletSpeed, 'bullet');
  },
  missile(e, game, dt) {
    keepDistance(e, game, dt);
    if (gunTimer(e, dt)) fire(game, e, e.facing, e.T.missileSpeed, 'missile');
  },
  battleship(e, game, dt) {
    BEHAVIORS.chase(e, game, dt);
    if (gunTimer(e, dt)) {
      const base = angleToShip(e, game);
      const n = e.T.volley;
      for (let i = 0; i < n; i++) fire(game, e, base + (i / (n - 1) - 0.5) * e.T.spread, e.T.bulletSpeed, 'bullet');
    }
  },
  drift(e, game, dt) {
    e.facing += e.spin * dt;
  },
};

function onEnemyDeath(e, game) {
  if (e.type === 'splitter') {
    for (let i = 0; i < 2; i++) {
      const a = e.facing + (i ? 1 : -1) * Math.PI / 2;
      const c = createEnemy('splitling', e.level, e.x + Math.cos(a) * e.r, e.y + Math.sin(a) * e.r, { facing: a });
      c.vx = Math.cos(a) * 200; c.vy = Math.sin(a) * 200;
      c.hitCD = 0.35;
      game.newEnemies.push(c);
    }
  }
}

function updateEnemy(e, game, dt) {
  e.age += dt;
  if (e.hitCD > 0) e.hitCD -= dt;
  if (e.flash > 0) e.flash -= dt;
  BEHAVIORS[e.T.behavior](e, game, dt);
  e.x += e.vx * dt;
  e.y += e.vy * dt;
  // stay out of the planet
  const p = game.field.planet;
  const d = Math.hypot(e.x - p.x, e.y - p.y);
  if (d < p.r + e.r && d > 0) {
    e.x = p.x + ((e.x - p.x) / d) * (p.r + e.r);
    e.y = p.y + ((e.y - p.y) / d) * (p.r + e.r);
  }
}

// ---- projectiles.js ----


// Enemy bullets and missiles. Returns hits on the ship via the callback.
function updateEnemyBullets(game, dt, onHit) {
  const sh = game.ship;
  const R = CONFIG.shipRadius;
  const p = game.field.planet;
  for (const b of game.ebullets) {
    if (b.kind === 'missile') {
      const want = Math.atan2(sh.y - b.y, sh.x - b.x);
      const cur = Math.atan2(b.vy, b.vx);
      let d = want - cur;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      const a = cur + Math.max(-b.turn * dt, Math.min(b.turn * dt, d));
      b.vx = Math.cos(a) * b.speed; b.vy = Math.sin(a) * b.speed;
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;
    const dx = b.x - sh.x, dy = b.y - sh.y;
    if (dx * dx + dy * dy < (b.r + R) * (b.r + R)) { onHit(b); b.life = 0; }
    if (Math.hypot(b.x - p.x, b.y - p.y) < p.r) b.life = 0;
  }
  if (game.ebullets.some((b) => b.life <= 0)) game.ebullets = game.ebullets.filter((b) => b.life > 0);
}

// ---- grid.js ----
const OFF = 4096;

function buildGrid(list, cell) {
  const map = new Map();
  for (const it of list) {
    if (it.dead) continue;
    const key = (Math.floor(it.x / cell) + OFF) * 8192 + (Math.floor(it.y / cell) + OFF);
    let arr = map.get(key);
    if (!arr) { arr = []; map.set(key, arr); }
    arr.push(it);
  }
  return { cell, map };
}

function queryGrid(grid, x0, y0, x1, y1, cb) {
  const c = grid.cell;
  const cx0 = Math.floor(x0 / c), cx1 = Math.floor(x1 / c);
  const cy0 = Math.floor(y0 / c), cy1 = Math.floor(y1 / c);
  for (let cx = cx0; cx <= cx1; cx++) {
    for (let cy = cy0; cy <= cy1; cy++) {
      const arr = grid.map.get((cx + OFF) * 8192 + (cy + OFF));
      if (!arr) continue;
      for (const it of arr) if (!it.dead) cb(it);
    }
  }
}

function queryRadius(grid, x, y, r, cb) {
  queryGrid(grid, x - r, y - r, x + r, y + r, (it) => {
    const dx = it.x - x, dy = it.y - y, rr = r + (it.r || 0);
    if (dx * dx + dy * dy <= rr * rr) cb(it);
  });
}

// The run's experience curve. pop = enemies kept around the ship, level = enemy strength.
const PHASES = [
  { id: 'build1', name: '強化期', sub: '弱い敵を吹っ飛ばして機体を育てろ', start: 0, end: 150, pop: [14, 45], level: [1.0, 1.35], rate: 6, mix: { drifter: 6, darter: 1.5, splitter: 0.8, swarm: 1, titan: 0.05 } },
  { id: 'pressure', name: '圧力期', sub: '敵が硬くなってきた', start: 150, end: 240, pop: [45, 70], level: [1.7, 2.3], rate: 8, mix: { drifter: 3.5, darter: 3, armored: 2.2, gunner: 1.1, leech: 1.5, splitter: 1.5, titan: 0.3 } },
  { id: 'build2', name: '強化期 II', sub: '今のうちに組み上げろ', start: 240, end: 300, pop: [38, 45], level: [2.0, 2.2], rate: 6, xpBonus: 1.4, mix: { drifter: 4, darter: 2, splitter: 2, gunner: 1, swarm: 2, titan: 0.4 } },
  { id: 'rampage', name: '無双期', sub: '群れが来る — まとめて貫け', start: 300, end: 360, pop: [140, 260], level: [1.3, 1.6], rate: 60, waves: 3.5, mix: { swarm: 10, drifter: 3, splitling: 2 } },
  { id: 'tension', name: '緊張期', sub: '互角の相手。弱点を突け', start: 360, end: 510, pop: [70, 110], level: [3.0, 4.4], rate: 10, mix: { darter: 3, armored: 3, gunner: 2, missile: 1.3, leech: 2, splitter: 2, drifter: 2.5, titan: 1.2, battleship: 0.3 } },
  { id: 'escape', name: '脱出期', sub: '出力コアで上限を解放し、脱出速度へ', start: 510, end: 600, pop: [90, 120], level: [4.2, 5.0], rate: 12, cores: true, mix: { darter: 3, armored: 3, gunner: 2, missile: 1.6, leech: 2, splitter: 1.5, swarm: 3, titan: 2, battleship: 0.6 } },
];

function getPhase(t) {
  for (const p of PHASES) if (t < p.end) return p;
  return PHASES[PHASES.length - 1];
}

function phaseTarget(t) {
  const p = getPhase(t);
  const k = clamp((t - p.start) / (p.end - p.start), 0, 1);
  return { phase: p, pop: lerp(p.pop[0], p.pop[1], k) * CONFIG.densityMult, level: lerp(p.level[0], p.level[1], k) };
}

function spawnPoint(game, extra = 0) {
  const sh = game.ship;
  for (let i = 0; i < 6; i++) {
    const a = game.rng() * TAU;
    const d = game.viewRadius + 100 + extra + game.rng() * 300;
    const x = sh.x + Math.cos(a) * d, y = sh.y + Math.sin(a) * d;
    const r = Math.hypot(x, y);
    if (r < CONFIG.fieldRadius + 200 && r > CONFIG.planetRadius + 150) return { x, y, a };
  }
  return null;
}

// Dangerous zones add tougher enemies; early in the run that bias is mostly armor, not guns.
function mixAt(phase, danger, t) {
  const items = Object.entries(phase.mix);
  if (danger > 0.25) {
    const ramp = clamp(t / 150, 0.15, 1);
    items.push(['armored', 2 * danger], ['gunner', danger * ramp], ['missile', 0.7 * danger * ramp]);
  }
  return items;
}

function spawnOne(game, target) {
  const pt = spawnPoint(game);
  if (!pt) return;
  const danger = dangerAt(Math.hypot(pt.x, pt.y));
  const type = pickWeighted(game.rng, mixAt(target.phase, danger, game.t));
  if (type === 'battleship' && game.enemies.some((e) => e.type === 'battleship')) return;
  if (type === 'titan' && game.enemies.filter((e) => e.type === 'titan').length >= 6) return;
  const T = ENEMY_TYPES[type];
  const late = target.phase.id === 'tension' || target.phase.id === 'escape';
  const elite = type !== 'battleship' && game.rng() < 0.01 + 0.06 * danger + (late ? 0.02 : 0);
  const level = target.level + danger * CONFIG.dangerLevel;
  const size = T.sizeVar ? T.r * (0.85 + game.rng() * 0.45) : undefined;
  game.enemies.push(createEnemy(type, level, pt.x, pt.y, { elite, size, facing: pt.a + Math.PI }));
}

function spawnWave(game, target) {
  const sh = game.ship;
  const n = Math.round(30 * CONFIG.densityMult);
  if (game.rng() < 0.5) {
    // ring closing in
    const d = game.viewRadius * 0.95;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      game.enemies.push(createEnemy('swarm', target.level, sh.x + Math.cos(a) * d, sh.y + Math.sin(a) * d, { facing: a + Math.PI }));
    }
  } else {
    // a stream from one direction
    const a = game.rng() * TAU;
    for (let i = 0; i < n; i++) {
      const d = game.viewRadius + 80 + i * 34;
      const off = (game.rng() - 0.5) * 120;
      game.enemies.push(createEnemy('swarm', target.level, sh.x + Math.cos(a) * d - Math.sin(a) * off, sh.y + Math.sin(a) * d + Math.cos(a) * off, { facing: a + Math.PI }));
    }
  }
  game.events.push({ type: 'wave' });
}

function keepMeteors(game) {
  let near = 0;
  for (const e of game.enemies) if (e.type === 'meteor') near++;
  if (near >= CONFIG.meteorCount) return;
  const pt = spawnPoint(game, 200);
  if (!pt) return;
  const m = createEnemy('meteor', 1, pt.x, pt.y, { size: 24 + game.rng() * 46, spin: (game.rng() - 0.5) * 1.2, facing: game.rng() * TAU });
  const a = pt.a + Math.PI + (game.rng() - 0.5) * 1.6;
  m.vx = Math.cos(a) * m.speed; m.vy = Math.sin(a) * m.speed;
  game.enemies.push(m);
}

function despawnFar(game) {
  const sh = game.ship;
  const far = game.viewRadius * 2.6 + 800;
  let removed = false;
  for (const e of game.enemies) {
    const lim = e.type === 'battleship' ? far * 1.6 : far;
    if (Math.abs(e.x - sh.x) > lim || Math.abs(e.y - sh.y) > lim) { e.dead = true; removed = true; }
  }
  if (removed) game.enemies = game.enemies.filter((e) => !e.dead);
}

function updateSpawner(game, dt) {
  if (!game.spawning) return;
  despawnFar(game);
  keepMeteors(game);
  const target = phaseTarget(game.t);
  const P = target.phase;
  let alive = 0;
  for (const e of game.enemies) if (e.type !== 'meteor') alive++;
  game.spawnAcc = Math.min(game.spawnAcc + P.rate * dt, 8);
  while (game.spawnAcc >= 1 && alive < target.pop) {
    game.spawnAcc -= 1;
    spawnOne(game, target);
    alive++;
  }
  if (P.waves) {
    game.waveT = (game.waveT || 0) + dt;
    if (game.waveT >= P.waves) { game.waveT = 0; spawnWave(game, target); }
  }
}

const META_UPGRADES = [
  { id: 'speed', name: '主推進器', desc: '最高速度 +5%', max: 5, costs: [25, 50, 90, 140, 210] },
  { id: 'hp', name: '機体フレーム', desc: '最大 HP +15', max: 5, costs: [20, 40, 70, 110, 160] },
  { id: 'atk', name: '衝角素材', desc: '攻撃力 +6%', max: 5, costs: [20, 40, 70, 110, 160] },
  { id: 'charge', name: '充電効率', desc: 'チャージ時間 -5%', max: 5, costs: [20, 40, 70, 110, 160] },
  { id: 'pickup', name: '回収装置', desc: '回収範囲 +15%', max: 5, costs: [15, 30, 55, 85, 125] },
  { id: 'xp', name: '学習回路', desc: '経験値 +8%', max: 5, costs: [25, 50, 90, 140, 210] },
];

const SAVE_KEY = 'speed-save-v1';

function metaCost(id, level) {
  const u = META_UPGRADES.find((x) => x.id === id);
  if (!u || level >= u.max) return null;
  return u.costs[level];
}

function buyUpgrade(save, id) {
  const lv = save.meta[id] || 0;
  const cost = metaCost(id, lv);
  if (cost == null || save.coins < cost) return false;
  save.coins -= cost;
  save.meta[id] = lv + 1;
  return true;
}

function defaultSave() {
  return { coins: 0, meta: {}, best: { runs: 0, escapes: 0, escapeTime: null, topSpeed: 0 } };
}

function loadSave(storage) {
  try {
    const raw = storage && storage.getItem(SAVE_KEY);
    if (!raw) return defaultSave();
    const s = JSON.parse(raw);
    const d = defaultSave();
    if (typeof s !== 'object' || !s) return d;
    return {
      coins: Number.isFinite(s.coins) ? s.coins : 0,
      meta: typeof s.meta === 'object' && s.meta ? s.meta : {},
      best: { ...d.best, ...(s.best || {}) },
    };
  } catch {
    return defaultSave();
  }
}

function writeSave(storage, save) {
  try { storage && storage.setItem(SAVE_KEY, JSON.stringify(save)); } catch { /* storage unavailable */ }
}

function applyRunResult(save, game) {
  save.coins += Math.round(game.coins);
  save.best.runs++;
  save.best.topSpeed = Math.max(save.best.topSpeed, game.peakSpeed);
  if (game.state === 'won') {
    save.best.escapes++;
    save.best.escapeTime = save.best.escapeTime == null ? game.t : Math.min(save.best.escapeTime, game.t);
  }
}

const BY_ID = Object.fromEntries(MODULES.map((m) => [m.id, m]));

function moduleDef(id) {
  return BY_ID[id];
}

// bonus.cores: power cores collected this run; bonus.level: current level. Both raise max speed.
function computeStats(meta, loadout, bonus = {}) {
  const s = baseStats(meta);
  for (const slot of SLOTS) {
    const mod = loadout[slot.id];
    if (mod) BY_ID[mod.id].apply(s, RARITY_MULT[mod.r] * (1 + CONFIG.dupBonus * (mod.plus || 0)), mod.r);
  }
  const lv = bonus.level || 0;
  s.maxSpeed *= (1 + CONFIG.coreBoost * (bonus.cores || 0)) * (1 + CONFIG.levelSpeedGrowth * lv);
  s.atkMult *= 1 + CONFIG.levelAtkGrowth * lv;
  s.maxHp += CONFIG.levelHpGrowth * lv;
  s.chargeTime *= Math.max(0.6, 1 - CONFIG.levelChargeGrowth * lv);
  return s;
}

function rarityWeights(ctx) {
  if (ctx.source === 'core') return [0, 0, 1, 2];
  if (ctx.source === 'capsule') {
    const d = ctx.danger || 0;
    return [6 * (1 - d), 3 + d, 0.6 + 4 * d, 2.4 * d * d];
  }
  if (ctx.source === 'drop') {
    // stronger enemies (power = their xp: type x level x elite) drop rarer modules
    const d = Math.max(Math.min(1, ((ctx.power || 1) - 1) / 20), (ctx.danger || 0) * 0.6);
    return [6 * (1 - d), 3 + d, 0.6 + 4 * d, 2.4 * d * d];
  }
  const t = ctx.t;
  if (t < 150) return [7, 2.5, 0.5, 0];
  if (t < 300) return [5, 4, 1.2, 0.1];
  if (t < 480) return [3, 4, 2.5, 0.4];
  return [1.5, 3, 4, 1.2];
}

function rollModule(rng, ctx) {
  const t = ctx.t || 0;
  const loadout = ctx.loadout;
  let slot;
  let pool;
  if (ctx.source === 'core') {
    slot = 'booster';
    pool = [BY_ID.limiter];
  } else {
    slot = pickWeighted(rng, SLOTS.map((s) => {
      const cur = loadout[s.id];
      let w = 1 + (cur ? (3 - cur.r) * 0.25 : 1.2);
      if (s.id === ctx.lastSlot) w *= 0.35;
      return [s.id, w];
    }));
    pool = MODULES.filter((m) => m.slot === slot && (m.minTime || 0) <= t && (!m.drawOnly || !ctx.scheme || ctx.scheme === 'draw'));
  }
  const rw = rarityWeights(ctx);
  const r = pickWeighted(rng, rw.map((w, i) => [i, w]));
  const fits = pool.filter((m) => m.rarities.includes(r));
  if (fits.length) {
    const def = fits[Math.floor(rng() * fits.length)];
    return { id: def.id, slot, r };
  }
  const def = pool[Math.floor(rng() * pool.length)];
  const nearest = def.rarities.reduce((a, b) => (Math.abs(b - r) < Math.abs(a - r) ? b : a));
  return { id: def.id, slot, r: nearest };
}

// ---- hits.js ----
// Damage, kills, drops and area attacks applied to enemies.







function damageEnemy(game, e, dmg, opts = {}) {
  if (e.dead || dmg <= 0) return;
  const fresh = e.hp >= e.maxHp - 1e-6;
  e.hp -= dmg;
  e.flash = 0.12;
  game.events.push({ type: 'hit', x: e.x, y: e.y, crit: !!opts.crit, dmg, cause: opts.cause });
  if (opts.crit) addText(game, e.x, e.y - e.r - 10, 'CRIT', '#ffe46b');
  if (e.hp <= 0) {
    if (fresh && opts.cause === 'ram') killStop(game, e, opts.crit);
    killEnemy(game, e, opts);
  } else if (opts.dirX !== undefined) {
    const k = opts.knock ?? 160;
    const mass = Math.max(1, e.r / 20);
    e.vx += (opts.dirX * k) / mass; e.vy += (opts.dirY * k) / mass;
  }
}

// One-shot ram kills freeze the action for a beat, so each kill in a sweep lands on its own.
function killStop(game, e, crit) {
  if (game.dashStop >= CONFIG.killHitstopCap) return;
  const t = CONFIG.killHitstop * (e.r > 25 ? 1.8 : 1) * (crit ? 1.3 : 1);
  game.hitstop = Math.max(game.hitstop, t);
  game.dashStop = (game.dashStop || 0) + t;
}

function killEnemy(game, e, opts = {}) {
  if (e.dead) return;
  e.dead = true;
  game.kills++;
  game.events.push({ type: 'kill', x: e.x, y: e.y, r: e.r, crit: !!opts.crit, enemyType: e.type, elite: e.elite, cause: opts.cause });
  burst(game, e.x, e.y, e.T.color, 6 + Math.round(e.r / 3), opts.dirX || 0, opts.dirY || 0, 260 + e.r * 4);
  onEnemyDeath(e, game);
  const phase = getPhase(game.t);
  const danger = dangerAt(Math.hypot(e.x, e.y));
  const xp = e.xp * game.stats.xpMult * CONFIG.xpMult * (phase.xpBonus || 1) * (1 + danger);
  dropGem(game, e.x, e.y, xp);
  dropCoins(game, e, danger);
  // modules come from enemies: stronger ones drop more often and rarer; elites and battleships always
  const power = e.xp;
  const chance = Math.min(CONFIG.dropMax, CONFIG.dropBase * Math.pow(power, CONFIG.dropPowerExp));
  if (e.elite || e.type === 'battleship' || game.rng() < chance) dropModule(game, e.x, e.y, power, danger);
  if (opts.cause === 'ram' && game.stats.fling) flingCorpse(game, e);
}

function flingCorpse(game, e) {
  const sh = game.ship;
  const sp = Math.hypot(sh.vx, sh.vy);
  if (sp < 1) return;
  const base = Math.atan2(sh.vy, sh.vx);
  const dmg = attackPower(sp, game.stats) * game.stats.fling;
  for (const off of [-0.28, 0, 0.28]) {
    const a = base + off;
    game.fbullets.push({
      kind: 'corpse', x: e.x, y: e.y, vx: Math.cos(a) * sp * 0.9, vy: Math.sin(a) * sp * 0.9,
      r: Math.max(10, e.r * 0.8), dmg, life: 0.7, pierce: true, hit: new Set(), color: e.T.color,
    });
  }
}

function dropCoins(game, e, danger) {
  let n = 0;
  if (e.type === 'battleship') n = 12;
  else if (e.elite) n = 3 + Math.floor(game.rng() * 4);
  else if (e.type === 'meteor') n = game.rng() < CONFIG.meteorCoinChance ? 1 + Math.floor(game.rng() * 3) : 0;
  else if (game.rng() < 0.03 * (1 + danger * 2)) n = 1;
  for (let i = 0; i < n; i++) {
    const a = game.rng() * Math.PI * 2, d = game.rng() * e.r;
    game.coinDrops.push({ x: e.x + Math.cos(a) * d, y: e.y + Math.sin(a) * d, v: 1, pulled: false, taken: false });
  }
}

function dropGem(game, x, y, v) {
  if (game.gems.length > 600) {
    const old = game.gems.shift();
    v += old.v;
  }
  const a = game.rng() * Math.PI * 2;
  game.gems.push({ x: x + Math.cos(a) * 8, y: y + Math.sin(a) * 8, v, age: 0, pulled: false, taken: false });
}

function dropModule(game, x, y, power, danger) {
  const mod = rollModule(game.rng, { t: game.t, loadout: game.loadout, source: 'drop', power, danger, scheme: game.scheme });
  game.capsules.push({ kind: 'capsule', src: 'drop', x, y, mod, age: 0 });
}

function dropCapsule(game, x, y, src, danger) {
  const mod = rollModule(game.rng, { t: game.t, loadout: game.loadout, source: 'capsule', danger, scheme: game.scheme });
  game.capsules.push({ kind: 'capsule', src, x, y, mod, age: 0 });
}

// Area damage that ignores armor (module effects, sonic booms).
function explode(game, x, y, radius, dmg, opts = {}) {
  const knock = opts.knock ?? 300;
  for (const e of game.enemies) {
    if (e.dead) continue;
    const dx = e.x - x, dy = e.y - y;
    const rr = radius + e.r;
    const d2 = dx * dx + dy * dy;
    if (d2 > rr * rr) continue;
    const d = Math.sqrt(d2) || 1;
    damageEnemy(game, e, dmg, { cause: opts.cause, dirX: dx / d, dirY: dy / d, knock });
  }
  addRing(game, x, y, radius, opts.color || '#ffb36b', opts.life || 0.4);
  game.events.push({ type: 'explode', x, y, radius, cause: opts.cause });
}

function burst(game, x, y, color, n, dx, dy, speed) {
  const P = game.fx.particles;
  if (P.length > 1600) return;
  for (let i = 0; i < n; i++) {
    const a = game.rng() * Math.PI * 2;
    const s = speed * (0.3 + game.rng());
    P.push({
      x, y,
      vx: Math.cos(a) * s * 0.6 + dx * s * 0.8,
      vy: Math.sin(a) * s * 0.6 + dy * s * 0.8,
      life: 0.5 + game.rng() * 0.4, max: 0.9, color, size: 2 + game.rng() * 4,
    });
  }
}

function addText(game, x, y, text, color, size = 16) {
  if (game.fx.texts.length > 40) game.fx.texts.shift();
  game.fx.texts.push({ x, y, text, color, life: size > 16 ? 0.9 : 0.7, size });
}

function addRing(game, x, y, radius, color, life = 0.45) {
  if (game.fx.rings.length > 80) game.fx.rings.shift();
  game.fx.rings.push({ x, y, radius, color, life, max: life });
}

// ---- effects.js ----
// Module effects that change how the ship attacks, plus field capsules and power cores.










function createEffectState() {
  return {
    fbullets: [], marks: [], mines: [], capsules: [],
    fx2: { waveT: 0, trailDist: 0, lastX: 0, lastY: 0, mineT: 0, turretT: 0, sonicCD: 0, prevSpeed: 0, capsuleT: 0, coreT: 0, coresStarted: false },
    dashActive: false, dashPeakAtk: 0,
  };
}

function onLaunch(game) {
  if (game.dashActive) finishDash(game);
  game.dashActive = true;
  game.dashPeakAtk = 0;
  game.dashPierce = 0;
  game.dashStop = 0;
}

function finishDash(game) {
  game.dashActive = false;
  const eb = game.stats.endBlast;
  if (eb && game.dashPierce >= eb.min) {
    const sh = game.ship;
    explode(game, sh.x, sh.y, eb.radius, game.dashPeakAtk * eb.mult, { cause: 'endBlast', color: '#ff9f40', knock: 500, life: 0.5 });
  }
}

function onPierce(game) {
  const s = game.stats, sh = game.ship;
  if (s.regenGauge) sh.gaugeBank = Math.min(s.gaugeMax, sh.gaugeBank + s.regenGauge);
}

function onShipHurt(game) {
  const s = game.stats, sh = game.ship;
  if (s.reactive) explode(game, sh.x, sh.y, 260, attackPower(s.maxSpeed, s) * s.reactive, { cause: 'reactive', color: '#ff6b5a', knock: 450 });
}

function updateEffects(game, dt) {
  const sh = game.ship, s = game.stats, F = game.fx2;
  const sp = Math.hypot(sh.vx, sh.vy);
  const atkNow = attackPower(sp, s);
  const atkMax = attackPower(s.maxSpeed, s);

  // dash bookkeeping (end-of-dash blast)
  if (sh.boostT > 0 && !game.dashActive) { game.dashActive = true; game.dashPeakAtk = 0; }
  if (game.dashActive) {
    game.dashPeakAtk = Math.max(game.dashPeakAtk, atkNow);
    if (sh.boostT <= 0) finishDash(game);
  }

  // charge shockwave
  if (s.chargeWave && sh.charging) {
    F.waveT += dt;
    if (F.waveT >= 0.5) {
      F.waveT = 0;
      explode(game, sh.x, sh.y, s.chargeWave.radius, atkMax * s.chargeWave.mult, { cause: 'chargeWave', color: '#5fd8ff', knock: 350 });
    }
  } else {
    F.waveT = 0.25;
  }

  // trail burst marks
  if (s.trailBurst && sh.boostT > 0 && sp > 200) {
    F.trailDist += sp * dt;
    if (F.trailDist >= 45) {
      F.trailDist = 0;
      game.marks.push({ x: sh.x, y: sh.y, t: 0.55, dmg: atkNow * s.trailBurst });
    }
  }
  for (const m of game.marks) {
    m.t -= dt;
    if (m.t <= 0) explode(game, m.x, m.y, 85, m.dmg, { cause: 'trail', color: '#ffcf6b', knock: 120, life: 0.25 });
  }
  if (game.marks.length) game.marks = game.marks.filter((m) => m.t > 0);

  // mines
  if (s.mines && sp > 0.6 * s.maxSpeed) {
    F.mineT += dt;
    if (F.mineT >= 0.2) {
      F.mineT = 0;
      game.mines.push({ x: sh.x, y: sh.y, life: 5, armed: 0.3, dmg: atkMax * s.mines });
    }
  }
  for (const m of game.mines) {
    m.life -= dt; m.armed -= dt;
    if (m.armed > 0) continue;
    for (const e of game.enemies) {
      if (e.dead) continue;
      const rr = 70 + e.r;
      if ((e.x - m.x) ** 2 + (e.y - m.y) ** 2 < rr * rr) {
        explode(game, m.x, m.y, 120, m.dmg, { cause: 'mine', color: '#ff7b54', knock: 300, life: 0.3 });
        m.life = 0;
        break;
      }
    }
  }
  if (game.mines.length) game.mines = game.mines.filter((m) => m.life > 0);

  // auto turret
  if (s.turret) {
    F.turretT += dt;
    if (F.turretT >= 1 / (1.6 * s.turret)) {
      let best = null, bd = 650 * 650;
      for (const e of game.enemies) {
        if (e.dead) continue;
        const d = (e.x - sh.x) ** 2 + (e.y - sh.y) ** 2;
        if (d < bd) { bd = d; best = e; }
      }
      if (best) {
        F.turretT = 0;
        const a = Math.atan2(best.y - sh.y, best.x - sh.x);
        game.fbullets.push({ kind: 'shot', x: sh.x, y: sh.y, vx: Math.cos(a) * 1300 + sh.vx * 0.5, vy: Math.sin(a) * 1300 + sh.vy * 0.5, r: 6, dmg: atkMax * 0.22, life: 0.8, pierce: false, hit: new Set(), color: '#9fe8ff' });
        game.events.push({ type: 'turret' });
      }
    }
  }
  updateFriendly(game, dt);

  // sonic boom on crossing 92% of max speed
  F.sonicCD -= dt;
  const thr = 0.92 * s.maxSpeed;
  if (s.sonic && F.sonicCD <= 0 && F.prevSpeed < thr && sp >= thr) {
    F.sonicCD = 2.5;
    explode(game, sh.x, sh.y, s.sonic.radius, atkMax * s.sonic.mult, { cause: 'sonic', color: '#ffffff', knock: 900, life: 0.7 });
    game.events.push({ type: 'sonic', x: sh.x, y: sh.y, radius: s.sonic.radius });
    game.slowmo = 0.45;
  }
  if (sp >= thr && F.prevSpeed < thr) game.events.push({ type: 'barrier', x: sh.x, y: sh.y });
  F.prevSpeed = sp;

  updateCapsules(game, dt);
}

function updateFriendly(game, dt) {
  const B = game.fbullets;
  if (!B.length) return;
  for (const b of B) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;
    const pad = b.r + 130;
    queryGrid(game.grid, b.x - pad, b.y - pad, b.x + pad, b.y + pad, (e) => {
      if (b.life <= 0 || b.hit.has(e.id)) return;
      const rr = b.r + e.r;
      if ((e.x - b.x) ** 2 + (e.y - b.y) ** 2 > rr * rr) return;
      b.hit.add(e.id);
      const sp = Math.hypot(b.vx, b.vy) || 1;
      damageEnemy(game, e, b.dmg, { cause: b.kind, dirX: b.vx / sp, dirY: b.vy / sp, knock: 250 });
      if (!b.pierce) b.life = 0;
    });
  }
  game.fbullets = B.filter((b) => b.life > 0);
}

function fieldCapsulePoint(game) {
  const rng = game.rng;
  const roll = rng();
  let r;
  if (roll < 0.4) r = randRange(rng, CONFIG.planetRadius + 200, CONFIG.zoneInner);
  else if (roll < 0.75) r = randRange(rng, CONFIG.zoneOuter, CONFIG.fieldRadius - 150);
  else r = randRange(rng, CONFIG.zoneInner, CONFIG.zoneOuter);
  const a = rng() * TAU;
  return { x: Math.cos(a) * r, y: Math.sin(a) * r, r };
}

function updateCapsules(game, dt) {
  const F = game.fx2, sh = game.ship;
  if (game.spawning) {
    F.capsuleT += dt;
    const field = game.capsules.filter((c) => c.src === 'field').length;
    if (field < CONFIG.capsuleCount && (game.t < 2 || F.capsuleT >= CONFIG.capsuleInterval)) {
      F.capsuleT = 0;
      const p = fieldCapsulePoint(game);
      const mod = rollModule(game.rng, { t: game.t, loadout: game.loadout, source: 'capsule', danger: dangerAt(p.r), scheme: game.scheme });
      game.capsules.push({ kind: 'capsule', src: 'field', x: p.x, y: p.y, mod, age: 0 });
    }
    if (getPhase(game.t).cores) {
      F.coreT += dt;
      const cores = game.capsules.filter((c) => c.kind === 'core').length;
      if (cores < 3 && (!F.coresStarted || F.coreT >= 20)) {
        F.coreT = 0;
        const a = game.rng() * TAU;
        const r = randRange(game.rng, CONFIG.planetRadius + 250, CONFIG.zoneInner - 300);
        game.capsules.push({ kind: 'core', src: 'core', x: Math.cos(a) * r, y: Math.sin(a) * r, mod: rollModule(game.rng, { source: 'core', t: game.t, loadout: game.loadout }), age: 0 });
        if (!F.coresStarted || cores >= 2) F.coresStarted = true;
        game.events.push({ type: 'core' });
      }
    }
  }
  let taken = false;
  const pull = game.stats.pickupRadius * 1.6;
  for (const c of game.capsules) {
    c.age += dt;
    if (c.src === 'drop' || c.src === 'elite') {
      const dx = sh.x - c.x, dy = sh.y - c.y, d = Math.hypot(dx, dy);
      if (d < pull && d > 1) { const v = (600 + Math.hypot(sh.vx, sh.vy)) * dt; c.x += (dx / d) * Math.min(v, d); c.y += (dy / d) * Math.min(v, d); }
    }
    const reach = 22 + CONFIG.shipRadius + 14;
    if ((c.x - sh.x) ** 2 + (c.y - sh.y) ** 2 < reach * reach) {
      c.taken = true; taken = true;
      if (c.kind === 'core') {
        game.cores++;
        refreshStats(game);
        addText(game, sh.x, sh.y - 50, `出力 +${Math.round(CONFIG.coreBoost * 100)}%`, '#ffd24a');
      } else {
        game.offerQueue.push({ ...c.mod, source: c.src && c.src !== 'field' ? c.src : 'capsule' });
      }
      addRing(game, c.x, c.y, 120, c.kind === 'core' ? '#ffd24a' : '#9fe8ff', 0.5);
      game.events.push({ type: 'pickup', kind: c.kind, r: c.mod.r });
    }
    if ((c.src === 'elite' || c.src === 'drop') && c.age > 45) { c.taken = true; taken = true; }
  }
  if (taken) game.capsules = game.capsules.filter((c) => !c.taken);
}

// ---- stages.js ----


// Speed tiers announced on screen as the ship breaks through them (values in px/s).
const SPEED_STAGES = [
  { v: CONFIG.escapeSpeed * 0.27, name: 'STAGE Ⅰ' },
  { v: CONFIG.escapeSpeed * 0.45, name: 'STAGE Ⅱ' },
  { v: CONFIG.escapeSpeed * 0.62, name: 'STAGE Ⅲ' },
  { v: CONFIG.escapeSpeed * 0.8, name: 'STAGE Ⅳ' },
  { v: CONFIG.escapeSpeed, name: 'ESCAPE' },
];

function speedStage(sp) {
  let s = 0;
  for (let i = 0; i < SPEED_STAGES.length; i++) if (sp >= SPEED_STAGES[i].v) s = i + 1;
  return s;
}

// ---- controls.js ----
// Control schemes. buildIntent turns raw input into what the world needs (charge / release / aim);
// controlStep and controlAim run inside the world step for scheme-specific steering and aiming.


const SCHEMES = [
  { id: 'draw', name: '軌跡を描いて駆け抜ける', help: 'ふだんはカーソルの方向へ進む。Space（またはクリック長押し）でチャージ → 離すと世界がほぼ止まる。クリックで描き始め、カーソルを動かして軌跡を描き（長さはチャージ量で決まる）、もう一度 Space／クリックで確定すると、止まった世界の中で軌跡を一瞬でなぞって駆け抜ける' },
  { id: 'mouse', name: 'マウスの方向へ進む ＋ Space', help: 'カーソルを置いた方向へ機体が向かう（クリック不要）。Space（またはクリック長押し）でチャージ → 離すとカーソルの方向へ突進' },
  { id: 'steer', name: 'WASD 旋回（画面基準）＋ Space', help: 'WASD で押した方向へ進行方向が素早く回る。Space 長押しでチャージ → 離すと進んでいる方向へ加速' },
  { id: 'relative', name: 'WASD 機体基準 ＋ Space', help: 'W 前進・S ブレーキ・A/D 左右に曲がる（止まっているとその場で旋回）。Space で機体の向きへ加速' },
  { id: 'nudge', name: 'WASD 微推力（画面基準）＋ Space', help: 'WASD で押した方向へ小さく推力。Space で進んでいる方向へ加速' },
  { id: 'rotate', name: 'A/D 照準を回す ＋ Space', help: 'A/D で照準を回す（長押しで速く）、W で進行方向へ、S で反転。Space で照準の向きへ突進' },
  { id: 'aim8', name: 'WASD 8 方向に狙う ＋ Space', help: 'WASD で狙う方向（8 方向）を決め、Space で突進。キーなしなら進行方向へ' },
  { id: 'drag', name: 'マウスで引っ張って離す', help: '押したままドラッグ → 離すとドラッグと逆方向へ突進。長く押すほど強い' },
];

function schemeById(id) {
  return SCHEMES.find((s) => s.id === id) || SCHEMES[0];
}

// Raw input -> intent { charging, release, aimX, aimY, keyboard, move, snap, cursor }.
// keyboard: the launch direction comes from the scheme (controlAim) instead of a drag.
function buildIntent(raw, scheme) {
  const it = { move: raw.move, snap: raw.snap, cursor: raw.cursor, press: !!raw.pressed, charging: false, release: false, aimX: 0, aimY: 0, keyboard: false };
  if (scheme === 'drag') {
    it.charging = raw.pointerDown;
    it.aimX = raw.drag.x; it.aimY = raw.drag.y;
    if (raw.release && raw.releaseSource === 'pointer') { it.release = true; it.aimX = raw.releaseDrag.x; it.aimY = raw.releaseDrag.y; }
  } else if (scheme === 'mouse' || scheme === 'draw') {
    it.charging = raw.space || raw.pointerDown;
    it.keyboard = true;
    it.release = raw.release;
  } else {
    // keyboard schemes keep the slingshot drag as a fallback
    if (raw.pointerDown) { it.charging = true; it.aimX = raw.drag.x; it.aimY = raw.drag.y; }
    else { it.charging = raw.space; it.keyboard = true; }
    if (raw.release) {
      it.release = true;
      if (raw.releaseSource === 'pointer') { it.keyboard = false; it.aimX = raw.releaseDrag.x; it.aimY = raw.releaseDrag.y; }
      else it.keyboard = true;
    }
  }
  return it;
}

const hasMove = (m) => m && (m.x || m.y);

// Swing the travel direction toward `want` at a fixed turn rate (speed kept); below cruise speed
// also accelerate that way so the ship can always get going.
function steerToward(game, want, dt) {
  const sh = game.ship;
  const sp = Math.hypot(sh.vx, sh.vy);
  if (sp > 1) {
    const cur = Math.atan2(sh.vy, sh.vx);
    const d = Math.atan2(Math.sin(want - cur), Math.cos(want - cur));
    const turn = Math.max(-CONFIG.steerRate * dt, Math.min(CONFIG.steerRate * dt, d));
    const c = Math.cos(turn), s = Math.sin(turn);
    const vx = sh.vx * c - sh.vy * s;
    sh.vy = sh.vx * s + sh.vy * c;
    sh.vx = vx;
  }
  const cruise = game.stats.maxSpeed * CONFIG.steerCruise;
  if (sp < cruise) {
    const add = Math.min(CONFIG.steerAccel * dt, cruise - sp);
    sh.vx += Math.cos(want) * add;
    sh.vy += Math.sin(want) * add;
  }
  sh.hx = Math.cos(want); sh.hy = Math.sin(want);
}

function cursorAngle(game, cursor) {
  if (!cursor) return null;
  const sh = game.ship;
  const dx = cursor.x - sh.x, dy = cursor.y - sh.y;
  if (dx * dx + dy * dy < CONFIG.mouseDeadZone * CONFIG.mouseDeadZone) return null;
  return Math.atan2(dy, dx);
}

// Screen-absolute small thrust (forward thrust only helps while slow).
function nudgeAbsolute(game, move) {
  const sh = game.ship;
  const sp = Math.hypot(sh.vx, sh.vy);
  const acc = CONFIG.nudgeAccel + CONFIG.nudgeSteer * sp;
  let ax = move.x * acc, ay = move.y * acc;
  if (sp > 1) {
    const ux = sh.vx / sp, uy = sh.vy / sp;
    const par = ax * ux + ay * uy;
    if (par > 0 && sp >= game.stats.maxSpeed * CONFIG.nudgeMaxSpeed) { ax -= par * ux; ay -= par * uy; }
  } else {
    sh.hx = move.x; sh.hy = move.y;
  }
  return { ax, ay };
}

// Ship-relative: W forward, S brake (never reverse), A/D bend when moving or pivot when still.
function nudgeRelative(game, move, dt) {
  const sh = game.ship;
  const fwd = -Math.sign(move.y), side = Math.sign(move.x);
  const sp = Math.hypot(sh.vx, sh.vy);
  const rx = -sh.hy, ry = sh.hx;
  let ax = 0, ay = 0;
  if (side) {
    if (sp > CONFIG.pivotSpeed) {
      const acc = CONFIG.nudgeAccel + CONFIG.nudgeSteer * sp;
      ax += rx * side * acc; ay += ry * side * acc;
    } else {
      const a = Math.atan2(sh.hy, sh.hx) + side * CONFIG.pivotRate * dt;
      sh.hx = Math.cos(a); sh.hy = Math.sin(a);
    }
  }
  if (fwd > 0 && sp < game.stats.maxSpeed * CONFIG.nudgeMaxSpeed) { ax += sh.hx * CONFIG.nudgeAccel; ay += sh.hy * CONFIG.nudgeAccel; }
  if (fwd < 0 && sp > 0) {
    const brake = Math.min(CONFIG.nudgeAccel + CONFIG.nudgeSteer * sp, sp / dt);
    ax -= (sh.vx / sp) * brake; ay -= (sh.vy / sp) * brake;
  }
  return { ax, ay };
}

// Rotating aim: A/D turn (accelerating while held), W/S snap to travel direction / flip.
function rotateAim(game, input, dt) {
  const sh = game.ship;
  const turn = input.move ? Math.sign(input.move.x) : 0;
  if (turn) {
    sh.turnHeld += dt;
    const k = Math.min(1, sh.turnHeld / CONFIG.turnAccelTime);
    sh.aimAngle += turn * (CONFIG.turnRateMin + (CONFIG.turnRateMax - CONFIG.turnRateMin) * k) * dt;
  } else {
    sh.turnHeld = 0;
  }
  if (input.snap === 'forward' && Math.hypot(sh.vx, sh.vy) > 1) sh.aimAngle = Math.atan2(sh.vy, sh.vx);
  else if (input.snap === 'back') sh.aimAngle += Math.PI;
  sh.aimAngle = Math.atan2(Math.sin(sh.aimAngle), Math.cos(sh.aimAngle));
}

const ZERO = { ax: 0, ay: 0 };

// Per-step steering. Returns extra acceleration for the physics step.
function controlStep(game, input, dt) {
  const sh = game.ship;
  switch (game.scheme) {
    case 'mouse':
    case 'draw': { // draw mode also cruises toward the cursor between paths
      const a = cursorAngle(game, input.cursor);
      if (a !== null) steerToward(game, a, dt);
      return ZERO;
    }
    case 'steer':
      if (hasMove(input.move)) steerToward(game, Math.atan2(input.move.y, input.move.x), dt);
      return ZERO;
    case 'nudge':
      return hasMove(input.move) ? nudgeAbsolute(game, input.move) : ZERO;
    case 'relative':
      return hasMove(input.move) ? nudgeRelative(game, input.move, dt) : ZERO;
    case 'rotate':
      rotateAim(game, input, dt);
      return ZERO;
    default:
      return ZERO;
  }
}

// Scheme aim for keyboard/hover launches: a vector, or null to boost along the heading.
function controlAim(game, input) {
  const sh = game.ship;
  switch (game.scheme) {
    case 'mouse':
    case 'draw': {
      const a = cursorAngle(game, input.cursor);
      return a === null ? null : { x: Math.cos(a) * 100, y: Math.sin(a) * 100 };
    }
    case 'rotate':
      return { x: Math.cos(sh.aimAngle) * 100, y: Math.sin(sh.aimAngle) * 100 };
    case 'aim8':
      return hasMove(input.move) ? { x: input.move.x * 100, y: input.move.y * 100 } : null;
    default:
      return null;
  }
}

// ---- world.js ----

















const STEP = 1 / 120;

function createGame(opts = {}) {
  const meta = opts.meta || {};
  const seed = opts.seed ?? (Math.random() * 4294967296) >>> 0;
  const loadout = Object.fromEntries(SLOTS.map((s) => [s.id, null]));
  const stats = computeStats(meta, loadout);
  const rng = makeRng(seed);
  const ship = createShip(stats, -CONFIG.startRadius, 0);
  ship.vy = -CONFIG.baseMaxSpeed * 0.3; // start drifting along the orbit
  return {
    t: 0, acc: 0, seed, rng,
    meta, stats, ship, loadout,
    scheme: opts.scheme || CONFIG.controlScheme,
    offerQueue: [], currentOffer: null, lastOfferSlot: null,
    field: createField(rng),
    debug: { invincible: false, autoOffer: null },
    enemies: [], newEnemies: [], ebullets: [],
    leechDrag: 0,
    gems: [], coinDrops: [],
    xp: 0, level: 0, pendingLevelups: 0,
    spawnAcc: 0, waveT: 0,
    phaseId: null,
    endReason: null,
    draw: null, lastPath: null,
    grid: buildGrid([], 160),
    fx: { particles: [], rings: [], texts: [] },
    ...createEffectState(),
    kills: 0, coins: 0, cores: 0,
    hitstop: 0, slowmo: 0,
    spawning: true,
    dashPierce: 0, dashId: 0,
    state: 'play',
    timeScale: 1,
    releasePending: null,
    peakSpeed: 0, stage: 0,
    events: [],
    viewRadius: 1400,
  };
}

function update(game, frameDt, input) {
  if (game.state !== 'play') return;
  frameDt = Math.min(frameDt, 0.1);
  if (input.release) game.releasePending = { x: input.aimX, y: input.aimY, keyboard: !!input.keyboard };
  updateFx(game, frameDt);
  if (game.hitstop > 0) { game.hitstop -= frameDt; return; }
  if (game.draw && game.draw.phase === 'draw') updateDrawing(game, frameDt, input);
  if (game.draw && game.draw.phase === 'run') {
    // trace every frame on real time (world steps are rare while it is nearly frozen)
    runAlongPath(game, frameDt);
    collideBodies(game);
    recordTrail(game.ship, frameDt);
  }
  let scale = 1;
  if (game.draw) scale = drawWorldScale(game);
  if (game.slowmo > 0) { game.slowmo -= frameDt; scale = Math.min(scale, 0.18); }
  game.timeScale = scale;
  game.acc += frameDt * scale;
  // the run clock keeps real time while drawing/tracing even though the world crawls
  if (game.draw) game.t += frameDt * (1 - scale);
  const phaseBefore = drawPhase(game);
  while (game.acc >= STEP) {
    game.acc -= STEP;
    step(game, STEP, input);
    if (input.snap) input = { ...input, snap: null }; // one-shot per frame, not per substep
    if (drawPhase(game) !== phaseBefore) { game.acc = 0; break; } // time scale changes next frame
    if (game.state !== 'play') break;
    if (game.offerQueue.length) {
      absorbDuplicates(game);
      if (game.offerQueue.length) { openOffer(game); break; }
    }
  }
  if (game.draw && game.slowmo <= 0) game.timeScale = drawWorldScale(game);
  if (game.state === 'play' && game.t >= CONFIG.runTime) end(game, 'lost', 'time');
}

// Heading follows the travel direction; when nearly still it keeps whatever the controls last set.
function updateHeading(sh) {
  const sp = Math.hypot(sh.vx, sh.vy);
  if (sp > CONFIG.pivotSpeed) { sh.hx = sh.vx / sp; sh.hy = sh.vy / sp; }
}

// Direction a keyboard/hover launch would take right now.
function schemeAim(game, input) {
  return controlAim(game, input) || { x: game.ship.hx * 100, y: game.ship.hy * 100 };
}

function step(game, dt, input) {
  const sh = game.ship;
  const stats = game.stats;
  game.t += dt;
  const phase = getPhase(game.t);
  if (phase.id !== game.phaseId) {
    game.phaseId = phase.id;
    game.events.push({ type: 'phase', phase });
  }

  const ctl = game.draw ? { ax: 0, ay: 0 } : controlStep(game, input, dt);
  updateHeading(sh);
  const aim = schemeAim(game, input);
  sh.markX = aim.x / 100; sh.markY = aim.y / 100;
  if (game.draw) {
    game.releasePending = null; // presses while drawing/running only commit the path
  } else if (input.charging && !game.releasePending) {
    if (!sh.charging) { sh.charging = true; sh.chargeT = 0; }
    sh.chargeT += dt;
    sh.gauge = computeGauge(sh.chargeT, stats, sh.gaugeBank);
    sh.aimX = input.keyboard ? aim.x : input.aimX;
    sh.aimY = input.keyboard ? aim.y : input.aimY;
  }
  if (game.releasePending && !game.draw) {
    const r = game.releasePending;
    game.releasePending = null;
    if (sh.charging) {
      if (r.keyboard && game.scheme === 'draw') startDrawing(game, input);
      else if (r.keyboard) launch(game, aim.x, aim.y);
      else launch(game, r.x, r.y);
    }
    sh.charging = false;
  }

  updateMoons(game.field, game.t);
  game.leechDrag = 0;
  for (const e of game.enemies) updateEnemy(e, game, dt);
  flushNewEnemies(game);
  separateEnemies(game);
  game.grid = buildGrid(game.enemies, 160);

  if (!game.draw) {
    const g = gravityAt(game.field, game.t, sh.x, sh.y);
    const drag = dustDragAt(game.field, sh.x, sh.y) + game.leechDrag;
    const x0 = sh.x, y0 = sh.y;
    stepShip(sh, stats, dt, g.ax + ctl.ax, g.ay + ctl.ay, drag);
    collideEnemies(game, x0, y0);
    collideBodies(game);
  }
  if (sh.invulnT > 0) sh.invulnT -= dt;
  updateEnemyBullets(game, dt, (b) => damageShip(game, b.dmg, b.slow, b.kind));
  updateEffects(game, dt);
  if (game.enemies.some((e) => e.dead)) game.enemies = game.enemies.filter((e) => !e.dead);
  flushNewEnemies(game);
  updateSpawner(game, dt);
  updateGems(game, dt);
  if (stats.regen > 0) sh.hp = Math.min(stats.maxHp, sh.hp + stats.regen * dt);

  const sp = Math.hypot(sh.vx, sh.vy);
  if (sp > game.peakSpeed) game.peakSpeed = sp;
  recordTrail(sh, dt);
  const st = speedStage(sp);
  if (st > game.stage) {
    game.stage = st;
    game.events.push({ type: 'stage', stage: st, name: SPEED_STAGES[st - 1].name, speed: sp });
  } else if (game.stage > 0 && sp < SPEED_STAGES[game.stage - 1].v * 0.85) {
    game.stage = st;
  }

  if (sp >= CONFIG.escapeSpeed) end(game, 'won', 'escape');
  else if (sh.hp <= 0) end(game, 'lost', 'hp');
  else if (game.t >= CONFIG.runTime) end(game, 'lost', 'time');
}

function end(game, state, reason) {
  if (state === 'won') game.coins += CONFIG.escapeBonus;
  game.state = state;
  game.endReason = reason;
  game.events.push({ type: 'end', state, reason });
}

// ---- offers ----

// Picking up a module you already have upgrades it (+1, +15% effect each) instead of asking.
function absorbDuplicates(game) {
  while (game.offerQueue.length) {
    const o = game.offerQueue[0];
    const cur = game.loadout[o.slot];
    if (!cur || cur.id !== o.id) return;
    game.offerQueue.shift();
    cur.r = Math.max(cur.r, o.r);
    cur.plus = (cur.plus || 0) + 1;
    refreshStats(game);
    const sh = game.ship;
    addText(game, sh.x, sh.y - 46, `${moduleDef(cur.id).name} +${cur.plus}`, RARITIES[cur.r].color, 20);
    game.events.push({ type: 'upgrade', mod: cur });
  }
}

function pushOffer(game, mod, source) {
  game.lastOfferSlot = mod.slot;
  game.offerQueue.push({ ...mod, source });
}

function openOffer(game) {
  const auto = game.debug.autoOffer;
  game.state = 'offer';
  game.currentOffer = game.offerQueue.shift();
  game.ship.charging = false;
  game.releasePending = null;
  game.events.push({ type: 'offer' });
  if (auto) while (game.state === 'offer') resolveOffer(game, auto === 'equip' || (auto === 'better' && isBetter(game, game.currentOffer)));
}

function isBetter(game, mod) {
  const cur = game.loadout[mod.slot];
  return !cur || mod.r >= cur.r;
}

// accept: equip (the old module in that slot is thrown away); otherwise discard the offer.
function resolveOffer(game, accept) {
  const mod = game.currentOffer;
  if (!mod) return;
  if (accept) {
    game.loadout[mod.slot] = { id: mod.id, slot: mod.slot, r: mod.r, plus: 0 };
    refreshStats(game);
    game.events.push({ type: 'equip', mod });
  }
  absorbDuplicates(game);
  if (game.offerQueue.length) {
    game.currentOffer = game.offerQueue.shift();
  } else {
    game.currentOffer = null;
    game.state = 'play';
  }
}

function refreshStats(game) {
  const oldMax = game.stats.maxHp;
  game.stats = computeStats(game.meta, game.loadout, { cores: game.cores, level: game.level });
  const gain = game.stats.maxHp - oldMax;
  if (gain > 0) game.ship.hp += gain;
  game.ship.hp = Math.min(game.ship.hp, game.stats.maxHp);
}

// ---- draw a path, then run it (draw scheme) ----

function drawPhase(game) {
  return game.draw ? game.draw.phase : null;
}

function drawBudget(game, gauge) {
  return CONFIG.drawLength * gauge * (game.stats.maxSpeed / CONFIG.baseMaxSpeed) * game.stats.drawLengthMult;
}

// How far the wave from a traced path reaches (the band drawn around the path).
function waveRadius(game) {
  return CONFIG.waveRadius * game.stats.waveRadiusMult;
}

// The traced path gives off a wave: enemies within reach take damage once per pass and are
// pushed away from the path. Sampled finely so long, fast traces leave no gaps.
function waveAlong(game, r, x0, y0, x1, y1) {
  const W = waveRadius(game);
  const len = Math.hypot(x1 - x0, y1 - y0);
  const n = Math.max(1, Math.ceil(len / Math.min(W, 40)));
  const dmg = attackPower(r.speed, game.stats) * CONFIG.waveDamage * game.stats.waveDmgMult;
  for (let k = 1; k <= n; k++) {
    const px = x0 + (x1 - x0) * k / n, py = y0 + (y1 - y0) * k / n;
    for (const [id, e] of r.waveInside) {
      if (e.dead || Math.hypot(px - e.x, py - e.y) > e.r + W + 2) r.waveInside.delete(id);
    }
    queryGrid(game.grid, px - W - MAX_ENEMY_R, py - W - MAX_ENEMY_R, px + W + MAX_ENEMY_R, py + W + MAX_ENEMY_R, (e) => {
      if (r.waveInside.has(e.id)) return;
      const d = Math.hypot(e.x - px, e.y - py);
      if (d > e.r + W) return;
      r.waveInside.set(e.id, e);
      damageEnemy(game, e, dmg, { cause: 'wave', dirX: (e.x - px) / (d || 1), dirY: (e.y - py) / (d || 1), knock: 260 });
    });
    r.waveAcc += len / n;
    if (r.waveAcc >= 45) { r.waveAcc = 0; addRing(game, px, py, W, 'rgba(130,225,255,0.9)', 0.35); }
  }
}

// World speed while tracing: the faster the dash, the slower everything else.
function traceWorldScale(game) {
  return Math.max(CONFIG.drawRunScaleMin, Math.min(1, CONFIG.drawRunSlowRef / Math.max(1, game.draw.speed)));
}

function drawWorldScale(game) {
  return game.draw.phase === 'draw' ? CONFIG.drawTimeScale : traceWorldScale(game);
}

function startDrawing(game, input) {
  const sh = game.ship;
  const budget = drawBudget(game, sh.gauge);
  game.draw = { phase: 'draw', points: [{ x: sh.x, y: sh.y }], budget, used: 0, timeLeft: CONFIG.drawTime, gauge: sh.gauge, cursor: input.cursor || null, blocked: false, started: false };
  sh.charging = false;
  game.events.push({ type: 'drawStart' });
}

// Real-time while the world crawls: the path follows the cursor until the length runs out,
// time runs out, it reaches a planet, or the player presses again.
function updateDrawing(game, dt, input) {
  const d = game.draw;
  d.timeLeft -= dt;
  if (input.cursor) d.cursor = input.cursor;
  if (!d.started) {
    // the line only starts on a click (or Space), so moving the mouse never draws by accident
    if (input.press) { d.started = true; if (d.cursor) extendPath(game, d, d.cursor); }
    else if (d.timeLeft <= 0) commitPath(game);
    return;
  }
  if (input.cursor) extendPath(game, d, input.cursor);
  if (input.press || d.used >= d.budget - 0.5 || d.timeLeft <= 0 || d.blocked) commitPath(game);
}

function extendPath(game, d, c) {
  const last = d.points[d.points.length - 1];
  const dx = c.x - last.x, dy = c.y - last.y;
  const len = Math.hypot(dx, dy);
  if (len < CONFIG.drawStep) return;
  const remain = d.budget - d.used;
  if (remain <= 0.5) return;
  let L = Math.min(len, remain);
  const ux = dx / len, uy = dy / len;
  const R = CONFIG.shipRadius;
  for (const b of [game.field.planet, ...game.field.moons]) {
    const t = segCircleT(last.x, last.y, last.x + ux * L, last.y + uy * L, b.x, b.y, b.r + R);
    if (t >= 0) { L = Math.max(0, t * L - 2); d.blocked = true; }
  }
  if (L < 1) return;
  d.points.push({ x: last.x + ux * L, y: last.y + uy * L });
  d.used += L;
}

function commitPath(game) {
  const d = game.draw, sh = game.ship;
  if (d.points.length < 2) {
    // nothing drawn: dash straight at the cursor (or along the heading) for the full length
    let ux = sh.hx, uy = sh.hy;
    if (d.cursor) {
      const dx = d.cursor.x - sh.x, dy = d.cursor.y - sh.y, l = Math.hypot(dx, dy);
      if (l > 1) { ux = dx / l; uy = dy / l; }
    }
    const o = d.points[0];
    extendPath(game, d, { x: o.x + ux * d.budget, y: o.y + uy * d.budget });
    if (d.points.length < 2) { game.draw = null; return; }
  }
  const pts = d.points;
  const l = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
  const dx = (pts[1].x - pts[0].x) / l, dy = (pts[1].y - pts[0].y) / l;
  onLaunch(game);
  const v = launchVelocity(sh.vx, sh.vy, dx, dy, d.gauge, game.stats);
  const speed = Math.max(Math.hypot(v.vx, v.vy), 1);
  sh.vx = dx * speed; sh.vy = dy * speed;
  sh.boostT = game.stats.boostDuration; sh.fadeT = 0; sh.gaugeBank = 0;
  sh.aimAngle = Math.atan2(dy, dx);
  game.dashId++;
  game.lastPath = pts;
  let total = 0;
  for (let i = 1; i < pts.length; i++) total += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
  // speed = the dash speed (attack, escape, momentum afterwards); rate = how fast the path is traced on screen
  const rate = Math.max(speed, total / (CONFIG.drawRunTime / game.stats.traceSpeedMult));
  game.draw = { phase: 'run', path: pts, seg: 0, segPos: 0, speed, rate, budget: d.budget, inside: new Map(), passes: new Map(), waveInside: new Map(), waveAcc: 0 };
  game.events.push({ type: 'launch', gauge: d.gauge, x: sh.x, y: sh.y, dx, dy });
}

// Trace the polyline quickly (the world is nearly frozen); piercing costs dash speed, a bounce ends it.
function runAlongPath(game, realDt) {
  const r = game.draw, sh = game.ship;
  let dist = r.rate * realDt;
  while (dist > 1e-9 && r.seg < r.path.length - 1) {
    const a = r.path[r.seg], b = r.path[r.seg + 1];
    const segLen = Math.hypot(b.x - a.x, b.y - a.y);
    if (segLen < 1e-6) { r.seg++; r.segPos = 0; continue; }
    const ux = (b.x - a.x) / segLen, uy = (b.y - a.y) / segLen;
    const move = Math.min(dist, segLen - r.segPos);
    const x0 = sh.x, y0 = sh.y;
    // enemies the ship body has left can be hit again on the next pass
    const R = CONFIG.shipRadius;
    for (const [id, e] of r.inside) {
      if (e.dead || Math.hypot(x0 - e.x, y0 - e.y) > e.r + R + 2) r.inside.delete(id);
    }
    r.segPos += move; dist -= move;
    sh.x = a.x + ux * r.segPos; sh.y = a.y + uy * r.segPos;
    sh.vx = ux * r.speed; sh.vy = uy * r.speed;
    waveAlong(game, r, x0, y0, sh.x, sh.y);
    if (collideEnemies(game, x0, y0, R, r)) { game.draw = null; return; }
    const sp = Math.hypot(sh.vx, sh.vy);
    if (sp < r.speed) r.speed = sp;
    if (r.segPos >= segLen - 1e-9) { r.seg++; r.segPos = 0; }
  }
  if (r.seg >= r.path.length - 1) {
    game.draw = null;
    sh.boostT = game.stats.boostDuration; // keep cruising along the last segment
  }
}

// Preview for the drawing UI: where the run would crit (hot) and the first thing that would stop it.
function previewPath(game) {
  const d = game.draw;
  if (!d || d.phase !== 'draw' || d.points.length < 2) return { samples: [], block: null, targets: [] };
  const pts = d.points, sh = game.ship, R = CONFIG.shipRadius, W = waveRadius(game);
  const l = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y) || 1;
  const v = launchVelocity(sh.vx, sh.vy, (pts[1].x - pts[0].x) / l, (pts[1].y - pts[0].y) / l, d.gauge, game.stats);
  const atk = attackPower(Math.hypot(v.vx, v.vy), game.stats);
  const samples = [];
  const targets = new Map(); // enemy -> { crit, hits }
  let prev = new Set();
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    const n = Math.max(1, Math.ceil(len / 14));
    for (let k = 1; k <= n; k++) {
      const p = { x: a.x + (b.x - a.x) * k / n, y: a.y + (b.y - a.y) * k / n, hot: false };
      let blocked = false;
      const cur = new Set();
      queryGrid(game.grid, p.x - W - MAX_ENEMY_R, p.y - W - MAX_ENEMY_R, p.x + W + MAX_ENEMY_R, p.y + W + MAX_ENEMY_R, (e) => {
        const d2 = (p.x - e.x) ** 2 + (p.y - e.y) ** 2;
        if (d2 > (e.r + W) ** 2) return;
        const t = targets.get(e) || { crit: false, body: false };
        targets.set(e, t);
        if (d2 > (e.r + R) ** 2) return; // wave only
        cur.add(e);
        if (prev.has(e)) return; // still inside from the previous sample: same pass
        const crit = isWeakHit(e, p.x, p.y, game.stats.weakArcMult);
        if (crit) p.hot = true;
        if (!canPierce(atk, e, crit)) { blocked = true; return; }
        t.body = true; t.crit = t.crit || crit;
      });
      prev = cur;
      samples.push(p);
      if (blocked) return { samples, block: p, targets: [...targets] };
    }
  }
  return { samples, block: null, targets: [...targets] };
}

// ---- ship ----

function launch(game, ax, ay) {
  const sh = game.ship;
  const len = Math.hypot(ax, ay);
  let dx, dy;
  if (len < CONFIG.minDrag) {
    dx = sh.hx; dy = sh.hy;
  } else {
    dx = ax / len; dy = ay / len;
  }
  onLaunch(game);
  sh.aimAngle = Math.atan2(dy, dx);
  const v = launchVelocity(sh.vx, sh.vy, dx, dy, sh.gauge, game.stats);
  sh.vx = v.vx; sh.vy = v.vy;
  sh.boostT = game.stats.boostDuration;
  sh.fadeT = 0;
  sh.gaugeBank = 0;
  game.dashId++;
  game.events.push({ type: 'launch', gauge: sh.gauge, x: sh.x, y: sh.y, dx, dy });
}

// amount: hp lost, slow: share of speed lost (0..1)
function damageShip(game, amount, slow, cause = 'other') {
  const sh = game.ship;
  if (sh.invulnT > 0 || game.debug.invincible) return false;
  sh.hp -= amount * game.stats.damageTakenMult;
  const k = 1 - Math.min(0.9, slow * game.stats.hitSlowMult);
  sh.vx *= k; sh.vy *= k;
  sh.invulnT = CONFIG.invulnTime;
  game.events.push({ type: 'hurt', amount: amount * game.stats.damageTakenMult, x: sh.x, y: sh.y, cause });
  addText(game, sh.x, sh.y - 30, `-${Math.round(amount * game.stats.damageTakenMult)}`, '#ff6b5a');
  onShipHurt(game);
  return true;
}

// R: hit radius of the ship (wider while tracing a drawn path).
// run: the trace state; while tracing, an enemy can be hit again each time the band re-enters it.
function collideEnemies(game, x0, y0, R = CONFIG.shipRadius, run = null) {
  const sh = game.ship, stats = game.stats;
  const x1 = sh.x, y1 = sh.y;
  const pad = R + MAX_ENEMY_R;
  const hits = [];
  queryGrid(game.grid, Math.min(x0, x1) - pad, Math.min(y0, y1) - pad, Math.max(x0, x1) + pad, Math.max(y0, y1) + pad, (e) => {
    if (run ? run.inside.has(e.id) : e.hitCD > 0) return;
    const t = segCircleT(x0, y0, x1, y1, e.x, e.y, e.r + R);
    if (t >= 0) hits.push({ e, t });
  });
  if (!hits.length) return false;
  hits.sort((a, b) => a.t - b.t);
  for (const { e, t } of hits) {
    const hx = x0 + (x1 - x0) * t, hy = y0 + (y1 - y0) * t;
    const sp = Math.hypot(sh.vx, sh.vy);
    const ux = sp > 0 ? sh.vx / sp : 0, uy = sp > 0 ? sh.vy / sp : 0;
    const atk = attackPower(sp, stats);
    const crit = isWeakHit(e, hx, hy, stats.weakArcMult);
    const res = resolveRam(atk, e, crit, stats);
    if (res.pierce) {
      damageEnemy(game, e, res.damage, { crit, cause: 'ram', dirX: ux, dirY: uy });
      e.hitCD = 0.3;
      if (run) {
        run.inside.set(e.id, e);
        const n = (run.passes.get(e.id) || 0) + 1;
        run.passes.set(e.id, n);
        if (n > 1) addText(game, e.x + e.r, e.y - e.r - 16, `×${n}`, crit ? '#ffe46b' : '#ffffff', 22 + 4 * Math.min(n, 5));
      }
      const keep = pierceKeep(e, e.dead, stats);
      sh.vx *= keep; sh.vy *= keep;
      game.dashPierce++;
      onPierce(game);
      if (e.T.steal) { const k = 1 - e.T.steal * stats.hitSlowMult; sh.vx *= k; sh.vy *= k; game.events.push({ type: 'drain', x: e.x, y: e.y }); }
      if (crit) game.hitstop = Math.max(game.hitstop, e.dead ? 0.05 : 0.035);
      continue;
    }
    // bounce off
    let nx = hx - e.x, ny = hy - e.y;
    const nd = Math.hypot(nx, ny) || 1;
    nx /= nd; ny /= nd;
    sh.x = e.x + nx * (e.r + R + 1);
    sh.y = e.y + ny * (e.r + R + 1);
    const vn = sh.vx * nx + sh.vy * ny;
    if (vn < 0) { sh.vx -= 2 * vn * nx; sh.vy -= 2 * vn * ny; }
    sh.vx *= stats.bounceKeep; sh.vy *= stats.bounceKeep;
    if (Math.hypot(sh.vx, sh.vy) < 220) { sh.vx = nx * 220; sh.vy = ny * 220; }
    if (!stats.reflect) sh.boostT = 0;
    damageEnemy(game, e, res.damage, { crit, cause: 'bump', dirX: -nx, dirY: -ny });
    e.hitCD = 0.25;
    damageShip(game, res.shipDamage * stats.bounceDamageMult, 0, `bump:${e.type}`);
    game.events.push({ type: 'bounce', x: sh.x, y: sh.y });
    return true;
  }
  return false;
}

function collideBodies(game) {
  const sh = game.ship;
  const R = CONFIG.shipRadius;
  const f = game.field;
  const restitution = game.stats.reflect ? 0.9 : CONFIG.crashRestitution;
  for (const b of [f.planet, ...f.moons]) {
    const dx = sh.x - b.x, dy = sh.y - b.y;
    const d = Math.hypot(dx, dy);
    const min = b.r + R;
    if (d >= min || d === 0) continue;
    const nx = dx / d, ny = dy / d;
    sh.x = b.x + nx * min;
    sh.y = b.y + ny * min;
    const vn = sh.vx * nx + sh.vy * ny;
    if (vn < 0) {
      sh.vx -= (1 + restitution) * vn * nx;
      sh.vy -= (1 + restitution) * vn * ny;
      const dmg = Math.max(0, -vn - 200) * CONFIG.crashDamage * game.stats.bounceDamageMult;
      if (dmg > 0) damageShip(game, dmg, 0, b === f.planet ? 'planet' : 'moon');
      game.events.push({ type: 'crash', x: sh.x, y: sh.y, power: -vn });
    }
  }
  // hard wall well outside the soft boundary
  const r = Math.hypot(sh.x, sh.y);
  const wall = CONFIG.fieldRadius + 500;
  if (r > wall) {
    const nx = sh.x / r, ny = sh.y / r;
    sh.x = nx * wall; sh.y = ny * wall;
    const vn = sh.vx * nx + sh.vy * ny;
    if (vn > 0) { sh.vx -= 2 * vn * nx; sh.vy -= 2 * vn * ny; }
  }
}

function recordTrail(sh, dt) {
  sh.trailAcc += dt;
  if (sh.trailAcc < 1 / 60) return;
  sh.trailAcc = 0;
  sh.trail.push({ x: sh.x, y: sh.y });
  if (sh.trail.length > 150) sh.trail.shift();
}

// ---- enemies ----

function flushNewEnemies(game) {
  if (!game.newEnemies.length) return;
  for (const e of game.newEnemies) game.enemies.push(e);
  game.newEnemies.length = 0;
}

function separateEnemies(game) {
  const grid = buildGrid(game.enemies, 120);
  for (const e of game.enemies) {
    queryGrid(grid, e.x - e.r - 40, e.y - e.r - 40, e.x + e.r + 40, e.y + e.r + 40, (o) => {
      if (o.id <= e.id) return;
      const dx = o.x - e.x, dy = o.y - e.y;
      const min = (e.r + o.r) * 0.9;
      const d2 = dx * dx + dy * dy;
      if (d2 >= min * min || d2 === 0) return;
      const d = Math.sqrt(d2);
      const push = (min - d) * 0.5;
      const wE = o.r * o.r / (e.r * e.r + o.r * o.r);
      e.x -= (dx / d) * push * 2 * wE; e.y -= (dy / d) * push * 2 * wE;
      o.x += (dx / d) * push * 2 * (1 - wE); o.y += (dy / d) * push * 2 * (1 - wE);
    });
  }
}

// ---- pickups ----

function updateGems(game, dt) {
  const sh = game.ship;
  const pr = game.stats.pickupRadius;
  const sp = Math.hypot(sh.vx, sh.vy);
  for (const g of game.gems) {
    g.age += dt;
    const dx = sh.x - g.x, dy = sh.y - g.y;
    const d = Math.hypot(dx, dy);
    if (d < pr || g.pulled) {
      g.pulled = true;
      const pull = 700 + sp * 1.2;
      g.x += (dx / (d || 1)) * pull * dt;
      g.y += (dy / (d || 1)) * pull * dt;
    }
    if (d < CONFIG.shipRadius + 14) { g.taken = true; addXp(game, g.v); }
  }
  if (game.gems.some((g) => g.taken)) game.gems = game.gems.filter((g) => !g.taken);
  for (const c of game.coinDrops) {
    const dx = sh.x - c.x, dy = sh.y - c.y;
    const d = Math.hypot(dx, dy);
    if (d < pr * 1.3 || c.pulled) {
      c.pulled = true;
      const pull = 700 + sp * 1.2;
      c.x += (dx / (d || 1)) * pull * dt;
      c.y += (dy / (d || 1)) * pull * dt;
    }
    if (d < CONFIG.shipRadius + 14) { c.taken = true; game.coins += c.v; game.events.push({ type: 'coin' }); }
  }
  if (game.coinDrops.some((c) => c.taken)) game.coinDrops = game.coinDrops.filter((c) => !c.taken);
}

function addXp(game, v) {
  game.xp += v;
  let need = xpForLevel(game.level);
  while (game.xp >= need) {
    game.xp -= need;
    game.level++;
    game.ship.hp = Math.min(game.stats.maxHp, game.ship.hp + game.stats.maxHp * CONFIG.levelHeal);
    game.events.push({ type: 'levelup', level: game.level });
    need = xpForLevel(game.level);
    refreshStats(game); // level-ups raise base stats; modules come from enemy drops
    addText(game, game.ship.x, game.ship.y - 34, `Lv ${game.level}`, '#6dffb0', 18);
  }
}

// ---- fx ----

function updateFx(game, dt) {
  const P = game.fx.particles;
  for (const p of P) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - 2.5 * dt; p.vy *= 1 - 2.5 * dt; p.life -= dt; }
  game.fx.particles = P.filter((p) => p.life > 0);
  for (const t of game.fx.texts) { t.y -= 40 * dt; t.life -= dt; }
  game.fx.texts = game.fx.texts.filter((t) => t.life > 0);
  for (const r of game.fx.rings) r.life -= dt;
  game.fx.rings = game.fx.rings.filter((r) => r.life > 0);
}

// ---- prediction ----

// Ballistic preview of a launch along (dx, dy) with the given gauge, under gravity only.
function predictPath(game, dx, dy, gauge, seconds) {
  const sh = game.ship;
  const len = Math.hypot(dx, dy) || 1;
  const v = launchVelocity(sh.vx, sh.vy, dx / len, dy / len, gauge, game.stats);
  return simulateFrom(game, { x: sh.x, y: sh.y, vx: v.vx, vy: v.vy, boostT: game.stats.boostDuration, fadeT: 0 }, 0, seconds);
}

function simulateFrom(game, ghost, t0, seconds) {
  const pts = [];
  const h = 1 / 60;
  const field = { ...game.field, moons: game.field.moons.map((m) => ({ ...m })) };
  for (let t = t0; t < seconds; t += h) {
    updateMoons(field, game.t + t);
    const g = gravityAt(field, game.t + t, ghost.x, ghost.y);
    stepShip(ghost, game.stats, h, g.ax, g.ay, 0);
    const p = { x: ghost.x, y: ghost.y, sp: Math.hypot(ghost.vx, ghost.vy), t, vx: ghost.vx, vy: ghost.vy };
    pts.push(p);
    if (hitsBody(field, p.x, p.y)) { p.block = true; break; }
  }
  return pts;
}

function hitsBody(field, x, y) {
  const R = CONFIG.shipRadius;
  for (const b of [field.planet, ...field.moons]) {
    if ((x - b.x) ** 2 + (y - b.y) ** 2 < (b.r + R) ** 2) return true;
  }
  return false;
}
