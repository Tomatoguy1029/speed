// fire(game, L, st): one attack. interval: seconds between attacks at rate 1 (omit for always-on weapons).
const WEAPONS = [
  { id: 'gun', name: 'ブラスター', color: '#ffe46b', levels: GUN_LEVELS, // interval from CONFIG.gunRate (tunable)
    desc: '進行方向へ弾を撃つ（止まっていても最後に進んだ方向へ）', fire: fireGun },
  { id: 'missile', name: '追尾ミサイル', color: '#ff9f40', levels: MISSILE_LEVELS, interval: 1.6,
    desc: '近くの敵を追いかけて小さく爆発するミサイル', fire: fireMissiles },
  { id: 'orbit', name: 'オービットブレード', color: '#9fe8ff', levels: ORBIT_LEVELS,
    desc: '機体の周りを回り続ける刃。触れた敵を切り続ける', fire: null },
  { id: 'nova', name: 'パルスノヴァ', color: '#c995ff', levels: NOVA_LEVELS, interval: 2.5,
    desc: '一定間隔で機体から衝撃波を放ち、周りの敵を押し返す', fire: fireNova },
  { id: 'arc', name: 'アークコイル', color: '#a8f0ff', levels: ARC_LEVELS, interval: 1.2,
    desc: '近くの敵に稲妻を落とし、次々と飛び移る', fire: fireArc },
  { id: 'laser', name: 'レーザーランス', color: '#ff6bd5', levels: LASER_LEVELS, interval: 2.2,
    desc: '最も近い敵の方向へ、すべてを貫く長いビームを撃つ', fire: fireLaser },
  { id: 'disc', name: 'リターンディスク', color: '#6dffb0', levels: DISC_LEVELS, interval: 1.8,
    desc: '敵の方へ投げると戻ってくる刃。行きも帰りも貫く', fire: fireDiscs },
];

const WEAPON_DEFS = Object.fromEntries(WEAPONS.map((w) => [w.id, w]));

function weaponDef(id) {
  return WEAPON_DEFS[id];
}

function weaponCount(game) {
  return Object.values(game.weapons).filter((lv) => lv > 0).length;
}

const wdmg = (game, base) => base * game.stats.atkMult;

// Nearest live enemies to (x, y) within range, closest first.
function nearestEnemies(game, x, y, range, n, skip) {
  const found = [];
  queryGrid(game.grid, x - range - MAX_ENEMY_R, y - range - MAX_ENEMY_R, x + range + MAX_ENEMY_R, y + range + MAX_ENEMY_R, (e) => {
    if (e.dead || (skip && skip.has(e.id))) return;
    const d = Math.hypot(e.x - x, e.y - y) - e.r;
    if (d <= range) found.push({ e, d });
  });
  found.sort((a, b) => a.d - b.d);
  return found.slice(0, n).map((f) => f.e);
}

function aimAt(game, target) {
  const sh = game.ship;
  if (target) return Math.atan2(target.y - sh.y, target.x - sh.x);
  return Math.atan2(sh.hy, sh.hx);
}

function updateWeapons(game, dt) {
  const busy = game.jump || game.portalDash;
  for (const w of WEAPONS) {
    const lv = game.weapons[w.id] || 0;
    if (!lv) continue;
    const L = w.levels[lv - 1];
    const st = game.wstate[w.id] || (game.wstate[w.id] = { t: 0 });
    if (w.id === 'orbit') { updateOrbit(game, L, st, dt); continue; }
    if (busy) continue;
    st.t += dt;
    if (st.t < (w.interval ?? 1 / CONFIG.gunRate) / (L.rate || 1)) continue;
    if (w.fire(game, L, st) !== false) st.t = 0;
  }
  updateWeaponProjectiles(game, dt);
  for (const f of game.wfx) f.life -= dt;
  if (game.wfx.length) game.wfx = game.wfx.filter((f) => f.life > 0);
}

function fireGun(game, L) {
  const sh = game.ship;
  const base = Math.atan2(sh.hy, sh.hx);
  const dmg = wdmg(game, CONFIG.gunDamage * L.dmg);
  for (let i = 0; i < L.shots; i++) {
    const a = base + (i - (L.shots - 1) / 2) * CONFIG.gunSpread;
    game.fbullets.push({ kind: 'gun', x: sh.x, y: sh.y, vx: Math.cos(a) * CONFIG.gunSpeed + sh.vx, vy: Math.sin(a) * CONFIG.gunSpeed + sh.vy,
      r: 5, dmg, life: CONFIG.gunLife, pierce: false, pierceLeft: L.pierce, hit: new Set(), color: '#ffe46b' });
  }
  game.events.push({ type: 'turret' });
}

function fireMissiles(game, L) {
  const sh = game.ship;
  const targets = nearestEnemies(game, sh.x, sh.y, 750, L.count);
  if (!targets.length) return false;
  for (let i = 0; i < L.count; i++) {
    const t = targets[i % targets.length];
    const a = aimAt(game, t) + (i - (L.count - 1) / 2) * 0.5;
    game.wproj.push({ kind: 'missile', x: sh.x, y: sh.y, vx: Math.cos(a) * 420, vy: Math.sin(a) * 420, target: t, life: 2.5,
      dmg: wdmg(game, 8 * L.dmg), radius: L.radius });
  }
  game.events.push({ type: 'shoot' });
}

function fireNova(game, L) {
  const sh = game.ship;
  explode(game, sh.x, sh.y, L.radius, wdmg(game, 6 * L.dmg), { cause: 'nova', color: '#c995ff', knock: 380, life: 0.5 });
}

function fireArc(game, L) {
  const sh = game.ship;
  const hit = new Set();
  let any = false;
  for (let b = 0; b < L.bolts; b++) {
    let from = { x: sh.x, y: sh.y };
    const pts = [from];
    let next = nearestEnemies(game, sh.x, sh.y, 450, 1, hit)[0];
    for (let k = 0; k < L.chains && next; k++) {
      hit.add(next.id);
      pts.push({ x: next.x, y: next.y });
      damageEnemy(game, next, wdmg(game, 7 * L.dmg), { cause: 'arc', dirX: (next.x - from.x) / (Math.hypot(next.x - from.x, next.y - from.y) || 1), dirY: (next.y - from.y) / (Math.hypot(next.x - from.x, next.y - from.y) || 1), knock: 120 });
      from = next;
      next = nearestEnemies(game, from.x, from.y, L.reach, 1, hit)[0];
    }
    if (pts.length > 1) { any = true; game.wfx.push({ kind: 'bolt', pts, life: 0.18, max: 0.18 }); }
  }
  if (!any) return false;
  game.events.push({ type: 'shoot' });
}

function fireLaser(game, L) {
  const sh = game.ship;
  const targets = nearestEnemies(game, sh.x, sh.y, L.length, L.beams);
  if (!targets.length) return false;
  const dmg = wdmg(game, 10 * L.dmg);
  for (let i = 0; i < L.beams; i++) {
    const a = aimAt(game, targets[i % targets.length]) + (i >= targets.length ? 0.4 * i : 0);
    const ux = Math.cos(a), uy = Math.sin(a);
    const x1 = sh.x + ux * L.length, y1 = sh.y + uy * L.length, half = L.width / 2;
    queryGrid(game.grid, Math.min(sh.x, x1) - half - MAX_ENEMY_R, Math.min(sh.y, y1) - half - MAX_ENEMY_R,
      Math.max(sh.x, x1) + half + MAX_ENEMY_R, Math.max(sh.y, y1) + half + MAX_ENEMY_R, (e) => {
        if (e.dead) return;
        const t = Math.max(0, Math.min(L.length, (e.x - sh.x) * ux + (e.y - sh.y) * uy));
        if (Math.hypot(sh.x + ux * t - e.x, sh.y + uy * t - e.y) > e.r + half) return;
        damageEnemy(game, e, dmg, { cause: 'laser', dirX: ux, dirY: uy, knock: 140 });
      });
    game.wfx.push({ kind: 'beam', x0: sh.x, y0: sh.y, x1, y1, width: L.width, life: 0.22, max: 0.22 });
  }
  game.events.push({ type: 'shoot' });
}

function fireDiscs(game, L) {
  const sh = game.ship;
  const t = nearestEnemies(game, sh.x, sh.y, 600, 1)[0];
  const base = aimAt(game, t);
  for (let i = 0; i < L.discs; i++) {
    const a = base + (i - (L.discs - 1) / 2) * 0.45;
    game.wproj.push({ kind: 'disc', x: sh.x, y: sh.y, vx: Math.cos(a) * 950 + sh.vx * 0.5, vy: Math.sin(a) * 950 + sh.vy * 0.5,
      ax: -Math.cos(a) * 1300, ay: -Math.sin(a) * 1300, life: 1.6, r: L.size, dmg: wdmg(game, 6 * L.dmg), hits: new Map(), spin: 0 });
  }
}

// Orbit blades are always out (even during jumps); each enemy can be cut again every 0.4 s.
function updateOrbit(game, L, st, dt) {
  const sh = game.ship;
  st.angle = (st.angle || 0) + L.spin * dt;
  st.hits = st.hits || new Map();
  const dmg = wdmg(game, 4 * L.dmg), R = 14;
  st.blades = [];
  for (let i = 0; i < L.blades; i++) {
    const a = st.angle + i * Math.PI * 2 / L.blades;
    const bx = sh.x + Math.cos(a) * L.dist, by = sh.y + Math.sin(a) * L.dist;
    st.blades.push({ x: bx, y: by, a });
    queryGrid(game.grid, bx - R - MAX_ENEMY_R, by - R - MAX_ENEMY_R, bx + R + MAX_ENEMY_R, by + R + MAX_ENEMY_R, (e) => {
      if (e.dead || (st.hits.get(e.id) || 0) > game.t) return;
      const d = Math.hypot(e.x - bx, e.y - by);
      if (d > e.r + R) return;
      st.hits.set(e.id, game.t + 0.4);
      damageEnemy(game, e, dmg, { cause: 'orbit', dirX: (e.x - sh.x) / (Math.hypot(e.x - sh.x, e.y - sh.y) || 1), dirY: (e.y - sh.y) / (Math.hypot(e.x - sh.x, e.y - sh.y) || 1), knock: 200 });
    });
  }
  if (st.hits.size > 400) for (const [id, until] of st.hits) if (until <= game.t) st.hits.delete(id);
}

function updateWeaponProjectiles(game, dt) {
  const P = game.wproj;
  if (!P.length) return;
  for (const p of P) {
    p.life -= dt;
    if (p.kind === 'missile') {
      if (!p.target || p.target.dead) p.target = nearestEnemies(game, p.x, p.y, 600, 1)[0] || null;
      const sp = Math.hypot(p.vx, p.vy) || 1;
      let a = Math.atan2(p.vy, p.vx);
      if (p.target) {
        const want = Math.atan2(p.target.y - p.y, p.target.x - p.x);
        const d = Math.atan2(Math.sin(want - a), Math.cos(want - a));
        a += Math.max(-6 * dt, Math.min(6 * dt, d));
      }
      const v = Math.min(900, sp + 900 * dt);
      p.vx = Math.cos(a) * v; p.vy = Math.sin(a) * v;
      p.x += p.vx * dt; p.y += p.vy * dt;
      let boom = p.life <= 0;
      if (!boom) {
        queryGrid(game.grid, p.x - 10 - MAX_ENEMY_R, p.y - 10 - MAX_ENEMY_R, p.x + 10 + MAX_ENEMY_R, p.y + 10 + MAX_ENEMY_R, (e) => {
          if (!e.dead && Math.hypot(e.x - p.x, e.y - p.y) < e.r + 10) boom = true;
        });
      }
      if (boom) { explode(game, p.x, p.y, p.radius, p.dmg, { cause: 'missile', color: '#ff9f40', knock: 260, life: 0.3 }); p.life = 0; }
    } else if (p.kind === 'disc') {
      p.vx += p.ax * dt; p.vy += p.ay * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.spin += dt * 14;
      queryGrid(game.grid, p.x - p.r - MAX_ENEMY_R, p.y - p.r - MAX_ENEMY_R, p.x + p.r + MAX_ENEMY_R, p.y + p.r + MAX_ENEMY_R, (e) => {
        if (e.dead || (p.hits.get(e.id) || 0) > game.t) return;
        if (Math.hypot(e.x - p.x, e.y - p.y) > e.r + p.r) return;
        p.hits.set(e.id, game.t + 0.35);
        const sp = Math.hypot(p.vx, p.vy) || 1;
        damageEnemy(game, e, p.dmg, { cause: 'disc', dirX: p.vx / sp, dirY: p.vy / sp, knock: 180 });
      });
    }
  }
  game.wproj = P.filter((p) => p.life > 0);
}

// ---- upgrades.js ----
// Level-up choices: weapons that grow with level-ups (Vampire Survivors style) and stackable perks
// that change how hyperdrive plays. Every level-up offers three of them.




const PERK_MAX = 5; // each perk can be taken up to this many times

// desc(n): what the perk does with n stacks.
const PERKS = [
  { id: 'chainBlast', name: '連鎖爆発', hyperOnly: true,
    desc: (n) => `ハイパードライブ中の3回目ごとのジャンプが着地点で爆発（半径 ${perkBlastRadius(n)}、威力 ジャンプ攻撃力×${perkBlastMult(n).toFixed(1)}）` },
  { id: 'fullCharge', name: '満タン突撃', hyperOnly: true,
    desc: (n) => `チャージ満タンから跳んだジャンプは硬い敵にも弾かれず、攻撃力 ×${fullChargePower(n).toFixed(1)}。貯めて待つほど強い一撃` },
  { id: 'crossBlast', name: '交差爆破', hyperOnly: true,
    desc: (n) => `同じハイパードライブ中に自分のジャンプの線を横切ると、交点が爆発（半径 ${120 + 25 * n}、威力 ジャンプ攻撃力×${(0.8 + 0.4 * n).toFixed(1)}）` },
  { id: 'vortex', name: '余韻の渦', hyperOnly: true,
    desc: (n) => `ジャンプの着地点に渦が残り、${vortexLife(n).toFixed(1)}秒間 半径${vortexRadius(n)}の敵を引き寄せる。次のジャンプでまとめて貫く` },
  { id: 'extraCell', name: '予備セル', hyperOnly: true,
    desc: (n) => `チャージの最大数 +${n}（合計 ${CONFIG.hyperMaxCharges + n}）` },
  { id: 'quickCell', name: '急速充填', hyperOnly: true,
    desc: (n) => `チャージの充填時間 -${Math.round((1 - Math.pow(0.85, n)) * 100)}%` },
];

const PERK_BY_ID = Object.fromEntries(PERKS.map((p) => [p.id, p]));

function perkLevel(game, id) {
  return game.perks[id] || 0;
}

function perkBlastRadius(n) { return 150 + 30 * (n - 1); }
function perkBlastMult(n) { return 1.2 + 0.6 * (n - 1); }
function fullChargePower(n) { return 1.5 + 0.5 * (n - 1); }
function vortexRadius(n) { return 220 + 30 * (n - 1); }
function vortexLife(n) { return 1.5 + 0.3 * (n - 1); }

// Three different choices: upgrades of owned weapons are a little more likely than anything else;
// new weapons only while a weapon slot is free (CONFIG.weaponSlots, like Vampire Survivors).
function rollLevelChoices(game) {
  const pool = [];
  const slotFree = weaponCount(game) < CONFIG.weaponSlots;
  for (const w of WEAPONS) {
    const lv = game.weapons[w.id] || 0;
    if (lv >= w.levels.length || (!lv && !slotFree)) continue;
    pool.push({ kind: 'weapon', id: w.id, level: lv + 1, weight: lv ? 1.6 : 1 });
  }
  for (const p of PERKS) {
    if (p.hyperOnly && !isHyperScheme(game.scheme)) continue;
    const n = perkLevel(game, p.id);
    if (n < PERK_MAX) pool.push({ kind: 'perk', id: p.id, level: n + 1, weight: 1 });
  }
  const out = [];
  while (out.length < 3 && pool.length) {
    let roll = game.rng() * pool.reduce((a, c) => a + c.weight, 0);
    let i = 0;
    while (i < pool.length - 1 && roll >= pool[i].weight) { roll -= pool[i].weight; i++; }
    out.push(pool.splice(i, 1)[0]);
  }
  if (out.length < 3) out.push({ kind: 'heal', id: 'repair', level: 1 });
  return out;
}

// Card text for a choice.
function choiceInfo(c) {
  if (c.kind === 'weapon') {
    const w = weaponDef(c.id);
    return { tag: c.level === 1 ? '新しい武器' : '武器強化', name: `${w.name} Lv${c.level}`, desc: c.level === 1 ? w.desc : w.levels[c.level - 1].text };
  }
  if (c.kind === 'perk') {
    const p = PERK_BY_ID[c.id];
    return { tag: c.level === 1 ? '新しい特性' : '特性強化', name: `${p.name}${c.level > 1 ? ` ×${c.level}` : ''}`, desc: p.desc(c.level) };
  }
  return { tag: '回復', name: '緊急修理', desc: 'HP を 30% 回復' };
}

function applyLevelChoice(game, c) {
  if (c.kind === 'weapon') game.weapons[c.id] = c.level;
  else if (c.kind === 'perk') game.perks[c.id] = c.level;
  else game.ship.hp = Math.min(game.stats.maxHp, game.ship.hp + game.stats.maxHp * 0.3);
}

// The current build, for the level-up screen.
function buildSummary(game) {
  const out = [];
  for (const w of WEAPONS) if (game.weapons[w.id]) out.push(`${w.name} Lv${game.weapons[w.id]}`);
  for (const p of PERKS) if (game.perks[p.id]) out.push(`${p.name}${game.perks[p.id] > 1 ? ` ×${game.perks[p.id]}` : ''}`);
  return out;
}

// ---- world.js ----






















const STEP = 1 / 120;

function createGame(opts = {}) {
  const meta = opts.meta || {};
  const seed = opts.seed ?? (Math.random() * 4294967296) >>> 0;
  const loadout = Object.fromEntries(SLOTS.map((s) => [s.id, null]));
  // The portal prototype starts with its arrival wave so the core interaction is immediately testable.
  if ((opts.scheme || CONFIG.controlScheme) === 'portal') loadout.radar = { id: 'portalPulse', slot: 'radar', r: 0, plus: 0 };
  const stats = computeStats(meta, loadout);
  const rng = makeRng(seed);
  const ship = createShip(stats, -CONFIG.startRadius, 0);
  ship.vy = -CONFIG.baseMaxSpeed * 0.3; // start drifting along the orbit
  return {
    t: 0, acc: 0, seed, rng,
    meta, stats, ship, loadout,
    scheme: opts.scheme || CONFIG.controlScheme,
    offerQueue: [], currentOffer: null, lastOfferSlot: null,
    field: createField(rng),
    debug: { invincible: false, autoOffer: null },
    enemies: [], newEnemies: [], ebullets: [],
    boss: null, bossSpawned: false,
    finale: null, finishFrames: [], finishClock: 0,
    leechDrag: 0,
    gems: [], coinDrops: [],
    xp: 0, level: 0, pendingLevelups: 0, levelChoices: null,
    weapons: { gun: 1 }, perks: {}, wstate: {}, wproj: [], wfx: [], vortices: [],
    spawnAcc: 0, waveT: 0,
    phaseId: null,
    endReason: null,
    jump: null, hyper: createHyperState(),
    portals: [], portalSerial: 0, portalDash: null, portalPreview: null, portalTouch: null, portalEntryT: 0,
    portalSpace: { armed: false, seconds: 0, consumed: false },
    portalClock: 0, portalCooldowns: new Map(),
    grid: buildGrid([], 160),
    fx: { particles: [], rings: [], texts: [], ghosts: [], loops: [], impacts: [] },
    ...createEffectState(),
    kills: 0, coins: 0, cores: 0,
    hitstop: 0, slowmo: 0,
    spawning: true,
    dashPierce: 0, dashId: 0,
    state: 'play',
    timeScale: 1,
    releasePending: null,
    peakSpeed: 0, stage: 0,
    events: [],
    viewRadius: 1400,
  };
}

function update(game, frameDt, input) {
  frameDt = Math.min(frameDt, 0.1);
  if (game.state === 'finishing') {
    updateFx(game, frameDt * (game.finale.phase === 'slow' ? CONFIG.bossFinishReplayWindow / CONFIG.bossFinishSlowTime : 1));
    const finished = advanceBossFinish(game, frameDt);
    if (finished) end(game, 'won', 'boss');
    return;
  }
  if (game.state !== 'play') return;
  recordBossApproach(game, frameDt);
  game.portalClock += frameDt;
  for (const [edge, until] of game.portalCooldowns) if (until <= game.portalClock) game.portalCooldowns.delete(edge);
  if (input.release) game.releasePending = { x: input.aimX, y: input.aimY, keyboard: !!input.keyboard };
  updateFx(game, frameDt);
  handlePortalInput(game, input, frameDt);
  updateHyper(game, input, frameDt);
  if (game.hitstop > 0) { game.hitstop -= frameDt; return; }
  // outside a dash the hitstop budget refills slowly, so plain ramming kills keep their beat
  if (!game.jump && !game.portalDash && game.dashStop > 0) game.dashStop = Math.max(0, game.dashStop - frameDt * CONFIG.killHitstopRegen);
  if (game.portalDash) updatePortals(game, frameDt);
  if (game.state !== 'play') return;
  if (game.jump) {
    // jump every frame on real time (world steps are rare while it is nearly frozen)
    runJump(game, frameDt);
    if (game.state !== 'play') return;
    collideBodies(game);
    recordTrail(game.ship, frameDt);
  }
  let scale = 1;
  if (isHyperScheme(game.scheme)) scale = hyperWorldScale(game);
  if (game.portalDash) scale = portalWorldScale(game);
  if (game.slowmo > 0) { game.slowmo -= frameDt; scale = Math.min(scale, 0.18); }
  game.timeScale = scale;
  game.acc += frameDt * scale;
  // the run clock keeps real time in hyperdrive and during jumps even though the world crawls
  if (game.jump || game.hyper.focus || game.portalDash) game.t += frameDt * (1 - scale);
  const phaseBefore = jumpPhase(game);
  while (game.acc >= STEP) {
    game.acc -= STEP;
    step(game, STEP, input);
    if (input.snap) input = { ...input, snap: null }; // one-shot per frame, not per substep
    if (game.state !== 'play') break;
    if (jumpPhase(game) !== phaseBefore) { game.acc = 0; break; } // time scale changes next frame
    // level-ups wait until hyperdrive and jumps are over, like module offers
    if (game.pendingLevelups > 0 && !game.jump && !game.hyper.focus && !game.portalDash) { openLevelup(game); break; }
    if (game.offerQueue.length) {
      absorbDuplicates(game);
      if (game.offerQueue.length && !game.jump && !game.hyper.focus) { openOffer(game); break; }
    }
  }
  if (isHyperScheme(game.scheme) && !game.portalDash && game.slowmo <= 0) game.timeScale = hyperWorldScale(game);
  if (game.state === 'play' && game.t >= CONFIG.runTime) end(game, 'lost', 'time');
}

// Heading follows the travel direction; when nearly still it keeps whatever the controls last set.
function updateHeading(sh) {
  const sp = Math.hypot(sh.vx, sh.vy);
  if (sp > CONFIG.pivotSpeed) { sh.hx = sh.vx / sp; sh.hy = sh.vy / sp; }
}

// Direction a keyboard/hover launch would take right now.
function schemeAim(game, input) {
  return controlAim(game, input) || { x: game.ship.hx * 100, y: game.ship.hy * 100 };
}

function step(game, dt, input) {
  const sh = game.ship;
  const stats = game.stats;
  game.t += dt;
  const phase = getPhase(game.t);
  if (phase.id !== game.phaseId) {
    game.phaseId = phase.id;
    game.events.push({ type: 'phase', phase });
  }

  const ctl = game.jump || game.portalDash ? { ax: 0, ay: 0 } : controlStep(game, input, dt);
  updateHeading(sh);
  const aim = schemeAim(game, input);
  sh.markX = aim.x / 100; sh.markY = aim.y / 100;
  if (game.jump || game.portalDash) {
    game.releasePending = null; // presses during a jump do not launch
  } else if (input.charging && !game.releasePending) {
    if (!sh.charging) { sh.charging = true; sh.chargeT = 0; }
    sh.chargeT += dt;
    sh.gauge = computeGauge(sh.chargeT, stats, sh.gaugeBank);
    sh.aimX = input.keyboard ? aim.x : input.aimX;
    sh.aimY = input.keyboard ? aim.y : input.aimY;
  }
  if (game.releasePending && !game.jump && !game.portalDash) {
    const r = game.releasePending;
    game.releasePending = null;
    if (sh.charging) {
      if (r.keyboard) launch(game, aim.x, aim.y);
      else launch(game, r.x, r.y);
    }
    sh.charging = false;
  }

  updateMoons(game.field, game.t);
  game.leechDrag = 0;
  updateEnemyAim(game, dt);
  for (const e of game.enemies) updateEnemy(e, game, dt);
  flushNewEnemies(game);
  separateEnemies(game);
  game.grid = buildGrid(game.enemies, 160);

  if (!game.jump && !game.portalDash) {
    const g = gravityAt(game.field, game.t, sh.x, sh.y);
    const drag = dustDragAt(game.field, sh.x, sh.y) + game.leechDrag;
    const x0 = sh.x, y0 = sh.y;
    stepShip(sh, stats, dt, g.ax + ctl.ax, g.ay + ctl.ay, drag);
    if (isHyperScheme(game.scheme)) hyperSlowdown(game, dt);
    collideEnemies(game, x0, y0);
    if (game.state !== 'play') return;
    collideBodies(game);
    checkPortalEntry(game, x0, y0);
  }
  if (sh.invulnT > 0) sh.invulnT -= dt;
  updateWeapons(game, dt);
  updateVortices(game, dt);
  updateEnemyBullets(game, dt, (b) => damageShip(game, b.dmg, b.slow, b.kind));
  updateEffects(game, dt);
  if (game.state !== 'play') return;
  if (game.enemies.some((e) => e.dead)) game.enemies = game.enemies.filter((e) => !e.dead);
  flushNewEnemies(game);
  updateSpawner(game, dt);
  updateGems(game, dt);
  if (stats.regen > 0) sh.hp = Math.min(stats.maxHp, sh.hp + stats.regen * dt);

  const sp = Math.hypot(sh.vx, sh.vy);
  if (sp > game.peakSpeed) game.peakSpeed = sp;
  recordTrail(sh, dt);
  const st = speedStage(sp);
  if (st > game.stage) {
    game.stage = st;
    game.events.push({ type: 'stage', stage: st, name: SPEED_STAGES[st - 1].name, speed: sp });
  } else if (game.stage > 0 && sp < SPEED_STAGES[game.stage - 1].v * 0.85) {
    game.stage = st;
  }

  if (sh.hp <= 0) end(game, 'lost', 'hp');
  else if (game.t >= CONFIG.runTime) end(game, 'lost', 'time');
}

function end(game, state, reason) {
  if (state === 'won') game.coins += CONFIG.escapeBonus;
  game.state = state;
  game.endReason = reason;
  game.events.push({ type: 'end', state, reason });
}

// ---- offers ----

// Picking up a module you already have upgrades it (+1, +15% effect each) instead of asking.
function absorbDuplicates(game) {
  while (game.offerQueue.length) {
    const o = game.offerQueue[0];
    const cur = game.loadout[o.slot];
    if (!cur || cur.id !== o.id) return;
    game.offerQueue.shift();
    cur.r = Math.max(cur.r, o.r);
    cur.plus = (cur.plus || 0) + 1;
    refreshStats(game);
    const sh = game.ship;
    addText(game, sh.x, sh.y - 46, `${moduleDef(cur.id).name} +${cur.plus}`, RARITIES[cur.r].color, 20);
    game.events.push({ type: 'upgrade', mod: cur });
  }
}

function pushOffer(game, mod, source) {
  game.lastOfferSlot = mod.slot;
  game.offerQueue.push({ ...mod, source });
  if (game.state === 'play' && !game.jump && !game.hyper.focus) {
    absorbDuplicates(game);
    if (game.offerQueue.length) openOffer(game);
  }
}

function openOffer(game) {
  const auto = game.debug.autoOffer;
  game.state = 'offer';
  game.currentOffer = game.offerQueue.shift();
  game.ship.charging = false;
  game.releasePending = null;
  game.events.push({ type: 'offer' });
  if (auto) while (game.state === 'offer') resolveOffer(game, auto === 'equip' || (auto === 'better' && isBetter(game, game.currentOffer)));
}

// ---- level-ups ----

function openLevelup(game) {
  game.state = 'levelup';
  game.levelChoices = rollLevelChoices(game);
  game.ship.charging = false;
  game.releasePending = null;
  game.events.push({ type: 'levelupOpen' });
  if (game.debug.autoOffer || game.debug.autoLevel) while (game.state === 'levelup') resolveLevelup(game, 0);
}

// Take choice i; further pending level-ups roll new choices right away.
function resolveLevelup(game, i) {
  const c = game.levelChoices?.[i];
  if (!c) return;
  applyLevelChoice(game, c);
  game.events.push({ type: 'levelupPick', choice: c });
  game.pendingLevelups = Math.max(0, game.pendingLevelups - 1);
  if (game.pendingLevelups > 0) game.levelChoices = rollLevelChoices(game);
  else { game.levelChoices = null; game.state = 'play'; }
}

function isBetter(game, mod) {
  const cur = game.loadout[mod.slot];
  return !cur || mod.r >= cur.r;
}

// accept: equip (the old module in that slot is thrown away); otherwise discard the offer.
function resolveOffer(game, accept) {
  const mod = game.currentOffer;
  if (!mod) return;
  if (accept) {
    game.loadout[mod.slot] = { id: mod.id, slot: mod.slot, r: mod.r, plus: 0 };
    refreshStats(game);
    game.events.push({ type: 'equip', mod });
  }
  absorbDuplicates(game);
  if (game.offerQueue.length) {
    game.currentOffer = game.offerQueue.shift();
  } else {
    game.currentOffer = null;
    game.state = 'play';
  }
}

function refreshStats(game) {
  const oldMax = game.stats.maxHp;
  game.stats = computeStats(game.meta, game.loadout, { cores: game.cores, level: game.level });
  const gain = game.stats.maxHp - oldMax;
  if (gain > 0) game.ship.hp += gain;
  game.ship.hp = Math.min(game.ship.hp, game.stats.maxHp);
}

// ---- hyperdrive (hyper scheme) ----
// Charges refill over time (up to hyperMaxCharges). Space opens hyperdrive: the world slows and each
// click jumps straight toward the clicked point, clamped to the reach circle. Jumps chain while charges last.

function createHyperState() {
  return { charges: CONFIG.hyperMaxCharges, progress: 0, focus: false, focusT: 0, queue: [], chain: 0, lines: [] };
}

// Charge cap: the base plus the spare-cell perk.
function hyperMaxCharges(game) {
  return CONFIG.hyperMaxCharges + perkLevel(game, 'extraCell');
}

function jumpPhase(game) {
  return game.jump ? 'jump' : game.portalDash ? `portal:${game.portalDash.phase}` : game.hyper.focus ? 'focus' : null;
}

// Jump reach: grows with max speed and range modules.
function hyperReach(game) {
  return CONFIG.hyperRadius * (game.stats.maxSpeed / CONFIG.baseMaxSpeed) * game.stats.rangeMult;
}

// Seconds per charge; charge-time stats (modules, levels) shorten it.
function hyperChargeTime(game) {
  return CONFIG.hyperChargeTime * (game.stats.chargeTime / CONFIG.chargeTime) * Math.pow(0.85, perkLevel(game, 'quickCell'));
}

function addHyperCharge(game, share) {
  const h = game.hyper;
  const max = hyperMaxCharges(game);
  if (h.charges >= max) { h.progress = 0; return; }
  h.progress += share;
  while (h.progress >= 1 && h.charges < max) {
    h.progress -= 1;
    h.charges++;
    game.events.push({ type: 'dashReady', charges: h.charges });
  }
  if (h.charges >= max) h.progress = 0;
}

// How far the wave from a jump reaches (the band drawn around it).
function waveRadius(game) {
  return CONFIG.waveRadius * game.stats.waveRadiusMult;
}

// A jump gives off a wave: enemies within reach take damage once per pass and are pushed away
// from the line. Sampled finely so long, fast jumps leave no gaps.
function waveAlong(game, r, x0, y0, x1, y1) {
  const W = waveRadius(game);
  const len = Math.hypot(x1 - x0, y1 - y0);
  const n = Math.max(1, Math.ceil(len / Math.min(W, 40)));
  const dmg = attackPower(r.speed, game.stats) * (r.power || 1) * CONFIG.waveDamage * game.stats.waveDmgMult;
  for (let k = 1; k <= n; k++) {
    const px = x0 + (x1 - x0) * k / n, py = y0 + (y1 - y0) * k / n;
    for (const [id, e] of r.waveInside) {
      if (e.dead || Math.hypot(px - e.x, py - e.y) > e.r + W + 2) r.waveInside.delete(id);
    }
    queryGrid(game.grid, px - W - MAX_ENEMY_R, py - W - MAX_ENEMY_R, px + W + MAX_ENEMY_R, py + W + MAX_ENEMY_R, (e) => {
      if (r.waveInside.has(e.id)) return;
      const d = Math.hypot(e.x - px, e.y - py);
      if (d > e.r + W) return;
      r.waveInside.set(e.id, e);
      damageEnemy(game, e, dmg, { cause: 'wave', dirX: (e.x - px) / (d || 1), dirY: (e.y - py) / (d || 1), knock: 260, impactX: px, impactY: py });
    });
    if (game.state === 'finishing') return;
    r.waveAcc += len / n;
    if (r.waveAcc >= 45) { r.waveAcc = 0; addRing(game, px, py, W, 'rgba(130,225,255,0.9)', 0.35); }
  }
}

// World speed during a jump: the faster the jump, the slower everything else.
function jumpWorldScale(game) {
  return Math.max(CONFIG.dashScaleMin, Math.min(1, CONFIG.dashSlowRef / Math.max(1, game.jump.speed)));
}

function hyperWorldScale(game) {
  let s = 1;
  if (game.hyper.focus) s = CONFIG.hyperFocusScale;
  if (game.jump) s = Math.min(s, jumpWorldScale(game));
  return s;
}

// Charges, the mode toggle and clicks; runs every frame on real time.
function updateHyper(game, input, frameDt) {
  if (!isHyperScheme(game.scheme)) return;
  const h = game.hyper;
  // charges refill on play time (they crawl with the world while it is slowed)
  addHyperCharge(game, frameDt * game.timeScale / hyperChargeTime(game));
  if (input.hyperToggle) {
    if (h.focus) closeHyper(game);
    else if (h.charges >= 1 || game.jump) openHyper(game);
  } else if (input.hyperExit && h.focus) closeHyper(game);
  if (!h.focus) return;
  if (!game.jump) h.focusT += frameDt;
  // clicks made during a jump (or several in one frame) wait their turn, as many as there are charges
  for (const c of input.jumpClicks || []) if (h.queue.length < h.charges) h.queue.push({ x: c.x, y: c.y });
  while (!game.jump && h.queue.length) startJump(game, h.queue.shift());
  if (!game.jump && (h.charges < 1 || (CONFIG.hyperFocusMax > 0 && h.focusT >= CONFIG.hyperFocusMax))) closeHyper(game);
}

function openHyper(game) {
  const h = game.hyper;
  h.focus = true; h.focusT = 0; h.queue = []; h.chain = 0; h.lines = [];
  game.ship.charging = false;
  game.events.push({ type: 'hyperOpen' });
}

function closeHyper(game) {
  const h = game.hyper;
  if (!h.focus) return;
  h.focus = false; h.queue = [];
  game.events.push({ type: 'hyperClose' });
}

// Where a jump from the ship toward c ends: clamped to the reach circle, stopped short of planets.
function jumpTarget(game, c) {
  const sh = game.ship;
  let dx = c.x - sh.x, dy = c.y - sh.y;
  let len = Math.hypot(dx, dy);
  if (len < 1) { dx = sh.hx; dy = sh.hy; len = 1; }
  const ux = dx / len, uy = dy / len;
  let L = Math.min(len, hyperReach(game));
  const R = CONFIG.shipRadius;
  let blocked = false;
  for (const b of [game.field.planet, ...game.field.moons]) {
    const t = segCircleT(sh.x, sh.y, sh.x + ux * L, sh.y + uy * L, b.x, b.y, b.r + R);
    if (t >= 0) { L = Math.max(0, t * L - 2); blocked = true; }
  }
  return { x: sh.x + ux * L, y: sh.y + uy * L, ux, uy, len: L, blocked };
}

function startJump(game, c) {
  const h = game.hyper, sh = game.ship;
  if (h.charges < 1) return false;
  const tgt = jumpTarget(game, c);
  if (tgt.len < 4) return false;
  // full-charge perk: a jump from a full stock never bounces and hits harder
  const full = perkLevel(game, 'fullCharge') && h.charges >= hyperMaxCharges(game);
  h.charges--;
  h.chain++;
  onLaunch(game);
  const v = launchVelocity(sh.vx, sh.vy, tgt.ux, tgt.uy, game.stats.gaugeMax, game.stats);
  let speed = Math.max(Math.hypot(v.vx, v.vy), 1);
  // slipstream module: consecutive jumps in about the same direction (soon after the last one ends)
  // ramp the speed up step by step; the floor is max speed x (1 + boost x steps), so it never compounds
  const st = h.streak;
  const same = st && game.portalClock - st.at <= CONFIG.streakWindow &&
    st.ux * tgt.ux + st.uy * tgt.uy >= Math.cos(CONFIG.streakAngle * Math.PI / 180);
  h.streak = { n: same ? Math.min(CONFIG.streakMax, st.n + 1) : 0, ux: tgt.ux, uy: tgt.uy, at: game.portalClock };
  if (game.stats.streakBoost && h.streak.n) {
    const mult = 1 + game.stats.streakBoost * h.streak.n;
    speed = Math.max(speed, game.stats.maxSpeed * Math.max(1, game.stats.gaugeMax) * mult);
    addText(game, sh.x, sh.y - 36, `加速 ×${mult.toFixed(2)}`, '#9fe8ff', 16 + 2 * h.streak.n);
  }
  sh.vx = tgt.ux * speed; sh.vy = tgt.uy * speed;
  sh.boostT = game.stats.boostDuration; sh.fadeT = 0; sh.gaugeBank = 0;
  sh.aimAngle = Math.atan2(tgt.uy, tgt.ux);
  game.dashId++;
  // speed = the jump speed (attack, momentum afterwards); rate = how fast it crosses on screen
  const rate = Math.max(speed, tgt.len * game.stats.traceSpeedMult / CONFIG.hyperJumpTime);
  const from = { x: sh.x, y: sh.y }, to = { x: tgt.x, y: tgt.y };
  game.jump = { from, to, ux: tgt.ux, uy: tgt.uy, len: tgt.len, pos: 0,
    speed, rate, inside: new Map(), passes: new Map(), waveInside: new Map(), waveAcc: 0,
    chain: h.chain, overdrive: !!full, power: full ? fullChargePower(perkLevel(game, 'fullCharge')) : 1,
    crossings: perkLevel(game, 'crossBlast') ? lineCrossings(h.lines, from, to) : [] };
  if (h.focus) h.lines.push({ a: from, b: to });
  game.events.push({ type: 'launch', gauge: game.stats.gaugeMax, x: sh.x, y: sh.y, dx: tgt.ux, dy: tgt.uy });
  return true;
}

// Cross the jump quickly on real time; piercing costs no speed, a bounce ends it.
function runJump(game, realDt) {
  const j = game.jump, sh = game.ship;
  const R = CONFIG.shipRadius;
  const move = Math.min(j.rate * realDt, j.len - j.pos);
  if (move > 1e-9) {
    const x0 = sh.x, y0 = sh.y;
    for (const [id, e] of j.inside) {
      if (e.dead || Math.hypot(x0 - e.x, y0 - e.y) > e.r + R + 2) j.inside.delete(id);
    }
    j.pos += move;
    sh.x = j.from.x + j.ux * j.pos; sh.y = j.from.y + j.uy * j.pos;
    sh.vx = j.ux * j.speed; sh.vy = j.uy * j.speed;
    game.dashPeakAtk = Math.max(game.dashPeakAtk, attackPower(j.speed, game.stats));
    waveAlong(game, j, x0, y0, sh.x, sh.y);
    if (game.state !== 'play') return;
    if (collideEnemies(game, x0, y0, R, j)) { game.jump = null; game.hyper.streak = null; endJump(game, j); endTraceAttack(game); return; }
    if (game.state !== 'play') return;
  }
  if (j.pos >= j.len - 1e-9) {
    game.jump = null;
    endJump(game, j);
    // keep part of the jump speed, then the normal slowdown takes over
    sh.vx = j.ux * j.speed * CONFIG.hyperKeep; sh.vy = j.uy * j.speed * CONFIG.hyperKeep;
    sh.boostT = CONFIG.hyperCoast; sh.fadeT = 0;
    endTraceAttack(game); // route-end modules (end blast, finish pulse) go off where the jump lands
  }
}

// Where a new jump line crosses earlier ones from this hyperdrive (not at the shared endpoints).
function lineCrossings(lines, p, q) {
  const out = [];
  for (const { a, b } of lines) {
    const rx = q.x - p.x, ry = q.y - p.y, sx = b.x - a.x, sy = b.y - a.y;
    const den = rx * sy - ry * sx;
    if (Math.abs(den) < 1e-9) continue;
    const t = ((a.x - p.x) * sy - (a.y - p.y) * sx) / den;
    const u = ((a.x - p.x) * ry - (a.y - p.y) * rx) / den;
    if (t > 0.02 && t < 0.98 && u > 0.02 && u < 0.98) out.push({ x: p.x + rx * t, y: p.y + ry * t });
  }
  return out;
}

// Perks that go off when a jump ends (landing or bouncing).
function endJump(game, j) {
  const sh = game.ship;
  if (game.hyper.streak) game.hyper.streak.at = game.portalClock; // the streak window counts from the landing
  const atk = attackPower(j.speed, game.stats) * j.power;
  const chainN = perkLevel(game, 'chainBlast');
  if (chainN && j.chain % 3 === 0) {
    explode(game, sh.x, sh.y, perkBlastRadius(chainN), atk * perkBlastMult(chainN), { cause: 'chainBlast', color: '#ff9f40', knock: 520, life: 0.5 });
    addText(game, sh.x, sh.y - 40, '連鎖爆発', '#ffb340', 20);
  }
  const crossN = perkLevel(game, 'crossBlast');
  for (const c of j.crossings) {
    explode(game, c.x, c.y, 120 + 25 * crossN, atk * (0.8 + 0.4 * crossN), { cause: 'crossBlast', color: '#c995ff', knock: 420, life: 0.45 });
  }
  const vortexN = perkLevel(game, 'vortex');
  if (vortexN) game.vortices.push({ x: sh.x, y: sh.y, r: vortexRadius(vortexN), life: vortexLife(vortexN), max: vortexLife(vortexN) });
}

// Vortices left by jumps pull nearby enemies (not the boss) toward their centre.
function updateVortices(game, dt) {
  if (!game.vortices.length) return;
  for (const v of game.vortices) {
    v.life -= dt;
    queryGrid(game.grid, v.x - v.r - MAX_ENEMY_R, v.y - v.r - MAX_ENEMY_R, v.x + v.r + MAX_ENEMY_R, v.y + v.r + MAX_ENEMY_R, (e) => {
      if (e.dead || e.type === 'boss') return;
      const dx = v.x - e.x, dy = v.y - e.y, d = Math.hypot(dx, dy);
      if (d > v.r || d < 8) return;
      const pull = Math.min(d, 420 * dt / Math.max(1, e.r / 20));
      e.x += dx / d * pull; e.y += dy / d * pull;
    });
  }
  game.vortices = game.vortices.filter((v) => v.life > 0);
}

// After a jump the kept speed fades back toward cruise speed, so the ship slows down over time.
function hyperSlowdown(game, dt) {
  const sh = game.ship;
  if (sh.boostT > 0) return;
  const sp = Math.hypot(sh.vx, sh.vy);
  const cruise = game.stats.maxSpeed * CONFIG.steerCruise;
  if (sp <= cruise) return;
  const k = (cruise + (sp - cruise) * Math.exp(-CONFIG.hyperDecay * dt)) / sp;
  sh.vx *= k; sh.vy *= k;
}

// Preview of a straight jump: enemies it would cut (body or wave) and the first one that would stop it.
function previewPath(game, points) {
  if (!points || points.length < 2) return { samples: [], block: null, targets: [] };
  const pts = points, sh = game.ship, R = CONFIG.shipRadius, W = waveRadius(game);
  const l = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y) || 1;
  const v = launchVelocity(sh.vx, sh.vy, (pts[1].x - pts[0].x) / l, (pts[1].y - pts[0].y) / l, game.stats.gaugeMax, game.stats);
  const atk = attackPower(Math.hypot(v.vx, v.vy), game.stats);
  const samples = [];
  const targets = new Map(); // enemy -> { crit, hits }
  let prev = new Set();
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    const n = Math.max(1, Math.ceil(len / 14));
    for (let k = 1; k <= n; k++) {
      const p = { x: a.x + (b.x - a.x) * k / n, y: a.y + (b.y - a.y) * k / n, hot: false };
      let blocked = false;
      const cur = new Set();
      queryGrid(game.grid, p.x - W - MAX_ENEMY_R, p.y - W - MAX_ENEMY_R, p.x + W + MAX_ENEMY_R, p.y + W + MAX_ENEMY_R, (e) => {
        const d2 = (p.x - e.x) ** 2 + (p.y - e.y) ** 2;
        if (d2 > (e.r + W) ** 2) return;
        const t = targets.get(e) || { crit: false, body: false };
        targets.set(e, t);
        if (d2 > (e.r + R) ** 2) return; // wave only
        cur.add(e);
        if (prev.has(e)) return; // still inside from the previous sample: same pass
        const crit = isWeakHit(e, p.x, p.y, game.stats.weakArcMult);
        if (crit) p.hot = true;
        if (!canPierce(atk, e, crit)) { blocked = true; return; }
        t.body = true; t.crit = t.crit || crit;
      });
      prev = cur;
      samples.push(p);
      if (blocked) return { samples, block: p, targets: [...targets] };
    }
  }
  return { samples, block: null, targets: [...targets] };
}

// ---- ship ----

function launch(game, ax, ay) {
  const sh = game.ship;
  const len = Math.hypot(ax, ay);
  let dx, dy;
  if (len < CONFIG.minDrag) {
    dx = sh.hx; dy = sh.hy;
  } else {
    dx = ax / len; dy = ay / len;
  }
  onLaunch(game);
  sh.aimAngle = Math.atan2(dy, dx);
  const v = launchVelocity(sh.vx, sh.vy, dx, dy, sh.gauge, game.stats);
  sh.vx = v.vx; sh.vy = v.vy;
  sh.boostT = game.stats.boostDuration;
  sh.fadeT = 0;
  sh.gaugeBank = 0;
  game.dashId++;
  game.events.push({ type: 'launch', gauge: sh.gauge, x: sh.x, y: sh.y, dx, dy });
}

// amount: hp lost, slow: share of speed lost (0..1)
function damageShip(game, amount, slow, cause = 'other') {
  const sh = game.ship;
  if (game.state === 'finishing' || sh.invulnT > 0 || game.debug.invincible) return false;
  sh.hp -= amount * game.stats.damageTakenMult;
  const k = 1 - Math.min(0.9, slow * game.stats.hitSlowMult);
  sh.vx *= k; sh.vy *= k;
  sh.invulnT = CONFIG.invulnTime;
  game.events.push({ type: 'hurt', amount: amount * game.stats.damageTakenMult, x: sh.x, y: sh.y, cause });
  addText(game, sh.x, sh.y - 30, `-${Math.round(amount * game.stats.damageTakenMult)}`, '#ff6b5a');
  onShipHurt(game);
  return true;
}

// R: hit radius of the ship.
// run: the jump state; during a jump an enemy can be hit again each time the ship re-enters it.
function collideEnemies(game, x0, y0, R = CONFIG.shipRadius, run = null) {
  const sh = game.ship, stats = game.stats;
  const x1 = sh.x, y1 = sh.y;
  const pad = R + MAX_ENEMY_R;
  const hits = [];
  queryGrid(game.grid, Math.min(x0, x1) - pad, Math.min(y0, y1) - pad, Math.max(x0, x1) + pad, Math.max(y0, y1) + pad, (e) => {
    if (run ? run.inside.has(e.id) : e.hitCD > 0) return;
    const t = segCircleT(x0, y0, x1, y1, e.x, e.y, e.r + R);
    if (t >= 0) hits.push({ e, t });
  });
  if (!hits.length) return false;
  hits.sort((a, b) => a.t - b.t);
  for (const { e, t } of hits) {
    const hx = x0 + (x1 - x0) * t, hy = y0 + (y1 - y0) * t;
    const sp = Math.hypot(sh.vx, sh.vy);
    const ux = sp > 0 ? sh.vx / sp : 0, uy = sp > 0 ? sh.vy / sp : 0;
    const atk = attackPower(sp, stats) * (run?.power || 1);
    const crit = isWeakHit(e, hx, hy, stats.weakArcMult);
    let res = resolveRam(atk, e, crit, stats);
    if (run?.overdrive && !res.pierce) res = { pierce: true, damage: atk * (crit ? stats.critMult : 1), shipDamage: 0 };
    if (res.pierce) {
      damageEnemy(game, e, res.damage, { crit, cause: 'ram', dirX: ux, dirY: uy, impactX: hx, impactY: hy });
      if (game.state === 'finishing') return false;
      if (crit) {
        const len = Math.hypot(hx - e.x, hy - e.y) || 1;
        addCombatImpact(game, e, 'weak', (hx - e.x) / len, (hy - e.y) / len);
      }
      e.hitCD = 0.3;
      if (run) {
        run.inside.set(e.id, e);
        const n = (run.passes.get(e.id) || 0) + 1;
        run.passes.set(e.id, n);
        if (n > 1) addText(game, e.x + e.r, e.y - e.r - 16, `×${n}`, crit ? '#ffe46b' : '#ffffff', 22 + 4 * Math.min(n, 5));
      }
      const keep = game.jump ? 1 : pierceKeep(e, e.dead, stats);
      sh.vx *= keep; sh.vy *= keep;
      game.dashPierce++;
      onPierce(game, hx, hy);
      if (game.state === 'finishing') return false;
      if (e.T.steal) { const k = 1 - e.T.steal * stats.hitSlowMult; sh.vx *= k; sh.vy *= k; game.events.push({ type: 'drain', x: e.x, y: e.y }); }
      if (crit) game.hitstop = Math.max(game.hitstop, e.dead ? 0.05 : 0.035);
      continue;
    }
    // bounce off
    let nx = hx - e.x, ny = hy - e.y;
    const nd = Math.hypot(nx, ny) || 1;
    nx /= nd; ny /= nd;
    addCombatImpact(game, e, 'block', nx, ny);
    sh.x = e.x + nx * (e.r + R + 1);
    sh.y = e.y + ny * (e.r + R + 1);
    const vn = sh.vx * nx + sh.vy * ny;
    if (vn < 0) { sh.vx -= 2 * vn * nx; sh.vy -= 2 * vn * ny; }
    sh.vx *= stats.bounceKeep; sh.vy *= stats.bounceKeep;
    if (Math.hypot(sh.vx, sh.vy) < 220) { sh.vx = nx * 220; sh.vy = ny * 220; }
    if (!stats.reflect) sh.boostT = 0;
    damageEnemy(game, e, res.damage, { crit, cause: 'bump', dirX: -nx, dirY: -ny });
    e.hitCD = 0.25;
    damageShip(game, res.shipDamage * stats.bounceDamageMult, 0, `bump:${e.type}`);
    game.events.push({ type: 'bounce', x: sh.x, y: sh.y });
    return true;
  }
  return false;
}

function collideBodies(game) {
  const sh = game.ship;
  const R = CONFIG.shipRadius;
  const f = game.field;
  const restitution = game.stats.reflect ? 0.9 : CONFIG.crashRestitution;
  for (const b of [f.planet, ...f.moons]) {
    const dx = sh.x - b.x, dy = sh.y - b.y;
    const d = Math.hypot(dx, dy);
    const min = b.r + R;
    if (d >= min || d === 0) continue;
    const nx = dx / d, ny = dy / d;
    sh.x = b.x + nx * min;
    sh.y = b.y + ny * min;
    const vn = sh.vx * nx + sh.vy * ny;
    if (vn < 0) {
      sh.vx -= (1 + restitution) * vn * nx;
      sh.vy -= (1 + restitution) * vn * ny;
      const dmg = Math.max(0, -vn - 200) * CONFIG.crashDamage * game.stats.bounceDamageMult;
      if (dmg > 0) damageShip(game, dmg, 0, b === f.planet ? 'planet' : 'moon');
      game.events.push({ type: 'crash', x: sh.x, y: sh.y, power: -vn });
    }
  }
  // hard wall well outside the soft boundary
  const r = Math.hypot(sh.x, sh.y);
  const wall = CONFIG.fieldRadius + 500;
  if (r > wall) {
    const nx = sh.x / r, ny = sh.y / r;
    sh.x = nx * wall; sh.y = ny * wall;
    const vn = sh.vx * nx + sh.vy * ny;
    if (vn > 0) { sh.vx -= 2 * vn * nx; sh.vy -= 2 * vn * ny; }
  }
}

function recordTrail(sh, dt) {
  sh.trailAcc += dt;
  if (sh.trailAcc < 1 / 60) return;
  sh.trailAcc = 0;
  sh.trail.push({ x: sh.x, y: sh.y });
  if (sh.trail.length > 150) sh.trail.shift();
}

// ---- enemies ----

function flushNewEnemies(game) {
  if (!game.newEnemies.length) return;
  const limit = Math.ceil(phaseTarget(game.t).pop * (1 + CONFIG.enemySplitOverflow));
  let population = 0;
  for (const e of game.enemies) if (!e.dead && e.type !== 'meteor' && e.type !== 'boss') population++;
  for (const e of game.newEnemies) {
    if (population >= limit) break;
    game.enemies.push(e);
    population++;
  }
  game.newEnemies.length = 0;
}

function separateEnemies(game) {
  for (let pass = 0; pass < 2; pass++) {
    const grid = buildGrid(game.enemies, 120);
    for (const e of game.enemies) {
      if (e.dead) continue;
      const reach = e.r + MAX_ENEMY_R + CONFIG.enemySpacing;
      queryGrid(grid, e.x - reach, e.y - reach, e.x + reach, e.y + reach, (o) => {
        if (o.id <= e.id) return;
        let dx = o.x - e.x, dy = o.y - e.y;
        const min = e.r + o.r + CONFIG.enemySpacing;
        const d2 = dx * dx + dy * dy;
        if (d2 >= min * min) return;
        const d = Math.sqrt(d2);
        if (d < 1e-6) {
          const a = (e.id + o.id) * 2.39996322973;
          dx = Math.cos(a); dy = Math.sin(a);
        } else { dx /= d; dy /= d; }
        const push = (min - d) * 0.5;
        const wE = o.r * o.r / (e.r * e.r + o.r * o.r);
        e.x -= dx * push * 2 * wE; e.y -= dy * push * 2 * wE;
        o.x += dx * push * 2 * (1 - wE); o.y += dy * push * 2 * (1 - wE);
        // Position correction alone lets the rear ranks drive back into the same packed mass.
        // Cancel only their closing velocity; sideways and separating movement stay available.
        const closing = (o.vx - e.vx) * dx + (o.vy - e.vy) * dy;
        if (closing < 0) {
          e.vx += dx * closing * wE; e.vy += dy * closing * wE;
          o.vx -= dx * closing * (1 - wE); o.vy -= dy * closing * (1 - wE);
        }
      });
    }
  }
}

// ---- pickups ----

function updateGems(game, dt) {
  const sh = game.ship;
  const pr = game.stats.pickupRadius;
  const sp = Math.hypot(sh.vx, sh.vy);
  for (const g of game.gems) {
    g.age += dt;
    const dx = sh.x - g.x, dy = sh.y - g.y;
    const d = Math.hypot(dx, dy);
    if (d < pr || g.pulled) {
      g.pulled = true;
      const pull = 700 + sp * 1.2;
      g.x += (dx / (d || 1)) * pull * dt;
      g.y += (dy / (d || 1)) * pull * dt;
    }
    if (d < CONFIG.shipRadius + 14) { g.taken = true; addXp(game, g.v); }
  }
  if (game.gems.some((g) => g.taken)) game.gems = game.gems.filter((g) => !g.taken);
  for (const c of game.coinDrops) {
    const dx = sh.x - c.x, dy = sh.y - c.y;
    const d = Math.hypot(dx, dy);
    if (d < pr * 1.3 || c.pulled) {
      c.pulled = true;
      const pull = 700 + sp * 1.2;
      c.x += (dx / (d || 1)) * pull * dt;
      c.y += (dy / (d || 1)) * pull * dt;
    }
    if (d < CONFIG.shipRadius + 14) { c.taken = true; game.coins += c.v; game.events.push({ type: 'coin' }); }
  }
  if (game.coinDrops.some((c) => c.taken)) game.coinDrops = game.coinDrops.filter((c) => !c.taken);
}

function addXp(game, v) {
  game.xp += v;
  let need = xpForLevel(game.level);
  while (game.xp >= need) {
    game.xp -= need;
    game.level++;
    game.pendingLevelups++;
    game.ship.hp = Math.min(game.stats.maxHp, game.ship.hp + game.stats.maxHp * CONFIG.levelHeal);
    game.events.push({ type: 'levelup', level: game.level });
    need = xpForLevel(game.level);
    refreshStats(game); // level-ups raise base stats; modules come from enemy drops
    addText(game, game.ship.x, game.ship.y - 34, `Lv ${game.level}`, '#6dffb0', 18);
  }
}

// ---- fx ----

function updateFx(game, dt) {
  const P = game.fx.particles;
  for (const p of P) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - 2.5 * dt; p.vy *= 1 - 2.5 * dt; p.life -= dt; if (p.spin) p.angle += p.spin * dt; }
  game.fx.particles = P.filter((p) => p.life > 0);
  for (const t of game.fx.texts) { t.y -= 40 * dt; t.life -= dt; }
  for (const g of game.fx.ghosts) g.life -= dt;
  game.fx.ghosts = game.fx.ghosts.filter((g) => g.life > 0);
  game.fx.texts = game.fx.texts.filter((t) => t.life > 0);
  for (const r of game.fx.rings) r.life -= dt;
  game.fx.rings = game.fx.rings.filter((r) => r.life > 0);
  for (const loop of game.fx.loops) loop.life -= dt;
  game.fx.loops = game.fx.loops.filter((loop) => loop.life > 0);
  for (const impact of game.fx.impacts) impact.life -= dt;
  game.fx.impacts = game.fx.impacts.filter((impact) => impact.life > 0);
}

// ---- prediction ----

// Ballistic preview of a launch along (dx, dy) with the given gauge, under gravity only.
function predictPath(game, dx, dy, gauge, seconds) {
  const sh = game.ship;
  const len = Math.hypot(dx, dy) || 1;
  const v = launchVelocity(sh.vx, sh.vy, dx / len, dy / len, gauge, game.stats);
  return simulateFrom(game, { x: sh.x, y: sh.y, vx: v.vx, vy: v.vy, boostT: game.stats.boostDuration, fadeT: 0 }, 0, seconds);
}

function simulateFrom(game, ghost, t0, seconds) {
  const pts = [];
  const h = 1 / 60;
  const field = { ...game.field, moons: game.field.moons.map((m) => ({ ...m })) };
  for (let t = t0; t < seconds; t += h) {
    updateMoons(field, game.t + t);
    const g = gravityAt(field, game.t + t, ghost.x, ghost.y);
    stepShip(ghost, game.stats, h, g.ax, g.ay, 0);
    const p = { x: ghost.x, y: ghost.y, sp: Math.hypot(ghost.vx, ghost.vy), t, vx: ghost.vx, vy: ghost.vy };
    pts.push(p);
    if (hitsBody(field, p.x, p.y)) { p.block = true; break; }
  }
  return pts;
}

function hitsBody(field, x, y) {
  const R = CONFIG.shipRadius;
  for (const b of [field.planet, ...field.moons]) {
    if ((x - b.x) ** 2 + (y - b.y) ** 2 < (b.r + R) ** 2) return true;
  }
  return false;
}

// Marks predicted points that cross a weak spot (hot) and stops at the first enemy that would block.
// With the bounce-preview radar the path continues past the block.
function annotatePrediction(game, pts, seconds) {
  const R = CONFIG.shipRadius;
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    let blocker = null;
    queryGrid(game.grid, p.x - R - MAX_ENEMY_R, p.y - R - MAX_ENEMY_R, p.x + R + MAX_ENEMY_R, p.y + R + MAX_ENEMY_R, (e) => {
      const dx = p.x - e.x, dy = p.y - e.y;
      const rr = e.r + R;
      if (dx * dx + dy * dy > rr * rr) return;
      const crit = isWeakHit(e, p.x, p.y, game.stats.weakArcMult);
      if (crit) p.hot = true;
      if (!canPierce(attackPower(p.sp, game.stats), e, crit)) blocker = e;
    });
    out.push(p);
    if (p.block) break;
    if (blocker) {
      p.block = true;
      if (game.stats.predictBounce && seconds) {
        let nx = p.x - blocker.x, ny = p.y - blocker.y;
        const nd = Math.hypot(nx, ny) || 1;
        nx /= nd; ny /= nd;
        let vx = p.vx, vy = p.vy;
        const vn = vx * nx + vy * ny;
        if (vn < 0) { vx -= 2 * vn * nx; vy -= 2 * vn * ny; }
        vx *= game.stats.bounceKeep; vy *= game.stats.bounceKeep;
        const ghost = { x: blocker.x + nx * (blocker.r + R + 1), y: blocker.y + ny * (blocker.r + R + 1), vx, vy, boostT: 0, fadeT: 0 };
        for (const q of simulateFrom(game, ghost, p.t, seconds)) { q.bounced = true; out.push(q); }
      }
      break;
    }
  }
  return out;
}

// ---- effects.js ----

// Module effects that change how the ship attacks, plus field capsules and power cores.










function createEffectState() {
  return {
    fbullets: [], marks: [], mines: [], capsules: [],
    fx2: { waveT: 0, trailDist: 0, lastX: 0, lastY: 0, mineT: 0, turretT: 0, sonicCD: 0, prevSpeed: 0, capsuleT: 0, coreT: 0, coresStarted: false },
    dashActive: false, dashPeakAtk: 0, traceEndHandled: false,
  };
}

function onLaunch(game) {
  if (game.dashActive) finishDash(game);
  game.traceEndHandled = false;
  game.dashActive = true;
  game.dashPeakAtk = 0;
  game.dashPierce = 0;
  game.dashStop = 0;
}

function finishDash(game) {
  game.dashActive = false;
  const eb = game.stats.endBlast;
  if (eb && game.dashPierce >= eb.min) {
    const sh = game.ship;
    explode(game, sh.x, sh.y, eb.radius, game.dashPeakAtk * eb.mult, { cause: 'endBlast', color: '#ff9f40', knock: 500, life: 0.5 });
  }
}

function endTraceAttack(game) {
  game.traceEndHandled = true;
  finishDash(game);
  const pulse = game.stats.traceEndBlast, sh = game.ship;
  if (pulse && game.state === 'play') explode(game, sh.x, sh.y, pulse.radius,
    attackPower(Math.hypot(sh.vx, sh.vy), game.stats) * pulse.mult,
    { cause: 'traceEnd', color: '#c46bff', knock: 500, life: 0.5 });
}

function onPierce(game, x = game.ship.x, y = game.ship.y) {
  const s = game.stats, sh = game.ship;
  if (s.regenGauge) sh.gaugeBank = Math.min(s.gaugeMax, sh.gaugeBank + s.regenGauge);
  if (s.pierceWave) explode(game, x, y, s.pierceWave.radius,
    attackPower(Math.hypot(sh.vx, sh.vy), s) * s.pierceWave.mult,
    { cause: 'pierceWave', color: '#9fe8ff', knock: 350, life: 0.3 });
}

function onShipHurt(game) {
  const s = game.stats, sh = game.ship;
  if (s.reactive) explode(game, sh.x, sh.y, 260, attackPower(s.maxSpeed, s) * s.reactive, { cause: 'reactive', color: '#ff6b5a', knock: 450 });
}

function updateEffects(game, dt) {
  const sh = game.ship, s = game.stats, F = game.fx2;
  const sp = Math.hypot(sh.vx, sh.vy);
  const atkNow = attackPower(sp, s);
  const atkMax = attackPower(s.maxSpeed, s);

  // dash bookkeeping (end-of-dash blast)
  if (sh.boostT > 0 && !game.dashActive && !game.traceEndHandled) { game.dashActive = true; game.dashPeakAtk = 0; }
  if (game.dashActive) {
    game.dashPeakAtk = Math.max(game.dashPeakAtk, atkNow);
    if (sh.boostT <= 0 && !game.portalDash && !game.jump) finishDash(game);
  }

  // charge shockwave
  if (s.chargeWave && sh.charging) {
    F.waveT += dt;
    if (F.waveT >= 0.5) {
      F.waveT = 0;
      explode(game, sh.x, sh.y, s.chargeWave.radius, atkMax * s.chargeWave.mult, { cause: 'chargeWave', color: '#5fd8ff', knock: 350 });
    }
  } else {
    F.waveT = 0.25;
  }

  // trail burst marks
  if (s.trailBurst && sh.boostT > 0 && sp > 200 && !game.portalDash) {
    F.trailDist += sp * dt;
    if (F.trailDist >= 45) {
      F.trailDist = 0;
      game.marks.push({ x: sh.x, y: sh.y, t: 0.55, dmg: atkNow * s.trailBurst });
    }
  }
  for (const m of game.marks) {
    m.t -= dt;
    if (m.t <= 0) explode(game, m.x, m.y, 85, m.dmg, { cause: 'trail', color: '#ffcf6b', knock: 120, life: 0.25 });
  }
  if (game.marks.length) game.marks = game.marks.filter((m) => m.t > 0);

  // mines
  if (s.mines && sp > 0.6 * s.maxSpeed) {
    F.mineT += dt;
    if (F.mineT >= 0.2) {
      F.mineT = 0;
      game.mines.push({ x: sh.x, y: sh.y, life: 5, armed: 0.3, dmg: atkMax * s.mines });
    }
  }
  for (const m of game.mines) {
    m.life -= dt; m.armed -= dt;
    if (m.armed > 0) continue;
    for (const e of game.enemies) {
      if (e.dead) continue;
      const rr = 70 + e.r;
      if ((e.x - m.x) ** 2 + (e.y - m.y) ** 2 < rr * rr) {
        explode(game, m.x, m.y, 120, m.dmg, { cause: 'mine', color: '#ff7b54', knock: 300, life: 0.3 });
        m.life = 0;
        break;
      }
    }
  }
  if (game.mines.length) game.mines = game.mines.filter((m) => m.life > 0);

  // auto turret
  if (s.turret) {
    F.turretT += dt;
    if (F.turretT >= 1 / (1.6 * s.turret)) {
      let best = null, bd = 650 * 650;
      for (const e of game.enemies) {
        if (e.dead) continue;
        const d = (e.x - sh.x) ** 2 + (e.y - sh.y) ** 2;
        if (d < bd) { bd = d; best = e; }
      }
      if (best) {
        F.turretT = 0;
        const a = Math.atan2(best.y - sh.y, best.x - sh.x);
        game.fbullets.push({ kind: 'shot', x: sh.x, y: sh.y, vx: Math.cos(a) * 1300 + sh.vx * 0.5, vy: Math.sin(a) * 1300 + sh.vy * 0.5, r: 6, dmg: atkMax * 0.22, life: 0.8, pierce: false, hit: new Set(), color: '#9fe8ff' });
        game.events.push({ type: 'turret' });
      }
    }
  }
  updateFriendly(game, dt);

  // sonic boom on crossing 92% of max speed
  F.sonicCD -= dt;
  const thr = 0.92 * s.maxSpeed;
  if (s.sonic && F.sonicCD <= 0 && F.prevSpeed < thr && sp >= thr) {
    F.sonicCD = 2.5;
    explode(game, sh.x, sh.y, s.sonic.radius, atkMax * s.sonic.mult, { cause: 'sonic', color: '#ffffff', knock: 900, life: 0.7 });
    game.events.push({ type: 'sonic', x: sh.x, y: sh.y, radius: s.sonic.radius });
    game.slowmo = 0.45;
  }
  if (sp >= thr && F.prevSpeed < thr) game.events.push({ type: 'barrier', x: sh.x, y: sh.y });
  F.prevSpeed = sp;

  updateCapsules(game, dt);
}

function updateFriendly(game, dt) {
  const B = game.fbullets;
  if (!B.length) return;
  for (const b of B) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;
    const pad = b.r + 130;
    queryGrid(game.grid, b.x - pad, b.y - pad, b.x + pad, b.y + pad, (e) => {
      if (b.life <= 0 || b.hit.has(e.id)) return;
      const rr = b.r + e.r;
      if ((e.x - b.x) ** 2 + (e.y - b.y) ** 2 > rr * rr) return;
      b.hit.add(e.id);
      const sp = Math.hypot(b.vx, b.vy) || 1;
      damageEnemy(game, e, b.dmg, { cause: b.kind, dirX: b.vx / sp, dirY: b.vy / sp, knock: 250 });
      if (b.pierceLeft > 0) b.pierceLeft--;
      else if (!b.pierce) b.life = 0;
    });
  }
  game.fbullets = B.filter((b) => b.life > 0);
}

function fieldCapsulePoint(game) {
  const rng = game.rng;
  if (isHyperScheme(game.scheme)) {
    // Put build opportunities within reach of the current fight, rather than across the whole map.
    const distance = Math.max(200, game.viewRadius * (0.25 + rng() * 0.3));
    for (let i = 0; i < 16; i++) {
      const a = rng() * TAU;
      const x = game.ship.x + Math.cos(a) * distance, y = game.ship.y + Math.sin(a) * distance;
      const r = Math.hypot(x, y);
      if (r > CONFIG.planetRadius + 100 && r < CONFIG.fieldRadius - 100) return { x, y, r };
    }
  }
  const roll = rng();
  let r;
  if (roll < 0.4) r = randRange(rng, CONFIG.planetRadius + 200, CONFIG.zoneInner);
  else if (roll < 0.75) r = randRange(rng, CONFIG.zoneOuter, CONFIG.fieldRadius - 150);
  else r = randRange(rng, CONFIG.zoneInner, CONFIG.zoneOuter);
  const a = rng() * TAU;
  return { x: Math.cos(a) * r, y: Math.sin(a) * r, r };
}

function updateCapsules(game, dt) {
  const F = game.fx2, sh = game.ship;
  if (isHyperScheme(game.scheme)) game.capsules = game.capsules.filter(c => c.src !== 'field' || Math.hypot(c.x - sh.x, c.y - sh.y) < game.viewRadius * 2);
  if (game.spawning) {
    F.capsuleT += dt;
    const field = game.capsules.filter((c) => c.src === 'field').length;
    const fieldCount = isHyperScheme(game.scheme) ? CONFIG.hyperCapsuleCount : CONFIG.capsuleCount;
    const fieldInterval = isHyperScheme(game.scheme) ? CONFIG.hyperCapsuleInterval : CONFIG.capsuleInterval;
    if (field < fieldCount && (game.t < 2 || F.capsuleT >= fieldInterval)) {
      F.capsuleT = 0;
      const p = fieldCapsulePoint(game);
      const mod = rollModule(game.rng, { t: game.t, loadout: game.loadout, source: 'capsule', danger: dangerAt(p.r), scheme: game.scheme });
      game.capsules.push({ kind: 'capsule', src: 'field', x: p.x, y: p.y, mod, age: 0 });
    }
    if (getPhase(game.t).cores) {
      F.coreT += dt;
      const cores = game.capsules.filter((c) => c.kind === 'core').length;
      if (cores < 3 && (!F.coresStarted || F.coreT >= 20)) {
        F.coreT = 0;
        const a = game.rng() * TAU;
        const r = randRange(game.rng, CONFIG.planetRadius + 250, CONFIG.zoneInner - 300);
        game.capsules.push({ kind: 'core', src: 'core', x: Math.cos(a) * r, y: Math.sin(a) * r, mod: rollModule(game.rng, { source: 'core', t: game.t, loadout: game.loadout }), age: 0 });
        if (!F.coresStarted || cores >= 2) F.coresStarted = true;
        game.events.push({ type: 'core' });
      }
    }
  }
  let taken = false;
  const pull = game.stats.pickupRadius * 1.6;
  for (const c of game.capsules) {
    c.age += dt;
    if (c.src === 'drop' || c.src === 'elite') {
      const dx = sh.x - c.x, dy = sh.y - c.y, d = Math.hypot(dx, dy);
      if (d < pull && d > 1) { const v = (600 + Math.hypot(sh.vx, sh.vy)) * dt; c.x += (dx / d) * Math.min(v, d); c.y += (dy / d) * Math.min(v, d); }
    }
    const reach = 22 + CONFIG.shipRadius + 14;
    if ((c.x - sh.x) ** 2 + (c.y - sh.y) ** 2 < reach * reach) {
      c.taken = true; taken = true;
      if (c.kind === 'core') {
        game.cores++;
        refreshStats(game);
        addText(game, sh.x, sh.y - 50, `出力 +${Math.round(CONFIG.coreBoost * 100)}%`, '#ffd24a');
      } else {
        game.offerQueue.push({ ...c.mod, source: c.src && c.src !== 'field' ? c.src : 'capsule' });
      }
      addRing(game, c.x, c.y, 120, c.kind === 'core' ? '#ffd24a' : '#9fe8ff', 0.5);
      game.events.push({ type: 'pickup', kind: c.kind, r: c.mod.r });
    }
    if ((c.src === 'elite' || c.src === 'drop') && c.age > 45) { c.taken = true; taken = true; }
  }
  if (taken) game.capsules = game.capsules.filter((c) => !c.taken);
}

function portalLoopCross(a, b, c, d) {
  const rx = b.x - a.x, ry = b.y - a.y, sx = d.x - c.x, sy = d.y - c.y;
  const cross = rx * sy - ry * sx;
  if (Math.abs(cross) < 1e-9) return null; // retracing a line encloses no area
  const dx = c.x - a.x, dy = c.y - a.y;
  const t = (dx * sy - dy * sx) / cross, u = (dx * ry - dy * rx) / cross;
  if (t <= 1e-6 || t > 1 + 1e-6 || u < -1e-6 || u > 1 + 1e-6) return null;
  return { x: a.x + rx * t, y: a.y + ry * t, t };
}

function portalLoopArea(points) {
  let twice = 0;
  for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
    twice += points[j].x * points[i].y - points[i].x * points[j].y;
  }
  return Math.abs(twice) / 2;
}

function portalLoopContains(points, x, y) {
  let inside = false;
  for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
    const a = points[j], b = points[i];
    const cross = (b.x - a.x) * (y - a.y) - (b.y - a.y) * (x - a.x);
    if (Math.abs(cross) < 1e-6 && x >= Math.min(a.x, b.x) && x <= Math.max(a.x, b.x)
      && y >= Math.min(a.y, b.y) && y <= Math.max(a.y, b.y)) return true;
    if ((a.y > y) !== (b.y > y) && x < (b.x - a.x) * (y - a.y) / (b.y - a.y) + a.x) inside = !inside;
  }
  return inside;
}

function portalLoopExplode(game, dash, points, area) {
  const effect = game.stats.loopBurst;
  const dmg = attackPower(dash.speed, game.stats) * effect.mult;
  const color = effect.splash ? '#ffb340' : '#c46bff';
  const center = points.reduce((c, p) => ({ x: c.x + p.x / points.length, y: c.y + p.y / points.length }), { x: 0, y: 0 });
  // Snapshot the enclosed targets: secondary blasts cannot recursively create more blasts.
  const targets = game.enemies.filter((e) => !e.dead && portalLoopContains(points, e.x, e.y));
  for (const e of targets) {
    const dx = e.x - center.x, dy = e.y - center.y, dist = Math.hypot(dx, dy) || 1;
    damageEnemy(game, e, dmg, { cause: 'portalLoop', dirX: dx / dist, dirY: dy / dist, knock: 500 });
    addRing(game, e.x, e.y, e.r + 28, color, 0.4);
    burst(game, e.x, e.y, color, 12, 0, 0, 360);
  }
  if (effect.splash) for (const e of targets) explode(game, e.x, e.y, CONFIG.portalLoopSplashRadius,
    dmg * CONFIG.portalLoopSplashDamage, { cause: 'portalLoopSplash', color, knock: 350, life: 0.4 });
  game.fx.loops.push({ points, color, life: 0.6, max: 0.6 });
  addText(game, center.x, center.y, `包囲炸裂 ${targets.length}`, color, 24);
  game.events.push({ type: 'explode', x: center.x, y: center.y, radius: Math.sqrt(area / Math.PI), cause: 'portalLoop', enclosed: targets.length });
}

// Test only traveled movement. Closing across an old segment works before reaching a portal.
function tracePortalLoop(game, dash, x0, y0, x1, y1) {
  if (!game.stats.loopBurst || dash.loopPath.length < 3) return;
  let start = { x: x0, y: y0 }, end = { x: x1, y: y1 };
  let attempts = dash.loopPath.length;
  while (attempts-- > 0) {
    const path = dash.loopPath;
    let first = null;
    for (let i = 0; i < path.length - 1; i++) {
      const hit = portalLoopCross(start, end, path[i], path[i + 1]);
      if (!hit || (first && hit.t >= first.hit.t)) continue;
      const points = [{ x: hit.x, y: hit.y }, ...path.slice(i + 1)];
      const area = portalLoopArea(points);
      if (area >= CONFIG.portalLoopMinArea) first = { hit, points, area, i };
    }
    if (!first) return;
    portalLoopExplode(game, dash, first.points, first.area);
    const hit = { x: first.hit.x, y: first.hit.y };
    // Consume the closed portion while retaining the earlier open prefix and the live tail.
    dash.loopPath = path.slice(0, first.i + 1);
    const last = dash.loopPath[dash.loopPath.length - 1];
    if (Math.hypot(last.x - hit.x, last.y - hit.y) > 1e-6) dash.loopPath.push(hit);
    start = hit;
  }
}

// ---- portals.js ----


function portalGrowth(game) {
  return game.stats.maxSpeed / CONFIG.baseMaxSpeed * game.stats.rangeMult * game.stats.gaugeMax;
}

function portalReach(game) {
  return CONFIG.portalReach * portalGrowth(game);
}

function portalClearLine(game, x, y, tx, ty) {
  return ![game.field.planet, ...game.field.moons].some((b) =>
    segCircleT(x, y, tx, ty, b.x, b.y, b.r + CONFIG.shipRadius) >= 0);
}

function portalNearby(game, x, y) {
  let best = null, dist = CONFIG.portalSpacing;
  for (const p of game.portals) {
    const d = Math.hypot(p.x - x, p.y - y);
    if (d < dist) { best = p; dist = d; }
  }
  return best;
}

function portalCreate(game, x, y, manual) {
  const p = { id: ++game.portalSerial, x, y, manual, uses: manual ? Infinity : CONFIG.portalDropUses, refillAt: game.t + CONFIG.portalRefillInterval };
  game.portals.push(p);
  addRing(game, x, y, 45, manual ? '#5fd8ff' : '#c995ff', 0.35);
  return p;
}

function placePortal(game) {
  if (game.scheme !== 'portal' || game.portalDash) return null;
  const sh = game.ship;
  if ([game.field.planet, ...game.field.moons].some((b) => Math.hypot(sh.x - b.x, sh.y - b.y) <= b.r + CONFIG.shipRadius + 4)) return null;
  const near = portalNearby(game, sh.x, sh.y);
  if (near?.manual) { addText(game, sh.x, sh.y - 45, '近くに設置済み', '#9fe8ff'); return null; }
  if (game.portals.filter((p) => p.manual).length >= CONFIG.portalManualMax) {
    addText(game, sh.x, sh.y - 45, '設置上限', '#9fe8ff'); return null;
  }
  // A dropped portal can become a permanent anchor without creating an overlapping node.
  if (near) { near.manual = true; near.uses = Infinity; addRing(game, near.x, near.y, 45, '#5fd8ff'); return near; }
  const created = portalCreate(game, sh.x, sh.y, true);
  game.portalTouch = created.id;
  return created;
}

// Check spacing before rolling for a drop. A crowd can replenish one node, not create a pile.
function dropPortal(game, x, y) {
  if (game.scheme !== 'portal' || CONFIG.portalDropChance <= 0) return;
  const near = portalNearby(game, x, y);
  if (near) {
    if (!near.manual && near.uses < CONFIG.portalDropUses && game.t >= near.refillAt) {
      near.uses++;
      near.refillAt = game.t + CONFIG.portalRefillInterval;
      addRing(game, near.x, near.y, 35, '#c995ff', 0.25);
    }
    return;
  }
  if (game.portals.filter((p) => !p.manual).length >= CONFIG.portalDropMax || game.rng() >= CONFIG.portalDropChance) return;
  if ([game.field.planet, ...game.field.moons].some((b) => Math.hypot(x - b.x, y - b.y) <= b.r + CONFIG.shipRadius + 4)) return;
  portalCreate(game, x, y, false);
}

function portalEdgeKey(a, b) {
  const pa = `${a.x},${a.y}`, pb = `${b.x},${b.y}`;
  return pa < pb ? `${pa}|${pb}` : `${pb}|${pa}`;
}

function portalEdgeUnavailable(game, a, b) {
  const key = portalEdgeKey(a, b);
  return game.portalDash?.usedEdges.has(key) || (game.portalCooldowns.get(key) ?? 0) > game.portalClock;
}

function portalAtShip(game) {
  return game.portals.find((p) => Math.hypot(p.x - game.ship.x, p.y - game.ship.y) < CONFIG.portalEntryRadius + CONFIG.shipRadius) ?? null;
}

function portalChoices(game, origin = game.portalDash?.phase === 'hop' ? game.portalDash.target : portalAtShip(game) || game.ship) {
  const reach = Math.min(portalReach(game), game.portalDash?.remaining ?? Infinity);
  const angle = (p) => (Math.atan2(p.y - origin.y, p.x - origin.x) + Math.PI * 2.5) % (Math.PI * 2);
  return game.portals.filter((p) => {
    const dist = Math.hypot(p.x - origin.x, p.y - origin.y);
    return dist >= CONFIG.portalMinHop && dist <= reach && portalClearLine(game, origin.x, origin.y, p.x, p.y)
      && !portalEdgeUnavailable(game, origin, p);
  }).sort((a, b) => angle(a) - angle(b)
    || Math.hypot(a.x - origin.x, a.y - origin.y) - Math.hypot(b.x - origin.x, b.y - origin.y)
    || a.id - b.id).map((p, i) => ({ key: String(i + 1), portal: p }));
}

function portalNearest(game) {
  if (game.portalDash) {
    const origin = game.portalDash.phase === 'hop' ? game.portalDash.target : game.ship;
    return portalChoices(game).map((c) => c.portal).sort((a, b) =>
      Math.hypot(a.x - origin.x, a.y - origin.y) - Math.hypot(b.x - origin.x, b.y - origin.y))[0] ?? null;
  }
  const sh = portalAtShip(game) || game.ship;
  let nearest = null, best = Math.min(portalReach(game), CONFIG.portalBudget * portalGrowth(game));
  for (const p of game.portals) {
    const dist = Math.hypot(p.x - sh.x, p.y - sh.y);
    if (dist < CONFIG.portalEntryRadius + CONFIG.shipRadius || dist > best
      || !portalClearLine(game, sh.x, sh.y, p.x, p.y) || portalEdgeUnavailable(game, sh, p)) continue;
    nearest = p; best = dist;
  }
  return nearest;
}

function portalDefaultNext(game) {
  const d = game.portalDash;
  const origin = d?.phase === 'hop' ? d.target : game.ship;
  let best = null, score = Infinity;
  for (const { portal: p } of portalChoices(game)) {
    const dx = p.x - origin.x, dy = p.y - origin.y, dist = Math.hypot(dx, dy);
    const alignment = (dx * game.ship.hx + dy * game.ship.hy) / dist;
    const penalty = (p.id === d?.previous ? 4 : 0) + (d?.visited.has(p.id) ? 2 : 0);
    const s = (penalty + 1 - alignment) * portalReach(game) + dist * 0.25;
    if (s < score) { best = p; score = s; }
  }
  return best;
}

function startPortalDash(game, entry = null, initialTarget = null) {
  if (!initialTarget && !portalChoices(game, entry || game.ship).length) return false;
  const budget = CONFIG.portalBudget * portalGrowth(game);
  if (entry) { game.ship.x = entry.x; game.ship.y = entry.y; }
  game.portalDash = { phase: 'choose', remaining: budget, budget, usedEdges: new Set(),
    hops: 0, next: null, explicitNext: false, currentPortal: entry?.id ?? null, previous: null,
    visited: new Set(entry ? [entry.id] : []), path: [{ x: game.ship.x, y: game.ship.y }],
    loopPath: [{ x: game.ship.x, y: game.ship.y }], departOnArrival: false };
  game.ship.charging = false;
  onLaunch(game);
  game.ship.boostT = game.stats.boostDuration;
  game.portalDash.next = initialTarget || portalDefaultNext(game);
  game.portalPreview = game.portalDash.next;
  return true;
}

// Sweep the movement segment so fast entries are detected even between physics ticks.
function checkPortalEntry(game, x0, y0) {
  if (game.scheme !== 'portal' || game.portalDash || game.portalSpace.consumed) return;
  const sh = game.ship, R = CONFIG.portalEntryRadius + CONFIG.shipRadius;
  const previousTouch = game.portalTouch;
  game.portalTouch = game.portals.find((p) => Math.hypot(p.x - sh.x, p.y - sh.y) < R)?.id ?? null;
  if (game.t < game.portalEntryT) return;
  let entry = null, first = Infinity;
  for (const p of game.portals) {
    if (p.id === previousTouch) continue;
    const t = segCircleT(x0, y0, sh.x, sh.y, p.x, p.y, R);
    if (t >= 0 && t < first) { entry = p; first = t; }
  }
  if (entry) startPortalDash(game, entry);
}

function stopPortalDash(game, message = '') {
  game.portalDash = null;
  game.portalPreview = null;
  game.portalEntryT = game.t + CONFIG.portalEntryCooldown;
  game.ship.boostT = game.stats.boostDuration;
  if (message) addText(game, game.ship.x, game.ship.y - 48, message, '#e8f6ff');
}

function portalLeave(game, direction) {
  const sh = game.ship, len = Math.hypot(direction.x, direction.y);
  stopPortalDash(game, 'ポータル離脱');
  game.portalPreview = null;
  sh.hx = direction.x / len; sh.hy = direction.y / len;
  const speed = game.stats.maxSpeed * CONFIG.steerCruise;
  sh.vx = sh.hx * speed; sh.vy = sh.hy * speed;
  sh.boostT = 0; sh.fadeT = 0;
}

function handlePortalInput(game, input, realDt = 0) {
  if (game.scheme !== 'portal') return;
  const press = game.portalSpace;
  if (input.portalPressed) { press.armed = true; press.seconds = 0; press.consumed = false; }
  if (press.armed && input.portalHolding) press.seconds += realDt;
  if (press.armed && input.portalHeldTime !== undefined) press.seconds = Math.max(press.seconds, input.portalHeldTime);
  if (press.armed && !press.consumed && press.seconds >= CONFIG.portalExitHold) {
    press.consumed = true;
    if (game.portalDash) portalLeave(game, input.move?.x || input.move?.y ? input.move : { x: game.ship.hx, y: game.ship.hy });
  }
  const confirm = !!input.portalReleased && press.armed && !press.consumed;
  if (input.portalReleased || (!input.portalHolding && !input.portalPressed)) {
    press.armed = false; press.seconds = 0; press.consumed = false;
  }
  if (!game.portalDash) {
    if (input.place) placePortal(game);
    const nearest = portalNearest(game);
    game.portalPreview = nearest;
    if (confirm) {
      const entry = portalAtShip(game);
      if (nearest && startPortalDash(game, entry, nearest)) portalBeginHop(game, nearest, CONFIG.portalEntryRadius + CONFIG.shipRadius);
      else addText(game, game.ship.x, game.ship.y - 45, '到達できるポータルが必要', '#9fe8ff');
    }
    return;
  }
  const d = game.portalDash;
  portalRefreshNext(game);
  if (!game.portalDash) return;
  if (input.portalCycle) {
    const choices = portalChoices(game);
    if (choices.length) {
      const current = Math.max(0, choices.findIndex((c) => c.portal === d.next));
      const index = ((current + input.portalCycle) % choices.length + choices.length) % choices.length;
      d.next = choices[index].portal; d.explicitNext = true;
    }
  }
  game.portalPreview = d.next;
  if (confirm && d.next) {
    if (d.phase === 'choose') portalBeginHop(game, d.next);
    else d.departOnArrival = true;
  }
}

function portalBeginHop(game, target, minDistance = CONFIG.portalMinHop) {
  const d = game.portalDash, sh = game.ship;
  if (!target || !game.portals.includes(target)) return false;
  const len = Math.hypot(target.x - sh.x, target.y - sh.y);
  if (len < minDistance || len > Math.min(portalReach(game), d.remaining)
    || !portalClearLine(game, sh.x, sh.y, target.x, target.y)
    || portalEdgeUnavailable(game, sh, target)) return false;
  d.edgeKey = portalEdgeKey(sh, target);
  d.usedEdges.add(d.edgeKey);
  game.portalCooldowns.set(d.edgeKey, game.portalClock + CONFIG.portalEdgeCooldown);
  d.previous = d.currentPortal;
  d.currentPortal = target.id;
  d.visited.add(target.id);
  d.explicitNext = false;
  d.departOnArrival = false;
  const dx = (target.x - sh.x) / len, dy = (target.y - sh.y) / len;
  const v = launchVelocity(sh.vx, sh.vy, dx, dy, game.stats.gaugeMax, game.stats);
  const speed = Math.max(1, Math.hypot(v.vx, v.vy));
  d.remaining = Math.max(0, d.remaining - len);
  d.phase = 'hop'; d.target = target; d.left = len; d.dx = dx; d.dy = dy;
  d.speed = speed; d.rate = Math.max(speed, len * game.stats.traceSpeedMult / CONFIG.portalHopTime);
  d.inside = new Map(); d.passes = new Map(); d.waveInside = new Map(); d.waveAcc = 0; d.trailAcc = 0;
  sh.vx = dx * speed; sh.vy = dy * speed; sh.hx = dx; sh.hy = dy;
  sh.boostT = game.stats.boostDuration; sh.fadeT = 0; sh.gaugeBank = 0;
  d.next = portalDefaultNext(game);
  game.portalPreview = d.next;
  game.dashId++;
  game.events.push({ type: 'launch', gauge: game.stats.gaugeMax, x: sh.x, y: sh.y, dx, dy });
  return true;
}

function portalRefreshNext(game) {
  const d = game.portalDash;
  if (!d) return;
  if (!portalChoices(game).some((c) => c.portal === d.next)) {
    d.next = portalDefaultNext(game);
    d.explicitNext = false;
  }
  game.portalPreview = d.next;
  if (d.phase === 'choose' && !d.next) {
    if (game.portalSpace.armed) game.portalSpace.consumed = true;
    portalLeave(game, { x: game.ship.hx, y: game.ship.hy });
  }
}

function portalWorldScale(game) {
  const d = game.portalDash;
  if (!d) return 1;
  return d.phase === 'choose' ? CONFIG.portalChooseScale
    : Math.max(CONFIG.dashScaleMin, Math.min(1, CONFIG.dashSlowRef / Math.max(1, d.speed)));
}

function updatePortals(game, realDt) {
  const d = game.portalDash;
  if (!d) return;
  if (d.phase === 'choose') { portalRefreshNext(game); return; }
  const sh = game.ship;
  let travel = Math.min(d.left, d.rate * realDt);
  // Small swept steps keep body hits, wave hits, obstacles and trail explosions in travel order.
  while (travel > 1e-6) {
    const stepDist = Math.min(20, travel), x0 = sh.x, y0 = sh.y;
    const x1 = x0 + d.dx * stepDist, y1 = y0 + d.dy * stepDist;
    if (!portalClearLine(game, x0, y0, x1, y1)) {
      damageShip(game, Math.max(0, d.speed - 200) * CONFIG.crashDamage, 0, 'portalCrash');
      sh.vx *= -0.4; sh.vy *= -0.4;
      game.events.push({ type: 'bounce', x: x0, y: y0 });
      stopPortalDash(game, '障害物に衝突'); return;
    }
    for (const [id, e] of d.inside) {
      if (e.dead || Math.hypot(x0 - e.x, y0 - e.y) > e.r + CONFIG.shipRadius + 2) d.inside.delete(id);
    }
    sh.x = x1; sh.y = y1;
    sh.vx = d.dx * d.speed; sh.vy = d.dy * d.speed;
    waveAlong(game, d, x0, y0, x1, y1);
    if (game.state === 'finishing') return;
    if (collideEnemies(game, x0, y0, CONFIG.shipRadius, d)) { stopPortalDash(game, '弾かれた'); return; }
    if (game.state === 'finishing') return;
    d.speed = Math.hypot(sh.vx, sh.vy);
    tracePortalLoop(game, d, x0, y0, sh.x, sh.y);
    d.trailAcc += stepDist;
    if (game.stats.trailBurst && d.trailAcc >= 45) {
      d.trailAcc = 0;
      game.marks.push({ x: x1, y: y1, t: 0.55, dmg: attackPower(d.speed, game.stats) * game.stats.trailBurst });
    }
    sh.trail.push({ x: sh.x, y: sh.y });
    if (sh.trail.length > 150) sh.trail.shift();
    travel -= stepDist; d.left -= stepDist;
    game.dashPeakAtk = Math.max(game.dashPeakAtk, attackPower(d.speed, game.stats));
    if (sh.hp <= 0) { stopPortalDash(game); return; }
  }
  if (d.left > 1e-6) return;
  sh.x = d.target.x; sh.y = d.target.y;
  game.portalCooldowns.set(d.edgeKey, game.portalClock + CONFIG.portalEdgeCooldown);
  d.path.push({ x: sh.x, y: sh.y });
  const loopEnd = d.loopPath[d.loopPath.length - 1];
  if (Math.hypot(loopEnd.x - sh.x, loopEnd.y - sh.y) > 1e-6) d.loopPath.push({ x: sh.x, y: sh.y });
  game.portalTouch = d.target.id;
  if (!d.target.manual) {
    d.target.uses--;
    d.target.refillAt = game.t + CONFIG.portalRefillInterval;
    if (d.target.uses <= 0) game.portals = game.portals.filter((p) => p !== d.target);
  }
  d.hops++;
  d.phase = 'choose';
  const wave = game.stats.portalWave;
  if (wave) explode(game, sh.x, sh.y, CONFIG.portalWaveRadius * game.stats.waveRadiusMult,
    attackPower(d.speed, game.stats) * CONFIG.portalWaveDamage * wave * game.stats.waveDmgMult,
    { cause: 'portalWave', color: '#c995ff', knock: 500, life: 0.45 });
  else addRing(game, sh.x, sh.y, 48, '#9fe8ff', 0.25);
  // Include routes opened by kills while retaining an explicit choice made in flight.
  portalRefreshNext(game);
  if (!game.portalDash) return;
  if (d.departOnArrival && d.next) portalBeginHop(game, d.next);
  else d.departOnArrival = false;
}

// ---- hits.js ----
// Damage, kills, drops and area attacks applied to enemies.









function damageEnemy(game, e, dmg, opts = {}) {
  if (e.dead || game.state === 'finishing' || dmg <= 0) return;
  let fresh = e.hp >= e.maxHp - 1e-6;
  // during a jump, the wave reaches an enemy just before the body does: judge "one-shot"
  // by its HP when this jump first touched it, so wave + body still count as one strike
  if (game.jump || game.portalDash) {
